name: MHUR V635 - Navigation instantanée

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v635-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v635-instant-navigation
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Appliquer V635
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v635.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          
          index_path=public/"index.html"
          css_path=public/"css"/"v635-instant-navigation.css"
          js_path=public/"js"/"v635-instant-navigation.js"
          report_path=root/"RAPPORT_V635_NAVIGATION_INSTANTANEE.txt"
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          v633c_path=public/"js"/"v633c-final-first-frame.js"
          
          if not v633c_path.is_file():
              raise SystemExit(
                  "[ERREUR] V633C n'est pas encore appliqué. "
                  "Le fichier public/js/v633c-final-first-frame.js est absent."
              )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          patterns=[
              r'\s*<!-- V635 : navigation instantanée CSS\. -->\s*'
              r'<link[^>]+v635-instant-navigation\.css[^>]*>\s*',
              r'\s*<link[^>]+v635-instant-navigation\.css[^>]*>\s*',
          
              r'\s*<!-- V635 : navigation instantanée JS\. -->\s*'
              r'<script[^>]+v635-instant-navigation\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v635-instant-navigation\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(pattern,"\n",html,flags=re.I)
          
          css_tag=(
              '<!-- V635 : navigation instantanée CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v635-instant-navigation.css?v=635">\n'
          )
          
          js_tag=(
              '<!-- V635 : navigation instantanée JS. -->\n'
              '<script src="js/v635-instant-navigation.js?v=635">'
              '</script>\n'
          )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          if not bodies:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          head_position=heads[-1].start()
          html=html[:head_position]+css_tag+html[head_position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          body_position=bodies[-1].start()
          html=html[:body_position]+js_tag+html[body_position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V635
          
          CORRECTION
          - Suppression du masquage de #app pendant les changements de page.
          - Suppression visuelle de l'attente ROUTE_MAX de V633C.
          - La nouvelle page est visible dès que le routeur la crée.
          - Les images passent immédiatement en eager et priorité élevée.
          - Le décodage des images se fait en arrière-plan, sans bloquer l'écran.
          
          CONSERVÉ
          - Protection du tout premier chargement V633C.
          - Aucun Service Worker.
          - Aucun rechargement automatique.
          - Aucun changement des costumes, Tier List, builds ou Notes.
          """,
              encoding="utf-8"
          )
          
          print("[OK] V635 appliqué.")
          PY
          
          cat > /tmp/verifier_v635.py <<'PY'
          from pathlib import Path
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          css=Path(
              "public/css/v635-instant-navigation.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v635-instant-navigation.js"
          ).read_text(encoding="utf-8")
          
          for reference in [
              "css/v635-instant-navigation.css?v=635",
              "js/v635-instant-navigation.js?v=635",
          ]:
              if index.count(reference)!=1:
                  raise SystemExit(
                      f"[ERREUR] Référence V635 absente ou dupliquée : {reference}"
                  )
          
          for token in [
              "html.mhurV633CRoutePreparing #app",
              "visibility:visible!important",
              "transition:none!important",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V635 incomplet : {token}"
                  )
          
          for token in [
              "revealRouteImmediately",
              "mhurV633CRoutePreparing",
              "prioritizeImages",
              "MHUR_V635_INSTANT_NAV",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS V635 incomplet : {token}"
                  )
          
          if "serviceWorker.register" in js:
              raise SystemExit(
                  "[ERREUR] V635 ne doit enregistrer aucun Service Worker."
              )
          
          print("[OK] Vérification V635 réussie.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v635.py
            node --check public/js/v635-instant-navigation.js
            python3 /tmp/verifier_v635.py
          
            git add     public/index.html     public/css/v635-instant-navigation.css     public/js/v635-instant-navigation.js     RAPPORT_V635_NAVIGATION_INSTANTANEE.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V635 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "perf: navigation instantanée V635"
          
            if git push origin HEAD:main; then
              echo "[OK] V635 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V635 après cinq tentatives."
          exit 1
