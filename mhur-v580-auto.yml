name: MHUR V580 - correction automatique des NEW

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v580-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v580-automatique
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Appliquer et verifier V580
        shell: bash
        run: |
          cat > /tmp/mhur_v580.py <<'PY'
          from __future__ import annotations

          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import json
          import re
          import subprocess

          ROOT = Path.cwd()
          INDEX = ROOT / "public" / "index.html"
          FIXES_JS = ROOT / "public" / "js" / "season18-fixes.js"
          FIXES_CSS = ROOT / "public" / "css" / "season18-fixes.css"
          EARLY_JS = ROOT / "public" / "js" / "season18-early.js"
          SYNC_JS = ROOT / "public" / "data" / "season18_sync.js"
          REPORT = ROOT / "RAPPORT_V580_AUTOMATIQUE.txt"

          FILES = [INDEX, FIXES_JS, FIXES_CSS, EARLY_JS, SYNC_JS]

          JS_MARKER = "/* MHUR Nexus — V580 : NEW automatiques fiables */"
          CSS_MARKER = "/* MHUR Nexus — V580 : affichage final des NEW et INCOMING */"

          def die(message: str) -> None:
              raise RuntimeError(message)

          def read(path: Path) -> str:
              if not path.is_file():
                  die(f"Fichier introuvable : {path.as_posix()}")
              return path.read_text(encoding="utf-8-sig")

          def write(path: Path, text: str) -> None:
              path.write_text(text.rstrip() + "\n", encoding="utf-8")

          def remove_tail_blocks(source: str, markers: list[str]) -> str:
              positions = [source.find(marker) for marker in markers if marker in source]
              if positions:
                  source = source[:min(positions)]
              return source.rstrip() + "\n"

          def parse_sync() -> dict:
              raw = read(SYNC_JS)
              match = re.fullmatch(
                  r"\s*window\.MHUR_SEASON18_DATA\s*=\s*(\{[\s\S]*\})\s*;?\s*",
                  raw,
              )
              if not match:
                  die("Impossible de lire season18_sync.js.")
              return json.loads(match.group(1))

          def day_of(value) -> str:
              match = re.match(r"^(\d{4}-\d{2}-\d{2})", str(value or ""))
              return match.group(1) if match else ""

          def latest_release(data: dict) -> tuple[str, list[tuple[str, dict]]]:
              today_jst = (datetime.now(timezone.utc) + timedelta(hours=9)).date().isoformat()

              released: list[tuple[str, dict]] = []
              for costume_id, row in (data.get("costumes") or {}).items():
                  row = row or {}
                  day = day_of(row.get("releaseDate") or row.get("release_date"))
                  if day and day <= today_jst and not bool(row.get("upcoming")):
                      released.append((str(costume_id), row))

              if not released:
                  die("Aucun costume déjà sorti n'a été trouvé.")

              latest_day = max(
                  day_of(row.get("releaseDate") or row.get("release_date"))
                  for _, row in released
              )

              latest_rows = [
                  (costume_id, row)
                  for costume_id, row in released
                  if day_of(row.get("releaseDate") or row.get("release_date")) == latest_day
              ]

              return latest_day, latest_rows

          def patch_data() -> tuple[str, list[tuple[str, dict]]]:
              data = parse_sync()
              latest_day, latest_rows = latest_release(data)
              latest_ids = [costume_id for costume_id, _ in latest_rows]

              for key in ("active_new_content", "new_content"):
                  section = data.setdefault(key, {})
                  section["characters"] = ["gentle_criminal"]
                  section["styles"] = ["gentle_criminal_technical"]
                  section["costumes"] = list(dict.fromkeys(latest_ids + ["108000000"]))

              write(
                  SYNC_JS,
                  "window.MHUR_SEASON18_DATA = "
                  + json.dumps(data, ensure_ascii=False, separators=(",", ":"))
                  + ";",
              )

              return latest_day, latest_rows

          def replace_planned_badge(source: str, key: str, badge_html: str) -> str:
              lines = source.splitlines()
              found = False

              for index, line in enumerate(lines):
                  if f'data-planned="{key}"' not in line:
                      continue

                  found = True
                  line = re.sub(
                      r'<span\b[^>]*class=["\'][^"\']*'
                      r'(?:s18PlannedNew|s18PlannedIncoming|s18SeasonNew)'
                      r'[^"\']*["\'][^>]*>[\s\S]*?</span>',
                      "",
                      line,
                      flags=re.I,
                  )

                  anchor = re.search(
                      r'<span\b[^>]*class=["\'][^"\']*s18PlannedTextV12[^"\']*["\'][^>]*>',
                      line,
                      flags=re.I,
                  )
                  if not anchor:
                      die(f"Zone texte introuvable pour la carte {key}.")

                  line = line[:anchor.start()] + badge_html + line[anchor.start():]
                  lines[index] = line
                  break

              if not found:
                  die(f"Carte d'accueil {key} introuvable.")

              return "\n".join(lines) + "\n"

          def patch_early() -> None:
              source = read(EARLY_JS)

              source = replace_planned_badge(
                  source,
                  "gentle",
                  '<span class="s18PlannedNewV12"></span>',
              )
              source = replace_planned_badge(
                  source,
                  "twice",
                  '<span class="s18PlannedIncomingV580">INCOMING</span>',
              )
              source = replace_planned_badge(
                  source,
                  "tsuyu",
                  '<span class="s18PlannedIncomingV580">INCOMING</span>',
              )

              if source.count("s18PlannedIncomingV580") != 2:
                  die("La vérification des deux INCOMING a échoué.")

              write(EARLY_JS, source)

          JS_BLOCK = r'''
          /* MHUR Nexus — V580 : NEW automatiques fiables */
          (function(){
            'use strict';

            const BADGE =
              '<span class="s18NewBadge s18NewBadgeV9 s18NewBadgeV24 s18NewBadgeV580" aria-label="NEW">' +
                '<span class="s18NewPulseInnerV580">NEW!</span>' +
              '</span>';

            const GENTLE_CHARACTER = 'gentle_criminal';
            const GENTLE_STYLE = 'gentle_criminal_technical';
            const GENTLE_ORIGINAL = '108000000';

            function releaseDay(value){
              const match = String(value || '').match(/^(\d{4}-\d{2}-\d{2})/);
              return match ? match[1] : '';
            }

            function todayJst(){
              const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Tokyo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
              }).formatToParts(new Date());

              const get = type => parts.find(part => part.type === type)?.value || '';
              return get('year') + '-' + get('month') + '-' + get('day');
            }

            function latestRows(){
              const sync = window.MHUR_SEASON18_DATA || {};
              const today = todayJst();

              const rows = Object.entries(sync.costumes || {}).map(([id, row]) => ({
                id: String(id),
                row: row || {},
                day: releaseDay(row?.releaseDate || row?.release_date)
              })).filter(item =>
                item.day &&
                item.day <= today &&
                !item.row.upcoming
              );

              if(!rows.length) return [];

              const latestDay = rows.map(item => item.day).sort().at(-1);
              return rows.filter(item => item.day === latestDay);
            }

            function newSets(){
              const sync = window.MHUR_SEASON18_DATA || {};
              const source = sync.active_new_content || sync.new_content || {};
              const recent = latestRows();

              return {
                characters: new Set([
                  ...(source.characters || []).map(String),
                  GENTLE_CHARACTER
                ]),
                styles: new Set([
                  ...(source.styles || []).map(String),
                  GENTLE_STYLE
                ]),
                costumes: new Set([
                  ...recent.map(item => item.id),
                  ...(source.costumes || []).map(String),
                  GENTLE_ORIGINAL
                ]),
                recent
              };
            }

            function normalize(value){
              return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
            }

            function digitIds(value){
              return [...String(value || '').matchAll(/(?:ur[_-]?)?(\d{5,})/gi)]
                .map(match => match[1]);
            }

            function valuesFromCard(card){
              const values = [
                card?.dataset?.costume,
                card?.dataset?.costumeId,
                card?.dataset?.id,
                card?.id,
                card?.getAttribute?.('data-costume'),
                card?.getAttribute?.('data-costume-id'),
                card?.getAttribute?.('data-id'),
                card?.getAttribute?.('onclick'),
                card?.getAttribute?.('href'),
                card?.getAttribute?.('style')
              ];

              card?.querySelectorAll?.('*')?.forEach(node => {
                for(const attr of [
                  'src', 'href', 'data-costume', 'data-costume-id',
                  'data-id', 'id', 'onclick', 'style'
                ]){
                  values.push(node.getAttribute?.(attr));
                }
              });

              return values;
            }

            function idFromAttributes(card, validIds){
              for(const value of valuesFromCard(card)){
                for(const id of digitIds(value)){
                  if(validIds.has(id)) return id;
                }
              }
              return '';
            }

            function labelsFor(row){
              const groups = [
                normalize(row?.group_fr || row?.name_fr),
                normalize(row?.group_en || row?.name_en)
              ].filter(Boolean);

              const variants = [
                normalize(row?.variant_fr),
                normalize(row?.variant_en)
              ].filter(Boolean);

              const labels = new Set();

              for(const group of groups){
                labels.add(group);
                for(const variant of variants){
                  labels.add((group + ' ' + variant).trim());
                }
              }

              return [...labels].sort((a, b) => b.length - a.length);
            }

            function cardText(card){
              const values = [
                card?.textContent,
                card?.getAttribute?.('aria-label'),
                card?.getAttribute?.('title')
              ];

              card?.querySelectorAll?.('[alt],[title],[aria-label],img[src],a[href]')
                ?.forEach(node => {
                  values.push(
                    node.getAttribute('alt'),
                    node.getAttribute('title'),
                    node.getAttribute('aria-label'),
                    node.getAttribute('src'),
                    node.getAttribute('href')
                  );
                });

              return normalize(values.filter(Boolean).join(' '));
            }

            function idFromText(card, rows){
              const text = cardText(card);
              if(!text) return '';

              const matches = [];

              for(const item of rows){
                const label = labelsFor(item.row)
                  .find(candidate => candidate.length >= 4 && text.includes(candidate));

                if(label){
                  matches.push({id: item.id, length: label.length});
                }
              }

              matches.sort((a, b) => b.length - a.length);

              if(!matches.length) return '';
              if(matches.length > 1 && matches[0].length === matches[1].length) return '';
              return matches[0].id;
            }

            function directBadges(node){
              try{
                return [...node.querySelectorAll(':scope > .s18NewBadge')];
              }catch(_error){
                return [...(node.children || [])]
                  .filter(child => child.classList?.contains('s18NewBadge'));
              }
            }

            function startPulse(badge){
              if(!badge || badge.__mhurV580Pulse) return;

              badge.__mhurV580Pulse = true;
              const inner = badge.querySelector('.s18NewPulseInnerV580') || badge;

              if(typeof inner.animate === 'function'){
                inner.animate(
                  [
                    {transform: 'scale(.92)'},
                    {transform: 'scale(1.12)'},
                    {transform: 'scale(.92)'}
                  ],
                  {
                    duration: 950,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                  }
                );
              }
            }

            function setBadge(node, active){
              if(!node) return;

              const badges = directBadges(node);
              let badge = badges.find(item => item.classList.contains('s18NewBadgeV580'));

              if(!active){
                badges.forEach(item => item.remove());
                return;
              }

              badges.forEach(item => {
                if(item !== badge) item.remove();
              });

              if(!badge){
                node.insertAdjacentHTML('afterbegin', BADGE);
                badge = directBadges(node)
                  .find(item => item.classList.contains('s18NewBadgeV580'));
              }

              startPulse(badge);
            }

            function sync(){
              const sets = newSets();

              document.querySelectorAll('.card[data-char]').forEach(card => {
                setBadge(
                  card,
                  sets.characters.has(String(card.dataset.char || ''))
                );
              });

              document.querySelectorAll('.styleCard[data-style]').forEach(card => {
                setBadge(
                  card,
                  sets.styles.has(String(card.dataset.style || ''))
                );
              });

              const syncData = window.MHUR_SEASON18_DATA || {};
              const validIds = new Set([
                ...Object.keys(syncData.costumes || {}).map(String),
                ...sets.costumes
              ]);

              document.querySelectorAll(
                '.costumeTile,.costumeCard,.costumeResult,[data-costume],[data-costume-id]'
              ).forEach(card => {
                let id = idFromAttributes(card, validIds);

                if(!id){
                  id = idFromText(card, sets.recent);
                }

                if(id){
                  card.dataset.costume = id;
                }

                const upcoming = Boolean(
                  card.closest(
                    '.s18UpcomingCostumeGroupV19,.s18UpcomingCostumeGroupV23'
                  )
                );

                setBadge(
                  card,
                  Boolean(id && sets.costumes.has(id) && !upcoming)
                );
              });
            }

            let queued = false;

            function schedule(){
              if(queued) return;
              queued = true;

              queueMicrotask(() => {
                requestAnimationFrame(() => {
                  queued = false;
                  sync();
                });
              });
            }

            function wrapRender(){
              if(typeof window.render !== 'function' || window.render.__mhurV580) return;

              const original = window.render;

              const wrapped = function(){
                const result = original.apply(this, arguments);
                sync();
                schedule();
                return result;
              };

              wrapped.__mhurV580 = true;
              window.render = wrapped;

              try{
                render = wrapped;
              }catch(_error){}
            }

            wrapRender();

            if(document.readyState === 'loading'){
              document.addEventListener('DOMContentLoaded', () => {
                wrapRender();
                sync();
                schedule();
              }, {once: true});
            }else{
              sync();
              schedule();
            }

            new MutationObserver(mutations => {
              if(mutations.some(mutation => mutation.addedNodes?.length)){
                schedule();
              }
            }).observe(document.documentElement, {
              childList: true,
              subtree: true
            });

            window.addEventListener('load', () => {
              wrapRender();
              sync();
              schedule();
            }, {once: true});

            window.addEventListener('hashchange', schedule);
            window.addEventListener('mhur:languagechange', schedule);

            window.MHUR_V580_NEW = {
              refresh: sync,
              latestRows
            };
          })();
          '''

          CSS_BLOCK = r'''
          /* MHUR Nexus — V580 : affichage final des NEW et INCOMING */
          .s18NewBadgeV580{
            animation:none!important;
            overflow:visible!important;
          }

          .s18NewPulseInnerV580{
            display:flex!important;
            align-items:center!important;
            justify-content:center!important;
            width:100%!important;
            height:100%!important;
            transform-origin:center!important;
            will-change:transform!important;
          }

          /* Personnages et T.U.N.I.N.G : NEW en haut à droite. */
          .card[data-char] > .s18NewBadgeV580,
          .styleCard[data-style] > .s18NewBadgeV580{
            display:block!important;
            visibility:visible!important;
            opacity:1!important;
            top:7px!important;
            right:7px!important;
            left:auto!important;
            width:88px!important;
            height:44px!important;
            transform:none!important;
            transform-origin:center!important;
            z-index:90!important;
          }

          /* Costumes : badge plus petit et placé sous les étoiles. */
          .costumeTile > .s18NewBadgeV580,
          .costumeCard > .s18NewBadgeV580,
          .costumeResult > .s18NewBadgeV580,
          [data-costume] > .s18NewBadgeV580,
          [data-costume-id] > .s18NewBadgeV580{
            display:block!important;
            visibility:visible!important;
            opacity:1!important;
            top:38px!important;
            right:8px!important;
            left:auto!important;
            width:60px!important;
            height:31px!important;
            transform:none!important;
            transform-origin:center!important;
            z-index:90!important;
          }

          /* Les étoiles restent au-dessus du badge costume. */
          .costumeTile > .costumeTileStars,
          .costumeCard > .costumeTileStars,
          .costumeResult > .costumeTileStars{
            top:7px!important;
            right:8px!important;
            z-index:91!important;
          }

          /* INCOMING plus grand sur Twice et Tsuyu. */
          .s18PlannedIncomingV580{
            position:absolute!important;
            z-index:7!important;
            top:9px!important;
            right:10px!important;
            min-width:172px!important;
            width:auto!important;
            height:58px!important;
            padding:0 19px!important;
            display:inline-flex!important;
            align-items:center!important;
            justify-content:center!important;
            border:0!important;
            background:transparent!important;
            color:#fff!important;
            font-family:Impact,Haettenschweiler,'Arial Black',sans-serif!important;
            font-size:24px!important;
            font-style:italic!important;
            line-height:1!important;
            letter-spacing:.7px!important;
            white-space:nowrap!important;
            text-shadow:
              -2px -2px 0 #ff2f92,
               2px -2px 0 #ff2f92,
              -2px  2px 0 #ff2f92,
               2px  2px 0 #ff2f92,
               3px  3px 0 #000!important;
            filter:drop-shadow(0 4px 0 rgba(0,0,0,.72))!important;
            animation:mhurIncomingPulseV580 1.05s ease-in-out infinite!important;
            transform-origin:top right!important;
          }

          @keyframes mhurIncomingPulseV580{
            0%,100%{transform:scale(.96)}
            50%{transform:scale(1.07)}
          }

          /* Gentle est le seul NEW conservé dans les sorties prévues de l'accueil. */
          .s18PlannedCardV12[data-planned="twice"] .s18PlannedNewV12,
          .s18PlannedCardV12[data-planned="tsuyu"] .s18PlannedNewV12{
            display:none!important;
            visibility:hidden!important;
          }

          /* Réductions de points : texte moins gras. */
          .discountGridV296 .discountCardV296 > b,
          .discountGridV296 .s18DiscountCardV19 > b,
          .discountGridV296 .v559DiscountName{
            font-family:Arial,Helvetica,sans-serif!important;
            font-weight:600!important;
            letter-spacing:0!important;
          }

          .discountGridV296 .discountCardV296 > span,
          .discountGridV296 .s18DiscountCardV19 > span,
          .discountGridV296 .v559DiscountPoints,
          .discountGridV296 .v559RoleBadge{
            font-family:Arial,Helvetica,sans-serif!important;
            font-weight:600!important;
            letter-spacing:0!important;
          }

          @media(max-width:700px){
            .card[data-char] > .s18NewBadgeV580,
            .styleCard[data-style] > .s18NewBadgeV580{
              width:76px!important;
              height:38px!important;
            }

            .costumeTile > .s18NewBadgeV580,
            .costumeCard > .s18NewBadgeV580,
            .costumeResult > .s18NewBadgeV580,
            [data-costume] > .s18NewBadgeV580,
            [data-costume-id] > .s18NewBadgeV580{
              top:34px!important;
              right:7px!important;
              width:54px!important;
              height:28px!important;
            }

            .s18PlannedIncomingV580{
              min-width:148px!important;
              height:50px!important;
              padding:0 14px!important;
              font-size:20px!important;
            }
          }
          '''

          def patch_fixes_js() -> None:
              source = read(FIXES_JS)
              source = remove_tail_blocks(
                  source,
                  [
                      "/* MHUR Nexus — V577 : NEW source propre */",
                      "/* MHUR Nexus — V578 : NEW source propre */",
                      "/* MHUR Nexus — V579 : animation immédiate et vague complète */",
                      JS_MARKER,
                  ],
              )
              write(FIXES_JS, source + "\n" + JS_BLOCK)

          def patch_fixes_css() -> None:
              source = read(FIXES_CSS)
              source = remove_tail_blocks(
                  source,
                  [
                      "/* MHUR Nexus — V577 : position et animation finales */",
                      "/* MHUR Nexus — V578 : position et animation finales */",
                      "/* MHUR Nexus — V579 : NEW animés et INCOMING agrandis */",
                      CSS_MARKER,
                  ],
              )
              write(FIXES_CSS, source + "\n" + CSS_BLOCK)

          def update_query(html: str, resource: str) -> str:
              pattern = re.compile(
                  rf'(["\']){re.escape(resource)}(?:\?[^"\']*)?\1',
                  flags=re.I,
              )

              if not pattern.search(html):
                  die(f"Référence introuvable dans index.html : {resource}")

              return pattern.sub(f'"{resource}?v=580"', html)

          def patch_index() -> None:
              html = read(INDEX)

              for resource in (
                  "css/season18-fixes.css",
                  "data/season18_sync.js",
                  "js/season18-early.js",
                  "js/season18-fixes.js",
              ):
                  html = update_query(html, resource)

              write(INDEX, html)

          def verify(latest_day: str, latest_rows: list[tuple[str, dict]]) -> None:
              html = read(INDEX)
              fixes_js = read(FIXES_JS)
              fixes_css = read(FIXES_CSS)
              early = read(EARLY_JS)
              data = parse_sync()

              errors: list[str] = []

              for resource in (
                  "css/season18-fixes.css?v=580",
                  "data/season18_sync.js?v=580",
                  "js/season18-early.js?v=580",
                  "js/season18-fixes.js?v=580",
              ):
                  if resource not in html:
                      errors.append(f"cache absent : {resource}")

              if JS_MARKER not in fixes_js:
                  errors.append("bloc JavaScript V580 absent")

              if "inner.animate(" not in fixes_js:
                  errors.append("animation immédiate absente")

              if CSS_MARKER not in fixes_css:
                  errors.append("bloc CSS V580 absent")

              if "min-width:172px" not in fixes_css:
                  errors.append("INCOMING agrandi absent")

              if early.count("s18PlannedIncomingV580") != 2:
                  errors.append("Twice/Tsuyu INCOMING incorrects")

              expected_ids = {costume_id for costume_id, _ in latest_rows}
              expected_ids.add("108000000")

              for key in ("active_new_content", "new_content"):
                  section = data.get(key) or {}
                  costumes = set(map(str, section.get("costumes") or []))
                  styles = set(map(str, section.get("styles") or []))
                  characters = set(map(str, section.get("characters") or []))

                  if not expected_ids.issubset(costumes):
                      errors.append(f"{key}: costumes incomplets")
                  if "gentle_criminal_technical" not in styles:
                      errors.append(f"{key}: style Gentle absent")
                  if "gentle_criminal" not in characters:
                      errors.append(f"{key}: personnage Gentle absent")

              result = subprocess.run(
                  ["node", "--check", str(FIXES_JS)],
                  text=True,
                  capture_output=True,
              )
              if result.returncode:
                  errors.append("syntaxe season18-fixes.js invalide : " + result.stderr)

              result = subprocess.run(
                  ["node", "--check", str(EARLY_JS)],
                  text=True,
                  capture_output=True,
              )
              if result.returncode:
                  errors.append("syntaxe season18-early.js invalide : " + result.stderr)

              if errors:
                  die("Vérification V580 échouée :\n- " + "\n- ".join(errors))

              lines = [
                  "MHUR FRANCE — RAPPORT AUTOMATIQUE V580",
