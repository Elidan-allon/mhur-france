              write(REPORT, "\n".join(lines))

          def main() -> None:
              for path in FILES:
                  if not path.is_file():
                      die(f"Fichier requis absent : {path.as_posix()}")

              latest_day, latest_rows = patch_data()
              patch_early()
              patch_fixes_js()
              patch_fixes_css()
              patch_index()
              verify(latest_day, latest_rows)

