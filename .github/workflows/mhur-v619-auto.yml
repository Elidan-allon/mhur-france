name: MHUR V619 - Navigation TUNING mobile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v619-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v619-tuning-mobile
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V619
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v619.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS = base64.b64decode("").decode("utf-8")
          JS = base64.b64decode("").decode("utf-8")
          
          index_path = Path("public/index.html")
          css_path = Path("public/css/v619-mobile-tuning-navigation.css")
          js_path = Path("public/js/v619-mobile-tuning-navigation.js")
          report_path = Path("RAPPORT_V619_TUNING_MOBILE.txt")
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          css_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.parent.mkdir(parents=True, exist_ok=True)
          
          css_path.write_text(CSS + "\n", encoding="utf-8")
          js_path.write_text(JS + "\n", encoding="utf-8")
          
          html = index_path.read_text(encoding="utf-8")
          
          # Retire la limite artificielle de 80 options compatibles.
          html = re.sub(
              r'(compatibleTunings\(spec\.color,\s*spec\.kind,\s*spec\.condition\))'
              r'\.slice\(0,\s*80\)',
              r'\1',
              html,
          )
          
          patterns = [
              r'\s*<!-- V619 : navigation TUNING mobile CSS\. -->\s*'
              r'<link[^>]+v619-mobile-tuning-navigation\.css[^>]*>\s*',
              r'\s*<link[^>]+v619-mobile-tuning-navigation\.css[^>]*>\s*',
              r'\s*<!-- V619 : navigation TUNING mobile JS\. -->\s*'
              r'<script[^>]+v619-mobile-tuning-navigation\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v619-mobile-tuning-navigation\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html = re.sub(pattern, "\n", html, flags=re.I)
          
          css_tag = (
              '<!-- V619 : navigation TUNING mobile CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v619-mobile-tuning-navigation.css?v=619">\n'
          )
          js_tag = (
              '<!-- V619 : navigation TUNING mobile JS. -->\n'
              '<script '
              'src="js/v619-mobile-tuning-navigation.js?v=619">'
              '</script>\n'
          )
          
          head_matches = list(re.finditer(r'</head\s*>', html, flags=re.I))
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          
          if not head_matches:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          if not body_matches:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          head_position = head_matches[-1].start()
          html = html[:head_position] + css_tag + html[head_position:]
          
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          body_position = body_matches[-1].start()
          html = html[:body_position] + js_tag + html[body_position:]
          
          index_path.write_text(html, encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V619
          
          MOBILE
          - Un appui sur un emplacement T.U.N.I.N.G descend vers la liste compatible.
          - Après le choix d'un T.U.N.I.N.G, la page remonte vers l'emplacement actif.
          - La liste compatible n'est plus enfermée dans un défilement interne.
          - La limite artificielle de 80 résultats est supprimée.
          - Chaque carte affiche la description complète, tous les effets et tous les niveaux.
          - Les T.U.N.I.N.G déjà utilisés restent désactivés.
          - Aucun changement sur ordinateur.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V619 appliqué.")
          PY
          
          cat > /tmp/verifier_v619.py <<'PY'
          from pathlib import Path
          import re
          
          html = Path("public/index.html").read_text(encoding="utf-8")
          js = Path(
              "public/js/v619-mobile-tuning-navigation.js"
          ).read_text(encoding="utf-8")
          css = Path(
              "public/css/v619-mobile-tuning-navigation.css"
          ).read_text(encoding="utf-8")
          
          js_ref = "js/v619-mobile-tuning-navigation.js?v=619"
          css_ref = "css/v619-mobile-tuning-navigation.css?v=619"
          
          if html.count(js_ref) != 1:
              raise SystemExit("[ERREUR] Référence JS V619 absente ou dupliquée.")
          
          if html.count(css_ref) != 1:
              raise SystemExit("[ERREUR] Référence CSS V619 absente ou dupliquée.")
          
          if re.search(
              r'compatibleTunings\\(spec\\.color,\\s*spec\\.kind,'
              r'\\s*spec\\.condition\\)\\.slice\\(0,\\s*80\\)',
              html,
          ):
              raise SystemExit("[ERREUR] La limite de 80 résultats existe encore.")
          
          for token in [
              "navigateAfterRender",
              "mhurV619Details",
              "fullEffects",
              "mhurV619Levels",
              ".gameSlot.active",
              ".tuningPicker",
          ]:
              if token not in js:
                  raise SystemExit(f"[ERREUR] Élément JS manquant : {token}")
          
          for token in [
              ".mhurV619Details",
              "max-height:none!important",
              "overflow:visible!important",
              "grid-template-areas",
              ".mhurV619Level",
          ]:
              if token not in css:
                  raise SystemExit(f"[ERREUR] Élément CSS manquant : {token}")
          
          print("[OK] Contrôles V619 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v619.py
            node --check public/js/v619-mobile-tuning-navigation.js
            python3 /tmp/verifier_v619.py
          
            git add \
              public/index.html \
              public/css/v619-mobile-tuning-navigation.css \
              public/js/v619-mobile-tuning-navigation.js \
              RAPPORT_V619_TUNING_MOBILE.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V619 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: navigation et détails TUNING mobile V619"
          
            if git push origin HEAD:main; then
              echo "[OK] V619 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V619 après cinq tentatives."
          exit 1
