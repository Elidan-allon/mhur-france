name: MHUR V620 - Aller-retour TUNING mobile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v620-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v620-tuning-mobile
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V620
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v620.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          JS = base64.b64decode("").decode("utf-8")
          
          index_path = Path("public/index.html")
          js_path = Path("public/js/v620-tuning-mobile-auto-navigation.js")
          report_path = Path("RAPPORT_V620_NAVIGATION_TUNING_MOBILE.txt")
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          js_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.write_text(JS + "\n", encoding="utf-8")
          
          html = index_path.read_text(encoding="utf-8")
          
          patterns = [
              r'\s*<!-- V620 : aller-retour TUNING mobile\. -->\s*'
              r'<script[^>]+v620-tuning-mobile-auto-navigation\.js'
              r'[^>]*>\s*</script>\s*',
              r'\s*<script[^>]+v620-tuning-mobile-auto-navigation\.js'
              r'[^>]*>\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html = re.sub(pattern, "\n", html, flags=re.I)
          
          script_tag = (
              '<!-- V620 : aller-retour TUNING mobile. -->\n'
              '<script '
              'src="js/v620-tuning-mobile-auto-navigation.js?v=620">'
              '</script>\n'
          )
          
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          
          if not body_matches:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          position = body_matches[-1].start()
          html = html[:position] + script_tag + html[position:]
          index_path.write_text(html, encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V620
          
          CORRECTION UNIQUE
          - Emplacement T.U.N.I.N.G -> descente vers la liste compatible.
          - T.U.N.I.N.G sélectionné -> remontée vers l'emplacement actif.
          
          AUCUN AUTRE CHANGEMENT
          - Aucun CSS ajouté.
          - Aucune carte modifiée.
          - Aucun détail, niveau, costume ou donnée modifié.
          - Aucun changement sur ordinateur.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V620 appliqué.")
          PY
          
          cat > /tmp/verifier_v620.py <<'PY'
          from pathlib import Path
          
          html = Path("public/index.html").read_text(encoding="utf-8")
          js = Path(
              "public/js/v620-tuning-mobile-auto-navigation.js"
          ).read_text(encoding="utf-8")
          
          reference = "js/v620-tuning-mobile-auto-navigation.js?v=620"
          
          if html.count(reference) != 1:
              raise SystemExit(
                  "[ERREUR] Référence V620 absente ou dupliquée."
              )
          
          for token in [
              "navigationTarget",
              "navigate('picker')",
              "navigate('slot')",
              ".tuningPicker",
              ".gameSlot.active",
              "wrappedChoose",
              "wrappedEquip",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] Élément V620 manquant : {token}"
                  )
          
          print("[OK] Contrôles V620 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v620.py
            node --check public/js/v620-tuning-mobile-auto-navigation.js
            python3 /tmp/verifier_v620.py
          
            git add \
              public/index.html \
              public/js/v620-tuning-mobile-auto-navigation.js \
              RAPPORT_V620_NAVIGATION_TUNING_MOBILE.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V620 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: aller-retour automatique TUNING mobile V620"
          
            if git push origin HEAD:main; then
              echo "[OK] V620 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V620 après cinq tentatives."
          exit 1
