          html = re.sub(
              r'\s*<!-- V613 : derniers correctifs mobiles JS\. -->\s*'
              r'<script[^>]+src=["\'](?:/)?js/v613-mobile-last-fixes\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*',
              '\n',
              html,
              flags=re.I
          )
