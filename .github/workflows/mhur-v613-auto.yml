              '<!-- V613 : derniers correctifs mobiles CSS. -->\n'
              '<link rel="stylesheet" href="css/v613-mobile-last-fixes.css?v=613">\n'
          )
          js_tag = (
              '<!-- V613 : derniers correctifs mobiles JS. -->\n'
              '<script src="js/v613-mobile-last-fixes.js?v=613"></script>\n'
          )
          
          head_matches = list(re.finditer(r'</head\s*>', html, flags=re.I))
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          
          if not head_matches:
              raise SystemExit('[ERREUR] Balise </head> introuvable.')
          if not body_matches:
              raise SystemExit('[ERREUR] Balise </body> introuvable.')
          
          head_pos = head_matches[-1].start()
          html = html[:head_pos] + css_tag + html[head_pos:]
          
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          body_pos = body_matches[-1].start()
          html = html[:body_pos] + js_tag + html[body_pos:]
          
          index_path.write_text(html, encoding='utf-8')
          print('[OK] V613 installé dans public/index.html.')
          PYINSTALL

      - name: Contrôler le correctif V613
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/v613-mobile-last-fixes.js
          python3 <<'PYVERIFY'
          from pathlib import Path
          
          html = Path('public/index.html').read_text(encoding='utf-8')
          js = Path('public/js/v613-mobile-last-fixes.js').read_text(encoding='utf-8')
          css = Path('public/css/v613-mobile-last-fixes.css').read_text(encoding='utf-8')
          
          js_ref = 'js/v613-mobile-last-fixes.js?v=613'
          css_ref = 'css/v613-mobile-last-fixes.css?v=613'
          
          if html.count(js_ref) != 1:
              raise SystemExit('[ERREUR] Référence JS V613 absente ou dupliquée.')
          if html.count(css_ref) != 1:
              raise SystemExit('[ERREUR] Référence CSS V613 absente ou dupliquée.')
          
          for token in [
              'pointerdown',
              'closeLinksFully',
              'nexusLinksClose',
              'pinBackButton',
              'mhur-v613-header-bottom'
          ]:
              if token not in js:
                  raise SystemExit(f'[ERREUR] Élément JS absent : {token}')
          
          for token in [
              'bottom:102px!important',
              '.styleGrid .styleCard',
              'transform:translateY(2px)!important',
              'position:fixed!important'
          ]:
              if token not in css:
                  raise SystemExit(f'[ERREUR] Élément CSS absent : {token}')
          
          if html.index(css_ref) > html.lower().rindex('</head>'):
              raise SystemExit('[ERREUR] Le CSS V613 doit être chargé avant </head>.')
          if html.index(js_ref) > html.lower().rindex('</body>'):
              raise SystemExit('[ERREUR] Le JS V613 doit être chargé avant </body>.')
          
          print('[OK] Contrôles V613 validés.')
          PYVERIFY
          
          git status --short

      - name: Enregistrer automatiquement les changements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add \
            public/index.html \
            public/js/v613-mobile-last-fixes.js \
            public/css/v613-mobile-last-fixes.css \
            RAPPORT_V613_DERNIERS_CORRECTIFS_MOBILES.txt
          
          if git diff --cached --quiet; then
            echo "[INFO] V613 est déjà appliqué. Aucun commit nécessaire."
            exit 0
          fi
          
          git commit -m "fix: derniers ajustements mobiles V613"
          
          for tentative in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "[OK] V613 envoyé sur main."
              exit 0
            fi
            echo "[ATTENTE] Nouvelle tentative de push : ${tentative}/3"
            sleep 3
          done
          
          echo "[ERREUR] Impossible d'envoyer le commit après trois tentatives."
          exit 1
