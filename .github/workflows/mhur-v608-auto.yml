name: MHUR V608 - Patch Notes et Alpha Deku

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v608-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v608-patch-notes-deku
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer V608
        shell: bash
        run: |
          cat > /tmp/appliquer_v608.py <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT=Path.cwd()
          INDEX=ROOT/"public/index.html"
          JS=ROOT/"public/js/v608-patch-notes-final.js"
          CSS=ROOT/"public/css/v608-patch-notes-final.css"
          REPORT=ROOT/"RAPPORT_V608_PATCH_NOTES_DEKU.txt"

          JS_CONTENT="/* MHUR Nexus — V608\n   Rendu autonome et stable des Patch Notes.\n   - restaure le contenu vide\n   - sélectionne les bons styles Midoriya\n   - affiche les images locales exactes dès le premier rendu\n   - ne modifie pas les pages personnages\n*/\n(function(){\n  'use strict';\n\n  if(window.MHUR_V608_LOADED)return;\n  window.MHUR_V608_LOADED=true;\n\n  const VERSION='608';\n\n  function clean(value){\n    return String(value??'').trim();\n  }\n\n  function normal(value){\n    return clean(value)\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g,'_')\n      .replace(/^_+|_+$/g,'');\n  }\n\n  function language(){\n    try{\n      if(\n        typeof lang!=='undefined'&&\n        (lang==='fr'||lang==='en')\n      ){\n        return lang;\n      }\n    }catch(_error){}\n\n    return String(document.documentElement.lang||'')\n      .toLowerCase()\n      .startsWith('en')\n      ?'en'\n      :'fr';\n  }\n\n  function tx(fr,en){\n    return language()==='en'?en:fr;\n  }\n\n  function localized(value){\n    if(\n      value&&\n      typeof value==='object'&&\n      !Array.isArray(value)\n    ){\n      const current=language();\n\n      return clean(\n        value[current]??\n        value.fr??\n        value.en??\n        ''\n      );\n    }\n\n    return clean(value);\n  }\n\n  function escapeHtml(value){\n    return clean(value).replace(\n      /[&<>\"']/g,\n      character=>({\n        '&':'&amp;',\n        '<':'&lt;',\n        '>':'&gt;',\n        '\"':'&quot;',\n        \"'\":'&#39;'\n      })[character]\n    );\n  }\n\n  function charactersList(){\n    try{\n      if(\n        typeof characters!=='undefined'&&\n        Array.isArray(characters)\n      ){\n        return characters;\n      }\n    }catch(_error){}\n\n    return [];\n  }\n\n  function stylesMap(){\n    try{\n      if(\n        typeof styles!=='undefined'&&\n        styles&&\n        typeof styles==='object'\n      ){\n        return styles;\n      }\n    }catch(_error){}\n\n    return {};\n  }\n\n  function roleKey(value){\n    return ({\n      strike:'attack',\n      attack:'attack',\n      assault:'assault',\n      technical:'technical',\n      support:'support',\n      rapid:'rapid',\n      speed:'rapid'\n    })[normal(value)]||'technical';\n  }\n\n  function roleText(value){\n    const role=roleKey(value);\n\n    const translations={\n      attack:{\n        fr:'Attaque',\n        en:'Strike'\n      },\n      assault:{\n        fr:'Assaut',\n        en:'Assault'\n      },\n      technical:{\n        fr:'Technique',\n        en:'Technical'\n      },\n      support:{\n        fr:'Soutien',\n        en:'Support'\n      },\n      rapid:{\n        fr:'Vitesse',\n        en:'Rapid'\n      }\n    };\n\n    return translations[role]?.[language()]||role;\n  }\n\n  function sideText(side){\n    return normal(side)==='villain'\n      ?tx('VILAINS','VILLAINS')\n      :tx('HÉROS','HEROES');\n  }\n\n  function findCharacter(value){\n    const wanted=normal(value);\n\n    if(!wanted)return null;\n\n    const list=charactersList();\n\n    const exact=list.find(character=>\n      normal(character?.id)===wanted||\n      normal(character?.name)===wanted\n    );\n\n    if(exact)return exact;\n\n    let best=null;\n    let bestScore=0;\n\n    list.forEach(character=>{\n      const id=normal(character?.id);\n      const name=normal(character?.name);\n      let score=0;\n\n      if(id&&wanted.includes(id)){\n        score=Math.max(score,1000+id.length);\n      }\n\n      if(name&&wanted.includes(name)){\n        score=Math.max(score,1000+name.length);\n      }\n\n      if(id&&id.includes(wanted)){\n        score=Math.max(score,500+wanted.length);\n      }\n\n      if(name&&name.includes(wanted)){\n        score=Math.max(score,500+wanted.length);\n      }\n\n      if(score>bestScore){\n        bestScore=score;\n        best=character;\n      }\n    });\n\n    return best;\n  }\n\n  function styleIds(character){\n    const map=stylesMap();\n\n    return Array.from(\n      new Set(\n        Array.isArray(character?.styles)\n          ?character.styles.map(String)\n          :[]\n      )\n    ).filter(id=>map[id]);\n  }\n\n  function healthChange(change,sectionTitle=''){\n    const value=normal(\n      [\n        sectionTitle,\n        change?.skill_name,\n        change?.label\n      ].filter(Boolean).join(' ')\n    );\n\n    return (\n      normal(change?.skill_name)==='hp'||\n      normal(change?.skill_name)==='pv'||\n      normal(change?.label)==='hp'||\n      normal(change?.label)==='pv'||\n      value.includes('balance_changes_health')||\n      value.includes('equilibrage_pv')||\n      value.includes('maximum_main_health')||\n      value.includes('maximum_hp')\n    );\n  }\n\n  function midoriyaStyleId(change,character){\n    const characterKey=normal(\n      change?.character||\n      character?.name||\n      character?.id\n    );\n\n    const skillKey=normal(\n      change?.skill_name||\n      change?.label\n    );\n\n    if(\n      characterKey.includes('midoriya_ofa')||\n      (\n        skillKey.includes('delaware_smash_airblast')||\n        skillKey.includes('rafale_d_air')||\n        skillKey.includes('airblast')\n      )\n    ){\n      return 'ofa';\n    }\n\n    if(\n      skillKey.includes('delaware_smash_full_bullet')||\n      skillKey.includes('full_bullet')\n    ){\n      return 'fullbullet';\n    }\n\n    if(\n      skillKey.includes('delaware_smash_air_force')||\n      skillKey.includes('air_force')\n    ){\n      return 'assault';\n    }\n\n    return '';\n  }\n\n  function skillLetter(value){\n    const raw=clean(value);\n\n    if(/^(?:α|a|alpha)(?:\\s|[-—:(]|$)/i.test(raw)){\n      return 'alpha';\n    }\n\n    if(/^(?:β|b|beta)(?:\\s|[-—:(]|$)/i.test(raw)){\n      return 'beta';\n    }\n\n    if(/^(?:γ|g|y|gamma)(?:\\s|[-—:(]|$)/i.test(raw)){\n      return 'gamma';\n    }\n\n    if(\n      /^(?:sp|special|special action|action spéciale)(?:\\s|[-—:(]|$)/i\n        .test(raw)\n    ){\n      return 'special';\n    }\n\n    return '';\n  }\n\n  function inferredSkillKey(change){\n    if(healthChange(change))return '';\n\n    const raw=clean(\n      change?.skill_name||\n      change?.label\n    );\n\n    const direct=skillLetter(raw);\n\n    if(direct)return direct;\n\n    const value=normal(raw);\n\n    const alpha=[\n      'delaware_smash',\n      'air_force',\n      'airblast',\n      'full_bullet',\n      'ap_shot_cluster',\n      'electro_target',\n      'phantom_smash',\n      'ice_bullet_shot',\n      'wingbeat',\n      'hollow_point_shot'\n    ];\n\n    if(alpha.some(key=>value.includes(key))){\n      return 'alpha';\n    }\n\n    const beta=[\n      'nitro_cluster',\n      'wind_cross',\n      'high_angle_fire'\n    ];\n\n    if(beta.some(key=>value.includes(key))){\n      return 'beta';\n    }\n\n    const gamma=[\n      'howitzer_impact',\n      'big_fist_grip',\n      'foot_boost',\n      'kickback_shot'\n    ];\n\n    if(gamma.some(key=>value.includes(key))){\n      return 'gamma';\n    }\n\n    const special=[\n      'electrification',\n      'scope_mode'\n    ];\n\n    if(special.some(key=>value.includes(key))){\n      return 'special';\n    }\n\n    return '';\n  }\n\n  function allSkills(style){\n    return [\n      ...(Array.isArray(style?.skills)?style.skills:[]),\n      style?.special\n        ?{\n          ...style.special,\n          letter:'SP'\n        }\n        :null\n    ].filter(Boolean);\n  }\n\n  function skillFromStyle(style,change){\n    if(!style||healthChange(change))return null;\n\n    const raw=normal(\n      change?.skill_name||\n      change?.label\n    );\n\n    const skills=allSkills(style);\n\n    const exact=skills\n      .map(skill=>{\n        const name=normal(localized(skill?.name));\n        let score=0;\n\n        if(name&&raw===name){\n          score=4000;\n        }else if(name&&raw.includes(name)){\n          score=3000+name.length;\n        }else if(name&&name.includes(raw)){\n          score=2000+raw.length;\n        }\n\n        return {\n          skill,\n          score\n        };\n      })\n      .sort((a,b)=>b.score-a.score)\n      .find(row=>row.score>0)\n      ?.skill;\n\n    if(exact)return exact;\n\n    const key=inferredSkillKey(change);\n\n    if(!key)return null;\n\n    return skills.find(skill=>{\n      const letter=skillLetter(skill?.letter);\n\n      return letter===key;\n    })||null;\n  }\n\n  function resolveStyle(change){\n    const map=stylesMap();\n    const character=findCharacter(change?.character);\n    const ids=styleIds(character);\n\n    const midoriyaId=midoriyaStyleId(\n      change,\n      character\n    );\n\n    if(midoriyaId&&map[midoriyaId]){\n      return {\n        character,\n        id:midoriyaId,\n        style:map[midoriyaId]\n      };\n    }\n\n    const rawSkill=normal(\n      change?.skill_name||\n      change?.label\n    );\n\n    const bySkill=ids.find(id=>\n      allSkills(map[id]).some(skill=>{\n        const name=normal(localized(skill?.name));\n\n        return (\n          name&&\n          (\n            name===rawSkill||\n            name.includes(rawSkill)||\n            rawSkill.includes(name)\n          )\n        );\n      })\n    );\n\n    if(bySkill){\n      return {\n        character,\n        id:bySkill,\n        style:map[bySkill]\n      };\n    }\n\n    const wanted=normal(change?.style||'Original');\n\n    const byStyle=ids.find(id=>\n      normal(localized(map[id]?.name)||'Original')===wanted\n    );\n\n    const id=byStyle||ids[0]||'';\n\n    return {\n      character,\n      id,\n      style:map[id]||null\n    };\n  }\n\n  function translatePatch(value){\n    let output=localized(value);\n\n    if(language()==='en')return output;\n\n    const exact={\n      HP:'PV',\n      Health:'PV',\n      Ammo:'Munitions',\n      Magazine:'Munitions',\n      Damage:'Dégâts',\n      'Guard Break':'Brise-garde',\n      'Special Action':'Action spéciale',\n      'No. of Rounds':'Munitions',\n      Adjustment:'Neutre'\n    };\n\n    if(exact[output])return exact[output];\n\n    const replacements=[\n      [/^Data Update/i,'Mise à jour des données'],\n      [/^Balance Changes:\\s*/i,'Équilibrage : '],\n      [/Maximum Main Health|Maximum HP|Max HP/gi,'PV maximum'],\n      [/\\bHP\\b/gi,'PV'],\n      [/No\\. of Rounds|Magazine/gi,'Munitions'],\n      [/Ammo/gi,'Munitions'],\n      [/Guard Break/gi,'Brise-garde'],\n      [/Damage/gi,'Dégâts'],\n      [/Special Action/gi,'Action spéciale'],\n      [/Before/gi,'Avant'],\n      [/After/gi,'Après'],\n      [/Adjustment/gi,'Neutre']\n    ];\n\n    replacements.forEach(([pattern,replacement])=>{\n      output=output.replace(pattern,replacement);\n    });\n\n    return output;\n  }\n\n  function imageHtml(src,alt,className=''){\n    if(!src)return '';\n\n    const cleanSrc=clean(src);\n    const separator=cleanSrc.includes('?')?'&':'?';\n\n    return `<img\n      src=\"${escapeHtml(cleanSrc+separator+'v='+VERSION)}\"\n      alt=\"${escapeHtml(alt)}\"\n      class=\"${escapeHtml(className)}\"\n      loading=\"eager\"\n      decoding=\"async\"\n      fetchpriority=\"high\"\n    >`;\n  }\n\n  function average(values){\n    const numbers=(\n      Array.isArray(values)\n        ?values\n        :[values]\n    )\n      .map(value=>\n        parseFloat(\n          clean(value).replace(',','.')\n        )\n      )\n      .filter(Number.isFinite);\n\n    if(!numbers.length)return null;\n\n    return numbers.reduce(\n      (sum,value)=>sum+value,\n      0\n    )/numbers.length;\n  }\n\n  function toneFor(change,sectionTitle=''){\n    const explicit=normal(\n      change?.tone||\n      change?.type\n    );\n\n    if(/buff|increase|improve|up/.test(explicit)){\n      return 'buff';\n    }\n\n    if(/nerf|decrease|reduce|down/.test(explicit)){\n      return 'nerf';\n    }\n\n    const before=average(change?.before);\n    const after=average(change?.after);\n\n    if(\n      before==null||\n      after==null||\n      before===after\n    ){\n      return 'adjust';\n    }\n\n    const context=normal(\n      sectionTitle+' '+\n      localized(change?.label)+' '+\n      localized(change?.skill_name)\n    );\n\n    const lowerIsBetter=\n      /reload|cooldown|recharge|time|second|seconde/\n        .test(context);\n\n    if(lowerIsBetter){\n      return after<before?'buff':'nerf';\n    }\n\n    return after>before?'buff':'nerf';\n  }\n\n  function valuesHtml(change,tone){\n    const before=Array.isArray(change?.before)\n      ?change.before\n      :[change?.before];\n\n    const after=Array.isArray(change?.after)\n      ?change.after\n      :[change?.after];\n\n    const count=Math.max(\n      before.length,\n      after.length\n    );\n\n    if(count>1){\n      return `<div class=\"s18PatchTableWrapV10\">\n        <table class=\"s18PatchTableV10\">\n          <thead>\n            <tr>\n              <th></th>\n              ${Array.from(\n                {length:count},\n                (_value,index)=>`<th>Lv.${index+1}</th>`\n              ).join('')}\n            </tr>\n          </thead>\n          <tbody>\n            <tr class=\"before\">\n              <th>${tx('Avant','Before')}</th>\n              ${Array.from(\n                {length:count},\n                (_value,index)=>`<td>${\n                  escapeHtml(before[index]??'')\n                }</td>`\n              ).join('')}\n            </tr>\n            <tr class=\"after ${tone}\">\n              <th>${tx('Après','After')}</th>\n              ${Array.from(\n                {length:count},\n                (_value,index)=>`<td>${\n                  escapeHtml(after[index]??'')\n                }</td>`\n              ).join('')}\n            </tr>\n          </tbody>\n        </table>\n      </div>`;\n    }\n\n    if(\n      change?.before!=null||\n      change?.after!=null\n    ){\n      return `<div class=\"s18PatchRow\">\n        <span class=\"s18PatchBefore\">\n          ${escapeHtml(before[0]??'—')}\n        </span>\n        <span class=\"s18PatchArrow\">→</span>\n        <span class=\"s18PatchAfter ${tone}\">\n          ${escapeHtml(after[0]??'—')}\n        </span>\n      </div>`;\n    }\n\n    return '';\n  }\n\n  function groupChanges(section){\n    const groups=[];\n    const map=new Map();\n\n    (\n      Array.isArray(section?.changes)\n        ?section.changes\n        :[]\n    ).filter(Boolean).forEach(change=>{\n      const resolved=resolveStyle(change);\n\n      const key=[\n        normal(\n          resolved.character?.id||\n          change?.character\n        ),\n        resolved.id||\n        normal(change?.style||'Original')\n      ].join('__');\n\n      if(!map.has(key)){\n        const group={\n          character:resolved.character,\n          id:resolved.id,\n          style:resolved.style,\n          name:resolved.character?.name||\n            localized(change?.character),\n          changes:[]\n        };\n\n        map.set(key,group);\n        groups.push(group);\n      }\n\n      map.get(key).changes.push(change);\n    });\n\n    return groups;\n  }\n\n  function changeHtml(group,change,sectionTitle){\n    const tone=toneFor(change,sectionTitle);\n    const health=healthChange(\n      change,\n      sectionTitle\n    );\n\n    const skill=health\n      ?null\n      :skillFromStyle(group.style,change);\n\n    const title=translatePatch(\n      localized(skill?.name)||\n      localized(change?.skill_name)||\n      localized(change?.label)||\n      tx('Ajustement','Adjustment')\n    );\n\n    /*\n      Pour Midoriya, l'image vient toujours du style exact\n      choisi par resolveStyle. skill_image ne peut plus\n      imposer Gamma ou Action spéciale.\n    */\n    const isMidoriya=normal(group.name)\n      .includes('midoriya');\n\n    const picture=health\n      ?''\n      :(\n        skill?.img||\n        (\n          isMidoriya\n            ?''\n            :change?.skill_image\n        )||\n        ''\n      );\n\n    const bullets=(\n      Array.isArray(change?.bullets)\n        ?change.bullets\n        :[]\n    )\n      .map(translatePatch)\n      .filter(Boolean);\n\n    return `<section\n      class=\"s18PatchChangeV10 ${tone}\"\n      data-v608-style=\"${escapeHtml(group.id)}\"\n    >\n      <span class=\"s18ToneV10 ${tone}\">\n        ${\n          tone==='buff'\n            ?'BUFF'\n            :tone==='nerf'\n              ?'NERF'\n              :tx('NEUTRE','NEUTRAL')\n        }\n      </span>\n\n      <div class=\"s18PatchSkillV10${\n        picture?'':' s18NoSkillImageV608'\n      }\">\n        ${\n          picture\n            ?`<div class=\"s18PatchImageV608\">${\n              imageHtml(picture,title)\n            }</div>`\n            :''\n        }\n\n        <main>\n          <h5>${escapeHtml(title)}</h5>\n\n          ${\n            change?.label\n              ?`<p class=\"s18PatchLabelV10\">${\n                escapeHtml(\n                  translatePatch(change.label)\n                )\n              }</p>`\n              :''\n          }\n\n          ${valuesHtml(change,tone)}\n\n          ${\n            bullets.length\n              ?`<ul>${\n                bullets.map(\n                  bullet=>`<li>${\n                    escapeHtml(bullet)\n                  }</li>`\n                ).join('')\n              }</ul>`\n              :''\n          }\n        </main>\n      </div>\n    </section>`;\n  }\n\n  function groupHtml(group,sectionTitle){\n    const style=group.style||{};\n    const role=roleKey(style.role);\n    const side=group.character?.side||'hero';\n    const styleName=\n      localized(style.name)||\n      tx('Original','Original');\n\n    return `<article\n      class=\"s18PatchCharacterV10 role-${role}\"\n      data-v608-character=\"${\n        escapeHtml(group.name)\n      }\"\n      data-v608-style=\"${\n        escapeHtml(group.id)\n      }\"\n    >\n      <header>\n        <div class=\"s18PatchPortraitV10\">\n          ${\n            style.portrait\n              ?imageHtml(\n                style.portrait,\n                group.name\n              )\n              :''\n          }\n        </div>\n\n        <div>\n          <h4>${escapeHtml(group.name)}</h4>\n          <strong>${escapeHtml(styleName)}</strong>\n\n          <div class=\"s18PatchBadgesV10\">\n            <span class=\"badge ${\n              normal(side)==='villain'\n                ?'villain'\n                :'hero'\n            }\">\n              ${escapeHtml(sideText(side))}\n            </span>\n\n            <span class=\"badge ${role}\">\n              ${escapeHtml(roleText(role))}\n            </span>\n          </div>\n        </div>\n      </header>\n\n      <div class=\"s18PatchChangesV10\">\n        ${group.changes.map(change=>\n          changeHtml(\n            group,\n            change,\n            sectionTitle\n          )\n        ).join('')}\n      </div>\n    </article>`;\n  }\n\n  function patchDetailHtml(note){\n    const sections=(\n      Array.isArray(note?.details)\n        ?note.details\n        :[]\n    )\n      .map(section=>({\n        ...section,\n        changes:(\n          Array.isArray(section?.changes)\n            ?section.changes\n            :[]\n        ).filter(Boolean)\n      }))\n      .filter(section=>section.changes.length);\n\n    if(sections.length){\n      return sections.map(section=>\n        `<section class=\"s18PatchSectionV10\">\n          <h3>${\n            escapeHtml(\n              translatePatch(section.title)\n            )\n          }</h3>\n\n          ${\n            section.note\n              ?`<p>${\n                escapeHtml(\n                  translatePatch(section.note)\n                )\n              }</p>`\n              :''\n          }\n\n          <div class=\"s18PatchSeparatedV10\">\n            ${groupChanges(section).map(group=>\n              groupHtml(\n                group,\n                localized(section.title)\n              )\n            ).join('')}\n          </div>\n        </section>`\n      ).join('');\n    }\n\n    const blocks=Array.isArray(note?.rich_blocks)\n      ?note.rich_blocks\n      :[];\n\n    if(blocks.length){\n      return `<div class=\"s18DevArticleV10\">\n        ${blocks.map(block=>{\n          if(block?.type==='heading'){\n            return `<h3>${\n              escapeHtml(\n                translatePatch(block.text)\n              )\n            }</h3>`;\n          }\n\n          if(block?.type==='image'&&block.src){\n            return `<figure>${\n              imageHtml(\n                block.src,\n                block.alt||''\n              )\n            }</figure>`;\n          }\n\n          return `<p>${\n            escapeHtml(\n              translatePatch(block?.text)\n            )\n          }</p>`;\n        }).join('')}\n      </div>`;\n    }\n\n    return `<p>${\n      tx(\n        'Aucun détail disponible.',\n        'No details available.'\n      )\n    }</p>`;\n  }\n\n  function devHtml(){\n    return `<article class=\"s18DevArticleV10\">\n      <div class=\"s18DevHeroV10\">\n        <span>DEV BLOG VOL. 27</span>\n        <h2>Developer Notes — Season 18</h2>\n        <p>29/07/2026 · Bandai Namco / Byking</p>\n      </div>\n\n      <section>\n        <h3>${tx(\n          '20 millions de téléchargements',\n          '20 million downloads'\n        )}</h3>\n        <p>${tx(\n          'Un bonus de connexion spécial de 28 jours célèbre ce cap, avec notamment 6 000 Cristaux Héros et 100 Tickets de tirage.',\n          'A special 28-day login bonus celebrates the milestone, including 6,000 Hero Crystals and 100 Roll Tickets.'\n        )}</p>\n      </section>\n\n      <section>\n        <h3>Gentle Criminal & La Brava</h3>\n        <p>${tx(\n          \"Gentle est pensé comme un personnage Technique très mobile. Son Alter Élasticité crée des rebonds, une barrière d'air et un trampoline utilisable par les alliés.\",\n          'Gentle is designed as a highly mobile Technical character. Elasticity creates rebounds, an air barrier, and an ally-usable trampoline.'\n        )}</p>\n      </section>\n\n      <section>\n        <h3>Chaos City Ver. 02</h3>\n        <p>${tx(\n          'Le quartier commercial a été profondément rénové avec une nouvelle zone souterraine.',\n          'The shopping district has been heavily renovated with a new underground area.'\n        )}</p>\n      </section>\n    </article>`;\n  }\n\n  function ensureModal(){\n    let modal=document.getElementById(\n      's18NotesDevModalV10'\n    );\n\n    if(!modal){\n      modal=document.createElement('div');\n      modal.id='s18NotesDevModalV10';\n      modal.className='s18NotesOverlayV10';\n\n      modal.innerHTML=`<section\n        class=\"s18NotesPanelV10\"\n        tabindex=\"-1\"\n      >\n        <header>\n          <div>\n            <span>MHUR NEXUS</span>\n            <h2 data-notes-title>\n              Patch Notes / Dev Notes\n            </h2>\n          </div>\n\n          <button type=\"button\" data-close>\n            ×\n          </button>\n        </header>\n\n        <nav>\n          <button\n            type=\"button\"\n            data-tab=\"patch\"\n            class=\"active\"\n          >\n            Patch Notes\n          </button>\n\n          <button\n            type=\"button\"\n            data-tab=\"dev\"\n          >\n            Dev Notes\n          </button>\n        </nav>\n\n        <div class=\"s18NotesBodyV10\">\n          <aside></aside>\n          <main></main>\n        </div>\n      </section>`;\n\n      document.body.appendChild(modal);\n    }\n\n    modal.querySelector('[data-notes-title]')\n      .textContent='Patch Notes / Dev Notes';\n\n    modal.querySelector('[data-tab=\"patch\"]')\n      .textContent='Patch Notes';\n\n    modal.querySelector('[data-tab=\"dev\"]')\n      .textContent='Dev Notes';\n\n    const close=modal.querySelector('[data-close]');\n\n    if(close){\n      close.onclick=closeNotes;\n    }\n\n    modal.onclick=event=>{\n      if(event.target===modal){\n        closeNotes();\n      }\n    };\n\n    return modal;\n  }\n\n  function closeNotes(){\n    const modal=document.getElementById(\n      's18NotesDevModalV10'\n    );\n\n    if(!modal)return;\n\n    modal.classList.remove('open');\n    document.body.classList.remove(\n      's18NotesOpenV11'\n    );\n  }\n\n  function resetScroll(modal,asideToo=false){\n    const main=modal.querySelector(\n      '.s18NotesBodyV10>main'\n    );\n\n    const aside=modal.querySelector(\n      '.s18NotesBodyV10>aside'\n    );\n\n    if(main)main.scrollTop=0;\n    if(asideToo&&aside)aside.scrollTop=0;\n  }\n\n  function notes(){\n    const rows=window.MHUR_HOME_DATA?.patch_notes;\n\n    return Array.isArray(rows)?rows:[];\n  }\n\n  function showPatch(index=0){\n    const modal=ensureModal();\n    const rows=notes();\n    const safeIndex=Math.max(\n      0,\n      Math.min(\n        Number(index)||0,\n        Math.max(0,rows.length-1)\n      )\n    );\n\n    const note=rows[safeIndex];\n    const aside=modal.querySelector(\n      '.s18NotesBodyV10>aside'\n    );\n\n    const main=modal.querySelector(\n      '.s18NotesBodyV10>main'\n    );\n\n    aside.innerHTML=rows.length\n      ?rows.map((row,rowIndex)=>\n        `<button\n          type=\"button\"\n          data-v608-patch-index=\"${rowIndex}\"\n          class=\"${\n            rowIndex===safeIndex\n              ?'active'\n              :''\n          }\"\n        >\n          <b>${\n            escapeHtml(\n              translatePatch(row.title)\n            )\n          }</b>\n\n          <small>${\n            row.date\n              ?new Date(row.date).toLocaleDateString(\n                language()==='fr'\n                  ?'fr-FR'\n                  :'en-US'\n              )\n              :''\n          }</small>\n        </button>`\n      ).join('')\n      :`<p>${\n        tx(\n          'Aucune note disponible.',\n          'No notes available.'\n        )\n      }</p>`;\n\n    if(!note){\n      main.innerHTML=`<p>${\n        tx(\n          'Aucune note disponible.',\n          'No notes available.'\n        )\n      }</p>`;\n\n      return;\n    }\n\n    /*\n      Le titre est posé avant les détails. Même si une donnée future est\n      imparfaite, le panneau ne reste jamais entièrement vide.\n    */\n    main.innerHTML=`<div\n      class=\"s18PatchDetailHeadV10\"\n    >\n      <h2>${\n        escapeHtml(\n          translatePatch(note.title)\n        )\n      }</h2>\n\n      <div>\n        <span class=\"buff\">BUFF</span>\n        <span class=\"nerf\">NERF</span>\n        <span class=\"adjust\">\n          ${tx('NEUTRE','NEUTRAL')}\n        </span>\n      </div>\n    </div>\n\n    <div data-v608-patch-content>\n      ${patchDetailHtml(note)}\n    </div>`;\n\n    resetScroll(modal,false);\n  }\n\n  function showDev(){\n    const modal=ensureModal();\n\n    modal.querySelector(\n      '.s18NotesBodyV10>aside'\n    ).innerHTML=`<div class=\"s18DevSideV10\">\n      <b>DEV BLOG VOL. 27</b>\n      <small>${tx('Saison 18','Season 18')}</small>\n    </div>`;\n\n    modal.querySelector(\n      '.s18NotesBodyV10>main'\n    ).innerHTML=devHtml();\n\n    resetScroll(modal,true);\n  }\n\n  function selectTab(tab){\n    const modal=ensureModal();\n\n    modal.querySelectorAll(\n      '[data-tab]'\n    ).forEach(button=>{\n      button.classList.toggle(\n        'active',\n        button.dataset.tab===tab\n      );\n    });\n\n    if(tab==='dev'){\n      showDev();\n    }else{\n      showPatch(0);\n    }\n  }\n\n  function openNotes(){\n    const modal=ensureModal();\n\n    modal.classList.add('open');\n    document.body.classList.add(\n      's18NotesOpenV11'\n    );\n\n    selectTab('patch');\n\n    requestAnimationFrame(()=>{\n      window.MHUR_S18_V18\n        ?.refreshNotesLayout?.();\n\n      window.MHUR_S18_V17\n        ?.refreshNotesLayout?.();\n\n      resetScroll(modal,true);\n\n      modal.querySelector(\n        '.s18NotesPanelV10'\n      )?.focus?.({\n        preventScroll:true\n      });\n    });\n  }\n\n  function installApi(){\n    for(const key of [\n      'MHUR_S18_V10',\n      'MHUR_S18_V13',\n      'MHUR_S18_V14'\n    ]){\n      const current=window[key]||{};\n\n      window[key]={\n        ...current,\n        openNotes,\n        showPatch\n      };\n    }\n\n    window.MHUR_V608={\n      openNotes,\n      showPatch,\n      selectTab,\n      refresh:()=>showPatch(0)\n    };\n  }\n\n  function installButton(){\n    const buttons=document.querySelectorAll(\n      '#mhurPatchDevButtonV14,'+\n      '.mhurPatchDevButtonV14,'+\n      '[data-s18-notes-button]'\n    );\n\n    buttons.forEach(button=>{\n      button.onclick=openNotes;\n    });\n  }\n\n  /*\n    Capture avant les anciens onclick :\n    l'ancien moteur ne peut plus effacer notre rendu.\n  */\n  document.addEventListener(\n    'click',\n    event=>{\n      const notesButton=event.target?.closest?.(\n        '#mhurPatchDevButtonV14,'+\n        '.mhurPatchDevButtonV14,'+\n        '[data-s18-notes-button]'\n      );\n\n      if(notesButton){\n        event.preventDefault();\n        event.stopImmediatePropagation();\n        openNotes();\n        return;\n      }\n\n      const tab=event.target?.closest?.(\n        '#s18NotesDevModalV10 [data-tab]'\n      );\n\n      if(tab){\n        event.preventDefault();\n        event.stopImmediatePropagation();\n        selectTab(tab.dataset.tab);\n        return;\n      }\n\n      const patchButton=event.target?.closest?.(\n        '#s18NotesDevModalV10 '+\n        '[data-v608-patch-index]'\n      );\n\n      if(patchButton){\n        event.preventDefault();\n        event.stopImmediatePropagation();\n        showPatch(\n          Number(\n            patchButton.dataset.v608PatchIndex\n          )\n        );\n      }\n    },\n    true\n  );\n\n  function start(){\n    installApi();\n    installButton();\n\n    /*\n      Si la fenêtre était déjà ouverte et vide au moment du chargement,\n      elle est réparée immédiatement.\n    */\n    const modal=document.getElementById(\n      's18NotesDevModalV10'\n    );\n\n    if(modal?.classList.contains('open')){\n      showPatch(0);\n    }\n  }\n\n  window.addEventListener(\n    'mhur:languagechange',\n    ()=>{\n      installApi();\n      installButton();\n\n      const modal=document.getElementById(\n        's18NotesDevModalV10'\n      );\n\n      if(modal?.classList.contains('open')){\n        const devActive=modal.querySelector(\n          '[data-tab=\"dev\"]'\n        )?.classList.contains('active');\n\n        if(devActive){\n          selectTab('dev');\n        }else{\n          showPatch(0);\n        }\n      }\n    }\n  );\n\n  if(document.readyState==='loading'){\n    document.addEventListener(\n      'DOMContentLoaded',\n      start,\n      {once:true}\n    );\n  }else{\n    start();\n  }\n\n  window.addEventListener(\n    'load',\n    ()=>{\n      installApi();\n      installButton();\n    },\n    {once:true}\n  );\n})();"
          CSS_CONTENT="/* MHUR Nexus — V608 : rendu Patch Notes restauré */\n\n#s18NotesDevModalV10\n.s18PatchSkillV10.s18NoSkillImageV608,\n#s18NotesDevModalV10\n.s18PatchSkillV10:not(:has(>div)){\n  display:block!important;\n  width:100%!important;\n  min-width:0!important;\n}\n\n#s18NotesDevModalV10\n.s18PatchSkillV10.s18NoSkillImageV608>main,\n#s18NotesDevModalV10\n.s18PatchSkillV10:not(:has(>div))>main{\n  display:block!important;\n  width:100%!important;\n  max-width:none!important;\n  grid-column:1 / -1!important;\n}\n\n#s18NotesDevModalV10\n.s18PatchImageV608 img,\n#s18NotesDevModalV10\n.s18PatchPortraitV10 img{\n  display:block!important;\n  width:100%!important;\n  height:100%!important;\n  object-fit:contain!important;\n}\n\n#s18NotesDevModalV10\n[data-v608-patch-content]{\n  display:block!important;\n  width:100%!important;\n  min-height:120px!important;\n}\n\n#s18NotesDevModalV10\n.s18NotesBodyV10>main:empty::after{\n  content:'Loading Patch Notes…';\n  display:block;\n  padding:24px;\n  color:#fff;\n  font-weight:800;\n}\n\n@media(max-width:760px){\n  #s18NotesDevModalV10\n  .s18PatchTableWrapV10{\n    width:100%!important;\n    max-width:100%!important;\n    overflow-x:auto!important;\n    -webkit-overflow-scrolling:touch!important;\n  }\n}"

          def fail(message):
              raise RuntimeError(message)

          def read(path):
              if not path.is_file():
                  fail("Fichier introuvable : "+path.as_posix())

              return path.read_text(encoding="utf-8-sig")

          def write(path,content):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(
                  content.rstrip()+"\n",
                  encoding="utf-8",
              )

          def remove_old_references(html):
              old_scripts=[
                  "v598-images-notes-stable",
                  "v598b-patch-images-exactes",
                  "v599-armored-portrait",
                  "v600-single-patch",
                  "v602-patch-images-fix",
                  "v605-midoriya-alpha-fix",
                  "v606-midoriya-alpha-final",
                  "v606b-midoriya-alpha-fix",
                  "v607-patch-images",
                  "v608-patch-notes-final",
              ]

              for name in old_scripts:
                  html=re.sub(
                      r"\s*<script\b[^>]*src=['\"][^'\"]*"
                      +re.escape(name)+
                      r"[^'\"]*['\"][^>]*>\s*</script>\s*",
                      "\n",
                      html,
                      flags=re.I,
                  )

                  html=re.sub(
                      r"\s*<link\b[^>]*href=['\"][^'\"]*"
                      +re.escape(name)+
                      r"[^'\"]*['\"][^>]*>\s*",
                      "\n",
                      html,
                      flags=re.I,
                  )

              html=re.sub(
                  r"\s*<link\b[^>]*href=['\"][^'\"]*"
                  r"v608-patch-notes-final\.css"
                  r"[^'\"]*['\"][^>]*>\s*",
                  "\n",
                  html,
                  flags=re.I,
              )

              return html

          def patch_index():
              html=remove_old_references(read(INDEX))

              if "</head>" not in html:
                  fail("Balise </head> introuvable.")

              if "</body>" not in html:
                  fail("Balise </body> introuvable.")

              preloads=[
                  "assets/midoriya/midoriya_assault/alpha.webp",
                  "assets/midoriya/midoriya_attack/alpha.webp",
                  "assets/midoriya_ofa/alpha.webp",
              ]

              for path in preloads:
                  html=re.sub(
                      r"\s*<link\b[^>]*rel=['\"]preload['\"]"
                      r"[^>]*href=['\"]/?"
                      +re.escape(path)+
                      r"(?:\?[^'\"]*)?['\"][^>]*>\s*",
                      "\n",
                      html,
                      flags=re.I,
                  )

              head_additions=[
                  '<link rel="preload" as="image" '
                  'href="/'+path+'?v=608" fetchpriority="high">'
                  for path in preloads
              ]

              head_additions.append(
                  '<link rel="stylesheet" '
                  'href="css/v608-patch-notes-final.css?v=608">'
              )

              html=html.replace(
                  "</head>",
                  "\n"
                  +"\n".join(head_additions)
                  +"\n</head>",
                  1,
              )

              html=html.replace(
                  "</body>",
                  '\n<script '
                  'src="js/v608-patch-notes-final.js?v=608">'
                  '</script>\n</body>',
                  1,
              )

              write(INDEX,html)

          def verify():
              errors=[]
              html=read(INDEX)
              js=read(JS)
              stylesheet=read(CSS)

              for resource in (
                  "css/v608-patch-notes-final.css?v=608",
                  "js/v608-patch-notes-final.js?v=608",
              ):
                  if resource not in html:
                      errors.append(
                          "Référence absente : "+resource
                      )

              if html.count("v608-patch-notes-final.js")!=1:
                  errors.append(
                      "Le JavaScript V608 est dupliqué."
                  )

              if html.count("v608-patch-notes-final.css")!=1:
                  errors.append(
                      "Le CSS V608 est dupliqué."
                  )

              for required in (
                  "function midoriyaStyleId",
                  "function resolveStyle",
                  "function patchDetailHtml",
                  "function showPatch",
                  "function openNotes",
                  "data-v608-patch-content",
                  "window.MHUR_V608",
              ):
                  if required not in js:
                      errors.append(
                          "Correctif absent : "+required
                      )

              for required in (
                  "assets/midoriya/midoriya_assault/alpha.webp",
                  "assets/midoriya/midoriya_attack/alpha.webp",
                  "assets/midoriya_ofa/alpha.webp",
              ):
                  if required not in html:
                      errors.append(
                          "Préchargement absent : "+required
                      )

              if "s18NoSkillImageV608" not in stylesheet:
                  errors.append(
                      "Mise en page V608 absente."
                  )

              syntax=subprocess.run(
                  ["node","--check",str(JS)],
                  text=True,
                  capture_output=True,
              )

              if syntax.returncode:
                  errors.append(
                      "Syntaxe JavaScript invalide : "
                      +syntax.stderr
                  )

              if errors:
                  fail(
                      "Vérification V608 échouée :\n- "
                      +"\n- ".join(errors)
                  )

          def main():
              if not INDEX.is_file():
                  fail("public/index.html est introuvable.")

              write(JS,JS_CONTENT)
              write(CSS,CSS_CONTENT)
              patch_index()
              verify()

              report=[
                  "MHUR FRANCE — RAPPORT V608",
                  "",
                  "PATCH NOTES VIDE",
                  "- Nouveau rendu autonome chargé après season18-fixes.js.",
                  "- Le bouton Patch Notes utilise le rendu V608.",
                  "- Les onglets Patch Notes et Dev Notes restent fonctionnels.",
                  "- Le titre est affiché avant le traitement des détails.",
                  "- Une donnée imparfaite ne peut plus laisser tout le panneau vide.",
                  "",
                  "MIDORIYA",
                  "- Air Force sélectionne le style assault.",
                  "- Full Bullet sélectionne le style fullbullet.",
                  "- Airblast sélectionne le style ofa.",
                  "- Les images viennent des compétences locales du style exact.",
                  "- skill_image ne peut plus imposer Gamma ou Action spéciale à Midoriya.",
                  "- HP / PV n'affiche aucune image de compétence.",
                  "",
                  "VITESSE",
                  "- loading=eager.",
                  "- fetchpriority=high.",
                  "- préchargement des trois Alpha Midoriya.",
                  "- aucun MutationObserver permanent.",
                  "- aucun remplacement tardif des images.",
                  "",
                  "SÉCURITÉ",
                  "- season18-fixes.js n'est pas modifié.",
                  "- les pages personnages ne sont pas modifiées.",
              ]

              write(REPORT,"\n".join(report))

              print("[OK] V608 appliqué et vérifié.")
              print("[OK] Le Patch Note ne peut plus rester vide.")
              print("[OK] Les trois Alpha Midoriya utilisent leur style exact.")
              print("[OK] Les pages personnages ne sont pas modifiées.")

          if __name__=="__main__":
              main()
          PY

