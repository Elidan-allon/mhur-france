name: MHUR V650 - Centrage styles via CSS déjà chargé

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v650-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v650-style-center
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer le centrage sans rechercher styleGrid
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          printf '%s' '' | base64 --decode > /tmp/apply_v650.py
          printf '%s' '' | base64 --decode > /tmp/verify_v650.py
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/apply_v650.py
            python3 /tmp/verify_v650.py
          
            git rm -f --ignore-unmatch     .github/workflows/mhur-v646-auto.yml     .github/workflows/mhur-v648-auto.yml     .github/workflows/mhur-v649-auto.yml
          
            git add     public/index.html     public/css/v587-images-notes-stable.css     RAPPORT_V650_STYLES_CENTRES_FINAL.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V650 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: centrer définitivement les styles V650"
          
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] V650 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V650."
          exit 1
