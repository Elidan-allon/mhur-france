      - name: Vérifier Twice et les mises à jour V43
        shell: bash
        run: |
          set -euo pipefail
          echo "Vérifier Twice et les mises à jour V43" > /tmp/mhur_stage

          test -f public/js/v38-twice-final.js
          grep -q "v38-twice-final.js?v=38" public/index.html
          grep -q "MHUR_V38_FLEXIBLE_BASE_VALUES" mise_a_jour/outils/update_ultrarumble_data.py
          grep -q "MHUR_V38_SHARED_SPECIAL_IMAGE" mise_a_jour/outils/update_ultrarumble_data.py
          grep -q "MHUR_V38_DYNAMIC_DISCOUNTS" mise_a_jour/outils/season18_postprocess.py
          grep -q "MHUR_V38_PATCH_DEDUPE" mise_a_jour/outils/season18_postprocess.py
          grep -q "MHUR_V38_PATCH_TRANSLATIONS" public/js/season18-fixes.js
          grep -q "MHUR_V39_FLEXIBLE_LEVEL_EFFECTS" \
            mise_a_jour/outils/update_ultrarumble_data.py
          grep -q "MHUR_V40_FLEXIBLE_BASE_VALUES" \
            mise_a_jour/outils/update_ultrarumble_data.py

          node --check public/js/v38-twice-final.js
          node --check public/js/season18-fixes.js

          python - <<'PY'
          import json
          import re
          import unicodedata
          from pathlib import Path

          def norm(value):
              value = unicodedata.normalize("NFD", str(value or ""))
              value = "".join(
                  ch for ch in value
                  if unicodedata.category(ch) != "Mn"
              )
              return re.sub(
                  r"[^a-z0-9]+",
                  "_",
                  value.lower().replace("'", ""),
              ).strip("_")

          exact_path = Path(
              "public/data/ultrarumble/characters_exact.json"
          )
          home_path = Path("public/data/home_data.json")

          exact = json.loads(
              exact_path.read_text(encoding="utf-8")
          )
          home = json.loads(
              home_path.read_text(encoding="utf-8")
          )

          twice = [
              row for row in exact
              if isinstance(row, dict)
              and norm(
                  row.get("base_name")
                  or row.get("name")
              ) == "twice"
          ]

          if not twice:
              raise SystemExit(
                  "[V38][ERREUR] Twice absent des données exactes."
              )

          support = next(
              (
                  row for row in twice
                  if norm(row.get("role")) == "support"
                  or any(
                      token in " ".join(
                          norm(
                              (
                                  (row.get("skills") or {})
                                  .get(symbol) or {}
                              ).get("name")
                          )
                          for symbol in ("α", "β", "γ")
                      )
                      for token in (
                          "critical_tape_measure",
                          "sad_mans_parade",
                          "help_duplicate",
                      )
                  )
              ),
              None,
          )

          if not support:
              raise SystemExit(
                  "[V38][ERREUR] Style Soutien de Twice introuvable."
              )

          for symbol in ("α", "β", "γ"):
              skill = (
                  (support.get("skills") or {})
                  .get(symbol) or {}
              )

              effects = (
                  skill.get("level_up_effects") or {}
              ).get("rows") or []

              base = (
                  skill.get("base_values") or {}
              ).get("rows") or []

              if not effects:
                  raise SystemExit(
                      f"[V39][ERREUR] Effets de montée {symbol} toujours absents après le parseur V39."
                  )

              if not base:
                  raise SystemExit(
                      f"[V40][ERREUR] Valeurs de base {symbol} toujours absentes après le parseur V40."
                  )

          discounts = home.get("discounts") or []

          if not isinstance(discounts, list) or not discounts:
              raise SystemExit(
                  "[V38][ERREUR] Réductions de points vides."
              )

          versions = {}

          for note in home.get("patch_notes") or []:
              if not isinstance(note, dict):
                  continue

              title = str(note.get("title") or "")
              match = re.search(
                  r"\bv\d+(?:\.\d+)+(?:-\d+(?:\.\d+)*)?\b",
                  title,
                  re.I,
              )

              if not match:
                  continue

              key = match.group(0).lower()
              versions[key] = versions.get(key, 0) + 1

          duplicates = [
              key for key, count in versions.items()
              if count > 1
          ]

          if duplicates:
              raise SystemExit(
                  "[V38][ERREUR] Patch Notes en double : "
                  + ", ".join(duplicates)
              )

          print(
              "[V38][OK] Twice + Effets de montée + "
              "Base Values + réductions + Patch Notes uniques."
          )
          PY

          echo "✅ Vérifications V38 réussies."

