          test -f mise_a_jour/outils/v43_finalize_home.py

          grep -q "v42-final-three-fixes.js?v=42" public/index.html
          grep -q "MHUR_V42_DISCOUNT_ENRICH" \
            mise_a_jour/outils/season18_postprocess.py

          node --check public/js/v42-final-three-fixes.js
          python -m py_compile \
            mise_a_jour/outils/season18_postprocess.py \
            mise_a_jour/outils/v43_finalize_home.py

          grep -q "Parade misérable" \
            public/js/v42-final-three-fixes.js
          grep -q "Nouveau contenu ajouté" \
            public/js/v42-final-three-fixes.js
          grep -q "s18PlannedIncoming" \
            public/js/v42-final-three-fixes.js

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          home = json.loads(
              Path("public/data/home_data.json")
              .read_text(encoding="utf-8")
          )

          meta = home.get("meta") or {}

          if not meta.get("v43_finalized"):
              raise SystemExit(
                  "[V43][ERREUR] finalisation home_data non exécutée."
              )

          release = next(
              (
                  row for row in (home.get("latest_releases") or [])
                  if isinstance(row, dict)
                  and str(row.get("title") or "").strip().lower() == "twice"
              ),
              None,
          )

          if not release:
              raise SystemExit(
                  "[V43][ERREUR] sortie Twice absente de home_data."
              )

          if release.get("word") != "NEW!":
              raise SystemExit(
                  "[V43][ERREUR] Twice n'est pas marqué NEW."
              )

          if release.get("releaseDate") != "2026-08-19T13:00:00+09:00":
              raise SystemExit(
                  "[V43][ERREUR] date de sortie Twice incorrecte."
              )

          target = next(
              (
                  row for row in (home.get("discounts") or [])
                  if isinstance(row, dict)
                  and re.search(
                      r"Sad Man['’]s Parade|Parade misérable",
                      str(
                          row.get("name")
                          or row.get("name_en")
                          or row.get("name_fr")
                          or ""
                      ),
                      re.I,
                  )
              ),
              None,
          )

          if target:
              # Diagnostic only for style_id: the browser V42 can still
              # resolve it from the live character/style tables.
              if str(target.get("role") or "").lower() != "support":
                  raise SystemExit(
                      "[V43][ERREUR] réduction Twice sans rôle Support."
                  )

              if target.get("name_fr") != "Parade misérable":
                  raise SystemExit(
                      "[V43][ERREUR] nom FR réduction Twice incorrect."
                  )

              if not str(target.get("image") or "").strip():
                  raise SystemExit(
                      "[V43][ERREUR] réduction Twice sans image."
                  )

              if not str(target.get("style_id") or "").strip():
                  print(
                      "::warning::style_id Twice non résolu dans le JSON ; "
                      "la couche finale V42 le résoudra côté navigateur."
                  )

          print(
              "[V43][OK] NEW Twice + réduction + "
              "Patch Notes peuvent aller en bêta."
          )
          PY

          echo "✅ Vérification V43 terminée."

      - name: Détecter un vrai changement
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          echo "Analyser les changements" > /tmp/mhur_stage

          # Les fichiers de diagnostic seuls ne créent pas une bêta.
          ignored='^(public/data/ultrarumble/synchronisation_state\.json|public/data/ultrarumble/derniere_synchronisation\.json|public/data/ultrarumble/synchronisation_ultrarumble\.log|public/data/diagnostic_data\.js)$'

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/all_changed.txt

          grep -Ev "$ignored" /tmp/all_changed.txt > /tmp/substantive_changed.txt || true

          echo "Fichiers détectés :"
          cat /tmp/all_changed.txt || true

          echo "Fichiers substantiels :"
          cat /tmp/substantive_changed.txt || true

          if [ ! -s /tmp/substantive_changed.txt ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            # Nettoyage des timestamps/diagnostics non utiles.
            git restore -- \
              public/data/ultrarumble/synchronisation_state.json \
              public/data/ultrarumble/derniere_synchronisation.json \
              public/data/ultrarumble/synchronisation_ultrarumble.log \
              public/data/diagnostic_data.js \
              2>/dev/null || true

            echo "✅ Aucun changement visible à proposer."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Construire le rapport humain V35
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Construire le rapport humain V35" > /tmp/mhur_stage

          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          # ==========================================================
          # OUTILS
          # ==========================================================
          def git_json(path):
              try:
                  raw = subprocess.check_output(
                      ["git", "show", f"origin/main:{path}"],
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                  )
                  return json.loads(raw)
              except Exception:
                  return None

          def local_json(path):
              try:
                  return json.loads(
                      Path(path).read_text(encoding="utf-8")
                  )
              except Exception:
                  return None

          def clean(value):
              return re.sub(r"\s+", " ", str(value or "")).strip()

          def norm(value):
              value = clean(value).lower()
              replacements = {
                  "é": "e", "è": "e", "ê": "e", "ë": "e",
                  "à": "a", "â": "a",
                  "ù": "u", "û": "u",
                  "ô": "o",
                  "î": "i", "ï": "i",
                  "ç": "c",
              }
              for old, new in replacements.items():
                  value = value.replace(old, new)
              return re.sub(r"[^a-z0-9]+", "_", value).strip("_")

          def pretty(value):
              if value is None or value == "":
                  return "—"
              try:
                  number = float(value)
                  if number.is_integer():
                      return str(int(number))
                  return str(number)
              except Exception:
                  return clean(value)

          def short_list(value):
              if value is None:
                  return "—"

              if isinstance(value, list):
                  values = [pretty(v) for v in value]
                  if len(values) <= 10:
                      return " / ".join(values)
                  return (
                      " / ".join(values[:10])
                      + f" / … (+{len(values)-10})"
                  )

              if isinstance(value, dict):
                  parts = [
                      f"{clean(k)}: {pretty(v)}"
                      for k, v in value.items()
                  ]
                  if len(parts) <= 8:
                      return ", ".join(parts)
                  return (
                      ", ".join(parts[:8])
                      + f", … (+{len(parts)-8})"
                  )

              return pretty(value)

          def same(a, b):
              return json.dumps(
                  a,
                  ensure_ascii=False,
                  sort_keys=True,
                  default=str,
              ) == json.dumps(
                  b,
                  ensure_ascii=False,
                  sort_keys=True,
                  default=str,
              )

          def char_name(row):
              if not isinstance(row, dict):
                  return "Personnage"
              return clean(
                  row.get("base_name")
                  or row.get("name")
                  or row.get("style_header")
                  or "Personnage"
              )

          def style_name(row):
              if not isinstance(row, dict):
                  return ""
              return clean(
                  row.get("style_name")
                  or row.get("style_header")
                  or ""
              )

          def style_suffix(row):
              style = style_name(row)
              if not style or norm(style) in {
                  "original", "default", "base"
              }:
                  return ""
              return f" — {style}"

          def style_key(row):
              if not isinstance(row, dict):
                  return ("", "", "")
              return (
                  clean(
                      row.get("source_url")
                      or row.get("base_name")
                      or row.get("name")
                      or ""
                  ),
                  clean(
                      row.get("style_header")
                      or row.get("style_name")
                      or ""
                  ),
                  clean(row.get("style_name") or ""),
              )

          def find_col(cols, *names):
              normalized = [norm(c) for c in cols]
              for name in names:
                  if name in normalized:
                      return normalized.index(name)
              return -1

          def table_values(table):
              if not isinstance(table, dict):
                  return {}

              cols = [
                  clean(x)
                  for x in (
                      table.get("columns")
                      or table.get("cols")
                      or []
                  )
              ]
              rows = [
                  [clean(x) for x in row]
                  for row in (table.get("rows") or [])
                  if isinstance(row, list)
              ]

              level_i = find_col(cols, "level", "niveau")
              type_i = find_col(cols, "type")

              if level_i < 0:
                  for row in rows:
                      for index, value in enumerate(row):
                          if re.fullmatch(
                              r"Lv\.\d+",
                              value,
                              re.I,
                          ):
                              level_i = index
                              break
                      if level_i >= 0:
                          break

              field_indexes = {
                  "Dégâts": find_col(
                      cols, "damage", "degats", "degat"
                  ),
                  "Munitions": find_col(
                      cols,
                      "ammo",
                      "munitions",
                      "no_of_rounds",
                      "rounds",
                  ),
                  "Recharge": find_col(
                      cols, "reload", "recharge"
                  ),
                  "Brise-garde": find_col(
                      cols,
                      "guard_break",
                      "guardbreak",
                      "brise_garde",
                  ),
              }

              result = {}
              cycles = {}
              last_type = "Base"

              for row in rows:
                  if (
                      level_i < 0
                      or level_i >= len(row)
                  ):
                      continue

                  level = clean(row[level_i])
                  if not re.fullmatch(
                      r"Lv\.\d+",
                      level,
                      re.I,
                  ):
                      continue

                  type_value = last_type
                  if (
                      type_i >= 0
                      and type_i < len(row)
                      and clean(row[type_i])
                  ):
                      type_value = clean(row[type_i])
                      last_type = type_value

                  if level.lower() == "lv.1":
                      cycles[type_value] = (
                          cycles.get(type_value, 0) + 1
                      )

                  cycle = cycles.get(type_value, 1)

                  for field_label, index in field_indexes.items():
                      if (
                          index < 0
                          or index >= len(row)
                          or clean(row[index]) == ""
                      ):
                          continue

                      result[
                          (
                              type_value or "Base",
                              cycle,
                              level,
                              field_label,
                          )
                      ] = clean(row[index])

              return result

          def skill_name(symbol, skill):
              if not isinstance(skill, dict):
                  return symbol
              name = clean(
                  skill.get("name")
                  or skill.get("skill_name")
                  or ""
              )
              return f"{symbol} {name}".strip()

          def category_from_label(label):
              key = norm(label)
              if key in {
                  "health",
                  "hp",
                  "pv",
                  "max_main_health",
              }:
                  return "pv"
              if key in {
                  "damage",
                  "degats",
                  "degat",
              }:
                  return "damage"
              if key in {
                  "guard_break",
                  "guardbreak",
                  "brise_garde",
              }:
                  return "guard"
              if key in {
                  "ammo",
                  "munitions",
                  "magazine",
                  "no_of_rounds",
              }:
                  return "ammo"
              return key or "other"

          # ==========================================================
          # CHANGEMENTS RÉELS DES PERSONNAGES
          # ==========================================================
          old_exact = git_json(
              "public/data/ultrarumble/characters_exact.json"
          )
          new_exact = local_json(
              "public/data/ultrarumble/characters_exact.json"
          )

          live = []

          if (
              isinstance(old_exact, list)
              and isinstance(new_exact, list)
          ):
              old_by = {
                  style_key(row): row
                  for row in old_exact
                  if isinstance(row, dict)
              }
              new_by = {
                  style_key(row): row
                  for row in new_exact
                  if isinstance(row, dict)
              }

              for key in sorted(set(old_by) | set(new_by)):
                  before = old_by.get(key)
                  after = new_by.get(key)

                  if before is None and after is not None:
                      character = char_name(after)
                      live.append({
                          "character": character,
                          "style": style_name(after),
                          "skill": "",
                          "category": "new",
                          "text": (
                              f"🆕 {character}{style_suffix(after)} : "
                              "nouveau style/personnage ajouté"
                          ),
                      })
                      continue

                  if after is None and before is not None:
                      character = char_name(before)
                      live.append({
                          "character": character,
                          "style": style_name(before),
                          "skill": "",
                          "category": "removed",
                          "text": (
                              f"🗑️ {character}{style_suffix(before)} : "
                              "style/personnage retiré"
                          ),
                      })
                      continue

                  character = char_name(after)
                  suffix = style_suffix(after)

                  old_stats = before.get("stats") or {}
                  new_stats = after.get("stats") or {}

                  old_hp = old_stats.get("Max Main Health")
                  new_hp = new_stats.get("Max Main Health")

                  if not same(old_hp, new_hp):
                      live.append({
                          "character": character,
                          "style": style_name(after),
                          "skill": "",
                          "category": "pv",
                          "text": (
                              f"❤️ {character}{suffix} — PV : "
                              f"{pretty(old_hp)} → {pretty(new_hp)} "
                              f"(maintenant {pretty(new_hp)} PV)"
                          ),
                      })

                  old_role = clean(before.get("role") or "")
                  new_role = clean(after.get("role") or "")

                  if old_role != new_role:
                      live.append({
                          "character": character,
                          "style": style_name(after),
                          "skill": "",
                          "category": "role",
                          "text": (
                              f"🎨 {character}{suffix} — rôle : "
                              f"{old_role or '—'} → "
                              f"{new_role or '—'}"
                          ),
                      })

                  old_skills = before.get("skills") or {}
                  new_skills = after.get("skills") or {}

                  for symbol in ("α", "β", "γ"):
                      old_skill = old_skills.get(symbol) or {}
                      new_skill = new_skills.get(symbol) or {}

                      display_skill = skill_name(
                          symbol,
                          new_skill or old_skill
                      )

                      for source_field in (
                          "base_values",
                          "additional_values",
                      ):
                          old_map = table_values(
                              old_skill.get(source_field) or {}
                          )
                          new_map = table_values(
                              new_skill.get(source_field) or {}
                          )

                          for row_key in sorted(
                              set(old_map) | set(new_map)
                          ):
                              old_value = old_map.get(row_key)
                              new_value = new_map.get(row_key)

                              if same(old_value, new_value):
                                  continue

                              (
                                  type_value,
                                  cycle,
                                  level,
                                  field_label,
                              ) = row_key

                              type_text = ""
                              if norm(type_value) != "base":
                                  type_text = f" — {type_value}"

                              cycle_text = (
                                  f" (série {cycle})"
                                  if cycle > 1
                                  else ""
                              )

                              live.append({
                                  "character": character,
                                  "style": style_name(after),
                                  "skill": display_skill,
                                  "category": category_from_label(
                                      field_label
                                  ),
                                  "text": (
                                      f"⚔️ {character}{suffix} — "
                                      f"{display_skill}{type_text}"
                                      f"{cycle_text} — "
                                      f"{field_label} {level} : "
                                      f"{pretty(old_value)} → "
                                      f"{pretty(new_value)} "
                                      f"(maintenant {pretty(new_value)})"
                                  ),
                              })

          # ==========================================================
          # CHANGEMENTS DE CONTENU DES PATCH NOTES
          # ==========================================================
          old_home = git_json("public/data/home_data.json")
          new_home = local_json("public/data/home_data.json")

          def patch_entries(data):
              if not isinstance(data, dict):
                  return {}

              result = {}
              occurrence = {}

              for note_index, note in enumerate(
                  data.get("patch_notes") or []
              ):
                  if not isinstance(note, dict):
                      continue

                  note_id = clean(
                      note.get("id")
                      or note.get("version")
                      or note.get("title")
                      or f"note_{note_index}"
                  )

                  for section in note.get("details") or []:
                      if not isinstance(section, dict):
                          continue

                      section_title = clean(
                          section.get("title")
                          or section.get("name")
                          or ""
                      )

                      for change in section.get("changes") or []:
                          if not isinstance(change, dict):
                              continue

                          character = clean(
                              change.get("character") or ""
                          )
                          style = clean(
                              change.get("style") or ""
                          )
                          skill = clean(
                              change.get("display_skill_name")
                              or change.get("skill_name")
                              or ""
                          )
                          label = clean(
                              change.get("label") or ""
                          )

                          base_key = (
                              note_id,
                              section_title,
                              character,
                              style,
                              skill,
                              label,
                          )

                          occurrence[base_key] = (
                              occurrence.get(base_key, 0) + 1
                          )

                          key = (
                              *base_key,
                              occurrence[base_key],
                          )

                          result[key] = {
                              "note_id": note_id,
                              "character": character,
                              "style": style,
                              "skill": skill,
                              "label": label,
                              "before": (
                                  change.get("before")
                                  if "before" in change
                                  else change.get("old")
                              ),
                              "after": (
                                  change.get("after")
                                  if "after" in change
                                  else change.get("new")
                              ),
                          }

              return result

          old_patch = patch_entries(old_home)
          new_patch = patch_entries(new_home)
          patch = []

          for key in sorted(set(old_patch) | set(new_patch)):
              before = old_patch.get(key)
              after = new_patch.get(key)

              if before is None and after is not None:
                  character = (
                      after["character"]
                      or "Patch Notes"
                  )
                  skill = (
                      f" — {after['skill']}"
                      if after["skill"]
                      else ""
                  )
                  style = (
                      f" — {after['style']}"
                      if after["style"]
                      and norm(after["style"]) != "original"
                      else ""
                  )
                  label = (
                      f" — {after['label']}"
                      if after["label"]
                      else ""
                  )

                  values = ""
                  if (
                      after["before"] is not None
                      or after["after"] is not None
                  ):
                      values = (
                          f" : {short_list(after['before'])} → "
                          f"{short_list(after['after'])}"
                      )

                  patch.append({
                      "character": after["character"],
                      "style": after["style"],
                      "skill": after["skill"],
                      "category": category_from_label(
                          after["label"]
                      ),
                      "text": (
                          f"📝 Patch Notes — {character}"
                          f"{style}{skill}{label}{values}"
                      ),
                  })
                  continue

              if after is None and before is not None:
                  character = (
                      before["character"]
                      or "Patch Notes"
                  )
                  skill = (
                      f" — {before['skill']}"
                      if before["skill"]
                      else ""
                  )

                  patch.append({
                      "character": before["character"],
                      "style": before["style"],
                      "skill": before["skill"],
                      "category": category_from_label(
                          before["label"]
                      ),
                      "text": (
                          f"🗑️ Patch Notes — entrée retirée : "
                          f"{character}{skill}"
                      ),
                  })
                  continue

              changed = []

              for field, title in (
                  ("before", "Avant"),
                  ("after", "Après"),
                  ("label", "Type"),
                  ("skill", "Attaque"),
                  ("style", "Style"),
              ):
                  if not same(
                      before.get(field),
                      after.get(field),
                  ):
                      changed.append(
                          f"{title}: "
                          f"{short_list(before.get(field))} → "
                          f"{short_list(after.get(field))}"
                      )

              if changed:
                  character = (
                      after["character"]
                      or "Patch Notes"
                  )
                  skill = (
                      f" — {after['skill']}"
                      if after["skill"]
                      else ""
                  )

                  patch.append({
                      "character": after["character"],
                      "style": after["style"],
                      "skill": after["skill"],
                      "category": category_from_label(
                          after["label"]
                      ),
                      "text": (
                          f"📝 Patch Notes — {character}"
                          f"{skill} — "
                          + "; ".join(changed)
                      ),
                  })

          # ==========================================================
          # ACCUEIL / ÉVÉNEMENTS / LOGIN BONUS
          # ==========================================================
          home_changes = []

          def item_key(item):
              if not isinstance(item, dict):
                  return clean(item)
              return " | ".join(
                  clean(item.get(k) or "")
                  for k in (
                      "title",
                      "name",
                      "type",
                      "start",
                      "end",
                      "date",
                      "image",
                  )
              )

          if (
              isinstance(old_home, dict)
              and isinstance(new_home, dict)
          ):
              for key, label, emoji in (
                  (
                      "login_bonuses",
                      "Bonus de connexion",
                      "🎁",
                  ),
                  ("events", "Événement", "📅"),
                  ("announcements", "Annonce", "📢"),
              ):
                  old_rows = old_home.get(key) or []
                  new_rows = new_home.get(key) or []

                  if not (
                      isinstance(old_rows, list)
                      and isinstance(new_rows, list)
                  ):
                      continue

                  old_set = {
                      item_key(row): row
                      for row in old_rows
                  }
                  new_set = {
                      item_key(row): row
                      for row in new_rows
                  }

                  for signature in sorted(
                      set(new_set) - set(old_set)
                  ):
                      row = new_set[signature]
                      title = (
                          clean(
                              row.get("title")
                              or row.get("name")
                          )
                          if isinstance(row, dict)
                          else clean(row)
                      )
                      home_changes.append(
                          f"{emoji} {label} ajouté : "
                          f"{title or signature}"
                      )

                  for signature in sorted(
                      set(old_set) - set(new_set)
                  ):
                      row = old_set[signature]
                      title = (
                          clean(
                              row.get("title")
                              or row.get("name")
                          )
                          if isinstance(row, dict)
                          else clean(row)
                      )
                      home_changes.append(
                          f"🗑️ {label} retiré : "
                          f"{title or signature}"
                      )

          # ==========================================================
          # SAVOIR SI LE MÊME CHANGEMENT EST DANS LES DEUX
          # ==========================================================
          def comparable(item):
              return (
                  norm(item.get("character")),
                  norm(item.get("skill")),
                  item.get("category") or "",
              )

          patch_comparable = {
              comparable(item)
              for item in patch
              if item.get("character")
          }

          patch_by_character_category = {
              (
                  norm(item.get("character")),
                  item.get("category") or "",
              )
              for item in patch
              if item.get("character")
          }

          for item in live:
              exact = comparable(item)
              broad = (
                  norm(item.get("character")),
                  item.get("category") or "",
              )

              item["also_patch"] = (
                  exact in patch_comparable
                  or broad in patch_by_character_category
              )

          # ==========================================================
          # RAPPORT COMPLET POUR LA PR
          # ==========================================================
          changed_files = [
              line.strip()
              for line in Path(
                  "/tmp/substantive_changed.txt"
              ).read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]

          report = [
              "## MHUR NEXUS — Nouvelle bêta FINAL V35",
              "",
              "### Résumé",
              (
                  f"- **{len(live)}** changement(s) dans les "
                  "données des personnages"
              ),
              (
                  f"- **{len(patch)}** changement(s) dans le "
                  "contenu des Patch Notes"
              ),
              (
                  f"- **{len(home_changes)}** changement(s) sur "
                  "l'accueil / événements"
              ),
              "",
              "### 🎮 Ce qui change réellement dans le jeu",
          ]

          if live:
              for item in live:
                  marker = (
                      " **[aussi dans le Patch Notes]**"
                      if item.get("also_patch")
                      else ""
                  )
                  report.append(
                      f"- {item['text']}{marker}"
                  )
          else:
              report.append(
                  "- Aucun changement chiffré de personnage détecté."
              )

          report.extend([
              "",
              "### 📝 Ce qui change dans les Patch Notes",
          ])

          if patch:
              report.extend(
                  f"- {item['text']}"
                  for item in patch
              )
          else:
              report.append(
                  "- Aucun changement de contenu Patch Notes détecté."
              )

          if home_changes:
              report.extend([
                  "",
                  "### 🏠 Accueil / événements / Login Bonus",
              ])
              report.extend(
                  f"- {line}"
                  for line in home_changes
              )

          both = [
              item
              for item in live
              if item.get("also_patch")
          ]

          if both:
              report.extend([
                  "",
                  "### 🔗 Changements présents dans les deux",
                  (
                      "_Ces changements sont à la fois dans les "
                      "données du personnage et dans le Patch Notes._"
                  ),
              ])
              report.extend(
                  f"- {item['text']}"
                  for item in both
              )

          report.extend([
              "",
              "<details>",
              "<summary>Diagnostic technique — fichiers touchés</summary>",
              "",
          ])
          report.extend(
              f"- `{path}`"
              for path in changed_files
          )
          report.extend([
              "",
              "</details>",
          ])

          Path("/tmp/beta_report.md").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8",
          )

          # ==========================================================
          # RÉSUMÉ DU MESSAGE PRINCIPAL DISCORD
          # ==========================================================
          summary = [
              "📋 **Résumé humain :**",
              (
                  f"• {len(live)} changement(s) personnage(s)"
              ),
              (
                  f"• {len(patch)} changement(s) Patch Notes"
              ),
              (
                  f"• {len(home_changes)} changement(s) accueil/événement"
              ),
          ]

          if both:
              summary.append(
                  f"• {len(both)} changement(s) présent(s) "
                  "dans les données **et** le Patch Notes"
              )

          summary.append(
              "👇 Le détail exact est envoyé juste après ce message."
          )

          Path(
              "/tmp/beta_report_discord.txt"
          ).write_text(
              "\n".join(summary),
              encoding="utf-8",
          )

          # ==========================================================
          # TOUS LES DÉTAILS DISCORD, SANS CODE
          # ==========================================================
          human_lines = []

          for item in live:
              prefix = (
                  "🔗 Données + Patch Notes"
                  if item.get("also_patch")
                  else "🎮 Données du personnage"
              )
              human_lines.append(
                  f"{prefix} — {item['text']}"
              )

          for item in patch:
              human_lines.append(
                  f"📝 Patch Notes — {item['text'].removeprefix('📝 Patch Notes — ')}"
              )

          for line in home_changes:
              human_lines.append(
                  f"🏠 Accueil — {line}"
              )

          # Dédupliquer sans changer l'ordre.
          seen = set()
          deduped = []
          for line in human_lines:
              if line in seen:
                  continue
              seen.add(line)
              deduped.append(line)

          if not deduped:
              deduped = [
                  (
                      "Aucun changement métier lisible n'a été "
                      "détecté automatiquement. Consulte la PR "
                      "pour le diagnostic complet."
                  )
              ]

          # Découpage en messages Discord < 1800 caractères.
          chunks = []
          current = []

          for line in deduped:
              candidate = "\n".join(
                  current + [f"• {line}"]
              )

              if len(candidate) > 1650 and current:
                  chunks.append(
                      "\n".join(current)
                  )
                  current = [f"• {line}"]
              else:
                  current.append(f"• {line}")

          if current:
              chunks.append("\n".join(current))

          payload_chunks = []

          for index, chunk in enumerate(chunks, start=1):
              payload_chunks.append(
                  (
                      f"📋 **Détails exacts de la bêta "
                      f"({index}/{len(chunks)})**\n\n"
                      f"{chunk}"
                  )
              )

          Path(
              "/tmp/beta_discord_chunks.json"
          ).write_text(
              json.dumps(
                  payload_chunks,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              Path("/tmp/beta_report.md").read_text(
                  encoding="utf-8"
              )
          )
          PY

