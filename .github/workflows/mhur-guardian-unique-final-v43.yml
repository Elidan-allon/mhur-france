      - name: Attendre la validation Discord immédiate
        id: instant_decision
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        env:
          MESSAGE_ID: ${{ steps.discord_post.outputs.message_id }}
        run: |
          set -euo pipefail
          echo "Attendre la validation Discord immédiate" > /tmp/mhur_stage

          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["DISCORD_BOT_TOKEN"]
          channel = os.environ["DISCORD_CHANNEL_ID"]
          approver = os.environ["DISCORD_APPROVER_USER_ID"]
          message_id = os.environ["MESSAGE_ID"]
          output = os.environ["GITHUB_OUTPUT"]

          headers = {
              "Authorization": f"Bot {token}",
              "User-Agent": "MHUR-Nexus-Guardian-V37",
          }

          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers=headers,
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=20,
                  ) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      )
              except urllib.error.HTTPError as exc:
                  if exc.code == 429:
                      try:
                          payload = json.loads(
                              exc.read().decode("utf-8")
                          )
                          retry = float(
                              payload.get("retry_after", 2)
                          )
                      except Exception:
                          retry = 2

                      time.sleep(
                          max(1, min(retry, 10))
                      )
                      return None

                  raise

          def check_decision():
              emoji = urllib.parse.quote("✅")

              try:
                  users = request_json(
                      f"https://discord.com/api/v10/channels/"
                      f"{channel}/messages/{message_id}/"
                      f"reactions/{emoji}?limit=100"
                  )

                  if isinstance(users, list):
                      if any(
                          str(user.get("id")) == approver
                          for user in users
                      ):
                          return (
                              "approve",
                              "Réaction ✅"
                          )
              except Exception as exc:
                  print(
                      "Réaction Discord temporairement "
                      f"indisponible : {exc}"
                  )

              try:
                  messages = request_json(
                      f"https://discord.com/api/v10/channels/"
                      f"{channel}/messages"
                      f"?after={message_id}&limit=100"
                  )

                  if not isinstance(messages, list):
                      return ("none", "")

                  for message in reversed(messages):
                      author = message.get("author") or {}

                      if str(author.get("id")) != approver:
                          continue

                      content = str(
                          message.get("content") or ""
                      ).strip()

                      upper = content.upper()

                      if upper in {
                          "V",
                          "VALIDER",
                          "VALIDE",
                          "VALIDÉ",
                          "OK V",
                      }:
                          return (
                              "approve",
                              content or "V"
                          )

                      if (
                          upper == "N"
                          or upper == "NON"
                          or upper.startswith("REFUS")
                          or upper.startswith("REJETER")
                      ):
                          return (
                              "reject",
                              content
                          )

              except Exception as exc:
                  print(
                      "Messages Discord temporairement "
                      f"indisponibles : {exc}"
                  )

              return ("none", "")

          # 45 minutes max, vérification toutes les 10 secondes.
          deadline = time.time() + (45 * 60)
          decision = "none"
          feedback = ""

          print(
              "V37 surveille ton ✅ / V "
              "toutes les 10 secondes."
          )

          while time.time() < deadline:
              decision, feedback = check_decision()

              if decision != "none":
                  break

              time.sleep(10)

          with open(
              output,
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write(
                  f"decision={decision}\n"
              )
              handle.write(
                  "feedback="
                  + urllib.parse.quote(
                      feedback,
                      safe="",
                  )
                  + "\n"
              )

          if decision == "approve":
              print(
                  "✅ Validation détectée : "
                  "publication immédiate demandée."
              )
          elif decision == "reject":
              print(
                  "❌ Refus détecté : "
                  "traitement immédiat demandé."
              )
          else:
              print(
                  "ℹ️ Pas de décision pendant 45 minutes. "
                  "Le fallback toutes les 5 minutes reste actif."
              )
          PY

      - name: Déclencher immédiatement la validation V37
        if: >-
          steps.beta.outputs.changed == 'true' &&
          (steps.instant_decision.outputs.decision == 'approve' ||
           steps.instant_decision.outputs.decision == 'reject')
        shell: bash
        run: |
          set -euo pipefail
          echo "Déclencher approval immédiatement V37" > /tmp/mhur_stage

          # V37 : on n'utilise plus le nom du fichier du workflow.
          # On récupère l'ID numérique du workflow qui exécute CE run.
          run_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"

          workflow_id="$(
            printf '%s' "$run_json" \
              | jq -r '.workflow_id // empty'
          )"

          if [ -z "$workflow_id" ] || [ "$workflow_id" = "null" ]; then
            echo "::warning::Impossible de lire le workflow_id du run actuel."
            echo "::warning::Le fallback approval toutes les 5 minutes prendra le relais."
            exit 0
          fi

          echo "Workflow ID courant : $workflow_id"

          cat > /tmp/approval_dispatch.json <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "mode": "approval"
            }
          }
          JSON

          dispatched=0

          for attempt in 1 2 3; do
            set +e

            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
              --input /tmp/approval_dispatch.json \
              > /tmp/approval_dispatch_response.json \
              2> /tmp/approval_dispatch_error.log

            code=$?

            set -e

            if [ "$code" -eq 0 ]; then
              dispatched=1
              break
            fi

            echo "::warning::Déclenchement approval échoué, tentative ${attempt}/3."
            cat /tmp/approval_dispatch_error.log || true

            sleep $((attempt * 2))
          done

          if [ "$dispatched" -eq 1 ]; then
            echo "✅ Mode approval V37 déclenché immédiatement."
            echo "➡️ La publication va démarrer juste après ce scan."
          else
            # Important : ne plus mettre le scan en rouge pour ça.
            # Le cron approval toutes les 5 minutes reste le filet de sécurité.
            echo "::warning::Déclenchement immédiat impossible après 3 tentatives."
            echo "::warning::Le fallback approval toutes les 5 minutes prendra automatiquement le relais."
          fi

      - name: Diagnostic Discord si le scan échoue
        if: failure()
        shell: bash
        run: |
          set +e

          stage="$(cat /tmp/mhur_stage 2>/dev/null || echo 'Étape inconnue')"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          echo "::error::Guardian V43 bloqué à : ${stage}"
          echo "::error::${run_url}"

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          python - "$stage" "$run_url" <<'PY' > /tmp/error_payload.json
          import json
          import sys

          stage = sys.argv[1]
          url = sys.argv[2]

          content = (
              "❌ **MHUR NEXUS — GUARDIAN FINAL V43 BLOQUÉ**\n\n"
              f"**Étape en erreur :** {stage}\n"
              f"🔎 **Détails GitHub :** {url}\n\n"
              "Le site `main` n'est pas modifié tant que la bêta n'est pas validée. "
              "Ouvre l'étape rouge : son message indique le fichier, le secret "
              "ou la commande qui a échoué."
          )

          print(json.dumps({"content": content}, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/error_payload.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null || true

  # ================================================================
  # APPROVAL DISCORD + MERGE + DÉPLOIEMENT PRODUCTION
  # ================================================================
  approval:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'approval')
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_APPROVER_USER_ID: ${{ secrets.DISCORD_APPROVER_USER_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier Node 22
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt 22 ]; then
            echo "::error::Node 22 minimum requis par Wrangler."
            exit 1
          fi

          echo "✅ Node $(node --version) compatible avec Wrangler."

      - name: Configurer Git
        shell: bash
        run: |
          set -euo pipefail
          echo "Configurer la validation" > /tmp/mhur_stage

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Trouver la bêta en attente
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          echo "Trouver la bêta en attente" > /tmp/mhur_stage

          json="$(
            gh pr list \
              --head "$BETA_BRANCH" \
              --base main \
              --state open \
              --limit 1 \
              --json number,url,body,headRefOid
          )"

          number="$(printf '%s' "$json" | jq -r '.[0].number // empty')"

          if [ -z "$number" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Aucune bêta en attente."
            exit 0
          fi

          printf '%s' "$json" | jq -r '.[0].body' > /tmp/pr_body.md

          message_id="$(
            sed -n 's/^MESSAGE_ID=//p' /tmp/pr_body.md | tail -n1
          )"
          expected_sha="$(
            sed -n 's/^HEAD_SHA=//p' /tmp/pr_body.md | tail -n1
          )"
          preview_url="$(
            sed -n 's/^PREVIEW_URL=//p' /tmp/pr_body.md | tail -n1
          )"
          version_tag="$(
            sed -n 's/^VERSION_TAG=//p' /tmp/pr_body.md | tail -n1
          )"

          if [ -z "$message_id" ] ||              [ -z "$expected_sha" ] ||              [ -z "$version_tag" ]; then
            echo "::error::État Guardian V37 incomplet dans la PR."
            exit 1
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$(printf '%s' "$json" | jq -r '.[0].url')" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(printf '%s' "$json" | jq -r '.[0].headRefOid')" >> "$GITHUB_OUTPUT"
          echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Lire V / ✅ / REFUS sur Discord
        id: decision
        if: steps.pr.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Lire la décision Discord" > /tmp/mhur_stage

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || \
             [ -z "${DISCORD_CHANNEL_ID:-}" ] || \
             [ -z "${DISCORD_APPROVER_USER_ID:-}" ]; then
            echo "::error::Secrets Discord incomplets."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["DISCORD_BOT_TOKEN"]
          channel = os.environ["DISCORD_CHANNEL_ID"]
          approver = os.environ["DISCORD_APPROVER_USER_ID"]
          message_id = os.environ["MESSAGE_ID"]

          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bot {token}",
                      "User-Agent": "MHUR-Nexus-Guardian-V26",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          decision = "none"
          feedback = ""

          # 1. Réaction ✅ sur le message bêta.
          emoji = urllib.parse.quote("✅")
          try:
              users = request_json(
                  f"https://discord.com/api/v10/channels/{channel}/messages/"
                  f"{message_id}/reactions/{emoji}?limit=100"
              )
              if any(str(user.get("id")) == approver for user in users):
                  decision = "approve"
          except Exception:
              pass

          # 2. Messages envoyés après la bêta.
          if decision == "none":
              messages = request_json(
                  f"https://discord.com/api/v10/channels/{channel}/messages"
                  f"?after={message_id}&limit=100"
              )

              # API Discord retourne du plus récent au plus ancien.
              messages = list(reversed(messages))

              for message in messages:
                  author = message.get("author") or {}
                  if str(author.get("id")) != approver:
                      continue

                  content = str(message.get("content") or "").strip()
                  upper = content.upper()

                  if upper in {"V", "VALIDER", "VALIDE", "VALIDÉ", "OK V"}:
                      decision = "approve"
                      feedback = content
                      break

                  if (
                      upper == "N"
                      or upper == "NON"
                      or upper.startswith("REFUS")
                      or upper.startswith("REJETER")
                  ):
                      decision = "reject"
                      feedback = content
                      break

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"decision={decision}\n")
              encoded = urllib.parse.quote(feedback, safe="")
              handle.write(f"feedback={encoded}\n")

          print(f"Décision Discord : {decision}")
          PY
        env:
          MESSAGE_ID: ${{ steps.pr.outputs.message_id }}

      - name: Refuser la bêta
        if: steps.decision.outputs.decision == 'reject'
        shell: bash
        run: |
          set -euo pipefail
          echo "Refuser la bêta" > /tmp/mhur_stage

          feedback="$(
            python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.unquote(os.environ.get("VALUE", "")))
          PY
          )"

          gh pr comment \
            "${{ steps.pr.outputs.number }}" \
            --body "❌ Bêta refusée sur Discord : ${feedback:-raison non précisée}"

          gh pr close "${{ steps.pr.outputs.number }}"

          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BETA_BRANCH}" \
            >/dev/null 2>&1 || true

          python - <<'PY' > /tmp/reject_payload.json
          import json
          print(json.dumps({
              "content": (
                  "❌ **MHUR NEXUS — BÊTA REFUSÉE**\n\n"
                  "La bêta a été fermée et n'a pas été publiée sur le vrai site."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/reject_payload.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null || true
        env:
          VALUE: ${{ steps.decision.outputs.feedback }}

      - name: Vérifier que V correspond à la dernière bêta
        if: steps.decision.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          echo "Vérifier la version validée" > /tmp/mhur_stage

          if [ "${{ steps.pr.outputs.head_sha }}" != "${{ steps.pr.outputs.expected_sha }}" ]; then
            echo "::error::La bêta a changé depuis le message Discord."
            exit 1
          fi

      - name: Récupérer et tester la bêta validée
        if: steps.decision.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          echo "Tester la bêta validée" > /tmp/mhur_stage

          git fetch origin main "$BETA_BRANCH"
          git checkout -B "$BETA_BRANCH" "origin/$BETA_BRANCH"

          node --check public/js/v26-exact-stats-runtime.js
          node --check public/js/v28-gentle-additional-split.js
          node --check public/js/v28-patch-notes-final.js
          node --check public/js/v29-patch-notes-detail.js
          node --check public/js/v38-twice-final.js
          node --check public/js/v584-patch-notes-final.js
          node --check public/js/v608-patch-notes-final.js
          node --check public/js/season18-fixes.js

          python -m py_compile \
            mise_a_jour/outils/update_home_data.py \
            mise_a_jour/outils/update_ultrarumble_data.py \
            mise_a_jour/outils/season18_postprocess.py

          python -m http.server 4173 --directory public >/tmp/mhur-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          sleep 2
          curl -fsS http://127.0.0.1:4173/ >/tmp/production-candidate.html
          grep -q "ultrarumble-exact-data" /tmp/production-candidate.html
          grep -q "v26-exact-stats-runtime.js?v=26" /tmp/production-candidate.html
          grep -q "v28-patch-notes-mobile.css?v=28" /tmp/production-candidate.html
          grep -q "v28-gentle-additional-split.js?v=28" /tmp/production-candidate.html
          grep -q "v28-patch-notes-final.js?v=28" /tmp/production-candidate.html
          grep -q "v29-patch-notes-detail.js?v=29" /tmp/production-candidate.html
          grep -q "MHUR_V30_MULTILINGUAL_STYLE" public/js/v608-patch-notes-final.js
          grep -q "mhurV30PatchExactDetail" public/js/v608-patch-notes-final.js

          echo "✅ Bêta V30 validée techniquement."

      - name: Fusionner la bêta validée dans main
        if: steps.decision.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          echo "Fusionner la bêta dans main" > /tmp/mhur_stage

          gh pr merge \
            "${{ steps.pr.outputs.number }}" \
            --squash \
            --delete-branch \
            --subject "✅ MHUR NEXUS — Guardian Unique FINAL V43 validé"

      - name: Promouvoir la Preview validée en production
        if: steps.decision.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          echo "Promouvoir la Preview Cloudflare validée" > /tmp/mhur_stage

          version_tag="${{ steps.pr.outputs.version_tag }}"

          if [ -z "$version_tag" ]; then
            echo "::error::VERSION_TAG Cloudflare absent."
            exit 1
          fi

          npm install --no-save --ignore-scripts wrangler@4.102.0

          npx wrangler versions deploy             --config wrangler.jsonc             --version-tag "${version_tag}@100%"             -y             --message "MHUR NEXUS V43 validé sur Discord"             2>&1 | tee /tmp/wrangler-production.log

          echo "✅ Version $version_tag promue à 100% en production."

      - name: Confirmer la publication sur Discord
        if: steps.decision.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          echo "Confirmer la publication" > /tmp/mhur_stage

          python - <<'PY' > /tmp/success_payload.json
          import json

          print(json.dumps({
              "content": (
                  "✅ **MHUR NEXUS — VERSION PUBLIÉE**\n\n"
                  "Le `V` / ✅ a été accepté.\n"
                  "• tests finaux : OK\n"
                  "• fusion dans `main` : OK\n"
                  "• promotion de la Preview Cloudflare validée : OK\n\n"
                  "🌐 Le vrai site utilise maintenant la version validée."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/success_payload.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null

      - name: Diagnostic Discord si la validation échoue
        if: failure()
        shell: bash
        run: |
          set +e

          stage="$(cat /tmp/mhur_stage 2>/dev/null || echo 'Étape inconnue')"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          echo "::error::Guardian V26 approval bloqué à : ${stage}"
          echo "::error::${run_url}"

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          python - "$stage" "$run_url" <<'PY' > /tmp/approval_error_payload.json
          import json
          import sys

          stage = sys.argv[1]
          url = sys.argv[2]

          print(json.dumps({
              "content": (
                  "❌ **MHUR NEXUS — VALIDATION BLOQUÉE**\n\n"
                  f"**Étape en erreur :** {stage}\n"
                  f"🔎 **Run GitHub :** {url}\n\n"
                  "Si l'étape de fusion n'était pas encore passée, `main` reste inchangé. "
                  "Si la fusion est verte mais la promotion Cloudflare est rouge, lance le mode manuel `deploy` de V32."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/approval_error_payload.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null || true

  # ================================================================
  # DÉPLOIEMENT MANUEL DE SECOURS DU MAIN ACTUEL
  # ================================================================
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier Node 22
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt 22 ]; then
            echo "::error::Node 22 minimum requis par Wrangler."
            exit 1
          fi

          echo "✅ Node $(node --version) compatible avec Wrangler."

      - name: Publier le main actuel sur Cloudflare V33
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] ||              [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Secrets Cloudflare absents."
            exit 1
          fi

          test -f wrangler.jsonc
          test -d public

          npm install --no-save --ignore-scripts wrangler@4.102.0

          short_sha="${GITHUB_SHA:0:12}"
          version_tag="manual-${short_sha}"

          echo "📦 Upload du main actuel : $version_tag"

          npx wrangler versions upload             --config wrangler.jsonc             --tag "$version_tag"             --message "MHUR NEXUS V43 main ${GITHUB_SHA}"             2>&1 | tee /tmp/wrangler-manual-upload.log

          echo "🚀 Promotion du main actuel à 100% en production"

          npx wrangler versions deploy             --config wrangler.jsonc             --version-tag "${version_tag}@100%"             -y             --message "MHUR NEXUS V43 redéploiement manuel"             2>&1 | tee /tmp/wrangler-manual-deploy.log

          echo "✅ Main actuel publié via $version_tag."

      - name: Confirmer le redéploiement
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"content":"✅ **MHUR NEXUS — REDÉPLOIEMENT MANUEL OK**\nLe `main` actuel vient d’être republié sur Cloudflare production."}' \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null
