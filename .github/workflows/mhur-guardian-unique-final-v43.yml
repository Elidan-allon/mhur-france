          import json,re,unicodedata
          from pathlib import Path
          def n(v):
              v=unicodedata.normalize('NFD',str(v or ''))
              v=''.join(x for x in v if unicodedata.category(x)!='Mn')
              return re.sub(r'[^a-z0-9]+','_',v.lower().replace("'",'')).strip('_')
          exact=json.loads(Path('public/data/ultrarumble/characters_exact.json').read_text(encoding='utf-8'))
          home=json.loads(Path('public/data/home_data.json').read_text(encoding='utf-8'))
          twice=[r for r in exact if isinstance(r,dict) and n(r.get('base_name') or r.get('name'))=='twice']
          support=next((r for r in twice if n(r.get('role'))=='support' or 'critical_tape_measure' in ' '.join(n(((r.get('skills') or {}).get(s) or {}).get('name')) for s in ('α','β','γ'))),None)
          if not support: raise SystemExit('[V41][ERREUR] Twice Parade misérable absent')
          a=support.get('assets') or {}
          for k in ('alpha','beta','gamma'):
              if not a.get(k): raise SystemExit(f'[V41][ERREUR] image {k} absente')
          if len({str(a.get('alpha')),str(a.get('beta')),str(a.get('gamma'))})!=3:
              raise SystemExit('[V41][ERREUR] images α/β/γ non distinctes')
          for key,num in (('alpha','unique1'),('beta','unique2'),('gamma','unique3')):
              value=str(a.get(key) or '').lower()
              if 'unique' in value and num not in value:
                  raise SystemExit(f'[V41][ERREUR] mauvais mapping image {key}: {value}')
          discounts=home.get('discounts') or []
          if not discounts: raise SystemExit('[V41][ERREUR] réductions vides')
          legacy=[r for r in discounts if isinstance(r,dict) and '/v559/' in str(r.get('image') or '').lower()]
          if legacy and len(legacy)==len(discounts):
              raise SystemExit('[V41][ERREUR] réductions encore verrouillées sur V559')
          versions={}
          for note in home.get('patch_notes') or []:
              if not isinstance(note,dict): continue
              m=re.search(r'\bv\d+(?:\.\d+)+(?:-\d+(?:\.\d+)*)?\b',str(note.get('title') or ''),re.I)
              if m: versions[m.group(0).lower()]=versions.get(m.group(0).lower(),0)+1
          d=[k for k,v in versions.items() if v>1]
          if d: raise SystemExit('[V41][ERREUR] Patch Notes en double: '+', '.join(d))
          print('[V41][OK] Twice images + discounts + Patch Notes')
          PY

          echo "✅ Vérifications finales V41 réussies."

