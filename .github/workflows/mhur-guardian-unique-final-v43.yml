                  `Valeurs supplémentaires ${symbol}`,
                  `Additional ${symbol} Values`,
                  'type'
                );

                if(effects) tables.push(effects);
                if(base) tables.push(base);
                if(additional) tables.push(additional);

                if(!tables.length && Array.isArray(old.tables)){
                  tables.push(...old.tables);
                }

                return {
                  ...old,
                  letter:symbol,
                  name:names[symbol],
                  img:images[symbol] || old.img || style.portrait,
                  tables
                };
              });

              const specialSource=(
                row.special_action?.values &&
                Array.isArray(row.special_action.values.rows) &&
                row.special_action.values.rows.length
              )
                ?row.special_action.values
                :{
                  columns:['Ammo','Use Ammo','Reload'],
                  rows:[['x1','x1','10s']]
                };

              const specialTable=bilingualTable(
                specialSource,
                "Valeurs de l'action spéciale",
                'Special Action Values'
              );

              style.special={
                ...(style.special || {}),
                name:{fr:FR.special,en:EN.special},
                img:specialImage(row) || style.special?.img || style.portrait,
                tables:specialTable
                  ?[specialTable]
                  :(style.special?.tables || [])
              };

              if(Date.now()>=Date.parse('2026-08-19T13:00:00+09:00')){
                const season=window.MHUR_SEASON18_DATA || (
                  window.MHUR_SEASON18_DATA={}
                );

                ['active_new_content','new_content'].forEach(key=>{
                  const bucket=season[key] || (season[key]={});
                  const list=Array.isArray(bucket.styles)
                    ?bucket.styles.map(String)
                    :[];
                  if(!list.includes(String(styleId))) list.push(String(styleId));
                  bucket.styles=list;
                });

                const home=window.MHUR_HOME_DATA;
                if(home && Array.isArray(home.latest_releases)){
                  home.latest_releases.forEach(release=>{
                    if(normal(release?.title)==='twice'){
                      release.style_id=styleId;
                      release.release_kind='style';
                      release.releaseDate=
                        release.releaseDate ||
                        '2026-08-19T13:00:00+09:00';
                      release.word='NEW!';
                      release.subtitle_fr=FR.style;
                      release.subtitle_en=EN.style;
                    }
                  });
                }
              }

              window.__MHUR_V38_TWICE_STATUS__={
                ok:true,
                styleId,
                style:FR.style,
                alpha:FR.alpha,
                beta:FR.beta,
                gamma:FR.gamma,
                special:FR.special
              };

              return true;
            }

            function install(){
              patch();

              if(
                typeof window.render==='function' &&
                !window.render.__mhurV38Twice
              ){
                const original=window.render;
                const wrapped=function(){
                  patch();
                  return original.apply(this,arguments);
                };
                wrapped.__mhurV38Twice=true;
                window.render=wrapped;
                try{ render=wrapped; }catch(_error){}
              }

              window.addEventListener(
                'mhur:languagechange',
                ()=>patch()
              );
            }

            if(document.readyState==='loading'){
              document.addEventListener('DOMContentLoaded',install,{once:true});
            }else{
              install();
            }

            window.addEventListener('load',()=>setTimeout(patch,0),{once:true});
          })();
          JS

          python -m py_compile /tmp/apply_v38.py
          node --check public/js/v38-twice-final.js
          python /tmp/apply_v38.py
          python -m py_compile \
            mise_a_jour/outils/update_ultrarumble_data.py \
            mise_a_jour/outils/season18_postprocess.py
          node --check public/js/season18-fixes.js

          if [ -n "$(git status --porcelain -- \
            mise_a_jour/outils/update_ultrarumble_data.py \
            mise_a_jour/outils/season18_postprocess.py \
            public/js/season18-fixes.js \
            public/js/v38-twice-final.js \
            public/index.html)" ]; then
            echo "fix_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fix_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Corriger les Effets de montée V39
        id: v39fix
        shell: bash
        run: |
          set -euo pipefail
          echo "Corriger les Effets de montée V39" > /tmp/mhur_stage

          cat > /tmp/apply_v39_level_effects.py <<'PY'
          from pathlib import Path

          path = Path("mise_a_jour/outils/update_ultrarumble_data.py")

          if not path.exists():
              raise SystemExit("[V39][ERREUR] update_ultrarumble_data.py introuvable")

          source = path.read_text(encoding="utf-8")

          if "MHUR_V39_FLEXIBLE_LEVEL_EFFECTS" not in source:
              start = source.find("def parse_level_effects(")
              end = source.find("def parse_base_values(", start)

              if start < 0 or end < 0:
                  raise SystemExit("[V39][ERREUR] parse_level_effects introuvable")

              replacement = r"""# MHUR_V39_FLEXIBLE_LEVEL_EFFECTS
          def parse_level_effects(section: str) -> Dict[str, Any]:
              # Supporte les tableaux ligne-par-ligne ET cellule-par-cellule.
              lines = lines_from_text(section)
              start = -1

              for index, line in enumerate(lines):
                  if "skill_level_up_effects" in norm(line):
                      start = index
                      break

              if start < 0:
                  for index, line in enumerate(lines):
                      if norm(line) in {"level_level_up_effect", "level_up_effect"}:
                          start = max(-1, index - 1)
                          break

              if start < 0:
                  return {"columns": [], "rows": []}

              body = lines[start + 1:]
              rows: List[List[str]] = []

              def is_boundary(value: str) -> bool:
                  return bool(
                      re.match(
                          r"^(?:##\s*)?(?:Base\s*[αβγ]|Additional\s*[αβγ]|Quirk Skill\s*[αβγ]|Special Action|STATS|Tuning Skills|Obtained From)\b",
                          clean(value),
                          re.I,
                      )
                  )

              def is_header(value: str) -> bool:
                  return norm(value) in {
                      "",
                      "image",
                      "level",
                      "level_up_effect",
                      "level_level_up_effect",
                      "skill_level_up_effects",
                  }

              index = 0

              while index < len(body):
                  line = clean(body[index])

                  if is_boundary(line):
                      break

                  if is_header(line):
                      index += 1
                      continue

                  match = re.match(r"^(Lv\.\d+)\s+(.+)$", line, re.I)

                  if match:
                      effect = clean(match.group(2))
                      if effect and not is_header(effect):
                          rows.append([clean(match.group(1)), effect])
                      index += 1
                      continue

                  if re.fullmatch(r"Lv\.\d+", line, re.I):
                      level = line
                      next_index = index + 1
                      parts: List[str] = []

                      while next_index < len(body):
                          candidate = clean(body[next_index])

                          if is_boundary(candidate):
                              break

                          if re.fullmatch(r"Lv\.\d+", candidate, re.I):
                              break

                          if not is_header(candidate):
                              parts.append(candidate)

                          next_index += 1

                      effect = clean(" ".join(parts))

                      if effect:
                          rows.append([level, effect])
                          index = next_index
                          continue

                  index += 1

              return {
                  "columns": ["Level", "Level Up Effect"],
                  "rows": rows,
              }


          """

              source = source[:start] + replacement + source[end:]
              path.write_text(source, encoding="utf-8", newline="\n")
              print("[V39][PATCH] parse_level_effects corrigé.")
          else:
              print("[V39][OK] parse_level_effects déjà corrigé.")
          PY

          python -m py_compile /tmp/apply_v39_level_effects.py
          python /tmp/apply_v39_level_effects.py
          python -m py_compile mise_a_jour/outils/update_ultrarumble_data.py

          if git diff --quiet -- \
            mise_a_jour/outils/update_ultrarumble_data.py; then
            echo "fix_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "fix_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Corriger les Valeurs de base V40
        id: v40fix
        shell: bash
        run: |
          set -euo pipefail
          echo "Corriger les Valeurs de base V40" > /tmp/mhur_stage

          cat > /tmp/apply_v40_base_values.py <<'PY'
          from pathlib import Path

          path = Path("mise_a_jour/outils/update_ultrarumble_data.py")

          if not path.exists():
              raise SystemExit("[V40][ERREUR] update_ultrarumble_data.py introuvable")

          source = path.read_text(encoding="utf-8")

          if "MHUR_V40_FLEXIBLE_BASE_VALUES" not in source:
              start = source.find("def parse_base_values(")
              end = source.find("def parse_additional_values(", start)

              if start < 0 or end < 0:
                  raise SystemExit("[V40][ERREUR] parse_base_values introuvable")

              replacement = r"""# MHUR_V40_FLEXIBLE_BASE_VALUES
          def parse_base_values(section: str, sym: str) -> Dict[str, Any]:
              # Supporte les en-têtes sur une ligne OU une cellule par ligne.
              lines = lines_from_text(section)
              start = -1

              for index, line in enumerate(lines):
                  key = norm(line)
                  wanted = norm(f"Base {sym} Values")

                  if wanted in key or (
                      key.startswith("base_")
                      and "values" in key
                      and norm(sym) in key
                  ):
                      start = index
                      break

              if start < 0:
                  return {"columns": [], "rows": []}

              def is_boundary(value: str) -> bool:
                  return bool(
                      re.match(
                          r"^(?:##\s*)?(?:Additional\s*[αβγ]|Quirk Skill\s*[αβγ]|Special Action|STATS|Tuning Skills|Base\s*[αβγ])\b",
                          clean(value),
                          re.I,
                      )
                  )

              def header_tokens(value: str) -> List[str]:
                  found: List[str] = []
                  pattern = re.compile(
                      r"Use\s+Ammo|Down\s+Power|Level|Damage|Ammo|Reload",
                      re.I,
                  )

                  for match in pattern.finditer(clean(value)):
                      raw = norm(match.group(0))
                      label = {
                          "use_ammo": "Use Ammo",
                          "down_power": "Down Power",
                          "level": "Level",
                          "damage": "Damage",
                          "ammo": "Ammo",
                          "reload": "Reload",
                      }.get(raw)

                      if label and label not in found:
                          found.append(label)

                  return found

              columns: List[str] = []
              first_row = -1

              # UltraRumble peut donner :
              # "Level Damage Ammo Use Ammo Reload Down Power"
              # OU : Level / Damage / Ammo / Use Ammo / Reload / Down Power
              for index in range(start + 1, min(len(lines), start + 30)):
                  line = clean(lines[index])

                  if is_boundary(line):
                      break

                  if re.match(r"^Lv\.\d+\b", line, re.I):
                      first_row = index
                      break

                  for label in header_tokens(line):
                      if label not in columns:
                          columns.append(label)

              if first_row < 0:
                  for index in range(start + 1, min(len(lines), start + 40)):
                      if re.match(r"^Lv\.\d+\b", clean(lines[index]), re.I):
                          first_row = index
                          break

              if not columns or columns[0] != "Level" or len(columns) < 2:
                  return {"columns": [], "rows": []}

              if first_row < 0:
                  return {"columns": columns, "rows": []}

              width = len(columns)
              body = lines[first_row:]
              rows: List[List[str]] = []

              # Format ligne-par-ligne :
              # Lv.1 23 x6 x1 1s 25
              for line in body:
                  line = clean(line)

                  if is_boundary(line):
                      break

                  if not re.match(r"^Lv\.\d+\b", line, re.I):
                      continue

                  parts = line.split()

                  if len(parts) >= width:
                      rows.append(parts[:width])

              # Format cellule-par-cellule :
              # Lv.1 / 23 / x6 / x1 / 1s / 25
              if not rows:
                  index = 0

                  while index < len(body):
                      cell = clean(body[index])

                      if is_boundary(cell):
                          break

                      if re.fullmatch(r"Lv\.\d+", cell, re.I):
                          values = [cell]
                          cursor = index + 1

                          while cursor < len(body) and len(values) < width:
                              candidate = clean(body[cursor])

                              if is_boundary(candidate):
                                  break

                              if re.fullmatch(r"Lv\.\d+", candidate, re.I):
                                  break

                              values.append(candidate)
                              cursor += 1

                          if len(values) == width:
                              rows.append(values)
                              index = cursor
                              continue

                      index += 1

              return {
                  "columns": columns,
                  "rows": rows,
              }


          """

              source = source[:start] + replacement + source[end:]
              path.write_text(source, encoding="utf-8", newline="\n")
              print("[V40][PATCH] parse_base_values corrigé.")
          else:
              print("[V40][OK] parse_base_values déjà corrigé.")
          PY

          python -m py_compile /tmp/apply_v40_base_values.py
          python /tmp/apply_v40_base_values.py
          python -m py_compile mise_a_jour/outils/update_ultrarumble_data.py

          if git diff --quiet -- \
            mise_a_jour/outils/update_ultrarumble_data.py; then
            echo "fix_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "fix_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer la couche finale V41
        id: v41fix
        shell: bash
        run: |
          set -euo pipefail
          echo "Installer la couche finale V41" > /tmp/mhur_stage

          cat > /tmp/apply_v41.py <<'PY'
          from pathlib import Path
          import re

          UPDATER = Path("mise_a_jour/outils/update_ultrarumble_data.py")
          V26 = Path("public/js/v26-exact-stats-runtime.js")
          V38 = Path("public/js/v38-twice-final.js")
          SEASON = Path("public/js/season18-fixes.js")
          LEGACY = Path("public/js/v559-discounts-stable.js")
          INDEX = Path("public/index.html")

          for p in (UPDATER,V26,V38,SEASON,INDEX):
              if not p.exists():
                  raise SystemExit(f"[V41][ERREUR] Fichier introuvable : {p}")

          def save(path,before,after):
              if before != after:
                  path.write_text(after,encoding="utf-8",newline="\n")

          # 1) Description parsing: skip the repeated skill name.
          before=UPDATER.read_text(encoding="utf-8")
          s=before
          if "MHUR_V41_REAL_SKILL_DESCRIPTIONS" not in s:
              needle='''            if line == "Image":\n                continue\n'''
              repl='''            if line == "Image":\n                continue\n            # MHUR_V41_REAL_SKILL_DESCRIPTIONS\n            if norm(line) == norm(name):\n                continue\n'''
              if needle not in s:
                  raise SystemExit("[V41][ERREUR] find_skill_section introuvable")
              s=s.replace(needle,repl,1)
          save(UPDATER,before,s)

          # 2) The V26 exact runtime is the last table writer during render().
          # Translate its FR effect cells and all new subtype names.
          before=V26.read_text(encoding="utf-8")
          s=before
          if "MHUR_V41_FR_EFFECTS" not in s:
              old="""    return String(pick(value) ?? '')\n      .replace(/[\\u3040-\\u30ff\\u3400-\\u9fff\\uf900-\\ufaff]/g, '')\n      .replace(/\\s{2,}/g, ' ')\n      .trim();\n"""
              new="""    return String(pick(value) ?? '')\n      .replace(/[\\u3040-\\u30ff\\u3400-\\u9fff\\uf900-\\ufaff]/g, '')\n      .replace(/\\(\\s*\\)/g, '')\n      .replace(/\\s{2,}/g, ' ')\n      .trim();\n"""
              if old in s: s=s.replace(old,new,1)
              anchor="  function effectTable(symbol, remote, oldTables) {\n"
              helper=r'''  /* MHUR_V41_FR_EFFECTS */
            function translateEffectCell(value, language) {
              let out=clean(value);
              if(language!=='fr') return out;
              const map=[
                [/Clone Battle Time\+/gi,'Durée du clone +'],
                [/Clone Skill Level\+/gi,'Niveau des Alters du clone +'],
                [/No\. of Rounds\+/gi,'Munitions +'],
                [/Reload Speed\+/gi,'Vitesse de recharge +'],
                [/Damage Area\+/gi,'Zone de dégâts +'],
                [/Attack Range\+/gi,"Portée d'attaque +"],
                [/Connection Distance\+/gi,'Distance de connexion +'],
                [/Movement Distance\+/gi,'Distance de déplacement +'],
                [/Dash Range\+/gi,'Distance de ruée +'],
                [/Attack Power\+/gi,"Puissance d'attaque +"],
                [/Defense\+/gi,'Défense +'],
                [/Damage\+/gi,'Dégâts +'],
                [/Ammo\+/gi,'Munitions +'],
                [/Reload\+/gi,'Recharge +'],
                [/Range\+/gi,'Portée +'],
                [/Size\+/gi,'Taille +'],
                [/Speed\+/gi,'Vitesse +']
              ];
              map.forEach(([a,b])=>{out=out.replace(a,b);});
              return out.replace(/\(\s*\)/g,'').replace(/\s{2,}/g,' ').trim();
            }

          '''
              if anchor not in s: raise SystemExit('[V41][ERREUR] effectTable V26 introuvable')
              s=s.replace(anchor,helper+anchor,1)
              oldrows="""        fr: sourceRows.map(row => keep.map(item => clean(row[item.index] ?? ''))),\n        en: sourceRows.map(row => keep.map(item => clean(row[item.index] ?? '')))\n"""
              newrows="""        fr: sourceRows.map(row => keep.map(item =>\n          norm(item.col) === 'level_up_effect'\n            ? translateEffectCell(row[item.index] ?? '', 'fr')\n            : clean(row[item.index] ?? '')\n        )),\n        en: sourceRows.map(row => keep.map(item =>\n          norm(item.col) === 'level_up_effect'\n            ? translateEffectCell(row[item.index] ?? '', 'en')\n            : clean(row[item.index] ?? '')\n        ))\n"""
              if oldrows not in s: raise SystemExit('[V41][ERREUR] effect rows V26 introuvables')
              s=s.replace(oldrows,newrows,1)
              oldmap="""    const mappings = [\n      [['melee_combat', 'melee'], 'Corps à corps', 'Melee Combat'],\n"""
              newmap="""    const mappings = [\n      [['critical'], 'Critique', 'Critical'],\n      [['near', 'nearby'], 'Proximité', 'Near'],\n      [['deploy'], 'Déploiement', 'Deploy'],\n      [['set', 'placement'], 'Placement', 'Set'],\n      [['bodyshot', 'body_shot'], 'Tir corporel', 'Body Shot'],\n      [['clone_shot'], 'Tir du clone', 'Clone Shot'],\n      [['wide_slash'], 'Balayage', 'Wide Slash'],\n      [['thrust'], 'Estoc', 'Thrust'],\n      [['shot'], 'Tir', 'Shot'],\n      [['value'], 'Valeur', 'Value'],\n      [['melee_combat', 'melee'], 'Corps à corps', 'Melee Combat'],\n"""
              if oldmap not in s: raise SystemExit('[V41][ERREUR] typeLabel mappings introuvables')
              s=s.replace(oldmap,newmap,1)
          save(V26,before,s)

          # 3) V38 Twice runtime: direct alpha/beta/gamma asset keys + descriptions.
          before=V38.read_text(encoding="utf-8")
          s=before
          if "MHUR_V41_TWICE_DATA" not in s:
              en='''  const EN = {\n    style: "Sad Man's Parade",\n    alpha: 'Critical Tape Measure',\n    beta: "Sad Man's Parade",\n    gamma: 'Help Duplicate',\n    special: 'Mad Imitation'\n  };\n'''
              desc=r'''  /* MHUR_V41_TWICE_DATA */
            const DESCRIPTIONS={
              alpha:{fr:"Projette les rubans de Twice pour attaquer à distance. Les dégâts critiques sont détaillés séparément dans les valeurs supplémentaires.",en:"Launches Twice's tape measures for a ranged attack. Critical damage is listed separately in the additional values."},
              beta:{fr:"Déploie les doubles de Twice pour attaquer autour de la zone. Les dégâts de proximité, de tir et de déploiement sont détaillés séparément ci-dessous.",en:"Deploys Twice's doubles to attack around the area. Near, shot and deploy damage are listed separately below."},
              gamma:{fr:"Crée un double de soutien. Les différents tirs du double sont détaillés séparément dans les valeurs supplémentaires.",en:"Creates a support duplicate. The duplicate's different shots are listed separately in the additional values."},
              special:{fr:"Achève un adversaire à terre et crée son clone. Le clone reste présent jusqu'à ce qu'il soit vaincu ou que l'adversaire soit réanimé.",en:"Finishes off a downed opponent and creates their clone. The clone remains until defeated or the opponent revives."}
            };
          '''
              if en not in s: raise SystemExit('[V41][ERREUR] EN Twice introuvable')
              s=s.replace(en,en+'\n'+desc,1)
              old=r'''  function quirkImage(row,number){
              const direct=assetByToken(row,`Unique${number}`);
              if(direct) return direct;

              const base=[
                assetByToken(row,'Unique1'),
                assetByToken(row,'Unique2'),
                assetByToken(row,'Unique3')
              ].find(Boolean);

              return base
                ?base.replace(/Unique[123]/i,`Unique${number}`)
                :'';
            }
          '''
              new=r'''  function quirkImage(row,number){
              const namedKey={1:'alpha',2:'beta',3:'gamma'}[number];
              const named=String(row?.assets?.[namedKey] || '');
              if(named) return named;

              const direct=assetByToken(row,`Unique${number}`);
              if(direct) return direct;

              const base=[assetByToken(row,'Unique1'),assetByToken(row,'Unique2'),assetByToken(row,'Unique3')].find(Boolean);
              return base ? base.replace(/Unique[123]/i,`Unique${number}`) :'';
            }
          '''
              if old not in s: raise SystemExit('[V41][ERREUR] quirkImage V38 introuvable')
              s=s.replace(old,new,1)
              oldret="""      return {\n        ...old,\n        letter:symbol,\n        name:names[symbol],\n        img:images[symbol] || old.img || style.portrait,\n        tables\n      };\n"""
              newret="""      const descriptionKey={'α':'alpha','β':'beta','γ':'gamma'}[symbol];\n      return {\n        ...old,\n        letter:symbol,\n        name:names[symbol],\n        img:images[symbol] || old.img || style.portrait,\n        desc:DESCRIPTIONS[descriptionKey],\n        tables\n      };\n"""
              if oldret not in s: raise SystemExit('[V41][ERREUR] return skill Twice introuvable')
              s=s.replace(oldret,newret,1)
              oldsp="""    style.special={\n      ...(style.special || {}),\n      name:{fr:FR.special,en:EN.special},\n      img:specialImage(row) || style.special?.img || style.portrait,\n      tables:specialTable\n        ?[specialTable]\n        :(style.special?.tables || [])\n    };\n"""
              newsp="""    style.special={\n      ...(style.special || {}),\n      name:{fr:FR.special,en:EN.special},\n      img:specialImage(row) || style.special?.img || style.portrait,\n      desc:DESCRIPTIONS.special,\n      tables:specialTable\n        ?[specialTable]\n        :(style.special?.tables || [])\n    };\n"""
              if oldsp not in s: raise SystemExit('[V41][ERREUR] special Twice introuvable')
              s=s.replace(oldsp,newsp,1)
              oldrelease="""            release.releaseDate=\n              release.releaseDate ||\n              '2026-08-19T13:00:00+09:00';\n            release.word='NEW!';\n"""
              newrelease="""            release.releaseDate='2026-08-19T13:00:00+09:00';\n            release.word='NEW!';\n            release.subtitle_fr='Parade misérable · Soutien';\n            release.subtitle_en=\"Sad Man's Parade · Support\";\n"""
              if oldrelease in s: s=s.replace(oldrelease,newrelease,1)
              oldwrap="""      const wrapped=function(){\n        patch();\n        return original.apply(this,arguments);\n      };\n"""
              newwrap="""      const wrapped=function(){\n        patch();\n        const result=original.apply(this,arguments);\n        patch();\n        queueMicrotask(()=>{\n          patch();\n          try{ window.MHUR_V41_UI_REFRESH?.(); }catch(_error){}\n        });\n        return result;\n      };\n"""
              if oldwrap not in s: raise SystemExit('[V41][ERREUR] render wrapper V38 introuvable')
              s=s.replace(oldwrap,newwrap,1)
          save(V38,before,s)

          # 4) Extra Patch Notes translations.
          before=SEASON.read_text(encoding="utf-8")
          s=before
          if "MHUR_V41_PATCH_TRANSLATIONS" not in s:
              anchor="    [/New Content Added/gi,'Nouveau contenu ajouté'],\n"
              extra=r'''    /* MHUR_V41_PATCH_TRANSLATIONS */
