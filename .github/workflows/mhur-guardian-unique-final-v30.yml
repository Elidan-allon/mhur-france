      - name: Construire le rapport détaillé
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Construire le rapport détaillé" > /tmp/mhur_stage

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def git_json(path):
              try:
                  raw = subprocess.check_output(
                      ["git", "show", f"origin/main:{path}"],
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                  )
                  return json.loads(raw)
              except Exception:
                  return None

          def file_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return None

          def style_key(row):
              return (
                  str(row.get("source_url") or ""),
                  str(row.get("style_header") or ""),
                  str(row.get("style_name") or ""),
              )

          def table_map(table):
              if not isinstance(table, dict):
                  return {}
              cols = [str(x) for x in table.get("columns") or []]
              rows = table.get("rows") or []
              try:
                  li = cols.index("Level")
              except ValueError:
                  li = 1 if len(cols) > 1 else 0
              try:
                  ti = cols.index("Type")
              except ValueError:
                  ti = -1
              try:
                  di = cols.index("Damage")
              except ValueError:
                  di = 1 if len(cols) > 1 else -1

              out = {}
              cycles = {}
              for raw in rows:
                  if not isinstance(raw, list):
                      continue
                  row = [str(x) for x in raw]
                  if li >= len(row) or di < 0 or di >= len(row):
                      continue
                  level = row[li]
                  if not level.startswith("Lv."):
                      continue
                  typ = row[ti] if ti >= 0 and ti < len(row) else "Base"
                  cycle_key = typ
                  if level == "Lv.1":
                      cycles[typ] = cycles.get(typ, 0) + 1
                  cycle = cycles.get(typ, 1)
                  out[(typ, cycle, level)] = row[di]
              return out

          old = git_json("public/data/ultrarumble/characters_exact.json")
          new = file_json("public/data/ultrarumble/characters_exact.json")

          details = []

          if isinstance(old, list) and isinstance(new, list):
              old_by = {style_key(row): row for row in old if isinstance(row, dict)}
              new_by = {style_key(row): row for row in new if isinstance(row, dict)}

              for key in sorted(set(old_by) | set(new_by)):
                  before = old_by.get(key)
                  after = new_by.get(key)

                  if before is None and after is not None:
                      details.append(
                          f"🆕 Nouveau style/personnage : {after.get('style_header') or after.get('name')}"
                      )
                      continue

                  if after is None and before is not None:
                      details.append(
                          f"🗑️ Style retiré : {before.get('style_header') or before.get('name')}"
                      )
                      continue

                  name = after.get("style_header") or after.get("name") or "Personnage"

                  old_hp = (before.get("stats") or {}).get("Max Main Health")
                  new_hp = (after.get("stats") or {}).get("Max Main Health")
                  if old_hp != new_hp:
                      details.append(f"❤️ {name} : PV {old_hp} → {new_hp}")

                  for symbol in ("α", "β", "γ"):
                      bs = ((before.get("skills") or {}).get(symbol) or {})
                      ns = ((after.get("skills") or {}).get(symbol) or {})

                      for field, label in (
                          ("base_values", "base"),
                          ("additional_values", "supplémentaires"),
                      ):
                          bm = table_map(bs.get(field) or {})
                          nm = table_map(ns.get(field) or {})

                          for row_key in sorted(set(bm) | set(nm)):
                              bv = bm.get(row_key)
                              nv = nm.get(row_key)
                              if bv == nv:
                                  continue
                              typ, cycle, level = row_key
                              type_text = "" if typ == "Base" else f" · {typ}"
                              cycle_text = f" #{cycle}" if cycle > 1 else ""
                              details.append(
                                  f"⚔️ {name} {symbol}{type_text}{cycle_text} {level} : {bv or '—'} → {nv or '—'}"
                              )

          changed_files = [
              line.strip()
              for line in Path("/tmp/substantive_changed.txt").read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]

          categories = []
          joined = "\n".join(changed_files)

          if "home_data" in joined or "assets/home/" in joined:
              categories.append("🏠 Accueil / événements / Login Bonus")
          if "characters_exact" in joined or "index.html" in joined:
              categories.append("🥊 Personnages / dégâts / Alters")
          if "costume" in joined:
              categories.append("👕 Costumes")
          if "tuning" in joined:
              categories.append("🧩 T.U.N.I.N.G")
          if "update_home_data.py" in joined:
              categories.append("🖼️ Correctif permanent du cache Login Bonus")
          if "v26-exact-stats-runtime.js" in joined:
              categories.append("📊 Moteur de stats exactes")
          if "v28-gentle-additional-split.js" in joined:
              categories.append("🧩 Gentle / dégâts supplémentaires séparés")
          if "v28-patch-notes-final.js" in joined or "v28-patch-notes-mobile.css" in joined:
              categories.append("📱 Patch Notes détaillés + navigation mobile")
          if "v29-patch-notes-detail.js" in joined:
              categories.append("🎯 Patch Notes : sous-partie exacte modifiée")

          report = []
          report.append("## MHUR NEXUS — Bêta Guardian Unique FINAL V30")
          report.append("")
          report.append("### Catégories")
          if categories:
              report.extend(f"- {item}" for item in categories)
          else:
              report.append("- Mise à jour de données du site")

          report.append("")
          report.append("### Modifications détectées")
          if details:
              report.extend(f"- {item}" for item in details[:80])
              if len(details) > 80:
                  report.append(f"- … {len(details) - 80} autre(s) modification(s)")
          else:
              report.append("- Les fichiers ont changé, sans variation de dégâts simple à résumer.")

          report.append("")
          report.append("### Fichiers")
          report.extend(f"- `{path}`" for path in changed_files[:50])
          if len(changed_files) > 50:
              report.append(f"- … {len(changed_files) - 50} autre(s) fichier(s)")

          Path("/tmp/beta_report.md").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8",
          )

          # Version Discord compacte.
          compact = "\n".join(report[:45])
          Path("/tmp/beta_report_discord.txt").write_text(
              compact[:1200],
              encoding="utf-8",
          )

          print(Path("/tmp/beta_report.md").read_text(encoding="utf-8"))
          PY

