                return `Modified part: ${part}`;
              }

              if(kind==='damage') return `Dégâts modifiés : ${part}`;
              if(kind==='guard') return `Brise-garde modifié : ${part}`;
              if(kind==='ammo') return `Munitions modifiées : ${part}`;
              return `Partie modifiée : ${part}`;
            }

            function activePatch(){
              const rows=window.MHUR_HOME_DATA?.patch_notes;
              if(!Array.isArray(rows) || !rows.length) return null;

              const active=document.querySelector(
                '#s18NotesDevModalV10 [data-v608-patch-index].active'
              );

              const index=Math.max(
                0,
                Math.min(
                  Number(active?.dataset?.v608PatchIndex || 0),
                  rows.length-1
                )
              );

              return rows[index] || null;
            }

            function changesOf(note){
              const result=[];
              (Array.isArray(note?.details) ? note.details : []).forEach(section=>{
                (Array.isArray(section?.changes) ? section.changes : []).forEach(change=>{
                  if(change) result.push(change);
                });
              });
              return result;
            }

            function matchChange(card,changes,used){
              const image=baseName(
                card.querySelector('img')?.getAttribute('src') || ''
              );
              const label=labelKind(
                card.querySelector('.s18PatchLabelV10')?.textContent || ''
              );

              let best=null;
              let bestScore=-1;

              changes.forEach((change,index)=>{
                if(used.has(index)) return;

                let score=0;

                const sourceImage=baseName(change?.skill_image || '');
                const sourceLabel=labelKind(change?.label || '');

                if(image && sourceImage && image===sourceImage) score+=1000;
                if(label && sourceLabel===label) score+=500;

                if(score>bestScore){
                  bestScore=score;
                  best={change,index};
                }
              });

              if(best && bestScore>=500){
                used.add(best.index);
                return best.change;
              }

              return null;
            }

            function translatedBase(heading,sourceBase){
              const current=clean(heading)
                .replace(/^\s*[αβγabg]\s*[-—:]\s*/i,'')
                .replace(/\s*[（(][^()（）]+[）)]\s*$/,'')
                .trim();

              return current || sourceBase;
            }

            function apply(){
              const modal=document.getElementById('s18NotesDevModalV10');
              if(!modal || !modal.classList.contains('open')) return 0;

              const note=activePatch();
              if(!note) return 0;

              const changes=changesOf(note);
              const used=new Set();
              const cards=[
                ...modal.querySelectorAll(
                  '[data-v608-patch-content] .s18PatchChangeV10'
                )
              ];

              let detailed=0;

              cards.forEach(card=>{
                const main=card.querySelector('.s18PatchSkillV10>main') ||
                  card.querySelector('main');
                const heading=main?.querySelector('h5');

                if(!main || !heading) return;

                const change=matchChange(card,changes,used);
                if(!change) return;

                const parts=parseSkill(
                  change?.display_skill_name ||
                  change?.skill_name ||
                  ''
                );

                // On ne touche QUE les changements où UltraRumble précise
                // une sous-partie entre parenthèses.
                if(!parts.subtype) return;

                const subtype=subtypeLabel(parts.subtype);
                const base=translatedBase(
                  heading.textContent,
                  parts.base
                );
                const symbol=parts.symbol ? `${parts.symbol} — ` : '';
                const title=`${symbol}${base} (${subtype})`;

                if(clean(heading.textContent)!==title){
                  heading.textContent=title;
                }

                // Une seule ligne explicative, juste sous le titre.
                main
                  .querySelectorAll('.mhurV28PatchSubtype')
                  .forEach(node=>{
                    if(!node.classList.contains('mhurV29PatchExactDetail')){
                      node.remove();
                    }
                  });

                let line=main.querySelector('.mhurV29PatchExactDetail');

                if(!line){
                  line=document.createElement('p');
                  line.className=
                    'mhurV28PatchSubtype mhurV29PatchExactDetail';
                  heading.insertAdjacentElement('afterend',line);
                }

                line.textContent=detailText(change,parts.subtype);
                line.dataset.v29SourceSkill=clean(
                  change?.skill_name || ''
                );

                detailed+=1;
              });

              window.__MHUR_V29_PATCH_STATUS__={
                cards:cards.length,
                detailed,
                marker:'MHUR_V29_PATCH_DETAIL_ONLY'
              };

              return detailed;
            }

            function schedule(){
              if(queued) return;
              queued=true;
              requestAnimationFrame(()=>{
                queued=false;
                apply();
              });
            }

            function start(){
              schedule();

              if(!observer){
                observer=new MutationObserver(schedule);
                observer.observe(document.body,{
                  childList:true,
                  subtree:true,
                  attributes:true,
                  attributeFilter:['class']
                });
              }

              document.addEventListener('click',event=>{
                if(event.target?.closest?.(
                  '#mhurPatchDevButtonV14,'+
                  '.mhurPatchDevButtonV14,'+
                  '[data-s18-notes-button],'+
                  '#s18NotesDevModalV10 [data-v608-patch-index],'+
                  '#s18NotesDevModalV10 [data-tab]'
                )){
                  setTimeout(schedule,0);
                  setTimeout(schedule,40);
                }
              },true);

              window.addEventListener(
                'mhur:languagechange',
                ()=>setTimeout(schedule,0)
              );
            }

            window.MHUR_V29_PATCH_DETAIL={
              apply,
              schedule,
              parseSkill,
              subtypeLabel
            };

            if(document.readyState==='loading'){
              document.addEventListener(
                'DOMContentLoaded',
                start,
                {once:true}
              );
            }else{
              start();
            }

            window.addEventListener(
              'load',
              ()=>setTimeout(schedule,0),
              {once:true}
            );
          })();
          JS

          cat > /tmp/apply_v29.py <<'PY'
          from pathlib import Path

          index=Path("public/index.html")

          if not index.exists():
              raise SystemExit("[V29][ERREUR] public/index.html introuvable")

          html=index.read_text(encoding="utf-8")
          tag='<script src="js/v29-patch-notes-detail.js?v=29"></script>'

          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("[V29][ERREUR] </body> introuvable")

              html=html.replace(
                  "</body>",
                  "<!-- MHUR FINAL V29 : détail exact Patch Notes uniquement -->\n"
                  + tag
                  + "\n</body>",
                  1,
              )

              index.write_text(
                  html,
                  encoding="utf-8",
                  newline="\n"
              )

          final=index.read_text(encoding="utf-8")

          if tag not in final:
              raise SystemExit("[V29][ERREUR] Script V29 non chargé")

          print("[V29][OK] Détail Patch Notes installé, reste inchangé.")
          PY

          node --check public/js/v29-patch-notes-detail.js
          python -m py_compile /tmp/apply_v29.py
          python /tmp/apply_v29.py

          if [ -n "$(git status --porcelain -- \
            public/index.html \
            public/js/v29-patch-notes-detail.js)" ]; then
            echo "fix_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fix_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Corriger définitivement Patch Notes et rôles V30
        id: v30fix
        shell: bash
        run: |
          set -euo pipefail
          echo "Corriger définitivement Patch Notes et rôles V30" > /tmp/mhur_stage

          cat > /tmp/apply_v30_patch_notes.py <<'PY'
          from pathlib import Path
          import re

          V584 = Path("public/js/v584-patch-notes-final.js")
          V608 = Path("public/js/v608-patch-notes-final.js")

          for path in (V584, V608):
              if not path.exists():
                  raise SystemExit(f"[V30][ERREUR] Fichier introuvable : {path}")

          # 1) V584 : conserver le nom exact du Patch Note avant traduction.
          t584 = V584.read_text(encoding="utf-8")

          if "sourceSkillName:" not in t584:
              pattern = (
                  r"(change\.__mhurV584\s*=\s*\{\s*\n)"
                  r"(?P<i>\s*)title,\s*\n"
              )
              match = re.search(pattern, t584)
              if not match:
                  raise SystemExit("[V30][ERREUR] Objet change.__mhurV584 introuvable")

              indent = match.group("i")
              replacement = (
                  match.group(1)
                  + f"{indent}title,\n"
                  + f"{indent}sourceSkillName: clean(\n"
                  + f"{indent}  change?.display_skill_name ||\n"
                  + f"{indent}  change?.skill_name ||\n"
                  + f"{indent}  ''\n"
                  + f"{indent}),\n"
              )
              t584 = t584[:match.start()] + replacement + t584[match.end():]
              print("[V30][PATCH] V584 : nom détaillé original conservé")
          else:
              print("[V30][OK] V584 : nom détaillé déjà conservé")

          V584.write_text(t584, encoding="utf-8", newline="\n")

          # 2) V608 : résolution du style dans toutes les langues.
          t608 = V608.read_text(encoding="utf-8")

          if "MHUR_V30_MULTILINGUAL_STYLE" not in t608:
              pattern = re.compile(
                  r"(?P<i>[ \t]*)const wanted=normal\(change\?\.style\|\|'Original'\);\s*"
                  r"const byStyle=ids\.find\(id=>\s*"
                  r"normal\(localized\(map\[id\]\?\.name\)\|\|'Original'\)===wanted\s*"
                  r"\);"
              )
              match = pattern.search(t608)
              if not match:
                  raise SystemExit("[V30][ERREUR] Résolution de style V608 introuvable")

              i = match.group("i")
              replacement = (
                  f"{i}const wanted=normal(change?.style||'Original');\n"
                  f"{i}/* MHUR_V30_MULTILINGUAL_STYLE */\n"
                  f"{i}const byStyle=ids.find(id=>{{\n"
                  f"{i}  const style=map[id]||{{}};\n"
                  f"{i}  const name=style?.name;\n"
                  f"{i}  const candidates=[\n"
                  f"{i}    localized(name),\n"
                  f"{i}    name?.fr,\n"
                  f"{i}    name?.en,\n"
                  f"{i}    style?.name_fr,\n"
                  f"{i}    style?.name_en,\n"
                  f"{i}    style?.style_name,\n"
                  f"{i}    style?.styleName\n"
                  f"{i}  ];\n"
                  f"{i}  return candidates.some(value=>\n"
                  f"{i}    normal(value||'')===wanted\n"
                  f"{i}  );\n"
                  f"{i}}});"
              )
              t608 = t608[:match.start()] + replacement + t608[match.end():]
              print("[V30][PATCH] V608 : styles FR/EN résolus correctement")
          else:
              print("[V30][OK] V608 : résolution multilingue déjà présente")

          # 3) Helpers de détail exact.
          if "MHUR_V30_EXACT_PATCH_DETAIL" not in t608:
              helper_match = re.search(
                  r"(?m)^(?P<i>[ \t]*)function changeHtml\(group,change,sectionTitle\)\{",
                  t608
              )
              if not helper_match:
                  raise SystemExit("[V30][ERREUR] changeHtml V608 introuvable")

              i = helper_match.group("i")
              helpers = f"""{i}/* MHUR_V30_EXACT_PATCH_DETAIL */
          {i}function v30SourceSkillName(change){{
          {i}  return clean(
          {i}    change?.__mhurV584?.sourceSkillName ||
          {i}    change?.display_skill_name ||
          {i}    change?.skill_name ||
          {i}    ''
          {i}  );
          {i}}}

          {i}function v30SkillParts(value){{
          {i}  const raw=clean(value);
          {i}  const letterMatch=raw.match(
          {i}    /^\\s*(SP|SPECIAL|α|β|γ|A|B|G|Y|ALPHA|BETA|GAMMA)\\s*[-—:]\\s*/i
          {i}  );
          {i}  const subtypeMatch=raw.match(
          {i}    /[（(]\\s*([^()（）]+?)\\s*[）)]\\s*$/
          {i}  );

          {i}  let letter=letterMatch ? clean(letterMatch[1]) : '';
          {i}  const letterKey=normal(letter);
          {i}  if(letterKey==='a'||letterKey==='alpha')letter='α';
          {i}  if(letterKey==='b'||letterKey==='beta')letter='β';
          {i}  if(letterKey==='g'||letterKey==='y'||letterKey==='gamma')letter='γ';
          {i}  if(letterKey==='sp'||letterKey==='special')letter='SP';

          {i}  const base=raw
          {i}    .replace(
          {i}      /^\\s*(SP|SPECIAL|α|β|γ|A|B|G|Y|ALPHA|BETA|GAMMA)\\s*[-—:]\\s*/i,
          {i}      ''
          {i}    )
          {i}    .replace(/\\s*[（(][^()（）]+[）)]\\s*$/,'')
          {i}    .trim();

          {i}  return {{
          {i}    raw,
          {i}    letter,
          {i}    base,
          {i}    subtype:subtypeMatch ? clean(subtypeMatch[1]) : ''
          {i}  }};
          {i}}}

          {i}function v30Subtype(value){{
          {i}  const key=normal(value);
          {i}  const values={{
          {i}    normal:{{fr:'Normal',en:'Normal'}},
          {i}    explosion:{{fr:'Explosion',en:'Explosion'}},
          {i}    explosionfollow_up:{{fr:'Explosion suivante',en:'Explosion Follow-up'}},
          {i}    explosion_follow_up:{{fr:'Explosion suivante',en:'Explosion Follow-up'}},
          {i}    follow_up:{{fr:'Enchaînement',en:'Follow-up'}},
          {i}    shockwave:{{fr:'Onde de choc',en:'Shockwave'}},
          {i}    bullet:{{fr:'Projectile',en:'Projectile'}},
          {i}    projectile:{{fr:'Projectile',en:'Projectile'}},
          {i}    rush:{{fr:'Ruée',en:'Rush'}},
          {i}    rebound:{{fr:'Rebond',en:'Rebound'}},
          {i}    bounce:{{fr:'Rebond',en:'Rebound'}},
          {i}    impact:{{fr:'Impact final',en:'Impact'}},
          {i}    melee:{{fr:'Corps à corps',en:'Melee Combat'}},
          {i}    melee_combat:{{fr:'Corps à corps',en:'Melee Combat'}},
          {i}    activation:{{fr:'Activation',en:'Activation'}},
          {i}    burn:{{fr:'Brûlure',en:'Burn'}},
          {i}    shot:{{fr:'Tir',en:'Shot'}},
          {i}    strongshot:{{fr:'Tir puissant',en:'Strong Shot'}},
          {i}    strong_shot:{{fr:'Tir puissant',en:'Strong Shot'}},
          {i}    collapse:{{fr:'Effondrement',en:'Collapse'}},
          {i}    bodyimpact:{{fr:'Impact corporel',en:'Body Impact'}},
          {i}    body_impact:{{fr:'Impact corporel',en:'Body Impact'}},
          {i}    normal_shot:{{fr:'Tir normal',en:'Normal Shot'}}
          {i}  }};

          {i}  const row=values[key];
          {i}  return row ? row[language()] : clean(value);
          {i}}}

          {i}function v30DetailText(change,subtype){{
          {i}  const part=v30Subtype(subtype);
          {i}  const label=normal(change?.label||'');

          {i}  if(language()==='en'){{
          {i}    if(label==='damage')return 'Damage modified: '+part;
          {i}    if(label==='guard_break'||label==='guardbreak'){{
          {i}      return 'Guard Break modified: '+part;
          {i}    }}
          {i}    if(label==='ammo'||label==='magazine'||label==='no_of_rounds'){{
          {i}      return 'Ammo modified: '+part;
          {i}    }}
          {i}    return 'Modified part: '+part;
          {i}  }}

          {i}  if(label==='damage'||label==='degats'||label==='degat'){{
          {i}    return 'Dégâts modifiés : '+part;
          {i}  }}
          {i}  if(label==='guard_break'||label==='guardbreak'||label==='brise_garde'){{
          {i}    return 'Brise-garde modifié : '+part;
          {i}  }}
          {i}  if(
          {i}    label==='ammo'||
          {i}    label==='magazine'||
          {i}    label==='munitions'||
          {i}    label==='no_of_rounds'
          {i}  ){{
          {i}    return 'Munitions modifiées : '+part;
          {i}  }}

          {i}  return 'Partie modifiée : '+part;
          {i}}}

          """
              t608 = (
                  t608[:helper_match.start()]
                  + helpers
                  + t608[helper_match.start():]
              )
              print("[V30][PATCH] V608 : moteur de détail exact ajouté")
          else:
              print("[V30][OK] V608 : moteur de détail exact déjà présent")

          # 4) Titre officiel + sous-type exact.
          if "const v30Parts=v30SkillParts" not in t608:
              pattern = re.compile(
                  r"(?P<i>[ \t]*)const title=translatePatch\(\s*"
                  r"localized\(identity\?\.title\)\|\|\s*"
                  r"localized\(change\?\.display_skill_name\)\|\|\s*"
                  r"localized\(change\?\.skill_name\)\|\|\s*"
                  r"localized\(change\?\.label\)\|\|\s*"
                  r"tx\('Ajustement','Adjustment'\)\s*"
                  r"\);"
              )
              match = pattern.search(t608)
              if not match:
                  raise SystemExit("[V30][ERREUR] Calcul du titre V608 introuvable")

              i = match.group("i")
              replacement = (
                  f"{i}const v30Parts=v30SkillParts(\n"
                  f"{i}  v30SourceSkillName(change)\n"
                  f"{i});\n"
                  f"{i}const v30FallbackTitle=translatePatch(\n"
                  f"{i}  localized(identity?.title)||\n"
                  f"{i}  localized(change?.display_skill_name)||\n"
                  f"{i}  localized(change?.skill_name)||\n"
                  f"{i}  localized(change?.label)||\n"
                  f"{i}  tx('Ajustement','Adjustment')\n"
                  f"{i});\n"
                  f"{i}let title=v30FallbackTitle;\n"
                  f"{i}if(!health&&v30Parts.subtype){{\n"
                  f"{i}  const base=localized(skill?.name)||v30Parts.base;\n"
                  f"{i}  const subtype=v30Subtype(v30Parts.subtype);\n"
                  f"{i}  title=(\n"
                  f"{i}    (v30Parts.letter?v30Parts.letter+' — ':'')+\n"
                  f"{i}    base+\n"
                  f"{i}    (subtype?' ('+subtype+')':'')\n"
                  f"{i}  );\n"
                  f"{i}}}\n"
                  f"{i}const v30Detail=(\n"
                  f"{i}  !health&&v30Parts.subtype\n"
                  f"{i}    ?v30DetailText(change,v30Parts.subtype)\n"
                  f"{i}    :''\n"
                  f"{i});"
              )
              t608 = t608[:match.start()] + replacement + t608[match.end():]
              print("[V30][PATCH] V608 : titre officiel + sous-type restauré")
          else:
              print("[V30][OK] V608 : titre détaillé déjà présent")

          # 5) Ligne explicative sous le titre.
          if "mhurV30PatchExactDetail" not in t608:
              pattern = re.compile(
                  r"(?P<i>[ \t]*)<h5>\$\{escapeHtml\(title\)\}</h5>\s*"
                  r"\$\{\s*change\?\.label"
              )
              match = pattern.search(t608)
              if not match:
                  raise SystemExit("[V30][ERREUR] Emplacement détail HTML V608 introuvable")

              i = match.group("i")
              replacement = (
                  f"{i}<h5>${{escapeHtml(title)}}</h5>\n"
                  f"{i}${{\n"
                  f"{i}  v30Detail\n"
                  f"{i}    ?`<p class=\"mhurV28PatchSubtype mhurV30PatchExactDetail\">${{\n"
                  f"{i}      escapeHtml(v30Detail)\n"
                  f"{i}    }}</p>`\n"
                  f"{i}    :''\n"
                  f"{i}}}\n"
                  f"{i}${{\n"
                  f"{i}  change?.label"
              )
              t608 = t608[:match.start()] + replacement + t608[match.end():]
              print("[V30][PATCH] V608 : détail affiché sous le nom")
          else:
              print("[V30][OK] V608 : détail déjà affiché")

          V608.write_text(t608, encoding="utf-8", newline="\n")

          final584 = V584.read_text(encoding="utf-8")
          final608 = V608.read_text(encoding="utf-8")

          checks = [
              ("V584 sourceSkillName", "sourceSkillName:" in final584),
              ("V608 styles FR/EN", "MHUR_V30_MULTILINGUAL_STYLE" in final608),
              ("V608 détail exact", "MHUR_V30_EXACT_PATCH_DETAIL" in final608),
              ("V608 détail visuel", "mhurV30PatchExactDetail" in final608),
          ]

          failed = []
          for name, ok in checks:
              print(("[V30][OK] " if ok else "[V30][ECHEC] ") + name)
              if not ok:
                  failed.append(name)

          if failed:
              raise SystemExit("[V30][ERREUR] Contrôles : " + ", ".join(failed))

          print("[V30][OK] Patch Notes + rôles corrigés")
          PY

          python -m py_compile /tmp/apply_v30_patch_notes.py
          python /tmp/apply_v30_patch_notes.py
          node --check public/js/v584-patch-notes-final.js
          node --check public/js/v608-patch-notes-final.js

          if [ -n "$(git status --porcelain -- \
            public/js/v584-patch-notes-final.js \
            public/js/v608-patch-notes-final.js)" ]; then
            echo "fix_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fix_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchroniser UltraRumble
        shell: bash
        run: |
          set -euo pipefail
          echo "Synchroniser UltraRumble" > /tmp/mhur_stage

          if [ "${{ steps.fixes.outputs.fix_changed }}" = "true" ] ||              [ "${{ steps.v28fix.outputs.fix_changed }}" = "true" ] ||              [ "${{ steps.v29fix.outputs.fix_changed }}" = "true" ]; then
            echo "[V29] Correctif Patch Notes nouveau : synchronisation complète forcée."
            python mise_a_jour/outils/surveiller_ultrarumble.py \
              --site-root public \
              --force
          else
            echo "[V26] Vérification normale des changements UltraRumble."
            code=0
            python mise_a_jour/outils/surveiller_ultrarumble.py \
              --site-root public || code=$?

            if [ "$code" -eq 4 ]; then
              echo "::warning::Une autre synchronisation était verrouillée. Aucun changement appliqué."
            elif [ "$code" -ne 0 ]; then
              exit "$code"
            fi
          fi

          # Le générateur peut réécrire index.html : on remet TOUS les
          # correctifs finaux après la synchronisation.
          python /tmp/apply_v26.py
          python /tmp/apply_v28.py
          python /tmp/apply_v29.py
          python /tmp/apply_v30_patch_notes.py

          # Les sauvegardes de sécurité locales ne doivent jamais finir dans la PR.
          rm -rf public/sauvegardes
          rm -f public/data/ultrarumble/synchronisation_en_cours.lock

          node --check public/js/v26-exact-stats-runtime.js
          node --check public/js/v28-gentle-additional-split.js
          node --check public/js/v28-patch-notes-final.js
          node --check public/js/v29-patch-notes-detail.js
          node --check public/js/v584-patch-notes-final.js
          node --check public/js/v608-patch-notes-final.js
          node --check public/js/season18-fixes.js
          python -m py_compile \
            mise_a_jour/outils/update_home_data.py \
            mise_a_jour/outils/update_ultrarumble_data.py \
            mise_a_jour/outils/season18_postprocess.py

      - name: Vérifier Patch Notes détaillés et séparation Gentle V28
        shell: bash
        run: |
          set -euo pipefail
          echo "Vérifier Patch Notes et Gentle V28" > /tmp/mhur_stage

          node --check public/js/v28-patch-notes-final.js
          node --check public/js/v28-gentle-additional-split.js

          grep -q "v28-patch-notes-mobile.css?v=28" public/index.html
          grep -q "v28-gentle-additional-split.js?v=28" public/index.html
          grep -q "v28-patch-notes-final.js?v=28" public/index.html

