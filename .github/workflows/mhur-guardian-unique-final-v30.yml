          fi

          preview="$(
            grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev/?' \
              /tmp/wrangler-preview.log \
              | tail -n1 \
              | sed 's:/*$::' \
              || true
          )"

          if [ -z "$preview" ]; then
            echo "::error::Preview créée mais URL workers.dev introuvable."
