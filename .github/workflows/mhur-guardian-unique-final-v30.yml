          set +e
          npx wrangler versions upload \
            --assets ./public \
            --name "$WORKER_NAME" \
            --compatibility-date "$WORKER_COMPATIBILITY_DATE" \
            --preview-alias beta \
            --message "MHUR NEXUS Guardian Unique FINAL V30 beta ${{ steps.beta.outputs.head_sha }}" \
            2>&1 | tee /tmp/wrangler-preview.log
          code=${PIPESTATUS[0]}
