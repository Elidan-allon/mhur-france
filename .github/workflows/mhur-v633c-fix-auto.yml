name: MHUR V633C FIX - Rendu final direct stable

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v633c-fix-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v633c-fix-final-first-frame
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Appliquer V633C corrigé
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v633c.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CRITICAL=base64.b64decode("").decode("utf-8")
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          HEADERS=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          
          index_path=public/"index.html"
          css_path=public/"css"/"v633c-final-first-frame.css"
          js_path=public/"js"/"v633c-final-first-frame.js"
          headers_path=public/"_headers"
          report_path=root/"RAPPORT_V633C_RENDU_FINAL_DIRECT.txt"
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          patterns=[
              r'\s*<script id=["\']mhur-v633c-first-frame-start["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v633c-first-frame-critical["\']>'
              r'.*?</style>\s*',
          
              r'\s*<!-- V633C : rendu final CSS\. -->\s*'
              r'<link[^>]+v633c-final-first-frame\.css[^>]*>\s*',
              r'\s*<link[^>]+v633c-final-first-frame\.css[^>]*>\s*',
          
              r'\s*<!-- V633C : rendu final JS\. -->\s*'
              r'<script[^>]+v633c-final-first-frame\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v633c-final-first-frame\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(pattern,"\n",html,flags=re.I|re.S)
          
          head_start=re.search(r'<head[^>]*>',html,flags=re.I)
          
          if not head_start:
              raise SystemExit("[ERREUR] Balise <head> introuvable.")
          
          position=head_start.end()
          html=html[:position]+"\n"+CRITICAL+"\n"+html[position:]
          
          head_ends=list(re.finditer(r'</head\s*>',html,flags=re.I))
          
          if not head_ends:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          position=head_ends[-1].start()
          css_tag=(
              '\n<!-- V633C : rendu final CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v633c-final-first-frame.css?v=633c">\n'
          )
          html=html[:position]+css_tag+html[position:]
          
          body_ends=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not body_ends:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          position=body_ends[-1].start()
          js_tag=(
              '\n<!-- V633C : rendu final JS. -->\n'
              '<script src="js/v633c-final-first-frame.js?v=633c">'
              '</script>\n'
          )
          html=html[:position]+js_tag+html[position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          existing=(
              headers_path.read_text(encoding="utf-8")
              if headers_path.is_file()
              else ""
          )
          
          existing=re.sub(
              r'\n?# MHUR V633C ASSET CACHE START.*?'
              r'# MHUR V633C ASSET CACHE END\n?',
              "\n",
              existing,
              flags=re.S
          ).strip()
          
          headers_path.write_text(
              ((existing+"\n\n") if existing else "")
              +HEADERS
              +"\n",
              encoding="utf-8"
          )
          
          report_path.write_text(
              """MHUR NEXUS — V633C
          
          - Aucun grand logo de chargement.
          - Aucun Service Worker.
          - Aucun rechargement automatique.
          - Aucun déplacement massif des feuilles CSS.
          - Fond normal du site pendant la préparation.
          - Révélation après CSS, polices, DOM et images visibles.
          - Délai de sécurité : la page ne peut jamais rester cachée.
          - Les premières images visibles passent en eager et priorité élevée.
          - Cache HTTP classique pour les assets.
          """,
              encoding="utf-8"
          )
          
          print("[OK] V633C appliqué.")
          PY
          
          cat > /tmp/verifier_v633c.py <<'PY'
          from pathlib import Path
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          js=Path(
              "public/js/v633c-final-first-frame.js"
          ).read_text(encoding="utf-8")
          
          checks=[
              'id="mhur-v633c-first-frame-start"',
              'id="mhur-v633c-first-frame-critical"',
              'css/v633c-final-first-frame.css?v=633c',
              'js/v633c-final-first-frame.js?v=633c',
          ]
          
          for value in checks:
              if index.count(value)!=1:
                  raise SystemExit(
                      f"[ERREUR] Installation V633C invalide : {value}"
                  )
          print("[OK] Vérification structurelle V633C réussie.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v633c.py
            node --check public/js/v633c-final-first-frame.js
            python3 /tmp/verifier_v633c.py
          
            git add     public/index.html     public/css/v633c-final-first-frame.css     public/js/v633c-final-first-frame.js     public/_headers     RAPPORT_V633C_RENDU_FINAL_DIRECT.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V633C est déjà appliqué."
              exit 0
            fi
          
            git commit -m "perf: appliquer rendu final direct V633C corrigé"
          
            if git push origin HEAD:main; then
              echo "[OK] V633C corrigé envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V633C corrigé après cinq tentatives."
          exit 1
