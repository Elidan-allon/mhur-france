name: MHUR V611 - Supprimer le cadre PV des Patch Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v611-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v611-patch-notes-pv-sans-cadre
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le correctif V611
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          index_path = Path("public/index.html")
          js_path = Path("public/js/v611-patch-notes-health-remove-box.js")
          css_path = Path("public/css/v611-patch-notes-health-remove-box.css")

          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html est introuvable.")

          js_path.parent.mkdir(parents=True, exist_ok=True)
          css_path.parent.mkdir(parents=True, exist_ok=True)

          js_path.write_bytes(base64.b64decode(""))
          css_path.write_bytes(base64.b64decode(""))

          html = index_path.read_text(encoding="utf-8")

          html = re.sub(
              r'\s*<link[^>]+href=["\']css/v611-patch-notes-health-remove-box\.css(?:\?[^"\']*)?["\'][^>]*>\s*',
              "\n",
              html,
              flags=re.I,
          )
          html = re.sub(
              r'\s*<script[^>]+src=["\']js/v611-patch-notes-health-remove-box\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*',
              "\n",
              html,
              flags=re.I,
          )

          css_tag = (
              '<link rel="stylesheet" '
              'href="css/v611-patch-notes-health-remove-box.css?v=611">\n'
          )
          js_tag = (
              '<script '
              'src="js/v611-patch-notes-health-remove-box.js?v=611">'
              '</script>\n'
          )

          if "</head>" not in html or "</body>" not in html:
              raise SystemExit(
                  "[ERREUR] Balises </head> ou </body> introuvables."
              )

          html = html.replace("</head>", css_tag + "</head>", 1)
          html = html.replace("</body>", js_tag + "</body>", 1)

          index_path.write_text(html, encoding="utf-8")

          if html.count(
              "css/v611-patch-notes-health-remove-box.css?v=611"
          ) != 1:
              raise SystemExit(
                  "[ERREUR] Reference CSS V611 absente ou dupliquee."
              )

          if html.count(
              "js/v611-patch-notes-health-remove-box.js?v=611"
          ) != 1:
              raise SystemExit(
                  "[ERREUR] Reference JS V611 absente ou dupliquee."
              )

          print("[OK] Correctif V611 installe.")
          PY

          node --check public/js/v611-patch-notes-health-remove-box.js
          echo "[OK] JavaScript et installation controles."
          git status --short

      - name: Enregistrer les changements
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/index.html \
            public/js/v611-patch-notes-health-remove-box.js \
            public/css/v611-patch-notes-health-remove-box.css

          if git diff --cached --quiet; then
            echo "[INFO] Le correctif V611 est deja applique."
            exit 0
          fi

          git commit -m "fix: supprimer le cadre vide des changements PV V611"
          git pull --rebase origin main
          git push origin HEAD:main
