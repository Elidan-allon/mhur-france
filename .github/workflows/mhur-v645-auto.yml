name: MHUR V645 - Synchronisation horaire silencieuse

on:
  schedule:
    # Vérification chaque heure, à la minute 17.
    # GitHub utilise UTC, mais ici l'heure importe peu car la cadence est horaire.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v645-hourly-sync
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mise_a_jour/requirements.txt

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r mise_a_jour/requirements.txt

      - name: Vérifier UltraRumble
        id: verifier
        shell: bash
        run: |
          set -euo pipefail

          set +e
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --check-only
          code=$?
          set -e

          if [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "[ERREUR] La vérification a renvoyé le code $code."
            exit "$code"
          fi

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          status_path = Path(
              "public/data/ultrarumble/derniere_synchronisation.json"
          )

          try:
              status = json.loads(status_path.read_text(encoding="utf-8"))
          except Exception:
              status = {}

          initialized = status.get("status") == "initialisé"
          urls = status.get("changed_urls") or []
          urls = [str(url) for url in urls if str(url).strip()]

          print(f"initialized={'true' if initialized else 'false'}")
          print(f"detected_count={len(urls)}")
          PY

      - name: Enregistrer la première empreinte
        if: steps.verifier.outputs.initialized == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f \
            public/data/ultrarumble/synchronisation_ultrarumble.log \
            public/data/ultrarumble/synchronisation_en_cours.lock

          git add \
            public/data/ultrarumble/synchronisation_state.json \
            public/data/ultrarumble/derniere_synchronisation.json \
            public/data/diagnostic_data.js

          if git diff --cached --quiet; then
            echo "[INFO] Les empreintes initiales sont déjà enregistrées."
            exit 0
          fi

          git commit -m \
            "chore: initialiser la surveillance horaire UltraRumble"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Synchroniser et publier les changements
        id: synchroniser
        if: steps.verifier.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --wait-lock 300

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "public/data/ultrarumble/derniere_synchronisation.json"
          )
          status = json.loads(path.read_text(encoding="utf-8"))

          if status.get("status") != "mis_à_jour":
              raise SystemExit(
                  "[ERREUR] La synchronisation ne s'est pas terminée "
                  "avec le statut mis_à_jour."
              )
          PY

          git restore --source=HEAD --worktree -- \
            public/data/ultrarumble/synchronisation_ultrarumble.log \
            2>/dev/null || true

          rm -f \
            public/data/ultrarumble/synchronisation_ultrarumble.log \
            public/data/ultrarumble/synchronisation_en_cours.lock

          rm -rf public/sauvegardes

          git add public

          if git diff --cached --quiet; then
            echo "[INFO] Changement détecté à la source, mais aucun fichier"
            echo "       publiable n'a été modifié."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m \
            "update: synchronisation automatique UltraRumble"

          pushed=false

          for tentative in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi

            echo "[ATTENTE] Nouvelle tentative de publication..."
            sleep $((tentative * 5))
          done

          if [ "$pushed" != "true" ]; then
            echo "[ERREUR] Impossible de publier la mise à jour."
            exit 1
          fi

          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Envoyer le message Discord
        if: steps.synchroniser.outputs.committed == 'true'
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.synchroniser.outputs.commit_sha }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          user_id = os.environ.get("DISCORD_USER_ID", "").strip()
          commit_sha = os.environ.get("COMMIT_SHA", "").strip()

          if not webhook:
              print(
                  "[INFO] Aucun secret DISCORD_WEBHOOK_URL : "
                  "notification Discord ignorée."
              )
              raise SystemExit(0)

          status_path = Path(
              "public/data/ultrarumble/derniere_synchronisation.json"
          )

          try:
              status = json.loads(
                  status_path.read_text(encoding="utf-8")
              )
          except Exception:
              status = {}

          urls = [
              str(value).strip()
              for value in status.get("changed_urls", [])
              if str(value).strip()
          ]

          shown = urls[:8]
          lines = "\n".join(f"• {url}" for url in shown)

          if len(urls) > len(shown):
              lines += f"\n• … et {len(urls) - len(shown)} autre(s)"

          repository = os.environ.get("GITHUB_REPOSITORY", "")
          commit_url = (
              f"https://github.com/{repository}/commit/{commit_sha}"
              if repository and commit_sha
              else ""
          )

          mention = f"<@{user_id}> " if user_id else ""

          content = (
              f"{mention}✅ **MHUR Nexus a été mis à jour automatiquement**\n"
              f"{len(urls)} page(s) UltraRumble modifiée(s)."
          )

          if lines:
              content += f"\n\n{lines}"

          if commit_url:
              content += f"\n\n🔗 {commit_url}"

          payload = {
              "username": "MHUR Nexus — Mise à jour",
              "content": content[:1950],
              "allowed_mentions": (
                  {"users": [user_id]}
                  if user_id
                  else {"parse": []}
              ),
          }

          response = requests.post(
              webhook,
              json=payload,
              timeout=30,
          )
          response.raise_for_status()
          print("[OK] Message Discord envoyé.")
          PY

      - name: Signaler une erreur sur Discord
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os

          import requests

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          user_id = os.environ.get("DISCORD_USER_ID", "").strip()

          if not webhook:
              raise SystemExit(0)

          repository = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = (
              f"https://github.com/{repository}/actions/runs/{run_id}"
              if repository and run_id
              else ""
          )

          mention = f"<@{user_id}> " if user_id else ""
          content = (
              f"{mention}❌ **La mise à jour automatique MHUR a échoué.**"
          )

          if run_url:
              content += f"\nConsulte le rapport : {run_url}"

          payload = {
              "username": "MHUR Nexus — Erreur",
              "content": content,
              "allowed_mentions": (
                  {"users": [user_id]}
                  if user_id
                  else {"parse": []}
              ),
          }

          try:
              response = requests.post(
                  webhook,
                  json=payload,
                  timeout=30,
              )
              response.raise_for_status()
          except Exception as error:
              print(f"[AVERTISSEMENT] Discord indisponible : {error}")
          PY
