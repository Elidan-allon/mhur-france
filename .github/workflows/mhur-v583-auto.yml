name: MHUR V583 - ordre officiel des variantes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v583-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v583-ordre-variantes
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Corriger et analyser les variantes
        shell: bash
        run: |
          cat > /tmp/mhur_v583.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import json
          import re
          import subprocess

          ROOT = Path.cwd()
          INDEX = ROOT / "public" / "index.html"
          REPORT = ROOT / "RAPPORT_V583_ORDRE_VARIANTES.txt"

          DATA_START_RE = re.compile(
              r'(<script\s+id=["\']v249-local-costumes-data["\']'
              r'\s+type=["\']application/json["\']\s*>)',
              flags=re.I,
          )
          DATA_END = "</script>"

          NAME_MAP = {
              "midoriya": "Izuku Midoriya",
              "midoriya_ofa": "Izuku Midoriya OFA",
              "bakugo": "Katsuki Bakugo",
              "uraraka": "Ochaco Uraraka",
              "todoroki": "Shoto Todoroki",
              "tsuyu": "Tsuyu Asui",
              "iida": "Tenya Iida",
              "kirishima": "Eijiro Kirishima",
              "momo": "Momo Yaoyorozu",
              "kendo": "Itsuka Kendo",
              "ibara": "Ibara Shiozaki",
              "all_might": "All Might",
              "aizawa": "Shota Aizawa",
              "present_mic": "Present Mic",
              "endeavor": "Endeavor",
              "hawks": "Hawks",
              "nejire": "Nejire Hado",
              "mirio": "Mirio Togata",
              "monoma": "Neito Monoma",
              "shinso": "Hitoshi Shinso",
              "tokoyami": "Fumikage Tokoyami",
              "shigaraki": "Tomura Shigaraki",
              "dabi": "Dabi",
              "toga": "Himiko Toga",
              "compress": "Mr. Compress",
              "twice": "Twice",
              "all_for_one": "All For One",
              "overhaul": "Overhaul",
              "gentle_criminal": "Gentle Criminal",
          }

          VARIANT_NAME_RANK = {
              "original": 0,
              "vers heros": 1,
              "version heros": 1,
              "style heros": 1,
              "hero style": 1,
              "super vilain": 2,
              "villain style": 2,
              "d enfer": 3,
              "heat": 3,
              "combat": 4,
              "elegant": 5,
              "fancy": 5,
              "dangereux": 6,
              "dangerous": 6,
          }

          def fail(message: str) -> None:
              raise RuntimeError(message)

          def read(path: Path) -> str:
              if not path.is_file():
                  fail(f"Fichier introuvable : {path.as_posix()}")
              return path.read_text(encoding="utf-8-sig")

          def write(path: Path, content: str) -> None:
              path.write_text(content.rstrip() + "\n", encoding="utf-8")

          def normalize(value: object) -> str:
              import unicodedata

              text = unicodedata.normalize("NFD", str(value or ""))
              text = "".join(char for char in text if unicodedata.category(char) != "Mn")
              text = text.lower()
              text = re.sub(r"[^a-z0-9]+", " ", text)
              return text.strip()

          def variant_rank(costume: dict) -> tuple[int, int]:
              # Règle officielle principale : deux derniers chiffres de l'identifiant UR.
              ur_id = str(costume.get("urId") or costume.get("ur_id") or "")
              match = re.search(r"(\d{2})$", ur_id)

              if match:
                  suffix = int(match.group(1))
                  # 00 Original, 01 Héros, 02 Super-vilain, 03 D'enfer,
                  # 04 Combat, 05 Élégant, 06 Dangereux.
                  return (0, suffix)

              variant = normalize(costume.get("variant") or costume.get("variant_fr"))
              return (1, VARIANT_NAME_RANK.get(variant, 999))

          def group_key(costume: dict) -> str:
              return str(costume.get("group") or costume.get("name") or "Costume")

          def variant_label(costume: dict) -> str:
              variant = str(costume.get("variant") or "Original")
              ur_id = str(costume.get("urId") or costume.get("ur_id") or costume.get("id") or "?")
              return f"{variant} [{ur_id}]"

          def extract_data(html: str) -> tuple[dict, int, int, str, str]:
              start_match = DATA_START_RE.search(html)
              if not start_match:
                  fail("Bloc v249-local-costumes-data introuvable dans index.html.")

              json_start = start_match.end()
              json_end = html.find(DATA_END, json_start)

              if json_end < 0:
                  fail("Fin du bloc v249-local-costumes-data introuvable.")

              raw_json = html[json_start:json_end].strip()

              try:
                  data = json.loads(raw_json)
              except json.JSONDecodeError as error:
                  fail(f"JSON costumes invalide : {error}")

              return data, json_start, json_end, html[:json_start], html[json_end:]

          def sorted_character_list(costumes: list[dict]) -> list[dict]:
              group_positions: dict[str, int] = {}
              next_group = 0

              indexed: list[tuple[int, dict]] = []

              for index, costume in enumerate(costumes):
                  key = group_key(costume)
                  if key not in group_positions:
                      group_positions[key] = next_group
                      next_group += 1
                  indexed.append((index, costume))

              indexed.sort(
                  key=lambda item: (
                      group_positions[group_key(item[1])],
                      variant_rank(item[1]),
                      item[0],
                  )
              )

              return [costume for _, costume in indexed]

          def group_orders(costumes: list[dict]) -> dict[str, list[dict]]:
              groups: dict[str, list[dict]] = {}
              for costume in costumes:
                  groups.setdefault(group_key(costume), []).append(costume)
              return groups

          def find_affected(
              before: dict[str, list[dict]],
              after: dict[str, list[dict]],
          ) -> list[dict]:
              affected: list[dict] = []

              for char_id, before_list in before.items():
                  after_list = after.get(char_id, [])
                  before_groups = group_orders(before_list)
                  after_groups = group_orders(after_list)

                  for group, before_variants in before_groups.items():
                      after_variants = after_groups.get(group, [])
                      before_ids = [
                          str(item.get("urId") or item.get("id") or "")
                          for item in before_variants
                      ]
                      after_ids = [
                          str(item.get("urId") or item.get("id") or "")
                          for item in after_variants
                      ]

                      if before_ids != after_ids:
                          affected.append({
                              "char_id": char_id,
                              "character": NAME_MAP.get(
                                  char_id,
                                  char_id.replace("_", " ").title(),
                              ),
                              "group": group,
                              "before": [variant_label(item) for item in before_variants],
                              "after": [variant_label(item) for item in after_variants],
                          })

              return affected

          CANONICAL_PATCH = r'''
            /* V583 : tri officiel et automatique des variantes de costume. */
            function v583VariantRank(ct){
              const ur=String(ct?.urId||ct?.ur_id||'');
              const suffix=ur.match(/(\d{2})$/);
              if(suffix) return Number(suffix[1]);

              const value=String(ct?.variant||'')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g,'')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g,' ')
                .trim();

              const fallback={
                original:0,
                'vers heros':1,
                'version heros':1,
                'style heros':1,
                'hero style':1,
                'super vilain':2,
                'villain style':2,
                'd enfer':3,
                heat:3,
                combat:4,
                elegant:5,
                fancy:5,
                dangereux:6,
                dangerous:6
              };

              return Object.prototype.hasOwnProperty.call(fallback,value)
                ? fallback[value]
                : 999;
            }

            function v583SortedCanonicalList(charId){
              const list=(canonical[charId]||[]).map(clone);
              const groupOrder=new Map();

              list.forEach(ct=>{
                const key=ct.group||ct.name||'Costume';
                if(!groupOrder.has(key)) groupOrder.set(key,groupOrder.size);
              });

              return list
                .map((ct,index)=>({ct,index}))
                .sort((a,b)=>{
                  const groupA=groupOrder.get(a.ct.group||a.ct.name||'Costume');
                  const groupB=groupOrder.get(b.ct.group||b.ct.name||'Costume');

                  if(groupA!==groupB) return groupA-groupB;

                  const rankA=v583VariantRank(a.ct);
                  const rankB=v583VariantRank(b.ct);

                  return rankA-rankB || a.index-b.index;
                })
                .map(item=>item.ct);
            }
          '''

          def patch_canonical_sort(html: str) -> str:
              # Retire une ancienne installation V583 du bloc, si elle existe.
              marker = "  /* V583 : tri officiel et automatique des variantes de costume. */"
              marker_pos = html.find(marker)
              if marker_pos >= 0:
                  function_pos = html.find("  function canonicalList(charId)", marker_pos)
                  if function_pos < 0:
                      fail("Ancien bloc V583 incomplet.")
                  html = html[:marker_pos] + html[function_pos:]

              old_function = (
                  "  function canonicalList(charId){"
                  "return (canonical[charId]||[]).map(clone)}"
              )

              replacement = (
                  CANONICAL_PATCH
                  + "\n  function canonicalList(charId){"
                  + "return v583SortedCanonicalList(charId)}"
              )

              if old_function not in html:
                  # Accepte les espaces éventuels.
                  pattern = re.compile(
                      r"  function canonicalList\(charId\)\s*\{\s*"
                      r"return\s+\(canonical\[charId\]\|\|\[\]\)\.map\(clone\)\s*"
                      r"\}",
                  )
                  html, count = pattern.subn(replacement, html, count=1)
                  if count != 1:
                      fail("Fonction canonicalList source introuvable.")
                  return html

              return html.replace(old_function, replacement, 1)

          def verify_sorted(data: dict) -> None:
              errors: list[str] = []

              for char_id, costumes in (data.get("costumes") or {}).items():
                  groups = group_orders(costumes)

                  for group, variants in groups.items():
                      ranks = [variant_rank(item) for item in variants]
                      if ranks != sorted(ranks):
                          errors.append(f"{char_id} — {group}")

              if errors:
                  fail(
                      "Des familles restent mal triées :\n- "
                      + "\n- ".join(errors[:20])
                  )

          def main() -> None:
              html = read(INDEX)
              data, json_start, json_end, prefix, suffix = extract_data(html)

              before_costumes = {
                  char_id: list(costumes)
                  for char_id, costumes in (data.get("costumes") or {}).items()
              }

              after_costumes = {
                  char_id: sorted_character_list(list(costumes))
                  for char_id, costumes in before_costumes.items()
              }

              affected = find_affected(before_costumes, after_costumes)
              data["costumes"] = after_costumes
              verify_sorted(data)

              new_json = json.dumps(
                  data,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )

              html = prefix + "\n" + new_json + "\n" + suffix
              html = patch_canonical_sort(html)
              write(INDEX, html)

              # Vérification syntaxique simple de la fonction finale.
              final_html = read(INDEX)
              if "function v583SortedCanonicalList" not in final_html:
                  fail("Fonction de tri automatique V583 absente.")
              if "return v583SortedCanonicalList(charId)" not in final_html:
                  fail("canonicalList n'utilise pas V583.")

              lines = [
                  "MHUR FRANCE — RAPPORT ORDRE DES VARIANTES V583",
                  "",
                  "Ordre appliqué :",
                  "00 Original",
                  "01 Vers. Héros / Style Héros",
                  "02 Super-vilain",
                  "03 D'enfer",
                  "04 Combat",
                  "05 Élégant",
                  "06 Dangereux",
                  "",
                  f"Familles corrigées : {len(affected)}",
                  "",
              ]

              if affected:
                  for item in affected:
                      lines += [
                          f"{item['character']} — {item['group']}",
                          "  Avant : " + " → ".join(item["before"]),
                          "  Après : " + " → ".join(item["after"]),
                          "",
                      ]
              else:
                  lines += [
                      "Aucune famille n'était actuellement mal rangée.",
                      "Le tri automatique reste installé pour les prochains ajouts.",
                      "",
                  ]

              lines += [
                  "Vérifications :",
                  "- données intégrées réordonnées : OK",
                  "- ordre des familles conservé : OK",
                  "- variantes triées par identifiant UR : OK",
                  "- tri automatique des futurs ajouts : OK",
              ]

              write(REPORT, "\n".join(lines))

              print("[OK] Ordre officiel des variantes appliqué.")
              print(f"[OK] Familles actuellement corrigées : {len(affected)}.")
              for item in affected:
                  print(f"[CORRIGÉ] {item['character']} — {item['group']}")
              print("[OK] Rapport créé : RAPPORT_V583_ORDRE_VARIANTES.txt")

          if __name__ == "__main__":
              main()
          PY
          python3 /tmp/mhur_v583.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             public/index.html             RAPPORT_V583_ORDRE_VARIANTES.txt

          if git diff --cached --quiet; then
            echo "Aucun changement a enregistrer."
            exit 0
          fi

          git commit -m "Corriger l'ordre des variantes de costumes V583"
          git push
