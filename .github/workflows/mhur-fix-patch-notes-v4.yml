name: MHUR - Correctif Patch Notes Alters et détails

on:
  workflow_run:
    workflows:
      - "MHUR - Synchronisation UltraRumble"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-public-data-write
  cancel-in-progress: false

jobs:
  reparer-patch-notes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer la dernière version de main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Réparer les données et le rendu des Patch Notes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import unicodedata
          from collections import Counter
          from pathlib import Path

          PUBLIC = Path("public")
          INDEX = PUBLIC / "index.html"
          HOME_JSON = PUBLIC / "data" / "home_data.json"
          HOME_JS = PUBLIC / "data" / "home_data.js"
          RENDERER = PUBLIC / "js" / "v608-patch-notes-final.js"
          PATCH_ID = "1785298405"

          for required in (INDEX, HOME_JSON, RENDERER):
              if not required.is_file():
                  raise SystemExit(f"[ERREUR] Fichier introuvable : {required}")

          def clean(value: object) -> str:
              return str(value or "").strip()

          def norm(value: object) -> str:
              text = unicodedata.normalize("NFD", clean(value).lower())
              text = "".join(ch for ch in text if unicodedata.category(ch) != "Mn")
              return re.sub(r"[^a-z0-9]+", " ", text).strip()

          def rows(values: list[str]) -> list[list[str]]:
              return [[f"Lv.{index + 1}", value] for index, value in enumerate(values)]

          def is_bakugo_cluster(change: dict) -> bool:
              if "bakugo" not in norm(change.get("character")):
                  return False
              haystack = " ".join(
                  norm(change.get(key))
                  for key in ("style", "skill_name", "skill_image", "image", "icon")
              )
              return "cluster" in haystack

          def is_damage_metric(change: dict) -> bool:
              label = norm(change.get("label"))
              return any(
                  label.startswith(prefix)
                  for prefix in (
                      "damage",
                      "degats",
                      "guard break",
                      "brise garde",
                  )
              )

          def alter_symbol(change: dict) -> str:
              """Détermine si la compétence est Alpha, Bêta ou Gamma."""
              name = clean(change.get("skill_name"))
              match = re.match(r"^\s*([αβγ])(?:\s*[-–—:]\s*|\s+)", name)
              if match:
                  return match.group(1)

              haystack = " ".join(
                  clean(change.get(key)).lower()
                  for key in (
                      "skill_slot",
                      "slot",
                      "button",
                      "quirk",
                      "skill_name",
                      "skill_image",
                      "image",
                      "icon",
                  )
              )

              patterns = (
                  ("α", (r"(?:^|[^a-z])alpha(?:[^a-z]|$)", r"(?:^|[/_.-])a(?:[/_.-]|$)")),
                  ("β", (r"(?:^|[^a-z])beta(?:[^a-z]|$)", r"(?:^|[/_.-])b(?:[/_.-]|$)")),
                  ("γ", (r"(?:^|[^a-z])gamma(?:[^a-z]|$)", r"(?:^|[/_.-])y(?:[/_.-]|$)")),
              )
              for symbol, candidates in patterns:
                  if any(re.search(pattern, haystack) for pattern in candidates):
                      return symbol
              return ""

          def add_alter_prefix(change: dict) -> None:
              """Ajoute α / β / γ devant le nom sans créer de doublon."""
              name = clean(change.get("skill_name"))
              if not name or name.upper() in {"HP", "PV"}:
                  return

              symbol = alter_symbol(change)
              if not symbol:
                  return

              stripped = re.sub(
                  r"^\s*[αβγ]\s*(?:[-–—:]\s*)?",
                  "",
                  name,
              ).strip()
              change["alter_symbol"] = symbol
              change["skill_name"] = f"{symbol} - {stripped}"

          data = json.loads(HOME_JSON.read_text(encoding="utf-8"))
          patches = data.setdefault("patch_notes", [])

          patch = next(
              (item for item in patches if str(item.get("id")) == PATCH_ID),
              None,
          )
          if patch is None:
              raise SystemExit(f"[ERREUR] Patch {PATCH_ID} introuvable.")

          details = patch.setdefault("details", [])
          damage_section = next(
              (
                  section
                  for section in details
                  if isinstance(section.get("changes"), list)
                  and (
                      norm(section.get("accent")) == "damage"
                      or "damage" in norm(section.get("title"))
                      or "degat" in norm(section.get("title"))
                  )
              ),
              None,
          )

          if damage_section is None:
              damage_section = {
                  "title": "Changements d'équilibrage : Dégâts",
                  "accent": "damage",
                  "changes": [],
              }
              details.append(damage_section)

          portrait = "assets/home/patches/1785298405/portrait_katsuki_bakugo.webp"
          alpha_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_ap_shot_cluster_normal.png"
          beta_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_nitro_cluster_explosion.png"
          beta_follow_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_nitro_cluster_explosionfollow_up.png"

          alpha_old = ["30.0", "31.0", "32.0", "34.0", "35.0", "36.0", "37.0", "38.0", "40.0"]
          alpha_new = ["40.0", "41.0", "42.0", "44.0", "45.0", "46.0", "47.0", "48.0", "50.0"]
          beta_old = ["30.0", "31.0", "32.0", "34.0", "35.0", "36.0", "37.0", "38.0", "40.0"]
          beta_new = ["35.0", "36.0", "37.0", "39.0", "40.0", "41.0", "42.0", "43.0", "45.0"]
          beta_follow_old = ["40.0", "41.0", "42.0", "44.0", "45.0", "46.0", "47.0", "48.0", "50.0"]
          beta_follow_new = ["44.0", "46.0", "48.0", "50.0", "52.0", "54.0", "56.0", "58.0", "60.0"]

          def make_cluster_change(
              symbol: str,
              skill_name: str,
              skill_image: str,
              metric: str,
              effect_detail: str,
              before: list[str],
              after: list[str],
          ) -> dict:
              return {
                  "character": "Katsuki Bakugo",
                  "style": "Cluster",
                  "role": "Technique",
                  "portrait": portrait,
                  "alter_symbol": symbol,
                  "skill_slot": symbol,
                  "skill_name": f"{symbol} - {skill_name}",
                  "skill_image": skill_image,
                  "effect_detail": effect_detail,
                  "label": f"{metric} — {effect_detail}",
                  "before": before,
                  "after": after,
                  "tone": "buff",
              }

          expected_cluster_changes = [
              make_cluster_change(
                  "α",
                  "AP Shot Cluster",
                  alpha_image,
                  "Dégâts",
                  "Normal",
                  alpha_old,
                  alpha_new,
              ),
              make_cluster_change(
                  "α",
                  "AP Shot Cluster",
                  alpha_image,
                  "Brise-garde",
                  "Normal",
                  alpha_old,
                  alpha_new,
              ),
              make_cluster_change(
                  "β",
                  "Nitro Cluster",
                  beta_image,
                  "Dégâts",
                  "Explosion",
                  beta_old,
                  beta_new,
              ),
              make_cluster_change(
                  "β",
                  "Nitro Cluster",
                  beta_image,
                  "Brise-garde",
                  "Explosion",
                  beta_old,
                  beta_new,
              ),
              make_cluster_change(
                  "β",
                  "Nitro Cluster",
                  beta_follow_image,
                  "Dégâts",
                  "Explosion renforcée",
                  beta_follow_old,
                  beta_follow_new,
              ),
              make_cluster_change(
                  "β",
                  "Nitro Cluster",
                  beta_follow_image,
                  "Brise-garde",
                  "Explosion renforcée",
                  beta_follow_old,
                  beta_follow_new,
              ),
          ]

          old_changes = list(damage_section.get("changes") or [])
          kept: list[dict] = []
          insertion_index: int | None = None

          for item in old_changes:
              if (
                  isinstance(item, dict)
                  and is_bakugo_cluster(item)
                  and is_damage_metric(item)
              ):
                  if insertion_index is None:
                      insertion_index = len(kept)
                  continue
              kept.append(item)

          if insertion_index is None:
              insertion_index = len(kept)
              for index, item in enumerate(kept):
                  if (
                      isinstance(item, dict)
                      and "bakugo" in norm(item.get("character"))
                  ):
                      insertion_index = index + 1

          kept[insertion_index:insertion_index] = expected_cluster_changes
          damage_section["changes"] = kept

          # Corrige les deux cartes de dégâts de l'Alpha d'Armored All Might.
          armored_count = 0
          for section in details:
              for change in section.get("changes") or []:
                  if not isinstance(change, dict):
                      continue

                  character_key = norm(change.get("character"))
                  image_key = norm(change.get("skill_image"))
                  skill_key = norm(change.get("skill_name"))

                  if character_key == "armored all might" and (
                      "ice bullet shot burn" in image_key
                      or "ice bullet shot burn" in skill_key
                      or (
                          is_damage_metric(change)
                          and list(change.get("before") or []) == [
                              "52.0", "54.0", "56.0", "58.0", "60.0",
                              "62.0", "64.0", "66.0", "68.0",
                          ]
                      )
                  ):
                      change.update(
                          {
                              "character": "Armored All Might",
                              "style": "Technique",
                              "role": "Technique",
                              "portrait": (
                                  "assets/home/patches/1785298405/"
                                  "portrait_armored_all_might.webp"
                              ),
                              "alter_symbol": "α",
                              "skill_slot": "α",
                              "skill_name": "α - Ice Bullet Shot",
                              "effect_detail": "Brûlure (Burn)",
                              "skill_image": (
                                  "assets/home/patches/1785298405/"
                                  "skill_armored_all_might_ice_bullet_shot_burn.png"
                              ),
                          }
                      )

                      metric = norm(change.get("label"))
                      if metric.startswith(("damage", "degats")):
                          change["label"] = "Dégâts — Brûlure (Burn)"
                      elif metric.startswith(("guard break", "brise garde")):
                          change["label"] = "Brise-garde — Brûlure (Burn)"

                      armored_count += 1

          if armored_count != 2:
              raise SystemExit(
                  "[ERREUR] 2 cartes Armored All Might attendues, "
                  f"trouvé : {armored_count}"
              )

          # Ajoute α / β / γ à toutes les cartes lorsque le slot est identifiable.
          # Lorsqu'un détail est fourni, il est affiché dans le sous-titre :
          # Dégâts — Normal, Dégâts — Explosion, etc.
          for patch_item in patches:
              for section in patch_item.get("details") or []:
                  for change in section.get("changes") or []:
                      if not isinstance(change, dict):
                          continue

                      add_alter_prefix(change)

                      detail = clean(change.get("effect_detail"))
                      label = clean(change.get("label"))
                      if detail and detail.lower() not in label.lower():
                          change["label"] = f"{label} — {detail}"

          data.setdefault("meta", {})["patch_notes_fix"] = (
              "alter-symbols-details-render-v4"
          )

          HOME_JSON.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          compact = json.dumps(
              data,
              ensure_ascii=False,
              separators=(",", ":"),
          )
          compact = compact.replace("\u2028", "\\u2028").replace(
              "\u2029",
              "\\u2029",
          )
          home_js_content = f"window.MHUR_HOME_DATA = {compact};\n"
          HOME_JS.write_text(home_js_content, encoding="utf-8")
          home_hash = hashlib.sha256(
              home_js_content.encode("utf-8")
          ).hexdigest()[:12]

          # Le bug visuel venait de V608 :
          # il affichait le nom de la fiche personnage avant le vrai skill_name.
          renderer = RENDERER.read_text(encoding="utf-8")

          old_title = """    const title=translatePatch(
                localized(skill?.name)||
                localized(change?.skill_name)||
                localized(change?.label)||
                tx('Ajustement','Adjustment')
              );"""

          new_title = """    const title=translatePatch(
                localized(change?.skill_name)||
                localized(skill?.name)||
                localized(change?.label)||
                tx('Ajustement','Adjustment')
              );"""

          if old_title in renderer:
              renderer = renderer.replace(old_title, new_title, 1)
          elif new_title not in renderer:
              renderer, title_count = re.subn(
                  r"""const title=translatePatch\(\s*
                      localized\(skill\?\.name\)\|\|\s*
                      localized\(change\?\.skill_name\)\|\|\s*
                      localized\(change\?\.label\)\|\|\s*
                      tx\('Ajustement','Adjustment'\)\s*
                      \);""",
                  """const title=translatePatch(
                localized(change?.skill_name)||
                localized(skill?.name)||
                localized(change?.label)||
                tx('Ajustement','Adjustment')
              );""",
                  renderer,
                  count=1,
                  flags=re.VERBOSE,
              )
              if title_count != 1:
                  raise SystemExit(
                      "[ERREUR] Priorité du titre introuvable dans V608."
                  )

          old_picture = """    const picture=health
                ?''
                :(
                  skill?.img||
                  (
                    isMidoriya
                      ?''
                      :change?.skill_image
                  )||
                  ''
                );"""

          new_picture = """    const picture=health
                ?''
                :(
                  isMidoriya
                    ?(skill?.img||change?.skill_image||'')
                    :(change?.skill_image||skill?.img||'')
                );"""

          if old_picture in renderer:
              renderer = renderer.replace(old_picture, new_picture, 1)
          elif new_picture not in renderer:
              renderer, picture_count = re.subn(
                  r"""const picture=health\s*
                      \?''\s*
                      :\(\s*
                      skill\?\.img\|\|\s*
                      \(\s*
                      isMidoriya\s*
                      \?''\s*
                      :change\?\.skill_image\s*
                      \)\|\|\s*
                      ''\s*
                      \);""",
                  """const picture=health
                ?''
                :(
                  isMidoriya
                    ?(skill?.img||change?.skill_image||'')
                    :(change?.skill_image||skill?.img||'')
                );""",
                  renderer,
                  count=1,
                  flags=re.VERBOSE,
              )
              if picture_count != 1:
                  raise SystemExit(
                      "[ERREUR] Priorité de l'image introuvable dans V608."
                  )

          renderer = re.sub(
              r"const VERSION='[^']*';",
              "const VERSION='patchfix-v4';",
              renderer,
              count=1,
          )

          RENDERER.write_text(renderer, encoding="utf-8")
          renderer_hash = hashlib.sha256(
              renderer.encode("utf-8")
          ).hexdigest()[:12]

          # Corrige aussi les tableaux de la fiche personnage de Bakugo.
          html = INDEX.read_text(encoding="utf-8")
          arrays = {
              "bakugoTechAlphaBase": [
                  ["Lv.1", "x4", "x1", "2.5s"],
                  ["Lv.2", "x4", "x1", "2.5s"],
                  ["Lv.3", "x4", "x1", "2.5s"],
                  ["Lv.4", "x5", "x1", "2.5s"],
                  ["Lv.5", "x5", "x1", "2.5s"],
                  ["Lv.6", "x5", "x1", "2.5s"],
                  ["Lv.7", "x5", "x1", "2.5s"],
                  ["Lv.8", "x5", "x1", "2.5s"],
                  ["Lv.9", "x6", "x1", "2.5s"],
              ],
              "bakugoTechAlphaNormal": rows(
                  ["40", "41", "42", "44", "45", "46", "47", "48", "50"]
              ),
              "bakugoTechAlphaDeploy": rows(
                  ["10", "10", "10", "11", "11", "11", "11", "11", "12"]
              ),
              "bakugoTechAlphaExplosion": rows(
                  ["40", "41", "42", "44", "45", "46", "47", "48", "50"]
              ),
              "bakugoTechAlphaBullet": rows(
                  ["8", "8", "8", "9", "9", "9", "9", "9", "10"]
              ),
              "bakugoTechBetaBase": [
                  ["Lv.1", "x2", "x1", "8s"],
                  ["Lv.2", "x2", "x1", "8s"],
                  ["Lv.3", "x2", "x1", "8s"],
                  ["Lv.4", "x2", "x1", "7s"],
                  ["Lv.5", "x2", "x1", "7s"],
                  ["Lv.6", "x2", "x1", "7s"],
                  ["Lv.7", "x2", "x1", "7s"],
                  ["Lv.8", "x2", "x1", "7s"],
                  ["Lv.9", "x2", "x1", "6s"],
              ],
              "bakugoTechBetaBulletSweat": rows(
                  ["17", "18", "19", "20", "21", "22", "23", "24", "25"]
              ),
              "bakugoTechBetaDeploySweat": rows(
                  ["5", "5", "5", "5", "5", "5", "5", "5", "5"]
              ),
              "bakugoTechBetaExplosion": rows(
                  ["35", "36", "37", "39", "40", "41", "42", "43", "45"]
              ),
              "bakugoTechBetaExplosionPlus": rows(
                  ["44", "46", "48", "50", "52", "54", "56", "58", "60"]
              ),
          }

          for variable, value in arrays.items():
              replacement = (
                  f"const {variable} = "
                  f"{json.dumps(value, ensure_ascii=False)};"
              )
              pattern = re.compile(
                  rf"const\s+{re.escape(variable)}\s*=\s*\[.*?\];",
                  flags=re.DOTALL,
              )
              html, count = pattern.subn(replacement, html, count=1)
              if count != 1:
                  raise SystemExit(
                      "[ERREUR] Tableau JavaScript introuvable : "
                      f"{variable}"
                  )

          html = html.replace(
              "Dégâts β — Explosion +",
              "Dégâts β — Explosion renforcée",
          )

          home_cache_pattern = re.compile(
              r'(<script\s+src=["\'](?:/)?data/home_data\.js)'
              r'(?:\?v=[^"\']*)?(["\'])',
              flags=re.IGNORECASE,
          )
          html, home_cache_count = home_cache_pattern.subn(
              rf"\1?v={home_hash}\2",
              html,
              count=1,
          )
          if home_cache_count != 1:
              raise SystemExit(
                  "[ERREUR] Balise data/home_data.js introuvable."
              )

          renderer_cache_pattern = re.compile(
              r'(<script\s+src=["\'](?:/)?js/v608-patch-notes-final\.js)'
              r'(?:\?v=[^"\']*)?(["\'])',
              flags=re.IGNORECASE,
          )
          html, renderer_cache_count = renderer_cache_pattern.subn(
              rf"\1?v={renderer_hash}\2",
              html,
              count=1,
          )
          if renderer_cache_count != 1:
              raise SystemExit(
                  "[ERREUR] Balise V608 introuvable dans index.html."
              )

          INDEX.write_text(html, encoding="utf-8")

          # Vérifications finales.
          repaired = json.loads(HOME_JSON.read_text(encoding="utf-8"))
          repaired_patch = next(
              item
              for item in repaired.get("patch_notes", [])
              if str(item.get("id")) == PATCH_ID
          )

          cluster_changes = [
              change
              for section in repaired_patch.get("details", [])
              for change in section.get("changes", [])
              if (
                  isinstance(change, dict)
                  and is_bakugo_cluster(change)
                  and is_damage_metric(change)
              )
          ]

          expected_titles = Counter(
              {
                  "α - AP Shot Cluster": 2,
                  "β - Nitro Cluster": 4,
              }
          )
          actual_titles = Counter(
              change.get("skill_name") for change in cluster_changes
          )

          if actual_titles != expected_titles:
              raise SystemExit(
                  "[ERREUR] Titres Bakugo incorrects : "
                  f"{dict(actual_titles)}"
              )

          expected_labels = Counter(
              {
                  "Dégâts — Normal": 1,
                  "Brise-garde — Normal": 1,
                  "Dégâts — Explosion": 1,
                  "Brise-garde — Explosion": 1,
                  "Dégâts — Explosion renforcée": 1,
                  "Brise-garde — Explosion renforcée": 1,
              }
          )
          actual_labels = Counter(
              change.get("label") for change in cluster_changes
          )
          if actual_labels != expected_labels:
              raise SystemExit(
                  "[ERREUR] Détails des buffs Bakugo incorrects : "
                  f"{dict(actual_labels)}"
              )

          missing_alter_symbols = [
              change
              for section in repaired_patch.get("details", [])
              for change in section.get("changes", [])
              if (
                  isinstance(change, dict)
                  and clean(change.get("skill_name"))
                  and change.get("skill_name", "").upper() not in {"HP", "PV"}
                  and alter_symbol(change)
                  and not re.match(r"^[αβγ]\s+-\s+", change.get("skill_name", ""))
              )
          ]
          if missing_alter_symbols:
              raise SystemExit(
                  "[ERREUR] Certaines cartes n'affichent pas α / β / γ."
              )

          armored_changes = [
              change
              for section in repaired_patch.get("details", [])
              for change in section.get("changes", [])
              if (
                  isinstance(change, dict)
                  and norm(change.get("character")) == "armored all might"
                  and change.get("skill_name")
                  == "α - Ice Bullet Shot"
                  and change.get("effect_detail") == "Brûlure (Burn)"
                  and is_damage_metric(change)
              )
          ]
          if len(armored_changes) != 2:
              raise SystemExit(
                  "[ERREUR] Les 2 cartes Alpha d'Armored All Might "
                  "ne sont pas correctes."
              )

          final_renderer = RENDERER.read_text(encoding="utf-8")
          if new_title not in final_renderer:
              raise SystemExit(
                  "[ERREUR] Le vrai nom du patch n'est pas prioritaire."
              )

          if (
              ":(change?.skill_image||skill?.img||'')" not in final_renderer
          ):
              raise SystemExit(
                  "[ERREUR] La vraie image du patch n'est pas prioritaire."
              )

          final_html = INDEX.read_text(encoding="utf-8")
          if not re.search(
              r'data/home_data\.js\?v=[0-9a-f]{12}',
              final_html,
          ):
              raise SystemExit(
                  "[ERREUR] Cache home_data.js non renouvelé."
              )
          if not re.search(
              r'js/v608-patch-notes-final\.js\?v=[0-9a-f]{12}',
              final_html,
          ):
              raise SystemExit(
                  "[ERREUR] Cache V608 non renouvelé."
              )

          js_text = HOME_JS.read_text(encoding="utf-8")
          prefix = "window.MHUR_HOME_DATA = "
          if not js_text.startswith(prefix) or not js_text.rstrip().endswith(";"):
              raise SystemExit("[ERREUR] home_data.js invalide.")

          js_data = json.loads(js_text[len(prefix):].strip()[:-1])
          if js_data != repaired:
              raise SystemExit(
                  "[ERREUR] home_data.js différent de home_data.json."
              )

          print("[OK] Patch Notes réparés avec les signes α / β / γ.")
          print("[OK] Bakugo : Normal, Explosion et Explosion renforcée sont précisés.")
          print("[OK] Armored All Might : α - Ice Bullet Shot, Brûlure (Burn).")
          print(f"[OK] Cache données : {home_hash}")
          print(f"[OK] Cache rendu : {renderer_hash}")
          PY

      - name: Publier le correctif
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/index.html \
            public/data/home_data.json \
            public/data/home_data.js \
            public/js/v608-patch-notes-final.js

          if git diff --cached --quiet; then
            echo "[OK] Les Patch Notes sont déjà réparés."
            exit 0
          fi

          git commit -m "fix: corriger les Patch Notes Bakugo et Armored All Might"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] Correctif publié sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative de publication..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Impossible de publier le correctif sur main."
          exit 1
