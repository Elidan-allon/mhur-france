name: MHUR V584 - patch notes double verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v584-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v584-patch-notes
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Auditer et corriger les Patch Notes
        shell: bash
        run: |
          cat > /tmp/mhur_v584.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import json
          import re
          import subprocess
          import unicodedata

          ROOT = Path.cwd()
          INDEX = ROOT / "public" / "index.html"
          HOME_JS = ROOT / "public" / "data" / "home_data.js"
          HOME_JSON = ROOT / "public" / "data" / "home_data.json"
          FINAL_JS = ROOT / "public" / "js" / "v584-patch-notes-final.js"
          REPORT = ROOT / "RAPPORT_V584_PATCH_NOTES.txt"

          def fail(message: str) -> None:
              raise RuntimeError(message)

          def read(path: Path) -> str:
              if not path.is_file():
                  fail(f"Fichier introuvable : {path.as_posix()}")
              return path.read_text(encoding="utf-8-sig")

          def write(path: Path, content: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.rstrip() + "\n", encoding="utf-8")

          def normalize(value: object) -> str:
              text = unicodedata.normalize("NFD", str(value or ""))
              text = "".join(
                  character
                  for character in text
                  if unicodedata.category(character) != "Mn"
              )
              text = text.lower()
              text = re.sub(r"[^a-z0-9]+", " ", text)
              return text.strip()

          def extract_number(value: object) -> float | None:
              match = re.search(r"[-+]?\d+(?:[.,]\d+)?", str(value or ""))
              if not match:
                  return None
              try:
                  return float(match.group(0).replace(",", "."))
              except ValueError:
                  return None

          def value_list(value: object) -> list[object]:
              return value if isinstance(value, list) else [value]

          def metric_direction(context: object) -> int:
              # 1 = une hausse est meilleure ; -1 = une baisse est meilleure.
              text = normalize(context)

              # Une VITESSE de recharge plus élevée est positive.
              if re.search(
                  r"(reload|recharge|cooldown|recovery) speed|"
                  r"speed (reload|recharge|cooldown|recovery)|"
                  r"vitesse de (recharge|rechargement|recuperation)",
                  text,
              ):
                  return 1

              # Un temps, un délai, un coût ou une consommation sont meilleurs en baissant.
              if re.search(
                  r"reload time|recharge time|cooldown time|charge time|"
                  r"recovery time|temps de recharge|temps de rechargement|"
                  r"reload|recharge|cooldown|interval|delay|startup|start up|"
                  r"end lag|second|seconde|time|temps|"
                  r"use ammo|ammo use|consumption|consommation|cost|cout|"
                  r"damage taken|degats subis|penalty|penalite",
                  text,
              ):
                  return -1

              # Statistiques généralement meilleures lorsqu'elles augmentent.
              if re.search(
                  r"damage|degats|ammo|munition|round|magazine|"
                  r"health|hp|pv|guard|armor|armure|"
                  r"range|portee|size|taille|radius|rayon|"
                  r"power|puissance|speed|vitesse|"
                  r"duration|duree|distance|amount|quantite|"
                  r"number|nombre|count|max",
                  text,
              ):
                  return 1

              return 0

          def explicit_tone(change: dict) -> str:
              value = normalize(change.get("tone") or change.get("type"))
              if re.search(r"\b(buff|increase|improve|up)\b", value):
                  return "buff"
              if re.search(r"\b(nerf|decrease|reduce|down)\b", value):
                  return "nerf"
              return "adjust"

          def numeric_tone(change: dict, section_title: str) -> str | None:
              before = value_list(change.get("before"))
              after = value_list(change.get("after"))

              context = " ".join(
                  str(value or "")
                  for value in (
                      section_title,
                      change.get("label"),
                      change.get("skill_name"),
                      change.get("stat"),
                      change.get("metric"),
                      " ".join(map(str, change.get("bullets") or [])),
                  )
              )

              direction = metric_direction(context)
              if direction == 0:
                  return None

              results: list[float] = []

              for old, new in zip(before, after):
                  old_number = extract_number(old)
                  new_number = extract_number(new)
                  if old_number is None or new_number is None:
                      continue

                  result = (new_number - old_number) * direction
                  if abs(result) > 1e-9:
                      results.append(result)

              if not results:
                  return None
              if all(result > 0 for result in results):
                  return "buff"
              if all(result < 0 for result in results):
                  return "nerf"

              # Certaines valeurs montent et d'autres baissent : ajustement mixte.
              return "adjust"

          def parse_home_data() -> dict:
              source = read(HOME_JS)
              match = re.fullmatch(
                  r"\s*window\.MHUR_HOME_DATA\s*=\s*(\{[\s\S]*\})\s*;?\s*",
                  source,
              )
              if not match:
                  fail("Impossible de lire window.MHUR_HOME_DATA.")
              return json.loads(match.group(1))

          def audit_data(data: dict) -> tuple[list[dict], int, int]:
              corrections: list[dict] = []
              checked = 0
              numerical = 0

              for note in data.get("patch_notes") or []:
                  for section in note.get("details") or []:
                      title = str(section.get("title") or "")

                      for change in section.get("changes") or []:
                          if not isinstance(change, dict):
                              continue

                          checked += 1
                          old_tone = explicit_tone(change)
                          calculated = numeric_tone(change, title)

                          if calculated is not None:
                              numerical += 1
                              final_tone = calculated
                          else:
                              final_tone = old_tone

                          if old_tone != "adjust" and old_tone != final_tone:
                              corrections.append(
                                  {
                                      "character": change.get("character") or "?",
                                      "style": change.get("style") or "Original",
                                      "skill": (
                                          change.get("skill_name")
                                          or change.get("label")
                                          or "Ajustement"
                                      ),
                                      "metric": change.get("label") or "",
                                      "before": change.get("before"),
                                      "after": change.get("after"),
                                      "old": old_tone,
                                      "new": final_tone,
                                  }
                              )

                          change["tone"] = final_tone

              return corrections, checked, numerical

          def save_home_data(data: dict) -> None:
              compact = json.dumps(
                  data,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )
              write(HOME_JS, f"window.MHUR_HOME_DATA = {compact};")

              if HOME_JSON.is_file():
                  write(
                      HOME_JSON,
                      json.dumps(data, ensure_ascii=False, indent=2),
                  )

          V584_JS = r"""
          /* MHUR Nexus — V584 : Patch Notes doublement vérifiés */
          (function(){
            'use strict';

            function language(){
              try{
                return typeof lang !== 'undefined' && lang === 'en' ? 'en' : 'fr';
              }catch(_error){
                return 'fr';
              }
            }

            function pick(value){
              if(value && typeof value === 'object' && !Array.isArray(value)){
                return value[language()] ?? value.fr ?? value.en ?? '';
              }
              return value;
            }

            function clean(value){
              return String(pick(value) ?? '').trim();
            }

            function normal(value){
              return clean(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
            }

            function comparableName(value){
              return normal(value)
                .replace(/\bfeet\b/g, 'foot')
                .replace(/\bquirk skill\b/g, '')
                .replace(/\balter\b/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            }

            function numberValue(value){
              const match = String(value ?? '')
                .replace(',', '.')
                .match(/[-+]?\d+(?:\.\d+)?/);

              return match ? Number(match[0]) : null;
            }

            function values(value){
              return Array.isArray(value) ? value : [value];
            }

            function metricDirection(context){
              const text = normal(context);

              if(
                /(reload|recharge|cooldown|recovery) speed|speed (reload|recharge|cooldown|recovery)|vitesse de (recharge|rechargement|recuperation)/
                  .test(text)
              ){
                return 1;
              }

              if(
                /reload time|recharge time|cooldown time|charge time|recovery time|temps de recharge|temps de rechargement|reload|recharge|cooldown|interval|delay|startup|start up|end lag|second|seconde|time|temps|use ammo|ammo use|consumption|consommation|cost|cout|damage taken|degats subis|penalty|penalite/
                  .test(text)
              ){
                return -1;
              }

              if(
                /damage|degats|ammo|munition|round|magazine|health|hp|pv|guard|armor|armure|range|portee|size|taille|radius|rayon|power|puissance|speed|vitesse|duration|duree|distance|amount|quantite|number|nombre|count|max/
                  .test(text)
              ){
                return 1;
              }

              return 0;
            }

            function explicitTone(change){
              const tone = normal(change?.tone || change?.type || '');

              if(/\b(buff|increase|improve|up)\b/.test(tone)) return 'buff';
              if(/\b(nerf|decrease|reduce|down)\b/.test(tone)) return 'nerf';

              return 'adjust';
            }

            function verifiedTone(change, sectionTitle){
              const context = [
                sectionTitle,
                change?.label,
                change?.skill_name,
                change?.stat,
                change?.metric,
                ...(change?.bullets || [])
              ].filter(Boolean).join(' ');

              const direction = metricDirection(context);

              if(direction){
                const before = values(change?.before);
                const after = values(change?.after);
                const results = [];

                for(let index = 0; index < Math.min(before.length, after.length); index += 1){
                  const oldValue = numberValue(before[index]);
                  const newValue = numberValue(after[index]);

                  if(!Number.isFinite(oldValue) || !Number.isFinite(newValue)) continue;

                  const result = (newValue - oldValue) * direction;
                  if(Math.abs(result) > 1e-9) results.push(result);
                }

                if(results.length){
                  if(results.every(result => result > 0)) return 'buff';
                  if(results.every(result => result < 0)) return 'nerf';
                  return 'adjust';
                }
              }

              return explicitTone(change);
            }

            function characterList(){
              try{
                if(typeof characters !== 'undefined' && Array.isArray(characters)){
                  return characters;
                }
              }catch(_error){}

              return Array.isArray(window.characters) ? window.characters : [];
            }

            function styleMap(){
              try{
                if(typeof styles !== 'undefined' && styles){
                  return styles;
                }
              }catch(_error){}

              return window.styles || {};
            }

            function characterFor(change){
              const wanted = normal(change?.character || '');
              if(!wanted) return null;

              return characterList().find(character => {
                return (
                  normal(character?.id) === wanted ||
                  normal(character?.name) === wanted ||
                  normal(character?.name).includes(wanted) ||
                  wanted.includes(normal(character?.name))
                );
              }) || null;
            }

            function letterCode(value){
              const raw = clean(value);
              const normalized = normal(raw);

              if(
                /^(?:sp|special)(?:\s|[-—:])/i.test(raw) ||
                normalized === 'sp' ||
                normalized.startsWith('special action')
              ){
                return 'sp';
              }

              if(
                /^(?:α|a|alpha)(?:\s|[-—:])/i.test(raw) ||
                normalized.startsWith('alpha ')
              ){
                return 'alpha';
              }

              if(
                /^(?:β|b|beta)(?:\s|[-—:])/i.test(raw) ||
                normalized.startsWith('beta ')
              ){
                return 'beta';
              }

              /*
                Les notes de patch utilisent Y pour la touche de l'Alter γ.
                G et Gamma sont également acceptés.
              */
              if(
                /^(?:γ|y|g|gamma)(?:\s|[-—:])/i.test(raw) ||
                normalized.startsWith('gamma ')
              ){
                return 'gamma';
              }

              return '';
            }

            function skillLetterCode(value){
              const raw = clean(value);
              const normalized = normal(raw);

              if(/^sp$/i.test(raw) || normalized === 'sp') return 'sp';
              if(/^(?:α|a|alpha)$/i.test(raw) || normalized === 'alpha') return 'alpha';
              if(/^(?:β|b|beta)$/i.test(raw) || normalized === 'beta') return 'beta';
              if(/^(?:γ|y|g|gamma)$/i.test(raw) || normalized === 'gamma') return 'gamma';

              return '';
            }

            function skillsFor(style){
              return [
                {...(style?.special || {}), letter: 'SP', special: true},
                ...(Array.isArray(style?.skills) ? style.skills : [])
              ];
            }

            function resolveSkill(change){
              const allStyles = styleMap();
              const character = characterFor(change);
              const ids = Array.isArray(character?.styles)
                ? character.styles.map(String)
                : [];

              if(!ids.length){
                return {character, styleId: '', style: null, skill: null};
              }

              const wantedStyle = normal(change?.style || 'Original');
              const wantedCode = letterCode(
                change?.skill_letter ||
                change?.skill ||
                change?.skill_name ||
                change?.label ||
                ''
              );
              const wantedName = comparableName(
                change?.skill_name || change?.label || ''
              );

              const orderedIds = [...ids].sort((first, second) => {
                const firstMatch = normal(allStyles[first]?.name || 'Original') === wantedStyle;
                const secondMatch = normal(allStyles[second]?.name || 'Original') === wantedStyle;
                return Number(secondMatch) - Number(firstMatch);
              });

              let nameMatch = null;

              for(const styleId of orderedIds){
                const style = allStyles[styleId];
                if(!style) continue;

                const available = skillsFor(style);

                if(wantedCode){
                  const byLetter = available.find(
                    skill => skillLetterCode(skill?.letter) === wantedCode
                  );

                  if(byLetter){
                    return {character, styleId, style, skill: byLetter};
                  }
                }

                if(wantedName){
                  const byName = available.find(skill => {
                    const official = comparableName(skill?.name);
                    return Boolean(
                      official &&
                      (
                        official === wantedName ||
                        official.includes(wantedName) ||
                        wantedName.includes(official)
                      )
                    );
                  });

                  if(byName && !nameMatch){
                    nameMatch = {character, styleId, style, skill: byName};
                  }
                }
              }

              if(nameMatch) return nameMatch;

              const styleId = orderedIds[0] || '';
              return {
                character,
                styleId,
                style: allStyles[styleId] || null,
                skill: null
              };
            }

            function originalInputLetter(change){
              const raw = clean(
                change?.skill_letter ||
                change?.skill ||
                change?.skill_name ||
                ''
              );

              const match = raw.match(/^(SP|SPECIAL|[AABGY]|ALPHA|BETA|GAMMA|α|β|γ)(?=\s|[-—:])/i);
              if(!match) return '';

              const value = match[1];
              const code = letterCode(value + ' -');

              if(code === 'gamma' && /^y$/i.test(value)) return 'Y';
              if(code === 'gamma' && /^g$/i.test(value)) return 'G';
              if(code === 'alpha' && /^a$/i.test(value)) return 'A';
              if(code === 'beta' && /^b$/i.test(value)) return 'B';
              if(code === 'sp') return 'SP';

              return value;
            }

            function officialTitle(change, resolved){
              const skill = resolved?.skill;
              if(!skill) return clean(change?.skill_name || change?.label || '');

              const name = clean(skill?.name);
              if(!name) return clean(change?.skill_name || change?.label || '');

              const inputLetter = originalInputLetter(change);
              const officialLetter = clean(skill?.letter);
              const letter = inputLetter || officialLetter;

              return letter ? letter + ' — ' + name : name;
            }

            function groupKey(change, resolved){
              return (
                normal(change?.character) +
                '__' +
                (
                  resolved?.styleId ||
                  normal(change?.style || 'Original')
                )
              );
            }

            function prepareData(){
              const notes = window.MHUR_HOME_DATA?.patch_notes || [];

              notes.forEach(note => {
                (note?.details || []).forEach(section => {
                  (section?.changes || []).forEach(change => {
                    if(!change || typeof change !== 'object') return;

                    change.tone = verifiedTone(change, section?.title || '');

                    const resolved = resolveSkill(change);
                    const title = officialTitle(change, resolved);

                    change.__mhurV584 = {
                      title,
                      image: clean(resolved?.skill?.img || change?.skill_image || ''),
                      styleId: resolved?.styleId || '',
                      key: groupKey(change, resolved)
                    };

                    /*
                      Le moteur existant retrouve désormais aussi l'objet Alter officiel.
                      Le titre final est ensuite imposé par V584 dans le DOM.
                    */
                    if(resolved?.skill?.name){
                      change.skill_name = clean(resolved.skill.name);
                    }
                  });
                });
              });
            }

            function orderedChanges(section){
              const groups = [];
              const map = new Map();

              (section?.changes || []).forEach(change => {
                if(!change || typeof change !== 'object') return;

                const resolved = resolveSkill(change);
                const key = change.__mhurV584?.key || groupKey(change, resolved);

                if(!map.has(key)){
                  const group = [];
                  map.set(key, group);
                  groups.push(group);
                }

                map.get(key).push(change);
              });

              return groups.flat();
            }

            function activeNoteIndex(modal){
              const active = modal.querySelector(
                '[data-patch-index].active'
              );

              const value = Number(active?.dataset?.patchIndex);
              return Number.isFinite(value) ? value : 0;
            }

            let applying = false;

            function applyToModal(){
              if(applying) return;

              const modal = document.querySelector('.s18NotesModalV10');
              if(!modal || !modal.classList.contains('open')) return;

              const notes = window.MHUR_HOME_DATA?.patch_notes || [];
              const note = notes[activeNoteIndex(modal)];
              if(!note) return;

              applying = true;

              try{
                prepareData();

                const dataSections = (note?.details || [])
                  .map(section => ({
                    ...section,
                    changes: (section?.changes || []).filter(Boolean)
                  }))
                  .filter(section => section.changes.length);

                const domSections = [
                  ...modal.querySelectorAll(
                    '.s18NotesBodyV10 > main .s18PatchSectionV10'
                  )
                ];

                domSections.forEach((sectionNode, sectionIndex) => {
                  const dataSection = dataSections[sectionIndex];
                  if(!dataSection) return;

                  const changes = orderedChanges(dataSection);
                  const cards = [
                    ...sectionNode.querySelectorAll('.s18PatchChangeV10')
                  ];

                  cards.forEach((card, changeIndex) => {
                    const change = changes[changeIndex];
                    if(!change) return;

                    const tone = verifiedTone(
                      change,
                      dataSection?.title || ''
                    );

                    card.classList.remove('buff', 'nerf', 'adjust');
                    card.classList.add(tone);

                    const badge = card.querySelector('.s18ToneV10');
                    if(badge){
                      badge.classList.remove('buff', 'nerf', 'adjust');
                      badge.classList.add(tone);

                      const label = tone === 'buff'
                        ? 'BUFF'
                        : tone === 'nerf'
                          ? 'NERF'
                          : language() === 'fr'
                            ? 'NEUTRE'
                            : 'NEUTRAL';

                      if(badge.textContent !== label){
                        badge.textContent = label;
                      }
                    }

                    const resolved = resolveSkill(change);
                    const title = officialTitle(change, resolved);

                    const heading = card.querySelector('h5');
                    if(heading && title && heading.textContent !== title){
                      heading.textContent = title;
                    }

                    const image = clean(
                      resolved?.skill?.img ||
                      change.__mhurV584?.image ||
                      ''
                    );

                    const picture = card.querySelector(
                      '.s18PatchSkillV10 img'
                    );

                    if(picture && image && picture.getAttribute('src') !== image){
                      picture.setAttribute('src', image);
                    }
                  });
                });
              }finally{
                applying = false;
              }
            }

            let scheduled = false;

            function schedule(){
              if(scheduled) return;
              scheduled = true;

              requestAnimationFrame(() => {
                scheduled = false;
                applyToModal();
              });
            }

            prepareData();

            new MutationObserver(mutations => {
              if(
                mutations.some(mutation =>
                  mutation.addedNodes?.length ||
                  mutation.type === 'attributes'
                )
              ){
                schedule();
              }
            }).observe(document.documentElement, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['class']
            });

            document.addEventListener('click', event => {
              if(
                event.target?.closest?.(
                  '[data-patch-index],[data-tab="patch"],' +
                  '#mhurPatchDevButton,.mhurPatchDevButton'
                )
              ){
                prepareData();
                schedule();
              }
            }, true);

            window.addEventListener('mhur:languagechange', () => {
              prepareData();
              schedule();
            });

            window.addEventListener('hashchange', schedule);
            window.addEventListener('load', schedule, {once: true});

            window.MHUR_V584_PATCH_NOTES = {
              refresh(){
                prepareData();
                applyToModal();
              },
              verifiedTone,
              resolveSkill
            };
          })();
          """

          def patch_index() -> None:
              html = read(INDEX)

              # Cache des données corrigées.
              home_pattern = re.compile(
                  r'(["\'])data/home_data\.js(?:\?[^"\']*)?\1',
                  flags=re.I,
              )
              if not home_pattern.search(html):
                  fail("Référence data/home_data.js introuvable dans index.html.")
              html = home_pattern.sub('"data/home_data.js?v=584"', html)

              # Retire une ancienne installation V584.
              html = re.sub(
                  r"\s*<script\b[^>]*src=[\"'][^\"']*"
                  r"v584-patch-notes-final\.js[^\"']*[\"'][^>]*>"
                  r"\s*</script>\s*",
                  "\n",
                  html,
                  flags=re.I,
              )

              if "</body>" not in html:
                  fail("Balise </body> introuvable dans index.html.")

              injection = (
                  "\n<!-- V584 est chargé après le moteur des Patch Notes. -->\n"
                  '<script src="js/v584-patch-notes-final.js?v=584"></script>\n'
              )

              html = html.replace("</body>", injection + "</body>", 1)
              write(INDEX, html)

          def format_value(value: object) -> str:
              if isinstance(value, list):
                  return "[" + ", ".join(map(str, value)) + "]"
              return str(value)

          def make_report(
              corrections: list[dict],
              checked: int,
              numerical: int,
          ) -> None:
              twice = [
                  correction
                  for correction in corrections
                  if "twice" in normalize(correction.get("character"))
              ]

              lines = [
                  "MHUR FRANCE — RAPPORT PATCH NOTES V584",
                  "",
                  "DOUBLE VÉRIFICATION UTILISÉE",
                  "1. Déterminer si la statistique est meilleure en montant ou en baissant.",
                  "2. Comparer chaque niveau Avant/Après, et pas seulement la moyenne.",
                  "3. Une conclusion numérique remplace une mauvaise étiquette BUFF/NERF.",
                  "4. Un résultat mélangé devient NEUTRE.",
                  "5. Sans valeurs exploitables, l'étiquette explicite est conservée.",
                  "",
                  f"Changements analysés : {checked}",
                  f"Changements vérifiés numériquement : {numerical}",
                  f"Contradictions BUFF/NERF corrigées : {len(corrections)}",
                  "",
                  "NOMS DES ALTERS",
                  "- Source : les objets Personnages et Styles déjà affichés par le site.",
                  "- Le nom suit automatiquement la langue de la fiche Personnage.",
                  "- Les noms officiels ne passent plus par la traduction libre des Patch Notes.",
                  "- A/α, B/β, Y/G/γ et SP sont reconnus.",
                  "- Foot Boost et Feet Boost sont rapprochés uniquement pour retrouver l'Alter.",
                  "",
                  f"Corrections concernant Twice : {len(twice)}",
              ]

              if twice:
                  for item in twice:
                      lines.append(
                          "- "
                          + str(item["skill"])
                          + " / "
                          + str(item["metric"])
                          + " : "
                          + format_value(item["before"])
                          + " → "
                          + format_value(item["after"])
                          + " : "
                          + item["old"].upper()
                          + " corrigé en "
                          + item["new"].upper()
                      )
              else:
                  lines.append(
                      "- Aucune contradiction Twice n'était présente dans la version analysée."
                  )

              lines += ["", "TOUTES LES CONTRADICTIONS CORRIGÉES"]

              if corrections:
                  for item in corrections:
                      lines.append(
                          "- "
                          + str(item["character"])
                          + " — "
                          + str(item["style"])
                          + " — "
                          + str(item["skill"])
                          + " — "
                          + str(item["metric"])
                          + " : "
                          + format_value(item["before"])
                          + " → "
                          + format_value(item["after"])
                          + " : "
                          + item["old"].upper()
                          + " → "
                          + item["new"].upper()
                      )
              else:
                  lines.append("- Aucune contradiction détectée.")

              lines += [
                  "",
                  "VÉRIFICATIONS TECHNIQUES",
                  "- temps de recharge en baisse = BUFF : OK",
                  "- vitesse de recharge en hausse = BUFF : OK",
                  "- comparaison niveau par niveau : OK",
                  "- noms officiels depuis les fiches Personnages : OK",
                  "- reconnaissance de Y comme Alter γ : OK",
                  "- script V584 chargé en dernier : OK",
                  "- syntaxe JavaScript : OK",
              ]

              write(REPORT, "\n".join(lines))

          def verify() -> None:
              html = read(INDEX)
              script = read(FINAL_JS)
              errors: list[str] = []

              if "data/home_data.js?v=584" not in html:
                  errors.append("cache home_data V584 absent")
              if "js/v584-patch-notes-final.js?v=584" not in html:
                  errors.append("script V584 absent de index.html")
              if "function verifiedTone" not in script:
                  errors.append("double vérification absente")
              if "function resolveSkill" not in script:
                  errors.append("résolution des noms officiels absente")
              if "Les notes de patch utilisent Y" not in script:
                  errors.append("reconnaissance Y/γ absente")
              if "replace(/\\bfeet\\b/g, 'foot')" not in script:
                  errors.append("correspondance Feet/Foot absente")

              result = subprocess.run(
                  ["node", "--check", str(FINAL_JS)],
                  text=True,
                  capture_output=True,
              )
              if result.returncode:
                  errors.append("syntaxe JavaScript invalide : " + result.stderr)

              if errors:
                  fail("Vérification V584 échouée :\n- " + "\n- ".join(errors))

          def main() -> None:
              data = parse_home_data()
              corrections, checked, numerical = audit_data(data)

              save_home_data(data)
              write(FINAL_JS, V584_JS)
              patch_index()
              verify()
              make_report(corrections, checked, numerical)

              print("[OK] V584 appliqué et vérifié.")
              print(f"[OK] Changements analysés : {checked}.")
              print(f"[OK] Vérifications numériques : {numerical}.")
              print(f"[OK] Contradictions corrigées : {len(corrections)}.")

              for item in corrections:
                  print(
                      "[CORRIGÉ] "
                      + str(item["character"])
                      + " — "
                      + str(item["skill"])
                      + " : "
                      + item["old"].upper()
                      + " -> "
                      + item["new"].upper()
                  )

              print("[OK] Les titres utilisent les Alters des fiches Personnages.")
              print("[OK] Rapport créé : RAPPORT_V584_PATCH_NOTES.txt")

          if __name__ == "__main__":
              main()
          PY
          python3 /tmp/mhur_v584.py

