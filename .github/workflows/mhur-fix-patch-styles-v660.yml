name: MHUR - Correctif styles Patch Notes V660

on:
  workflow_run:
    workflows:
      - "MHUR - Synchronisation UltraRumble"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-patch-notes-style-v660
  cancel-in-progress: false

jobs:
  corriger-styles-patch-notes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer la dernière version de main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Corriger Bakugo Original et Cluster
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import unicodedata
          from pathlib import Path

          PATCH_ID = "1785298405"

          INDEX = Path("public/index.html")
          HOME_JSON = Path("public/data/home_data.json")
          HOME_JS = Path("public/data/home_data.js")
          RENDERER = Path("public/js/v608-patch-notes-final.js")

          for required in (INDEX, HOME_JSON, RENDERER):
              if not required.is_file():
                  raise SystemExit(f"[ERREUR] Fichier introuvable : {required}")

          def clean(value: object) -> str:
              if isinstance(value, dict):
                  return str(
                      value.get("en")
                      or value.get("fr")
                      or next(iter(value.values()), "")
                  ).strip()
              return str(value or "").strip()

          def norm(value: object) -> str:
              text = unicodedata.normalize("NFD", clean(value).lower())
              text = "".join(
                  character
                  for character in text
                  if unicodedata.category(character) != "Mn"
              )
              return re.sub(r"[^a-z0-9]+", " ", text).strip()

          def replace_script_version(
              html: str,
              script_path: str,
              version: str,
          ) -> tuple[str, str]:
              """
              Modifie une balise script même si elle contient defer, async,
              des espaces ou d'autres attributs.

              Si la balise est absente, elle est ajoutée juste avant </body>.
              """
              escaped = re.escape(script_path)
              pattern = re.compile(
                  r'(<script\b[^>]*\bsrc\s*=\s*["\'](?:/)?'
                  + escaped
                  + r')(?:\?[^"\']*)?(["\'][^>]*>\s*</script>)',
                  flags=re.IGNORECASE,
              )

              replacement = rf"\1?v={version}\2"
              html, count = pattern.subn(replacement, html, count=1)

              if count == 1:
                  return html, "mise à jour"

              body_match = re.search(r"</body\s*>", html, flags=re.IGNORECASE)
              if not body_match:
                  raise SystemExit(
                      f"[ERREUR] Impossible d'ajouter {script_path} : </body> absent."
                  )

              tag = f'<script src="{script_path}?v={version}"></script>\n'
              html = (
                  html[:body_match.start()]
                  + tag
                  + html[body_match.start():]
              )
              return html, "ajout"

          data = json.loads(HOME_JSON.read_text(encoding="utf-8"))

          patch = next(
              (
                  item
                  for item in data.get("patch_notes", [])
                  if str(item.get("id")) == PATCH_ID
              ),
              None,
          )
          if patch is None:
              raise SystemExit(f"[ERREUR] Patch {PATCH_ID} introuvable.")

          changes = [
              change
              for section in patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict)
          ]

          cluster_count = 0
          armored_count = 0

          for change in changes:
              character = norm(change.get("character"))
              style = norm(change.get("style"))
              skill = norm(change.get("skill_name"))

              # Tous les changements Cluster, y compris munitions et dégâts,
              # doivent être associés à Bakugo Technique.
              if character == "katsuki bakugo" and style == "cluster":
                  change["style_id"] = "bakugo_technical"
                  change["role"] = "technical"
                  change["portrait"] = (
                      "assets/bakugo/bakugo_technical/portrait.webp"
                  )

                  if (
                      skill.startswith("a ")
                      or "ap shot cluster" in skill
                  ):
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/alpha.webp"
                      )
                  elif (
                      skill.startswith("b ")
                      or "nitro cluster" in skill
                  ):
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/beta.webp"
                      )
                  elif (
                      skill.startswith(("g ", "y "))
                      or "howitzer impact cluster" in skill
                  ):
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/gamma.webp"
                      )

                  cluster_count += 1
                  continue

              # Les changements de Bakugo Original restent séparés.
              if character == "katsuki bakugo" and style == "original":
                  change["style_id"] = "bakugo_attack"
                  change["role"] = "strike"
                  continue

              # Armored All Might reste son propre personnage Technique.
              if character == "armored all might":
                  change["style_id"] = "armored_all_might_technical"
                  change["role"] = "technical"
                  armored_count += 1

          if cluster_count < 6:
              raise SystemExit(
                  "[ERREUR] Au moins 6 changements Cluster attendus, "
                  f"trouvé : {cluster_count}"
              )

          if armored_count < 2:
              raise SystemExit(
                  "[ERREUR] Au moins 2 changements Armored All Might attendus, "
                  f"trouvé : {armored_count}"
              )

          data.setdefault("meta", {})["patch_style_resolution"] = (
              "v660-cluster-style-first"
          )

          HOME_JSON.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          compact = json.dumps(
              data,
              ensure_ascii=False,
              separators=(",", ":"),
          ).replace("\u2028", "\\u2028").replace("\u2029", "\\u2029")

          home_js_content = f"window.MHUR_HOME_DATA = {compact};\n"
          HOME_JS.write_text(home_js_content, encoding="utf-8")

          renderer = RENDERER.read_text(encoding="utf-8")

          function_start = renderer.find("  function resolveStyle(change){")
          function_end = renderer.find(
              "\n  function translatePatch(value){",
              function_start,
          )

          if function_start < 0 or function_end < 0:
              raise SystemExit(
                  "[ERREUR] Fonction resolveStyle introuvable dans V608."
              )

          new_resolve_style = """  function resolveStyle(change){
              const map=stylesMap();
              const character=findCharacter(change?.character);
              const ids=styleIds(character);

              /*
                V660 :
                1. style_id explicite ;
                2. règles Midoriya ;
                3. nom exact du style ;
                4. ressemblance du nom de compétence en dernier recours.
              */
              const explicitId=clean(
                change?.style_id||
                change?.styleId||
                ''
              );

              if(
                explicitId&&
                ids.includes(explicitId)&&
                map[explicitId]
              ){
                return {
                  character,
                  id:explicitId,
                  style:map[explicitId]
                };
              }

              const midoriyaId=midoriyaStyleId(
                change,
                character
              );

              if(midoriyaId&&map[midoriyaId]){
                return {
                  character,
                  id:midoriyaId,
                  style:map[midoriyaId]
                };
              }

              const wanted=normal(change?.style||'Original');

              const byStyle=ids.find(id=>
                normal(localized(map[id]?.name)||'Original')===wanted
              );

              if(byStyle){
                return {
                  character,
                  id:byStyle,
                  style:map[byStyle]
                };
              }

              const rawSkill=normal(
                change?.skill_name||
                change?.label
              );

              const bySkill=ids.find(id=>
                allSkills(map[id]).some(skill=>{
                  const name=normal(localized(skill?.name));

                  return (
                    name&&
                    (
                      name===rawSkill||
                      name.includes(rawSkill)||
                      rawSkill.includes(name)
                    )
                  );
                })
              );

              if(bySkill){
                return {
                  character,
                  id:bySkill,
                  style:map[bySkill]
                };
              }

              const id=ids[0]||'';

              return {
                character,
                id,
                style:map[id]||null
              };
            }
          """

          renderer = (
              renderer[:function_start]
              + new_resolve_style
              + renderer[function_end:]
          )

          renderer = re.sub(
              r"const VERSION='[^']*';",
              "const VERSION='660';",
              renderer,
              count=1,
          )

          explicit_position = renderer.find("const explicitId=clean(")
          style_position = renderer.find("const byStyle=ids.find(")
          skill_position = renderer.find("const bySkill=ids.find(")

          if not (
              0 <= explicit_position < style_position < skill_position
          ):
              raise SystemExit(
                  "[ERREUR] L'ordre style_id → style → compétence est incorrect."
              )

          RENDERER.write_text(renderer, encoding="utf-8")

          home_hash = hashlib.sha256(
              home_js_content.encode("utf-8")
          ).hexdigest()[:12]

          renderer_hash = hashlib.sha256(
              renderer.encode("utf-8")
          ).hexdigest()[:12]

          index = INDEX.read_text(encoding="utf-8")

          # Supprimer les anciens overlays qui pouvaient réécrire les cartes.
          index = re.sub(
              r'\s*<script\b[^>]*\bsrc\s*=\s*["\']'
              r'(?:/)?js/v65[78][^"\']*\.js'
              r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*',
              "\n",
              index,
              flags=re.IGNORECASE,
          )

          index, home_action = replace_script_version(
              index,
              "data/home_data.js",
              f"660-{home_hash}",
          )

          index, renderer_action = replace_script_version(
              index,
              "js/v608-patch-notes-final.js",
              f"660-{renderer_hash}",
          )

          INDEX.write_text(index, encoding="utf-8")

          # Vérifications finales.
          saved = json.loads(HOME_JSON.read_text(encoding="utf-8"))

          saved_patch = next(
              item
              for item in saved["patch_notes"]
              if str(item.get("id")) == PATCH_ID
          )

          saved_changes = [
              change
              for section in saved_patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict)
          ]

          bad_cluster = [
              change
              for change in saved_changes
              if (
                  norm(change.get("character")) == "katsuki bakugo"
                  and norm(change.get("style")) == "cluster"
                  and (
                      change.get("style_id") != "bakugo_technical"
                      or change.get("role") != "technical"
                      or change.get("portrait")
                      != "assets/bakugo/bakugo_technical/portrait.webp"
                      or "/bakugo_technical/" not in clean(
                          change.get("skill_image")
                      )
                  )
              )
          ]

          if bad_cluster:
              raise SystemExit(
                  "[ERREUR] Des cartes Cluster utilisent encore "
                  "Bakugo Original ou ses images."
              )

          final_index = INDEX.read_text(encoding="utf-8")

          if (
              f"data/home_data.js?v=660-{home_hash}"
              not in final_index
          ):
              raise SystemExit(
                  "[ERREUR] La nouvelle version de home_data.js n'est pas chargée."
              )

          if (
              "js/v608-patch-notes-final.js"
              f"?v=660-{renderer_hash}"
              not in final_index
          ):
              raise SystemExit(
                  "[ERREUR] La nouvelle version de V608 n'est pas chargée."
              )

          print(f"[OK] home_data.js : {home_action}.")
          print(f"[OK] V608 : {renderer_action}.")
          print(f"[OK] {cluster_count} changements Cluster corrigés.")
          print("[OK] Munitions et dégâts utilisent Bakugo Cluster.")
          print("[OK] Portrait : bakugo_technical/portrait.webp.")
          print("[OK] Icônes α/β/γ : dossier bakugo_technical.")
          print("[OK] Armored All Might reste séparé.")
          PY

      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/v608-patch-notes-final.js

      - name: Publier le correctif
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/index.html \
            public/data/home_data.json \
            public/data/home_data.js \
            public/js/v608-patch-notes-final.js

          if git diff --cached --quiet; then
            echo "[OK] Le correctif V660 est déjà appliqué."
            exit 0
          fi

          git commit -m "fix: séparer Bakugo Original et Cluster dans les patch notes"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] Correctif V660 publié sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Impossible de publier V660."
          exit 1
