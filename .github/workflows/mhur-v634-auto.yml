name: MHUR V634 - Tier List Gentle finale

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v634-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v634-tier-final
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer la Tier List finale V634
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v634.py <<'PY'
          
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          
          index_path=public/"index.html"
          community_path=public/"js"/"community-hub.js"
          v626_path=public/"js"/"v626-tier-final.js"
          v628_path=public/"js"/"v628-tier-dev-final.js"
          
          css_path=public/"css"/"v634-tier-final.css"
          js_path=public/"js"/"v634-tier-final.js"
          report_path=root/"RAPPORT_V634_TIER_LIST_FINAL.txt"
          
          for required in [index_path,community_path]:
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          community=community_path.read_text(encoding="utf-8")
          
          community,count_drop=re.subn(
              r"""t\('[^']*','Drop here'\)""",
              "t('Dépose ici','Drop here')",
              community,
              count=1,
          )
          
          community,count_unranked=re.subn(
              r"""t\('[^']*','Unranked'\)""",
              "t('Non classés','Unranked')",
              community,
              count=1,
          )
          
          community,count_help=re.subn(
              r"""t\('[^']*','Changes are saved only in your browser\. Publish your Tier List when you want to share it\.'\)""",
              "t('Les déplacements sont enregistrés uniquement dans ton navigateur. Publie ta Tier List lorsque tu veux la partager.','Changes are saved only in your browser. Publish your Tier List when you want to share it.')",
              community,
              count=1,
          )
          
          if count_drop!=1:
              raise SystemExit(
                  "[ERREUR] Texte Drop here introuvable dans community-hub.js."
              )
          
          if count_unranked!=1:
              raise SystemExit(
                  "[ERREUR] Texte Unranked introuvable dans community-hub.js."
              )
          
          if count_help!=1:
              raise SystemExit(
                  "[ERREUR] Phrase d'aide Tier List introuvable."
              )
          
          community_path.write_text(
              community,
              encoding="utf-8"
          )
          
          if v626_path.is_file():
              source=v626_path.read_text(encoding="utf-8")
          
              source=source.replace(
                  "function fixCards(output){\n"
                  "    if(window.MHUR_V634_TIER_FINAL_LOADED)return;\n",
                  "function fixCards(output){\n",
              )
          
              source=source.replace(
                  "function fixCards(output){",
                  "function fixCards(output){\n"
                  "    if(window.MHUR_V634_TIER_FINAL_LOADED)return;",
                  1,
              )
          
              v626_path.write_text(
                  source,
                  encoding="utf-8"
              )
          
          if v628_path.is_file():
              source=v628_path.read_text(encoding="utf-8")
          
              source=source.replace(
                  "function repairTier(){\n"
                  "    if(window.MHUR_V634_TIER_FINAL_LOADED)return;\n",
                  "function repairTier(){\n",
              )
          
              source=source.replace(
                  "function repairTier(){",
                  "function repairTier(){\n"
                  "    if(window.MHUR_V634_TIER_FINAL_LOADED)return;",
                  1,
              )
          
              v628_path.write_text(
                  source,
                  encoding="utf-8"
              )
          
          html=index_path.read_text(encoding="utf-8")
          
          patterns=[
              r'\s*<!-- V634 : Tier List finale CSS\. -->\s*'
              r'<link[^>]+v634-tier-final\.css[^>]*>\s*',
              r'\s*<link[^>]+v634-tier-final\.css[^>]*>\s*',
          
              r'\s*<!-- V634 : Tier List finale JS\. -->\s*'
              r'<script[^>]+v634-tier-final\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v634-tier-final\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(
                  pattern,
                  "\n",
                  html,
                  flags=re.I
              )
          
          html,count_community=re.subn(
              r'(<script\s+src=["\']js/community-hub\.js)'
              r'(?:\?[^"\']*)?(["\'])',
              r'\1?v=634\2',
              html,
              count=1,
              flags=re.I,
          )
          
          if count_community!=1:
              raise SystemExit(
                  "[ERREUR] Référence community-hub.js introuvable."
              )
          
          css_tag=(
              '<!-- V634 : Tier List finale CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v634-tier-final.css?v=634">\n'
          )
          
          js_tag=(
              '<!-- V634 : Tier List finale JS. -->\n'
              '<script src="js/v634-tier-final.js?v=634"></script>\n'
          )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads:
              raise SystemExit(
                  "[ERREUR] Balise </head> introuvable."
              )
          
          if not bodies:
              raise SystemExit(
                  "[ERREUR] Balise </body> introuvable."
              )
          
          head_position=heads[-1].start()
          html=html[:head_position]+css_tag+html[head_position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          body_position=bodies[-1].start()
          html=html[:body_position]+js_tag+html[body_position:]
          
          index_path.write_text(
              html,
              encoding="utf-8"
          )
          
          report_path.write_text(
              """MHUR NEXUS — V634
          
          CORRECTION UNIQUE : TIER LIST MOBILE ET ORDINATEUR
          
          GENTLE CRIMINAL
          - Suppression de tous les anciens badges NEW en double.
          - Blocage des injections Tier List de V626 et V628 après V634.
          - Création d'un seul badge NEW en haut à droite.
          - Petite taille et animation conservées.
          - La carte garde sa taille normale.
          - Le nom et le style restent sur deux lignes distinctes.
          
          TEXTES
          - Dֳ©pose ici / D�pose ici devient « Dépose ici ».
          - Non classֳ©s devient « Non classés ».
          - La phrase d'aide est réécrite en UTF-8 propre.
          - Les textes anglais restent inchangés.
          
          NON MODIFIÉ
          - Dev Notes de V628.
          - Builds communautaires.
          - Costumes.
          - T.U.N.I.N.G.
          - Header et navigation.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V634 appliqué.")
          
          PY
          
          cat > /tmp/verifier_v634.py <<'PY'
          
          from pathlib import Path
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          community=Path(
              "public/js/community-hub.js"
          ).read_text(encoding="utf-8")
          css=Path(
              "public/css/v634-tier-final.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v634-tier-final.js"
          ).read_text(encoding="utf-8")
          
          if index.count(
              "css/v634-tier-final.css?v=634"
          )!=1:
              raise SystemExit(
                  "[ERREUR] CSS V634 absent ou dupliqué."
              )
          
          if index.count(
              "js/v634-tier-final.js?v=634"
          )!=1:
              raise SystemExit(
                  "[ERREUR] JS V634 absent ou dupliqué."
              )
          
          if index.count(
              "js/community-hub.js?v=634"
          )!=1:
              raise SystemExit(
                  "[ERREUR] Cache community-hub non actualisé."
              )
          
          for token in [
              "Dépose ici",
              "Non classés",
              "Les déplacements sont enregistrés uniquement",
          ]:
              if token not in community:
                  raise SystemExit(
                      f"[ERREUR] Texte source manquant : {token}"
                  )
          
          for bad in [
              "Dֳ©pose ici",
              "Non classֳ©s",
              "Les dֳ©placements",
          ]:
              if bad in community:
                  raise SystemExit(
                      f"[ERREUR] Texte corrompu encore présent : {bad}"
                  )
          
          for token in [
              ".mhurTierNewV634",
              "right:5px!important",
              ".mhurTierDropHint",
              "@keyframes mhurV634NewPulse",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V634 incomplet : {token}"
                  )
          
          for token in [
              "removeOldBadges",
              "ensureOneBadge",
              "repairTexts",
              "MHUR_V634_TIER_FINAL_LOADED",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS V634 incomplet : {token}"
                  )
          
          v626=Path("public/js/v626-tier-final.js")
          if v626.is_file():
              source=v626.read_text(encoding="utf-8")
          
              if (
                  "function fixCards(output){" in source and
                  "if(window.MHUR_V634_TIER_FINAL_LOADED)return;" not in source
              ):
                  raise SystemExit(
                      "[ERREUR] V626 peut encore réinjecter son badge."
                  )
          
          v628=Path("public/js/v628-tier-dev-final.js")
          if v628.is_file():
              source=v628.read_text(encoding="utf-8")
          
              if (
                  "function repairTier(){" in source and
                  "if(window.MHUR_V634_TIER_FINAL_LOADED)return;" not in source
              ):
                  raise SystemExit(
                      "[ERREUR] V628 peut encore réinjecter son badge."
                  )
          
          print("[OK] Contrôles V634 validés.")
          
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v634.py
          
            node --check public/js/community-hub.js
            node --check public/js/v634-tier-final.js
          
            if [ -f public/js/v626-tier-final.js ]; then
              node --check public/js/v626-tier-final.js
            fi
          
            if [ -f public/js/v628-tier-dev-final.js ]; then
              node --check public/js/v628-tier-dev-final.js
            fi
          
            python3 /tmp/verifier_v634.py
          
            git add     public/index.html     public/js/community-hub.js     public/css/v634-tier-final.css     public/js/v634-tier-final.js     RAPPORT_V634_TIER_LIST_FINAL.txt
          
            if [ -f public/js/v626-tier-final.js ]; then
              git add public/js/v626-tier-final.js
            fi
          
            if [ -f public/js/v628-tier-dev-final.js ]; then
              git add public/js/v628-tier-dev-final.js
            fi
          
            if git diff --cached --quiet; then
              echo "[INFO] V634 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: Tier List Gentle et textes UTF-8 V634"
          
            if git push origin HEAD:main; then
              echo "[OK] V634 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V634 après cinq tentatives."
          exit 1
