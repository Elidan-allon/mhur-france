name: MHUR - INSTALLATEUR CORRECTIFS NEXUS V25

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: install
        type: choice
        options:
          - install
          - verify

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: mhur-nexus-v25-installer
  cancel-in-progress: false

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'install'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurer Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Installer le moteur stats V25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/js mise_a_jour/outils

          cat > public/js/v25-exact-stats-runtime.js <<'JS'
          (() => {
            'use strict';

            const MARK = 'MHUR_V25_EXACT_STATS_RUNTIME';

            function pick(v) {
              if (v && typeof v === 'object' && !Array.isArray(v)) {
                const current = (typeof lang !== 'undefined' && lang === 'en') ? 'en' : 'fr';
                return v[current] ?? v.fr ?? v.en ?? '';
              }
              return v;
            }

            function clean(v) {
              return String(pick(v) ?? '')
                .replace(/[\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff]/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
            }

            function norm(v) {
              return clean(v)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[’']/g, '')
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '');
            }

            function readExact() {
              const el = document.getElementById('ultrarumble-exact-data');
              if (!el) return null;
              try {
                return JSON.parse(el.textContent || '{}');
              } catch (_e) {
                return null;
              }
            }

            function rowsOf(table) {
              return Array.isArray(table?.rows)
                ? table.rows.map(row => Array.isArray(row) ? row.map(x => String(x ?? '')) : [])
                : [];
            }

            function colsOf(table) {
              return Array.isArray(table?.columns)
                ? table.columns.map(x => String(x ?? ''))
                : Array.isArray(table?.cols)
                  ? table.cols.map(x => String(x ?? ''))
                  : [];
            }

            function findLevelIndex(row) {
              return (row || []).findIndex(value => /^Lv\.\d+$/i.test(String(value || '').trim()));
            }

            function translateColumn(col, language) {
              const n = norm(col);
              const fr = {
                type: 'Type',
                level: 'Niveau',
                damage: 'Dégâts',
                ammo: 'Munitions',
                use_ammo: 'Consommation',
                reload: 'Recharge',
                level_up_effect: 'Effet de montée',
                effect: 'Effet de montée'
              };
              const en = {
                type: 'Type',
                level: 'Level',
                damage: 'Damage',
                ammo: 'Ammo',
                use_ammo: 'Use Ammo',
                reload: 'Reload',
                level_up_effect: 'Level Up Effect',
                effect: 'Level Up Effect'
              };
              return (language === 'fr' ? fr : en)[n] || clean(col);
            }

            function baseTable(symbol, remote) {
              const originalCols = colsOf(remote);
              const originalRows = rowsOf(remote);
              if (!originalRows.length) return null;

              const keep = originalCols
                .map((col, index) => ({ col, index }))
                .filter(item => !['down_power', 'down'].includes(norm(item.col)));

              return {
                title: {
                  fr: `Valeurs de base ${symbol}`,
                  en: `Base ${symbol} values`
                },
                cols: {
                  fr: keep.map(item => translateColumn(item.col, 'fr')),
                  en: keep.map(item => translateColumn(item.col, 'en'))
                },
                rows: {
                  fr: originalRows.map(row => keep.map(item => clean(row[item.index] ?? ''))),
                  en: originalRows.map(row => keep.map(item => clean(row[item.index] ?? '')))
                },
                __mhurV25: 'base'
              };
            }

            function typeNames(raw, styleId, symbol, groupIndex, totalGroups) {
              const original = clean(raw) || 'Value';
              const n = norm(original);

              let fr = original;
              let en = original;

              const mappings = [
                [['melee_combat', 'melee'], 'Corps à corps', 'Melee Combat'],
                [['upon_activation', 'activation'], 'Activation', 'Activation'],
                [['shockwave'], 'Onde de choc', 'Shockwave'],
                [['bullet', 'projectile'], 'Projectile', 'Projectile'],
                [['rush'], 'Ruée', 'Rush'],
                [['rebound', 'bounce'], 'Rebond', 'Rebound'],
                [['impact'], 'Impact final', 'Impact'],
                [['explosion'], 'Explosion', 'Explosion'],
                [['short_range'], 'Distance courte', 'Short Range'],
                [['middle_range', 'medium_range'], 'Distance moyenne', 'Medium Range'],
                [['long_range', 'max_range'], 'Distance longue', 'Long Range'],
                [['charge'], 'Charge', 'Charge'],
                [['pull', 'grab'], 'Attraction', 'Pull'],
                [['normal'], 'Normal', 'Normal']
              ];

              for (const [needles, frLabel, enLabel] of mappings) {
                if (needles.some(word => n.includes(word))) {
                  fr = frLabel;
                  en = enLabel;
                  break;
                }
              }

              // UltraRumble fournit actuellement Gentle γ comme trois cycles "Rush".
              // Le site connaît déjà la signification de ces trois séries :
              // Ruée / Rebond / Impact final.
              if (
                norm(styleId).includes('gentle_criminal') &&
                symbol === 'γ' &&
                totalGroups >= 3
              ) {
                const gentleLabels = [
                  ['Ruée', 'Rush'],
                  ['Rebond', 'Rebound'],
                  ['Impact final', 'Impact']
                ];
                if (gentleLabels[groupIndex]) {
                  [fr, en] = gentleLabels[groupIndex];
                }
              }

              return { fr, en };
            }

            function splitAdditional(symbol, remote, styleId) {
              const cols = colsOf(remote);
              const rows = rowsOf(remote);
              if (!rows.length) return [];

              const normalizedCols = cols.map(norm);
              let typeIndex = normalizedCols.indexOf('type');
              let levelIndex = normalizedCols.indexOf('level');
              let damageIndex = normalizedCols.indexOf('damage');

              if (typeIndex < 0) typeIndex = 0;
              if (levelIndex < 0) levelIndex = 1;
              if (damageIndex < 0) damageIndex = 2;

              const groups = [];
              let current = null;
              let lastType = 'Value';

              for (const source of rows) {
                const row = [...source];
                const detectedLevelIndex = findLevelIndex(row);
                const li = detectedLevelIndex >= 0 ? detectedLevelIndex : levelIndex;
                const level = String(row[li] ?? '').trim();
                if (!/^Lv\.\d+$/i.test(level)) continue;

                let rawType = String(row[typeIndex] ?? '').trim();
                if (rawType) lastType = rawType;
                rawType = rawType || lastType || 'Value';

                const key = norm(rawType) || 'value';
                const restart = /^Lv\.1$/i.test(level) && current && current.rows.length;
                const changedType = current && current.key !== key;

                if (!current || restart || changedType) {
                  current = { key, rawType, rows: [] };
                  groups.push(current);
                }

                let damage = String(row[damageIndex] ?? '').trim();
                if (!damage && li + 1 < row.length) {
                  damage = String(row[li + 1] ?? '').trim();
                }

                current.rows.push({ level, damage });
              }

              return groups.map((group, groupIndex) => {
                const labels = typeNames(
                  group.rawType,
                  styleId,
                  symbol,
                  groupIndex,
                  groups.length
                );

                return {
                  title: {
                    fr: `Dégâts ${symbol} — ${labels.fr}`,
                    en: `${symbol} Damage — ${labels.en}`
                  },
                  cols: {
                    fr: ['Type', 'Niveau', 'Dégâts'],
                    en: ['Type', 'Level', 'Damage']
                  },
                  rows: {
                    fr: group.rows.map(row => [labels.fr, row.level, row.damage]),
                    en: group.rows.map(row => [labels.en, row.level, row.damage])
                  },
                  __mhurV25: 'additional'
                };
              });
            }

            function isEffectTable(table) {
              const title = norm(clean(table?.title));
              const cols = Array.isArray(pick(table?.cols))
                ? pick(table.cols).map(norm)
                : Array.isArray(pick(table?.columns))
                  ? pick(table.columns).map(norm)
                  : [];

              return (
                title.includes('effet') ||
                title.includes('effect') ||
                cols.includes('level_up_effect') ||
                cols.includes('effet_de_montee')
              );
            }

            function effectTable(symbol, remote, existingEffects) {
              const cols = colsOf(remote);
              const rows = rowsOf(remote);
              if (!rows.length) return existingEffects;

              const keep = cols
                .map((col, index) => ({ col, index }))
                .filter(item => !['down_power', 'down'].includes(norm(item.col)));

              return [{
                title: {
                  fr: `Effets de montée ${symbol}`,
                  en: `${symbol} level-up effects`
                },
                cols: {
                  fr: keep.map(item => translateColumn(item.col, 'fr')),
                  en: keep.map(item => translateColumn(item.col, 'en'))
                },
                rows: {
                  fr: rows.map(row => keep.map(item => clean(row[item.index] ?? ''))),
                  en: rows.map(row => keep.map(item => clean(row[item.index] ?? '')))
                },
                __mhurV25: 'effect'
              }];
            }

            function skillBySymbol(style, symbol) {
              const aliases = {
                'α': ['α', 'alpha', 'a'],
                'β': ['β', 'beta', 'b'],
                'γ': ['γ', 'gamma', 'g']
              }[symbol] || [symbol];

              return (style?.skills || []).find(skill =>
                aliases.includes(String(skill?.letter || '').trim().toLowerCase())
              ) || null;
            }

            function syncSkill(localSkill, remoteSkill, styleId, symbol) {
              if (!localSkill || !remoteSkill) return 0;

              const currentTables = Array.isArray(localSkill.tables)
                ? localSkill.tables
                : [];

              const existingEffects = currentTables.filter(isEffectTable);
              const remoteBaseRows = rowsOf(remoteSkill.base_values);
              const remoteAdditionalRows = rowsOf(remoteSkill.additional_values);
              const remoteEffectRows = rowsOf(remoteSkill.level_up_effects);

              // Si UltraRumble ne fournit aucune table pour cet Alter, on ne touche rien.
              if (
                !remoteBaseRows.length &&
                !remoteAdditionalRows.length &&
                !remoteEffectRows.length
              ) {
                return 0;
              }

              const next = [];
              next.push(...effectTable(
                symbol,
                remoteSkill.level_up_effects,
                existingEffects
              ));

              const base = baseTable(symbol, remoteSkill.base_values);
              if (base) next.push(base);

              next.push(...splitAdditional(
                symbol,
                remoteSkill.additional_values,
                styleId
              ));

              // Si la source n'a pas de base mais qu'il y avait une table locale
              // sans Type (ex. une table spéciale non gérée), on la conserve.
              if (!base && remoteAdditionalRows.length) {
                const extras = currentTables.filter(table => {
                  if (isEffectTable(table)) return false;
                  const cols = Array.isArray(pick(table?.cols))
                    ? pick(table.cols).map(norm)
                    : [];
                  return !cols.includes('type');
                });
                next.splice(existingEffects.length, 0, ...extras);
              }

              localSkill.tables = next;
              return 1;
            }

            function syncAll() {
              const data = readExact();
              if (!data?.exact_by_style || typeof styles === 'undefined') {
                return { loaded: false, styles: 0, skills: 0 };
              }

              let touchedStyles = 0;
              let touchedSkills = 0;

              for (const [styleId, remoteStyle] of Object.entries(data.exact_by_style)) {
                const localStyle = styles[styleId];
                if (!localStyle) continue;

                touchedStyles += 1;

                const hp =
                  remoteStyle?.stats?.['Max Main Health'] ??
                  remoteStyle?.stats?.['Max Health'] ??
                  remoteStyle?.stats?.['Max HP'];

                if (hp !== undefined && hp !== null && hp !== '') {
                  localStyle.pv = String(hp);
                }

                for (const symbol of ['α', 'β', 'γ']) {
                  const localSkill = skillBySymbol(localStyle, symbol);
                  const remoteSkill = remoteStyle?.skills?.[symbol];
                  touchedSkills += syncSkill(
                    localSkill,
                    remoteSkill,
                    styleId,
                    symbol
                  );
                }
              }

              const status = {
                loaded: true,
                styles: touchedStyles,
                skills: touchedSkills,
                marker: MARK
              };
              window.__MHUR_V25_STATS_STATUS__ = status;
              return status;
            }

            function installRenderHook() {
              if (typeof render !== 'function') return;
              if (render.__mhurV25ExactStats) return;

              const previous = render;
              const wrapped = function () {
                try { syncAll(); } catch (_e) {}
                return previous.apply(this, arguments);
              };
              wrapped.__mhurV25ExactStats = true;

              try { render = wrapped; } catch (_e) {}
              window.__MHUR_V25_RENDER_HOOK__ = true;
            }

            window.MHUR_V25_STATS_SYNC = syncAll;

            try {
              syncAll();
              installRenderHook();
            } catch (_e) {}

            document.addEventListener('DOMContentLoaded', () => {
              try {
                syncAll();
                installRenderHook();
              } catch (_e) {}
            });

            window.addEventListener('mhur:languagechange', () => {
              try { syncAll(); } catch (_e) {}
            });

            setTimeout(() => {
              try {
                syncAll();
                installRenderHook();
                if (
                  typeof render === 'function' &&
                  !window.__MHUR_V25_INITIAL_RENDER_DONE__
                ) {
                  window.__MHUR_V25_INITIAL_RENDER_DONE__ = true;
                  render();
                }
              } catch (_e) {}
            }, 0);

            setTimeout(() => {
              try { syncAll(); } catch (_e) {}
            }, 250);
          })();
          JS

          node --check public/js/v25-exact-stats-runtime.js

      - name: Installer le correctif permanent V25
        shell: bash
        run: |
          set -euo pipefail

          cat > mise_a_jour/outils/mhur_v25_persistent_fixes.py <<'PY'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          from __future__ import annotations

          import argparse
          import re
          from pathlib import Path

          SCRIPT_TAG = '<script src="js/v25-exact-stats-runtime.js?v=25"></script>'
          HOME_MARK = "MHUR_V25_LOGIN_CACHE"

          def read(path: Path) -> str:
              if not path.exists():
                  raise SystemExit(f"[V25][ERREUR] Fichier introuvable : {path}")
              return path.read_text(encoding="utf-8")

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding="utf-8", newline="\n")

          def ensure_runtime(index_path: Path) -> bool:
              text = read(index_path)

              if SCRIPT_TAG in text:
                  print("[V25][OK] Script runtime déjà chargé")
                  return False

              if "</body>" not in text:
                  raise SystemExit("[V25][ERREUR] </body> introuvable dans public/index.html")

              text = text.replace(
                  "</body>",
                  f"<!-- MHUR V25 : stats exactes + séparation automatique -->\n{SCRIPT_TAG}\n</body>",
                  1,
              )
              write(index_path, text)
              print("[V25][PATCH] Script V25 ajouté juste avant </body>")
              return True

          def ensure_home_force(home_path: Path) -> bool:
              text = read(home_path)
              changed = False

              # Signature : recherche souple, sans dépendre de l'indentation.
              if "force: bool = False" not in text:
                  pattern = (
                      r"def\s+download_asset\("
                      r"root:\s*Path,\s*url:\s*str,\s*rel_stem:\s*str,\s*"
                      r"retries:\s*int\s*=\s*4"
                      r"\)\s*->\s*str:"
                  )
                  replacement = (
                      "def download_asset(root: Path, url: str, rel_stem: str, "
                      "retries: int = 4, force: bool = False) -> str:"
                  )
                  text, count = re.subn(pattern, replacement, text, count=1)
                  if count != 1:
                      raise SystemExit("[V25][ERREUR] Signature download_asset introuvable")
                  changed = True
                  print("[V25][PATCH] download_asset accepte force=True")

              # Cache : remplace uniquement le premier bloc à l'intérieur de download_asset.
              if "if cached and not force:" not in text:
                  pattern = (
                      r"(?m)^(?P<i>\s*)cached\s*=\s*existing_asset\(root,\s*rel_stem\)\s*$"
                      r"\n(?P=i)if\s+cached:\s*$"
                      r"\n(?P=i)\s+return\s+cached\s*$"
                  )
                  replacement = (
                      r"\g<i>cached = existing_asset(root, rel_stem)\n"
                      r"\g<i>if cached and not force:\n"
                      r"\g<i>    return cached"
                  )
                  text, count = re.subn(pattern, replacement, text, count=1)
                  if count != 1:
                      raise SystemExit("[V25][ERREUR] Bloc cache download_asset introuvable")
                  changed = True
                  print("[V25][PATCH] ancien cache non bloquant")

              # En cas d'erreur réseau, garde l'image précédente.
              warning_pattern = (
                  r'(?m)^(?P<i>\s*)print\(f"\[HOME IMAGE WARNING\] \{url\}: \{exc\}", flush=True\)\s*$'
                  r'\n(?P=i)return\s+""\s*$'
              )
              if re.search(warning_pattern, text):
                  text = re.sub(
                      warning_pattern,
                      r'\g<i>print(f"[HOME IMAGE WARNING] {url}: {exc}", flush=True)\n'
                      r'\g<i>return cached or ""',
                      text,
                      count=1,
                  )
                  changed = True
                  print("[V25][PATCH] cache utilisé seulement en secours réseau")

              # Appel spécifique Login Bonus : ajoute force=True dans CE bloc seulement.
              if not re.search(
                  r'assets/home/bonuses/\{slug\(title,\s*70\)\}.*?force=True',
                  text,
                  re.S,
              ):
                  pattern = (
                      r'(?P<block>'
                      r'local\s*=\s*download_asset\(\s*'
                      r'root,\s*'
                      r'remote,\s*'
                      r'f"assets/home/bonuses/\{slug\(title,\s*70\)\}",\s*'
                      r')\)'
                  )
                  match = re.search(pattern, text, re.S)
                  if not match:
                      raise SystemExit("[V25][ERREUR] Appel Login Bonus download_asset introuvable")
                  replacement = match.group("block") + "force=True,\n            )"
                  text = text[:match.start()] + replacement + text[match.end():]
                  changed = True
                  print("[V25][PATCH] Login Bonus force le retéléchargement")

              if HOME_MARK not in text:
                  signature_end = re.search(
                      r"def\s+download_asset\([^\n]+\)\s*->\s*str:\s*\n",
                      text,
                  )
                  if signature_end:
                      insert = signature_end.end()
                      text = (
                          text[:insert]
                          + f"    # {HOME_MARK}\n"
                          + text[insert:]
                      )
                      changed = True

              if changed:
                  write(home_path, text)

              required = [
                  "force: bool = False",
                  "if cached and not force:",
                  "force=True,",
              ]
              missing = [token for token in required if token not in text]
              if missing:
                  raise SystemExit(
                      "[V25][ERREUR] Vérification Login Bonus : "
                      + ", ".join(missing)
                  )

              return changed

          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo-root", default=".")
              args = parser.parse_args()

              root = Path(args.repo_root)
              ensure_runtime(root / "public" / "index.html")
              ensure_home_force(root / "mise_a_jour" / "outils" / "update_home_data.py")

              print("[V25][OK] Correctifs permanents appliqués")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python -m py_compile mise_a_jour/outils/mhur_v25_persistent_fixes.py

          python mise_a_jour/outils/mhur_v25_persistent_fixes.py \
            --repo-root .

          node --check public/js/v25-exact-stats-runtime.js

      - name: Corriger durablement le Guardian V19
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml")
          if not path.exists():
              raise SystemExit("[V25][ERREUR] Guardian V19 introuvable")

          text = path.read_text(encoding="utf-8")

          # 1. Le job scan teste déjà 11 * * * * : on aligne le schedule.
          if 'cron: "1 * * * *"' in text:
              text = text.replace(
                  'cron: "1 * * * *"',
                  'cron: "11 * * * *"',
                  1,
              )
              print("[V25][PATCH] V19 : cron 1 -> 11")
          elif 'cron: "11 * * * *"' in text:
              print("[V25][OK] V19 : cron déjà à 11")
          else:
              raise SystemExit("[V25][ERREUR] Cron principal V19 introuvable")

          # 2. Désactive UNIQUEMENT les appels d'application de l'ancien
          # repair_login_bonuses_v17.py. Le --self-test peut rester.
          repair_pattern = (
              r"(?m)^(?P<i>[ \t]*)python[ \t]+/tmp/repair_login_bonuses_v17\.py[ \t]*\\[ \t]*\n"
              r"(?P=i)[ \t]*--site-root[ \t]+public[ \t]*$"
          )

          matches = list(re.finditer(repair_pattern, text))
          if matches:
              def replace_repair(match):
                  i = match.group("i")
                  return (
                      f'{i}# MHUR V25 : ancien réparateur Login Bonus désactivé.\n'
                      f'{i}echo "[V25] Login Bonus gérés par update_home_data.py"'
                  )

              text, count = re.subn(
                  repair_pattern,
                  replace_repair,
                  text,
              )
              print(f"[V25][PATCH] V19 : {count} ancien(s) repair actif(s) désactivé(s)")
          elif "ancien réparateur Login Bonus désactivé" in text:
              print("[V25][OK] V19 : vieux repair déjà désactivé")
          else:
              raise SystemExit(
                  "[V25][ERREUR] Les appels actifs repair_login_bonuses_v17.py "
                  "n'ont pas été trouvés"
              )

          # 3. Après chaque reconstruction complète du site, réapplique V25.
          persistent_call = (
              "          python mise_a_jour/outils/mhur_v25_persistent_fixes.py \\\n"
              "            --repo-root .\n"
          )

          if "mhur_v25_persistent_fixes.py" not in text:
              # Ancre très stable du V19 actuel : juste avant les node --check.
              anchor = "          node --check public/js/home.js\n"
              pos = text.find(anchor)

              if pos < 0:
                  raise SystemExit(
                      "[V25][ERREUR] Ancre node --check public/js/home.js introuvable"
                  )

              text = (
                  text[:pos]
                  + persistent_call
                  + "\n"
                  + text[pos:]
              )
              print("[V25][PATCH] V19 : réapplication V25 ajoutée après reconstruction")
          else:
              print("[V25][OK] V19 : réapplication V25 déjà présente")

          path.write_text(text, encoding="utf-8", newline="\n")

          final = path.read_text(encoding="utf-8")

          if re.search(repair_pattern, final):
              raise SystemExit(
                  "[V25][ERREUR] Un ancien repair Login Bonus est encore actif"
              )

          if "mhur_v25_persistent_fixes.py" not in final:
              raise SystemExit(
                  "[V25][ERREUR] V19 n'appelle pas le correctif permanent V25"
              )

          if 'cron: "11 * * * *"' not in final:
              raise SystemExit("[V25][ERREUR] Cron V19 non corrigé")

          print("[V25][OK] Guardian V19 corrigé durablement")
          PY

      - name: Vérifications réelles avant commit
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            mise_a_jour/outils/update_home_data.py \
            mise_a_jour/outils/mhur_v25_persistent_fixes.py

          node --check public/js/v25-exact-stats-runtime.js

          # Réexécution : le correctif doit être idempotent.
          python mise_a_jour/outils/mhur_v25_persistent_fixes.py \
            --repo-root .

          node --check public/js/v25-exact-stats-runtime.js

          grep -q "v25-exact-stats-runtime.js?v=25" public/index.html
          grep -q "MHUR_V25_EXACT_STATS_RUNTIME" public/js/v25-exact-stats-runtime.js
          grep -q "gentle_criminal" public/js/v25-exact-stats-runtime.js
          grep -q "Melee Combat" public/js/v25-exact-stats-runtime.js
          grep -q "force=True" mise_a_jour/outils/update_home_data.py
          grep -q "mhur_v25_persistent_fixes.py" .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml
          grep -q 'cron: "11 \* \* \* \*"' .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml

          # On vérifie que les données exactes embarquées existent toujours :
          # le runtime V25 en dépend pour Hawks et tous les autres personnages.
          grep -q 'id="ultrarumble-exact-data"' public/index.html
          grep -q '"exact_by_style"' public/index.html

          echo "✅ V25 : vérifications terminées."

      - name: Commit V25 sur main
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git add \
            public/index.html \
            public/js/v25-exact-stats-runtime.js \
            mise_a_jour/outils/update_home_data.py \
            mise_a_jour/outils/mhur_v25_persistent_fixes.py \
            .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[V25] Déjà installé : aucun changement."
            exit 0
          fi

          git commit -m "fix: V25 login bonus et stats exactes"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Relancer le Guardian V19 corrigé
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run \
            mhur-mise-a-jour-guardian-officielle-v19.yml \
            --ref main \
            -f mode=scan

          echo "✅ Guardian V19 corrigé relancé en scan."

      - name: Discord - V25 installé
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          python - <<'PY' > /tmp/v25-ok.json
          import json

          print(json.dumps({
              "content": (
                  "✅ **MHUR NEXUS — V25 INSTALLÉ**\n\n"
                  "• Login Bonus : cache forcé + ancien réparateur V17 désactivé\n"
                  "• Hawks : les tableaux sont reconstruits depuis les données exactes UltraRumble\n"
                  "• Gentle : Ruée / Rebond / Impact et les autres dégâts sont séparés\n"
                  "• Futurs héros : les Additional Values sont séparées automatiquement\n"
                  "• V19 : réapplique automatiquement V25 après chaque reconstruction\n\n"
                  "🔄 Le Guardian V19 corrigé vient d'être relancé."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/v25-ok.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null

      - name: Discord - diagnostic V25 si erreur
        if: failure()
        shell: bash
        run: |
          set +e

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error::V25 bloqué : ${run_url}"

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          python - "$run_url" <<'PY' > /tmp/v25-error.json
          import json
          import sys

          url = sys.argv[1]

          print(json.dumps({
              "content": (
                  "❌ **MHUR NEXUS — V25 BLOQUÉ**\n\n"
                  "Le correctif n'a rien envoyé sur main si l'étape `Commit V25 sur main` "
                  "n'est pas verte.\n\n"
                  f"🔎 **Run :** {url}\n\n"
                  "Ouvre l'étape rouge : `[V25][ERREUR]` indique précisément "
                  "le fichier ou la vérification responsable."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/v25-error.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null || true

  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vérifier V25
        shell: bash
        run: |
          set -euo pipefail

          test -f public/js/v25-exact-stats-runtime.js
          test -f mise_a_jour/outils/mhur_v25_persistent_fixes.py

          grep -q "v25-exact-stats-runtime.js?v=25" public/index.html
          grep -q "force=True" mise_a_jour/outils/update_home_data.py
          grep -q "mhur_v25_persistent_fixes.py" .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml
          grep -q 'cron: "11 \* \* \* \*"' .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml

          python -m py_compile mise_a_jour/outils/mhur_v25_persistent_fixes.py
          node --check public/js/v25-exact-stats-runtime.js

          echo "✅ V25 est installé et persistant."
