              r'(?:\?[^"\']*)?'
              r'(?P<suffix>["\'])',
              flags=re.IGNORECASE,
          )

          index = asset_pattern.sub(
              lambda match: (
                  f'{match.group("prefix")}'
                  f'{match.group("path")}'
                  f'?v={build}'
                  f'{match.group("suffix")}'
              ),
              index,
          )

          body_ends = list(
              re.finditer(
                  r"</body\s*>",
                  index,
                  flags=re.IGNORECASE,
              )
          )

          if not body_ends:
              raise SystemExit(
                  "[ERREUR] Balise </body> introuvable."
              )

          body_end = body_ends[-1]

          index = (
              index[:body_end.start()]
              + f'<script src="js/v664-ui-final.js?v={build}"></script>\n'
              + index[body_end.start():]
          )

          INDEX.write_text(
              index,
              encoding="utf-8",
          )

          # ----------------------------------------------------------------------
          # Validations.
          # ----------------------------------------------------------------------

          saved = json.loads(
              HOME_JSON.read_text(encoding="utf-8")
          )

          saved_patch = next(
              item
              for item in saved["patch_notes"]
              if str(item.get("id")) == PATCH_ID
          )

          saved_changes = [
              change
              for section in saved_patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict)
          ]

          armored = [
              change
              for change in saved_changes
              if (
                  norm(change.get("character"))
                  == "armored all might"
                  and clean(
                      (
                          change.get("display_skill_name")
                          or {}
                      ).get("en")
                  )
                  == "α - Ice Bullet Shot (Burn)"
                  and metric(change.get("label"))
                  in {"damage", "guard"}
              )
          ]

          if len(armored) != 2:
              raise SystemExit(
                  "[ERREUR] Armored All Might reste incorrect."
              )

          if any(
              "texas smash" in norm(
                  (
                      change.get("display_skill_name")
                      or {}
                  ).get("en")
              )
              for change in saved_changes
              if norm(change.get("character"))
              == "armored all might"
          ):
              raise SystemExit(
                  "[ERREUR] Texas Smash apparaît encore "
                  "chez Armored All Might."
              )

          final_index = INDEX.read_text(encoding="utf-8")

          if final_index.count(
              'id="mhurV664Splash"'
          ) != 1:
              raise SystemExit(
                  "[ERREUR] Splash V664 absent ou dupliqué."
              )

          if final_index.count(
              "js/v664-ui-final.js"
          ) != 1:
              raise SystemExit(
                  "[ERREUR] JS V664 absent ou dupliqué."
              )

          if final_index.count(
              "css/v664-ui-final.css"
          ) != 1:
              raise SystemExit(
                  "[ERREUR] CSS V664 absent ou dupliqué."
              )

          unversioned = re.findall(
              r'(?:src|href)=["\']'
              r'((?:/)?(?:css|js|data)/[^"\'?#]+)'
              r'["\']',
              final_index,
              flags=re.IGNORECASE,
          )

          if unversioned:
              raise SystemExit(
                  "[ERREUR] Ressources sans build : "
                  + ", ".join(unversioned[:10])
              )

          for script in (
              RENDERER,
              UI_JS,
              LIVE_UPDATE,
              SERVICE_WORKER,
          ):
              subprocess.run(
                  ["node", "--check", str(script)],
                  check=True,
              )

          css_text = UI_CSS.read_text(encoding="utf-8")
          js_text = UI_JS.read_text(encoding="utf-8")

          required_new_targets = (
              ".card[data-char]",
              ".styleCard[data-style]",
              ".costumeTile",
              ".costumeCard",
              ".costumeResult",
          )

          for target in required_new_targets:
              if target not in css_text and target not in js_text:
                  raise SystemExit(
                      "[ERREUR] Type de carte NEW non traité : "
                      + target
                  )

          if "data-mhur-new-owner" not in css_text:
              raise SystemExit(
                  "[ERREUR] Nettoyage global NEW absent."
              )

          print(f"[OK] Master V664 : {build}")
          print("[OK] Splash cinématique installé.")
          print("[OK] Progression et statuts dynamiques.")
          print("[OK] NEW unique sur personnages, Alters et costumes.")
          print("[OK] Anciens NEW fixes supprimés derrière V582.")
          print("[OK] Correctifs Patch Notes conservés.")
          print("[OK] Cache atomique et service worker actualisés.")
          PY

      - name: Publier Master V664
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage tous les fichiers créés, modifiés ou supprimés.
          # Contrairement à une liste de chemins, ceci ne plante pas
          # lorsqu'un ancien fichier V661/V662 a déjà disparu.
          git add -A -- .github/workflows public

          if git diff --cached --quiet; then
            echo "[OK] Master V664 est déjà appliqué."
            exit 0
          fi

          git commit -m             "fix: splash cinématique et NEW global unique V664"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              echo "[OK] Master V664 publié sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Publication impossible."
          exit 1
