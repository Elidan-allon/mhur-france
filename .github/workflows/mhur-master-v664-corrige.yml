name: MHUR - Master V664

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "MHUR - Synchronisation UltraRumble"
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: mhur-master-v664
  cancel-in-progress: true

jobs:
  nettoyer-et-corriger:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Annuler les anciens workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_SYNC=".github/workflows/mhur-sync-ultrarumble.yml"
          KEEP_MASTER=".github/workflows/mhur-master-v664.yml"

          mapfile -t KEEP_IDS < <(
            gh api --paginate               "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100"               --jq ".workflows[] |
                select(
                  .path == \"$KEEP_SYNC\" or
                  .path == \"$KEEP_MASTER\"
                ) |
                .id"
          )

          is_kept() {
            local wanted="$1"
            local current

            for current in "${KEEP_IDS[@]:-}"; do
              if [[ "$current" == "$wanted" ]]; then
                return 0
              fi
            done

            return 1
          }

          for status in queued in_progress; do
            while IFS=$'\t' read -r run_id workflow_id run_name; do
              [[ -z "${run_id:-}" ]] && continue
              [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue

              if is_kept "$workflow_id"; then
                echo "[GARDÉ] $run_name — $run_id"
                continue
              fi

              echo "[ANNULATION] $run_name — $run_id"

              gh api                 --method POST                 "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel"                 >/dev/null 2>&1 || true
            done < <(
              gh api --paginate                 "repos/${GITHUB_REPOSITORY}/actions/runs?status=$status&per_page=100"                 --jq '.workflow_runs[] |
                  [.id, .workflow_id, .name] |
                  @tsv'
            )
          done

      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Supprimer les anciens fichiers workflows
        shell: bash
        run: |
          set -euo pipefail

          find .github/workflows             -maxdepth 1             -type f             \( -name "*.yml" -o -name "*.yaml" \)             ! -name "mhur-sync-ultrarumble.yml"             ! -name "mhur-master-v664.yml"             -print             -delete

          echo "[OK] Seuls Sync et Master V664 sont conservés."

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Appliquer Master V664
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path

          PATCH_ID = "1785298405"

          PUBLIC = Path("public")
          INDEX = PUBLIC / "index.html"
          HOME_JSON = PUBLIC / "data" / "home_data.json"
          HOME_JS = PUBLIC / "data" / "home_data.js"
          RENDERER = PUBLIC / "js" / "v608-patch-notes-final.js"
          UI_CSS = PUBLIC / "css" / "v664-ui-final.css"
          UI_JS = PUBLIC / "js" / "v664-ui-final.js"
          LIVE_UPDATE = PUBLIC / "js" / "v36-live-site-update.js"
          SERVICE_WORKER = PUBLIC / "service-worker.js"
          HEADERS = PUBLIC / "_headers"
          VERSION_JSON = PUBLIC / "version.json"

          for required in (INDEX, HOME_JSON, RENDERER):
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )

          def clean(value: object) -> str:
              if isinstance(value, dict):
                  return str(
                      value.get("en")
                      or value.get("fr")
                      or next(iter(value.values()), "")
                  ).strip()
              return str(value or "").strip()

          def norm(value: object) -> str:
              text = unicodedata.normalize(
                  "NFD",
                  clean(value).lower(),
              )
              text = "".join(
                  char
                  for char in text
                  if unicodedata.category(char) != "Mn"
              )
              return re.sub(r"[^a-z0-9]+", " ", text).strip()

          def metric(value: object) -> str:
              label = norm(value)

              if label.startswith(("damage", "degats")):
                  return "damage"

              if label.startswith(("guard break", "brise garde")):
                  return "guard"

              return ""

          def infer_symbol(change: dict) -> str:
              name = clean(change.get("skill_name"))

              match = re.match(
                  r"^\s*(α|β|γ|alpha|beta|gamma|a|b|g|y)"
                  r"(?:\s*[-–—:]\s*|\s+)",
                  name,
                  flags=re.IGNORECASE,
              )

              if match:
                  return {
                      "α": "α",
                      "alpha": "α",
                      "a": "α",
                      "β": "β",
                      "beta": "β",
                      "b": "β",
                      "γ": "γ",
                      "gamma": "γ",
                      "g": "γ",
                      "y": "γ",
                  }.get(match.group(1).lower(), "")

              image = clean(change.get("skill_image")).lower()

              if re.search(r"(?:unique1|alpha)", image):
                  return "α"

              if re.search(r"(?:unique2|beta)", image):
                  return "β"

              if re.search(r"(?:unique3|gamma)", image):
                  return "γ"

              return ""

          def strip_symbol(name: str) -> str:
              return re.sub(
                  r"^\s*(?:α|β|γ|alpha|beta|gamma|a|b|g|y)"
                  r"(?:\s*[-–—:]\s*|\s+)",
                  "",
                  name,
                  count=1,
                  flags=re.IGNORECASE,
              ).strip()

          DETAIL_FR = {
              "normal": "Normal",
              "explosion": "Explosion",
              "explosionfollow up": "Explosion renforcée",
              "explosion follow up": "Explosion renforcée",
              "burn": "Brûlure",
              "homing": "À tête chercheuse",
              "melee": "Corps à corps",
              "shot": "Tir",
              "shooting": "Tir",
          }

          def exact_display_name(change: dict) -> dict:
              source = clean(
                  change.get("source_skill_name")
                  or change.get("skill_name")
              )

              symbol = infer_symbol(change)
              body = strip_symbol(source)
              detail_match = re.search(r"\s*\(([^()]*)\)\s*$", body)

              if detail_match:
                  detail_en = detail_match.group(1).strip()
                  base = body[:detail_match.start()].strip()
                  detail_fr = DETAIL_FR.get(norm(detail_en), detail_en)
                  en_body = f"{base} ({detail_en})"
                  fr_body = f"{base} ({detail_fr})"
              else:
                  en_body = body.strip()
                  fr_body = body.strip()

              if symbol:
                  return {
                      "fr": f"{symbol} - {fr_body}",
                      "en": f"{symbol} - {en_body}",
                  }

              return {
                  "fr": fr_body,
                  "en": en_body,
              }

          # ----------------------------------------------------------------------
          # Conserver les correctifs Patch Notes du Master précédent.
          # ----------------------------------------------------------------------

          data = json.loads(
              HOME_JSON.read_text(encoding="utf-8")
          )

          patch = next(
              (
                  item
                  for item in data.get("patch_notes", [])
                  if str(item.get("id")) == PATCH_ID
              ),
              None,
          )

          if patch is None:
              raise SystemExit(
                  f"[ERREUR] Patch {PATCH_ID} introuvable."
              )

          changes = [
              change
              for section in patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict)
          ]

          bakugo_cluster_count = 0
          armored_count = 0

          for change in changes:
              character = norm(change.get("character"))
              style = norm(change.get("style"))

              change["source_skill_name"] = clean(
                  change.get("source_skill_name")
                  or change.get("skill_name")
              )

              if character == "katsuki bakugo" and style == "cluster":
                  change["style_id"] = "bakugo_technical"
                  change["role"] = "technical"
                  change["portrait"] = (
                      "assets/bakugo/bakugo_technical/portrait.webp"
                  )

                  skill = norm(change.get("source_skill_name"))

                  if "ap shot cluster" in skill:
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/alpha.webp"
                      )
                  elif "nitro cluster" in skill:
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/beta.webp"
                      )
                  elif "howitzer impact cluster" in skill:
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/gamma.webp"
                      )

                  bakugo_cluster_count += 1

              if character == "katsuki bakugo" and style == "original":
                  change["style_id"] = "bakugo_attack"

              if (
                  character == "armored all might"
                  and metric(change.get("label")) in {"damage", "guard"}
              ):
                  before = [
                      clean(value)
                      for value in change.get("before") or []
                  ]

                  if before == [
                      "52.0", "54.0", "56.0",
                      "58.0", "60.0", "62.0",
                      "64.0", "66.0", "68.0",
                  ]:
                      change["source_skill_name"] = (
                          "α - Ice Bullet Shot (Burn)"
                      )
                      change["skill_name"] = (
                          "α - Ice Bullet Shot (Burn)"
                      )
                      change["style_id"] = (
                          "armored_all_might_technical"
                      )
                      change["role"] = "technical"
                      change["portrait"] = (
                          "assets/armored_all_might/"
                          "armored_all_might_technical/portrait.webp"
                      )
                      change["skill_image"] = (
                          "assets/armored_all_might/"
                          "armored_all_might_technical/alpha.webp"
                      )
                      armored_count += 1

              change["display_skill_name"] = exact_display_name(change)

          if bakugo_cluster_count < 6:
              raise SystemExit(
                  "[ERREUR] Pas assez de changements Bakugo Cluster : "
                  f"{bakugo_cluster_count}"
              )

          if armored_count != 2:
              raise SystemExit(
                  "[ERREUR] 2 changements Armored All Might attendus, "
                  f"trouvé : {armored_count}"
              )

          for change in changes:
              source = clean(change.get("source_skill_name"))
              display_en = clean(
                  (change.get("display_skill_name") or {}).get("en")
              )

              source_has_detail = bool(
                  re.search(r"\([^()]+\)\s*$", source)
              )
              display_has_detail = bool(
                  re.search(r"\([^()]+\)\s*$", display_en)
              )

              if source_has_detail != display_has_detail:
                  raise SystemExit(
                      "[ERREUR] Détail inventé ou supprimé : "
                      f"{source!r} → {display_en!r}"
                  )

          data.setdefault("meta", {})[
              "master_version"
          ] = "v664"

          HOME_JSON.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          compact = json.dumps(
              data,
              ensure_ascii=False,
              separators=(",", ":"),
          ).replace("\u2028", "\\u2028").replace(
              "\u2029",
              "\\u2029",
          )

          HOME_JS.write_text(
              f"window.MHUR_HOME_DATA = {compact};\n",
              encoding="utf-8",
          )

          renderer = RENDERER.read_text(encoding="utf-8")

          function_start = renderer.find(
              "  function resolveStyle(change){"
          )
          function_end = renderer.find(
              "\n  function translatePatch(value){",
              function_start,
          )

          if function_start < 0 or function_end < 0:
              raise SystemExit(
                  "[ERREUR] Fonction resolveStyle introuvable."
              )

          resolve_style = """  function resolveStyle(change){
              const map=stylesMap();
              const explicitId=clean(
                change?.style_id||
                change?.styleId||
                ''
              );

              const explicitCharacter=explicitId
                ?charactersList().find(character=>
                  Array.isArray(character?.styles)&&
                  character.styles.map(String).includes(explicitId)
                )
                :null;

              const character=
                explicitCharacter||
                findCharacter(change?.character);

              const ids=styleIds(character);

              if(
                explicitId&&
                ids.includes(explicitId)&&
                map[explicitId]
              ){
                return {
                  character,
                  id:explicitId,
                  style:map[explicitId]
                };
              }

              const midoriyaId=midoriyaStyleId(
                change,
                character
              );

              if(midoriyaId&&map[midoriyaId]){
                return {
                  character,
                  id:midoriyaId,
                  style:map[midoriyaId]
                };
              }

              const wanted=normal(change?.style||'Original');

              const byStyle=ids.find(id=>
                normal(localized(map[id]?.name)||'Original')===wanted
              );

              if(byStyle){
                return {
                  character,
                  id:byStyle,
                  style:map[byStyle]
                };
              }

              const id=ids[0]||'';

              return {
                character,
                id,
                style:map[id]||null
              };
            }
          """

          renderer = (
              renderer[:function_start]
              + resolve_style
              + renderer[function_end:]
          )

          title_pattern = re.compile(
              r"const\s+title=translatePatch\((.*?)\);",
              flags=re.DOTALL,
          )

          title_replacement = """const title=translatePatch(
                localized(change?.display_skill_name)||
                localized(change?.skill_name)||
                localized(change?.label)||
                tx('Ajustement','Adjustment')
              );"""

          renderer, title_count = title_pattern.subn(
              title_replacement,
              renderer,
              count=1,
          )

          if title_count != 1:
              raise SystemExit(
                  "[ERREUR] Bloc du titre Patch Notes introuvable."
              )

          picture_pattern = re.compile(
              r"const\s+picture=health(.*?);",
              flags=re.DOTALL,
          )

          picture_replacement = """const picture=health
                ?''
                :(
                  isMidoriya
                    ?(skill?.img||change?.skill_image||'')
                    :(change?.skill_image||skill?.img||'')
                );"""

          renderer, picture_count = picture_pattern.subn(
              picture_replacement,
              renderer,
              count=1,
          )

          if picture_count != 1:
              raise SystemExit(
                  "[ERREUR] Bloc de l'image Patch Notes introuvable."
              )

          renderer = re.sub(
              r"const VERSION='[^']*';",
              "const VERSION='664';",
              renderer,
              count=1,
          )

          RENDERER.write_text(
              renderer,
              encoding="utf-8",
          )

          # ----------------------------------------------------------------------
          # Splash V664, NEW global, cache et fluidité.
          # ----------------------------------------------------------------------

          commit = subprocess.check_output(
              ["git", "rev-parse", "--short=12", "HEAD"],
              text=True,
          ).strip()

          build = f"664-{commit}"
          updated_at = datetime.now(timezone.utc).replace(
              microsecond=0
          ).isoformat()

          ui_css = '/* MHUR V664 — splash cinématique + NEW global unique */\n\n/* ==========================================================================\n   SPLASH CINÉMATIQUE\n   ========================================================================== */\n\n#mhurV664Splash {\n  position: fixed;\n  inset: 0;\n  z-index: 2147483647;\n  display: none;\n  min-height: 100vh;\n  min-height: 100dvh;\n  overflow: hidden;\n  isolation: isolate;\n  background:\n    radial-gradient(circle at 50% 46%, rgba(32, 133, 210, .18), transparent 35%),\n    linear-gradient(135deg, #02060e 0%, #061426 42%, #07111f 72%, #02050b 100%);\n  color: #fff;\n  font-family: Arial, Helvetica, sans-serif;\n}\n\nhtml.mhur-v664-booting {\n  overflow: hidden !important;\n  background: #02060e !important;\n}\n\nhtml.mhur-v664-booting body {\n  overflow: hidden !important;\n  background: #02060e !important;\n}\n\nhtml.mhur-v664-booting #mhurV664Splash {\n  display: block !important;\n  visibility: visible !important;\n}\n\nhtml.mhur-v664-booting body > :not(#mhurV664Splash) {\n  visibility: hidden !important;\n}\n\n#mhurV664Splash::before {\n  content: "";\n  position: absolute;\n  inset: -20%;\n  z-index: -4;\n  background:\n    repeating-linear-gradient(\n      120deg,\n      transparent 0 58px,\n      rgba(63, 199, 255, .035) 59px 61px,\n      transparent 62px 118px\n    ),\n    repeating-linear-gradient(\n      30deg,\n      transparent 0 76px,\n      rgba(255, 226, 0, .025) 77px 79px,\n      transparent 80px 156px\n    );\n  transform: perspective(800px) rotateX(58deg) translateY(20%);\n  transform-origin: center bottom;\n  animation: mhurV664GridMove 9s linear infinite;\n}\n\n#mhurV664Splash::after {\n  content: "";\n  position: absolute;\n  inset: 0;\n  z-index: 30;\n  pointer-events: none;\n  opacity: .17;\n  background:\n    repeating-linear-gradient(\n      180deg,\n      transparent 0 3px,\n      rgba(255, 255, 255, .05) 4px,\n      transparent 5px 8px\n    );\n  mix-blend-mode: overl