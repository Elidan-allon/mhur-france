tate === \'loading\') {\n    document.addEventListener(\n      \'DOMContentLoaded\',\n      start,\n      { once: true }\n    );\n  } else {\n    start();\n  }\n\n  /* Le site ne reste jamais bloqué derrière le splash. */\n  setTimeout(finishReveal, 3800);\n\n  window.MHUR_V664 = {\n    build: BUILD,\n    refreshNew: () => scanCanonical(document),\n    cleanOwner\n  };\n})();\n'.replace(
