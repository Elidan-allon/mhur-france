              min-width:110px!important;
              height:110px!important;
              margin-bottom:4px!important;
            }
          }
          CSS

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("public/index.html")

          if not path.is_file():
              raise SystemExit("[ERREUR] public/index.html est introuvable.")

          html = path.read_text(encoding="utf-8-sig")

          patterns = [
              r"\s*<script\b[^>]*src=['\"][^'\"]*v595-local-patch-assets\.js[^'\"]*['\"][^>]*>\s*</script>\s*",
              r"\s*<script\b[^>]*src=['\"][^'\"]*v595-patch-portraits-tables\.js[^'\"]*['\"][^>]*>\s*</script>\s*",
              r"\s*<link\b[^>]*href=['\"][^'\"]*v595-patch-portraits-tables\.css[^'\"]*['\"][^>]*>\s*",
          ]

          for pattern in patterns:
              html = re.sub(pattern, "\n", html, flags=re.I)

          if "</head>" not in html or "</body>" not in html:
              raise SystemExit("[ERREUR] Balises head/body introuvables.")

          # Le manifeste est chargé avant les scripts qui ouvrent les Patch Notes.
          first_script = re.search(r"<script\b", html, flags=re.I)

          manifest_tag = (
              '<script src="data/v595-local-patch-assets.js?v=595"></script>\n'
          )

          if first_script:
              html = (
                  html[:first_script.start()]
                  + manifest_tag
                  + html[first_script.start():]
              )
          else:
              html = html.replace("</head>", manifest_tag + "</head>", 1)

          html = html.replace(
              "</head>",
              '\n<link rel="stylesheet" '
              'href="css/v595-patch-portraits-tables.css?v=595">\n'
              "</head>",
              1,
          )

          html = html.replace(
              "</body>",
              '\n<script src="js/v595-patch-portraits-tables.js?v=595"></script>\n'
              "</body>",
              1,
          )

          path.write_text(html.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Verifier V595
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          public = Path("public")
          index = (public / "index.html").read_text(encoding="utf-8")
          manifest = (
              public / "data/v595-local-patch-assets.js"
          ).read_text(encoding="utf-8")
          js = (
              public / "js/v595-patch-portraits-tables.js"
          ).read_text(encoding="utf-8")
          css = (
              public / "css/v595-patch-portraits-tables.css"
          ).read_text(encoding="utf-8")

          errors = []

          for resource in (
              "data/v595-local-patch-assets.js?v=595",
              "css/v595-patch-portraits-tables.css?v=595",
              "js/v595-patch-portraits-tables.js?v=595",
          ):
              if resource not in index:
                  errors.append("Référence absente : " + resource)

          match = re.search(
              r"window\.MHUR_PATCH_LOCAL_ASSETS_V595=(\{.*\});",
              manifest,
          )

          if not match:
              errors.append("Manifeste V595 illisible.")
          else:
              data = json.loads(match.group(1))

              for style_id, row in data.get("styles", {}).items():
                  for key, relative in row.items():
                      if not relative.startswith("assets/"):
                          errors.append(
                              f"{style_id}/{key} n'est pas un fichier local."
                          )

                      if not (public / relative).is_file():
                          errors.append("Fichier absent : " + relative)

          if re.search(r"https?://", manifest, flags=re.I):
              errors.append("Le manifeste contient une URL distante.")

          for required in (
              "function resolveCharacter",
              "function resolveStyle",
              "function fixPortrait",
              "function ensureSkillSlot",
              "function fixPatchCharacter",
              "window.MHUR_V595",
          ):
              if required not in js:
                  errors.append("Fonction absente : " + required)

          for required in (
              ".s18PatchPortraitImageV595",
              ".s18NoSkillImageV595",
              "min-width:820px",
              ".s18PatchTableWrapV10",
          ):
              if required not in css:
                  errors.append("Règle CSS absente : " + required)

          syntax = subprocess.run(
              [
                  "node",
                  "--check",
                  "public/js/v595-patch-portraits-tables.js",
              ],
              text=True,
              capture_output=True,
          )

          if syntax.returncode:
              errors.append("Syntaxe JavaScript invalide : " + syntax.stderr)

          if errors:
              raise SystemExit(
                  "[ERREUR V595]\n- " + "\n- ".join(errors)
              )

          print("[OK] Manifeste local vérifié.")
          print("[OK] Portraits et Alters locaux uniquement.")
          print("[OK] Tableaux Patch Notes protégés contre la largeur réduite.")
          PY

