name: MHUR V626 - Tier List et détails PC

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v626-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v626-tier-details-pc
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V626
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v626.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          
          index_path=Path("public/index.html")
          community_path=Path("public/js/community-builds.js")
          v619_path=Path("public/js/v619-mobile-tuning-navigation.js")
          css_path=Path("public/css/v626-tier-desktop-details.css")
          js_path=Path("public/js/v626-tier-final.js")
          report_path=Path("RAPPORT_V626_TIER_DETAILS_PC.txt")
          
          for required in [index_path,community_path,v619_path]:
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )
          
          community=community_path.read_text(encoding="utf-8")
          
          if (
              "function cbV625DetailsHtml" not in community or
              "cbV625TuningDetails" not in community
          ):
              raise SystemExit(
                  "[ERREUR] Les détails communautaires V625 "
                  "ne sont pas présents dans la source."
              )
          
          v619=v619_path.read_text(encoding="utf-8")
          
          # Autorise uniquement l'enrichissement visuel sur ordinateur.
          # Toute la navigation automatique reste mobile grâce aux autres contrôles.
          v619,count=re.subn(
              r'(function\s+enrich\s*\(\)\s*\{\s*)'
              r'if\s*\(\s*!mobile\(\)\s*\)\s*return\s*;',
              r'\1',
              v619,
              count=1,
          )
          
          if count==0 and re.search(
              r'function\s+enrich\s*\(\)\s*\{\s*'
              r'if\s*\(\s*!mobile\(\)\s*\)\s*return\s*;',
              v619,
          ):
              raise SystemExit(
                  "[ERREUR] La restriction mobile de V619 "
                  "n'a pas pu être retirée."
              )
          
          v619_path.write_text(v619,encoding="utf-8")
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          obsolete=[
              r'\s*<!-- V625 : correctif source final CSS\. -->\s*'
              r'<link[^>]+v625-source-final\.css[^>]*>\s*',
              r'\s*<link[^>]+v625-source-final\.css[^>]*>\s*',
              r'\s*<!-- V625 : Tier List exacte\. -->\s*'
              r'<script[^>]+v625-tier-direct\.js[^>]*>\s*</script>\s*',
              r'\s*<script[^>]+v625-tier-direct\.js[^>]*>\s*</script>\s*',
              r'\s*<!-- V626 : Tier List et détails PC CSS\. -->\s*'
              r'<link[^>]+v626-tier-desktop-details\.css[^>]*>\s*',
              r'\s*<link[^>]+v626-tier-desktop-details\.css[^>]*>\s*',
              r'\s*<!-- V626 : Tier List finale\. -->\s*'
              r'<script[^>]+v626-tier-final\.js[^>]*>\s*</script>\s*',
              r'\s*<script[^>]+v626-tier-final\.js[^>]*>\s*</script>\s*',
          ]
          
          for pattern in obsolete:
              html=re.sub(pattern,"\n",html,flags=re.I)
          
          # Cache busting des deux sources enrichies.
          html,count_community=re.subn(
              r'(<script\s+src=["\']js/community-builds\.js)'
              r'(?:\?[^"\']*)?(["\'])',
              r'\1?v=626\2',
              html,
              count=1,
              flags=re.I,
          )
          
          html,count_v619=re.subn(
              r'(<script\s+src=["\']js/v619-mobile-tuning-navigation\.js)'
              r'(?:\?[^"\']*)?(["\'])',
              r'\1?v=626\2',
              html,
              count=1,
              flags=re.I,
          )
          
          if count_community!=1:
              raise SystemExit(
                  "[ERREUR] Référence community-builds.js introuvable."
              )
          
          if count_v619!=1:
              raise SystemExit(
                  "[ERREUR] Référence V619 introuvable."
              )
          
          css_tag=(
              '<!-- V626 : Tier List et détails PC CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v626-tier-desktop-details.css?v=626">\n'
          )
          
          js_tag=(
              '<!-- V626 : Tier List finale. -->\n'
              '<script src="js/v626-tier-final.js?v=626"></script>\n'
          )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          if not bodies:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          position=heads[-1].start()
          html=html[:position]+css_tag+html[position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          position=bodies[-1].start()
          html=html[:position]+js_tag+html[position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V626
          
          TIER LIST — MOBILE ET ORDINATEUR
          - Toutes les cartes gardent une taille fixe et propre.
          - Gentle Criminal ne peut plus être agrandi par le badge NEW.
          - NEW est petit, animé et placé en haut à gauche.
          - Le nom et le style sont séparés.
          - La phrase d'aide est réécrite proprement sans caractères corrompus.
          
          BUILDS COMMUNAUTAIRES — ORDINATEUR
          - Description complète.
          - Tous les effets.
          - Tous les niveaux et sous-effets.
          
          COSTUMES — ORDINATEUR
          - Les détails V619 sont maintenant également enrichis sur PC.
          - Description complète, effets, niveaux et sous-effets.
          
          NON MODIFIÉ
          - Navigation fluide mobile.
          - Données du jeu.
          - Costumes et photos.
          - Patch Notes.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V626 appliqué.")
          PY
          
          cat > /tmp/verifier_v626.py <<'PY'
          from pathlib import Path
          import re
          
          html=Path("public/index.html").read_text(encoding="utf-8")
          community=Path("public/js/community-builds.js").read_text(encoding="utf-8")
          v619=Path(
              "public/js/v619-mobile-tuning-navigation.js"
          ).read_text(encoding="utf-8")
          css=Path(
              "public/css/v626-tier-desktop-details.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v626-tier-final.js"
          ).read_text(encoding="utf-8")
          
          if html.count(
              "css/v626-tier-desktop-details.css?v=626"
          )!=1:
              raise SystemExit(
                  "[ERREUR] CSS V626 absent ou dupliqué."
              )
          
          if html.count("js/v626-tier-final.js?v=626")!=1:
              raise SystemExit(
                  "[ERREUR] JS V626 absent ou dupliqué."
              )
          
          if html.count("js/community-builds.js?v=626")!=1:
              raise SystemExit(
                  "[ERREUR] Cache community-builds non actualisé."
              )
          
          if html.count(
              "js/v619-mobile-tuning-navigation.js?v=626"
          )!=1:
              raise SystemExit(
                  "[ERREUR] Cache V619 non actualisé."
              )
          
          for obsolete in [
              "css/v625-source-final.css",
              "js/v625-tier-direct.js",
          ]:
              if obsolete in html:
                  raise SystemExit(
                      f"[ERREUR] Ancienne couche encore chargée : {{obsolete}}"
                  )
          
          if re.search(
              r'function\\s+enrich\\s*\\(\\)\\s*\\{{\\s*'
              r'if\\s*\\(\\s*!mobile\\(\\)\\s*\\)\\s*return\\s*;',
              v619,
          ):
              raise SystemExit(
                  "[ERREUR] V619 reste limité au mobile."
              )
          
          for token in [
              "function cbV625DetailsHtml",
              "cbV625TuningDetails",
          ]:
              if token not in community:
                  raise SystemExit(
                      f"[ERREUR] Détail communautaire absent : {{token}}"
                  )
          
          for token in [
              ".mhurTierNewV626",
              ".cbV625TuningDetails",
              ".mhurV619Details",
              "@media(min-width:761px)",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V626 incomplet : {{token}}"
                  )
          
          for token in [
              "fixHelp",
              "removeOldGentleBadges",
              "mhurTierGentleV626",
              "Les déplacements sont enregistrés",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS Tier incomplet : {{token}}"
                  )
          
          print("[OK] Contrôles V626 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v626.py
            node --check public/js/v619-mobile-tuning-navigation.js
            node --check public/js/v626-tier-final.js
            python3 /tmp/verifier_v626.py
          
            git add \
              public/index.html \
              public/js/community-builds.js \
              public/js/v619-mobile-tuning-navigation.js \
              public/css/v626-tier-desktop-details.css \
              public/js/v626-tier-final.js \
              RAPPORT_V626_TIER_DETAILS_PC.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V626 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: Tier List et détails TUNING PC V626"
          
            if git push origin HEAD:main; then
              echo "[OK] V626 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V626 après cinq tentatives."
          exit 1
