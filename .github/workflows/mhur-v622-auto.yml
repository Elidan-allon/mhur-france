name: MHUR V622 - Costumes sans saut au chargement

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v622-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v622-costumes-loading
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V622
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v622.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          JS = base64.b64decode("").decode("utf-8")
          STYLE = base64.b64decode("").decode("utf-8")
          
          index_path = Path("public/index.html")
          js_path = Path("public/js/v622-costume-image-no-jump.js")
          report_path = Path("RAPPORT_V622_COSTUMES_SANS_SAUT.txt")
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          js_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.write_text(JS + "\n", encoding="utf-8")
          
          html = index_path.read_text(encoding="utf-8")
          
          # Installation idempotente.
          html = re.sub(
              r'\s*<style id=["\']mhur-v622-costume-image-no-jump["\']>'
              r'.*?</style>\s*',
              "\n",
              html,
              flags=re.I | re.S,
          )
          html = re.sub(
              r'\s*<!-- V622 : costumes sans saut au chargement\. -->\s*'
              r'<script[^>]+v622-costume-image-no-jump\.js[^>]*>'
              r'\s*</script>\s*',
              "\n",
              html,
              flags=re.I,
          )
          html = re.sub(
              r'\s*<script[^>]+v622-costume-image-no-jump\.js[^>]*>'
              r'\s*</script>\s*',
              "\n",
              html,
              flags=re.I,
          )
          
          # V618 doit être chargé : il effectue le cadrage final déjà validé.
          if not re.search(
              r'<link[^>]+v618-mobile-costume-visible-center\.css',
              html,
              flags=re.I,
          ):
              head_matches=list(re.finditer(r'</head\s*>',html,flags=re.I))
              if not head_matches:
                  raise SystemExit("[ERREUR] Balise </head> introuvable.")
              position=head_matches[-1].start()
              tag=(
                  '<link rel="stylesheet" '
                  'href="css/v618-mobile-costume-visible-center.css?v=6182">\n'
              )
              html=html[:position]+tag+html[position:]
          
          # Le masquage est inline dans head pour agir avant le premier affichage.
          head_matches=list(re.finditer(r'</head\s*>',html,flags=re.I))
          if not head_matches:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          position=head_matches[-1].start()
          html=html[:position]+STYLE+"\n"+html[position:]
          
          # S'assurer que le moteur V618 précède V622.
          if not re.search(
              r'<script[^>]+v618-mobile-costume-visible-center\.js',
              html,
              flags=re.I,
          ):
              body_matches=list(re.finditer(r'</body\s*>',html,flags=re.I))
              if not body_matches:
                  raise SystemExit("[ERREUR] Balise </body> introuvable.")
              position=body_matches[-1].start()
              tag=(
                  '<script '
                  'src="js/v618-mobile-costume-visible-center.js?v=6182">'
                  '</script>\n'
              )
              html=html[:position]+tag+html[position:]
          
          body_matches=list(re.finditer(r'</body\s*>',html,flags=re.I))
          if not body_matches:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          position=body_matches[-1].start()
          script_tag=(
              '<!-- V622 : costumes sans saut au chargement. -->\n'
              '<script src="js/v622-costume-image-no-jump.js?v=622">'
              '</script>\n'
          )
          html=html[:position]+script_tag+html[position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V622
          
          CORRECTION UNIQUE
          - La photo n'apparaît plus décalée à droite pendant son chargement.
          - Elle reste invisible quelques instants pendant le calcul V618.
          - Elle apparaît ensuite déjà centrée avec un fondu très court.
          
          NON MODIFIÉ
          - Taille et position finales des costumes.
          - Badges, NEW, rareté, T.U.N.I.N.G et noms.
          - Version ordinateur.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V622 appliqué.")
          PY
          
          cat > /tmp/verifier_v622.py <<'PY'
          from pathlib import Path
          
          html=Path("public/index.html").read_text(encoding="utf-8")
          js=Path("public/js/v622-costume-image-no-jump.js").read_text(
              encoding="utf-8"
          )
          
          if html.count('id="mhur-v622-costume-image-no-jump"')!=1:
              raise SystemExit("[ERREUR] Style V622 absent ou dupliqué.")
          
          if html.count("js/v622-costume-image-no-jump.js?v=622")!=1:
              raise SystemExit("[ERREUR] Script V622 absent ou dupliqué.")
          
          for reference in [
              "v618-mobile-costume-visible-center.css",
              "v618-mobile-costume-visible-center.js",
          ]:
              if reference not in html:
                  raise SystemExit(f"[ERREUR] Dépendance absente : {reference}")
          
          for token in [
              "positioningReady",
              "image.decode",
              "data-v622-ready",
              "requestV618",
          ]:
              if token not in js:
                  raise SystemExit(f"[ERREUR] Élément V622 manquant : {token}")
          
          print("[OK] Contrôles V622 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v622.py
            node --check public/js/v622-costume-image-no-jump.js
            python3 /tmp/verifier_v622.py
          
            git add \
              public/index.html \
              public/js/v622-costume-image-no-jump.js \
              RAPPORT_V622_COSTUMES_SANS_SAUT.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V622 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: afficher les costumes directement centrés V622"
          
            if git push origin HEAD:main; then
              echo "[OK] V622 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V622 après cinq tentatives."
          exit 1
