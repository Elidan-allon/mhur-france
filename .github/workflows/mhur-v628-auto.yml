name: MHUR V628 - Tier NEW droite et Dev Notes complètes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v628-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v628-tier-dev
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V628
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v628.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          
          index_path=Path("public/index.html")
          css_path=Path("public/css/v628-tier-dev-final.css")
          js_path=Path("public/js/v628-tier-dev-final.js")
          report_path=Path("RAPPORT_V628_TIER_DEV_FINAL.txt")
          
          if not index_path.is_file():
              raise SystemExit(
                  "[ERREUR] public/index.html introuvable."
              )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          patterns=[
              r'\s*<!-- V628 : Tier NEW droite et Dev Notes complètes CSS\. -->\s*'
              r'<link[^>]+v628-tier-dev-final\.css[^>]*>\s*',
              r'\s*<link[^>]+v628-tier-dev-final\.css[^>]*>\s*',
              r'\s*<!-- V628 : Tier NEW droite et Dev Notes complètes JS\. -->\s*'
              r'<script[^>]+v628-tier-dev-final\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v628-tier-dev-final\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(pattern,"\n",html,flags=re.I)
          
          css_tag=(
              '<!-- V628 : Tier NEW droite et Dev Notes complètes CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v628-tier-dev-final.css?v=628">\n'
          )
          
          js_tag=(
              '<!-- V628 : Tier NEW droite et Dev Notes complètes JS. -->\n'
              '<script src="js/v628-tier-dev-final.js?v=628"></script>\n'
          )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          if not bodies:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          head_position=heads[-1].start()
          html=html[:head_position]+css_tag+html[head_position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          body_position=bodies[-1].start()
          html=html[:body_position]+js_tag+html[body_position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V628
          
          TIER LIST
          - Gentle Criminal est détecté directement dans .mhurTierItem.
          - Tous les anciens badges NEW de sa carte sont supprimés.
          - Un seul badge NEW est créé en haut à droite.
          - Fonctionne sur mobile et ordinateur.
          - Animation et petite taille conservées.
          
          DEV NOTES
          - Le contenu ne dépend plus de la fonction devHtml raccourcie de V608.
          - Le rendu complet est réappliqué après chaque ouverture de l'onglet Dev.
          - Toutes les informations du Dev Blog Vol. 27 sont présentes :
            20 millions, Gentle et La Brava, compétences, Lover Mode,
            Chaos City Ver. 02, Research Notebook Mission n°3,
            niveaux 31 à 200, récompenses et 3-Pick Battle.
          - Trois boutons ouvrent les pages officielles Bandai Namco.
          - Fonctionne en français et en anglais.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V628 appliqué.")
          PY
          
          cat > /tmp/verifier_v628.py <<'PY'
          from pathlib import Path
          
          html=Path("public/index.html").read_text(encoding="utf-8")
          css=Path(
              "public/css/v628-tier-dev-final.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v628-tier-dev-final.js"
          ).read_text(encoding="utf-8")
          
          if html.count(
              "css/v628-tier-dev-final.css?v=628"
          )!=1:
              raise SystemExit(
                  "[ERREUR] CSS V628 absent ou dupliqué."
              )
          
          if html.count(
              "js/v628-tier-dev-final.js?v=628"
          )!=1:
              raise SystemExit(
                  "[ERREUR] JS V628 absent ou dupliqué."
              )
          
          for token in [
              "right:5px!important",
              "left:auto!important",
              ".mhurTierNewV628",
              ".mhurV628OfficialLinks",
              ".mhurV628DevSection",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V628 incomplet : {token}"
                  )
          
          for token in [
              "removeOldNewBadges",
              "fullDevHtml",
              "Research Notebook",
              "3-Pick Battle",
              "data-v628-full-dev",
              "development-blog-vol-27",
              "patch-notes-11700",
              "my-hero-ultra-rumble-season-18",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS V628 incomplet : {token}"
                  )
          
          print("[OK] Contrôles V628 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v628.py
            node --check public/js/v628-tier-dev-final.js
            python3 /tmp/verifier_v628.py
          
            git add     public/index.html     public/css/v628-tier-dev-final.css     public/js/v628-tier-dev-final.js     RAPPORT_V628_TIER_DEV_FINAL.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V628 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: NEW Tier droite et Dev Notes complètes V628"
          
            if git push origin HEAD:main; then
              echo "[OK] V628 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V628 après cinq tentatives."
          exit 1
