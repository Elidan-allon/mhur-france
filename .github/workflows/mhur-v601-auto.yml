name: MHUR V601 - mobile Patch costumes et Gentle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v601-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v601-mobile-patch-costumes-gentle
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Installer V601
        shell: bash
        run: |
          cat > /tmp/appliquer_v601.py <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          ROOT=Path.cwd()
          INDEX=ROOT/"public/index.html"
          JS=ROOT/"public/js/v601-mobile-patch-gentle.js"
          CSS=ROOT/"public/css/v601-mobile-costumes.css"
          REPORT=ROOT/"RAPPORT_V601_MOBILE_PATCH_COSTUMES_GENTLE.txt"

          JS_CONTENT="\n/* MHUR Nexus — V601\n   - Mirio Sheer Counter identique sur PC et mobile\n   - Gentle Criminal γ entièrement bilingue\n*/\n(function(){\n  'use strict';\n\n  const VERSION='601';\n\n  function clean(value){\n    return String(value??'').trim();\n  }\n\n  function normal(value){\n    return clean(value)\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g,'_')\n      .replace(/^_+|_+$/g,'');\n  }\n\n  function language(){\n    try{\n      if(typeof lang!=='undefined'&&(lang==='fr'||lang==='en')){\n        return lang;\n      }\n    }catch(_error){}\n\n    const html=String(document.documentElement.lang||'').toLowerCase();\n\n    if(html.startsWith('en'))return 'en';\n    if(html.startsWith('fr'))return 'fr';\n\n    try{\n      const stored=localStorage.getItem('mhur_lang');\n      if(stored==='fr'||stored==='en')return stored;\n    }catch(_error){}\n\n    return 'fr';\n  }\n\n  function localized(value){\n    if(value&&typeof value==='object'&&!Array.isArray(value)){\n      const current=language();\n      return value[current]??value.fr??value.en??'';\n    }\n\n    return value;\n  }\n\n  function stylesMap(){\n    try{\n      if(typeof styles!=='undefined'&&styles){\n        return styles;\n      }\n    }catch(_error){}\n\n    return window.styles||{};\n  }\n\n  function charactersList(){\n    try{\n      if(typeof characters!=='undefined'&&Array.isArray(characters)){\n        return characters;\n      }\n    }catch(_error){}\n\n    return Array.isArray(window.characters)?window.characters:[];\n  }\n\n  function localPath(value){\n    const path=clean(value)\n      .replace(/^\\.?\\//,'')\n      .replace(/^public\\//,'');\n\n    return path.startsWith('assets/')?path:'';\n  }\n\n  function setImage(box,path,alt){\n    if(!box||!path)return;\n\n    let image=box.querySelector('img');\n\n    if(!image){\n      image=document.createElement('img');\n      image.loading='lazy';\n      image.decoding='async';\n      box.replaceChildren(image);\n    }\n\n    image.hidden=false;\n    image.removeAttribute('srcset');\n    image.alt=alt||'';\n    image.onerror=null;\n\n    const versioned=path.includes('?')\n      ?path\n      :path+'?v=601';\n\n    if(image.getAttribute('src')!==versioned){\n      image.setAttribute('src',versioned);\n    }\n  }\n\n  function mirioStyle(){\n    return stylesMap().mirio_technical||null;\n  }\n\n  function mirioCharacter(){\n    return charactersList().find(character=>\n      normal(character?.id)==='mirio'||\n      normal(character?.name)==='mirio_togata'\n    )||null;\n  }\n\n  function technicalRoleText(){\n    return language()==='en'?'Technical':'Technique';\n  }\n\n  function forceMirioPatchCard(card){\n    const heading=card.querySelector(':scope > header h4');\n    const name=normal(heading?.textContent);\n\n    if(!name.includes('mirio_togata'))return;\n\n    const style=mirioStyle();\n    if(!style)return;\n\n    const character=mirioCharacter();\n    const alpha=(style.skills||[]).find(skill=>\n      /^(?:α|a|alpha)(?:\\s|[-—:(]|$)/i.test(\n        clean(skill?.letter)\n      )\n    )||style.skills?.[0];\n\n    card.dataset.patchStyleId='mirio_technical';\n    card.dataset.v595StyleId='mirio_technical';\n\n    const styleName=card.querySelector(':scope > header strong');\n\n    if(styleName){\n      styleName.textContent=localized(style.name)||'Sheer Counter';\n    }\n\n    const roleBadge=card.querySelector(\n      ':scope > header .s18PatchBadgesV10 '+\n      '.badge:not(.hero):not(.villain)'\n    );\n\n    if(roleBadge){\n      roleBadge.classList.remove(\n        'rapid',\n        'speed',\n        'strike',\n        'attack',\n        'assault',\n        'support'\n      );\n      roleBadge.classList.add('technical');\n      roleBadge.textContent=technicalRoleText();\n    }\n\n    setImage(\n      card.querySelector(\n        ':scope > header .s18PatchPortraitV10'\n      ),\n      localPath(style.portrait),\n      heading?.textContent||'Mirio Togata'\n    );\n\n    card.querySelectorAll('.s18PatchChangeV10')\n      .forEach(change=>{\n        const title=change.querySelector('h5');\n        const titleKey=normal(title?.textContent);\n        const isAlpha=(\n          titleKey.includes('phantom_smash')||\n          titleKey.includes('rupture_ophtalmique')||\n          change.dataset.patchSkillKey==='alpha'\n        );\n\n        if(!isAlpha)return;\n\n        const image=localPath(alpha?.img);\n\n        change.dataset.patchStyleId='mirio_technical';\n        change.dataset.patchSkillKey='alpha';\n        change.dataset.patchSkillImage=image;\n\n        if(title){\n          /*\n            Le nom officiel reste Phantom Smash dans les deux langues.\n          */\n          title.textContent=localized(alpha?.name)||'Phantom Smash';\n        }\n\n        const layout=change.querySelector('.s18PatchSkillV10');\n        const main=layout?.querySelector(':scope > main');\n\n        if(!layout||!main)return;\n\n        let box=[...layout.children].find(\n          child=>child!==main&&child.tagName==='DIV'\n        );\n\n        if(!box){\n          box=document.createElement('div');\n          box.className='s18PatchSkillImageV595';\n          layout.insertBefore(box,main);\n        }\n\n        layout.classList.remove('s18NoSkillImageV595');\n\n        setImage(\n          box,\n          image,\n          title?.textContent||'Phantom Smash'\n        );\n      });\n  }\n\n  function bilingualRows(sourceRows){\n    const rows=Array.isArray(sourceRows)?sourceRows:[];\n    const resultFr=[];\n    const resultEn=[];\n\n    rows.forEach((row,index)=>{\n      const values=Array.isArray(row)?[...row]:[];\n      const block=Math.floor(index/9);\n\n      const frType=block===0\n        ?'Ruée'\n        :block===1\n          ?'Rebond'\n          :'Impact final';\n\n      const enType=block===0\n        ?'Rush'\n        :block===1\n          ?'Rebound'\n          :'Final Impact';\n\n      values[0]=frType;\n      resultFr.push([...values]);\n\n      values[0]=enType;\n      resultEn.push([...values]);\n    });\n\n    return {\n      fr:resultFr,\n      en:resultEn\n    };\n  }\n\n  function patchGentleGammaData(){\n    const style=stylesMap().gentle_criminal_technical;\n    if(!style)return;\n\n    const gamma=(style.skills||[]).find(skill=>\n      /^(?:γ|y|g|gamma)(?:\\s|[-—:(]|$)/i.test(\n        clean(skill?.letter)\n      )\n    );\n\n    if(!gamma)return;\n\n    const tables=Array.isArray(gamma.tables)\n      ?gamma.tables\n      :[];\n\n    let additional=tables.find(table=>{\n      const title=normal(localized(table?.title));\n\n      return (\n        title.includes('additional_gamma')||\n        title.includes('valeurs_supplementaires_gamma')||\n        title.includes('degats_gamma_supplementaires')\n      );\n    });\n\n    if(!additional&&tables.length>1){\n      additional=tables[tables.length-1];\n    }\n\n    if(!additional)return;\n\n    additional.title={\n      fr:'Dégâts γ supplémentaires',\n      en:'Additional γ damage'\n    };\n\n    additional.cols={\n      fr:['Type','Niveau','Dégâts'],\n      en:['Type','Level','Damage']\n    };\n\n    const existing=additional.rows;\n    const baseRows=Array.isArray(existing)\n      ?existing\n      :(\n        existing?.en?.length\n          ?existing.en\n          :existing?.fr||[]\n      );\n\n    if(baseRows.length>=27){\n      additional.rows=bilingualRows(baseRows.slice(0,27));\n    }\n  }\n\n  const GENTLE_TEXT={\n    fr:new Map([\n      ['Rush','Ruée'],\n      ['Rebound','Rebond'],\n      ['Final Impact','Impact final'],\n      ['Additional γ damage','Dégâts γ supplémentaires'],\n      ['Additional γ values','Dégâts γ supplémentaires'],\n      ['Level','Niveau'],\n      ['Damage','Dégâts']\n    ]),\n    en:new Map([\n      ['Ruée','Rush'],\n      ['Rush','Rush'],\n      ['Rebond','Rebound'],\n      ['Rebound','Rebound'],\n      ['Impact final','Final Impact'],\n      ['Final Impact','Final Impact'],\n      ['Dégâts γ supplémentaires','Additional γ damage'],\n      ['Valeurs supplémentaires γ','Additional γ damage'],\n      ['Additional γ values','Additional γ damage'],\n      ['Niveau','Level'],\n      ['Dégâts','Damage']\n    ])\n  };\n\n  function gentlePanel(){\n    return [...document.querySelectorAll('.charPanel')]\n      .find(panel=>\n        normal(panel.querySelector('h2')?.textContent)\n          .includes('gentle_criminal')\n      )||null;\n  }\n\n  function fixGentleGammaDom(){\n    const panel=gentlePanel();\n    if(!panel)return;\n\n    const current=language();\n    const replacements=GENTLE_TEXT[current];\n\n    panel.querySelectorAll(\n      '.toggle,th,td,.miniTableTitle'\n    ).forEach(element=>{\n      const value=clean(element.textContent);\n      const replacement=replacements.get(value);\n\n      if(replacement){\n        element.textContent=replacement;\n      }\n    });\n  }\n\n  function patchData(){\n    patchGentleGammaData();\n  }\n\n  function fixDom(){\n    document.querySelectorAll('.s18PatchCharacterV10')\n      .forEach(forceMirioPatchCard);\n\n    fixGentleGammaDom();\n  }\n\n  function refresh(){\n    patchData();\n    fixDom();\n  }\n\n  function wrapRender(){\n    if(typeof window.render!=='function')return;\n    if(window.render.__mhurV601)return;\n\n    const original=window.render;\n\n    const wrapped=function(){\n      patchData();\n      const result=original.apply(this,arguments);\n\n      requestAnimationFrame(fixDom);\n      setTimeout(fixDom,40);\n      setTimeout(fixDom,160);\n\n      return result;\n    };\n\n    wrapped.__mhurV601=true;\n    window.render=wrapped;\n\n    try{\n      render=wrapped;\n    }catch(_error){}\n  }\n\n  let queued=false;\n\n  function schedule(){\n    if(queued)return;\n    queued=true;\n\n    requestAnimationFrame(()=>{\n      queued=false;\n      refresh();\n    });\n  }\n\n  new MutationObserver(mutations=>{\n    if(\n      mutations.some(mutation=>\n        mutation.addedNodes?.length||\n        mutation.type==='attributes'\n      )\n    ){\n      schedule();\n    }\n  }).observe(document.documentElement,{\n    childList:true,\n    subtree:true,\n    attributes:true,\n    attributeFilter:['class','src','hidden']\n  });\n\n  document.addEventListener('click',event=>{\n    if(\n      event.target?.closest?.(\n        '[data-patch-index],'+\n        '[data-tab=\"patch\"],'+\n        '#mhurPatchDevButtonV14,'+\n        '[data-s18-notes-button],'+\n        '.costumeTile,'+\n        '.toggle'\n      )\n    ){\n      setTimeout(refresh,0);\n      setTimeout(refresh,80);\n      setTimeout(refresh,220);\n    }\n  },true);\n\n  window.addEventListener('mhur:languagechange',()=>{\n    patchData();\n    setTimeout(refresh,0);\n    setTimeout(refresh,100);\n    setTimeout(refresh,260);\n  });\n\n  wrapRender();\n\n  if(document.readyState==='loading'){\n    document.addEventListener(\n      'DOMContentLoaded',\n      ()=>{\n        wrapRender();\n        refresh();\n      },\n      {once:true}\n    );\n  }else{\n    refresh();\n  }\n\n  window.addEventListener('load',refresh,{once:true});\n\n  window.MHUR_V601={\n    version:VERSION,\n    refresh,\n    patchGentleGammaData,\n    forceMirioPatchCard\n  };\n})();\n"
          CSS_CONTENT="\n/* MHUR Nexus — V601 : costumes mobiles pleine largeur */\n\n@media(max-width:760px){\n  body .costumeGroupsWrap,\n  body .costumeGalleryGroup,\n  body .costumeGalleryGrid{\n    width:100%!important;\n    max-width:100%!important;\n    min-width:0!important;\n    box-sizing:border-box!important;\n  }\n\n  body .costumeGalleryGroup{\n    margin-left:0!important;\n    margin-right:0!important;\n  }\n\n  body .costumeGalleryHead{\n    width:100%!important;\n    padding:12px 14px!important;\n    font-size:clamp(25px,8vw,34px)!important;\n    line-height:1.05!important;\n    box-sizing:border-box!important;\n  }\n\n  body .costumeGalleryGrid{\n    display:grid!important;\n    grid-template-columns:minmax(0,1fr)!important;\n    justify-content:stretch!important;\n    justify-items:stretch!important;\n    align-items:start!important;\n    gap:16px!important;\n    padding:12px!important;\n  }\n\n  body .costumeTile{\n    justify-self:stretch!important;\n    width:100%!important;\n    min-width:0!important;\n    max-width:none!important;\n    height:clamp(440px,128vw,560px)!important;\n    min-height:440px!important;\n    max-height:560px!important;\n    margin:0!important;\n    border-radius:16px!important;\n  }\n\n  body .costumeTile > img,\n  body .costumeTile img:first-child{\n    position:absolute!important;\n    top:34px!important;\n    left:0!important;\n    right:0!important;\n    width:100%!important;\n    height:calc(100% - 160px)!important;\n    max-width:none!important;\n    max-height:none!important;\n    padding:0 18px!important;\n    margin:0!important;\n    object-fit:contain!important;\n    object-position:center center!important;\n    transform:none!important;\n    box-sizing:border-box!important;\n  }\n\n  body .costumeTileName{\n    left:0!important;\n    right:0!important;\n    bottom:42px!important;\n    width:100%!important;\n    height:76px!important;\n    min-height:76px!important;\n    padding:0 14px!important;\n    font-size:clamp(22px,7vw,30px)!important;\n    line-height:1.05!important;\n  }\n\n  body .costumeMiniDesc{\n    left:0!important;\n    right:0!important;\n    bottom:0!important;\n    width:100%!important;\n    height:42px!important;\n    min-height:42px!important;\n    padding:5px 58px 0!important;\n    font-size:clamp(11px,3.3vw,14px)!important;\n    line-height:1.05!important;\n  }\n\n  body .costumeTileBadge{\n    width:46px!important;\n    height:46px!important;\n    min-width:46px!important;\n    min-height:46px!important;\n    bottom:104px!important;\n  }\n\n  body .costumeTileBadge.left{\n    left:14px!important;\n  }\n\n  body .costumeTileBadge.right{\n    right:14px!important;\n  }\n\n  body .costumeTileRarity{\n    top:12px!important;\n    left:12px!important;\n    font-size:18px!important;\n  }\n\n  body .costumeTileStars{\n    top:10px!important;\n    right:12px!important;\n  }\n}\n\n/* Très petits téléphones : la carte reste large sans dépasser l'écran. */\n@media(max-width:390px){\n  body .costumeGalleryGrid{\n    padding:8px!important;\n  }\n\n  body .costumeTile{\n    height:clamp(420px,132vw,515px)!important;\n    min-height:420px!important;\n  }\n\n  body .costumeTile > img,\n  body .costumeTile img:first-child{\n    padding:0 10px!important;\n  }\n}\n"


          def fail(message):
              raise RuntimeError(message)


          def read(path):
              if not path.is_file():
                  fail("Fichier introuvable : "+path.as_posix())

              return path.read_text(encoding="utf-8-sig")


          def write(path,content):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content.rstrip()+"\n",encoding="utf-8")


          def patch_index():
              html=read(INDEX)

              html=re.sub(
                  r"\s*<link\b[^>]*href=['\"][^'\"]*"
                  r"v601-mobile-costumes\.css"
                  r"[^'\"]*['\"][^>]*>\s*",
                  "\n",
                  html,
                  flags=re.I,
              )

              html=re.sub(
                  r"\s*<script\b[^>]*src=['\"][^'\"]*"
                  r"v601-mobile-patch-gentle\.js"
                  r"[^'\"]*['\"][^>]*>\s*</script>\s*",
                  "\n",
                  html,
                  flags=re.I,
              )

              if "</head>" not in html or "</body>" not in html:
                  fail("Balises </head> ou </body> introuvables.")

              html=html.replace(
                  "</head>",
                  '\n<link rel="stylesheet" '
                  'href="css/v601-mobile-costumes.css?v=601">\n'
                  "</head>",
                  1,
              )

              html=html.replace(
                  "</body>",
                  '\n<script '
                  'src="js/v601-mobile-patch-gentle.js?v=601">'
                  '</script>\n'
                  "</body>",
                  1,
              )

              write(INDEX,html)


          def verify():
              errors=[]
              html=read(INDEX)
              js=read(JS)
              css=read(CSS)

              for resource in (
                  "css/v601-mobile-costumes.css?v=601",
                  "js/v601-mobile-patch-gentle.js?v=601",
              ):
                  if resource not in html:
                      errors.append("Référence absente : "+resource)

              required_js=[
                  "mirio_technical",
                  "Phantom Smash",
                  "function forceMirioPatchCard",
                  "function patchGentleGammaData",
                  "Dégâts γ supplémentaires",
                  "Additional γ damage",
                  "'Ruée'",
                  "'Rebound'",
                  "'Final Impact'",
                  "window.MHUR_V601",
              ]

              for value in required_js:
                  if value not in js:
                      errors.append("Correctif JavaScript absent : "+value)

              required_css=[
                  "@media(max-width:760px)",
                  "grid-template-columns:minmax(0,1fr)",
                  "width:100%",
                  "height:clamp(440px,128vw,560px)",
                  ".costumeTileName",
              ]

              for value in required_css:
                  if value not in css:
                      errors.append("Correctif CSS absent : "+value)

              syntax=subprocess.run(
                  ["node","--check",str(JS)],
                  text=True,
                  capture_output=True,
              )

              if syntax.returncode:
                  errors.append(
                      "Syntaxe JavaScript invalide : "+syntax.stderr
                  )

              if errors:
                  fail(
                      "Vérification V601 échouée :\n- "
                      +"\n- ".join(errors)
                  )


          def main():
              if not INDEX.is_file():
                  fail("public/index.html est introuvable.")

              write(JS,JS_CONTENT)
              write(CSS,CSS_CONTENT)
              patch_index()
              verify()

              report=[
                  "MHUR FRANCE — RAPPORT V601",
                  "",
                  "PATCH NOTES MOBILE",
                  "- Toutes les cartes Mirio du dernier patch utilisent mirio_technical.",
                  "- Rôle forcé : Technique / Technical.",
                  "- Style forcé : Sheer Counter.",
                  "- Portrait local du style Technique.",
                  "- Alpha local : Phantom Smash.",
                  "- Les anciens textes comme Rupture ophtalmique invisible sont remplacés.",
                  "",
                  "COSTUMES MOBILE",
                  "- Une seule colonne sur téléphone.",
                  "- Chaque carte utilise toute la largeur disponible.",
                  "- Image agrandie sans être coupée.",
                  "- Nom, rareté, étoiles et T.U.N.I.N.G. repositionnés.",
                  "",
                  "GENTLE CRIMINAL γ",
                  "- Titre FR : Dégâts γ supplémentaires.",
                  "- Titre EN : Additional γ damage.",
                  "- Bloc 1 : Ruée / Rush.",
                  "- Bloc 2 : Rebond / Rebound.",
                  "- Bloc 3 : Impact final / Final Impact.",
                  "- Correction appliquée aux données et au DOM.",
                  "- Fonctionne sur PC et mobile.",
                  "",
                  "CACHE",
                  "- nouveaux fichiers chargés avec ?v=601.",
                  "",
                  "VÉRIFICATIONS",
                  "- syntaxe JavaScript : OK",
                  "- CSS mobile : OK",
                  "- chargement en dernière position : OK",
              ]

              write(REPORT,"\n".join(report))

              print("[OK] V601 appliqué et vérifié.")
              print("[OK] Mirio mobile = Sheer Counter / Technique.")
              print("[OK] Costumes mobiles = pleine largeur.")
              print("[OK] Gentle γ = traduction FR/EN complète.")


          if __name__=="__main__":
              main()
          PY
          python /tmp/appliquer_v601.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             public/index.html             public/js/v601-mobile-patch-gentle.js             public/css/v601-mobile-costumes.css             RAPPORT_V601_MOBILE_PATCH_COSTUMES_GENTLE.txt

          if git diff --cached --quiet; then
            echo "V601 est deja installe."
            exit 0
          fi

          git commit -m "Corriger mobile Patch costumes et Gentle V601"
          git push
