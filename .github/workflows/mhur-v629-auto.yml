name: MHUR V629 - Ouverture Patch et Dev Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v629-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v629-notes-open
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V629
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v629.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          SAFE_HEADER=base64.b64decode(
              ""
          ).decode("utf-8")
          
          index_path=Path("public/index.html")
          v627_path=Path(
              "public/js/v627-dev-notes-images-instant.js"
          )
          css_path=Path(
              "public/css/v629-notes-open-stable.css"
          )
          js_path=Path(
              "public/js/v629-notes-open-stable.js"
          )
          report_path=Path(
              "RAPPORT_V629_OUVERTURE_NOTES.txt"
          )
          
          for required in [index_path,v627_path]:
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          # Corrige directement le mauvais calcul de V627.
          v627=v627_path.read_text(encoding="utf-8")
          
          pattern=(
              r'  function headerBottom\(\)\{'
              r'.*?'
              r'\n  \}'
              r'\n\s*function refreshNotes\(\)\{'
          )
          
          replacement=(
              SAFE_HEADER+
              "\n\n  function refreshNotes(){"
          )
          
          v627,count=re.subn(
              pattern,
              replacement,
              v627,
              count=1,
              flags=re.S,
          )
          
          if count!=1:
              raise SystemExit(
                  "[ERREUR] La fonction headerBottom de V627 "
                  "n'a pas pu être corrigée."
              )
          
          v627_path.write_text(v627,encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          patterns=[
              r'\s*<!-- V629 : ouverture stable des Notes CSS\. -->\s*'
              r'<link[^>]+v629-notes-open-stable\.css[^>]*>\s*',
              r'\s*<link[^>]+v629-notes-open-stable\.css[^>]*>\s*',
              r'\s*<!-- V629 : ouverture stable des Notes JS\. -->\s*'
              r'<script[^>]+v629-notes-open-stable\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v629-notes-open-stable\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for item in patterns:
              html=re.sub(item,"\n",html,flags=re.I)
          
          # Cache busting du V627 corrigé.
          html,count_v627=re.subn(
              r'(<script\s+defer\s+'
              r'src=["\']js/v627-dev-notes-images-instant\.js)'
              r'(?:\?[^"\']*)?(["\'])',
              r'\1?v=629\2',
              html,
              count=1,
              flags=re.I,
          )
          
          if count_v627!=1:
              raise SystemExit(
                  "[ERREUR] Référence JS V627 introuvable."
              )
          
          css_tag=(
              '<!-- V629 : ouverture stable des Notes CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v629-notes-open-stable.css?v=629">\n'
          )
          
          js_tag=(
              '<!-- V629 : ouverture stable des Notes JS. -->\n'
              '<script src="js/v629-notes-open-stable.js?v=629">'
              '</script>\n'
          )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          if not bodies:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          head_position=heads[-1].start()
          html=html[:head_position]+css_tag+html[head_position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          body_position=bodies[-1].start()
          html=html[:body_position]+js_tag+html[body_position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V629
          
          PROBLÈME CORRIGÉ
          V627 utilisait tous les éléments <header> visibles de la page pour
          calculer la position de la fenêtre Patch Notes / Dev Notes. Un header
          de carte ou de section pouvait donc placer la fenêtre presque entièrement
          en dehors de l'écran.
          
          CORRECTIONS
          - Le calcul utilise uniquement le véritable header fixe du site.
          - Le bouton est intercepté au niveau window avant les anciennes couches.
          - La fenêtre est forcée visible et sous le vrai header.
          - Une ancienne structure de modal incompatible est supprimée et recréée.
          - Patch Notes, Dev Notes, liens officiels et contenu V628 restent inchangés.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V629 appliqué.")
          PY
          
          cat > /tmp/verifier_v629.py <<'PY'
          from pathlib import Path
          
          html=Path("public/index.html").read_text(encoding="utf-8")
          v627=Path(
              "public/js/v627-dev-notes-images-instant.js"
          ).read_text(encoding="utf-8")
          css=Path(
              "public/css/v629-notes-open-stable.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v629-notes-open-stable.js"
          ).read_text(encoding="utf-8")
          
          if html.count(
              "css/v629-notes-open-stable.css?v=629"
          )!=1:
              raise SystemExit(
                  "[ERREUR] CSS V629 absent ou dupliqué."
              )
          
          if html.count(
              "js/v629-notes-open-stable.js?v=629"
          )!=1:
              raise SystemExit(
                  "[ERREUR] JS V629 absent ou dupliqué."
              )
          
          if html.count(
              "js/v627-dev-notes-images-instant.js?v=629"
          )!=1:
              raise SystemExit(
                  "[ERREUR] Cache V627 non actualisé."
              )
          
          if "element.tagName==='HEADER'" in v627:
              raise SystemExit(
                  "[ERREUR] L'ancien calcul global des headers existe encore."
              )
          
          for token in [
              "document.querySelector('header.top')",
              "style.position==='fixed'",
              "rect.top<=2",
          ]:
              if token not in v627:
                  raise SystemExit(
                      f"[ERREUR] V627 incomplet : {{token}}"
                  )
          
          for token in [
              "window.addEventListener",
              "stopImmediatePropagation",
              "openNotesStable",
              "modalIsCompatible",
              "--mhur-v627-notes-top",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS V629 incomplet : {{token}}"
                  )
          
          for token in [
              "--mhur-v629-notes-top",
              "visibility:visible!important",
              "pointer-events:auto!important",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V629 incomplet : {{token}}"
                  )
          
          print("[OK] Contrôles V629 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v629.py
            node --check public/js/v627-dev-notes-images-instant.js
            node --check public/js/v629-notes-open-stable.js
            python3 /tmp/verifier_v629.py
          
            git add     public/index.html     public/js/v627-dev-notes-images-instant.js     public/css/v629-notes-open-stable.css     public/js/v629-notes-open-stable.js     RAPPORT_V629_OUVERTURE_NOTES.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V629 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: restaurer ouverture Patch et Dev Notes V629"
          
            if git push origin HEAD:main; then
              echo "[OK] V629 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V629 après cinq tentatives."
          exit 1
