name: MHUR V617 - Costumes mobile exacts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v617-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v617-costumes-mobile-exacts
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer V617
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/css
          printf '%s' '' | base64 --decode > public/css/v617-mobile-costumes-exacts.css
          printf '%s' '' | base64 --decode > /tmp/apply_v617.py
          python3 /tmp/apply_v617.py

      - name: Controler V617
        shell: bash
        run: |
          set -euo pipefail
          test -s public/css/v617-mobile-costumes-exacts.css
          grep -Fq 'css/v617-mobile-costumes-exacts.css?v=617' public/index.html
          test "$(grep -Fo 'css/v617-mobile-costumes-exacts.css?v=617' public/index.html | wc -l)" -eq 1
          grep -Fq '.costumeTile > img:first-of-type' public/css/v617-mobile-costumes-exacts.css
          grep -Fq '.s18UpcomingStatusV25' public/css/v617-mobile-costumes-exacts.css
          echo "[OK] V617 valide."

      - name: Enregistrer les changements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/css/v617-mobile-costumes-exacts.css RAPPORT_V617_COSTUMES_MOBILE_EXACTS.txt
          if git diff --cached --quiet; then
            echo "[INFO] V617 est deja applique."
            exit 0
          fi
          git commit -m "fix: corriger exactement les costumes mobile V617"
          git pull --rebase origin main
          git push origin HEAD:main
