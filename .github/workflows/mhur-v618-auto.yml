name: MHUR V618 - Costumes mobiles centres

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v618-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v618-costumes-mobile
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V618
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v618.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS = base64.b64decode("").decode("utf-8")
          JS = base64.b64decode("").decode("utf-8")
          
          index_path = Path("public/index.html")
          css_path = Path("public/css/v618-mobile-costume-visible-center.css")
          js_path = Path("public/js/v618-mobile-costume-visible-center.js")
          report_path = Path("RAPPORT_V618_COSTUMES_MOBILE_CENTRES.txt")
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          css_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.parent.mkdir(parents=True, exist_ok=True)
          css_path.write_text(CSS + "\n", encoding="utf-8")
          js_path.write_text(JS + "\n", encoding="utf-8")
          
          html = index_path.read_text(encoding="utf-8")
          
          patterns = [
              r'\s*<style id=["\']mhur-v617-costumes-mobile-final["\']>.*?</style>\s*',
              r'\s*<!-- V618 : costumes mobiles centres CSS\. -->\s*<link[^>]+v618-mobile-costume-visible-center\.css[^>]*>\s*',
              r'\s*<link[^>]+v618-mobile-costume-visible-center\.css[^>]*>\s*',
              r'\s*<!-- V618 : costumes mobiles centres JS\. -->\s*<script[^>]+v618-mobile-costume-visible-center\.js[^>]*></script>\s*',
              r'\s*<script[^>]+v618-mobile-costume-visible-center\.js[^>]*></script>\s*',
          ]
          
          for pattern in patterns:
              html = re.sub(pattern, "\n", html, flags=re.I | re.S)
          
          css_tag = (
              '<!-- V618 : costumes mobiles centres CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v618-mobile-costume-visible-center.css?v=618">\n'
          )
          js_tag = (
              '<!-- V618 : costumes mobiles centres JS. -->\n'
              '<script '
              'src="js/v618-mobile-costume-visible-center.js?v=618">'
              '</script>\n'
          )
          
          head_matches = list(re.finditer(r'</head\s*>', html, flags=re.I))
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          
          if not head_matches:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          if not body_matches:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          head_pos = head_matches[-1].start()
          html = html[:head_pos] + css_tag + html[head_pos:]
          
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          body_pos = body_matches[-1].start()
          html = html[:body_pos] + js_tag + html[body_pos:]
          
          index_path.write_text(html, encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V618
          
          - Centre les costumes Original d'après les pixels visibles du PNG.
          - Centre les costumes À venir malgré leur grande zone transparente.
          - Remonte tous les autres costumes sur mobile.
          - Conserve NEW, rareté, étoiles, date, statut et T.U.N.I.N.G.
          - N'agit pas sur la version ordinateur.
          """,
              encoding="utf-8"
          )
          
          print("[OK] V618 appliqué.")
          PY
          
          cat > /tmp/verifier_v618.py <<'PY'
          from pathlib import Path
          
          html = Path("public/index.html").read_text(encoding="utf-8")
          js = Path(
              "public/js/v618-mobile-costume-visible-center.js"
          ).read_text(encoding="utf-8")
          css = Path(
              "public/css/v618-mobile-costume-visible-center.css"
          ).read_text(encoding="utf-8")
          
          js_ref = "js/v618-mobile-costume-visible-center.js?v=618"
          css_ref = "css/v618-mobile-costume-visible-center.css?v=618"
          
          if html.count(js_ref) != 1:
              raise SystemExit("[ERREUR] Référence JS V618 absente ou dupliquée.")
          if html.count(css_ref) != 1:
              raise SystemExit("[ERREUR] Référence CSS V618 absente ou dupliquée.")
          
          for token in [
              "scanVisibleBox",
              "getImageData",
              "isUpcoming",
              "isOriginal",
              "verticalRatio",
              "data-v618-main",
          ]:
              if token not in js:
                  raise SystemExit(f"[ERREUR] Élément JS manquant : {token}")
          
          for token in [
              'img[data-v618-main="1"]',
              "--v618-left",
              "--v618-top",
              "object-fit:fill!important",
          ]:
              if token not in css:
                  raise SystemExit(f"[ERREUR] Élément CSS manquant : {token}")
          
          print("[OK] Contrôles V618 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v618.py
            node --check public/js/v618-mobile-costume-visible-center.js
            python3 /tmp/verifier_v618.py
          
            git add \
              public/index.html \
              public/css/v618-mobile-costume-visible-center.css \
              public/js/v618-mobile-costume-visible-center.js \
              RAPPORT_V618_COSTUMES_MOBILE_CENTRES.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V618 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: centrer et remonter les costumes mobile V618"
          
            if git push origin HEAD:main; then
              echo "[OK] V618 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V618 après cinq tentatives."
          exit 1
