name: MHUR - Test Discord

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Envoyer un message de test
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          user_id = os.environ.get("DISCORD_USER_ID", "").strip()

          if not webhook:
              raise SystemExit(
                  "[ERREUR] Le secret DISCORD_WEBHOOK_URL est absent."
              )

          mention = f"<@{user_id}> " if user_id else ""

          payload = {
              "username": "MHUR Nexus — Test",
              "content": (
                  f"{mention}✅ **Test réussi !**\n"
                  "Les notifications automatiques MHUR Nexus "
                  "arriveront bien dans ce salon."
              ),
              "allowed_mentions": (
                  {"users": [user_id]}
                  if user_id
                  else {"parse": []}
              ),
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 204):
                  raise SystemExit(
                      f"[ERREUR] Discord a répondu {response.status}."
                  )

          print("[OK] Message de test Discord envoyé.")
          PY
