name: MHUR V604 - corriger nom et description Shoto beta

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v604-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v604-shoto-beta-text
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer V604
        shell: bash
        run: |
          cat > /tmp/appliquer_v604.py <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          ROOT=Path.cwd()
          INDEX=ROOT/'public/index.html'
          JS=ROOT/'public/js/v604-shoto-beta-text-fix.js'
          REPORT=ROOT/'RAPPORT_V604_SHOTO_BETA_TEXT_FIX.txt'

          JS_CONTENT="\n/* MHUR Nexus — V604 : nom et description corrects de l'Alter β de Shoto Technique */\n(function(){\n  'use strict';\n\n  if(window.MHUR_V604_SHOTO_BETA_LOADED)return;\n  window.MHUR_V604_SHOTO_BETA_LOADED=true;\n\n  const EN_NAME='Heaven-Piercing Ice Wall';\n  const EN_DESC='An area damage attack that creates a massive block of ice in the aim direction. The ice block can penetrate through walls.';\n  const FR_NAME='Mur de glace transperçant les cieux';\n  const FR_DESC='Crée un immense bloc de glace dans la direction visée. Le bloc de glace peut traverser les murs.';\n\n  function currentLanguage(){\n    try{\n      if(typeof lang!=='undefined'&&(lang==='fr'||lang==='en'))return lang;\n    }catch(_error){}\n\n    return String(document.documentElement.lang||'')\n      .toLowerCase()\n      .startsWith('en')\n      ?'en'\n      :'fr';\n  }\n\n  function stylesMap(){\n    try{\n      if(typeof styles!=='undefined'&&styles)return styles;\n    }catch(_error){}\n\n    return window.styles||{};\n  }\n\n  function letterKey(value){\n    const raw=String(value??'').trim();\n\n    if(/^(?:β|b|beta)(?:\\s|[-—:(]|$)/i.test(raw)){\n      return 'beta';\n    }\n\n    return '';\n  }\n\n  function patchData(){\n    const style=stylesMap().shoto_technical;\n    if(!style||!Array.isArray(style.skills))return false;\n\n    const beta=style.skills.find(skill=>\n      letterKey(skill?.letter)==='beta'\n    );\n\n    if(!beta)return false;\n\n    beta.name={fr:FR_NAME,en:EN_NAME};\n    beta.desc={fr:FR_DESC,en:EN_DESC};\n\n    return true;\n  }\n\n  function isTargetSkill(skill){\n    const image=String(\n      skill.querySelector('.skillImgBox img')?.getAttribute('src')||''\n    ).toLowerCase();\n\n    if(image.includes('shoto_technical/beta'))return true;\n\n    const head=String(\n      skill.querySelector('.skillHead')?.textContent||''\n    ).toLowerCase();\n\n    return (\n      head.includes('cascada de hielo rasgadora')||\n      head.includes('causes an explosion')||\n      head.includes('heaven-piercing ice wall')||\n      head.includes('mur de glace transperçant')\n    );\n  }\n\n  function fixDom(){\n    const language=currentLanguage();\n    const name=language==='en'?EN_NAME:FR_NAME;\n    const description=language==='en'?EN_DESC:FR_DESC;\n\n    document.querySelectorAll('.charPanel .skill').forEach(skill=>{\n      if(!isTargetSkill(skill))return;\n\n      const head=skill.querySelector('.skillHead');\n      const desc=skill.querySelector('.skillDesc');\n\n      if(head)head.textContent='β — '+name;\n      if(desc)desc.textContent=description;\n    });\n  }\n\n  function refresh(){\n    patchData();\n    fixDom();\n  }\n\n  function wrapRender(){\n    if(typeof window.render!=='function')return;\n    if(window.render.__mhurV604)return;\n\n    const original=window.render;\n\n    const wrapped=function(){\n      patchData();\n      const result=original.apply(this,arguments);\n      requestAnimationFrame(fixDom);\n      return result;\n    };\n\n    wrapped.__mhurV604=true;\n    window.render=wrapped;\n\n    try{render=wrapped}catch(_error){}\n  }\n\n  let scheduled=false;\n\n  function schedule(){\n    if(scheduled)return;\n    scheduled=true;\n\n    requestAnimationFrame(()=>{\n      scheduled=false;\n      refresh();\n    });\n  }\n\n  const observer=new MutationObserver(mutations=>{\n    if(mutations.some(mutation=>mutation.addedNodes?.length)){\n      schedule();\n    }\n  });\n\n  function start(){\n    patchData();\n    wrapRender();\n    schedule();\n\n    observer.observe(document.documentElement,{\n      childList:true,\n      subtree:true\n    });\n  }\n\n  window.addEventListener('mhur:languagechange',()=>{\n    setTimeout(schedule,0);\n    setTimeout(schedule,80);\n  });\n\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',start,{once:true});\n  }else{\n    start();\n  }\n\n  window.addEventListener('load',schedule,{once:true});\n\n  window.MHUR_V604={refresh};\n})();\n"

          EN_NAME='Heaven-Piercing Ice Wall'
          EN_DESC='An area damage attack that creates a massive block of ice in the aim direction. The ice block can penetrate through walls.'


          def fail(message):
              raise RuntimeError(message)


          def read(path):
              if not path.is_file():
                  fail('Fichier introuvable : '+path.as_posix())
              return path.read_text(encoding='utf-8-sig')


          def write(path,content):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content.rstrip()+'\n',encoding='utf-8')


          def patch_exact_database(html):
              pattern=(
                  r'(<script\b[^>]*id=["\']ultrarumble-exact-data["\']'
                  r'[^>]*>)([\s\S]*?)(</script>)'
              )

              match=re.search(pattern,html,flags=re.I)

              if not match:
                  fail('Le bloc ultrarumble-exact-data est introuvable.')

              try:
                  database=json.loads(match.group(2).strip())
              except Exception as error:
                  fail('Le bloc ultrarumble-exact-data est invalide : '+str(error))

              target=None

              for character in database.get('characters') or []:
                  if (
                      str(character.get('name') or '')=='Shoto Todoroki'
                      and str(character.get('style_name') or '')=='Ice Fang Wind Flame'
                  ):
                      target=character
                      break

              if target is None:
                  fail('Shoto Todoroki — Ice Fang Wind Flame est introuvable.')

              skills=target.setdefault('skills',{})
              beta=skills.get('β')

              if not isinstance(beta,dict):
                  fail("L'Alter β de Shoto Technique est introuvable.")

              old_name=str(beta.get('name') or '')
              old_description=str(beta.get('description') or '')

              beta['name']=EN_NAME
              beta['description']=EN_DESC

              compact=json.dumps(
                  database,
                  ensure_ascii=False,
                  separators=(',',':'),
              )

              replacement=match.group(1)+'\n'+compact+'\n'+match.group(3)
              html=html[:match.start()]+replacement+html[match.end():]

              return html,old_name,old_description


          def patch_index():
              html=read(INDEX)
              html,old_name,old_description=patch_exact_database(html)

              html=re.sub(
                  r'\s*<script\b[^>]*src=["\'][^"\']*'
                  r'v604-shoto-beta-text-fix\.js[^"\']*["\'][^>]*>'
                  r'\s*</script>\s*',
                  '\n',
                  html,
                  flags=re.I,
              )

              if '</body>' not in html:
                  fail('Balise </body> introuvable.')

              html=html.replace(
                  '</body>',
                  '\n<script src="js/v604-shoto-beta-text-fix.js?v=604"></script>\n</body>',
                  1,
              )

              write(INDEX,html)
              return old_name,old_description


          def verify():
              html=read(INDEX)
              js=read(JS)
              errors=[]

              if 'js/v604-shoto-beta-text-fix.js?v=604' not in html:
                  errors.append('Le JavaScript V604 n’est pas chargé.')

              if html.count('v604-shoto-beta-text-fix.js')!=1:
                  errors.append('La référence V604 est dupliquée.')

              if 'Cascada de hielo rasgadora' in html:
                  errors.append('Le texte espagnol est encore présent dans index.html.')

              if '"name":"Heaven-Piercing Ice Wall"' not in html:
                  errors.append('Le vrai nom anglais est absent de la base exacte.')

              if EN_DESC not in html:
                  errors.append('La vraie description anglaise est absente.')

              for required in (
                  'stylesMap().shoto_technical',
                  "beta.name={fr:FR_NAME,en:EN_NAME}",
                  "beta.desc={fr:FR_DESC,en:EN_DESC}",
                  'function fixDom',
                  'window.MHUR_V604',
              ):
                  if required not in js:
                      errors.append('Correctif runtime absent : '+required)

              syntax=subprocess.run(
                  ['node','--check',str(JS)],
                  text=True,
                  capture_output=True,
              )

              if syntax.returncode:
                  errors.append('Syntaxe JavaScript invalide : '+syntax.stderr)

              if errors:
                  fail('Vérification V604 échouée :\n- '+'\n- '.join(errors))


          def main():
              if not INDEX.is_file():
                  fail('public/index.html est introuvable.')

              write(JS,JS_CONTENT)
              old_name,old_description=patch_index()
              verify()

              report=[
                  'MHUR FRANCE — RAPPORT V604',
                  '',
                  'PROBLÈME CONFIRMÉ',
                  '- Le nom de l’Alter β contenait la description de l’Alpha en mode visée.',
                  '- La description contenait le nom espagnol Cascada de hielo rasgadora.',
                  '',
                  'AVANT',
                  '- Nom : '+old_name.replace('\n',' '),
                  '- Description : '+old_description.replace('\n',' '),
                  '',
                  'APRÈS',
                  '- Nom EN : '+EN_NAME,
                  '- Description EN : '+EN_DESC,
                  '- Nom FR : Mur de glace transperçant les cieux',
                  '- Description FR : Crée un immense bloc de glace dans la direction visée. Le bloc de glace peut traverser les murs.',
                  '',
                  'CORRECTIONS',
                  '- Base ultrarumble-exact-data corrigée directement.',
                  '- styles.shoto_technical corrigé à l’exécution.',
                  '- Le DOM est corrigé après chaque rendu et changement de langue.',
                  '- Aucune boucle sur les attributs : pas de chargement infini.',
              ]

              write(REPORT,'\n'.join(report))

              print('[OK] V604 appliqué et vérifié.')
              print('[OK] β = Heaven-Piercing Ice Wall.')
              print('[OK] La description de l’Alpha n’est plus utilisée comme nom du β.')
              print('[OK] Le texte espagnol a été supprimé.')


          if __name__=='__main__':
              main()
          PY
          python3 /tmp/appliquer_v604.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/index.html \
            public/js/v604-shoto-beta-text-fix.js \
            RAPPORT_V604_SHOTO_BETA_TEXT_FIX.txt

          if git diff --cached --quiet; then
            echo "V604 est deja installe."
            exit 0
          fi

          git commit -m "Corriger nom et description Shoto beta V604"
          git push
