name: MHUR - Correctif final Patch 1785298405 V658

on:
  workflow_run:
    workflows:
      - "MHUR - Synchronisation UltraRumble"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-patch-1785298405-v658
  cancel-in-progress: false

jobs:
  corriger-patch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Corriger exactement le patch 1785298405
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import unicodedata
          from collections import Counter
          from pathlib import Path

          PATCH_ID = "1785298405"
          INDEX = Path("public/index.html")
          HOME_JSON = Path("public/data/home_data.json")
          HOME_JS = Path("public/data/home_data.js")
          FINAL_JS = Path("public/js/v658-patch-1785298405-final.js")

          for required in (INDEX, HOME_JSON):
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )

          def clean(value: object) -> str:
              if isinstance(value, dict):
                  return str(
                      value.get("en")
                      or value.get("fr")
                      or next(iter(value.values()), "")
                  ).strip()
              return str(value or "").strip()

          def norm(value: object) -> str:
              text = unicodedata.normalize(
                  "NFD",
                  clean(value).lower(),
              )
              text = "".join(
                  char
                  for char in text
                  if unicodedata.category(char) != "Mn"
              )
              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text,
              ).strip()

          def metric_kind(value: object) -> str:
              label = norm(value)
              if label.startswith(("damage", "degats")):
                  return "damage"
              if label.startswith(("guard break", "brise garde")):
                  return "guard"
              return ""

          data = json.loads(
              HOME_JSON.read_text(encoding="utf-8")
          )

          patches = data.get("patch_notes")
          if not isinstance(patches, list):
              raise SystemExit("[ERREUR] Liste patch_notes absente.")

          patch = next(
              (
                  item
                  for item in patches
                  if str(item.get("id")) == PATCH_ID
              ),
              None,
          )
          if patch is None:
              raise SystemExit(
                  f"[ERREUR] Patch {PATCH_ID} introuvable."
              )

          details = patch.get("details")
          if not isinstance(details, list):
              raise SystemExit("[ERREUR] Sections du patch absentes.")

          damage_section = next(
              (
                  section
                  for section in details
                  if "damage" in norm(section.get("title"))
                  or "degat" in norm(section.get("title"))
              ),
              None,
          )
          if damage_section is None:
              raise SystemExit("[ERREUR] Section Damage introuvable.")

          old_alpha = [
              "30.0", "31.0", "32.0",
              "34.0", "35.0", "36.0",
              "37.0", "38.0", "40.0",
          ]
          new_alpha = [
              "40.0", "41.0", "42.0",
              "44.0", "45.0", "46.0",
              "47.0", "48.0", "50.0",
          ]
          old_beta = old_alpha[:]
          new_beta = [
              "35.0", "36.0", "37.0",
              "39.0", "40.0", "41.0",
              "42.0", "43.0", "45.0",
          ]
          old_beta_follow = [
              "40.0", "41.0", "42.0",
              "44.0", "45.0", "46.0",
              "47.0", "48.0", "50.0",
          ]
          new_beta_follow = [
              "44.0", "46.0", "48.0",
              "50.0", "52.0", "54.0",
              "56.0", "58.0", "60.0",
          ]

          bakugo_portrait = (
              "assets/home/patches/1785298405/"
              "portrait_katsuki_bakugo.webp"
          )
          alpha_image = (
              "assets/home/patches/1785298405/"
              "skill_katsuki_bakugo_"
              "ap_shot_cluster_normal.png"
          )
          beta_image = (
              "assets/home/patches/1785298405/"
              "skill_katsuki_bakugo_"
              "nitro_cluster_explosion.png"
          )
          beta_follow_image = (
              "assets/home/patches/1785298405/"
              "skill_katsuki_bakugo_"
              "nitro_cluster_explosionfollow_up.png"
          )

          def bakugo_change(
              title: str,
              image: str,
              label: str,
              before: list[str],
              after: list[str],
          ) -> dict:
              return {
                  "character": "Katsuki Bakugo",
                  "style": "Cluster",
                  "role": "Technique",
                  "portrait": bakugo_portrait,
                  "skill_name": title,
                  "skill_image": image,
                  "label": label,
                  "before": before,
                  "after": after,
                  "tone": "buff",
              }

          canonical_bakugo = [
              bakugo_change(
                  "α - AP Shot Cluster (Normal)",
                  alpha_image,
                  "Damage",
                  old_alpha,
                  new_alpha,
              ),
              bakugo_change(
                  "α - AP Shot Cluster (Normal)",
                  alpha_image,
                  "Guard Break",
                  old_alpha,
                  new_alpha,
              ),
              bakugo_change(
                  "β - Nitro Cluster (Explosion)",
                  beta_image,
                  "Damage",
                  old_beta,
                  new_beta,
              ),
              bakugo_change(
                  "β - Nitro Cluster (Explosion)",
                  beta_image,
                  "Guard Break",
                  old_beta,
                  new_beta,
              ),
              bakugo_change(
                  "β - Nitro Cluster (ExplosionFollow-up)",
                  beta_follow_image,
                  "Damage",
                  old_beta_follow,
                  new_beta_follow,
              ),
              bakugo_change(
                  "β - Nitro Cluster (ExplosionFollow-up)",
                  beta_follow_image,
                  "Guard Break",
                  old_beta_follow,
                  new_beta_follow,
              ),
          ]

          changes = list(damage_section.get("changes") or [])
          kept = []
          insert_at = None

          for change in changes:
              is_target = (
                  isinstance(change, dict)
                  and "bakugo" in norm(change.get("character"))
                  and norm(change.get("style")) == "cluster"
                  and metric_kind(change.get("label"))
                  in {"damage", "guard"}
              )

              if is_target:
                  if insert_at is None:
                      insert_at = len(kept)
                  continue

              kept.append(change)

          if insert_at is None:
              insert_at = len(kept)

          kept[insert_at:insert_at] = canonical_bakugo
          damage_section["changes"] = kept

          armored_count = 0
          for section in details:
              for change in section.get("changes") or []:
                  if not isinstance(change, dict):
                      continue
                  if norm(change.get("character")) != "armored all might":
                      continue
                  if metric_kind(change.get("label")) not in {
                      "damage",
                      "guard",
                  }:
                      continue

                  before = [
                      clean(value)
                      for value in change.get("before") or []
                  ]
                  image = norm(change.get("skill_image"))
                  title = norm(change.get("skill_name"))

                  is_target = (
                      "ice bullet shot burn" in image
                      or "ice bullet shot burn" in title
                      or before == [
                          "52.0", "54.0", "56.0",
                          "58.0", "60.0", "62.0",
                          "64.0", "66.0", "68.0",
                      ]
                  )
                  if not is_target:
                      continue

                  change["skill_name"] = "α - Ice Bullet Shot (Burn)"
                  change["skill_image"] = (
                      "assets/home/patches/1785298405/"
                      "skill_armored_all_might_"
                      "ice_bullet_shot_burn.png"
                  )
                  armored_count += 1

          if armored_count != 2:
              raise SystemExit(
                  "[ERREUR] 2 changements Armored All Might "
                  f"attendus, trouvé : {armored_count}"
              )

          for section in details:
              for change in section.get("changes") or []:
                  if not isinstance(change, dict):
                      continue

                  name = clean(change.get("skill_name"))
                  if (
                      not name
                      or name.upper() in {"HP", "PV"}
                      or norm(name).startswith(
                          ("special action", "action speciale")
                      )
                  ):
                      continue

                  if re.match(r"^[αβγ]\s*[-–—:]", name):
                      continue

                  image = clean(change.get("skill_image")).lower()

                  symbol = ""
                  if re.search(r"(?:unique1|alpha)", image):
                      symbol = "α"
                  elif re.search(r"(?:unique2|beta)", image):
                      symbol = "β"
                  elif re.search(r"(?:unique3|gamma)", image):
                      symbol = "γ"

                  if symbol:
                      name = re.sub(
                          r"^\s*[-–—:]\s*",
                          "",
                          name,
                      )
                      change["skill_name"] = f"{symbol} - {name}"

          data.setdefault("meta", {})[
              "patch_1785298405_fix"
          ] = "v658-final-after-all-scripts"

          HOME_JSON.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          compact = json.dumps(
              data,
              ensure_ascii=False,
              separators=(",", ":"),
          ).replace("\u2028", "\\u2028").replace(
              "\u2029",
              "\\u2029",
          )
          home_js_content = (
              f"window.MHUR_HOME_DATA = {compact};\n"
          )
          HOME_JS.write_text(
              home_js_content,
              encoding="utf-8",
          )

          FINAL_SCRIPT = "/* MHUR V658 — correctif visuel final du patch 1785298405.\n   Chargé après season18-fixes.js et season18-v12.js. */\n(function(){\n  'use strict';\n\n  if(window.MHUR_PATCH_1785298405_V658)return;\n  window.MHUR_PATCH_1785298405_V658=true;\n\n  const PATCH_VERSION=/1\\.17\\.0-14\\.5/i;\n\n  function language(){\n    try{\n      if(typeof lang!=='undefined'&&lang==='en'){\n        return 'en';\n      }\n    }catch(_error){}\n    return String(document.documentElement.lang||'')\n      .toLowerCase()\n      .startsWith('en')\n      ?'en'\n      :'fr';\n  }\n\n  function clean(value){\n    return String(value??'').replace(/\\s+/g,' ').trim();\n  }\n\n  function normal(value){\n    return clean(value)\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .toLowerCase();\n  }\n\n  function numbers(card,selector){\n    return [...card.querySelectorAll(selector)]\n      .map(cell=>Number(\n        clean(cell.textContent).replace(',','.')\n      ))\n      .filter(Number.isFinite);\n  }\n\n  function same(values,expected){\n    return (\n      values.length===expected.length&&\n      values.every(\n        (value,index)=>\n          Math.abs(value-expected[index])<0.001\n      )\n    );\n  }\n\n  function metric(card){\n    const value=normal(\n      card.querySelector('.s18PatchLabelV10')\n        ?.textContent\n    );\n\n    if(/brise|guard/.test(value)){\n      return {\n        fr:'Brise-garde',\n        en:'Guard Break'\n      };\n    }\n\n    return {\n      fr:'Dégâts',\n      en:'Damage'\n    };\n  }\n\n  function setCard(card,frTitle,enTitle){\n    const title=card.querySelector('h5');\n    const label=card.querySelector(\n      '.s18PatchLabelV10'\n    );\n\n    if(title){\n      const wanted=language()==='en'\n        ?enTitle\n        :frTitle;\n      if(clean(title.textContent)!==wanted){\n        title.textContent=wanted;\n      }\n    }\n\n    if(label){\n      const names=metric(card);\n      const wanted=names[language()];\n      if(clean(label.textContent)!==wanted){\n        label.textContent=wanted;\n      }\n    }\n  }\n\n  function fixBakugo(article){\n    const oldAlpha=[\n      30,31,32,34,35,36,37,38,40\n    ];\n    const newAlpha=[\n      40,41,42,44,45,46,47,48,50\n    ];\n    const newBeta=[\n      35,36,37,39,40,41,42,43,45\n    ];\n    const oldFollow=[\n      40,41,42,44,45,46,47,48,50\n    ];\n    const newFollow=[\n      44,46,48,50,52,54,56,58,60\n    ];\n\n    article.querySelectorAll(\n      '.s18PatchChangeV10'\n    ).forEach(card=>{\n      const before=numbers(card,'tr.before td');\n      const after=numbers(card,'tr.after td');\n\n      if(same(before,oldAlpha)&&same(after,newAlpha)){\n        setCard(\n          card,\n          'α - AP Shot Cluster (Normal)',\n          'α - AP Shot Cluster (Normal)'\n        );\n        return;\n      }\n\n      if(same(before,oldAlpha)&&same(after,newBeta)){\n        setCard(\n          card,\n          'β - Nitro Cluster (Explosion)',\n          'β - Nitro Cluster (Explosion)'\n        );\n        return;\n      }\n\n      if(same(before,oldFollow)&&same(after,newFollow)){\n        setCard(\n          card,\n          'β - Nitro Cluster (Explosion renforcée)',\n          'β - Nitro Cluster (ExplosionFollow-up)'\n        );\n      }\n    });\n  }\n\n  function fixArmoredAllMight(article){\n    const expectedBefore=[\n      52,54,56,58,60,62,64,66,68\n    ];\n    const expectedAfter=[\n      48,50,52,54,55,56,57,58,60\n    ];\n\n    article.querySelectorAll(\n      '.s18PatchChangeV10'\n    ).forEach(card=>{\n      const before=numbers(card,'tr.before td');\n      const after=numbers(card,'tr.after td');\n\n      if(\n        same(before,expectedBefore)&&\n        same(after,expectedAfter)\n      ){\n        setCard(\n          card,\n          'α - Ice Bullet Shot (Brûlure)',\n          'α - Ice Bullet Shot (Burn)'\n        );\n      }\n    });\n  }\n\n  function inferSymbol(card){\n    const image=clean(\n      card.querySelector(\n        '.s18PatchImageV608 img,'\n        +'.s18PatchSkillV10 img'\n      )?.getAttribute('src')\n    ).toLowerCase();\n\n    if(/unique1|alpha/.test(image))return 'α';\n    if(/unique2|beta/.test(image))return 'β';\n    if(/unique3|gamma/.test(image))return 'γ';\n    return '';\n  }\n\n  function addMissingSign(card){\n    const title=card.querySelector('h5');\n    if(!title)return;\n\n    const current=clean(title.textContent);\n    if(\n      !current||\n      /^[αβγ]\\s*[-–—:]/.test(current)||\n      /^(?:hp|pv)$/i.test(current)||\n      /special action|action spéciale/i.test(current)\n    ){\n      return;\n    }\n\n    const symbol=inferSymbol(card);\n    if(symbol){\n      title.textContent=`${symbol} - ${current}`;\n    }\n  }\n\n  function isTargetPatch(modal){\n    const title=clean(\n      modal.querySelector(\n        '.s18PatchDetailHeadV10 h2'\n      )?.textContent\n    );\n    return PATCH_VERSION.test(title);\n  }\n\n  let applying=false;\n\n  function apply(){\n    if(applying)return;\n\n    const modal=document.getElementById(\n      's18NotesDevModalV10'\n    );\n    if(!modal||!isTargetPatch(modal))return;\n\n    applying=true;\n    try{\n      modal.querySelectorAll(\n        'article.s18PatchCharacterV10'\n      ).forEach(article=>{\n        const character=normal(\n          article.querySelector('header h4')\n            ?.textContent\n        );\n        const style=normal(\n          article.querySelector('header strong')\n            ?.textContent\n        );\n\n        if(\n          character.includes('katsuki bakugo')&&\n          style.includes('cluster')\n        ){\n          fixBakugo(article);\n        }\n\n        if(character.includes('armored all might')){\n          fixArmoredAllMight(article);\n        }\n\n        article.querySelectorAll(\n          '.s18PatchChangeV10'\n        ).forEach(addMissingSign);\n      });\n    }finally{\n      applying=false;\n    }\n  }\n\n  let queued=false;\n\n  function schedule(){\n    if(queued)return;\n    queued=true;\n    requestAnimationFrame(()=>{\n      queued=false;\n      apply();\n    });\n  }\n\n  document.addEventListener(\n    'click',\n    ()=>{\n      setTimeout(schedule,0);\n      setTimeout(schedule,80);\n      setTimeout(schedule,300);\n    },\n    true\n  );\n\n  new MutationObserver(mutations=>{\n    if(\n      mutations.some(\n        mutation=>\n          mutation.addedNodes?.length||\n          mutation.type==='characterData'\n      )\n    ){\n      schedule();\n    }\n  }).observe(document.documentElement,{\n    childList:true,\n    subtree:true,\n    characterData:true\n  });\n\n  window.addEventListener(\n    'mhur:languagechange',\n    schedule\n  );\n  window.addEventListener(\n    'load',\n    schedule,\n    {once:true}\n  );\n\n  if(document.readyState==='loading'){\n    document.addEventListener(\n      'DOMContentLoaded',\n      schedule,\n      {once:true}\n    );\n  }else{\n    schedule();\n  }\n\n  window.MHUR_PATCH_1785298405_REFRESH_V658=\n    schedule;\n})();\n"
          FINAL_JS.write_text(
              FINAL_SCRIPT,
              encoding="utf-8",
          )

          data_hash = hashlib.sha256(
              home_js_content.encode("utf-8")
          ).hexdigest()[:12]
          final_hash = hashlib.sha256(
              FINAL_SCRIPT.encode("utf-8")
          ).hexdigest()[:12]

          index = INDEX.read_text(encoding="utf-8")

          index, home_count = re.subn(
              r'(<script\s+src=["\']'
              r'(?:/)?data/home_data\.js)'
              r'(?:\?v=[^"\']*)?(["\']\s*></script>)',
              rf"\1?v=658-{data_hash}\2",
              index,
              count=1,
              flags=re.IGNORECASE,
          )
          if home_count != 1:
              raise SystemExit(
                  "[ERREUR] Balise home_data.js introuvable."
              )

          index = re.sub(
              r'\s*<script\s+src=["\']'
              r'(?:/)?js/v658-patch-1785298405-final\.js'
              r'(?:\?v=[^"\']*)?["\']\s*></script>\s*',
              "\n",
              index,
              flags=re.IGNORECASE,
          )

          final_tag = (
              '<script src="js/'
              'v658-patch-1785298405-final.js'
              f'?v={final_hash}"></script>'
          )

          if "</body>" not in index:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")

          index = index.replace(
              "</body>",
              f"{final_tag}\n</body>",
              1,
          )
          INDEX.write_text(index, encoding="utf-8")

          saved = json.loads(
              HOME_JSON.read_text(encoding="utf-8")
          )
          saved_patch = next(
              item
              for item in saved["patch_notes"]
              if str(item.get("id")) == PATCH_ID
          )
          saved_changes = [
              change
              for section in saved_patch.get("details") or []
              for change in section.get("changes") or []
              if isinstance(change, dict)
          ]

          bakugo = [
              change
              for change in saved_changes
              if (
                  "bakugo" in norm(change.get("character"))
                  and norm(change.get("style")) == "cluster"
                  and metric_kind(change.get("label"))
                  in {"damage", "guard"}
              )
          ]

          expected_titles = Counter({
              "α - AP Shot Cluster (Normal)": 2,
              "β - Nitro Cluster (Explosion)": 2,
              "β - Nitro Cluster (ExplosionFollow-up)": 2,
          })
          actual_titles = Counter(
              change.get("skill_name")
              for change in bakugo
          )
          if actual_titles != expected_titles:
              raise SystemExit(
                  "[ERREUR] Données Bakugo incorrectes : "
                  f"{dict(actual_titles)}"
              )

          armored = [
              change
              for change in saved_changes
              if (
                  norm(change.get("character"))
                  == "armored all might"
                  and change.get("skill_name")
                  == "α - Ice Bullet Shot (Burn)"
                  and metric_kind(change.get("label"))
                  in {"damage", "guard"}
              )
          ]
          if len(armored) != 2:
              raise SystemExit(
                  "[ERREUR] Armored All Might incorrect."
              )

          saved_js = HOME_JS.read_text(encoding="utf-8")
          if not saved_js.startswith("window.MHUR_HOME_DATA = "):
              raise SystemExit("[ERREUR] home_data.js invalide.")

          final_index = INDEX.read_text(encoding="utf-8")
          final_position = final_index.rfind(
              "v658-patch-1785298405-final.js"
          )
          season_position = final_index.rfind("season18-v12.js")
          if final_position < 0 or final_position < season_position:
              raise SystemExit(
                  "[ERREUR] V658 n'est pas chargé en dernier."
              )

          if (
              f"data/home_data.js?v=658-{data_hash}"
              not in final_index
          ):
              raise SystemExit(
                  "[ERREUR] Nouveau cache des données absent."
              )

          print("[OK] Source exacte UltraRumble appliquée.")
          print("[OK] 2 cartes α AP Shot Cluster (Normal).")
          print("[OK] 2 cartes β Nitro Cluster (Explosion).")
          print(
              "[OK] 2 cartes β Nitro Cluster "
              "(ExplosionFollow-up)."
          )
          print(
              "[OK] Armored All Might : "
              "α Ice Bullet Shot (Burn)."
          )
          print("[OK] V658 est chargé après season18-v12.js.")
          PY

      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/v658-patch-1785298405-final.js

      - name: Publier le correctif
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/index.html \
            public/data/home_data.json \
            public/data/home_data.js \
            public/js/v658-patch-1785298405-final.js

          if git diff --cached --quiet; then
            echo "[OK] Le correctif V658 est déjà appliqué."
            exit 0
          fi

          git commit -m "fix: patch 1785298405 exact et signes alters"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] Correctif V658 publié sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Impossible de publier V658."
          exit 1
