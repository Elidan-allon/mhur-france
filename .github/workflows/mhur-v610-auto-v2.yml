name: MHUR V610.1 - Patch Notes PV sans image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v610-auto-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v610-1-patch-notes-pv-sans-image
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et verifier le correctif
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path("public/index.html")
          if not index.is_file():
              raise SystemExit("[ERREUR] public/index.html est introuvable.")

          js_path = Path("public/js/v610-patch-notes-health-no-image.js")
          css_path = Path("public/css/v610-patch-notes-health-no-image.css")
          js_path.parent.mkdir(parents=True, exist_ok=True)
          css_path.parent.mkdir(parents=True, exist_ok=True)

          js_path.write_text('/* MHUR Nexus - V610.1\n   Patch Notes : les changements PV / HP ne montrent aucune image de competence.\n*/\n(function(){\n  \'use strict\';\n\n  if (window.MHUR_V6101_HEALTH_NO_IMAGE) return;\n  window.MHUR_V6101_HEALTH_NO_IMAGE = true;\n\n  const CARD_SELECTOR = [\n    \'.s18PatchChangeV10\',\n    \'.s18PatchChangeV11\',\n    \'.s18PatchChangeV12\',\n    \'.s18PatchChangeV13\',\n    \'.s18PatchChangeV14\',\n    \'[class*="s18PatchChange"]\'\n  ].join(\',\');\n\n  function normalize(value){\n    return String(value || \'\')\n      .normalize(\'NFD\')\n      .replace(/[\\u0300-\\u036f]/g, \'\')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g, \'_\')\n      .replace(/^_+|_+$/g, \'\');\n  }\n\n  function isHealthText(value){\n    const key = normalize(value);\n    if (!key) return false;\n\n    const exact = new Set([\n      \'hp\', \'pv\', \'health\', \'sante\', \'hit_points\', \'points_de_vie\',\n      \'max_hp\', \'maximum_hp\', \'max_health\', \'maximum_health\',\n      \'pv_max\', \'pv_maximum\', \'sante_max\', \'sante_maximum\'\n    ]);\n\n    return exact.has(key) ||\n      key.includes(\'balance_changes_health\') ||\n      key.includes(\'balance_change_health\') ||\n      key.includes(\'equilibrage_pv\') ||\n      key.includes(\'equilibrage_sante\');\n  }\n\n  function cardIsHealth(card){\n    if (!card) return false;\n\n    const title = card.querySelector(\n      \'h5, [data-skill-name], [class*="PatchSkillTitle"], [class*="PatchLabel"]\'\n    )?.textContent || \'\';\n\n    const section = card.closest(\'[class*="s18PatchSection"]\');\n    const sectionTitle = section?.querySelector(\':scope > h3, :scope > h4\')?.textContent || \'\';\n\n    return isHealthText(title) || isHealthText(sectionTitle);\n  }\n\n  function removeHealthImage(card){\n    if (!cardIsHealth(card)) return;\n\n    card.dataset.v610HealthNoImage = \'1\';\n\n    const skillArea = card.querySelector(\'[class*="PatchSkill"]\');\n    if (!skillArea) return;\n\n    skillArea.classList.add(\'mhur-v610-health-no-image\');\n\n    skillArea.querySelectorAll(\n      \'[class*="PatchImage"], [class*="SkillImage"], img\'\n    ).forEach(node => {\n      const removable = node.closest(\'[class*="PatchImage"], [class*="SkillImage"]\') || node;\n      removable.remove();\n    });\n  }\n\n  function sanitizeData(){\n    const notes = window.MHUR_HOME_DATA?.patch_notes;\n    if (!Array.isArray(notes)) return;\n\n    notes.forEach(note => {\n      const sections = Array.isArray(note?.details) ? note.details : [];\n      sections.forEach(section => {\n        const healthSection = isHealthText(section?.title);\n        const changes = Array.isArray(section?.changes) ? section.changes : [];\n\n        changes.forEach(change => {\n          if (\n            healthSection ||\n            isHealthText(change?.skill_name) ||\n            isHealthText(change?.label)\n          ) {\n            change.skill_image = \'\';\n            change.mhur_no_skill_image = true;\n          }\n        });\n      });\n    });\n  }\n\n  function repair(root = document){\n    sanitizeData();\n    root.querySelectorAll(CARD_SELECTOR).forEach(removeHealthImage);\n  }\n\n  let scheduled = false;\n  function schedule(){\n    if (scheduled) return;\n    scheduled = true;\n    requestAnimationFrame(() => {\n      scheduled = false;\n      repair();\n    });\n  }\n\n  function start(){\n    repair();\n\n    const observer = new MutationObserver(schedule);\n    observer.observe(document.body, { childList: true, subtree: true });\n\n    document.addEventListener(\'click\', schedule, true);\n    window.addEventListener(\'mhur:languagechange\', schedule);\n    setTimeout(schedule, 50);\n    setTimeout(schedule, 250);\n  }\n\n  if (document.readyState === \'loading\') {\n    document.addEventListener(\'DOMContentLoaded\', start, { once: true });\n  } else {\n    start();\n  }\n})();\n', encoding="utf-8")
          css_path.write_text('/* MHUR Nexus - V610.1 : cartes PV / HP sans image */\n#s18NotesDevModalV10 [data-v610-health-no-image="1"] [class*="PatchImage"],\n#s18NotesDevModalV10 [data-v610-health-no-image="1"] [class*="SkillImage"],\n#s18NotesDevModalV10 [data-v610-health-no-image="1"] .mhur-v610-health-no-image > img {\n  display: none !important;\n}\n\n#s18NotesDevModalV10 [data-v610-health-no-image="1"] .mhur-v610-health-no-image {\n  display: block !important;\n  grid-template-columns: minmax(0, 1fr) !important;\n  width: 100% !important;\n  min-width: 0 !important;\n}\n\n#s18NotesDevModalV10 [data-v610-health-no-image="1"] .mhur-v610-health-no-image > main {\n  display: block !important;\n  grid-column: 1 / -1 !important;\n  width: 100% !important;\n  max-width: none !important;\n  min-width: 0 !important;\n  margin: 0 !important;\n}\n', encoding="utf-8")

          html = index.read_text(encoding="utf-8")
          html = re.sub(
              r'\s*<link[^>]+href=["\']css/v610-patch-notes-health-no-image\.css(?:\?[^"\']*)?["\'][^>]*>\s*',
              "\n",
              html,
              flags=re.I,
          )
          html = re.sub(
              r'\s*<script[^>]+src=["\']js/v610-patch-notes-health-no-image\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*',
              "\n",
              html,
              flags=re.I,
          )

          css_tag = '<link rel="stylesheet" href="css/v610-patch-notes-health-no-image.css?v=6101">\n'
          js_tag = '<script src="js/v610-patch-notes-health-no-image.js?v=6101"></script>\n'

          if "</head>" not in html or "</body>" not in html:
              raise SystemExit("[ERREUR] Balises </head> ou </body> introuvables.")

          html = html.replace("</head>", css_tag + "</head>", 1)
          html = html.replace("</body>", js_tag + "</body>", 1)
          index.write_text(html, encoding="utf-8")

          if html.count("css/v610-patch-notes-health-no-image.css?v=6101") != 1:
              raise SystemExit("[ERREUR] Reference CSS V610.1 absente ou dupliquee.")
          if html.count("js/v610-patch-notes-health-no-image.js?v=6101") != 1:
              raise SystemExit("[ERREUR] Reference JS V610.1 absente ou dupliquee.")

          print("[OK] Correctif V610.1 installe.")
          PY
          node --check public/js/v610-patch-notes-health-no-image.js

          echo "[OK] YAML, JavaScript et installation controles."
          git status --short

      - name: Enregistrer les changements
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add   public/index.html   public/js/v610-patch-notes-health-no-image.js   public/css/v610-patch-notes-health-no-image.css

          if git diff --cached --quiet; then
            echo "[INFO] Le correctif est deja applique."
            exit 0
          fi

          git commit -m "fix: masquer les images des changements PV dans les Patch Notes V610.1"
          git pull --rebase origin main
          git push origin HEAD:main
