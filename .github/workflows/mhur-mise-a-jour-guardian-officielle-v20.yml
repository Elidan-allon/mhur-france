name: MHUR - INSTALLATEUR CORRECTIFS NEXUS V20

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: install
        type: choice
        options:
          - install
          - verify

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: mhur-nexus-v20-installer
  cancel-in-progress: false

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'install'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configurer Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Appliquer les correctifs permanents V20
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          MARK = "MHUR_V20_LOGIN_DAMAGE_FIX"

          def read(path):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"[V20][ERREUR] Fichier introuvable : {path}")
              return p, p.read_text(encoding="utf-8")

          def save(p, text):
              p.write_text(text, encoding="utf-8", newline="\n")

          def replace_once(text, old, new, label, required=True):
              if new in text:
                  print(f"[V20][OK] {label} déjà présent")
                  return text
              if old not in text:
                  if required:
                      raise SystemExit(f"[V20][ERREUR] Bloc introuvable : {label}")
                  print(f"[V20][INFO] Bloc absent : {label}")
                  return text
              print(f"[V20][PATCH] {label}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # 1. Login Bonus : update_home_data.py
          # ------------------------------------------------------------
          p, t = read("mise_a_jour/outils/update_home_data.py")

          if MARK not in t:
              t = replace_once(
                  t,
                  "def download_asset(root: Path, url: str, rel_stem: str, retries: int = 4) -> str:\n",
                  "def download_asset(root: Path, url: str, rel_stem: str, retries: int = 4, force: bool = False) -> str:\n"
                  f"    # {MARK}: force=True remplace un ancien cache.\n",
                  "update_home_data : paramètre force",
              )

              t = replace_once(
                  t,
                  "    cached = existing_asset(root, rel_stem)\n"
                  "    if cached:\n"
                  "        return cached\n",
                  "    cached = existing_asset(root, rel_stem)\n"
                  "    if cached and not force:\n"
                  "        return cached\n",
                  "update_home_data : refresh forcé",
              )

              t = replace_once(
                  t,
                  '        print(f"[HOME IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  '        return ""\n',
                  '        print(f"[HOME IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  '        return cached or ""\n',
                  "update_home_data : cache seulement en secours",
              )

              old_call = (
                  "            local = download_asset(\n"
                  "                root,\n"
                  "                remote,\n"
                  '                f"assets/home/bonuses/{slug(title, 70)}",\n'
                  "            )\n"
              )
              new_call = (
                  "            local = download_asset(\n"
                  "                root,\n"
                  "                remote,\n"
                  '                f"assets/home/bonuses/{slug(title, 70)}",\n'
                  "                force=True,\n"
                  "            )\n"
              )
              t = replace_once(
                  t,
                  old_call,
                  new_call,
                  "Login Bonus : retélécharger la bonne image",
              )
              save(p, t)
          else:
              print("[V20][OK] update_home_data.py déjà corrigé")

          # ------------------------------------------------------------
          # 2. Login Bonus + nouveaux héros : season18_postprocess.py
          # ------------------------------------------------------------
          p, t = read("mise_a_jour/outils/season18_postprocess.py")

          if MARK not in t:
              t = replace_once(
                  t,
                  "def download_image(session: requests.Session, root: Path, url: str, rel_base: str) -> str:\n",
                  "def download_image(session: requests.Session, root: Path, url: str, rel_base: str, force: bool = False) -> str:\n"
                  f"    # {MARK}: refresh forcé des images Login Bonus.\n",
                  "season18 : paramètre force",
              )

              t = replace_once(
                  t,
                  '    if os.environ.get("MHUR_IMAGE_POLICY_V585") == "limited":\n',
                  '    if os.environ.get("MHUR_IMAGE_POLICY_V585") == "limited" and not force:\n',
                  "season18 : autoriser le refresh Login Bonus",
              )

              t = replace_once(
                  t,
                  "    if dst.exists() and dst.stat().st_size > 500:\n"
                  "        return rel.as_posix()\n",
                  "    cached_rel = rel.as_posix() if dst.exists() and dst.stat().st_size > 500 else \"\"\n"
                  "    if cached_rel and not force:\n"
                  "        return cached_rel\n",
                  "season18 : cache conditionnel",
              )

              t = replace_once(
                  t,
                  '        print(f"[S18 IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  '        return ""\n',
                  '        print(f"[S18 IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  '        return cached_rel\n',
                  "season18 : cache en secours réseau",
              )

              t = replace_once(
                  t,
                  '        local = download_image(session, root, src, f"assets/home/bonuses/s18_{norm(en)[:64]}")\n',
                  '        local = download_image(session, root, src, f"assets/home/bonuses/s18_{norm(en)[:64]}", force=True)\n',
                  "season18 : vraie image de chaque campagne",
              )

              helper = r'''
          # MHUR_V20_LOGIN_DAMAGE_FIX
          def _v20_additional_groups(table: dict[str, Any], lang: str) -> list[dict[str, Any]]:
              cleaned = clean_table(table or {}, lang)
              cols = list(cleaned.get("columns") or [])
              rows = [list(x) for x in (cleaned.get("rows") or [])]
              if not rows:
                  return []

              normalized = [norm(x) for x in cols]

              def idx(*names, default=-1):
                  wanted = {norm(x) for x in names}
                  for i, value in enumerate(normalized):
                      if value in wanted:
                          return i
                  return default

              ti = idx("Type", default=0)
              li = idx("Level", "Niveau", default=1)
              di = idx("Damage", "Dégâts", "Degats", default=2)
              if di < 0:
                  return []

              groups = []
              current = None
              last_type = "Value"

              for row in rows:
                  if li >= len(row) or di >= len(row):
                      continue
                  level = clean(row[li])
                  if not re.match(r"^Lv\.\d+$", level, re.I):
                      continue

                  raw_type = clean(row[ti]) if 0 <= ti < len(row) else ""
                  if raw_type and norm(raw_type) not in {"value", "valeur"}:
                      last_type = raw_type
                  raw_type = raw_type or last_type
                  key = norm(without_cjk(raw_type)) or "value"

                  restart = level.lower() == "lv.1" and current is not None and bool(current["rows"])
                  changed_type = current is not None and current["key"] != key

                  if current is None or restart or changed_type:
                      current = {
                          "key": key,
                          "label": without_cjk(raw_type) or ("Valeur" if lang == "fr" else "Value"),
                          "rows": [],
                      }
                      groups.append(current)

                  current["rows"].append([level, clean(row[di])])

              return groups


          def _v20_fr_type(label: str) -> str:
              n = norm(label)
              pairs = [
                  (("melee", "combat"), "Corps à corps"),
                  (("activation",), "Activation"),
                  (("shockwave",), "Onde de choc"),
                  (("bullet", "projectile"), "Projectile"),
                  (("rush",), "Ruée"),
                  (("rebound", "bounce"), "Rebond"),
                  (("impact",), "Impact"),
                  (("explosion",), "Explosion"),
                  (("charge",), "Charge"),
                  (("pull", "grab"), "Attraction"),
              ]
              for needles, translated in pairs:
                  if any(x in n for x in needles):
                      return translated
              return without_cjk(label) or "Valeur"


          def v20_bilingual_additional_tables(
              sym: str,
              fr_table: dict[str, Any],
              en_table: dict[str, Any],
              character_name: str = "",
          ) -> list[dict[str, Any]]:
              fr_groups = _v20_additional_groups(fr_table, "fr")
              en_groups = _v20_additional_groups(en_table, "en")
              count = max(len(fr_groups), len(en_groups))
              result = []

              for i in range(count):
                  fg = fr_groups[i] if i < len(fr_groups) else None
                  eg = en_groups[i] if i < len(en_groups) else None

                  en_label = (eg or fg or {}).get("label") or "Value"
                  fr_label = _v20_fr_type((fg or eg or {}).get("label") or en_label)

                  # Gentle gamma : trois cycles séparés même si la source répète Rush.
                  if "gentle" in norm(character_name) and sym == "γ" and count >= 3:
                      labels = [
                          ("Ruée", "Rush"),
                          ("Rebond", "Rebound"),
                          ("Impact", "Impact"),
                      ]
                      if i < len(labels):
                          fr_label, en_label = labels[i]

                  fr_rows_src = (fg or eg or {}).get("rows") or []
                  en_rows_src = (eg or fg or {}).get("rows") or []

                  fr_rows = [[fr_label, row[0], row[1]] for row in fr_rows_src]
                  en_rows = [[en_label, row[0], row[1]] for row in en_rows_src]

                  if not fr_rows and not en_rows:
                      continue

                  result.append({
                      "title": {
                          "fr": f"Dégâts {sym} — {fr_label}",
                          "en": f"{sym} Damage — {en_label}",
                      },
                      "cols": {
                          "fr": ["Type", "Niveau", "Dégâts"],
                          "en": ["Type", "Level", "Damage"],
                      },
                      "rows": {
                          "fr": fr_rows or en_rows,
                          "en": en_rows or fr_rows,
                      },
                  })
              return result

          '''
              anchor = "def role_description(role: str) -> tuple[str, str]:\n"
              if anchor not in t:
                  raise SystemExit("[V20][ERREUR] role_description introuvable")
              t = t.replace(anchor, helper + "\n" + anchor, 1)

              old = (
                  '        additional = bilingual_table(f"Valeurs supplémentaires {sym}", f"Additional {sym} values", add_fr, add_en)\n'
                  '        tables.extend(x for x in (level, base, additional) if x)\n'
              )
              new = (
                  '        additional_tables = v20_bilingual_additional_tables(\n'
                  '            sym,\n'
                  '            add_fr,\n'
                  '            add_en,\n'
                  '            row_en.get("base_name") or row_en.get("name") or "",\n'
                  '        )\n'
                  '        tables.extend(x for x in (level, base) if x)\n'
                  '        tables.extend(additional_tables)\n'
              )
              t = replace_once(
                  t,
                  old,
                  new,
                  "season18 : séparer les dégâts des nouveaux héros",
              )
              save(p, t)
          else:
              print("[V20][OK] season18_postprocess.py déjà corrigé")

          # ------------------------------------------------------------
          # 3. Générateur générique futurs héros
          # ------------------------------------------------------------
          p, t = read("mise_a_jour/outils/update_ultrarumble_data.py")

          if MARK not in t:
              anchor = (
                  "def local_table(title: str, table: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n"
                  "    if not isinstance(table, dict) or not table.get(\"rows\"):\n"
                  "        return None\n"
                  "    return {\"title\": title, \"cols\": table.get(\"columns\", []), \"rows\": table.get(\"rows\", [])}\n"
                  "\n"
              )

              helper = r'''
          # MHUR_V20_LOGIN_DAMAGE_FIX
          def v20_split_additional_tables(sym: str, table: Dict[str, Any]) -> List[Dict[str, Any]]:
              if not isinstance(table, dict):
                  return []
              cols = [clean(x) for x in (table.get("columns") or [])]
              rows = [list(x) for x in (table.get("rows") or []) if isinstance(x, (list, tuple))]
              if not rows:
                  return []

              normalized = [norm(x) for x in cols]

              def ci(*names, default=-1):
                  wanted = {norm(x) for x in names}
                  for i, value in enumerate(normalized):
                      if value in wanted:
                          return i
                  return default

              ti = ci("Type", default=0)
              li = ci("Level", "Niveau", default=1)
              di = ci("Damage", "Dégâts", "Degats", default=2)
              if di < 0:
                  return []

              groups = []
              current = None
              last_type = "Valeur"

              for row in rows:
                  if li >= len(row) or di >= len(row):
                      continue
                  level = clean(row[li])
                  if not re.match(r"^Lv\.\d+$", level, re.I):
                      continue

                  raw_type = clean(row[ti]) if 0 <= ti < len(row) else ""
                  if raw_type:
                      last_type = raw_type
                  raw_type = raw_type or last_type
                  key = norm(raw_type) or "value"

                  restart = level.lower() == "lv.1" and current is not None and bool(current["rows"])
                  changed_type = current is not None and current["key"] != key

                  if current is None or restart or changed_type:
                      current = {"key": key, "label": raw_type or "Valeur", "rows": []}
                      groups.append(current)

                  current["rows"].append([raw_type or "Valeur", level, clean(row[di])])

              totals = {}
              for group in groups:
                  totals[group["key"]] = totals.get(group["key"], 0) + 1

              seen = {}
              output = []
              for group in groups:
                  seen[group["key"]] = seen.get(group["key"], 0) + 1
                  label = group["label"]
                  if totals[group["key"]] > 1:
                      label = f"{label} ({seen[group['key']]})"

                  output.append({
                      "title": f"Dégâts {sym} — {label}",
                      "cols": ["Type", "Niveau", "Dégâts"],
                      "rows": [[label, row[1], row[2]] for row in group["rows"]],
                  })
              return output

          '''
              if anchor not in t:
                  raise SystemExit("[V20][ERREUR] local_table introuvable")
              t = t.replace(anchor, anchor + helper + "\n", 1)

              old = (
                  "        tables = []\n"
                  '        for title, key in ((f"Effets de montée {sym}", "level_up_effects"),\n'
                  '                           (f"Valeurs {sym}", "base_values"),\n'
                  '                           (f"Valeurs supplémentaires {sym}", "additional_values")):\n'
                  "            tb = local_table(title, remote.get(key) or {})\n"
                  "            if tb:\n"
                  "                tables.append(tb)\n"
              )
              new = (
                  "        tables = []\n"
                  '        for title, key in ((f"Effets de montée {sym}", "level_up_effects"),\n'
                  '                           (f"Valeurs {sym}", "base_values")):\n'
                  "            tb = local_table(title, remote.get(key) or {})\n"
                  "            if tb:\n"
                  "                tables.append(tb)\n"
                  '        tables.extend(v20_split_additional_tables(sym, remote.get("additional_values") or {}))\n'
              )
              t = replace_once(
                  t,
                  old,
                  new,
                  "update_ultrarumble_data : séparation automatique",
              )
              save(p, t)
          else:
              print("[V20][OK] update_ultrarumble_data.py déjà corrigé")

          # ------------------------------------------------------------
          # 4. Runtime ancien roster : Hawks + autres tables additionnelles
          # ------------------------------------------------------------
          p, t = read("public/index.html")

          old = (
              "    const dpi=findLocalCol(cols,['Down Power','Down'],-1);\n"
              "    const hasBaseColumns = ai>=0 || ui>=0 || ri>=0 || (!/—|-|Charge|Pull|Rush|Attraction/i.test(title) && di>=0);\n"
          )
          new = (
              "    const dpi=findLocalCol(cols,['Down Power','Down'],-1);\n"
              "    const ti=findLocalCol(cols,['Type'],-1);\n"
              "    // MHUR_V20_LOGIN_DAMAGE_FIX : Type/Niveau/Dégâts = table additionnelle.\n"
              "    const hasBaseColumns = ti<0 && (ai>=0 || ui>=0 || ri>=0 || (!/—|-|Charge|Pull|Rush|Attraction/i.test(title) && di>=0));\n"
          )
          t = replace_once(
              t,
              old,
              new,
              "index : distinguer base / additional",
          )

          old = (
              "    let m=null;\n"
              "    if((m=match(['charge','チャージ'])) && (t.includes('charge')||t.includes('chargee'))) return m;\n"
              "    if((m=match(['pull','attraction','grab','引き寄せ'])) && (t.includes('pull')||t.includes('grab')||t.includes('attraction'))) return m;\n"
              "    if((m=match(['rush','突進'])) && t.includes('rush')) return m;\n"
              "    if((m=match(['max range','strike','先端'])) && (t.includes('range')||t.includes('portee')||t.includes('strike'))) return m;\n"
          )
          new = (
              "    let m=null;\n"
              "    if((m=match(['melee combat','melee','格闘'])) && (t.includes('corps_a_corps')||t.includes('melee')||t.includes('combat'))) return m;\n"
              "    if((m=match(['activation','upon activation','始動','開始時'])) && t.includes('activation')) return m;\n"
              "    if((m=match(['shockwave','衝撃波','衝撃'])) && (t.includes('onde')||t.includes('choc')||t.includes('shockwave'))) return m;\n"
              "    if((m=match(['bullet','projectile','弾'])) && (t.includes('balle')||t.includes('bullet')||t.includes('projectile'))) return m;\n"
              "    if((m=match(['rebound','bounce','反動'])) && (t.includes('rebond')||t.includes('rebound')||t.includes('bounce'))) return m;\n"
              "    if((m=match(['charge','チャージ'])) && (t.includes('charge')||t.includes('chargee'))) return m;\n"
              "    if((m=match(['pull','attraction','grab','引き寄せ'])) && (t.includes('pull')||t.includes('grab')||t.includes('attraction'))) return m;\n"
              "    if((m=match(['rush','突進'])) && (t.includes('rush')||t.includes('ruee'))) return m;\n"
              "    if((m=match(['max range','strike','先端'])) && (t.includes('range')||t.includes('portee')||t.includes('strike'))) return m;\n"
          )
          t = replace_once(
              t,
              old,
              new,
              "index : Corps à corps = Melee Combat",
          )

          old = (
              "      balle:'bullet',\n"
              "      projectile:'bullet',\n"
              "      sueur:'sweat',\n"
          )
          new = (
              "      balle:'bullet',\n"
              "      projectile:'bullet',\n"
              "      corps:'melee',\n"
              "      combat:'melee',\n"
              "      activation:'activation',\n"
              "      ruee:'rush',\n"
              "      rebond:'rebound',\n"
              "      onde:'shockwave',\n"
              "      choc:'shockwave',\n"
              "      sueur:'sweat',\n"
          )
          t = replace_once(
              t,
              old,
              new,
              "index : alias français",
          )
          save(p, t)

          # ------------------------------------------------------------
          # 5. Guardian V19 : cron + ancien réparateur Login Bonus
          # ------------------------------------------------------------
          workflow = Path(".github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml")
          if not workflow.exists():
              raise SystemExit("[V20][ERREUR] Guardian V19 introuvable")

          wt = workflow.read_text(encoding="utf-8")

          if 'cron: "1 * * * *"' in wt:
              wt = wt.replace('cron: "1 * * * *"', 'cron: "11 * * * *"', 1)
              print("[V20][PATCH] cron Guardian 1 -> 11")

          old_repair = (
              "          python /tmp/repair_login_bonuses_v17.py \\\n"
              "            --site-root public\n"
          )
          new_repair = (
              "          python mise_a_jour/outils/season18_postprocess.py \\\n"
              "            --site-root public --phase home\n"
          )

          count = wt.count(old_repair)
          if count:
              wt = wt.replace(old_repair, new_repair)
              print(f"[V20][PATCH] {count} ancien(s) repair Login Bonus remplacé(s)")
          else:
              print("[V20][INFO] aucun ancien appel repair Login Bonus à remplacer")

          workflow.write_text(wt, encoding="utf-8", newline="\n")
          print("[V20][OK] Correctifs écrits.")
          PY

      - name: Vérifier les correctifs
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            mise_a_jour/outils/update_home_data.py \
            mise_a_jour/outils/season18_postprocess.py \
            mise_a_jour/outils/update_ultrarumble_data.py

          python - <<'PY'
          from pathlib import Path

          checks = [
              ("Home Login force", "force=True", "mise_a_jour/outils/update_home_data.py"),
              ("S18 Login force", "force=True", "mise_a_jour/outils/season18_postprocess.py"),
              ("Split futurs héros", "v20_split_additional_tables", "mise_a_jour/outils/update_ultrarumble_data.py"),
              ("Split bilingue", "v20_bilingual_additional_tables", "mise_a_jour/outils/season18_postprocess.py"),
              ("Hawks Melee", "melee combat", "public/index.html"),
              ("Cron 11", 'cron: "11 * * * *"', ".github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml"),
          ]

          failed = []
          for name, needle, filename in checks:
              text = Path(filename).read_text(encoding="utf-8")
              ok = needle in text
              print(("[OK] " if ok else "[ECHEC] ") + name)
              if not ok:
                  failed.append(name)

          if failed:
              raise SystemExit("[V20][ERREUR] " + ", ".join(failed))
          PY

      - name: Commit des correctifs sur main
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git add \
            mise_a_jour/outils/update_home_data.py \
            mise_a_jour/outils/season18_postprocess.py \
            mise_a_jour/outils/update_ultrarumble_data.py \
            public/index.html \
            .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[V20] Déjà installé."
            exit 0
          fi

          git commit -m "fix: V20 login bonus et degats UltraRumble"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Relancer le Guardian V19
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run \
            mhur-mise-a-jour-guardian-officielle-v19.yml \
            --ref main \
            -f mode=scan

          echo "✅ Guardian V19 relancé. Les données passent ensuite par la bêta Discord."

      - name: Discord - V20 installé
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          python - <<'PY' > /tmp/v20-ok.json
          import json
          print(json.dumps({
              "content": (
                  "✅ **MHUR NEXUS — V20 INSTALLÉ**\n\n"
                  "• Login Bonus : images rafraîchies depuis UltraRumble\n"
                  "• Hawks : Corps à corps relié à Melee Combat\n"
                  "• Gentle : dégâts supplémentaires séparés\n"
                  "• Futurs héros : séparation automatique des séries\n"
                  "• Guardian : ancien réparateur Login Bonus neutralisé\n\n"
                  "🔄 Le scan Guardian V19 vient d'être relancé."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/v20-ok.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null

      - name: Discord - diagnostic si erreur
        if: failure()
        shell: bash
        run: |
          set +e

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error::Correctif V20 bloqué : ${run_url}"

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          python - "$run_url" <<'PY' > /tmp/v20-error.json
          import json
          import sys
          url = sys.argv[1]
          print(json.dumps({
              "content": (
                  "❌ **MHUR NEXUS — V20 BLOQUÉ**\n\n"
                  "Une étape du correctif a échoué.\n"
                  "Le site n'est pas modifié partiellement : le workflow s'arrête.\n\n"
                  f"🔎 **Run GitHub :** {url}\n"
                  "Ouvre l'étape rouge. Le message `[V20][ERREUR]` indique exactement "
                  "le fichier ou le bloc qui pose problème."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/v20-error.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null || true

  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Vérifier V20
        shell: bash
        run: |
          set -euo pipefail

          grep -q "MHUR_V20_LOGIN_DAMAGE_FIX" mise_a_jour/outils/update_home_data.py
          grep -q "MHUR_V20_LOGIN_DAMAGE_FIX" mise_a_jour/outils/season18_postprocess.py
          grep -q "MHUR_V20_LOGIN_DAMAGE_FIX" mise_a_jour/outils/update_ultrarumble_data.py
          grep -qi "melee combat" public/index.html
          grep -q 'cron: "11 \* \* \* \*"' .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml

          echo "✅ V20 est installé."
