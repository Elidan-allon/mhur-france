name: MHUR V623 - Détails TUNING builds communautaires

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v623-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v623-community-tuning-details
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V623
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v623.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS = base64.b64decode("").decode("utf-8")
          JS = base64.b64decode("").decode("utf-8")
          
          index_path = Path("public/index.html")
          community_path = Path("public/js/community-builds.js")
          css_path = Path(
              "public/css/v623-community-build-tuning-details.css"
          )
          js_path = Path(
              "public/js/v623-community-build-tuning-details.js"
          )
          report_path = Path(
              "RAPPORT_V623_DETAILS_TUNING_BUILDS_COMMUNAUTAIRES.txt"
          )
          
          if not index_path.is_file():
              raise SystemExit(
                  "[ERREUR] public/index.html introuvable."
              )
          
          if not community_path.is_file():
              raise SystemExit(
                  "[ERREUR] public/js/community-builds.js introuvable."
              )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          community = community_path.read_text(
              encoding="utf-8"
          )
          
          # Supprime uniquement la limite des 80 résultats du créateur communautaire.
          community, count = re.subn(
              r'(compatibleTunings\(spec\.color,\s*spec\.kind,'
              r'\s*spec\.condition\)\s*'
              r'\.filter\(t=>cbTuningFamilyId\(t\)!==ownFamily\))'
              r'\s*\.slice\(0,\s*80\)',
              r'\1',
              community,
              count=1,
          )
          
          if count == 0 and re.search(
              r'cbBuilderPicker\(costume,spec\).*?'
              r'\.slice\(0,\s*80\)',
              community,
              flags=re.S,
          ):
              raise SystemExit(
                  "[ERREUR] Limite de 80 trouvée mais non corrigée."
              )
          
          community_path.write_text(
              community,
              encoding="utf-8"
          )
          
          html=index_path.read_text(encoding="utf-8")
          
          patterns=[
              r'\s*<!-- V623 : détails TUNING builds communautaires CSS\. -->\s*'
              r'<link[^>]+v623-community-build-tuning-details\.css[^>]*>\s*',
              r'\s*<link[^>]+v623-community-build-tuning-details\.css[^>]*>\s*',
              r'\s*<!-- V623 : détails TUNING builds communautaires JS\. -->\s*'
              r'<script[^>]+v623-community-build-tuning-details\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v623-community-build-tuning-details\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(pattern,"\n",html,flags=re.I)
          
          css_tag=(
              '<!-- V623 : détails TUNING builds communautaires CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v623-community-build-tuning-details.css?v=623">\n'
          )
          
          js_tag=(
              '<!-- V623 : détails TUNING builds communautaires JS. -->\n'
              '<script '
              'src="js/v623-community-build-tuning-details.js?v=623">'
              '</script>\n'
          )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          if not bodies:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          position=heads[-1].start()
          html=html[:position]+css_tag+html[position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          position=bodies[-1].start()
          html=html[:position]+js_tag+html[position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V623
          
          CRÉATEUR DE BUILDS COMMUNAUTAIRES — MOBILE
          - Description complète de chaque T.U.N.I.N.G.
          - Tous les effets affichés séparément.
          - Tous les niveaux et sous-effets affichés.
          - Nom du personnage, nom du T.U.N.I.N.G et faction non coupés.
          - Suppression de la limite artificielle de 80 résultats.
          
          NON MODIFIÉ
          - Aller-retour fluide déjà présent dans le créateur.
          - Builds publiés et détail des builds.
          - Costumes, fiches T.U.N.I.N.G et version ordinateur.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V623 appliqué.")
          PY
          
          cat > /tmp/verifier_v623.py <<'PY'
          from pathlib import Path
          import re
          
          html=Path("public/index.html").read_text(
              encoding="utf-8"
          )
          community=Path(
              "public/js/community-builds.js"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v623-community-build-tuning-details.js"
          ).read_text(encoding="utf-8")
          css=Path(
              "public/css/v623-community-build-tuning-details.css"
          ).read_text(encoding="utf-8")
          
          js_ref=(
              "js/v623-community-build-tuning-details.js?v=623"
          )
          css_ref=(
              "css/v623-community-build-tuning-details.css?v=623"
          )
          
          if html.count(js_ref)!=1:
              raise SystemExit(
                  "[ERREUR] Référence JS V623 absente ou dupliquée."
              )
          
          if html.count(css_ref)!=1:
              raise SystemExit(
                  "[ERREUR] Référence CSS V623 absente ou dupliquée."
              )
          
          builder_match=re.search(
              r'function cbBuilderPicker\\(costume,spec\\)'
              r'(.*?)(?=\\nfunction |\\nwindow\\.|\\Z)',
              community,
              flags=re.S,
          )
          
          if not builder_match:
              raise SystemExit(
                  "[ERREUR] cbBuilderPicker introuvable."
              )
          
          if ".slice(0,80)" in builder_match.group(1):
              raise SystemExit(
                  "[ERREUR] La limite de 80 existe encore."
              )
          
          for token in [
              "window.__cbTuningOptions",
              "effectsFor",
              "mhurV623CommunityDetails",
              "mhurV623CommunityLevels",
              "#cbBuilderModal",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] Élément JS manquant : {token}"
                  )
          
          for token in [
              ".mhurV623CommunityDetails",
              ".cbOfficialCreatorScreenV308",
              "max-height:none!important",
              "overflow:visible!important",
              "grid-template-areas",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] Élément CSS manquant : {token}"
                  )
          
          print("[OK] Contrôles V623 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v623.py
            node --check public/js/v623-community-build-tuning-details.js
            python3 /tmp/verifier_v623.py
          
            git add \
              public/index.html \
              public/js/community-builds.js \
              public/css/v623-community-build-tuning-details.css \
              public/js/v623-community-build-tuning-details.js \
              RAPPORT_V623_DETAILS_TUNING_BUILDS_COMMUNAUTAIRES.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V623 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: détails TUNING du créateur communautaire V623"
          
            if git push origin HEAD:main; then
              echo "[OK] V623 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V623 après cinq tentatives."
          exit 1
