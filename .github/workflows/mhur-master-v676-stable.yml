          node <<'NODE'
          const fs=require('fs');

          const html=fs.readFileSync(
            'public/index.html',
            'utf8'
          );

          const jsonMatch=html.match(
            /<script id="ultrarumble-exact-data"[^>]*>([\s\S]*?)<\/script>/
          );

          if(!jsonMatch){
            throw new Error(
              'Données exactes UltraRumble introuvables.'
            );
          }

          const exact=JSON.parse(jsonMatch[1]);
          const fullBullet=
            exact.exact_by_style?.fullbullet;

          if(!fullBullet){
            throw new Error(
              'Style Midoriya Full Bullet introuvable.'
            );
          }

          const statsStart=html.indexOf(
            '<script id="v253-robust-stats-patch">'
          );
          const statsEnd=html.indexOf(
            '</script>',
            statsStart
          );

          if(statsStart<0||statsEnd<0){
            throw new Error(
              'Script V253 introuvable.'
            );
          }

          const stats=html.slice(
            statsStart,
            statsEnd
          );

          const functionsStart=stats.indexOf(
            '  function norm(s){'
          );
          const functionsEnd=stats.indexOf(
            '\n  function pvFromStats(stats){',
            functionsStart
          );

          if(functionsStart<0||functionsEnd<0){
            throw new Error(
              'Fonctions V675 non extractibles.'
            );
          }

          eval(stats.slice(
            functionsStart,
            functionsEnd
          ));

          const levels=()=>Array.from(
            {length:9},
            (_,index)=>[`Lv.${index+1}`,'0']
          );

          const alphaBase={
            title:'Valeurs de base α',
            cols:[
              'Niveau',
              'Dégâts',
              'Munitions',
              'Consommation',
              'Recharge'
            ],
            rows:Array.from(
              {length:9},
              (_,index)=>[
                `Lv.${index+1}`,
                '0',
                'x0',
                'x0',
                '0s'
              ]
            )
          };

          const alphaAim={
            title:'Valeurs mode visée α',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };

          patchLocalTable(
            alphaBase,
            fullBullet.skills['α']
          );
          patchLocalTable(
            alphaAim,
            fullBullet.skills['α']
          );

          if(
            alphaBase.rows[0][1]!=='14'||
            alphaBase.rows[8][1]!=='22'
          ){
            throw new Error(
              'Alpha de base Full Bullet incorrect.'
            );
          }

          if(
            alphaAim.rows[0][1]!=='62'||
            alphaAim.rows[8][1]!=='78'
          ){
            throw new Error(
              'Mode visée Full Bullet incorrect ou dupliqué.'
            );
          }

          const betaGroups=remoteAdditionalGroups(
            fullBullet.skills['β']
          );

          const shortGroup=pickAdditionalGroup(
            betaGroups,
            'Distance courte β'
          );
          const mediumGroup=pickAdditionalGroup(
            betaGroups,
            'Distance moyenne β'
          );
          const largeGroup=pickAdditionalGroup(
            betaGroups,
            'Distance longue β'
          );

          if(shortGroup?.canonical!=='small'){
            throw new Error(
              'Distance courte non associée à Small.'
            );
          }

          if(mediumGroup?.canonical!=='medium'){
            throw new Error(
              'Distance moyenne non associée à Medium.'
            );
          }

          if(largeGroup?.canonical!=='large'){
            throw new Error(
              'Distance longue non associée à Large.'
            );
          }

          if(
            shortGroup.rows['Lv.1']?.damage!=='60'||
            shortGroup.rows['Lv.2']?.damage!=='65'
          ){
            throw new Error(
              'Cycle Small incomplet : la Lv.1 est perdue.'
            );
          }

          const shortTable={
            title:'Distance courte β',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };
          const mediumTable={
            title:'Distance moyenne β',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };
          const largeTable={
            title:'Distance longue β',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };

          patchLocalTable(
            shortTable,
            fullBullet.skills['β']
          );
          patchLocalTable(
            mediumTable,
            fullBullet.skills['β']
          );
          patchLocalTable(
            largeTable,
            fullBullet.skills['β']
          );

          if(
            shortTable.rows[0][1]!=='60'||
            mediumTable.rows[0][1]!=='140'||
            largeTable.rows[0][1]!=='140'
          ){
            throw new Error(
              'Les trois distances de Manchester Smash sont mal séparées.'
            );
          }

          const genericSkill={
            base_values:{
              rows:Array.from(
                {length:9},
                (_,index)=>[
                  `Lv.${index+1}`,
                  String(10+index),
                  String(80+index),
                  'x1',
                  '1s'
                ]
              )
            },
            additional_values:{
              rows:[
                ...Array.from(
                  {length:9},
                  (_,index)=>[
                    'Ground',
                    `Lv.${index+1}`,
                    String(80+index*2),
                    '100'
                  ]
                ),
                ...Array.from(
                  {length:9},
                  (_,index)=>[
                    'Air',
                    `Lv.${index+1}`,
                    String(40+index),
                    '60'
                  ]
                )
              ]
            }
          };

          const genericBase={
            title:'Valeurs de base α',
            cols:[
              'Niveau',
              'Dégâts',
              'Munitions',
              'Consommation',
              'Recharge'
            ],
            rows:Array.from(
              {length:9},
              (_,index)=>[
                `Lv.${index+1}`,
                '0',
                'x0',
                'x0',
                '0s'
              ]
            )
          };

          const genericGround={
            title:'Dégâts α au sol',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };

          const genericAir={
            title:'Dégâts α en l\'air',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };

          patchLocalTable(genericBase,genericSkill);
          patchLocalTable(genericGround,genericSkill);
          patchLocalTable(genericAir,genericSkill);

          if(
            genericBase.rows[0][1]!=='10'||
            genericGround.rows[0][1]!=='80'||
            genericAir.rows[0][1]!=='40'
          ){
            throw new Error(
              'Les variantes ground/air ne sont pas séparées globalement.'
            );
          }

          console.log(
            '[OK] Full Bullet α : base 14 et visée 62.'
          );
          console.log(
            '[OK] Manchester Smash : Small / Medium / Large séparés.'
          );
          console.log(
            '[OK] Ground / Air séparés pour tous les persos.'
          );
          console.log(
            '[OK] Les dégâts multiples ne réutilisent plus la première série.'
          );
          NODE

      - name: Publier Master V676
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage tous les fichiers créés, modifiés ou supprimés.
          # Contrairement à une liste de chemins, ceci ne plante pas
          # lorsqu'un ancien fichier V661/V662 a déjà disparu.
          git add -A -- public

          if git diff --cached --quiet; then
            echo "[OK] Master V676 est déjà appliqué."
            exit 0
          fi

          git commit -m             "fix: master V676 dégâts multiples globaux"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              echo "[OK] Master V676 publié sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Publication impossible."
          exit 1
