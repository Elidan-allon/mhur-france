        html = re.sub(
            r'\s*<!-- V612 : logique mobile finale\. -->\s*'
            r'<script\s+src=["\']js/v612-mobile-ui-fixes\.js(?:\?[^"\']*)?["\']'
            r'\s*></script>\s*',
            "\n",
            html,
            flags=re.I
        )
        html = re.sub(
            r'\s*<script\s+src=["\']js/v612-mobile-ui-fixes\.js(?:\?[^"\']*)?["\']'
            r'\s*></script>\s*',
            "\n",
            html,
            flags=re.I
        )

        css_tag = (
            '<!-- V612 : correctifs mobiles ciblés. -->\n'
            '<link rel="stylesheet" href="css/v612-mobile-ui-fixes.css?v=612">\n'
        )
        js_tag = (
            '<!-- V612 : logique mobile finale. -->\n'
            '<script src="js/v612-mobile-ui-fixes.js?v=612"></script>\n'
        )

        if "</head>" not in html:
            raise SystemExit("[ERREUR] Balise </head> introuvable.")
        if "</body>" not in html:
            raise SystemExit("[ERREUR] Balise </body> introuvable.")

        html = html.replace("</head>", css_tag + "</head>", 1)
        html = html.replace("</body>", js_tag + "</body>", 1)
        index_path.write_text(html, encoding="utf-8")

        report_path.write_text(
            """MHUR NEXUS — V612 — CORRECTIFS MOBILES

        CORRECTIONS
        - Le bouton Retour reste fixe juste sous le bas réel du header.
        - Les fenêtres Réseaux sociaux et Créateurs de contenu commencent sous le header.
        - Les Patch Notes et Dev Notes utilisent la même limite.
        - Le bouton Patch Notes / Dev Notes ferme la fenêtre lorsqu'elle est déjà ouverte.
        - Les photos de costumes et leurs icônes T.U.N.I.N.G sont légèrement remontées.
        - Les logos de rôle sont centrés avec les noms des rôles.

        PROTECTION
        - Les règles visuelles et le comportement de bascule sont limités aux écrans
          de 760 px ou moins.
        - Les pages ordinateur ne sont pas modifiées.
        - Aucun contenu, aucune image source et aucune donnée de jeu ne sont modifiés.
        """,
            encoding="utf-8"
        )

        print("[OK] V612 installé.")
        PY
    - name: Contrôler le correctif
      shell: bash
      run: |
        set -euo pipefail
        node --check public/js/v612-mobile-ui-fixes.js
        python3 <<'PY'
        from pathlib import Path

        html = Path("public/index.html").read_text(encoding="utf-8")
        js = Path("public/js/v612-mobile-ui-fixes.js").read_text(encoding="utf-8")
        css = Path("public/css/v612-mobile-ui-fixes.css").read_text(encoding="utf-8")

        js_ref = "js/v612-mobile-ui-fixes.js?v=612"
        css_ref = "css/v612-mobile-ui-fixes.css?v=612"

        if html.count(js_ref) != 1:
            raise SystemExit("[ERREUR] Référence JS V612 absente ou dupliquée.")
        if html.count(css_ref) != 1:
            raise SystemExit("[ERREUR] Référence CSS V612 absente ou dupliquée.")
        if html.index(css_ref) > html.index("</head>"):
            raise SystemExit("[ERREUR] Le CSS V612 doit être chargé avant </head>.")
        if html.index(js_ref) > html.index("</body>"):
            raise SystemExit("[ERREUR] Le JS V612 doit être chargé avant </body>.")

        required_js = [
            "MOBILE.matches",
            "measuredHeaderBottom",
            "toggleNotes",
            "stopImmediatePropagation",
            "--mhur-v612-header-bottom",
        ]
        required_css = [
            "position:fixed!important",
            ".nexusLinksOverlay.mhurV603NamedPanel",
            ".costumeTile > img",
            ".badge .roleIcon",
            "@media (max-width:760px)",
        ]

        for token in required_js:
            if token not in js:
                raise SystemExit(f"[ERREUR] Élément JS manquant : {token}")
        for token in required_css:
            if token not in css:
                raise SystemExit(f"[ERREUR] Élément CSS manquant : {token}")

        print("[OK] Contrôle V612 valide.")
        PY
        git status --short
    - name: Enregistrer automatiquement les changements
      shell: bash
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add \
          public/index.html \
          public/js/v612-mobile-ui-fixes.js \
          public/css/v612-mobile-ui-fixes.css \
          RAPPORT_V612_CORRECTIFS_MOBILES.txt

        if git diff --cached --quiet; then
          echo "[INFO] V612 est déjà appliqué. Aucun commit nécessaire."
          exit 0
        fi

        git commit -m "fix: corriger l interface mobile V612"

        for tentative in 1 2 3; do
          git pull --rebase origin main

          if git push origin HEAD:main; then
            echo "[OK] V612 envoyé sur main."
            exit 0
          fi

          echo "[ATTENTE] Nouvelle tentative de push : ${tentative}/3"
          sleep 3
        done

        echo "[ERREUR] Impossible d'envoyer le commit après trois tentatives."
        exit 1
