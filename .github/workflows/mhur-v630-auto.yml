name: MHUR V630 - Rendu atomique et cache images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v630-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v630-atomic-render
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V630
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v630.py <<'PY'
          from pathlib import Path
          import base64
          import html as html_lib
          import json
          import re
          
          CRITICAL=base64.b64decode("").decode("utf-8")
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          SW_TEMPLATE=base64.b64decode("").decode("utf-8")
          HEADERS_BLOCK=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          index_path=public/"index.html"
          css_path=public/"css"/"v630-atomic-render.css"
          js_path=public/"js"/"v630-atomic-render.js"
          index_data_path=public/"data"/"v630-image-index.js"
          sw_path=public/"sw-v630.js"
          headers_path=public/"_headers"
          report_path=root/"RAPPORT_V630_RENDU_ATOMIQUE.txt"
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          index_data_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          # ------------------------------------------------------------
          # 1. Index léger de toutes les images locales.
          #    Il permet de précharger les images correspondant à l'URL actuelle.
          # ------------------------------------------------------------
          
          extensions={".png",".jpg",".jpeg",".webp",".gif",".svg",".avif"}
          images=[]
          
          for path in public.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
          
              relative=path.relative_to(public).as_posix()
          
              if any(part.startswith(".") for part in path.parts):
                  continue
          
              try:
                  size=path.stat().st_size
              except OSError:
                  continue
          
              if size>6_000_000:
                  continue
          
              images.append((relative,size))
          
          def image_priority(item):
              relative,size=item
              value=relative.lower()
          
              if any(word in value for word in (
                  "portrait","character","style","card","costume"
              )):
                  category=0
              elif any(word in value for word in (
                  "logo","icon","badge","role"
              )):
                  category=1
              else:
                  category=2
          
              return (category,size,relative)
          
          images.sort(key=image_priority)
          image_paths=[relative for relative,_size in images[:5000]]
          
          index_data_path.write_text(
              "window.MHUR_V630_IMAGE_INDEX="
              +json.dumps(
                  image_paths,
                  ensure_ascii=False,
                  separators=(",",":")
              )
              +";\n",
              encoding="utf-8",
          )
          
          # ------------------------------------------------------------
          # 2. Service Worker : pré-cache des CSS/JS principaux.
          # ------------------------------------------------------------
          
          html=index_path.read_text(encoding="utf-8")
          
          asset_refs=[]
          
          for match in re.finditer(
              r'(?:src|href)=["\']([^"\']+)["\']',
              html,
              flags=re.I,
          ):
              raw=html_lib.unescape(match.group(1)).strip()
          
              if (
                  not raw or
                  raw.startswith(("http:","https:","//","data:","#","mailto:"))
              ):
                  continue
          
              clean=raw.split("?",1)[0].split("#",1)[0].lstrip("/")
          
              if not clean:
                  continue
          
              file_path=public/clean
          
              if (
                  file_path.is_file() and
                  file_path.suffix.lower() in {
                      ".css",".js",".json",".webmanifest"
                  }
              ):
                  asset_refs.append("/"+clean)
          
          asset_refs.extend([
              "/",
              "/index.html",
              "/css/v630-atomic-render.css",
              "/js/v630-atomic-render.js",
              "/data/v630-image-index.js",
          ])
          
          seen=set()
          precache=[]
          
          for ref in asset_refs:
              if ref in seen:
                  continue
              seen.add(ref)
              precache.append(ref)
          
          sw_path.write_text(
              SW_TEMPLATE.replace(
                  "__PRECACHE__",
                  json.dumps(
                      precache[:400],
                      ensure_ascii=False,
                      separators=(",",":")
                  )
              )
              +"\n",
              encoding="utf-8",
          )
          
          # ------------------------------------------------------------
          # 3. Cache HTTP indicatif pour les assets Cloudflare.
          # ------------------------------------------------------------
          
          existing_headers=(
              headers_path.read_text(encoding="utf-8")
              if headers_path.is_file()
              else ""
          )
          
          existing_headers=re.sub(
              r'\n?# MHUR V630 CACHE START.*?'
              r'# MHUR V630 CACHE END\n?',
              "\n",
              existing_headers,
              flags=re.S,
          ).strip()
          
          headers_path.write_text(
              (
                  existing_headers+"\n\n"
                  if existing_headers
                  else ""
              )
              +HEADERS_BLOCK
              +"\n",
              encoding="utf-8",
          )
          
          # ------------------------------------------------------------
          # 4. Installation de la garde avant le premier rendu.
          # ------------------------------------------------------------
          
          html=index_path.read_text(encoding="utf-8")
          
          # Retire toute ancienne installation V630.
          patterns=[
              r'\s*<script id=["\']mhur-v630-boot-start["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v630-boot-critical["\']>'
              r'.*?</style>\s*',
              r'\s*<!-- V630 : données images\. -->\s*'
              r'<script[^>]+v630-image-index\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v630-image-index\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<!-- V630 : rendu atomique CSS\. -->\s*'
              r'<link[^>]+v630-atomic-render\.css[^>]*>\s*',
              r'\s*<link[^>]+v630-atomic-render\.css[^>]*>\s*',
              r'\s*<!-- V630 : rendu atomique JS\. -->\s*'
              r'<script[^>]+v630-atomic-render\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v630-atomic-render\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(pattern,"\n",html,flags=re.I|re.S)
          
          # Les anciens moteurs qui masquent volontairement les images sont retirés.
          obsolete=[
              r'\s*<style id=["\']mhur-v622-costume-image-no-jump["\']>'
              r'.*?</style>\s*',
              r'\s*<!-- V622[^>]*-->\s*'
              r'<script[^>]+v622-costume-image-no-jump\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v622-costume-image-no-jump\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in obsolete:
              html=re.sub(pattern,"\n",html,flags=re.I|re.S)
          
          # Les meta no-store empêchaient le navigateur de réutiliser efficacement
          # le document lors des retours arrière.
          html=re.sub(
              r'\s*<meta\s+http-equiv=["\'](?:Cache-Control|Pragma|Expires)["\']'
              r'[^>]*>\s*',
              "\n",
              html,
              flags=re.I,
          )
          
          # La garde doit être placée tout au début du head.
          head_match=re.search(r'<head[^>]*>',html,flags=re.I)
          
          if not head_match:
              raise SystemExit("[ERREUR] Balise <head> introuvable.")
          
          critical_position=head_match.end()
          html=(
              html[:critical_position]
              +"\n"
              +CRITICAL
              +"\n"
              +html[critical_position:]
          )
          
          head_end=list(re.finditer(r'</head\s*>',html,flags=re.I))
          
          if not head_end:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          head_position=head_end[-1].start()
          
          head_assets=(
              '<!-- V630 : données images. -->\n'
              '<script defer src="data/v630-image-index.js?v=630"></script>\n'
              '<!-- V630 : rendu atomique CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v630-atomic-render.css?v=630">\n'
              '<!-- V630 : rendu atomique JS. -->\n'
              '<script defer src="js/v630-atomic-render.js?v=630"></script>\n'
          )
          
          html=html[:head_position]+head_assets+html[head_position:]
          
          # Les images écrites directement dans le HTML démarrent sans lazy loading.
          html=re.sub(
              r'<img\b([^>]*?)\sloading=["\']lazy["\']([^>]*)>',
              r'<img\1 loading="eager" decoding="async"\2>',
              html,
              flags=re.I,
          )
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V630
          
          PROBLÈME TRAITÉ
          L'interface était peinte avant le chargement de toutes les couches CSS et
          JavaScript placées tard dans le document. Le visiteur voyait donc pendant
          un instant une version brute et incomplète des pages.
          
          RENDU ATOMIQUE
          - Une garde critique s'active dès le début du <head>.
          - Aucun élément brut du site ne peut être peint.
          - Le rendu final, les polices, les images visibles et les fonds sont préparés.
          - L'interface complète est ensuite révélée en une seule fois.
          - Les changements de route qui remplacent directement #app utilisent la même
            protection afin d'éviter les rendus intermédiaires.
          
          IMAGES
          - Les images visibles passent en chargement eager et priorité élevée.
          - Les images liées au personnage présent dans l'URL sont préchargées.
          - Les anciennes attentes artificielles V622 sont neutralisées.
          - Un Service Worker garde les images, CSS, JS et polices en cache.
          - Après la première récupération, les ressources déjà vues peuvent être
            affichées immédiatement depuis le cache local.
          - Une toute première visite nécessite toujours un téléchargement physique :
            aucun navigateur ne peut afficher un fichier qu'il n'a jamais reçu.
          
          CACHE
          - Service Worker V630 avec stratégie cache + actualisation en arrière-plan.
          - Pré-cache des principaux CSS et JavaScript.
          - Préchargement après rendu des images utilisées sur la page.
          - Règles _headers pour Cloudflare.
          """,
              encoding="utf-8",
          )
          
          print(
              f"[OK] V630 appliqué : "
              f"{len(image_paths)} images indexées, "
              f"{len(precache[:400])} ressources pré-cachées."
          )
          PY
          
          cat > /tmp/verifier_v630.py <<'PY'
          from pathlib import Path
          import json
          import re
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          css=Path("public/css/v630-atomic-render.css").read_text(encoding="utf-8")
          js=Path("public/js/v630-atomic-render.js").read_text(encoding="utf-8")
          image_index=Path("public/data/v630-image-index.js").read_text(encoding="utf-8")
          sw=Path("public/sw-v630.js").read_text(encoding="utf-8")
          headers=Path("public/_headers").read_text(encoding="utf-8")
          
          for marker in [
              'id="mhur-v630-boot-start"',
              'id="mhur-v630-boot-critical"',
              'data/v630-image-index.js?v=630',
              'css/v630-atomic-render.css?v=630',
              'js/v630-atomic-render.js?v=630',
          ]:
              if index.count(marker)!=1:
                  raise SystemExit(
                      f"[ERREUR] Installation V630 absente ou dupliquée : {marker}"
                  )
          
          critical_pos=index.index('id="mhur-v630-boot-start"')
          title_pos=index.lower().find("<title")
          
          if title_pos!=-1 and critical_pos>title_pos:
              raise SystemExit(
                  "[ERREUR] La garde V630 est installée trop tard dans le head."
              )
          
          for token in [
              "mhurV630Booting",
              "prepareScope",
              "waitStyles",
              "visibleImages",
              "serviceWorker.register",
              "mhurV630RouteLoading",
          ]:
              if token not in js and token not in index:
                  raise SystemExit(
                      f"[ERREUR] Élément V630 manquant : {token}"
                  )
          
          for token in [
              "mhurV630Booting",
              "mhurV630RouteLoading",
          ]:
              if token not in index:
                  raise SystemExit(
                      f"[ERREUR] Style critique incomplet : {token}"
                  )
          
          if "window.MHUR_V630_IMAGE_INDEX=" not in image_index:
              raise SystemExit("[ERREUR] Index images V630 invalide.")
          
          payload=image_index.split("=",1)[1].strip().rstrip(";")
          images=json.loads(payload)
          
          if not isinstance(images,list):
              raise SystemExit("[ERREUR] Index images V630 non valide.")
          
          if "const PRECACHE=" not in sw:
              raise SystemExit("[ERREUR] Service Worker V630 invalide.")
          
          if "# MHUR V630 CACHE START" not in headers:
              raise SystemExit("[ERREUR] Règles cache V630 absentes.")
          
          if 'id="mhur-v622-costume-image-no-jump"' in index:
              raise SystemExit(
                  "[ERREUR] L'ancien masque V622 est encore présent."
              )
          
          print(
              f"[OK] Contrôles V630 validés avec {len(images)} images."
          )
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v630.py
          
            node --check public/js/v630-atomic-render.js
            node --check public/sw-v630.js
          
            python3 /tmp/verifier_v630.py
          
            git add     public/index.html     public/css/v630-atomic-render.css     public/js/v630-atomic-render.js     public/data/v630-image-index.js     public/sw-v630.js     public/_headers     RAPPORT_V630_RENDU_ATOMIQUE.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V630 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "perf: rendu atomique et cache images V630"
          
            if git push origin HEAD:main; then
              echo "[OK] V630 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V630 après cinq tentatives."
          exit 1
