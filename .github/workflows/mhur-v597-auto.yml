name: MHUR V597 - layout Patch Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v597-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v597-patch-layout
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer V597
        shell: bash
        run: |
          cat > /tmp/appliquer_v597.py <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          index = root / "public/index.html"
          css = root / "public/css/v597-patch-layout.css"
          report = root / "RAPPORT_V597_PATCH_LAYOUT.txt"
          CSS_CONTENT = '\n/* MHUR Nexus — V597 : Patch Notes layout */\n\n#s18NotesDevModalV10 .s18PatchCharacterV10 > header{\n  display:grid!important;\n  grid-template-columns:118px minmax(0,1fr)!important;\n  align-items:center!important;\n  gap:18px!important;\n  width:100%!important;\n  min-width:0!important;\n  box-sizing:border-box!important;\n}\n\n#s18NotesDevModalV10 .s18PatchCharacterV10 > header > div:last-child{\n  min-width:0!important;\n  width:100%!important;\n}\n\n#s18NotesDevModalV10 .s18PatchCharacterV10 > header h4,\n#s18NotesDevModalV10 .s18PatchCharacterV10 > header strong{\n  display:block!important;\n  max-width:100%!important;\n  margin-left:0!important;\n  overflow:visible!important;\n  word-break:break-word!important;\n}\n\n#s18NotesDevModalV10 .s18PatchPortraitV10{\n  width:118px!important;\n  min-width:118px!important;\n  height:118px!important;\n  min-height:118px!important;\n  margin:0!important;\n}\n\n#s18NotesDevModalV10 .s18PatchPortraitV10 img{\n  width:100%!important;\n  height:100%!important;\n  object-fit:contain!important;\n}\n\n#s18NotesDevModalV10 .s18PatchSkillV10{\n  display:grid!important;\n  grid-template-columns:96px minmax(0,1fr)!important;\n  align-items:start!important;\n  gap:14px!important;\n  width:100%!important;\n  min-width:0!important;\n}\n\n#s18NotesDevModalV10 .s18PatchSkillV10 > main{\n  grid-column:2!important;\n  min-width:0!important;\n  width:100%!important;\n}\n\n#s18NotesDevModalV10 .s18PatchSkillImageV595,\n#s18NotesDevModalV10 .s18PatchSkillV10 > div:not(.s18PatchTableWrapV10){\n  grid-column:1!important;\n  width:96px!important;\n  min-width:96px!important;\n  height:96px!important;\n  min-height:96px!important;\n  margin:0!important;\n}\n\n#s18NotesDevModalV10 .s18PatchSkillImageV595 img,\n#s18NotesDevModalV10 .s18PatchSkillV10 > div:not(.s18PatchTableWrapV10) img{\n  width:100%!important;\n  height:100%!important;\n  object-fit:contain!important;\n}\n\n#s18NotesDevModalV10 .s18PatchTableWrapV10{\n  width:100%!important;\n  min-width:0!important;\n  max-width:100%!important;\n  overflow-x:visible!important;\n  overflow-y:hidden!important;\n  padding-bottom:0!important;\n}\n\n#s18NotesDevModalV10 .s18PatchTableV10{\n  width:100%!important;\n  min-width:0!important;\n  max-width:100%!important;\n  table-layout:fixed!important;\n  border-collapse:collapse!important;\n}\n\n#s18NotesDevModalV10 .s18PatchTableV10 th,\n#s18NotesDevModalV10 .s18PatchTableV10 td{\n  min-width:0!important;\n  width:auto!important;\n  padding:10px 6px!important;\n  text-align:center!important;\n  white-space:nowrap!important;\n  font-size:clamp(12px,1.15vw,18px)!important;\n}\n\n#s18NotesDevModalV10 .s18PatchTableV10 th:first-child,\n#s18NotesDevModalV10 .s18PatchTableV10 td:first-child{\n  width:104px!important;\n  min-width:104px!important;\n}\n\n@media (max-width: 980px){\n  #s18NotesDevModalV10 .s18PatchCharacterV10 > header{\n    grid-template-columns:104px minmax(0,1fr)!important;\n    gap:14px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchPortraitV10{\n    width:104px!important;\n    min-width:104px!important;\n    height:104px!important;\n    min-height:104px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchSkillV10{\n    grid-template-columns:84px minmax(0,1fr)!important;\n    gap:12px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchSkillImageV595,\n  #s18NotesDevModalV10 .s18PatchSkillV10 > div:not(.s18PatchTableWrapV10){\n    width:84px!important;\n    min-width:84px!important;\n    height:84px!important;\n    min-height:84px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchTableWrapV10{\n    overflow-x:auto!important;\n    padding-bottom:8px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchTableV10{\n    min-width:720px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchTableV10 th,\n  #s18NotesDevModalV10 .s18PatchTableV10 td{\n    font-size:14px!important;\n    padding:9px 6px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchTableV10 th:first-child,\n  #s18NotesDevModalV10 .s18PatchTableV10 td:first-child{\n    width:96px!important;\n    min-width:96px!important;\n  }\n}\n\n@media (max-width: 560px){\n  #s18NotesDevModalV10 .s18PatchCharacterV10 > header,\n  #s18NotesDevModalV10 .s18PatchSkillV10{\n    grid-template-columns:minmax(0,1fr)!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchSkillV10 > main{\n    grid-column:1!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchPortraitV10,\n  #s18NotesDevModalV10 .s18PatchSkillImageV595,\n  #s18NotesDevModalV10 .s18PatchSkillV10 > div:not(.s18PatchTableWrapV10){\n    width:96px!important;\n    min-width:96px!important;\n    height:96px!important;\n    min-height:96px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchTableWrapV10{\n    overflow-x:auto!important;\n    padding-bottom:8px!important;\n  }\n\n  #s18NotesDevModalV10 .s18PatchTableV10{\n    min-width:680px!important;\n  }\n}\n'

          if not index.is_file():
              raise SystemExit("[ERREUR] public/index.html est introuvable.")

          css.parent.mkdir(parents=True, exist_ok=True)
          css.write_text(CSS_CONTENT.strip() + "\n", encoding="utf-8")

          html = index.read_text(encoding="utf-8-sig")
          html = re.sub(r'\s*<link\b[^>]*href=["\'][^"\']*v597-patch-layout\.css[^"\']*["\'][^>]*>\s*', "\n", html, flags=re.I)

          if "</head>" not in html:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")

          html = html.replace("</head>", "\n<link rel=\"stylesheet\" href=\"css/v597-patch-layout.css?v=597\">\n</head>", 1)
          index.write_text(html, encoding="utf-8")

          lines = [
              "MHUR FRANCE — RAPPORT V597",
              "",
              "CORRECTIONS PATCH NOTES",
              "- Les portraits n’empiètent plus sur le nom du personnage.",
              "- La colonne image des skills est plus compacte.",
              "- Les tableaux prennent toute la largeur disponible sur desktop.",
              "- La mini barre de défilement horizontale disparaît sur desktop.",
              "- Sur mobile, le défilement horizontal reste autorisé pour éviter de casser les tableaux.",
          ]
          report.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("[OK] V597 appliqué.")
          PY
          python /tmp/appliquer_v597.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/css/v597-patch-layout.css RAPPORT_V597_PATCH_LAYOUT.txt
          if git diff --cached --quiet; then
            echo "V597 est deja installe."
            exit 0
          fi
          git commit -m "Ajuster layout des Patch Notes V597"
          git push
