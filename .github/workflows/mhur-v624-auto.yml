name: MHUR V624 - Tier list NEW mobile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v624-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v624-tierlist-new-mobile
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V624
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v624.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS = base64.b64decode("").decode("utf-8")
          JS = base64.b64decode("").decode("utf-8")
          
          index_path = Path("public/index.html")
          css_path = Path("public/css/v624-tierlist-new-fix.css")
          js_path = Path("public/js/v624-tierlist-new-fix.js")
          report_path = Path("RAPPORT_V624_TIERLIST_NEW_FIX.txt")
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          css_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.parent.mkdir(parents=True, exist_ok=True)
          
          css_path.write_text(CSS + "\n", encoding="utf-8")
          js_path.write_text(JS + "\n", encoding="utf-8")
          
          html = index_path.read_text(encoding="utf-8")
          
          patterns = [
              r'\s*<!-- V624 : tier list badge NEW CSS\. -->\s*'
              r'<link[^>]+v624-tierlist-new-fix\.css[^>]*>\s*',
              r'\s*<link[^>]+v624-tierlist-new-fix\.css[^>]*>\s*',
              r'\s*<!-- V624 : tier list badge NEW JS\. -->\s*'
              r'<script[^>]+v624-tierlist-new-fix\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v624-tierlist-new-fix\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html = re.sub(pattern, "\n", html, flags=re.I)
          
          css_tag = (
              '<!-- V624 : tier list badge NEW CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v624-tierlist-new-fix.css?v=624">\n'
          )
          
          js_tag = (
              '<!-- V624 : tier list badge NEW JS. -->\n'
              '<script src="js/v624-tierlist-new-fix.js?v=624"></script>\n'
          )
          
          head_matches = list(re.finditer(r'</head\s*>', html, flags=re.I))
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          
          if not head_matches:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          if not body_matches:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          head_pos = head_matches[-1].start()
          html = html[:head_pos] + css_tag + html[head_pos:]
          
          body_matches = list(re.finditer(r'</body\s*>', html, flags=re.I))
          body_pos = body_matches[-1].start()
          html = html[:body_pos] + js_tag + html[body_pos:]
          
          index_path.write_text(html, encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V624
          
          CORRECTION UNIQUE : TIER LIST MOBILE
          - Le badge NEW! est déplacé en haut à gauche.
          - Le badge NEW! est plus petit que les autres NEW.
          - L'animation du badge NEW! est conservée.
          - Le nom du personnage et le style sont un peu espacés.
          
          NON MODIFIÉ
          - Aucune autre page.
          - Aucune autre carte.
          - Aucune donnée.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V624 appliqué.")
          PY
          
          cat > /tmp/verifier_v624.py <<'PY'
          from pathlib import Path
          
          html = Path("public/index.html").read_text(encoding="utf-8")
          css = Path("public/css/v624-tierlist-new-fix.css").read_text(encoding="utf-8")
          js = Path("public/js/v624-tierlist-new-fix.js").read_text(encoding="utf-8")
          
          if html.count("css/v624-tierlist-new-fix.css?v=624") != 1:
              raise SystemExit("[ERREUR] Référence CSS V624 absente ou dupliquée.")
          
          if html.count("js/v624-tierlist-new-fix.js?v=624") != 1:
              raise SystemExit("[ERREUR] Référence JS V624 absente ou dupliquée.")
          
          for token in [
              ".mhurV624TierNew",
              ".mhurV624TierStyle",
              "@keyframes mhurV624TierNewFloat",
          ]:
              if token not in css:
                  raise SystemExit(f"[ERREUR] Élément CSS manquant : {token}")
          
          for token in [
              "matchesNewText",
              "nearestCardFromBadge",
              "groupText",
              "mhurV624TierNew",
          ]:
              if token not in js:
                  raise SystemExit(f"[ERREUR] Élément JS manquant : {token}")
          
          print("[OK] Contrôles V624 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v624.py
            node --check public/js/v624-tierlist-new-fix.js
            python3 /tmp/verifier_v624.py
          
            git add \
              public/index.html \
              public/css/v624-tierlist-new-fix.css \
              public/js/v624-tierlist-new-fix.js \
              RAPPORT_V624_TIERLIST_NEW_FIX.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V624 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: tier list mobile new badge V624"
          
            if git push origin HEAD:main; then
              echo "[OK] V624 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V624 après cinq tentatives."
          exit 1
