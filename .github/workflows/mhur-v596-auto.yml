name: MHUR V596 - traduction TUNING et fleche Mods

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v596-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v596-tuning-arrow
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Installer V596
        shell: bash
        run: |
          cat > /tmp/appliquer_v596.py <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          ROOT = Path.cwd()
          INDEX = ROOT / "public/index.html"
          V594 = ROOT / "public/js/v594-translations-tier-patch-arrow.js"
          JS_FILE = ROOT / "public/js/v596-tuning-mods.js"
          CSS_FILE = ROOT / "public/css/v596-tuning-mods.css"
          REPORT = ROOT / "RAPPORT_V596_TUNING_FLECHE.txt"

          HELPERS = "\n/* === V596 : traduction T.U.N.I.N.G. sans mutation des données === */\nconst MHUR_TUNING_EXACT_V596={\n  \"Analyse du champ de bataille\":\"Battlefield Analysis\",\n  \"Analyse du champ de baSize\":\"Battlefield Analysis\",\n  \"Analyse du Champ de paSize\":\"Battlefield Analysis\",\n  \"Détecteur de Kota\":\"Kota Detector\",\n  \"Accélération\":\"Acceleration\",\n  \"Charge PU destructeur\":\"Destructive PU Charge\",\n  \"PU Turbo\":\"PU Turbo\",\n  \"Massacre de masse\":\"Mass KO\",\n  \"Récupération rapide de PV\":\"Fast HP Recovery\",\n  \"Récupération rapide de PG\":\"Fast GP Recovery\",\n  \"Attaque vengeresse\":\"Vengeful Attack\",\n  \"Technique vengeresse\":\"Vengeful Technique\",\n  \"Fragilisation\":\"Weakening\",\n  \"Faculté de régénération extrême\":\"Extreme Regeneration\",\n  \"Bonus de rechargement spécial\":\"Special Reload Bonus\",\n  \"Annihilation\":\"Annihilation\",\n  \"Auto-réanimation rapide\":\"Fast Self-Revival\",\n  \"Sangsue à PV\":\"HP Leech\",\n  \"Sangsue à PG\":\"GP Leech\",\n  \"Puissance de feu PU sup.\":\"Enhanced PU Firepower\",\n  \"Combustion totale\":\"Full Combustion\",\n  \"Pseudo-perméabilité\":\"Pseudo-Permeation\",\n  \"Persévérance\":\"Perseverance\",\n  \"Ailes de jais\":\"Jet-Black Wings\",\n  \"Symbole de la Paix\":\"Symbol of Peace\",\n  \"Apparence malabar\":\"Muscle Form\",\n\n  \"Affiche la position de la prochaine zone de sécurité.\":\"Shows the location of the next safe zone.\",\n  \"Augmente la durée des effets à chaque niveau gagné.\":\"Increases effect duration with each level gained.\",\n  \"Augmente les PG max\":\"Increases max GP\",\n  \"Augmente les PV max\":\"Increases max HP\",\n  \"Réduit les dégâts subis (PV)\":\"Reduces HP damage taken\",\n  \"Réduit les dégâts subis (PG)\":\"Reduces GP damage taken\",\n  \"Augmente les PV en état critique\":\"Increases max HP while in Critical State\",\n  \"Augmente la hauteur du saut vertical\":\"Increases vertical jump height\",\n  \"Augmente la hauteur du saut sur les murs\":\"Increases wall jump height\",\n  \"Augmente la vitesse de course\":\"Increases running speed\",\n  \"Augmente la vitesse du sprint\":\"Increases sprint speed\",\n  \"Augmente les dégâts infligés par les attaques au corps à corps\":\"Increases melee attack damage\",\n  \"Réduit les dégâts subis par les attaques au corps à corps\":\"Reduces damage taken from melee attacks\",\n  \"Augmente la quantité régénérée à chaque niveau gagné.\":\"Increases the recovered amount with each level gained.\",\n  \"Augmente la quantité accumulée à chaque niveau gagné.\":\"Increases the amount gained with each level.\",\n  \"Diminue le délai d'activation à chaque niveau gagné.\":\"Reduces the activation delay with each level gained.\",\n  \"Le délai nécessaire pour activer à nouveau une compétence diminue à chaque niveau gagné.\":\"Reduces the time required before the skill can activate again with each level gained.\"\n};\n\nfunction mhurTuningRepairFrenchV596(value){\n  return String(value??\"\")\n    .replace(/Analyse du champ de baSize/gi,\"Analyse du champ de bataille\")\n    .replace(/Analyse du Champ de paSize/gi,\"Analyse du champ de bataille\");\n}\n\nfunction mhurTuningSegmentV596(value){\n  let text=mhurTuningRepairFrenchV596(value).trim();\n\n  if(!text)return text;\n  if(MHUR_TUNING_EXACT_V596[text])return MHUR_TUNING_EXACT_V596[text];\n\n  const replacements=[\n    [/Puissance d['’]attaque de l['’]Alter\\s*α/gi,\"Quirk Skill α Attack Power\"],\n    [/Puissance d['’]attaque de l['’]Alter\\s*β/gi,\"Quirk Skill β Attack Power\"],\n    [/Puissance d['’]attaque de l['’]Alter\\s*γ/gi,\"Quirk Skill γ Attack Power\"],\n    [/Défense de l['’]Alter\\s*α/gi,\"Quirk Skill α Defense\"],\n    [/Défense de l['’]Alter\\s*β/gi,\"Quirk Skill β Defense\"],\n    [/Défense de l['’]Alter\\s*γ/gi,\"Quirk Skill γ Defense\"],\n    [/Rechargement de l['’]Alter\\s*α/gi,\"Quirk Skill α Reload Speed\"],\n    [/Rechargement de l['’]Alter\\s*β/gi,\"Quirk Skill β Reload Speed\"],\n    [/Rechargement de l['’]Alter\\s*γ/gi,\"Quirk Skill γ Reload Speed\"],\n\n    [/Défense\\/Attaque corps à corps/gi,\"Melee Attack Defense\"],\n    [/Défense\\/Strike Melee/gi,\"Melee Strike Defense\"],\n    [/Puissance d['’]attaque au corps à corps/gi,\"Melee Attack Power\"],\n    [/Défense au corps à corps/gi,\"Melee Defense\"],\n\n    [/\\bPV Max en état critique\\b/gi,\"Max HP while Critical\"],\n    [/\\bPV Max\\b/gi,\"Max HP\"],\n    [/\\bPG Max\\b/gi,\"Max GP\"],\n    [/\\bDéfense PV\\b/gi,\"HP Defense\"],\n    [/\\bDéfense PG\\b/gi,\"GP Defense\"],\n    [/\\bAttaque PV\\b/gi,\"HP Attack\"],\n    [/\\bAttaque PG\\b/gi,\"GP Attack\"],\n\n    [/\\bHauteur saut vertical\\b/gi,\"Vertical Jump Height\"],\n    [/\\bHauteur saut sur les murs\\b/gi,\"Wall Jump Height\"],\n    [/\\bHauteur saut en avant\\b/gi,\"Forward Jump Height\"],\n    [/\\bVitesse de course\\b/gi,\"Running Speed\"],\n    [/\\bVitesse du sprint\\b/gi,\"Sprint Speed\"],\n    [/\\bRapid du sprint\\b/gi,\"Sprint Speed\"],\n    [/\\bVitesse de déplacement en état critique\\b/gi,\"Movement Speed while Critical\"],\n\n    [/Augmente les dégâts infligés par l['’]Alter\\s*α/gi,\"Increases damage dealt by Quirk Skill α\"],\n    [/Augmente les dégâts infligés par l['’]Alter\\s*β/gi,\"Increases damage dealt by Quirk Skill β\"],\n    [/Augmente les dégâts infligés par l['’]Alter\\s*γ/gi,\"Increases damage dealt by Quirk Skill γ\"],\n    [/Réduit les dégâts subis par l['’]Alter\\s*α/gi,\"Reduces damage taken from Quirk Skill α\"],\n    [/Réduit les dégâts subis par l['’]Alter\\s*β/gi,\"Reduces damage taken from Quirk Skill β\"],\n    [/Réduit les dégâts subis par l['’]Alter\\s*γ/gi,\"Reduces damage taken from Quirk Skill γ\"],\n    [/Augmente la vitesse de rechargement de l['’]Alter\\s*α/gi,\"Increases Quirk Skill α reload speed\"],\n    [/Augmente la vitesse de rechargement de l['’]Alter\\s*β/gi,\"Increases Quirk Skill β reload speed\"],\n    [/Augmente la vitesse de rechargement de l['’]Alter\\s*γ/gi,\"Increases Quirk Skill γ reload speed\"],\n\n    [/Récupère des PV/gi,\"Recovers HP\"],\n    [/Récupère des PG/gi,\"Recovers GP\"],\n    [/Permet de récupérer des PV/gi,\"Recovers HP\"],\n    [/Permet de récupérer des PG/gi,\"Recovers GP\"],\n    [/Augmente la jauge de PU\\/PC/gi,\"Increases the PU/PC gauge\"],\n    [/Remplit la jauge de PU\\/PC/gi,\"Fills the PU/PC gauge\"],\n    [/au début de la bataille/gi,\"at the start of the battle\"],\n    [/lorsqu['’]un ennemi est mis K\\.O\\./gi,\"when an enemy is K.O.'d\"],\n    [/lorsqu['’]un ennemi est mis au sol/gi,\"when an enemy is downed\"],\n    [/pendant une durée limitée/gi,\"for a limited time\"],\n\n    /*\n      Les remplacements de mots utilisent des limites de mot.\n      \"Taille\" ne peut donc plus modifier le mot \"bataille\".\n    */\n    [/\\bTaille\\b/gi,\"Size\"],\n    [/\\bPortée\\b/gi,\"Range\"],\n    [/\\bDurée\\b/gi,\"Duration\"],\n    [/\\bVitesse\\b/gi,\"Speed\"],\n    [/\\bRecharge\\b/gi,\"Reload\"],\n    [/\\bDégâts\\b/gi,\"Damage\"],\n    [/\\bDéfense\\b/gi,\"Defense\"],\n    [/\\bAttaque\\b/gi,\"Attack\"]\n  ];\n\n  for(const [pattern,replacement] of replacements){\n    text=text.replace(pattern,replacement);\n  }\n\n  return text;\n}\n\nfunction mhurTuningTextV596(value){\n  let selected=value;\n\n  if(value&&typeof value===\"object\"&&!Array.isArray(value)){\n    const current=(typeof lang!==\"undefined\"&&lang===\"en\")?\"en\":\"fr\";\n    selected=value[current]??value.fr??value.en??\"\";\n  }\n\n  const source=mhurTuningRepairFrenchV596(selected);\n\n  if(typeof lang===\"undefined\"||lang!==\"en\"){\n    return source;\n  }\n\n  return source\n    .split(/(<[^>]+>)/g)\n    .map(part=>part.startsWith(\"<\")?part:mhurTuningSegmentV596(part))\n    .join(\"\");\n}\n\nfunction mhurTuningUiV596(fr,en){\n  return (typeof lang!==\"undefined\"&&lang===\"en\")?en:fr;\n}\n"
          TUNING_FUNCTION = "\nfunction tuningDetail(s){\n  const ch=characters.find(x=>x.styles.includes(s))||{\n    name:mhurTuningUiV596(\"Personnage\",\"Character\")\n  };\n\n  const list=tunings[s]||[];\n\n  return `<button class=\"back\" onclick=\"selectedStyle=null;if((characters.find(x=>x.id===selectedChar)||{}).styles?.length===1)selectedChar=null;render()\">← ${tr('back')}</button>\n    <h1 class=\"title\">T.U.N.I.N.G — ${ch.name}</h1>\n    ${\n      list.length\n        ?list.map(tu=>{\n          const special=tu.type==='SP';\n\n          const title=special\n            ?mhurTuningUiV596(\n              'Compétence T.U.N.I.N.G SP',\n              'Special T.U.N.I.N.G Skill'\n            )\n            :mhurTuningUiV596(\n              'Compétence T.U.N.I.N.G',\n              'T.U.N.I.N.G Skill'\n            );\n\n          const tuningName=mhurTuningTextV596(tu.name);\n          const crystalTitle=mhurTuningUiV596(\n            `Éclat de souvenir de ${ch.name}`,\n            `${ch.name} Memory Crystal`\n          );\n\n          const levelHtml=tu.levels\n            ?`<div class=\"chips tuningLevels\">${\n              tu.levels.map(level=>\n                `<span class=\"chip ${\n                  String(level).startsWith('Sub Effect')\n                    ?'subChip'\n                    :''\n                }\">${level}</span>`\n              ).join('')\n            }</div>`\n            :'';\n\n          const normalHtml=tu.effects\n            ?`<div class=\"tuningText\">${\n              tu.effects.map(effect=>\n                `<div class=\"tuningEffect\">\n                  <div class=\"tuningEffectName\">${\n                    mhurTuningTextV596(effect.name)\n                  }</div>\n                  <div class=\"tuningEffectDesc\">${\n                    mhurTuningTextV596(effect.desc)\n                  }</div>\n                  <div class=\"chips\">${\n                    (effect.levels||[]).map(level=>\n                      `<span class=\"chip\">${level}</span>`\n                    ).join('')\n                  }</div>\n                </div>`\n              ).join('')\n            }</div>`\n            :`<div class=\"tuningText\">${\n              mhurTuningTextV596(tu.desc)\n            }</div>`;\n\n          return `<div\n            class=\"gamePanel tuningCard ${\n              special?'spTuning':'normalTuning'\n            }\"\n            data-no-v594-translation=\"1\"\n            data-v596-tuning=\"1\"\n          >\n            <div class=\"gameHeader\">\n              <div class=\"gameIcon\">${\n                tu.img\n                  ?asset(tu.img,tuningName)\n                  :roleOnly(tu.role)\n              }</div>\n              <div class=\"gameName\">${crystalTitle}</div>\n            </div>\n\n            <div class=\"tuningBlock\">\n              <div class=\"tuningTitle ${roles[tu.role].cls}Bg\">\n                <span>${title}</span><br>${tuningName}\n              </div>\n              ${normalHtml}\n              ${levelHtml}\n            </div>\n          </div>`;\n        }).join('')\n        :`<div class=\"homeBox\">${\n          mhurTuningUiV596(\n            'Aucun T.U.N.I.N.G renseigné pour ce style.',\n            'No T.U.N.I.N.G. data is available for this style.'\n          )\n        }</div>`\n    }`;\n}\n"
          ARROW_JS = "\n/* MHUR Nexus — V596 : flèche Mods impossible à masquer par les anciens patchs */\n(function(){\n  'use strict';\n\n  const CLASS_NAME='mhurModsToggleV596';\n\n  function svg(open){\n    const path=open\n      ?'M18 39 L32 25 L46 39'\n      :'M18 25 L32 39 L46 25';\n\n    return (\n      '<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\">'+\n        '<circle cx=\"32\" cy=\"32\" r=\"28\"></circle>'+\n        '<path d=\"'+path+'\"></path>'+\n      '</svg>'\n    );\n  }\n\n  function install(details){\n    if(!(details instanceof HTMLElement))return;\n\n    const summary=details.querySelector(':scope > summary');\n    if(!summary)return;\n\n    /*\n      Retire l'ancien chevron vide du composant source.\n      Le nom de la nouvelle classe ne contient ni Arrow ni Chevron :\n      les anciens sélecteurs ne peuvent donc pas la cacher.\n    */\n    summary.querySelectorAll(\n      '.modsTutorialChevronV540,'+\n      '[data-mods-arrow],'+\n      '[data-mhur-extra-mod-arrow],'+\n      '[data-v549-old-arrow],'+\n      '[data-v592-old-arrow],'+\n      '.mhurModsArrowV594'\n    ).forEach(element=>element.remove());\n\n    let toggle=summary.querySelector(':scope > .'+CLASS_NAME);\n\n    if(!toggle){\n      toggle=document.createElement('span');\n      toggle.className=CLASS_NAME;\n      toggle.setAttribute('aria-hidden','true');\n      summary.appendChild(toggle);\n    }\n\n    toggle.innerHTML=svg(details.open);\n  }\n\n  function refresh(){\n    document.querySelectorAll('.modsTutorial').forEach(install);\n  }\n\n  let queued=false;\n\n  function schedule(){\n    if(queued)return;\n    queued=true;\n\n    requestAnimationFrame(()=>{\n      queued=false;\n      refresh();\n    });\n  }\n\n  document.addEventListener('toggle',event=>{\n    if(event.target?.classList?.contains('modsTutorial')){\n      install(event.target);\n    }\n  },true);\n\n  new MutationObserver(mutations=>{\n    if(mutations.some(mutation=>mutation.addedNodes?.length)){\n      schedule();\n    }\n  }).observe(document.documentElement,{\n    childList:true,\n    subtree:true\n  });\n\n  window.addEventListener('mhur:languagechange',()=>{\n    setTimeout(refresh,0);\n    setTimeout(refresh,80);\n  });\n\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',refresh,{once:true});\n  }else{\n    refresh();\n  }\n\n  window.addEventListener('load',refresh,{once:true});\n\n  window.MHUR_V596={\n    refresh,\n    install\n  };\n})();\n"
          ARROW_CSS = "\n/* MHUR Nexus — V596 : flèche Mods et protection des traductions */\n\nhtml body .modsTutorial > summary{\n  position:relative!important;\n  list-style:none!important;\n  padding-right:92px!important;\n}\n\nhtml body .modsTutorial > summary::before,\nhtml body .modsTutorial > summary::after{\n  content:none!important;\n  display:none!important;\n}\n\nhtml body .modsTutorial > summary::marker{\n  content:\"\"!important;\n  display:none!important;\n  font-size:0!important;\n}\n\nhtml body .modsTutorial > summary::-webkit-details-marker{\n  display:none!important;\n}\n\n/*\n  Le nom ne contient ni \"Arrow\" ni \"Chevron\".\n  Les anciens sélecteurs [class*=\"Arrow\"] ne peuvent pas le masquer.\n*/\nhtml body .modsTutorial .mhurModsToggleV596{\n  position:absolute!important;\n  top:50%!important;\n  right:22px!important;\n  display:grid!important;\n  visibility:visible!important;\n  place-items:center!important;\n  width:62px!important;\n  height:62px!important;\n  min-width:62px!important;\n  min-height:62px!important;\n  margin:0!important;\n  padding:0!important;\n  border:0!important;\n  opacity:1!important;\n  overflow:visible!important;\n  background:transparent!important;\n  transform:translateY(-50%)!important;\n  pointer-events:none!important;\n  z-index:999!important;\n}\n\nhtml body .modsTutorial .mhurModsToggleV596 svg{\n  display:block!important;\n  visibility:visible!important;\n  width:62px!important;\n  height:62px!important;\n  opacity:1!important;\n  overflow:visible!important;\n  filter:drop-shadow(0 4px 0 #000)!important;\n}\n\nhtml body .modsTutorial .mhurModsToggleV596 circle{\n  display:block!important;\n  visibility:visible!important;\n  fill:#07111f!important;\n  stroke:#000!important;\n  stroke-width:5!important;\n  opacity:1!important;\n}\n\nhtml body .modsTutorial .mhurModsToggleV596 path{\n  display:block!important;\n  visibility:visible!important;\n  fill:none!important;\n  stroke:#ffe000!important;\n  stroke-width:7!important;\n  stroke-linecap:round!important;\n  stroke-linejoin:round!important;\n  opacity:1!important;\n}\n\nhtml body .modsTutorial > summary:hover .mhurModsToggleV596 svg{\n  filter:\n    drop-shadow(0 4px 0 #000)\n    drop-shadow(0 0 7px rgba(255,224,0,.75))!important;\n}\n\n@media(max-width:700px){\n  html body .modsTutorial > summary{\n    padding-right:74px!important;\n  }\n\n  html body .modsTutorial .mhurModsToggleV596,\n  html body .modsTutorial .mhurModsToggleV596 svg{\n    right:11px!important;\n    width:52px!important;\n    height:52px!important;\n    min-width:52px!important;\n    min-height:52px!important;\n  }\n}\n"


          def fail(message):
              raise RuntimeError(message)


          def read(path):
              if not path.is_file():
                  fail("Fichier introuvable : " + path.as_posix())
              return path.read_text(encoding="utf-8-sig")


          def write(path, content):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.rstrip() + "\n", encoding="utf-8")


          def function_range(source, name):
              match = re.search(
                  r"\bfunction\s+" + re.escape(name) + r"\s*\(",
                  source,
              )

              if not match:
                  return None

              start = match.start()
              brace = source.find("{", match.end())

              if brace < 0:
                  return None

              depth = 0
              quote = ""
              escaped = False
              template_expression_depth = 0

              for index in range(brace, len(source)):
                  char = source[index]

                  if quote:
                      if escaped:
                          escaped = False
                          continue

                      if char == "\\":
                          escaped = True
                          continue

                      if quote == "`":
                          if char == "`" and template_expression_depth == 0:
                              quote = ""
                              continue

                          if char == "$" and index + 1 < len(source) and source[index + 1] == "{":
                              template_expression_depth += 1
                              continue

                          if char == "}" and template_expression_depth:
                              template_expression_depth -= 1
                              continue
                      elif char == quote:
                          quote = ""
                          continue

                      continue

                  if char in ("'", '"', "`"):
                      quote = char
                      continue

                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1

                      if depth == 0:
                          return start, index + 1

              return None


          def replace_function(source, name, replacement):
              found = function_range(source, name)

              if not found:
                  fail("Fonction introuvable : " + name)

              start, end = found
              return source[:start] + replacement.rstrip() + source[end:]


          def patch_index_source():
              html = read(INDEX)

              # Retire une ancienne installation des helpers V596.
              html = re.sub(
                  r"/\* === V596 : traduction T\.U\.N\.I\.N\.G\.[\s\S]*?"
                  r"/\* === FIN V596 TUNING === \*/\s*",
                  "",
                  html,
                  flags=re.I,
              )

              marker = "function tuningDetail"

              position = html.find(marker)

              if position < 0:
                  fail("function tuningDetail est introuvable.")

              helper_block = (
                  "\n" + HELPERS.rstrip()
                  + "\n/* === FIN V596 TUNING === */\n"
              )

              html = html[:position] + helper_block + html[position:]
              html = replace_function(html, "tuningDetail", TUNING_FUNCTION)

              # Retire les anciennes références V596.
              html = re.sub(
                  r"\s*<link\b[^>]*href=['\"][^'\"]*"
                  r"v596-tuning-mods\.css[^'\"]*['\"][^>]*>\s*",
                  "\n",
                  html,
                  flags=re.I,
              )

              html = re.sub(
                  r"\s*<script\b[^>]*src=['\"][^'\"]*"
                  r"v596-tuning-mods\.js[^'\"]*['\"][^>]*>"
                  r"\s*</script>\s*",
                  "\n",
                  html,
                  flags=re.I,
              )

              if "</head>" not in html or "</body>" not in html:
                  fail("Balises </head> ou </body> introuvables.")

              html = html.replace(
                  "</head>",
                  '\n<link rel="stylesheet" href="css/v596-tuning-mods.css?v=596">\n'
                  "</head>",
                  1,
              )

              html = html.replace(
                  "</body>",
                  '\n<script src="js/v596-tuning-mods.js?v=596"></script>\n'
                  "</body>",
                  1,
              )

              write(INDEX, html)


          def neutralize_old_tuning_mutation():
              if not V594.is_file():
                  return False

              source = read(V594)
              found = function_range(source, "localizeAllTunings")

              if not found:
                  return False

              source = replace_function(
                  source,
                  "localizeAllTunings",
                  """function localizeAllTunings(){
            /*
              V596 traduit uniquement pendant le rendu.
              Les données françaises ne doivent plus être modifiées en mémoire.
            */
            return;
          }""",
              )

              write(V594, source)
              return True


          def verify(v594_patched):
              errors = []
              html = read(INDEX)
              js = read(JS_FILE)
              css = read(CSS_FILE)

              for value in (
                  "function mhurTuningTextV596",
                  "function tuningDetail",
                  "data-no-v594-translation",
                  "Battlefield Analysis",
                  r"\bTaille\b",
              ):
                  if value not in html:
                      errors.append("Correctif source absent : " + value)

              for resource in (
                  "css/v596-tuning-mods.css?v=596",
                  "js/v596-tuning-mods.js?v=596",
              ):
                  if resource not in html:
                      errors.append("Référence absente : " + resource)

              for value in (
                  "mhurModsToggleV596",
                  "function install",
                  "modsTutorialChevronV540",
                  "window.MHUR_V596",
              ):
                  if value not in js:
                      errors.append("Correctif flèche absent : " + value)

              for value in (
                  ".mhurModsToggleV596",
                  ".mhurModsToggleV596 circle",
                  ".mhurModsToggleV596 path",
              ):
                  if value not in css:
                      errors.append("Style flèche absent : " + value)

              if "mhurModsArrowV596" in js or "mhurModsArrowV596" in css:
                  errors.append(
                      "Le nouveau nom contient encore Arrow et pourrait être masqué."
                  )

              if v594_patched:
                  v594_source = read(V594)

                  if "V596 traduit uniquement pendant le rendu" not in v594_source:
                      errors.append("L'ancien mutateur V594 n'a pas été neutralisé.")

                  syntax_v594 = subprocess.run(
                      ["node", "--check", str(V594)],
                      text=True,
                      capture_output=True,
                  )

                  if syntax_v594.returncode:
                      errors.append(
                          "Syntaxe V594 invalide : " + syntax_v594.stderr
                      )

              syntax = subprocess.run(
                  ["node", "--check", str(JS_FILE)],
                  text=True,
                  capture_output=True,
              )

              if syntax.returncode:
