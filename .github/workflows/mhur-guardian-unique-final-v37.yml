name: MHUR NEXUS — GUARDIAN UNIQUE FINAL V37

on:
  schedule:
    # Scan UltraRumble à la minute 01 de chaque heure.
    - cron: "1 * * * *"
    # Vérifie Discord toutes les 5 minutes pour V / ✅ / REFUS.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Action à lancer"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - approval
          - deploy

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: mhur-nexus-guardian-unique-final-v37
  cancel-in-progress: false

env:
  BETA_BRANCH: mhur-auto-beta
  WORKER_NAME: mhur-france
  WORKER_COMPATIBILITY_DATE: "2026-08-09"

jobs:
  # ================================================================
  # SCAN + SYNCHRONISATION + BÊTA + DISCORD
  # ================================================================
  scan:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '1 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_APPROVER_USER_ID: ${{ secrets.DISCORD_APPROVER_USER_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier Node 22
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt 22 ]; then
            echo "::error::Node 22 minimum requis par Wrangler."
            exit 1
          fi

          echo "✅ Node $(node --version) compatible avec Wrangler."

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          echo "Installer les dépendances" > /tmp/mhur_stage

          python -m pip install --upgrade pip
          if [ -f mise_a_jour/requirements.txt ]; then
            python -m pip install -r mise_a_jour/requirements.txt
          fi
          python -m pip install requests beautifulsoup4 lxml pillow

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Vérifier les secrets indispensables
        shell: bash
        run: |
          set -euo pipefail
          echo "Vérifier les secrets" > /tmp/mhur_stage

          missing=0
          for name in DISCORD_BOT_TOKEN DISCORD_CHANNEL_ID DISCORD_APPROVER_USER_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret absent : ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Installer les correctifs permanents dans la candidate
        id: fixes
        shell: bash
        run: |
          set -euo pipefail
          echo "Installer les correctifs Login Bonus et dégâts" > /tmp/mhur_stage

          # ----------------------------------------------------------
          # 1. Runtime stats exactes.
          # Il lit exact_by_style déjà généré par le site et reconstruit
          # les tableaux avec les vraies valeurs UltraRumble.
          # ----------------------------------------------------------
          cat > public/js/v26-exact-stats-runtime.js <<'JS'
          (() => {
            'use strict';

            const MARK = 'MHUR_V26_EXACT_STATS_RUNTIME';

            const currentLang = () => {
              try {
                return (typeof lang !== 'undefined' && lang === 'en') ? 'en' : 'fr';
              } catch (_e) {
                return 'fr';
              }
            };

            function pick(value, language = currentLang()) {
              if (value && typeof value === 'object' && !Array.isArray(value)) {
                return value[language] ?? value.fr ?? value.en ?? '';
              }
              return value;
            }

            function clean(value) {
              return String(pick(value) ?? '')
                .replace(/[\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff]/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
            }

            function norm(value) {
              return clean(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[’']/g, '')
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '');
            }

            function readExact() {
              const node = document.getElementById('ultrarumble-exact-data');
              if (!node) return null;
              try {
                return JSON.parse(node.textContent || '{}');
              } catch (_e) {
                return null;
              }
            }

            function columns(table) {
              return Array.isArray(table?.columns)
                ? table.columns.map(value => String(value ?? ''))
                : Array.isArray(table?.cols)
                  ? table.cols.map(value => String(value ?? ''))
                  : [];
            }

            function rows(table) {
              return Array.isArray(table?.rows)
                ? table.rows
                    .filter(Array.isArray)
                    .map(row => row.map(value => String(value ?? '')))
                : [];
            }

            function translateColumn(value, language) {
              const key = norm(value);
              const fr = {
                type: 'Type',
                level: 'Niveau',
                damage: 'Dégâts',
                ammo: 'Munitions',
                use_ammo: 'Consommation',
                reload: 'Recharge',
                down_power: 'Down Power',
                level_up_effect: 'Effet'
              };
              const en = {
                type: 'Type',
                level: 'Level',
                damage: 'Damage',
                ammo: 'Ammo',
                use_ammo: 'Use Ammo',
                reload: 'Reload',
                down_power: 'Down Power',
                level_up_effect: 'Effect'
              };
              return (language === 'fr' ? fr : en)[key] || clean(value);
            }

            function effectTable(symbol, remote, oldTables) {
              const sourceRows = rows(remote);
              if (!sourceRows.length) {
                return (oldTables || []).filter(table => {
                  const title = norm(clean(table?.title));
                  return title.includes('effet') || title.includes('effect');
                });
              }

              const sourceCols = columns(remote);
              const keep = sourceCols
                .map((col, index) => ({ col, index }))
                .filter(item => !['down_power', 'down'].includes(norm(item.col)));

              return [{
                title: {
                  fr: `Effets de montée ${symbol}`,
                  en: `${symbol} level-up effects`
                },
                cols: {
                  fr: keep.map(item => translateColumn(item.col, 'fr')),
                  en: keep.map(item => translateColumn(item.col, 'en'))
                },
                rows: {
                  fr: sourceRows.map(row => keep.map(item => clean(row[item.index] ?? ''))),
                  en: sourceRows.map(row => keep.map(item => clean(row[item.index] ?? '')))
                },
                __v26: 'effect'
              }];
            }

            function baseTable(symbol, remote) {
              const sourceRows = rows(remote);
              if (!sourceRows.length) return null;

              const sourceCols = columns(remote);
              const keep = sourceCols
                .map((col, index) => ({ col, index }))
                .filter(item => !['down_power', 'down'].includes(norm(item.col)));

              return {
                title: {
                  fr: `Valeurs de base ${symbol}`,
                  en: `Base ${symbol} values`
                },
                cols: {
                  fr: keep.map(item => translateColumn(item.col, 'fr')),
                  en: keep.map(item => translateColumn(item.col, 'en'))
                },
                rows: {
                  fr: sourceRows.map(row => keep.map(item => clean(row[item.index] ?? ''))),
                  en: sourceRows.map(row => keep.map(item => clean(row[item.index] ?? '')))
                },
                __v26: 'base'
              };
            }

            function typeLabel(rawType, styleKey, symbol, groupIndex, groupCount) {
              const original = clean(rawType) || 'Value';
              const key = norm(original);

              const mappings = [
                [['melee_combat', 'melee'], 'Corps à corps', 'Melee Combat'],
                [['upon_activation', 'activation'], 'Activation', 'Activation'],
                [['shockwave'], 'Onde de choc', 'Shockwave'],
                [['bullet', 'projectile'], 'Projectile', 'Projectile'],
                [['rush'], 'Ruée', 'Rush'],
                [['rebound', 'bounce'], 'Rebond', 'Rebound'],
                [['impact'], 'Impact final', 'Impact'],
                [['explosion'], 'Explosion', 'Explosion'],
                [['short_range'], 'Distance courte', 'Short Range'],
                [['middle_range', 'medium_range'], 'Distance moyenne', 'Medium Range'],
                [['long_range', 'max_range'], 'Distance longue', 'Long Range'],
                [['charge'], 'Charge', 'Charge'],
                [['pull', 'grab'], 'Attraction', 'Pull'],
                [['finish', 'finisher'], 'Finale', 'Finisher'],
                [['normal'], 'Normal', 'Normal']
              ];

              let fr = original;
              let en = original;

              for (const [needles, frLabel, enLabel] of mappings) {
                if (needles.some(needle => key.includes(needle))) {
                  fr = frLabel;
                  en = enLabel;
                  break;
                }
              }

              // Gentle γ : la source contient actuellement trois cycles portant
              // le même Type "Rush". On les garde séparés dans l'ordre officiel.
              if (
                norm(styleKey).includes('gentle_criminal') &&
                symbol === 'γ' &&
                groupCount >= 3
              ) {
                const labels = [
                  ['Ruée', 'Rush'],
                  ['Rebond', 'Rebound'],
                  ['Impact final', 'Impact']
                ];
                if (labels[groupIndex]) {
                  [fr, en] = labels[groupIndex];
                }
              }

              return { fr, en };
            }

            function additionalTables(symbol, remote, styleKey) {
              const sourceCols = columns(remote);
              const sourceRows = rows(remote);
              if (!sourceRows.length) return [];

              const normalized = sourceCols.map(norm);
              let typeIndex = normalized.indexOf('type');
              let levelIndex = normalized.indexOf('level');
              let damageIndex = normalized.indexOf('damage');

              if (typeIndex < 0) typeIndex = 0;
              if (levelIndex < 0) levelIndex = 1;
              if (damageIndex < 0) damageIndex = 2;

              const groups = [];
              let current = null;
              let lastType = 'Value';

              for (const source of sourceRows) {
                const row = [...source];
                const detectedLevel = row.findIndex(value =>
                  /^Lv\.\d+$/i.test(String(value || '').trim())
                );
                const li = detectedLevel >= 0 ? detectedLevel : levelIndex;
                const level = String(row[li] ?? '').trim();
                if (!/^Lv\.\d+$/i.test(level)) continue;

                let rawType = String(row[typeIndex] ?? '').trim();
                if (rawType) lastType = rawType;
                rawType = rawType || lastType || 'Value';

                const key = norm(rawType) || 'value';
                const restart = /^Lv\.1$/i.test(level) && current && current.rows.length;
                const changedType = current && current.key !== key;

                if (!current || restart || changedType) {
                  current = { key, rawType, rows: [] };
                  groups.push(current);
                }

                let damage = String(row[damageIndex] ?? '').trim();
                if (!damage && li + 1 < row.length) {
                  damage = String(row[li + 1] ?? '').trim();
                }

                current.rows.push({ level, damage });
              }

              return groups.map((group, index) => {
                const labels = typeLabel(
                  group.rawType,
                  styleKey,
                  symbol,
                  index,
                  groups.length
                );

                return {
                  title: {
                    fr: `Dégâts ${symbol} — ${labels.fr}`,
                    en: `${symbol} Damage — ${labels.en}`
                  },
                  cols: {
                    fr: ['Type', 'Niveau', 'Dégâts'],
                    en: ['Type', 'Level', 'Damage']
                  },
                  rows: {
                    fr: group.rows.map(row => [labels.fr, row.level, row.damage]),
                    en: group.rows.map(row => [labels.en, row.level, row.damage])
                  },
                  __v26: 'additional'
                };
              });
            }

            function skillByLetter(style, symbol) {
              const aliases = {
                'α': ['α', 'alpha', 'a'],
                'β': ['β', 'beta', 'b'],
                'γ': ['γ', 'gamma', 'g']
              }[symbol] || [symbol];

              return (style?.skills || []).find(skill =>
                aliases.includes(String(skill?.letter || '').trim().toLowerCase())
              ) || null;
            }

            function syncSkill(localSkill, remoteSkill, styleKey, symbol) {
              if (!localSkill || !remoteSkill) return 0;

              const oldTables = Array.isArray(localSkill.tables)
                ? localSkill.tables
                : [];

              const next = [];
              next.push(...effectTable(symbol, remoteSkill.level_up_effects, oldTables));

              const base = baseTable(symbol, remoteSkill.base_values);
              if (base) next.push(base);

              next.push(...additionalTables(
                symbol,
                remoteSkill.additional_values,
                styleKey
              ));

              if (!next.length) return 0;

              localSkill.tables = next;
              return 1;
            }

            function syncAll() {
              const data = readExact();

              if (
                typeof styles === 'undefined' ||
                !data ||
                !data.exact_by_style
              ) {
                return {
                  loaded: false,
                  mapped: 0,
                  changed: 0,
                  marker: MARK
                };
              }

              let changed = 0;
              let mapped = 0;

              Object.entries(data.exact_by_style).forEach(([styleKey, remote]) => {
                const local = styles[styleKey];
                if (!local || !remote) return;
                mapped += 1;

                const hp =
                  remote?.stats?.['Max Main Health'] ??
                  remote?.stats?.['Max Health'] ??
                  remote?.stats?.['Max HP'];

                if (hp !== undefined && hp !== null && hp !== '') {
                  local.pv = String(hp);
                }

                for (const symbol of ['α', 'β', 'γ']) {
                  changed += syncSkill(
                    skillByLetter(local, symbol),
                    remote?.skills?.[symbol],
                    styleKey,
                    symbol
                  );
                }
              });

              const status = {
                loaded: true,
                mapped,
                changed,
                marker: MARK
              };

              window.__MHUR_V26_STATS_STATUS__ = status;
              return status;
            }

            function hookRender() {
              try {
                if (typeof render !== 'function') return;
                if (render.__mhurV26Wrapped) return;

                const previous = render;
                const wrapped = function () {
                  try { syncAll(); } catch (_e) {}
                  return previous.apply(this, arguments);
                };
                wrapped.__mhurV26Wrapped = true;

                render = wrapped;
                window.__MHUR_V26_RENDER_HOOK__ = true;
              } catch (_e) {}
            }

            window.MHUR_V26_STATS_SYNC = syncAll;

            try {
              syncAll();
              hookRender();
            } catch (_e) {}

            document.addEventListener('DOMContentLoaded', () => {
              try {
                syncAll();
                hookRender();
              } catch (_e) {}
            });

            setTimeout(() => {
              try {
                syncAll();
                hookRender();
                if (typeof render === 'function') render();
              } catch (_e) {}
            }, 0);

            setTimeout(() => {
              try { syncAll(); } catch (_e) {}
            }, 250);
          })();
          JS

          node --check public/js/v26-exact-stats-runtime.js

          # ----------------------------------------------------------
          # 2. Patcher permanent :
          #    - force le refresh des Login Bonus
          #    - garantit le chargement du runtime après chaque génération index.
          # ----------------------------------------------------------
          cat > /tmp/apply_v26.py <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          home = root / "mise_a_jour" / "outils" / "update_home_data.py"
          index = root / "public" / "index.html"

          if not home.exists():
              raise SystemExit("[V26][ERREUR] update_home_data.py introuvable")
          if not index.exists():
              raise SystemExit("[V26][ERREUR] public/index.html introuvable")

          text = home.read_text(encoding="utf-8")
          changed = False

          if "force: bool = False" not in text:
              pattern = (
                  r"def\s+download_asset\("
                  r"root:\s*Path,\s*url:\s*str,\s*rel_stem:\s*str,\s*"
                  r"retries:\s*int\s*=\s*4"
                  r"\)\s*->\s*str:"
              )
              replacement = (
                  "def download_asset(root: Path, url: str, rel_stem: str, "
                  "retries: int = 4, force: bool = False) -> str:"
              )
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit("[V26][ERREUR] Signature download_asset introuvable")
              changed = True

          if "if cached and not force:" not in text:
              pattern = (
                  r"(?m)^(?P<i>\s*)cached\s*=\s*existing_asset\(root,\s*rel_stem\)\s*$"
                  r"\n(?P=i)if\s+cached:\s*$"
                  r"\n(?P=i)\s+return\s+cached\s*$"
              )
              replacement = (
                  r"\g<i>cached = existing_asset(root, rel_stem)\n"
                  r"\g<i>if cached and not force:\n"
                  r"\g<i>    return cached"
              )
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit("[V26][ERREUR] Bloc cache download_asset introuvable")
              changed = True

          if not re.search(
              r'assets/home/bonuses/\{slug\(title,\s*70\)\}.*?force=True',
              text,
              re.S,
          ):
              pattern = (
                  r'(?P<start>local\s*=\s*download_asset\(\s*'
                  r'root,\s*'
                  r'remote,\s*'
                  r'f"assets/home/bonuses/\{slug\(title,\s*70\)\}",\s*)'
                  r'\)'
              )
              match = re.search(pattern, text, re.S)
              if not match:
                  raise SystemExit("[V26][ERREUR] Appel Login Bonus introuvable")
              replacement = match.group("start") + "force=True,\n            )"
              text = text[:match.start()] + replacement + text[match.end():]
              changed = True

          warning_pattern = (
              r'(?m)^(?P<i>\s*)print\(f"\[HOME IMAGE WARNING\] \{url\}: \{exc\}", flush=True\)\s*$'
              r'\n(?P=i)return\s+""\s*$'
          )
          if re.search(warning_pattern, text):
              text = re.sub(
                  warning_pattern,
                  r'\g<i>print(f"[HOME IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  r'\g<i>return cached or ""',
                  text,
                  count=1,
              )
              changed = True

          if changed:
              home.write_text(text, encoding="utf-8", newline="\n")

          required = [
              "force: bool = False",
              "if cached and not force:",
              "force=True,",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(
                  "[V26][ERREUR] Patch Login Bonus incomplet : "
                  + ", ".join(missing)
              )

          html = index.read_text(encoding="utf-8")
          tag = '<script src="js/v26-exact-stats-runtime.js?v=26"></script>'

          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("[V26][ERREUR] </body> introuvable")
              html = html.replace(
                  "</body>",
                  "<!-- MHUR V26 : stats exactes + tableaux séparés -->\n"
                  + tag
                  + "\n</body>",
                  1,
              )
              index.write_text(html, encoding="utf-8", newline="\n")

          print("[V26][OK] Correctifs Login Bonus + runtime installés")
          PY

          python /tmp/apply_v26.py
          python -m py_compile mise_a_jour/outils/update_home_data.py

          if git diff --quiet -- \
            mise_a_jour/outils/update_home_data.py \
            public/index.html \
            public/js/v26-exact-stats-runtime.js; then
            echo "fix_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "fix_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer les correctifs finaux Patch Notes et Gentle V28
        id: v28fix
        shell: bash
        run: |
          set -euo pipefail
          echo "Installer Patch Notes mobile et Gentle V28" > /tmp/mhur_stage

          mkdir -p public/js public/css

          # ==========================================================
          # PATCH NOTES MOBILE + DÉTAIL EXACT DE LA PARTIE MODIFIÉE
          # ==========================================================
          cat > public/css/v28-patch-notes-mobile.css <<'CSS'
          /* MHUR NEXUS — FINAL V28 : Patch Notes mobile */
          .mhurV28PatchSubtype{
            display:flex!important;
            align-items:center!important;
            gap:7px!important;
            width:max-content!important;
            max-width:100%!important;
            margin:7px 0 10px!important;
            padding:5px 9px!important;
            border:1px solid rgba(255,224,0,.65)!important;
            border-radius:7px!important;
            background:rgba(255,224,0,.10)!important;
            color:#ffe95a!important;
            font-size:13px!important;
            font-weight:900!important;
            line-height:1.3!important;
            white-space:normal!important;
          }

          #s18NotesDevModalV10.s18NotesOverlayV10{
            overscroll-behavior:none!important;
            touch-action:none!important;
          }

          #s18NotesDevModalV10 .s18NotesPanelV10{
            display:flex!important;
            flex-direction:column!important;
            min-height:0!important;
            overflow:hidden!important;
          }

          #s18NotesDevModalV10 .s18NotesBodyV10{
            flex:1 1 auto!important;
            min-height:0!important;
            overflow:hidden!important;
          }

          #s18NotesDevModalV10 .s18NotesBodyV10>main{
            min-width:0!important;
            min-height:0!important;
            overflow-y:auto!important;
            overflow-x:hidden!important;
            overscroll-behavior-y:contain!important;
            -webkit-overflow-scrolling:touch!important;
            touch-action:pan-y pinch-zoom!important;
            scrollbar-gutter:stable!important;
          }

          #s18NotesDevModalV10 .s18NotesBodyV10>aside{
            min-width:0!important;
            overscroll-behavior:contain!important;
            -webkit-overflow-scrolling:touch!important;
          }

          @media(max-width:900px){
            #s18NotesDevModalV10 .s18NotesPanelV10{
              height:calc(100dvh - var(--s18-header-offset,0px) - 16px)!important;
              max-height:calc(100dvh - var(--s18-header-offset,0px) - 16px)!important;
            }

            #s18NotesDevModalV10 .s18NotesBodyV10{
              display:grid!important;
              grid-template-columns:minmax(0,1fr)!important;
              grid-template-rows:max-content minmax(0,1fr)!important;
              height:auto!important;
              max-height:none!important;
              flex:1 1 0!important;
            }

            #s18NotesDevModalV10 .s18NotesBodyV10>aside{
              display:flex!important;
              flex-direction:row!important;
              flex-wrap:nowrap!important;
              align-items:stretch!important;
              gap:8px!important;
              width:100%!important;
              max-width:100%!important;
              min-height:0!important;
              max-height:none!important;
              padding:9px!important;
              border-right:0!important;
              border-bottom:2px solid #2d496e!important;
              overflow-x:auto!important;
              overflow-y:hidden!important;
              overscroll-behavior-x:contain!important;
              overscroll-behavior-y:none!important;
              touch-action:pan-x pinch-zoom!important;
              scroll-snap-type:x proximity!important;
              scrollbar-width:thin!important;
            }

            #s18NotesDevModalV10 .s18NotesBodyV10>aside>button{
              flex:0 0 min(78vw,300px)!important;
              width:auto!important;
              min-width:min(78vw,230px)!important;
              max-width:300px!important;
              margin:0!important;
              scroll-snap-align:start!important;
              white-space:normal!important;
            }

            #s18NotesDevModalV10 .s18NotesBodyV10>main{
              height:auto!important;
              max-height:none!important;
              min-height:0!important;
              padding:14px 12px 28px!important;
              overflow-y:auto!important;
              overflow-x:hidden!important;
              touch-action:pan-y pinch-zoom!important;
            }
          }

          @media(max-width:600px){
            #s18NotesDevModalV10 .s18NotesPanelV10{
