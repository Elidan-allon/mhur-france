name: MHUR V590 - scrollbars Nexus et fleche Mods

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v590-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v590-scrollbars-mods
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Installer V590
        shell: bash
        run: |
          cat > /tmp/appliquer_v590.py <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          index = root / "public" / "index.html"
          css = root / "public" / "css" / "v590-scrollbars-mods.css"
          js = root / "public" / "js" / "v590-scrollbars-mods.js"
          report = root / "RAPPORT_V590_SCROLLBARS_MODS.txt"

          if not index.is_file():
              raise SystemExit("[ERREUR] public/index.html est introuvable.")

          css_content = "\n/* MHUR Nexus — V590 : barres de défilement globales + flèche Mods unique */\n\n:root{\n  --mhur-scroll-track:#07101d;\n  --mhur-scroll-track-mid:#142844;\n  --mhur-scroll-yellow:#ffe000;\n  --mhur-scroll-yellow-light:#fff36b;\n  --mhur-scroll-cyan:#19c9de;\n  --mhur-scroll-cyan-dark:#078ea5;\n}\n\n/* Firefox : toutes les zones déroulantes. */\nhtml,\nbody,\nbody *{\n  scrollbar-width:thin!important;\n  scrollbar-color:var(--mhur-scroll-yellow) var(--mhur-scroll-track)!important;\n}\n\n/* Chromium, Edge, Chrome, Safari : site, panneaux, modales, champs, listes. */\nhtml::-webkit-scrollbar,\nbody::-webkit-scrollbar,\nbody *::-webkit-scrollbar{\n  width:13px!important;\n  height:13px!important;\n}\n\nhtml::-webkit-scrollbar-track,\nbody::-webkit-scrollbar-track,\nbody *::-webkit-scrollbar-track{\n  background:\n    linear-gradient(\n      180deg,\n      var(--mhur-scroll-track) 0%,\n      var(--mhur-scroll-track-mid) 50%,\n      var(--mhur-scroll-track) 100%\n    )!important;\n  border:2px solid #000!important;\n  border-radius:999px!important;\n  box-shadow:inset 0 0 0 1px rgba(25,201,222,.16)!important;\n}\n\nhtml::-webkit-scrollbar-thumb,\nbody::-webkit-scrollbar-thumb,\nbody *::-webkit-scrollbar-thumb{\n  min-width:44px!important;\n  min-height:44px!important;\n  border:3px solid #02060c!important;\n  border-radius:999px!important;\n  background:\n    linear-gradient(\n      180deg,\n      var(--mhur-scroll-yellow-light) 0%,\n      var(--mhur-scroll-yellow) 38%,\n      var(--mhur-scroll-cyan) 72%,\n      var(--mhur-scroll-cyan-dark) 100%\n    )!important;\n  background-clip:padding-box!important;\n  box-shadow:\n    inset 0 0 0 2px rgba(255,255,255,.2),\n    0 0 7px rgba(255,224,0,.35)!important;\n}\n\nhtml::-webkit-scrollbar-thumb:horizontal,\nbody::-webkit-scrollbar-thumb:horizontal,\nbody *::-webkit-scrollbar-thumb:horizontal{\n  background:\n    linear-gradient(\n      90deg,\n      var(--mhur-scroll-yellow-light) 0%,\n      var(--mhur-scroll-yellow) 38%,\n      var(--mhur-scroll-cyan) 72%,\n      var(--mhur-scroll-cyan-dark) 100%\n    )!important;\n}\n\nhtml::-webkit-scrollbar-thumb:hover,\nbody::-webkit-scrollbar-thumb:hover,\nbody *::-webkit-scrollbar-thumb:hover{\n  background:\n    linear-gradient(\n      180deg,\n      #fff9a8 0%,\n      #ffea27 38%,\n      #45e4f3 72%,\n      #0bb5ce 100%\n    )!important;\n}\n\nhtml::-webkit-scrollbar-thumb:active,\nbody::-webkit-scrollbar-thumb:active,\nbody *::-webkit-scrollbar-thumb:active{\n  background:\n    linear-gradient(\n      180deg,\n      #ffe000 0%,\n      #ffb000 44%,\n      #19c9de 72%,\n      #08798d 100%\n    )!important;\n}\n\nhtml::-webkit-scrollbar-button,\nbody::-webkit-scrollbar-button,\nbody *::-webkit-scrollbar-button{\n  display:none!important;\n  width:0!important;\n  height:0!important;\n}\n\nhtml::-webkit-scrollbar-corner,\nbody::-webkit-scrollbar-corner,\nbody *::-webkit-scrollbar-corner{\n  background:var(--mhur-scroll-track)!important;\n}\n\n/* Le résumé natif ne doit produire aucun marqueur supplémentaire. */\nhtml body .modsTutorial > summary{\n  list-style:none!important;\n}\n\nhtml body .modsTutorial > summary::marker{\n  content:\"\"!important;\n  display:none!important;\n  font-size:0!important;\n}\n\nhtml body .modsTutorial > summary::-webkit-details-marker{\n  display:none!important;\n  width:0!important;\n  height:0!important;\n}\n\n/*\n  Une seule flèche : le pseudo-élément de droite.\n  Toutes les anciennes flèches réelles sont masquées, quelle que soit\n  leur version ou leur nom de classe.\n*/\nhtml body .modsTutorial > summary::before{\n  content:none!important;\n  display:none!important;\n}\n\nhtml body .modsTutorial > summary::after{\n  content:\"⌄\"!important;\n  display:grid!important;\n  place-items:center!important;\n  flex:0 0 56px!important;\n  width:56px!important;\n  min-width:56px!important;\n  height:56px!important;\n  margin-left:auto!important;\n  border:4px solid #000!important;\n  border-radius:50%!important;\n  background:#07111f!important;\n  color:#ffe000!important;\n  font-size:38px!important;\n  font-weight:1000!important;\n  line-height:1!important;\n  box-shadow:0 4px 0 #000!important;\n  transform:rotate(0deg)!important;\n  transform-origin:center!important;\n  transition:transform .18s ease!important;\n  pointer-events:none!important;\n}\n\nhtml body .modsTutorial[open] > summary::after{\n  transform:rotate(180deg)!important;\n}\n\n/* Classes connues et futures contenant Arrow/Chevron dans le tutoriel. */\nhtml body .modsTutorial\n  :is(\n    [class*=\"Arrow\"],\n    [class*=\"arrow\"],\n    [class*=\"Chevron\"],\n    [class*=\"chevron\"],\n    [data-mods-arrow],\n    [data-mhur-extra-mod-arrow]\n  ){\n  display:none!important;\n  visibility:hidden!important;\n  width:0!important;\n  height:0!important;\n  min-width:0!important;\n  min-height:0!important;\n  margin:0!important;\n  padding:0!important;\n  border:0!important;\n  overflow:hidden!important;\n  opacity:0!important;\n  pointer-events:none!important;\n}\n\n/* La flèche est compacte sur téléphone, sans créer de deuxième ligne. */\n@media(max-width:700px){\n  html body .modsTutorial > summary::after{\n    flex-basis:48px!important;\n    width:48px!important;\n    min-width:48px!important;\n    height:48px!important;\n    font-size:32px!important;\n  }\n\n  html::-webkit-scrollbar,\n  body::-webkit-scrollbar,\n  body *::-webkit-scrollbar{\n    width:10px!important;\n    height:10px!important;\n  }\n}\n"
          js_content = "\n/* MHUR Nexus — V590 : suppression permanente de la deuxième flèche Mods */\n(function(){\n  'use strict';\n\n  const ARROW_CLASS=/arrow|chevron/i;\n  const ARROW_TEXT=/^(?:v|⌄|⌃|▼|▲|▾|▴|▽|△|↓|↑|❯|❮|›|‹)$/i;\n\n  function isExtraArrow(element,summary){\n    if(!(element instanceof HTMLElement))return false;\n    if(element===summary)return false;\n\n    const className=String(element.className||'');\n    const hasArrowClass=ARROW_CLASS.test(className);\n    const hasArrowData=Boolean(\n      element.hasAttribute('data-mods-arrow')||\n      element.hasAttribute('data-mhur-extra-mod-arrow')||\n      element.hasAttribute('data-v549-old-arrow')\n    );\n\n    const text=String(element.textContent||'')\n      .replace(/\\s+/g,'')\n      .trim();\n\n    /*\n      On retire un texte-flèche uniquement lorsque l'élément ne contient\n      ni image, ni champ, ni vrai contenu du tutoriel.\n    */\n    const isArrowOnly=Boolean(\n      text&&\n      ARROW_TEXT.test(text)&&\n      !element.querySelector('img,input,select,textarea,video,code')\n    );\n\n    return hasArrowClass||hasArrowData||isArrowOnly;\n  }\n\n  function cleanTutorial(tutorial){\n    if(!(tutorial instanceof HTMLElement))return;\n\n    const summary=tutorial.querySelector(':scope > summary');\n    if(!summary)return;\n\n    summary.style.listStyle='none';\n\n    /*\n      La bonne flèche est le ::after CSS du summary.\n      Toutes les flèches DOM, même ajoutées après le rendu, sont supprimées.\n    */\n    tutorial.querySelectorAll('*').forEach(element=>{\n      if(!isExtraArrow(element,summary))return;\n\n      element.setAttribute('data-mhur-extra-mod-arrow','1');\n      element.hidden=true;\n      element.setAttribute('aria-hidden','true');\n      element.remove();\n    });\n  }\n\n  function cleanAll(){\n    document.querySelectorAll('.modsTutorial').forEach(cleanTutorial);\n  }\n\n  let queued=false;\n\n  function schedule(){\n    if(queued)return;\n    queued=true;\n\n    requestAnimationFrame(()=>{\n      queued=false;\n      cleanAll();\n    });\n  }\n\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',cleanAll,{once:true});\n  }else{\n    cleanAll();\n  }\n\n  new MutationObserver(mutations=>{\n    if(mutations.some(mutation=>mutation.addedNodes?.length)){\n      schedule();\n    }\n  }).observe(document.documentElement,{\n    childList:true,\n    subtree:true\n  });\n\n  document.addEventListener('toggle',event=>{\n    if(event.target?.classList?.contains('modsTutorial')){\n      cleanTutorial(event.target);\n    }\n  },true);\n\n  window.addEventListener('hashchange',schedule);\n  window.addEventListener('load',cleanAll,{once:true});\n\n  window.MHUR_V590={\n    refresh:cleanAll\n  };\n})();\n"

          css.parent.mkdir(parents=True, exist_ok=True)
          js.parent.mkdir(parents=True, exist_ok=True)
          css.write_text(css_content.rstrip() + "\n", encoding="utf-8")
          js.write_text(js_content.rstrip() + "\n", encoding="utf-8")

          html = index.read_text(encoding="utf-8-sig")

          html = re.sub(
              r"\s*<link\b[^>]*href=['\"][^'\"]*v590-scrollbars-mods\.css[^'\"]*['\"][^>]*>\s*",
              "\n",
              html,
              flags=re.I,
          )

          html = re.sub(
              r"\s*<script\b[^>]*src=['\"][^'\"]*v590-scrollbars-mods\.js[^'\"]*['\"][^>]*>\s*</script>\s*",
              "\n",
              html,
              flags=re.I,
          )

          if "</head>" not in html:
              raise SystemExit("[ERREUR] </head> est introuvable.")
          if "</body>" not in html:
              raise SystemExit("[ERREUR] </body> est introuvable.")

          html = html.replace(
              "</head>",
              '\n<!-- V590 : style global MHUR Nexus, dernier CSS. -->\n'
              '<link rel="stylesheet" href="css/v590-scrollbars-mods.css?v=590">\n'
              '</head>',
              1,
          )

          html = html.replace(
              "</body>",
              '\n<!-- V590 : nettoyage permanent de la flèche Mods. -->\n'
              '<script src="js/v590-scrollbars-mods.js?v=590"></script>\n'
              '</body>',
              1,
          )

          index.write_text(html.rstrip() + "\n", encoding="utf-8")

          errors = []

          if "css/v590-scrollbars-mods.css?v=590" not in html:
              errors.append("CSS V590 non chargé.")
          if "js/v590-scrollbars-mods.js?v=590" not in html:
              errors.append("JavaScript V590 non chargé.")
          if html.rfind("v590-scrollbars-mods.css") < html.rfind(
              "season18-fixes.css"
          ):
              errors.append("Le CSS V590 n'est pas le dernier correctif principal.")
          if html.rfind("v590-scrollbars-mods.js") < html.rfind("</script>"):
              # L'occurrence V590 doit appartenir au dernier script avant </body>.
              tail = html[html.rfind("v590-scrollbars-mods.js"):]
              if "</body>" not in tail:
                  errors.append("Le JavaScript V590 n'est pas chargé à la fin.")

          for path in (js,):
              result = subprocess.run(
                  ["node", "--check", str(path)],
                  text=True,
                  capture_output=True,
              )
              if result.returncode:
                  errors.append("Syntaxe JavaScript invalide : " + result.stderr)

          if "body *::-webkit-scrollbar" not in css_content:
              errors.append("Le style global des barres manque.")
          if ".modsTutorial > summary::marker" not in css_content:
              errors.append("Le marqueur natif du tutoriel n'est pas neutralisé.")
          if "ARROW_CLASS" not in js_content:
              errors.append("Le nettoyage dynamique des flèches manque.")

          if errors:
              raise SystemExit("[ERREUR V590]\n- " + "\n- ".join(errors))

          report.write_text(
              """MHUR FRANCE — RAPPORT V590

          BARRES DE DÉFILEMENT
          - Style MHUR Nexus appliqué à html, body et tous les éléments.
          - Compatible Firefox avec scrollbar-color / scrollbar-width.
          - Compatible Chrome, Edge et Safari avec ::-webkit-scrollbar.
          - Piste bleu nuit.
          - Curseur jaune vers cyan.
          - Survol et clic différenciés.
          - Barres horizontales également stylisées.
          - Boutons natifs de scrollbar masqués.

          TUTORIEL MODS
          - Marqueur natif du summary masqué.
          - Pseudo-élément ::before neutralisé.
          - Une seule flèche CSS conservée en haut à droite.
          - Toutes les classes Arrow/Chevron du tutoriel masquées.
          - Les flèches ajoutées dynamiquement sont supprimées par MutationObserver.
          - La flèche tourne lors de l'ouverture.

          VÉRIFICATIONS
          - CSS V590 chargé en dernier dans le head : OK
          - JavaScript V590 chargé à la fin du body : OK
          - Syntaxe JavaScript : OK
          """,
              encoding="utf-8",
          )

          print("[OK] V590 appliqué et vérifié.")
          print("[OK] Toutes les barres utilisent le style MHUR Nexus.")
          print("[OK] Une seule flèche reste sur le tutoriel Mods.")
          PY
          python /tmp/appliquer_v590.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             public/index.html             public/css/v590-scrollbars-mods.css             public/js/v590-scrollbars-mods.js             RAPPORT_V590_SCROLLBARS_MODS.txt

          if git diff --cached --quiet; then
            echo "V590 est deja installe."
            exit 0
          fi

          git commit -m "Styliser les scrollbars et retirer la fleche Mods V590"
          git push
