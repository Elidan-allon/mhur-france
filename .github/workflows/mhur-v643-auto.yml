name: MHUR V643 - Notifications stables

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v643-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v643-notifications-stable
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Réparer le centre de notifications
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v643.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          
          index_path=public/"index.html"
          css_path=public/"css"/"v643-notifications-stable.css"
          js_path=public/"js"/"v643-notifications-stable.js"
          report_path=root/"RAPPORT_V643_NOTIFICATIONS_STABLES.txt"
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          patterns=[
              r'\s*<!-- V643 : notifications stables CSS\. -->\s*'
              r'<link[^>]+v643-notifications-stable\.css[^>]*>\s*',
              r'\s*<link[^>]+v643-notifications-stable\.css[^>]*>\s*',
              r'\s*<!-- V643 : notifications stables JS\. -->\s*'
              r'<script[^>]+v643-notifications-stable\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v643-notifications-stable\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(
                  pattern,
                  "\n",
                  html,
                  flags=re.I
              )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads or not bodies:
              raise SystemExit("[ERREUR] Structure HTML incomplète.")
          
          head_position=heads[-1].start()
          css_tag=(
              '\n<!-- V643 : notifications stables CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v643-notifications-stable.css?v=643">\n'
          )
          
          html=html[:head_position]+css_tag+html[head_position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          body_position=bodies[-1].start()
          js_tag=(
              '\n<!-- V643 : notifications stables JS. -->\n'
              '<script src="js/v643-notifications-stable.js?v=643">'
              '</script>\n'
          )
          
          html=html[:body_position]+js_tag+html[body_position:]
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V643
          
          PROBLÈMES CORRIGÉS
          - Notifications absentes malgré un compteur non nul.
          - Gros nombre non lu qui apparaît puis disparaît.
          - Plusieurs anciens centres de notifications en concurrence.
          - Données localStorage invalides ou dupliquées.
          - Compteur pouvant afficher une valeur incohérente.
          
          NOUVEAU FONCTIONNEMENT
          - Un seul centre de notifications et une seule cloche.
          - Migration des anciennes notifications valides.
          - Nettoyage automatique des notifications invalides.
          - Déduplication et maximum de 100 éléments.
          - Compteur calculé uniquement à partir des éléments réellement visibles.
          - Affichage plafonné à 99+.
          - Filtres Toutes / Non lues.
          - Tout marquer comme lu.
          - Supprimer les lues.
          - Lecture/non-lecture et suppression individuelles.
          - Synchronisation entre plusieurs onglets.
          - Compatibilité avec les mises à jour de builds et mods favoris.
          - Détection des nouvelles versions, sorties, notes de patch et événements.
          - Si un ancien nombre fantôme existait sans notification réelle, une seule
            notification explique que les anciennes données ont été nettoyées.
          
          AUCUN CHANGEMENT
          - Aucun changement des cartes, costumes, Alters, T.U.N.I.N.G ou builds.
          - Aucun Service Worker.
          - Aucun rechargement automatique.
          """,
              encoding="utf-8"
          )
          
          print("[OK] V643 appliqué.")
          PY
          
          cat > /tmp/verifier_v643.py <<'PY'
          
          from pathlib import Path
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          css=Path(
              "public/css/v643-notifications-stable.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v643-notifications-stable.js"
          ).read_text(encoding="utf-8")
          
          if index.count(
              "css/v643-notifications-stable.css?v=643"
          )!=1:
              raise SystemExit(
                  "[ERREUR] CSS V643 absent ou dupliqué."
              )
          
          if index.count(
              "js/v643-notifications-stable.js?v=643"
          )!=1:
              raise SystemExit(
                  "[ERREUR] JS V643 absent ou dupliqué."
              )
          
          for token in [
              "mhur_notifications_v643",
              "normalizeList",
              "rawPhantomCount",
              "99+",
              "deleteRead",
              "MHUR_NOTIFICATIONS",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS V643 incomplet : {token}"
                  )
          
          for token in [
              ".v643NoticeOverlay",
              ".v643NoticeItem.unread",
              ".v643NoticeBadge",
              "body.v643NoticeOpen",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V643 incomplet : {token}"
                  )
          
          print("[OK] Vérification V643 réussie.")
          
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v643.py
            node --check public/js/v643-notifications-stable.js
            python3 /tmp/verifier_v643.py
          
            git add     public/index.html     public/css/v643-notifications-stable.css     public/js/v643-notifications-stable.js     RAPPORT_V643_NOTIFICATIONS_STABLES.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V643 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: notifications visibles et compteur stable V643"
          
            if git push origin HEAD:main; then
              echo "[OK] V643 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V643."
          exit 1
