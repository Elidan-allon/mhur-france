name: MHUR V603 - mobile, patch notes et panels

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v603-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v603-mobile-patch-fix
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer V603
        shell: bash
        run: |
          cat > /tmp/appliquer_v603.py <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path.cwd()
          INDEX = ROOT / 'public/index.html'
          JS = ROOT / 'public/js/v603-mobile-patch-fix.js'
          CSS = ROOT / 'public/css/v603-mobile-patch-fix.css'
          REPORT = ROOT / 'RAPPORT_V603_MOBILE_PATCH_MIDORIYA_FIX.txt'

          JS_CONTENT = """
          /* MHUR Nexus - V603
             Fixes:
             - cartes HP du Patch Notes sans image de compétence
             - images alpha correctes pour les Midoriya et autres cartes du Patch Notes
             - bouton back mobile fixé à l'écran
             - cartes costumes mobiles remontées / plus propres
             - panneaux Social networks / Content creators mieux positionnés sur mobile
             - ces panneaux se ferment quand on ouvre Patch Notes / Dev Notes / profil
          */
          (function(){
            'use strict';

            if (window.MHUR_V603_PATCH_LOADED) return;
            window.MHUR_V603_PATCH_LOADED = true;

            const VERSION = '603';
            const PANEL_TITLE_KEYS = [
              'content_creators',
              'choose_a_language',
              'social_networks'
            ];

            function clean(value){
              return String(value ?? '').trim();
            }

            function norm(value){
              return clean(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '');
            }

            function assetPath(path){
              const value = clean(path).replace(/^\.?\//, '').replace(/^public\//, '');
              if(!value) return '';
              return value.includes('?') ? value : value + '?v=' + VERSION;
            }

            function isMobile(){
              return window.matchMedia('(max-width: 900px)').matches;
            }

            function getStylesMap(){
              try{
                if (typeof styles !== 'undefined' && styles) return styles;
              }catch(_e){}
              return window.styles || {};
            }

            function getCharacters(){
              try{
                if (typeof characters !== 'undefined' && Array.isArray(characters)) return characters;
              }catch(_e){}
              return Array.isArray(window.characters) ? window.characters : [];
            }

            function getCharacterByName(label){
              const wanted = norm(label);
              if (!wanted) return null;
              const chars = getCharacters();
              const exact = chars.find(ch => norm(ch?.id) === wanted || norm(ch?.name) === wanted);
              if (exact) return exact;
              let best = null, score = 0;
              chars.forEach(ch => {
                const id = norm(ch?.id);
                const name = norm(ch?.name);
                let s = 0;
                if (id && wanted.includes(id)) s = Math.max(s, 1000 + id.length);
                if (name && wanted.includes(name)) s = Math.max(s, 1000 + name.length);
                if (id && id.includes(wanted)) s = Math.max(s, 600 + wanted.length);
                if (name && name.includes(wanted)) s = Math.max(s, 600 + wanted.length);
                if (s > score){ score = s; best = ch; }
              });
              return best;
            }

            function explicitStyleId(characterText, styleText){
              const character = norm(characterText);
              const style = norm(styleText);

              if (character.includes('izuku_midoriya_ofa')) return 'ofa';
              if (character.includes('armored_all_might')) return 'armored_all_might_technical';
              if (character.includes('lady_nagant')) return 'lady_nagant_strike';
              if (character.includes('denki_kaminari')) return 'kaminari_strike';
              if (character.includes('itsuka_kendo')) return 'kendo_assault';
              if (character === 'hawks' || character.startsWith('hawks_')) return 'hawks_rapid';
              if (character === 'twice' || character.startsWith('twice_')) return 'twice_rapid';
              if (character.includes('mirio_togata')){
                if (style.includes('sheer_counter') || style.includes('contre') || style.includes('counter')) return 'mirio_technical';
                return 'mirio_rapid';
              }
              if (character.includes('katsuki_bakugo')){
                if (character.includes('cluster') || style.includes('cluster')) return 'bakugo_technical';
                return 'bakugo_attack';
              }
              return '';
            }

            function getStyleForCard(card, character){
              const stylesMap = getStylesMap();
              const styleName = clean(card.querySelector(':scope > header strong')?.textContent || '');
              const styleIds = Array.isArray(character?.styles) ? character.styles.map(String) : [];
              const explicit = explicitStyleId(
                clean(card.querySelector(':scope > header h4')?.textContent || ''),
                styleName
              );
              if (explicit && stylesMap[explicit]) return { id: explicit, data: stylesMap[explicit] };
              const wanted = norm(styleName || 'Original');
              let id = styleIds.find(styleId => norm(stylesMap[styleId]?.name || 'original') === wanted) || '';
              if (!id) id = styleIds[0] || '';
              return { id, data: id ? stylesMap[id] : null };
            }

            function patchLetterKey(value){
              const raw = clean(value);
              if (/^(?:α|a|alpha)(?:\s|[-—:(]|$)/i.test(raw)) return 'alpha';
              if (/^(?:β|b|beta)(?:\s|[-—:(]|$)/i.test(raw)) return 'beta';
              if (/^(?:γ|g|y|gamma)(?:\s|[-—:(]|$)/i.test(raw)) return 'gamma';
              if (/^(?:sp|special|special_action|action_speciale|action_spéciale)(?:\s|[-—:(]|$)/i.test(norm(raw))) return 'special';
              return '';
            }

            function getChangeTitle(change){
              return clean(change.querySelector('h5')?.textContent || '');
            }

            function getChangeBar(change){
              return clean(change.querySelector('.miniTableTitle, .s18PatchChangeBarV10, .s18PatchStatBarV10, .s18PatchLabelV10')?.textContent || '');
            }

            function isHpChange(change){
              return norm(getChangeTitle(change)) === 'hp' || norm(getChangeBar(change)) === 'hp';
            }

            const SKILL_TITLE_OVERRIDES = {
              delaware_smash_air_force: 'alpha',
              delaware_smash_airblast: 'alpha',
              delaware_smash_full_bullet: 'alpha',
              texas_smash: 'alpha',
              ice_bullet_shot: 'alpha',
              ice_bullet: 'alpha',
              ap_shot_cluster: 'alpha',
              electro_target: 'alpha',
              phantom_smash: 'alpha',
              wingbeat: 'alpha',
              hollow_point_shot: 'alpha',
              nitro_cluster: 'beta',
              wind_cross: 'beta',
              high_angle_fire: 'beta',
              howitzer_impact: 'gamma',
              foot_boost: 'gamma',
              big_fist_grip: 'gamma',
              kickback_shot: 'gamma',
              electrification: 'special',
              scope_mode: 'special'
            };

            function inferSkillKey(change){
              if (isHpChange(change)) return '';
              const title = norm(getChangeTitle(change));
              const fromLetter = patchLetterKey(getChangeTitle(change));
              if (fromLetter) return fromLetter;
              for (const key in SKILL_TITLE_OVERRIDES){
                if (title.includes(key)) return SKILL_TITLE_OVERRIDES[key];
              }
              return '';
            }

            function scoreSkillMatch(skill, titleText){
              const skillName = norm(skill?.name || '');
              if (!skillName || !titleText) return 0;
              if (skillName === titleText) return 5000;
              if (titleText.includes(skillName)) return 4000 + skillName.length;
              if (skillName.includes(titleText)) return 3000 + titleText.length;
              let score = 0;
              Object.keys(SKILL_TITLE_OVERRIDES).forEach(key => {
                if (titleText.includes(key) && skillName.includes(key)) score = Math.max(score, 4500 + key.length);
              });
              return score;
            }

            function findSkillForChange(styleData, change){
              if (!styleData || isHpChange(change)) return null;
              const skills = [
                ...(Array.isArray(styleData.skills) ? styleData.skills : []),
                styleData.special ? Object.assign({}, styleData.special, { letter: 'SP' }) : null
              ].filter(Boolean);
              const titleText = norm(getChangeTitle(change));
              let best = null, bestScore = 0;
              skills.forEach(skill => {
                const score = scoreSkillMatch(skill, titleText);
                if (score > bestScore){ bestScore = score; best = skill; }
              });
              if (best) return best;
              const inferred = inferSkillKey(change);
              if (inferred){
                return skills.find(skill => patchLetterKey(skill?.letter) === inferred) || null;
              }
              return null;
            }

            function ensureImageBox(layout){
              const main = layout?.querySelector(':scope > main');
              if (!layout || !main) return null;
              let box = [...layout.children].find(child => child !== main && child.tagName === 'DIV');
              if (!box){
                box = document.createElement('div');
                box.className = 'mhurV603SkillImageBox';
                layout.insertBefore(box, main);
              }
              return box;
            }

            function removeSkillImage(change){
              const layout = change.querySelector('.s18PatchSkillV10');
              const main = layout?.querySelector(':scope > main');
              if (!layout || !main) return;
              [...layout.children].forEach(child => {
                if (child !== main && child.tagName === 'DIV') child.remove();
              });
              layout.classList.add('mhurV603NoSkillImage');
            }

            function setSkillImage(change, imgPath, altText){
              const layout = change.querySelector('.s18PatchSkillV10');
              if (!layout) return;
              const box = ensureImageBox(layout);
              if (!box) return;
              layout.classList.remove('mhurV603NoSkillImage');
              let img = box.querySelector('img');
              if (!img){
                img = document.createElement('img');
                img.loading = 'lazy';
                img.decoding = 'async';
                box.replaceChildren(img);
              }
              img.removeAttribute('srcset');
              img.alt = altText || '';
              const src = assetPath(imgPath);
              if (src && img.getAttribute('src') !== src) img.setAttribute('src', src);
            }

            function fixPatchCharacterCard(card){
              const characterName = clean(card.querySelector(':scope > header h4')?.textContent || '');
              const character = getCharacterByName(characterName);
              if (!character) return;
              const styleInfo = getStyleForCard(card, character);
              const styleData = styleInfo.data;

              card.querySelectorAll('.s18PatchChangeV10').forEach(change => {
                if (isHpChange(change)){
                  removeSkillImage(change);
                  return;
                }
                const skill = findSkillForChange(styleData, change);
                if (skill && skill.img){
                  setSkillImage(change, skill.img, getChangeTitle(change) || skill.name || characterName);
                }
              });
            }

            function fixAllPatchCards(){
              document.querySelectorAll('.s18PatchCharacterV10').forEach(fixPatchCharacterCard);
            }

            function panelTitleText(panel){
              const heading = panel.querySelector('h1, h2, h3, h4, strong');
              return norm(heading?.textContent || panel.textContent || '');
            }

            function looksLikeNamedPanel(el){
              if (!(el instanceof HTMLElement)) return false;
              const text = panelTitleText(el);
              if (!text) return false;
              return PANEL_TITLE_KEYS.some(key => text.includes(key));
            }

            function findNamedPanels(){
              return Array.from(document.querySelectorAll('div, section, aside')).filter(looksLikeNamedPanel);
            }

            function fixNamedPanels(){
              if (!isMobile()) return;
              findNamedPanels().forEach(panel => {
                panel.classList.add('mhurV603NamedPanel');
                const closeBtn = Array.from(panel.querySelectorAll('button, a, div')).find(el => {
                  const txt = clean(el.textContent);
                  return txt === '×' || txt === '✕' || txt === 'x';
                });
                if (closeBtn) closeBtn.classList.add('mhurV603PanelClose');
              });
            }

            function closeNamedPanels(){
              findNamedPanels().forEach(panel => {
                const closeBtn = panel.querySelector('.mhurV603PanelClose') || Array.from(panel.querySelectorAll('button, a, div')).find(el => {
                  const txt = clean(el.textContent);
                  return txt === '×' || txt === '✕' || txt === 'x';
                });
                if (closeBtn && typeof closeBtn.click === 'function') closeBtn.click();
              });
            }

            function isPatchOrProfileTrigger(target){
              if (!(target instanceof Element)) return false;
              const txt = norm(target.textContent || '');
              const combo = norm((target.id || '') + ' ' + (target.className || '') + ' ' + (target.getAttribute('aria-label') || ''));
              return (
                txt.includes('patch_notes') ||
                txt.includes('dev_notes') ||
                combo.includes('patch') ||
                combo.includes('dev_notes') ||
                combo.includes('profile') ||
                combo.includes('avatar') ||
                combo.includes('creator')
              );
            }

            function looksLikeBackButton(el){
              if (!(el instanceof HTMLElement)) return false;
              const txt = clean(el.textContent || '');
              const combo = norm((el.id || '') + ' ' + (el.className || '') + ' ' + (el.getAttribute('aria-label') || '') + ' ' + (el.getAttribute('title') || ''));
              return txt === '↑' || txt === '⬆' || txt === '⌃' || combo.includes('back_to_top') || combo.includes('scroll_top') || combo.includes('back_button') || combo.includes('top_button');
            }

            function fixBackButtons(){
              if (!isMobile()) return;
              Array.from(document.querySelectorAll('button, a, div')).filter(looksLikeBackButton).forEach(el => {
                el.classList.add('mhurV603FixedBack');
              });
            }

            function findCostumeCards(){
              const cards = new Set();
              Array.from(document.querySelectorAll('a, article, div')).forEach(el => {
                if (!(el instanceof HTMLElement)) return;
                const txt = norm(el.textContent || '');
                const imgs = el.querySelectorAll('img').length;
                if (imgs < 1) return;
                if (!/(original|villain_style|villain style|casual|battle|costume)/.test(txt)) return;
                const rect = el.getBoundingClientRect();
                if (rect.height < 180 || rect.width < 120) return;
                cards.add(el);
              });
              return Array.from(cards);
            }

            function enhanceCostumeCards(){
              if (!isMobile()) return;
              findCostumeCards().forEach(card => {
                card.classList.add('mhurV603CostumeCard');
                const imgs = Array.from(card.querySelectorAll('img'));
                if (imgs[0]) imgs[0].classList.add('mhurV603CostumeMainImage');
                imgs.slice(-2).forEach(img => img.classList.add('mhurV603CostumeTuningIcon'));
                Array.from(card.querySelectorAll('h3, h4, strong, span, div')).forEach(el => {
                  const txt = norm(el.textContent || '');
                  if (/^(original|villain_style|villain style|casual|battle|default)$/.test(txt)){
                    el.classList.add('mhurV603CostumeVariantName');
                  }
                });
              });
            }

            function refreshAll(){
              fixAllPatchCards();
              fixNamedPanels();
              fixBackButtons();
              enhanceCostumeCards();
            }

            let scheduled = false;
            function schedule(){
              if (scheduled) return;
              scheduled = true;
              requestAnimationFrame(() => {
                scheduled = false;
                try { refreshAll(); } catch(_error){}
              });
            }

            const observer = new MutationObserver(() => schedule());
            function start(){
              schedule();
              observer.observe(document.documentElement, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class', 'style', 'src', 'hidden']
              });
            }

            if (document.readyState === 'loading'){
              document.addEventListener('DOMContentLoaded', start, { once: true });
            } else {
              start();
            }

            window.addEventListener('load', schedule, { once: true });
            window.addEventListener('resize', schedule);

            document.addEventListener('click', function(event){
              const target = event.target;
              if (isPatchOrProfileTrigger(target) || (target && target.closest && target.closest('[data-patch-index], #mhurPatchDevButtonV14'))){
                closeNamedPanels();
                setTimeout(schedule, 0);
                setTimeout(schedule, 120);
                setTimeout(schedule, 300);
              }
            }, true);

            window.MHUR_V603_PATCH = { refresh: refreshAll, version: VERSION };
          })();
          """

          CSS_CONTENT = """
          /* MHUR Nexus - V603 */
          .s18PatchSkillV10.mhurV603NoSkillImage,
          #s18NotesDevModalV10 .s18PatchSkillV10.mhurV603NoSkillImage{
            display: block !important;
            width: 100% !important;
            min-width: 0 !important;
          }
          .s18PatchSkillV10.mhurV603NoSkillImage > main,
          #s18NotesDevModalV10 .s18PatchSkillV10.mhurV603NoSkillImage > main{
            display: block !important;
            width: 100% !important;
            max-width: none !important;
          }
          .s18PatchSkillV10 > div img,
          #s18NotesDevModalV10 .s18PatchSkillV10 > div img{
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            display: block !important;
          }

          @media (max-width: 900px){
            .mhurV603FixedBack{
              position: fixed !important;
              right: 18px !important;
              bottom: 22px !important;
              z-index: 9999 !important;
            }

            .mhurV603NamedPanel{
              top: 92px !important;
              margin-top: 0 !important;
              max-height: calc(100dvh - 115px) !important;
              overflow: auto !important;
            }

            .mhurV603CostumeCard{
              padding-top: 6px !important;
            }
            .mhurV603CostumeMainImage{
              transform: translateY(-8px) !important;
            }
            .mhurV603CostumeVariantName{
              display: block !important;
              margin-top: -6px !important;
              position: relative !important;
            }
            .mhurV603CostumeTuningIcon{
              position: relative !important;
              transform: translateY(-10px) !important;
            }
          }
          """

          def fail(message):
              raise RuntimeError(message)

          def read(path):
              if not path.is_file():
                  fail('Fichier introuvable : ' + path.as_posix())
              return path.read_text(encoding='utf-8-sig')

          def write(path, content):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.rstrip() + '\n', encoding='utf-8')

          def strip_existing(html):
              patterns = [
                  r"\s*<link\b[^>]*href=['\"][^'\"]*v603-mobile-patch-fix\.css[^'\"]*['\"][^>]*>\s*",
                  r"\s*<script\b[^>]*src=['\"][^'\"]*v603-mobile-patch-fix\.js[^'\"]*['\"][^>]*>\s*</script>\s*",
              ]
              for pattern in patterns:
                  html = re.sub(pattern, '\n', html, flags=re.I)
              return html

          def patch_index():
              html = strip_existing(read(INDEX))
              if '</head>' not in html or '</body>' not in html:
                  fail('Balises </head> ou </body> introuvables dans public/index.html')
              html = html.replace('</head>', '\n<link rel="stylesheet" href="css/v603-mobile-patch-fix.css?v=603">\n</head>', 1)
              html = html.replace('</body>', '\n<script src="js/v603-mobile-patch-fix.js?v=603"></script>\n</body>', 1)
              write(INDEX, html)

          def verify():
              html = read(INDEX)
              js = read(JS)
              css = read(CSS)
              errors = []
              for token in [
                  'css/v603-mobile-patch-fix.css?v=603',
                  'js/v603-mobile-patch-fix.js?v=603',
              ]:
                  if token not in html:
                      errors.append('Référence index absente : ' + token)
              for token in [
                  'function isHpChange',
                  'function findSkillForChange',
                  'function closeNamedPanels',
                  'function enhanceCostumeCards',
                  'window.MHUR_V603_PATCH',
                  'delaware_smash_air_force',
              ]:
                  if token not in js:
                      errors.append('Correctif JS absent : ' + token)
              if 'mhurV603NamedPanel' not in css or 'mhurV603FixedBack' not in css:
                  errors.append('Correctif CSS incomplet')
              syntax = subprocess.run(['node', '--check', str(JS)], text=True, capture_output=True)
              if syntax.returncode:
                  errors.append('Syntaxe JavaScript invalide : ' + syntax.stderr)
              if errors:
                  fail('Vérification V603 échouée :\n- ' + '\n- '.join(errors))

          def main():
              write(JS, JS_CONTENT)
              write(CSS, CSS_CONTENT)
              patch_index()
              verify()
              report = '\n'.join([
                  'MHUR FRANCE - RAPPORT V603',
                  '',
                  'CORRECTIONS APPLIQUEES',
                  '- Patch Notes : les cartes HP n\'affichent plus d\'image de compétence.',
                  '- Patch Notes : meilleure détection des vraies images alpha, surtout pour Midoriya.',
                  '- Mobile : bouton back fixé à l\'écran.',
                  '- Mobile : cartes costumes remontées (photo, variante, tuning).',
                  '- Mobile : panneaux Social networks et Content creators descendent plus bas.',
                  '- Ouverture Patch Notes / Dev Notes / profil : fermeture des panneaux Social/Creator.',
                  '',
                  'FICHIERS AJOUTES',
                  '- public/js/v603-mobile-patch-fix.js',
                  '- public/css/v603-mobile-patch-fix.css',
              ])
              write(REPORT, report)
              print('[OK] V603 appliqué et vérifié.')

          if __name__ == '__main__':
              main()
          PY
          python3 /tmp/appliquer_v603.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/js/v603-mobile-patch-fix.js public/css/v603-mobile-patch-fix.css RAPPORT_V603_MOBILE_PATCH_MIDORIYA_FIX.txt .github/workflows/mhur-v603-auto.yml
          git diff --cached --quiet && echo "Aucun changement" && exit 0
          git commit -m "Fix mobile, Patch Notes et panneaux V603"
          git push
