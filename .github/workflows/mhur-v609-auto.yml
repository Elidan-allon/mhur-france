name: MHUR V609 - Images Alpha Midoriya personnages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v609-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v609-midoriya-alpha-personnages
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verifier les images locales
        shell: bash
        run: |
          set -euo pipefail

          fichiers=(
            "public/assets/midoriya/midoriya_assault/alpha.webp"
            "public/assets/midoriya/midoriya_assault/alpha_fullburst.webp"
            "public/assets/midoriya/midoriya_attack/alpha.webp"
            "public/assets/midoriya_ofa/alpha.webp"
          )

          for fichier in "${fichiers[@]}"; do
            if [[ ! -f "$fichier" ]]; then
              echo "[ERREUR] Image introuvable : $fichier"
              exit 1
            fi
          done

          echo "[OK] Les images Alpha de Midoriya sont presentes."

      - name: Installer le correctif V609
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/js

          cat > public/js/v609-midoriya-alpha-personnages.js <<'JS'
          /* MHUR Nexus — V609
             Correctif cible des images Alpha de Midoriya dans les fiches personnages.

             Ce correctif :
             - impose les trois chemins locaux exacts ;
             - agit uniquement sur Original, Full Bullet et OFA ;
             - ne modifie pas Beta, Gamma, les actions speciales ou les autres personnages ;
             - conserve l'image speciale Full Burst de l'Original ;
             - passe apres les anciennes couches de compatibilite.
          */
          (function(){
            'use strict';

            if(window.MHUR_V609_MIDORIYA_ALPHA_LOADED)return;
            window.MHUR_V609_MIDORIYA_ALPHA_LOADED=true;

            const VERSION='609';

            const EXACT=Object.freeze({
              assault:Object.freeze({
                alpha:'assets/midoriya/midoriya_assault/alpha.webp',
                alphaSub:'assets/midoriya/midoriya_assault/alpha_fullburst.webp'
              }),
              fullbullet:Object.freeze({
                alpha:'assets/midoriya/midoriya_attack/alpha.webp'
              }),
              ofa:Object.freeze({
                alpha:'assets/midoriya_ofa/alpha.webp'
              })
            });

            function clean(value){
              return String(value??'').trim();
            }

            function normal(value){
              return clean(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g,'')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g,'_')
                .replace(/^_+|_+$/g,'');
            }

            function isAlpha(value){
              const raw=clean(value);
              const key=normal(raw);

              return (
                /^(?:α|a|alpha)(?:\s|[-—:(]|$)/i.test(raw)||
                key==='alpha'||
                key.startsWith('alpha_')
              );
            }

            function stylesMap(){
              try{
                if(
                  typeof styles!=='undefined'&&
                  styles&&
                  typeof styles==='object'
                ){
                  return styles;
                }
              }catch(_error){}

              return window.styles||{};
            }

            function currentStyleId(){
              try{
                if(
                  typeof selectedStyle!=='undefined'&&
                  selectedStyle
                ){
                  return String(selectedStyle);
                }
              }catch(_error){}

              return clean(
                window.selectedStyle||
                document.querySelector(
                  '.styleCard.active[data-style], [data-style].active'
                )?.dataset?.style||
                ''
              );
            }

            function mainAlphaSkill(style){
              if(!style||!Array.isArray(style.skills))return null;

              return style.skills.find(skill=>
                isAlpha(skill?.letter)
              )||null;
            }

            function patchDatabase(){
              const database=window.MHUR_DATABASE_ASSETS=
                window.MHUR_DATABASE_ASSETS||{};

              database.styles=database.styles||{};

              Object.entries(EXACT).forEach(([styleId,paths])=>{
                const target=database.styles[styleId]=
                  database.styles[styleId]||{};

                /*
                  Les IDs utilises par les fiches sont :
                  assault, fullbullet et ofa.
                  On corrige uniquement leur cle Alpha.
                */
                target.alpha=paths.alpha;
              });
            }

            function patchObjects(){
              patchDatabase();

              const map=stylesMap();

              Object.entries(EXACT).forEach(([styleId,paths])=>{
                const style=map[styleId];
                const alpha=mainAlphaSkill(style);

                if(!alpha)return;

                alpha.img=paths.alpha;

                /*
                  L'Original possede un second affichage Alpha :
                  Delaware Smash Air Force Full Burst.
                  Il garde son fichier dedie et ne doit surtout pas
                  recevoir l'image de l'Alpha principal.
                */
                if(
                  styleId==='assault'&&
                  alpha.sub&&
                  isAlpha(alpha.sub.letter)&&
                  paths.alphaSub
                ){
                  alpha.sub.img=paths.alphaSub;
                }
              });
            }

            function versionedAbsolute(path){
              const cleanPath=clean(path)
                .replace(/^\.?\//,'')
                .replace(/^public\//,'');

              return `/${cleanPath}?v=${VERSION}`;
            }

            function clearOldFallbacks(image){
              if(!image)return;

              image.onerror=null;
              image.removeAttribute('onerror');
              image.removeAttribute('srcset');

              if(image.dataset){
                delete image.dataset.s18Fallbacks;
                delete image.dataset.s18v13Fallbacks;
                delete image.dataset.s18v14Fallbacks;
                delete image.dataset.s18v14Applied;
                delete image.dataset.v589Fallbacks;
              }
            }

            function setImage(block,path,kind){
              if(!block||!path)return;

              const image=block.querySelector(
                '.skillImgBox img, .skillImg img, img'
              );

              if(!image)return;

              clearOldFallbacks(image);

              const wanted=versionedAbsolute(path);

              if(image.getAttribute('src')!==wanted){
                image.setAttribute('src',wanted);
              }

              image.setAttribute('loading','eager');
              image.setAttribute('decoding','async');
              image.setAttribute('fetchpriority','high');
              image.dataset.mhurV609MidoriyaAlpha=kind;
            }

            function alphaBlocks(){
              return Array.from(
                document.querySelectorAll('.charPanel .skill')
              ).filter(block=>{
                const heading=block.querySelector('.skillHead');

                return isAlpha(heading?.textContent||'');
              });
            }

            function repairCharacterPage(){
              const styleId=currentStyleId();
              const paths=EXACT[styleId];

              if(!paths)return;

              const blocks=alphaBlocks();

              /*
                Le premier bloc Alpha est toujours la competence Alpha
                principale du style selectionne.
              */
              setImage(blocks[0],paths.alpha,'main');

              /*
                Chez Midoriya Original uniquement, le second bloc Alpha
                est Full Burst et possede sa propre image.
              */
              if(styleId==='assault'&&paths.alphaSub){
                const fullBurstBlock=blocks.find((block,index)=>{
                  if(index===0)return false;

                  const heading=normal(
                    block.querySelector('.skillHead')?.textContent||''
                  );

                  return heading.includes('full_burst');
                })||blocks[1];

                setImage(fullBurstBlock,paths.alphaSub,'full-burst');
              }
            }

            function refresh(){
              patchObjects();
              repairCharacterPage();
            }

            function getRender(){
              try{
                if(typeof render==='function')return render;
              }catch(_error){}

              return typeof window.render==='function'
                ?window.render
                :null;
            }

            function wrapRender(){
              const original=getRender();

              if(
                typeof original!=='function'||
                original.__mhurV609MidoriyaAlpha
              ){
                return;
              }

              const wrapped=function(){
                /*
                  Corrige la base AVANT les couches precedentes :
                  season18-fixes lira donc deja les bons chemins.
                */
                patchObjects();

                const result=original.apply(this,arguments);

                /*
                  Puis reverifie les objets et le DOM APRES le rendu.
                */
                patchObjects();
                repairCharacterPage();
                requestAnimationFrame(repairCharacterPage);

                return result;
              };

              wrapped.__mhurV609MidoriyaAlpha=true;
              wrapped.__mhurV609Original=original;

              window.render=wrapped;

              try{
                render=wrapped;
              }catch(_error){}
            }

            let queued=false;

            function schedule(){
              if(queued)return;

              queued=true;

              requestAnimationFrame(()=>{
                queued=false;
                patchObjects();
                wrapRender();
                repairCharacterPage();
              });
            }

            patchObjects();
            wrapRender();

            if(document.readyState==='loading'){
              document.addEventListener(
                'DOMContentLoaded',
                ()=>{
                  patchObjects();
                  wrapRender();
                  repairCharacterPage();
                  schedule();
                },
                {once:true}
              );
            }else{
              repairCharacterPage();
              schedule();
            }

            window.addEventListener(
              'load',
              ()=>{
                patchObjects();
                wrapRender();
                repairCharacterPage();
                schedule();
              },
              {once:true}
            );

            window.addEventListener('popstate',schedule);
            window.addEventListener('hashchange',schedule);
            window.addEventListener('mhur:languagechange',schedule);

            /*
              Les changements de personnage/style passent deja par render.
              Ce filet leger couvre aussi les anciens boutons qui mettent
              parfois le DOM a jour dans une tache suivante.
            */
            document.addEventListener('click',schedule,true);

            window.MHUR_V609_MIDORIYA_ALPHA={
              version:VERSION,
              paths:EXACT,
              refresh,
              patchObjects,
              repairCharacterPage
            };
          })();
          JS

          python3 <<'PY'
          from pathlib import Path
          import re

          index_path = Path("public/index.html")
          report_path = Path("RAPPORT_V609_MIDORIYA_ALPHA_PERSONNAGES.txt")

          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html est introuvable.")

          html = index_path.read_text(encoding="utf-8")

          # Nettoyage idempotent d'une eventuelle ancienne installation V609.
          html = re.sub(
              r'\s*<!-- V609 : images Alpha Midoriya dans les fiches personnages\. -->\s*'
              r'<script\s+src=["\']js/v609-midoriya-alpha-personnages\.js(?:\?[^"\']*)?["\']'
              r'\s*></script>\s*',
              "\n",
              html,
              flags=re.I
          )
          html = re.sub(
              r'\s*<script\s+src=["\']js/v609-midoriya-alpha-personnages\.js(?:\?[^"\']*)?["\']'
              r'\s*></script>\s*',
              "\n",
              html,
              flags=re.I
          )

          # Remplace uniquement les prechargements des trois Alpha concernes.
          alpha_paths = [
              "assets/midoriya/midoriya_assault/alpha.webp",
              "assets/midoriya/midoriya_attack/alpha.webp",
              "assets/midoriya_ofa/alpha.webp",
          ]

          for path in alpha_paths:
              html = re.sub(
                  rf'\s*<link\s+rel=["\']preload["\']\s+as=["\']image["\']'
                  rf'\s+href=["\']/+{re.escape(path)}(?:\?[^"\']*)?["\']'
                  rf'[^>]*>\s*',
                  "\n",
                  html,
                  flags=re.I
              )

          preload = "\n".join(
              f'<link rel="preload" as="image" href="/{path}?v=609" fetchpriority="high">'
              for path in alpha_paths
          )

          if "</head>" not in html:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")

          html = html.replace(
              "</head>",
              preload + "\n</head>",
              1
          )

          script = (
              '<!-- V609 : images Alpha Midoriya dans les fiches personnages. -->\n'
              '<script src="js/v609-midoriya-alpha-personnages.js?v=609"></script>\n'
          )

          if "</body>" not in html:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")

          html = html.replace(
              "</body>",
              script + "</body>",
              1
          )

          index_path.write_text(html, encoding="utf-8")

          report_lines = [
              "MHUR NEXUS — RAPPORT V609",
              "CORRECTIF DES IMAGES ALPHA DE MIDORIYA DANS LES FICHES PERSONNAGES",
              "",
              "CIBLE",
              "- Midoriya Original :",
              "  assets/midoriya/midoriya_assault/alpha.webp",
              "- Midoriya Full Bullet :",
              "  assets/midoriya/midoriya_attack/alpha.webp",
              "- Midoriya OFA :",
              "  assets/midoriya_ofa/alpha.webp",
              "- Sous-competence Full Burst de l'Original :",
              "  assets/midoriya/midoriya_assault/alpha_fullburst.webp",
              "",
              "PROTECTION",
              "- Aucune image Beta ou Gamma n'est modifiee.",
              "- Aucune action speciale n'est modifiee.",
              "- Aucun autre personnage n'est modifie.",
              "- Les tableaux, textes, traductions, PV, T.U.N.I.N.G,",
              "  costumes, builds et Patch Notes ne sont pas modifies.",
              "- Le correctif est idempotent : relancer le workflow",
              "  ne duplique ni le script ni les prechargements.",
              "",
              "FICHIERS MODIFIES/AJOUTES",
              "- public/index.html",
              "- public/js/v609-midoriya-alpha-personnages.js",
              "- RAPPORT_V609_MIDORIYA_ALPHA_PERSONNAGES.txt",
          ]

          report_path.write_text(
              "\n".join(report_lines) + "\n",
              encoding="utf-8"
          )

          print("[OK] V609 installe dans public/index.html.")
          PY

      - name: Controler le correctif
        shell: bash
        run: |
          set -euo pipefail

          node --check public/js/v609-midoriya-alpha-personnages.js

          python3 <<'PY'
          from pathlib import Path

          html = Path("public/index.html").read_text(encoding="utf-8")
          js = Path(
              "public/js/v609-midoriya-alpha-personnages.js"
          ).read_text(encoding="utf-8")

          reference = (
              'js/v609-midoriya-alpha-personnages.js?v=609'
          )

          if html.count(reference) != 1:
              raise SystemExit(
                  "[ERREUR] La reference V609 doit apparaitre exactement une fois."
              )

          checks = [
              "assets/midoriya/midoriya_assault/alpha.webp",
              "assets/midoriya/midoriya_assault/alpha_fullburst.webp",
              "assets/midoriya/midoriya_attack/alpha.webp",
              "assets/midoriya_ofa/alpha.webp",
          ]

          for value in checks:
              if value not in js:
                  raise SystemExit(
                      f"[ERREUR] Chemin absent du correctif : {value}"
                  )

          preloads = [
              "/assets/midoriya/midoriya_assault/alpha.webp?v=609",
              "/assets/midoriya/midoriya_attack/alpha.webp?v=609",
              "/assets/midoriya_ofa/alpha.webp?v=609",
          ]

          for value in preloads:
              if html.count(value) != 1:
                  raise SystemExit(
                      f"[ERREUR] Prechargement absent ou duplique : {value}"
                  )

          if "</body>" not in html or html.index(reference) > html.index("</body>"):
              raise SystemExit(
                  "[ERREUR] Le script V609 n'est pas charge avant </body>."
              )

          print("[OK] Controle statique V609 valide.")
          PY

          echo
          echo "Fichiers prepares :"
          git status --short

      - name: Enregistrer automatiquement les changements
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/index.html \
            public/js/v609-midoriya-alpha-personnages.js \
            RAPPORT_V609_MIDORIYA_ALPHA_PERSONNAGES.txt

          if git diff --cached --quiet; then
            echo "[INFO] V609 est deja applique. Aucun commit necessaire."
            exit 0
          fi

          git commit -m "fix: images Alpha Midoriya dans les fiches personnages V609"

          for tentative in 1 2 3; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "[OK] V609 envoye sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative de push : $tentative/3"
            sleep 3
          done

          echo "[ERREUR] Impossible d'envoyer le commit apres trois tentatives."
          exit 1
