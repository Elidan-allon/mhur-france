name: MHUR V615.2 - Uniformiser les costumes mobile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v615-auto-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v615-mobile-costume-images
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V615.1
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' '' | base64 --decode > /tmp/apply_v615.py
          printf '%s' '' | base64 --decode > /tmp/verify_v615.py

          python3 -m py_compile /tmp/apply_v615.py /tmp/verify_v615.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="

            git fetch origin main
            git reset --hard origin/main

            python3 /tmp/apply_v615.py
            node --check public/js/v615-mobile-costume-image-balance.js
            python3 /tmp/verify_v615.py

            git add \
              public/index.html \
              public/js/v615-mobile-costume-image-balance.js \
              public/css/v615-mobile-costume-image-balance.css \
              RAPPORT_V615_COSTUMES_MOBILE_UNIFORMES.txt

            if git diff --cached --quiet; then
              echo "[INFO] V615.1 est deja applique."
              exit 0
            fi

            git commit -m "fix: uniformiser les photos de costumes mobile V615.1"

            if git push origin HEAD:main; then
              echo "[OK] V615.1 envoye sur main."
              exit 0
            fi

            echo "[ATTENTE] main a change pendant le push."
            sleep $((tentative * 3))
          done

          echo "[ERREUR] Impossible d'envoyer V615.1 apres cinq tentatives."
          exit 1
