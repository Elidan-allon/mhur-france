name: MHUR V604C - corriger Shoto beta

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v604c-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v604c-shoto-beta
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer V604C
        shell: bash
        run: |
          cat > /tmp/appliquer_v604c.py <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT=Path.cwd()
          INDEX=ROOT/'public/index.html'
          JS=ROOT/'public/js/v604c-shoto-beta-fix.js'
          REPORT=ROOT/'RAPPORT_V604C_SHOTO_BETA.txt'

          JS_CONTENT="/* MHUR Nexus — V604C */\n(function(){\n  'use strict';\n\n  if(window.MHUR_V604C_LOADED)return;\n  window.MHUR_V604C_LOADED=true;\n\n  const TEXT={\n    fr:{\n      name:'Mur de glace transperçant les cieux',\n      desc:'Crée un immense bloc de glace dans la direction visée. Le bloc de glace peut traverser les murs.'\n    },\n    en:{\n      name:'Heaven-Piercing Ice Wall',\n      desc:'Creates a massive block of ice in the aim direction. The ice block can pass through walls.'\n    }\n  };\n\n  function clean(value){\n    return String(value??'').trim();\n  }\n\n  function normal(value){\n    return clean(value)\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g,'_')\n      .replace(/^_+|_+$/g,'');\n  }\n\n  function language(){\n    try{\n      if(typeof lang!=='undefined'&&(lang==='fr'||lang==='en')){\n        return lang;\n      }\n    }catch(_error){}\n\n    const html=clean(document.documentElement.lang).toLowerCase();\n    if(html.startsWith('en'))return 'en';\n    if(html.startsWith('fr'))return 'fr';\n\n    return 'fr';\n  }\n\n  function styleMap(){\n    try{\n      if(typeof styles!=='undefined'&&styles)return styles;\n    }catch(_error){}\n    return window.styles||{};\n  }\n\n  function betaSkill(style){\n    if(!style||!Array.isArray(style.skills))return null;\n\n    return style.skills.find(skill=>\n      /^(?:β|b|beta)(?:\\s|[-—:(]|$)/i.test(\n        clean(skill?.letter)\n      )\n    )||null;\n  }\n\n  function shotoTechnicalStyle(){\n    const map=styleMap();\n\n    for(const id of [\n      'shoto_technical',\n      'todoroki_technical',\n      'shoto_todoroki_technical'\n    ]){\n      if(map[id])return map[id];\n    }\n\n    const entry=Object.entries(map).find(([id,style])=>{\n      const joined=normal(\n        id+' '+clean(style?.name)+' '+clean(style?.role)\n      );\n\n      return (\n        (\n          joined.includes('shoto')||\n          joined.includes('todoroki')\n        )&&\n        (\n          joined.includes('technical')||\n          joined.includes('technique')\n        )\n      );\n    });\n\n    return entry?.[1]||null;\n  }\n\n  function patchData(){\n    const beta=betaSkill(shotoTechnicalStyle());\n    if(!beta)return false;\n\n    const current=TEXT[language()];\n    beta.name=current.name;\n    beta.desc=current.desc;\n    beta.description=current.desc;\n\n    return true;\n  }\n\n  function looksLikeTarget(element){\n    const image=normal(\n      element.querySelector('img')?.getAttribute('src')\n    );\n\n    if(\n      (\n        image.includes('shoto')||\n        image.includes('todoroki')\n      )&&\n      image.includes('beta')\n    ){\n      return true;\n    }\n\n    const text=normal(element.textContent);\n\n    return (\n      text.includes('heaven_piercing_ice_wall')||\n      text.includes('mur_de_glace_transpercant')||\n      text.includes('cascada_de_hielo_rasgadora')||\n      text.includes('causes_an_explosion')||\n      text.includes('blast_pierces_walls')\n    );\n  }\n\n  function patchDom(){\n    const current=TEXT[language()];\n\n    document.querySelectorAll(\n      '.charPanel .skill,'+\n      '.charPanel .gamePanel,'+\n      '[data-skill-letter=\"beta\"]'\n    ).forEach(element=>{\n      if(!looksLikeTarget(element))return;\n\n      const heading=element.querySelector(\n        '.skillHead,.skillTitle,.gameName,h2,h3,h4'\n      );\n\n      const description=element.querySelector(\n        '.skillDesc,.skillDescription,.gameDescription,p'\n      );\n\n      if(heading)heading.textContent='β — '+current.name;\n      if(description)description.textContent=current.desc;\n    });\n  }\n\n  function refresh(){\n    patchData();\n    patchDom();\n  }\n\n  let queued=false;\n\n  function schedule(){\n    if(queued)return;\n    queued=true;\n\n    requestAnimationFrame(()=>{\n      queued=false;\n      try{refresh();}catch(_error){}\n    });\n  }\n\n  const observer=new MutationObserver(mutations=>{\n    if(mutations.some(mutation=>mutation.addedNodes?.length)){\n      schedule();\n    }\n  });\n\n  function start(){\n    refresh();\n    observer.observe(document.documentElement,{\n      childList:true,\n      subtree:true\n    });\n  }\n\n  window.addEventListener('mhur:languagechange',()=>{\n    setTimeout(schedule,0);\n    setTimeout(schedule,100);\n  });\n\n  if(document.readyState==='loading'){\n    document.addEventListener(\n      'DOMContentLoaded',\n      start,\n      {once:true}\n    );\n  }else{\n    start();\n  }\n\n  window.addEventListener('load',schedule,{once:true});\n\n  window.MHUR_V604C={refresh};\n})();"

          def fail(message):
              raise RuntimeError(message)

          def read(path):
              if not path.is_file():
                  fail('Fichier introuvable : '+path.as_posix())
              return path.read_text(encoding='utf-8-sig')

          def write(path,content):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content.rstrip()+'\n',encoding='utf-8')

          def patch_index():
              html=read(INDEX)

              html=re.sub(
                  r"\s*<script\b[^>]*src=['\"][^'\"]*"
                  r"v604(?:b|c)?-shoto-beta[^'\"]*['\"][^>]*>"
                  r"\s*</script>\s*",
                  '\n',
                  html,
                  flags=re.I,
              )

              if '</body>' not in html:
                  fail('Balise </body> introuvable.')

              html=html.replace(
                  '</body>',
                  '\n<script src="js/v604c-shoto-beta-fix.js?v=604c"></script>\n</body>',
                  1,
              )

              write(INDEX,html)

          def verify():
              html=read(INDEX)
              js=read(JS)
              errors=[]

              if 'js/v604c-shoto-beta-fix.js?v=604c' not in html:
                  errors.append("Le script V604C n'est pas chargé.")

              if html.count('v604c-shoto-beta-fix.js')!=1:
                  errors.append('La référence V604C est dupliquée.')

              for required in (
                  'Heaven-Piercing Ice Wall',
                  'Mur de glace transperçant les cieux',
                  'function patchData',
                  'function patchDom',
                  'window.MHUR_V604C',
              ):
                  if required not in js:
                      errors.append('Correctif absent : '+required)

              syntax=subprocess.run(
                  ['node','--check',str(JS)],
                  text=True,
                  capture_output=True,
              )

              if syntax.returncode:
                  errors.append('Syntaxe JavaScript invalide : '+syntax.stderr)

              if errors:
                  fail('Vérification V604C échouée :\n- '+'\n- '.join(errors))

          def main():
              if not INDEX.is_file():
                  fail('public/index.html est introuvable.')

              write(JS,JS_CONTENT)
              patch_index()
              verify()

              report=[
                  'MHUR FRANCE — RAPPORT V604C',
                  '',
                  'CORRECTION',
                  '- Nom EN : Heaven-Piercing Ice Wall',
                  '- Nom FR : Mur de glace transperçant les cieux',
                  '- Nom et description remis dans le bon ordre.',
                  '- Texte espagnol remplacé dans le rendu.',
                  '',
                  "CORRECTION DE L'ÉCHEC",
                  '- Aucun contrôle global du texte espagnol dans index.html.',
                  '- Aucun parsing fragile de la base intégrée.',
                  '- Ancien script V604 retiré du chargement.',
              ]

              write(REPORT,'\n'.join(report))

              print('[OK] V604C appliqué et vérifié.')
              print("[OK] L'ancienne vérification espagnole n'existe plus.")

          if __name__=='__main__':
              main()
          PY
          python3 /tmp/appliquer_v604c.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             public/index.html             public/js/v604c-shoto-beta-fix.js             RAPPORT_V604C_SHOTO_BETA.txt

          if git diff --cached --quiet; then
            echo "V604C est deja installe."
            exit 0
          fi

          git commit -m "Corriger Shoto beta V604C"
          git push
