name: MHUR V598 - images exactes Patch Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v598-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v598-patch-images
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Installer V598
        shell: bash
        run: |
          cat > /tmp/appliquer_v598.py <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          ROOT = Path.cwd()
          INDEX = ROOT / 'public/index.html'
          HOME_JS = ROOT / 'public/data/home_data.js'
          HOME_JSON = ROOT / 'public/data/home_data.json'
          FIXES = ROOT / 'public/js/season18-fixes.js'
          V595 = ROOT / 'public/js/v595-patch-portraits-tables.js'
          FINAL = ROOT / 'public/js/v598-patch-images-exactes.js'
          REPORT = ROOT / 'RAPPORT_V598_PATCH_IMAGES_EXACTES.txt'

          FINAL_CONTENT = "\n/* MHUR Nexus — V598 : verrouillage des images exactes des Patch Notes */\n(function(){\n  'use strict';\n\n  const VERSION='598';\n\n  function clean(value){\n    return String(value??'').trim();\n  }\n\n  function localPath(value){\n    const path=clean(value)\n      .replace(/^\\.?\\//,'')\n      .replace(/^public\\//,'');\n\n    return path.startsWith('assets/')?path:'';\n  }\n\n  function currentLanguage(){\n    try{\n      if(typeof lang!=='undefined'&&lang==='en')return 'en';\n    }catch(_error){}\n\n    return String(document.documentElement.lang||'')\n      .toLowerCase()\n      .startsWith('en')\n      ?'en'\n      :'fr';\n  }\n\n  function stylesMap(){\n    try{\n      if(typeof styles!=='undefined'&&styles)return styles;\n    }catch(_error){}\n\n    return window.styles||{};\n  }\n\n  function manifestRow(styleId){\n    return (\n      window.MHUR_PATCH_LOCAL_ASSETS_V595?.styles?.[styleId]||\n      window.MHUR_LOCAL_SKILL_ASSETS_V589?.styles?.[styleId]||\n      window.MHUR_DATABASE_ASSETS?.styles?.[styleId]||\n      {}\n    );\n  }\n\n  function stylePortrait(styleId){\n    const style=stylesMap()[styleId]||{};\n    const row=manifestRow(styleId);\n\n    return localPath(row.portrait)||localPath(style.portrait);\n  }\n\n  function imageFor(styleId,key,explicit){\n    const row=manifestRow(styleId);\n    const style=stylesMap()[styleId]||{};\n\n    const fromStyle=key==='special'\n      ?style.special?.img\n      :(style.skills||[]).find(skill=>{\n        const letter=String(skill?.letter||'').trim();\n\n        if(key==='alpha')return /^(?:α|a|alpha)(?:\\s|[-—:(]|$)/i.test(letter);\n        if(key==='beta')return /^(?:β|b|beta)(?:\\s|[-—:(]|$)/i.test(letter);\n        if(key==='gamma')return /^(?:γ|y|g|gamma)(?:\\s|[-—:(]|$)/i.test(letter);\n        return false;\n      })?.img;\n\n    return (\n      localPath(explicit)||\n      localPath(row[key])||\n      localPath(fromStyle)\n    );\n  }\n\n  function setImage(box,path,alt){\n    if(!box||!path)return;\n\n    let image=box.querySelector('img');\n\n    if(!image){\n      image=document.createElement('img');\n      image.loading='lazy';\n      image.decoding='async';\n      box.replaceChildren(image);\n    }\n\n    image.hidden=false;\n    image.removeAttribute('srcset');\n    image.onerror=null;\n    image.alt=alt||'';\n\n    if(image.getAttribute('src')!==path){\n      image.setAttribute('src',path);\n    }\n  }\n\n  function fixCard(card){\n    const styleId=clean(\n      card.dataset.patchStyleId||\n      card.dataset.v595StyleId\n    );\n\n    if(!styleId)return;\n\n    const characterName=clean(\n      card.querySelector(':scope > header h4')?.textContent\n    );\n\n    setImage(\n      card.querySelector(':scope > header .s18PatchPortraitV10'),\n      stylePortrait(styleId),\n      characterName\n    );\n\n    card.querySelectorAll('.s18PatchChangeV10').forEach(change=>{\n      const key=clean(change.dataset.patchSkillKey);\n      const explicit=clean(change.dataset.patchSkillImage);\n      const title=clean(change.querySelector('h5')?.textContent);\n      const path=imageFor(styleId,key,explicit);\n      const layout=change.querySelector('.s18PatchSkillV10');\n\n      if(!layout||!path)return;\n\n      const main=layout.querySelector(':scope > main');\n      if(!main)return;\n\n      let box=[...layout.children].find(\n        child=>child!==main&&child.tagName==='DIV'\n      );\n\n      if(!box){\n        box=document.createElement('div');\n        box.className='s18PatchSkillImageV595';\n        layout.insertBefore(box,main);\n      }\n\n      layout.classList.remove('s18NoSkillImageV595');\n      setImage(box,path,title);\n\n      if(\n        styleId==='armored_all_might_technical'&&\n        key==='alpha'\n      ){\n        const heading=change.querySelector('h5');\n\n        if(heading){\n          heading.textContent=currentLanguage()==='en'\n            ?'Ice Bullet Shot'\n            :'Tir de balle de glace';\n        }\n      }\n    });\n  }\n\n  function refresh(){\n    document.querySelectorAll('.s18PatchCharacterV10')\n      .forEach(fixCard);\n  }\n\n  let queued=false;\n\n  function schedule(){\n    if(queued)return;\n    queued=true;\n\n    requestAnimationFrame(()=>{\n      queued=false;\n      refresh();\n    });\n  }\n\n  new MutationObserver(mutations=>{\n    if(\n      mutations.some(mutation=>\n        mutation.addedNodes?.length||\n        mutation.type==='attributes'\n      )\n    ){\n      schedule();\n    }\n  }).observe(document.documentElement,{\n    childList:true,\n    subtree:true,\n    attributes:true,\n    attributeFilter:['class','src','hidden']\n  });\n\n  document.addEventListener('click',event=>{\n    if(\n      event.target?.closest?.(\n        '[data-patch-index],'+\n        '[data-tab=\"patch\"],'+\n        '#mhurPatchDevButtonV14,'+\n        '[data-s18-notes-button]'\n      )\n    ){\n      setTimeout(refresh,0);\n      setTimeout(refresh,50);\n      setTimeout(refresh,180);\n    }\n  },true);\n\n  window.addEventListener('mhur:languagechange',()=>{\n    setTimeout(refresh,0);\n    setTimeout(refresh,90);\n  });\n\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',refresh,{once:true});\n  }else{\n    refresh();\n  }\n\n  window.addEventListener('load',refresh,{once:true});\n\n  window.MHUR_V598={version:VERSION,refresh};\n})();\n"
          CHARACTER_BY = "\nfunction characterBy(fragment){\n  if(typeof characters==='undefined')return null;\n\n  const wanted=NORM(fragment);\n  const list=Array.isArray(characters)?characters:[];\n\n  const exact=list.find(character=>\n    NORM(character?.id)===wanted||\n    NORM(character?.name)===wanted\n  );\n\n  if(exact)return exact;\n\n  return list\n    .map(character=>{\n      const id=NORM(character?.id);\n      const name=NORM(character?.name);\n      let score=0;\n\n      if(id&&wanted.includes(id))score=Math.max(score,700+id.length);\n      if(name&&wanted.includes(name))score=Math.max(score,700+name.length);\n      if(id&&id.includes(wanted))score=Math.max(score,500+wanted.length);\n      if(name&&name.includes(wanted))score=Math.max(score,500+wanted.length);\n\n      return {character,score};\n    })\n    .sort((a,b)=>b.score-a.score)\n    .find(row=>row.score>0)\n    ?.character||null;\n}\n"
          STYLE_FOR_CHANGE = "\nfunction styleForChange(change){\n  const ch=characterBy(change?.character||'');\n\n  if(!ch)return {ch:null,id:'',st:null};\n\n  const ids=styleIds(ch);\n  const explicit=String(change?.style_id||'');\n\n  if(explicit&&ids.includes(explicit)&&styles[explicit]){\n    return {ch,id:explicit,st:styles[explicit]};\n  }\n\n  const wanted=NORM(change?.style||'Original');\n  let id=ids.find(\n    styleId=>NORM(styles[styleId]?.name||'Original')===wanted\n  )||'';\n\n  if(!id){\n    const key=String(change?.skill_key||'');\n    const skill=NORM(change?.skill_name||change?.label||'');\n\n    id=ids.find(styleId=>{\n      const style=styles[styleId];\n      const all=[\n        {...(style?.special||{}),letter:'SP'},\n        ...(style?.skills||[])\n      ];\n\n      return all.some(item=>{\n        const name=NORM(item?.name);\n        const letter=NORM(item?.letter);\n\n        if(key==='alpha'&&/^alpha(?:_|$)/.test(letter))return true;\n        if(key==='beta'&&/^beta(?:_|$)/.test(letter))return true;\n        if(key==='gamma'&&/^gamma(?:_|$)/.test(letter))return true;\n        if(key==='special'&&letter==='sp')return true;\n\n        return (\n          (name&&skill.includes(name))||\n          (letter&&skill.startsWith(letter))\n        );\n      });\n    })||'';\n  }\n\n  if(!id)id=ids[0]||'';\n\n  return {ch,id,st:styles[id]||null};\n}\n"
          SKILL_FOR_CHANGE = "\nfunction skillForChange(st,change){\n  if(!st)return null;\n\n  const key=String(change?.skill_key||'');\n  const raw=NORM(change?.skill_name||change?.label||'');\n  const all=[\n    {...(st.special||{}),letter:'SP'},\n    ...(st.skills||[])\n  ];\n\n  function letterKey(item){\n    const letter=NORM(item?.letter);\n\n    if(/^alpha(?:_|$)/.test(letter))return 'alpha';\n    if(/^beta(?:_|$)/.test(letter))return 'beta';\n    if(/^gamma(?:_|$)/.test(letter))return 'gamma';\n    if(letter==='sp')return 'special';\n    return '';\n  }\n\n  const byName=all\n    .map(item=>{\n      const name=NORM(item?.name);\n      let score=0;\n\n      if(name&&raw===name)score=1000;\n      else if(name&&raw.includes(name))score=900+name.length;\n      else if(name&&name.includes(raw))score=800+raw.length;\n\n      if(\n        /ice_bullet_shot/.test(raw)&&\n        /tir_de_balle_de_glace/.test(name)\n      ){\n        score=1200;\n      }\n\n      return {item,score};\n    })\n    .sort((a,b)=>b.score-a.score)\n    .find(row=>row.score>0)\n    ?.item;\n\n  if(byName)return byName;\n\n  if(key){\n    const byKey=all.find(item=>letterKey(item)===key);\n    if(byKey)return byKey;\n  }\n\n  return all.find(item=>{\n    const letter=NORM(item?.letter);\n    return letter&&raw.startsWith(letter);\n  })||null;\n}\n"
          IMAGE_FOR_SKILL_V595 = "\nfunction imageForSkill(styleId,style,skillLabel,explicitKey=''){\n  const local=manifestForStyle(styleId);\n  const database=databaseForStyle(styleId);\n  const key=explicitKey||skillKey(skillLabel);\n  const skill=resolvedSkill(style,skillLabel);\n\n  return firstLocal(\n    local[key],\n    database[key],\n    skill?.img\n  );\n}\n"
          FIX_CHANGE_V595 = "\nfunction fixChange(change,styleId,style){\n  const title=clean(\n    change.querySelector('h5')?.textContent||''\n  );\n\n  const explicitKey=clean(change.dataset.patchSkillKey);\n  const explicitImage=localPath(change.dataset.patchSkillImage);\n\n  const path=explicitImage||imageForSkill(\n    styleId,\n    style,\n    title,\n    explicitKey\n  );\n\n  const layout=change.querySelector('.s18PatchSkillV10');\n\n  if(layout){\n    ensureSkillSlot(layout,path,title);\n  }\n\n  change.querySelectorAll(\n    '.s18PatchTableWrapV10,.s18PatchTableV10,.s18MetricV593'\n  ).forEach(element=>{\n    element.classList.add('s18PatchWideV595');\n  });\n}\n"
          PATCH_ID = 'v1.17.0-14.5'

          STYLE_MAP = {
              'izuku midoriya ofa': 'ofa',
              'katsuki bakugo|original': 'bakugo_attack',
              'katsuki bakugo|cluster': 'bakugo_technical',
              'denki kaminari': 'kaminari_strike',
              'mirio togata|sheer counter': 'mirio_technical',
              'armored all might': 'armored_all_might_technical',
              'hawks': 'hawks_rapid',
              'lady nagant': 'lady_nagant_strike',
              'itsuka kendo': 'kendo_assault',
              'twice': 'twice_rapid',
          }

          STYLE_DIR = {
              'ofa': 'assets/midoriya_ofa',
              'bakugo_attack': 'assets/bakugo/bakugo_attack',
              'bakugo_technical': 'assets/bakugo/bakugo_technical',
              'kaminari_strike': 'assets/kaminari/kaminari_strike',
              'mirio_technical': 'assets/mirio/mirio_technical',
              'armored_all_might_technical': 'assets/armored_all_might/armored_all_might_technical',
              'hawks_rapid': 'assets/hawks/hawks_rapid',
              'lady_nagant_strike': 'assets/lady_nagant/lady_nagant_strike',
              'kendo_assault': 'assets/kendo/kendo_assault',
              'twice_rapid': 'assets/twice/twice_rapid',
          }


          def fail(message):
              raise RuntimeError(message)


          def read(path):
              if not path.is_file():
                  fail('Fichier introuvable : ' + path.as_posix())
              return path.read_text(encoding='utf-8-sig')


          def write(path, content):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.rstrip() + '\n', encoding='utf-8')


          def norm(value):
              text = str(value or '').replace('“','"').replace('”','"').replace('’',"'").lower()
              text = re.sub(r'[^a-z0-9]+', ' ', text)
              return re.sub(r'\s+', ' ', text).strip()


          def pick(value, language='en'):
              if isinstance(value, dict):
                  return value.get(language) or value.get('fr') or value.get('en') or ''
              return value or ''


          def read_home():
              source = read(HOME_JS)
              match = re.fullmatch(r'\s*window\.MHUR_HOME_DATA\s*=\s*(\{[\s\S]*\})\s*;?\s*', source)
              if not match:
                  fail('Impossible de lire home_data.js.')
              return json.loads(match.group(1))


          def save_home(data):
              compact = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
              write(HOME_JS, 'window.MHUR_HOME_DATA = ' + compact + ';')
              if HOME_JSON.is_file():
                  write(HOME_JSON, json.dumps(data, ensure_ascii=False, indent=2))


          def skill_key(change):
              explicit = norm(change.get('skill_key'))
              if explicit in ('alpha','beta','gamma','special'):
                  return explicit

              raw = str(pick(change.get('skill_name'),'en') or pick(change.get('label'),'en')).strip()
              if re.match(r'^(?:α|a|alpha)(?:\s|[-—:(]|$)', raw, re.I): return 'alpha'
              if re.match(r'^(?:β|b|beta)(?:\s|[-—:(]|$)', raw, re.I): return 'beta'
              if re.match(r'^(?:γ|y|g|gamma)(?:\s|[-—:(]|$)', raw, re.I): return 'gamma'
              if re.match(r'^(?:sp|special|special action|action spéciale)(?:\s|[-—:(]|$)', raw, re.I): return 'special'
              return ''


          def style_for_change(change):
              character = norm(change.get('character'))
              style = norm(change.get('style'))
              if character == 'katsuki bakugo':
                  return STYLE_MAP['katsuki bakugo|cluster'] if style == 'cluster' else STYLE_MAP['katsuki bakugo|original']
              if character == 'mirio togata':
                  return STYLE_MAP['mirio togata|sheer counter']
              return STYLE_MAP.get(character, '')


          def enrich_patch_data():
              data = read_home()
              notes = data.get('patch_notes') or []
              note = next((row for row in notes if str(row.get('id') or '') == PATCH_ID), None)
              if note is None:
                  fail('Le dernier Patch Note V593 est introuvable.')

              enriched = 0
              for section in note.get('details') or []:
                  for change in section.get('changes') or []:
                      style_id = style_for_change(change)
                      key = skill_key(change)
                      if not style_id:
                          continue

                      change['style_id'] = style_id
                      change['skill_key'] = key
                      directory = STYLE_DIR.get(style_id, '')
                      if key and directory:
                          filename = 'special.webp' if key == 'special' else key + '.webp'
                          change['skill_image'] = directory + '/' + filename

                      if style_id == 'armored_all_might_technical' and key == 'alpha':
                          change['skill_title'] = {'fr':'Tir de balle de glace','en':'Ice Bullet Shot'}
                          change['skill_image'] = 'assets/armored_all_might/armored_all_might_technical/alpha.webp'
                      enriched += 1

              save_home(data)
              return enriched


          def function_range(source, name):
              match = re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', source)
              if not match: return None
              start = match.start()
              brace = source.find('{', match.end())
              if brace < 0: return None
              depth = 0
              quote = ''
              escaped = False
              for index in range(brace, len(source)):
                  char = source[index]
                  if quote:
                      if escaped: escaped = False
                      elif char == '\\': escaped = True
                      elif char == quote: quote = ''
                      continue
                  if char in ("'", '"', '`'):
                      quote = char
                      continue
                  if char == '{': depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0: return start, index + 1
              return None


          def replace_function(source, name, replacement):
              found = function_range(source, name)
              if not found: fail('Fonction introuvable : ' + name)
              start, end = found
              return source[:start] + replacement.rstrip() + source[end:]


          def patch_fixes():
              source = read(FIXES)
              source = replace_function(source, 'characterBy', CHARACTER_BY)
              source = replace_function(source, 'styleForChange', STYLE_FOR_CHANGE)
              source = replace_function(source, 'skillForChange', SKILL_FOR_CHANGE)

              old_title = "const title=CLEAN(skill?.name||change?.skill_name||change?.label||TX('Ajustement','Adjustment'));"
              new_title = "const title=CLEAN(change?.skill_title||skill?.name||change?.skill_name||change?.label||TX('Ajustement','Adjustment'));"
              if old_title not in source and new_title not in source:
                  fail('Ligne du titre des compétences introuvable.')
              source = source.replace(old_title, new_title)

              old_picture = "const picture=skill?.img||change?.skill_image||'';"
              new_picture = "const picture=change?.skill_image||skill?.img||'';"
              if old_picture not in source and new_picture not in source:
                  fail('Ligne de la photo des compétences introuvable.')
              source = source.replace(old_picture, new_picture)

              old_section = 'return `<section class="s18PatchChangeV10 ${tone}">'
              new_section = 'return `<section class="s18PatchChangeV10 ${tone}" data-patch-style-id="${ESC(group.id||\'\')}" data-patch-character-id="${ESC(group.ch?.id||\'\')}" data-patch-skill-key="${ESC(String(change?.skill_key||\'\'))}" data-patch-skill-image="${ESC(String(picture||\'\'))}">'
              if old_section in source:
                  source = source.replace(old_section, new_section, 1)
              elif 'data-patch-skill-image=' not in source:
                  fail('Ouverture des cartes Patch Notes introuvable.')

              old_article = 'return `<article class="s18PatchCharacterV10 role-${role}">'
              new_article = 'return `<article class="s18PatchCharacterV10 role-${role}" data-patch-style-id="${ESC(group.id||\'\')}" data-patch-character-id="${ESC(group.ch?.id||\'\')}">'
              if old_article in source:
                  source = source.replace(old_article, new_article, 1)
              elif 'data-patch-character-id=' not in source:
                  fail('Ouverture des personnages Patch Notes introuvable.')

              write(FIXES, source)


          def patch_v595():
              if not V595.is_file(): return False
              source = read(V595)
              source = replace_function(source, 'imageForSkill', IMAGE_FOR_SKILL_V595)
              source = replace_function(source, 'fixChange', FIX_CHANGE_V595)
              write(V595, source)
              return True


          def patch_index():
              html = read(INDEX)
              html = re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*v598-patch-images-exactes\.js[^"\']*["\'][^>]*>\s*</script>\s*', '\n', html, flags=re.I)
              html = re.sub(r'(["\'])data/home_data\.js(?:\?[^"\']*)?\1', '"data/home_data.js?v=598"', html, flags=re.I)
              html = re.sub(r'(["\'])js/season18-fixes\.js(?:\?[^"\']*)?\1', '"js/season18-fixes.js?v=598"', html, flags=re.I)
              if V595.is_file():
                  html = re.sub(r'(["\'])js/v595-patch-portraits-tables\.js(?:\?[^"\']*)?\1', '"js/v595-patch-portraits-tables.js?v=598"', html, flags=re.I)
              if '</body>' not in html: fail('Balise </body> introuvable.')
              html = html.replace('</body>', '\n<script src="js/v598-patch-images-exactes.js?v=598"></script>\n</body>', 1)
              write(INDEX, html)


          def verify(enriched, v595_patched):
              errors = []
              home = read_home()
              fixes = read(FIXES)
              html = read(INDEX)
              final = read(FINAL)
              note = next((row for row in home.get('patch_notes') or [] if str(row.get('id') or '') == PATCH_ID), None)
              armored = []
              if note:
                  for section in note.get('details') or []:
                      for change in section.get('changes') or []:
                          if norm(change.get('character')) == 'armored all might':
                              armored.append(change)

              if len(armored) != 1:
                  errors.append('La carte Armored All Might est absente ou dupliquée.')
              else:
                  change = armored[0]
                  expected = {
                      'style_id':'armored_all_might_technical',
                      'skill_key':'alpha',
                      'skill_image':'assets/armored_all_might/armored_all_might_technical/alpha.webp',
                  }
                  for key, value in expected.items():
                      if change.get(key) != value: errors.append('Armored All Might : ' + key + ' incorrect.')
                  if pick(change.get('skill_title'),'en') != 'Ice Bullet Shot': errors.append('Le titre anglais Ice Bullet Shot est absent.')

              for required in ('function characterBy','function styleForChange','function skillForChange','change?.skill_title||skill?.name','change?.skill_image||skill?.img','data-patch-skill-key','data-patch-skill-image'):
                  if required not in fixes: errors.append('Correctif moteur absent : ' + required)

              for resource in ('data/home_data.js?v=598','js/season18-fixes.js?v=598','js/v598-patch-images-exactes.js?v=598'):
                  if resource not in html: errors.append('Référence absente : ' + resource)

              if v595_patched:
                  v595 = read(V595)
                  if "explicitKey=''" not in v595: errors.append('V595 ne respecte pas la lettre explicite.')
                  if 'change.dataset.patchSkillImage' not in v595: errors.append("V595 ne respecte pas l'image explicite.")

              for required in ('armored_all_might_technical','Ice Bullet Shot','function fixCard','window.MHUR_V598'):
                  if required not in final: errors.append('Verrou final absent : ' + required)

              for path in (FIXES, FINAL):
                  syntax = subprocess.run(['node','--check',str(path)], text=True, capture_output=True)
                  if syntax.returncode: errors.append('Syntaxe invalide ' + path.name + ' : ' + syntax.stderr)
              if v595_patched:
                  syntax = subprocess.run(['node','--check',str(V595)], text=True, capture_output=True)
                  if syntax.returncode: errors.append('Syntaxe invalide V595 : ' + syntax.stderr)
              if enriched < 1: errors.append("Aucune carte du Patch Note n'a été enrichie.")
              if errors: fail('Vérification V598 échouée :\n- ' + '\n- '.join(errors))


          def main():
              for path in (INDEX, HOME_JS, FIXES):
                  if not path.is_file(): fail('Fichier requis absent : ' + path.as_posix())
              enriched = enrich_patch_data()
              patch_fixes()
              v595_patched = patch_v595()
              write(FINAL, FINAL_CONTENT)
              patch_index()
              verify(enriched, v595_patched)

              report = [
