name: MHUR - Correctif Bakugo Cluster

on:
  workflow_run:
    workflows:
      - "MHUR - Synchronisation UltraRumble"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-public-data-write
  cancel-in-progress: false

jobs:
  reparer-bakugo:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer la dernière version de main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Réparer Bakugo Cluster et les Patch Notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import unicodedata
          from collections import Counter
          from pathlib import Path

          ROOT = Path("public")
          INDEX = ROOT / "index.html"
          HOME_JSON = ROOT / "data" / "home_data.json"
          HOME_JS = ROOT / "data" / "home_data.js"
          PATCH_ID = "1785298405"

          for required in (INDEX, HOME_JSON):
              if not required.is_file():
                  raise SystemExit(f"[ERREUR] Fichier introuvable : {required}")

          def norm(value: object) -> str:
              text = unicodedata.normalize("NFKD", str(value or "").lower())
              text = "".join(char for char in text if not unicodedata.combining(char))
              return re.sub(r"[^a-z0-9]+", " ", text).strip()

          def rows(values: list[str]) -> list[list[str]]:
              return [[f"Lv.{index + 1}", value] for index, value in enumerate(values)]

          def is_cluster(change: dict) -> bool:
              return (
                  "bakugo" in norm(change.get("character"))
                  and (
                      "cluster" in norm(change.get("style"))
                      or "cluster" in norm(change.get("skill_name"))
                      or "cluster" in norm(change.get("skill_image"))
                  )
              )

          def is_damage_metric(change: dict) -> bool:
              label = norm(change.get("label"))
              return label in {
                  "damage",
                  "degats",
                  "guard break",
                  "brise garde",
              }

          data = json.loads(HOME_JSON.read_text(encoding="utf-8"))
          patches = data.setdefault("patch_notes", [])
          patch = next(
              (item for item in patches if str(item.get("id")) == PATCH_ID),
              None,
          )
          if patch is None:
              raise SystemExit(f"[ERREUR] Patch {PATCH_ID} introuvable dans home_data.json.")

          details = patch.setdefault("details", [])
          damage_section = next(
              (
                  section
                  for section in details
                  if isinstance(section.get("changes"), list)
                  and (
                      str(section.get("accent", "")).lower() == "damage"
                      or "damage" in norm(section.get("title"))
                      or "degat" in norm(section.get("title"))
                  )
              ),
              None,
          )
          if damage_section is None:
              damage_section = {
                  "title": "Changements d'équilibrage : Dégâts",
                  "accent": "damage",
                  "changes": [],
              }
              details.append(damage_section)

          alpha_old = ["30.0", "31.0", "32.0", "34.0", "35.0", "36.0", "37.0", "38.0", "40.0"]
          alpha_new = ["40.0", "41.0", "42.0", "44.0", "45.0", "46.0", "47.0", "48.0", "50.0"]
          beta_old = ["30.0", "31.0", "32.0", "34.0", "35.0", "36.0", "37.0", "38.0", "40.0"]
          beta_new = ["35.0", "36.0", "37.0", "39.0", "40.0", "41.0", "42.0", "43.0", "45.0"]
          beta_follow_old = ["40.0", "41.0", "42.0", "44.0", "45.0", "46.0", "47.0", "48.0", "50.0"]
          beta_follow_new = ["44.0", "46.0", "48.0", "50.0", "52.0", "54.0", "56.0", "58.0", "60.0"]

          portrait = "assets/home/patches/1785298405/portrait_katsuki_bakugo.webp"
          alpha_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_ap_shot_cluster_normal.png"
          beta_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_nitro_cluster_explosion.png"
          beta_follow_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_nitro_cluster_explosionfollow_up.png"

          def make_change(
              skill_name: str,
              image: str,
              label: str,
              before: list[str],
              after: list[str],
          ) -> dict:
              return {
                  "character": "Katsuki Bakugo",
                  "style": "Cluster",
                  "role": "Technique",
                  "portrait": portrait,
                  "skill_name": skill_name,
                  "skill_image": image,
                  "label": label,
                  "before": before,
                  "after": after,
                  "tone": "buff",
              }

          expected_damage_changes = [
              make_change("α - AP Shot Cluster (Normal)", alpha_image, "Dégâts", alpha_old, alpha_new),
              make_change("α - AP Shot Cluster (Normal)", alpha_image, "Brise-garde", alpha_old, alpha_new),
              make_change("β - Nitro Cluster (Explosion)", beta_image, "Dégâts", beta_old, beta_new),
              make_change("β - Nitro Cluster (Explosion)", beta_image, "Brise-garde", beta_old, beta_new),
              make_change("β - Nitro Cluster (Explosion renforcée)", beta_follow_image, "Dégâts", beta_follow_old, beta_follow_new),
              make_change("β - Nitro Cluster (Explosion renforcée)", beta_follow_image, "Brise-garde", beta_follow_old, beta_follow_new),
          ]

          old_changes = list(damage_section.get("changes") or [])
          kept: list[dict] = []
          insertion_index: int | None = None

          for item in old_changes:
              if isinstance(item, dict) and is_cluster(item) and is_damage_metric(item):
                  if insertion_index is None:
                      insertion_index = len(kept)
                  continue
              kept.append(item)

          if insertion_index is None:
              insertion_index = len(kept)
              for index, item in enumerate(kept):
                  if isinstance(item, dict) and "bakugo" in norm(item.get("character")):
                      insertion_index = index + 1

          kept[insertion_index:insertion_index] = expected_damage_changes
          damage_section["changes"] = kept

          # Ajoute α / β / γ aux autres cartes quand le fichier image indique clairement l'Alter.
          for patch_item in patches:
              for section in patch_item.get("details") or []:
                  for change in section.get("changes") or []:
                      if not isinstance(change, dict):
                          continue
                      name = str(change.get("skill_name") or "").strip()
                      if not name or name.upper() in {"HP", "PV"}:
                          continue

                      existing = re.match(r"^\s*([αβγ])\s*(?:[-–—:]\s*)?(.*)$", name)
                      if existing:
                          change["skill_name"] = f"{existing.group(1)} - {existing.group(2).strip()}"
                          continue

                      image = " ".join(
                          str(change.get(key) or "").lower()
                          for key in ("skill_image", "image", "icon")
                      )
                      for token, symbol in (("alpha", "α"), ("beta", "β"), ("gamma", "γ")):
                          if re.search(rf"(?:^|[/_.-]){token}(?:$|[/_.-])", image):
                              change["skill_name"] = f"{symbol} - {name}"
                              break

          data.setdefault("meta", {})["bakugo_cluster_fix"] = "split-workflows-v2-unicode"
          HOME_JSON.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # Le site lit home_data.js : il doit toujours être reconstruit depuis le JSON réparé.
          compact = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
          compact = compact.replace("\u2028", "\\u2028").replace("\u2029", "\\u2029")
          js_content = "window.MHUR_HOME_DATA = " + compact + ";\n"
          HOME_JS.write_text(js_content, encoding="utf-8")
          data_hash = hashlib.sha256(js_content.encode("utf-8")).hexdigest()[:12]

          html = INDEX.read_text(encoding="utf-8")
          arrays = {
              "bakugoTechAlphaBase": [
                  ["Lv.1", "x4", "x1", "2.5s"],
                  ["Lv.2", "x4", "x1", "2.5s"],
                  ["Lv.3", "x4", "x1", "2.5s"],
                  ["Lv.4", "x5", "x1", "2.5s"],
                  ["Lv.5", "x5", "x1", "2.5s"],
                  ["Lv.6", "x5", "x1", "2.5s"],
                  ["Lv.7", "x5", "x1", "2.5s"],
                  ["Lv.8", "x5", "x1", "2.5s"],
                  ["Lv.9", "x6", "x1", "2.5s"],
              ],
              "bakugoTechAlphaNormal": rows(["40", "41", "42", "44", "45", "46", "47", "48", "50"]),
              "bakugoTechAlphaDeploy": rows(["10", "10", "10", "11", "11", "11", "11", "11", "12"]),
              "bakugoTechAlphaExplosion": rows(["40", "41", "42", "44", "45", "46", "47", "48", "50"]),
              "bakugoTechAlphaBullet": rows(["8", "8", "8", "9", "9", "9", "9", "9", "10"]),
              "bakugoTechBetaBase": [
                  ["Lv.1", "x2", "x1", "8s"],
                  ["Lv.2", "x2", "x1", "8s"],
                  ["Lv.3", "x2", "x1", "8s"],
                  ["Lv.4", "x2", "x1", "7s"],
                  ["Lv.5", "x2", "x1", "7s"],
                  ["Lv.6", "x2", "x1", "7s"],
                  ["Lv.7", "x2", "x1", "7s"],
                  ["Lv.8", "x2", "x1", "7s"],
                  ["Lv.9", "x2", "x1", "6s"],
              ],
              "bakugoTechBetaBulletSweat": rows(["17", "18", "19", "20", "21", "22", "23", "24", "25"]),
              "bakugoTechBetaDeploySweat": rows(["5", "5", "5", "5", "5", "5", "5", "5", "5"]),
              "bakugoTechBetaExplosion": rows(["35", "36", "37", "39", "40", "41", "42", "43", "45"]),
              "bakugoTechBetaExplosionPlus": rows(["44", "46", "48", "50", "52", "54", "56", "58", "60"]),
          }

          for variable, value in arrays.items():
              replacement = f"const {variable} = {json.dumps(value, ensure_ascii=False)};"
              pattern = re.compile(
                  rf"const\s+{re.escape(variable)}\s*=\s*\[.*?\];",
                  flags=re.DOTALL,
              )
              html, count = pattern.subn(replacement, html, count=1)
              if count != 1:
                  raise SystemExit(
                      f"[ERREUR] Tableau JavaScript introuvable ou dupliqué : {variable}"
                  )

          html = html.replace(
              "Dégâts β — Explosion +",
              "Dégâts β — Explosion renforcée",
          )

          cache_pattern = re.compile(
              r'(<script\s+src=["\'](?:/)?data/home_data\.js)(?:\?v=[^"\']*)?(["\'])',
              flags=re.IGNORECASE,
          )
          html, cache_count = cache_pattern.subn(
              rf"\1?v={data_hash}\2",
              html,
              count=1,
          )
          if cache_count != 1:
              raise SystemExit(
                  "[ERREUR] Balise data/home_data.js introuvable dans index.html."
              )

          INDEX.write_text(html, encoding="utf-8")

          # Vérification finale.
          repaired_data = json.loads(HOME_JSON.read_text(encoding="utf-8"))
          repaired_patch = next(
              item
              for item in repaired_data.get("patch_notes", [])
              if str(item.get("id")) == PATCH_ID
          )
          repaired_damage_section = next(
              section
              for section in repaired_patch.get("details", [])
              if section.get("accent") == "damage"
              or "damage" in norm(section.get("title"))
              or "degat" in norm(section.get("title"))
          )
          damage_changes = [
              change
              for change in repaired_damage_section.get("changes", [])
              if isinstance(change, dict)
              and is_cluster(change)
              and is_damage_metric(change)
          ]

          if len(damage_changes) != 6:
              raise SystemExit(
                  f"[ERREUR] 6 changements de dégâts Cluster attendus, trouvé : {len(damage_changes)}"
              )

          expected_titles = Counter(
              {
                  "α - AP Shot Cluster (Normal)": 2,
                  "β - Nitro Cluster (Explosion)": 2,
                  "β - Nitro Cluster (Explosion renforcée)": 2,
              }
          )
          if Counter(change.get("skill_name") for change in damage_changes) != expected_titles:
              raise SystemExit("[ERREUR] Les titres α / β et les sous-types sont incorrects.")

          expected_labels = Counter({"Dégâts": 3, "Brise-garde": 3})
          if Counter(change.get("label") for change in damage_changes) != expected_labels:
              raise SystemExit("[ERREUR] Les cartes Dégâts / Brise-garde sont incorrectes.")

          js_text = HOME_JS.read_text(encoding="utf-8")
          js_prefix = "window.MHUR_HOME_DATA = "
          if not js_text.startswith(js_prefix) or not js_text.rstrip().endswith(";"):
              raise SystemExit("[ERREUR] home_data.js est invalide.")

          js_data = json.loads(js_text[len(js_prefix):].strip()[:-1])
          if js_data != repaired_data:
              raise SystemExit("[ERREUR] home_data.js n'est pas synchronisé avec home_data.json.")

          final_html = INDEX.read_text(encoding="utf-8")
          required_tokens = {
              'const bakugoTechAlphaBase = [["Lv.1", "x4", "x1", "2.5s"]',
              'const bakugoTechAlphaNormal = [["Lv.1", "40"]',
              'const bakugoTechBetaExplosion = [["Lv.1", "35"]',
              'const bakugoTechBetaExplosionPlus = [["Lv.1", "44"]',
              "Dégâts β — Explosion renforcée",
          }
          missing = [token for token in required_tokens if token not in final_html]
          if missing:
              raise SystemExit(
                  "[ERREUR] Valeurs Bakugo manquantes : " + " | ".join(missing)
              )

          if not re.search(r'data/home_data\.js\?v=[0-9a-f]{12}', final_html):
              raise SystemExit("[ERREUR] Le cache de home_data.js n'a pas été renouvelé.")

          total_cluster_changes = sum(
              1
              for section in repaired_patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict) and is_cluster(change)
          )
          print(
              "[OK] Bakugo réparé : "
              f"6 cartes de dégâts validées, {total_cluster_changes} changements Cluster conservés au total."
          )
          print(f"[OK] Cache home_data.js : {data_hash}")
          PY

      - name: Publier le correctif Bakugo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/index.html \
            public/data/home_data.json \
            public/data/home_data.js

          if git diff --cached --quiet; then
            echo "[OK] Bakugo est déjà correctement réparé."
            exit 0
          fi

          git commit -m "fix: réparer Bakugo Cluster et les Patch Notes"
          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] Correctif Bakugo publié."
              exit 0
            fi
            echo "[ATTENTE] Nouvelle tentative de publication..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Impossible de publier le correctif Bakugo sur main."
          exit 1
