name: MHUR V638 - Chargement rapide sans écran

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v638-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v638-fast-load
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Regrouper les styles et accélérer l'affichage
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v638.py <<'PY'
          
          from pathlib import Path
          import base64
          import html as html_lib
          import re
          
          RUNTIME_CSS=base64.b64decode("").decode("utf-8")
          RUNTIME_JS=base64.b64decode("").decode("utf-8")
          HEADERS=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          index_path=public/"index.html"
          bundle_path=public/"css"/"v638-site-bundle.css"
          runtime_path=public/"js"/"v638-fast-display.js"
          headers_path=public/"_headers"
          report_path=root/"RAPPORT_V638_CHARGEMENT_RAPIDE.txt"
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          bundle_path.parent.mkdir(parents=True,exist_ok=True)
          runtime_path.parent.mkdir(parents=True,exist_ok=True)
          
          html=index_path.read_text(encoding="utf-8")
          
          known_ids=[
              "mhur-v630-boot-start","mhur-v630-boot-critical",
              "mhur-v631-remove-v630-immediately",
              "mhur-v631-remove-v630-critical",
              "mhur-v632-stop-reload-loop","mhur-v632-stop-reload-loop-css",
              "mhur-v633-final-first-frame-start",
              "mhur-v633-final-first-frame-critical",
              "mhur-v633c-first-frame-start",
              "mhur-v633c-first-frame-critical",
              "mhur-v636-first-frame-start",
              "mhur-v636-first-frame-critical",
              "mhur-v637-first-render-start",
              "mhur-v637-first-render-critical",
          ]
          
          for identifier in known_ids:
              escaped=re.escape(identifier)
          
              html=re.sub(
                  rf'\s*<script[^>]+id=["\']{escaped}["\'][^>]*>'
                  rf'.*?</script>\s*',
                  "\n",html,flags=re.I|re.S
              )
              html=re.sub(
                  rf'\s*<style[^>]+id=["\']{escaped}["\'][^>]*>'
                  rf'.*?</style>\s*',
                  "\n",html,flags=re.I|re.S
              )
          
          old_runtime_names=[
              "v630-atomic-render","v631-remove-v630-loader",
              "v632-stop-reload-loop","v633-final-first-frame",
              "v633c-final-first-frame","v635-instant-navigation",
              "v636-final-fast","v637-final-render",
              "v638-site-bundle","v638-fast-display",
          ]
          
          for name in old_runtime_names:
              escaped=re.escape(name)
              html=re.sub(
                  rf'\s*<link[^>]+href=["\'][^"\']*{escaped}'
                  rf'[^"\']*["\'][^>]*>\s*',
                  "\n",html,flags=re.I
              )
              html=re.sub(
                  rf'\s*<script[^>]+src=["\'][^"\']*{escaped}'
                  rf'[^"\']*["\'][^>]*>\s*</script>\s*',
                  "\n",html,flags=re.I
              )
          
          html=re.sub(
              r'\s*<meta\s+http-equiv=["\']'
              r'(?:Cache-Control|Pragma|Expires)["\'][^>]*>\s*',
              "\n",html,flags=re.I
          )
          
          def tag_end(source,start):
              quote=None
              index=start
              while index<len(source):
                  char=source[index]
                  if quote:
                      if char==quote:
                          quote=None
                  elif char in ("'",'"'):
                      quote=char
                  elif char=='>':
                      return index+1
                  index+=1
              return len(source)
          
          def attr(tag,name):
              match=re.search(
                  rf'\b{re.escape(name)}\s*=\s*(["\'])(.*?)\1',
                  tag,flags=re.I|re.S
              )
              return html_lib.unescape(match.group(2)).strip() if match else ""
          
          def scan_styles(source):
              index=0
              blocks=[]
          
              while index<len(source):
                  if source.startswith('<!--',index):
                      close=source.find('-->',index+4)
                      index=len(source) if close<0 else close+3
                      continue
          
                  if source[index]!='<':
                      index+=1
                      continue
          
                  match=re.match(r'<\s*([a-zA-Z0-9:-]+)\b',source[index:])
                  if not match:
                      index+=1
                      continue
          
                  name=match.group(1).lower()
                  opening_end=tag_end(source,index)
                  opening=source[index:opening_end]
          
                  if name=='script':
                      close=re.search(r'</script\s*>',source[opening_end:],flags=re.I)
                      index=len(source) if not close else opening_end+close.end()
                      continue
          
                  if name=='style':
                      close=re.search(r'</style\s*>',source[opening_end:],flags=re.I)
                      if not close:
                          index=opening_end
                          continue
          
                      close_start=opening_end+close.start()
                      block_end=opening_end+close.end()
          
                      blocks.append({
                          "start":index,
                          "end":block_end,
                          "kind":"inline",
                          "content":source[opening_end:close_start],
                          "media":attr(opening,"media"),
                      })
                      index=block_end
                      continue
          
                  if name=='link':
                      rel=attr(opening,"rel").lower()
                      href=attr(opening,"href")
                      if 'stylesheet' in rel.split() and href:
                          blocks.append({
                              "start":index,
                              "end":opening_end,
                              "kind":"link",
                              "href":href,
                              "media":attr(opening,"media"),
                          })
                      index=opening_end
                      continue
          
                  index=opening_end
          
              return blocks
          
          def rewrite_inline_urls(css):
              pattern=re.compile(
                  r'url\(\s*(["\']?)(.*?)\1\s*\)',
                  flags=re.I
              )
          
              def replace(match):
                  quote=match.group(1) or ""
                  value=match.group(2).strip()
          
                  if (
                      not value or
                      value.startswith((
                          "/","data:","http:","https:","//","#","blob:"
                      ))
                  ):
                      return match.group(0)
          
                  while value.startswith("./"):
                      value=value[2:]
          
                  return f"url({quote}../{value}{quote})"
          
              return pattern.sub(replace,css)
          
          blocks=scan_styles(html)
          bundle_parts=[]
          removed=[]
          
          for block in blocks:
              media=block.get("media","").strip()
          
              if block["kind"]=="inline":
                  content=rewrite_inline_urls(block["content"])
                  label="inline"
              else:
                  href=block["href"]
                  clean=href.split("?",1)[0].split("#",1)[0]
          
                  if (
                      clean.startswith(("http:","https:","//","data:")) or
                      not clean.startswith("css/")
                  ):
                      continue
          
                  file_path=public/clean
                  if not file_path.is_file():
                      continue
          
                  content=file_path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
                  content=re.sub(
                      r'^\s*@charset\s+["\'][^"\']+["\'];?',
                      "",content,flags=re.I
                  )
                  label=clean
          
              if media and media.lower() not in ("all","screen"):
                  content=f"@media {media}{{\n{content}\n}}"
          
              bundle_parts.append(
                  f"\n/* ===== {label} ===== */\n{content}\n"
              )
              removed.append((block["start"],block["end"]))
          
          for start,end in reversed(removed):
              html=html[:start]+html[end:]
          
          bundle=(
              "/* MHUR Nexus — bundle CSS V638. */\n"
              +"".join(bundle_parts)
              +"\n"
              +RUNTIME_CSS
              +"\n"
          )
          
          bundle_path.write_text(bundle,encoding="utf-8")
          runtime_path.write_text(RUNTIME_JS+"\n",encoding="utf-8")
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          if not heads:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          position=heads[-1].start()
          style_tag=(
              '\n<!-- V638 : CSS complet regroupé avant le rendu. -->\n'
              '<link rel="preload" href="css/v638-site-bundle.css?v=638" '
              'as="style" fetchpriority="high">\n'
              '<link rel="stylesheet" href="css/v638-site-bundle.css?v=638">\n'
          )
          html=html[:position]+style_tag+html[position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          if not bodies:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          position=bodies[-1].start()
          script_tag=(
              '\n<!-- V638 : affichage immédiat et priorité images. -->\n'
              '<script src="js/v638-fast-display.js?v=638"></script>\n'
          )
          html=html[:position]+script_tag+html[position:]
          index_path.write_text(html,encoding="utf-8")
          
          existing=(
              headers_path.read_text(encoding="utf-8")
              if headers_path.is_file()
              else ""
          )
          
          existing=re.sub(
              r'\n?# MHUR V638 FAST CACHE START.*?'
              r'# MHUR V638 FAST CACHE END\n?',
              "\n",existing,flags=re.S
          ).strip()
          
          headers_path.write_text(
              ((existing+"\n\n") if existing else "")
              +HEADERS+"\n",
              encoding="utf-8"
          )
          
          report_path.write_text(
              f"""MHUR NEXUS — V638
          
          - {len(bundle_parts)} blocs CSS regroupés en un seul fichier.
          - Ordre de cascade conservé.
          - Bundle CSS chargé avec priorité élevée dans le head.
          - Aucun écran de chargement et aucun masquage JavaScript.
          - Les scripts fonctionnels gardent leur ordre.
          - Cache normal réactivé.
          - Images visibles prioritaires ; images hors écran différées.
          - Les images déjà optimisées par V637 ne sont pas recompressées.
          """,
              encoding="utf-8"
          )
          
          print(f"[OK] V638 : {len(bundle_parts)} styles regroupés.")
          
          PY
          
          cat > /tmp/verifier_v638.py <<'PY'
          
          from pathlib import Path
          import re
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          bundle=Path(
              "public/css/v638-site-bundle.css"
          ).read_text(encoding="utf-8")
          runtime=Path(
              "public/js/v638-fast-display.js"
          ).read_text(encoding="utf-8")
          
          if index.count("css/v638-site-bundle.css?v=638")!=2:
              raise SystemExit(
                  "[ERREUR] Bundle CSS V638 absent ou dupliqué."
              )
          
          if index.count("js/v638-fast-display.js?v=638")!=1:
              raise SystemExit(
                  "[ERREUR] Runtime V638 absent ou dupliqué."
              )
          
          if len(bundle)<100:
              raise SystemExit(
                  "[ERREUR] Bundle CSS V638 anormalement vide."
              )
          
          if re.search(
              r'<link\b(?=[^>]*\brel=["\'][^"\']*stylesheet)'
              r'(?=[^>]*\bhref=["\']css/(?!v638-site-bundle))',
              index,
              flags=re.I
          ):
              raise SystemExit(
                  "[ERREUR] Une ancienne feuille CSS locale reste séparée."
              )
          
          for token in [
              "prioritize","mhurV637Preparing","fetchPriority"
          ]:
              if token not in runtime:
                  raise SystemExit(
                      f"[ERREUR] Runtime V638 incomplet : {token}"
                  )
          
          print("[OK] Vérification V638 réussie.")
          
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v638.py
            node --check public/js/v638-fast-display.js
            python3 /tmp/verifier_v638.py
            git diff --check
          
            git add     public/index.html     public/css/v638-site-bundle.css     public/js/v638-fast-display.js     public/_headers     RAPPORT_V638_CHARGEMENT_RAPIDE.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V638 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "perf: réduire fortement le chargement V638"
          
            if git push origin HEAD:main; then
              echo "[OK] V638 envoyé sur main."
              exit 0
            fi
          
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V638."
          exit 1
