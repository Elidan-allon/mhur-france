name: MHUR V627 - Dev Notes et images immédiates

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v627-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v627-dev-images
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python et Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V627
        shell: bash
        run: |
          set -euo pipefail
          
          python3 -m pip install   --disable-pip-version-check   --quiet   pillow
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v627.py <<'PY'
          from pathlib import Path
          import base64
          import json
          import re
          
          from PIL import Image
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          DEV_FUNCTION=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          index_path=public/"index.html"
          v608_path=public/"js"/"v608-patch-notes-final.js"
          css_path=public/"css"/"v627-dev-notes-images-instant.css"
          js_path=public/"js"/"v627-dev-notes-images-instant.js"
          bounds_path=public/"data"/"v627-costume-bounds.js"
          report_path=root/"RAPPORT_V627_DEV_NOTES_IMAGES.txt"
          
          for required in [index_path,v608_path]:
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          bounds_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          # ------------------------------------------------------------
          # 1. Manifeste des zones réellement visibles des costumes.
          # ------------------------------------------------------------
          
          extensions={".png",".webp",".jpg",".jpeg"}
          manifest={}
          
          for path in sorted(public.rglob("*")):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
          
              relative=path.relative_to(public).as_posix()
              lowered=relative.lower()
          
              if "costume" not in lowered:
                  continue
          
              try:
                  with Image.open(path) as image:
                      rgba=image.convert("RGBA")
                      width,height=rgba.size
                      alpha=rgba.getchannel("A")
                      bbox=alpha.getbbox() or (0,0,width,height)
                      left,top,right,bottom=bbox
                      visible_width=max(1,right-left)
                      visible_height=max(1,bottom-top)
          
                      manifest[relative]={
                          "nw":width,
                          "nh":height,
                          "x":left,
                          "y":top,
                          "width":visible_width,
                          "height":visible_height,
                          "centerX":left+(visible_width/2),
                          "centerY":top+(visible_height/2),
                      }
              except Exception as error:
                  print(f"[ATTENTION] Image ignorée {relative} : {error}")
          
          bounds_path.write_text(
              "window.MHUR_V627_COSTUME_BOUNDS="
              +json.dumps(
                  manifest,
                  ensure_ascii=False,
                  separators=(",",":")
              )
              +";\n",
              encoding="utf-8",
          )
          
          print(
              f"[OK] {len(manifest)} cadrages de costumes précalculés."
          )
          
          # ------------------------------------------------------------
          # 2. Restaure la Dev Note complète dans le moteur final V608.
          # ------------------------------------------------------------
          
          v608=v608_path.read_text(encoding="utf-8")
          
          pattern=(
              r'  function devHtml\(\)\{'
              r'.*?'
              r'\n  \}'
              r'\n\s*function ensureModal\(\)\{'
          )
          
          replacement=(
              DEV_FUNCTION
              +"\n\n  function ensureModal(){"
          )
          
          v608,count=re.subn(
              pattern,
              replacement,
              v608,
              count=1,
              flags=re.S,
          )
          
          if count!=1:
              raise SystemExit(
                  "[ERREUR] La fonction devHtml de V608 "
                  "n'a pas pu être remplacée."
              )
          
          v608_path.write_text(v608,encoding="utf-8")
          
          # ------------------------------------------------------------
          # 3. Installe V627 et neutralise l'attente V618/V622.
          # ------------------------------------------------------------
          
          html=index_path.read_text(encoding="utf-8")
          
          obsolete=[
              r'\s*<style id=["\']mhur-v622-costume-image-no-jump["\']>'
              r'.*?</style>\s*',
              r'\s*<!-- V618[^>]*-->\s*'
              r'<link[^>]+v618-mobile-costume-visible-center\.css[^>]*>\s*',
              r'\s*<link[^>]+v618-mobile-costume-visible-center\.css[^>]*>\s*',
              r'\s*<!-- V618[^>]*-->\s*'
              r'<script[^>]+v618-mobile-costume-visible-center\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v618-mobile-costume-visible-center\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<!-- V622[^>]*-->\s*'
              r'<script[^>]+v622-costume-image-no-jump\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v622-costume-image-no-jump\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<!-- V627[^>]*-->\s*'
              r'<link[^>]+v627-dev-notes-images-instant\.css[^>]*>\s*',
              r'\s*<link[^>]+v627-dev-notes-images-instant\.css[^>]*>\s*',
              r'\s*<!-- V627[^>]*-->\s*'
              r'<script[^>]+v627-costume-bounds\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v627-costume-bounds\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<!-- V627[^>]*-->\s*'
              r'<script[^>]+v627-dev-notes-images-instant\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v627-dev-notes-images-instant\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern_item in obsolete:
              html=re.sub(
                  pattern_item,
                  "\n",
                  html,
                  flags=re.I|re.S
              )
          
          # Démarre le téléchargement des images dès leur insertion.
          html=re.sub(
              r'<img\s+src="\$\{c\.img\}"\s+alt="\$\{c\.variant\}"'
              r'(?![^>]*\bloading=)',
              '<img src="${c.img}" alt="${c.variant}" '
              'loading="eager" decoding="async" fetchpriority="high"',
              html,
          )
          
          # Cache busting du moteur V608 modifié.
          html,count_v608=re.subn(
              r'(<script\s+src=["\']js/v608-patch-notes-final\.js)'
              r'(?:\?[^"\']*)?(["\'])',
              r'\1?v=627\2',
              html,
              count=1,
              flags=re.I,
          )
          
          if count_v608!=1:
              raise SystemExit(
                  "[ERREUR] Référence V608 introuvable dans index.html."
              )
          
          css_tag=(
              '<!-- V627 : Dev Notes complètes et images immédiates CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v627-dev-notes-images-instant.css?v=627">\n'
          )
          
          bounds_tag=(
              '<!-- V627 : cadrages précalculés des costumes. -->\n'
              '<script src="data/v627-costume-bounds.js?v=627"></script>\n'
          )
          
          js_tag=(
              '<!-- V627 : Dev Notes complètes et images immédiates JS. -->\n'
              '<script defer '
              'src="js/v627-dev-notes-images-instant.js?v=627">'
              '</script>\n'
          )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          
          if not heads:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          position=heads[-1].start()
          html=(
              html[:position]
              +css_tag
              +bounds_tag
              +js_tag
              +html[position:]
          )
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V627
          
          DEV NOTES
          - Restaure les cinq sections complètes et les liens officiels.
          - Supprime les hauteurs fixes qui coupaient le bas.
          - Le contenu principal possède son propre défilement.
          - Fonctionne sur mobile et ordinateur.
          
          IMAGES DE COSTUMES
          - Supprime l'attente artificielle de V622.
          - Le cadrage transparent est calculé pendant le workflow.
          - Les coordonnées sont disponibles avant le chargement de l'image.
          - Les images sont chargées en eager avec priorité élevée.
          - V618 et V622 ne sont plus chargés pour éviter un second déplacement.
          
          LIMITATION NATURELLE
          - Lors d'une toute première visite, le téléchargement réel dépend toujours
            de la connexion. Le site ne rajoute toutefois plus aucun délai artificiel.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V627 appliqué.")
          PY
          
          cat > /tmp/verifier_v627.py <<'PY'
          from pathlib import Path
          import json
          import re
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          v608=Path(
              "public/js/v608-patch-notes-final.js"
          ).read_text(encoding="utf-8")
          css=Path(
              "public/css/v627-dev-notes-images-instant.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v627-dev-notes-images-instant.js"
          ).read_text(encoding="utf-8")
          bounds=Path(
              "public/data/v627-costume-bounds.js"
          ).read_text(encoding="utf-8")
          
          for reference in [
              "css/v627-dev-notes-images-instant.css?v=627",
              "data/v627-costume-bounds.js?v=627",
              "js/v627-dev-notes-images-instant.js?v=627",
              "js/v608-patch-notes-final.js?v=627",
          ]:
              if index.count(reference)!=1:
                  raise SystemExit(
                      f"[ERREUR] Référence absente ou dupliquée : {reference}"
                  )
          
          for obsolete in [
              "v618-mobile-costume-visible-center.css",
              "v618-mobile-costume-visible-center.js",
              "v622-costume-image-no-jump.js",
              'id="mhur-v622-costume-image-no-jump"',
          ]:
              if obsolete in index:
                  raise SystemExit(
                      f"[ERREUR] Ancienne attente encore chargée : {obsolete}"
                  )
          
          for token in [
              "Research Notebook",
              "3-Pick Battle",
              "Lire la Dev Note officielle",
              "window.MHUR_S18_V14?.devHtml",
          ]:
              if token not in v608:
                  raise SystemExit(
                      f"[ERREUR] Dev Note complète absente : {token}"
                  )
          
          for token in [
              ".s18NotesBodyV10",
              ".s18DevArticleV10",
              "100dvh",
              "data-v627-costume-ready",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V627 incomplet : {token}"
                  )
          
          for token in [
              "MHUR_V627_COSTUME_BOUNDS",
              "applyCostumeImage",
              "refreshNotes",
              "fetchPriority",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS V627 incomplet : {token}"
                  )
          
          prefix="window.MHUR_V627_COSTUME_BOUNDS="
          if not bounds.startswith(prefix):
              raise SystemExit("[ERREUR] Manifeste V627 invalide.")
          
          payload=bounds[len(prefix):].strip()
          if payload.endswith(";"):
              payload=payload[:-1]
          
          data=json.loads(payload)
          
          if not isinstance(data,dict):
              raise SystemExit("[ERREUR] Manifeste V627 non objet.")
          
          print(
              f"[OK] Contrôles V627 validés avec {len(data)} images."
          )
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v627.py
          
            node --check public/js/v608-patch-notes-final.js
            node --check public/js/v627-dev-notes-images-instant.js
          
            python3 /tmp/verifier_v627.py
          
            git add     public/index.html     public/js/v608-patch-notes-final.js     public/css/v627-dev-notes-images-instant.css     public/js/v627-dev-notes-images-instant.js     public/data/v627-costume-bounds.js     RAPPORT_V627_DEV_NOTES_IMAGES.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V627 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: Dev Notes complètes et images immédiates V627"
          
            if git push origin HEAD:main; then
              echo "[OK] V627 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V627 après cinq tentatives."
          exit 1
