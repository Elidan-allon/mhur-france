name: MHUR V625 - Correctif source final

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v625-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v625-source-final
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer et enregistrer V625
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v625.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          TIER_JS=base64.b64decode("").decode("utf-8")
          HELPER=base64.b64decode("").decode("utf-8")
          
          index_path=Path("public/index.html")
          community_path=Path("public/js/community-builds.js")
          css_path=Path("public/css/v625-source-final.css")
          tier_path=Path("public/js/v625-tier-direct.js")
          report_path=Path("RAPPORT_V625_SOURCE_FINAL.txt")
          
          for required in [index_path,community_path]:
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          tier_path.parent.mkdir(parents=True,exist_ok=True)
          css_path.write_text(CSS+"\n",encoding="utf-8")
          tier_path.write_text(TIER_JS+"\n",encoding="utf-8")
          
          community=community_path.read_text(encoding="utf-8")
          
          # Retire une éventuelle ancienne installation V625.
          community=re.sub(
              r'\n?/\* V625 COMMUNITY TUNING DETAILS START \*/'
              r'.*?'
              r'/\* V625 COMMUNITY TUNING DETAILS END \*/\n?',
              "\n",
              community,
              flags=re.S,
          )
          community=re.sub(
              r'\n\s*\$\{cbV625DetailsHtml\(tuning\)\}\s*',
              "\n",
              community,
          )
          
          anchor="function cbBuilderPicker(costume,spec){"
          
          if anchor not in community:
              raise SystemExit(
                  "[ERREUR] cbBuilderPicker introuvable."
              )
          
          community=community.replace(
              anchor,
              HELPER+"\n"+anchor,
              1,
          )
          
          # La source ne doit plus tronquer la description à 180 caractères.
          community=community.replace(
              "const ds=cbPlain(cbTuningDesc(tuning),180);",
              "const ds=cbTuningDesc(tuning);",
          )
          
          faction_line=(
              '            <div class="tuningFaction">'
              '${tuning.side===\'Héros\'?\'HÉROS\':\'SUPER-VILAIN\'}'
              '</div>\n'
          )
          
          if faction_line not in community:
              raise SystemExit(
                  "[ERREUR] Ligne faction du sélecteur introuvable."
              )
          
          community=community.replace(
              faction_line,
              faction_line+
              '            ${cbV625DetailsHtml(tuning)}\n',
              1,
          )
          
          community_path.write_text(community,encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          # Désactive les deux correctifs DOM qui n'agissaient pas sur le rendu source.
          obsolete=[
              r'\s*<!-- V623[^>]*-->\s*<link[^>]+v623-community-build-tuning-details\.css[^>]*>\s*',
              r'\s*<link[^>]+v623-community-build-tuning-details\.css[^>]*>\s*',
              r'\s*<!-- V623[^>]*-->\s*<script[^>]+v623-community-build-tuning-details\.js[^>]*>\s*</script>\s*',
              r'\s*<script[^>]+v623-community-build-tuning-details\.js[^>]*>\s*</script>\s*',
              r'\s*<!-- V624[^>]*-->\s*<link[^>]+v624-tierlist-new-fix\.css[^>]*>\s*',
              r'\s*<link[^>]+v624-tierlist-new-fix\.css[^>]*>\s*',
              r'\s*<!-- V624[^>]*-->\s*<script[^>]+v624-tierlist-new-fix\.js[^>]*>\s*</script>\s*',
              r'\s*<script[^>]+v624-tierlist-new-fix\.js[^>]*>\s*</script>\s*',
              r'\s*<!-- V625[^>]*-->\s*<link[^>]+v625-source-final\.css[^>]*>\s*',
              r'\s*<link[^>]+v625-source-final\.css[^>]*>\s*',
              r'\s*<!-- V625[^>]*-->\s*<script[^>]+v625-tier-direct\.js[^>]*>\s*</script>\s*',
              r'\s*<script[^>]+v625-tier-direct\.js[^>]*>\s*</script>\s*',
          ]
          
          for pattern in obsolete:
              html=re.sub(pattern,"\n",html,flags=re.I)
          
          # Force le navigateur à reprendre la nouvelle source communautaire.
          html,count=re.subn(
              r'(<script\s+src=["\']js/community-builds\.js)'
              r'(?:\?[^"\']*)?(["\'])',
              r'\1?v=625\2',
              html,
              count=1,
              flags=re.I,
          )
          
          if count!=1:
              raise SystemExit(
                  "[ERREUR] Référence community-builds.js introuvable."
              )
          
          css_tag=(
              '<!-- V625 : correctif source final CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v625-source-final.css?v=625">\n'
          )
          js_tag=(
              '<!-- V625 : Tier List exacte. -->\n'
              '<script src="js/v625-tier-direct.js?v=625"></script>\n'
          )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          if not bodies:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")
          
          position=heads[-1].start()
          html=html[:position]+css_tag+html[position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          position=bodies[-1].start()
          html=html[:position]+js_tag+html[position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V625
          
          CORRECTION SOURCE, PAS POST-TRAITEMENT
          
          BUILDS COMMUNAUTAIRES
          - Les détails sont générés directement par cbBuilderPicker.
          - Description complète.
          - Tous les effets.
          - Tous les niveaux et sous-effets.
          - Plus aucun ajout qui disparaît après cbRenderBuilder.
          
          TIER LIST
          - Cible exacte : #mhurTierList .mhurTierItem.
          - NEW déplacé comme enfant direct de la carte.
          - NEW petit et animé en haut à gauche.
          - Nom et style séparés dans le flux normal.
          
          NON MODIFIÉ
          - Aller-retour fluide.
          - Costumes.
          - Autres pages.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V625 appliqué dans les vraies sources.")
          PY
          
          cat > /tmp/verifier_v625.py <<'PY'
          from pathlib import Path
          import re
          
          html=Path("public/index.html").read_text(encoding="utf-8")
          community=Path("public/js/community-builds.js").read_text(encoding="utf-8")
          css=Path("public/css/v625-source-final.css").read_text(encoding="utf-8")
          tier=Path("public/js/v625-tier-direct.js").read_text(encoding="utf-8")
          
          if html.count("css/v625-source-final.css?v=625")!=1:
              raise SystemExit("[ERREUR] CSS V625 absent ou dupliqué.")
          
          if html.count("js/v625-tier-direct.js?v=625")!=1:
              raise SystemExit("[ERREUR] JS Tier V625 absent ou dupliqué.")
          
          if html.count("js/community-builds.js?v=625")!=1:
              raise SystemExit("[ERREUR] community-builds.js non actualisé.")
          
          if "const ds=cbPlain(cbTuningDesc(tuning),180);" in community:
              raise SystemExit("[ERREUR] Description encore tronquée.")
          
          for token in [
              "V625 COMMUNITY TUNING DETAILS START",
              "function cbV625DetailsHtml",
              "${cbV625DetailsHtml(tuning)}",
              "cbV625TuningDetails",
          ]:
              if token not in community:
                  raise SystemExit(f"[ERREUR] Source communautaire manquante : {token}")
          
          for token in [
              "#mhurTierList .mhurTierItem",
              ".cbV625TuningDetails",
              "@keyframes cbV625TierNew",
          ]:
              if token not in css:
                  raise SystemExit(f"[ERREUR] CSS manquant : {token}")
          
          for token in [
              "#mhurTierList .mhurTierItem",
              "card.insertBefore(badge,card.firstChild)",
          ]:
              if token not in tier:
                  raise SystemExit(f"[ERREUR] Tier JS manquant : {token}")
          
          for obsolete in [
              "v623-community-build-tuning-details.css",
              "v623-community-build-tuning-details.js",
              "v624-tierlist-new-fix.css",
              "v624-tierlist-new-fix.js",
          ]:
              if obsolete in html:
                  raise SystemExit(f"[ERREUR] Ancienne couche encore chargée : {obsolete}")
          
          print("[OK] Contrôles source V625 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v625.py
            node --check public/js/community-builds.js
            node --check public/js/v625-tier-direct.js
            python3 /tmp/verifier_v625.py
          
            git add \
              public/index.html \
              public/js/community-builds.js \
              public/css/v625-source-final.css \
              public/js/v625-tier-direct.js \
              RAPPORT_V625_SOURCE_FINAL.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V625 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: détails communautaires et Tier List source V625"
          
            if git push origin HEAD:main; then
              echo "[OK] V625 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V625 après cinq tentatives."
          exit 1
