name: MHUR - Correctif styles Patch Notes V659

on:
  workflow_run:
    workflows:
      - "MHUR - Synchronisation UltraRumble"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-patch-notes-style-v659
  cancel-in-progress: false

jobs:
  corriger-styles-patch-notes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer la dernière version de main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Corriger les styles, portraits et compétences
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import unicodedata
          from pathlib import Path

          PATCH_ID = "1785298405"

          INDEX = Path("public/index.html")
          HOME_JSON = Path("public/data/home_data.json")
          HOME_JS = Path("public/data/home_data.js")
          RENDERER = Path("public/js/v608-patch-notes-final.js")

          for required in (INDEX, HOME_JSON, RENDERER):
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )

          def clean(value: object) -> str:
              if isinstance(value, dict):
                  return str(
                      value.get("en")
                      or value.get("fr")
                      or next(iter(value.values()), "")
                  ).strip()
              return str(value or "").strip()

          def norm(value: object) -> str:
              text = unicodedata.normalize(
                  "NFD",
                  clean(value).lower(),
              )
              text = "".join(
                  character
                  for character in text
                  if unicodedata.category(character) != "Mn"
              )
              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text,
              ).strip()

          data = json.loads(
              HOME_JSON.read_text(encoding="utf-8")
          )

          patch = next(
              (
                  item
                  for item in data.get("patch_notes", [])
                  if str(item.get("id")) == PATCH_ID
              ),
              None,
          )
          if patch is None:
              raise SystemExit(
                  f"[ERREUR] Patch {PATCH_ID} introuvable."
              )

          all_changes = [
              change
              for section in patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict)
          ]

          cluster_count = 0
          original_count = 0
          armored_count = 0

          for change in all_changes:
              character = norm(change.get("character"))
              style = norm(change.get("style"))
              skill = norm(change.get("skill_name"))

              # Bakugo Cluster : toujours le style Technique.
              if character == "katsuki bakugo" and style == "cluster":
                  change["style_id"] = "bakugo_technical"
                  change["style"] = "Cluster"
                  change["role"] = "technical"
                  change["portrait"] = (
                      "assets/bakugo/"
                      "bakugo_technical/portrait.webp"
                  )

                  if skill.startswith("a ") or "ap shot cluster" in skill:
                      change["skill_image"] = (
                          "assets/bakugo/"
                          "bakugo_technical/alpha.webp"
                      )
                  elif skill.startswith("b ") or "nitro cluster" in skill:
                      change["skill_image"] = (
                          "assets/bakugo/"
                          "bakugo_technical/beta.webp"
                      )
                  elif (
                      skill.startswith(("g ", "y "))
                      or "howitzer impact cluster" in skill
                  ):
                      change["skill_image"] = (
                          "assets/bakugo/"
                          "bakugo_technical/gamma.webp"
                      )

                  cluster_count += 1
                  continue

              # Bakugo Original : toujours le style Attaque.
              if character == "katsuki bakugo" and style == "original":
                  change["style_id"] = "bakugo_attack"
                  change["style"] = "Original"
                  change["role"] = "attack"
                  change["portrait"] = (
                      "assets/bakugo/"
                      "bakugo_attack/portrait.webp"
                  )

                  if skill.startswith("a "):
                      change["skill_image"] = (
                          "assets/bakugo/"
                          "bakugo_attack/alpha.webp"
                      )
                  elif skill.startswith("b "):
                      change["skill_image"] = (
                          "assets/bakugo/"
                          "bakugo_attack/beta.webp"
                      )
                  elif (
                      skill.startswith(("g ", "y "))
                      or "howitzer impact" in skill
                  ):
                      change["skill_image"] = (
                          "assets/bakugo/"
                          "bakugo_attack/gamma.webp"
                      )

                  original_count += 1
                  continue

              # Armored All Might : personnage Technique séparé.
              if character == "armored all might":
                  change["style_id"] = (
                      "armored_all_might_technical"
                  )
                  change["style"] = "Technique"
                  change["role"] = "technical"
                  change["portrait"] = (
                      "assets/armored_all_might/"
                      "armored_all_might_technical/portrait.webp"
                  )

                  if skill.startswith("a ") or "ice bullet shot" in skill:
                      change["skill_image"] = (
                          "assets/armored_all_might/"
                          "armored_all_might_technical/alpha.webp"
                      )
                  elif skill.startswith("b "):
                      change["skill_image"] = (
                          "assets/armored_all_might/"
                          "armored_all_might_technical/beta.webp"
                      )
                  elif skill.startswith(("g ", "y ")):
                      change["skill_image"] = (
                          "assets/armored_all_might/"
                          "armored_all_might_technical/gamma.webp"
                      )

                  armored_count += 1

          if cluster_count < 4:
              raise SystemExit(
                  "[ERREUR] Pas assez de changements Cluster trouvés : "
                  f"{cluster_count}"
              )

          if original_count < 2:
              raise SystemExit(
                  "[ERREUR] Pas assez de changements Bakugo Original : "
                  f"{original_count}"
              )

          if armored_count < 2:
              raise SystemExit(
                  "[ERREUR] Pas assez de changements Armored All Might : "
                  f"{armored_count}"
              )

          data.setdefault("meta", {})[
              "patch_style_resolution"
          ] = "v659-explicit-style-before-skill"

          HOME_JSON.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          compact = json.dumps(
              data,
              ensure_ascii=False,
              separators=(",", ":"),
          ).replace(
              "\u2028",
              "\\u2028",
          ).replace(
              "\u2029",
              "\\u2029",
          )

          home_js_content = (
              f"window.MHUR_HOME_DATA = {compact};\n"
          )
          HOME_JS.write_text(
              home_js_content,
              encoding="utf-8",
          )

          renderer = RENDERER.read_text(encoding="utf-8")

          function_start = renderer.find(
              "  function resolveStyle(change){"
          )
          function_end = renderer.find(
              "\n  function translatePatch(value){",
              function_start,
          )

          if function_start < 0 or function_end < 0:
              raise SystemExit(
                  "[ERREUR] Fonction resolveStyle introuvable."
              )

          new_function = """  function resolveStyle(change){
              const map=stylesMap();
              const character=findCharacter(change?.character);
              const ids=styleIds(character);

              /*
                V659 : style_id explicite prioritaire.
              */
              const explicitId=clean(
                change?.style_id||
                change?.styleId||
                ''
              );

              if(
                explicitId&&
                ids.includes(explicitId)&&
                map[explicitId]
              ){
                return {
                  character,
                  id:explicitId,
                  style:map[explicitId]
                };
              }

              const midoriyaId=midoriyaStyleId(
                change,
                character
              );

              if(midoriyaId&&map[midoriyaId]){
                return {
                  character,
                  id:midoriyaId,
                  style:map[midoriyaId]
                };
              }

              /*
                Vérifier le style exact AVANT la compétence.
                Cluster doit choisir bakugo_technical avant AP Shot Original.
              */
              const wanted=normal(change?.style||'Original');

              const byStyle=ids.find(id=>
                normal(localized(map[id]?.name)||'Original')===wanted
              );

              if(byStyle){
                return {
                  character,
                  id:byStyle,
                  style:map[byStyle]
                };
              }

              const rawSkill=normal(
                change?.skill_name||
                change?.label
              );

              const bySkill=ids.find(id=>
                allSkills(map[id]).some(skill=>{
                  const name=normal(localized(skill?.name));

                  return (
                    name&&
                    (
                      name===rawSkill||
                      name.includes(rawSkill)||
                      rawSkill.includes(name)
                    )
                  );
                })
              );

              if(bySkill){
                return {
                  character,
                  id:bySkill,
                  style:map[bySkill]
                };
              }

              const id=ids[0]||'';

              return {
                character,
                id,
                style:map[id]||null
              };
            }
          """

          renderer = (
              renderer[:function_start]
              + new_function
              + renderer[function_end:]
          )

          renderer = re.sub(
              r"const VERSION='[^']*';",
              "const VERSION='659';",
              renderer,
              count=1,
          )

          explicit_position = renderer.find(
              "const explicitId=clean("
          )
          style_position = renderer.find(
              "const byStyle=ids.find("
          )
          skill_position = renderer.find(
              "const bySkill=ids.find("
          )

          if not (
              0 <= explicit_position
              < style_position
              < skill_position
          ):
              raise SystemExit(
                  "[ERREUR] L'ordre explicite/style/compétence "
                  "n'est pas correct."
              )

          if (
              "change?.style_id" not in renderer
              or "ids.includes(explicitId)" not in renderer
          ):
              raise SystemExit(
                  "[ERREUR] style_id n'est pas pris en charge."
              )

          RENDERER.write_text(
              renderer,
              encoding="utf-8",
          )

          home_hash = hashlib.sha256(
              home_js_content.encode("utf-8")
          ).hexdigest()[:12]

          renderer_hash = hashlib.sha256(
              renderer.encode("utf-8")
          ).hexdigest()[:12]

          index = INDEX.read_text(encoding="utf-8")

          index, home_count = re.subn(
              r'(<script\s+src=["\']'
              r'(?:/)?data/home_data\.js)'
              r'(?:\?v=[^"\']*)?(["\']\s*></script>)',
              rf"\1?v=659-{home_hash}\2",
              index,
              count=1,
              flags=re.IGNORECASE,
          )

          if home_count != 1:
              raise SystemExit(
                  "[ERREUR] Balise home_data.js introuvable."
              )

          index, renderer_count = re.subn(
              r'(<script\s+src=["\']'
              r'(?:/)?js/v608-patch-notes-final\.js)'
              r'(?:\?v=[^"\']*)?(["\']\s*></script>)',
              rf"\1?v=659-{renderer_hash}\2",
              index,
              count=1,
              flags=re.IGNORECASE,
          )

          if renderer_count != 1:
              raise SystemExit(
                  "[ERREUR] Balise V608 introuvable."
              )

          # Retirer les anciens overlays V657/V658 éventuels.
          index = re.sub(
              r'\s*<script\s+src=["\']'
              r'(?:/)?js/v65[78][^"\']*\.js'
              r'(?:\?v=[^"\']*)?["\']\s*></script>\s*',
              "\n",
              index,
              flags=re.IGNORECASE,
          )

          INDEX.write_text(
              index,
              encoding="utf-8",
          )

          saved = json.loads(
              HOME_JSON.read_text(encoding="utf-8")
          )

          saved_patch = next(
              item
              for item in saved["patch_notes"]
              if str(item.get("id")) == PATCH_ID
          )

          saved_changes = [
              change
              for section in saved_patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict)
          ]

          bad_cluster = [
              change
              for change in saved_changes
              if (
                  norm(change.get("character"))
                  == "katsuki bakugo"
                  and norm(change.get("style")) == "cluster"
                  and (
                      change.get("style_id")
                      != "bakugo_technical"
                      or change.get("role") != "technical"
                      or change.get("portrait")
                      != (
                          "assets/bakugo/"
                          "bakugo_technical/portrait.webp"
                      )
                      or "/bakugo_technical/" not in clean(
                          change.get("skill_image")
                      )
                  )
              )
          ]

          if bad_cluster:
              raise SystemExit(
                  "[ERREUR] Des changements Cluster utilisent "
                  "encore le style ou les images Original."
              )

          bad_original = [
              change
              for change in saved_changes
              if (
                  norm(change.get("character"))
                  == "katsuki bakugo"
                  and norm(change.get("style")) == "original"
                  and change.get("style_id") != "bakugo_attack"
              )
          ]

          if bad_original:
              raise SystemExit(
                  "[ERREUR] Des changements Bakugo Original "
                  "n'utilisent pas bakugo_attack."
              )

          bad_armored = [
              change
              for change in saved_changes
              if (
                  norm(change.get("character"))
                  == "armored all might"
                  and (
                      change.get("style_id")
                      != "armored_all_might_technical"
                      or change.get("portrait")
                      != (
                          "assets/armored_all_might/"
                          "armored_all_might_technical/"
                          "portrait.webp"
                      )
                  )
              )
          ]

          if bad_armored:
              raise SystemExit(
                  "[ERREUR] Armored All Might n'utilise pas "
                  "son style Technique."
              )

          final_index = INDEX.read_text(encoding="utf-8")

          if (
              f"data/home_data.js?v=659-{home_hash}"
              not in final_index
          ):
              raise SystemExit(
                  "[ERREUR] Cache home_data.js non renouvelé."
              )

          if (
              "js/v608-patch-notes-final.js"
              f"?v=659-{renderer_hash}"
              not in final_index
          ):
              raise SystemExit(
                  "[ERREUR] Cache du moteur V608 non renouvelé."
              )

          print(
              "[OK] Bakugo Cluster utilise "
              "bakugo_technical dans toutes les sections."
          )
          print(
              "[OK] Portrait Cluster : "
              "assets/bakugo/bakugo_technical/portrait.webp"
          )
          print(
              "[OK] Images α/β/γ : dossier bakugo_technical."
          )
          print(
              "[OK] Bakugo Original reste dans bakugo_attack."
          )
          print(
              "[OK] Armored All Might reste dans "
              "armored_all_might_technical."
          )
          print(
              "[OK] Le style exact est vérifié avant "
              "la ressemblance du nom de compétence."
          )
          PY

      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/v608-patch-notes-final.js

      - name: Publier le correctif
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/index.html \
            public/data/home_data.json \
            public/data/home_data.js \
            public/js/v608-patch-notes-final.js

          if git diff --cached --quiet; then
            echo "[OK] Le correctif V659 est déjà appliqué."
            exit 0
          fi

          git commit -m "fix: séparer Bakugo Original et Cluster dans les Patch Notes"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] Correctif V659 publié sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Impossible de publier V659."
          exit 1
