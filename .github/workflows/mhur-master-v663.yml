name: MHUR - Master V663

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "MHUR - Synchronisation UltraRumble"
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: mhur-master-v663
  cancel-in-progress: true

jobs:
  nettoyer-et-corriger:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Annuler les anciens workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_SYNC=".github/workflows/mhur-sync-ultrarumble.yml"
          KEEP_MASTER=".github/workflows/mhur-master-v663.yml"

          mapfile -t KEEP_IDS < <(
            gh api --paginate               "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100"               --jq ".workflows[] |
                select(
                  .path == \"$KEEP_SYNC\" or
                  .path == \"$KEEP_MASTER\"
                ) |
                .id"
          )

          is_kept() {
            local wanted="$1"
            local current

            for current in "${KEEP_IDS[@]:-}"; do
              if [[ "$current" == "$wanted" ]]; then
                return 0
              fi
            done

            return 1
          }

          for status in queued in_progress; do
            while IFS=$'\t' read -r run_id workflow_id run_name; do
              [[ -z "${run_id:-}" ]] && continue
              [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue

              if is_kept "$workflow_id"; then
                echo "[GARDÉ] $run_name — $run_id"
                continue
              fi

              echo "[ANNULATION] $run_name — $run_id"
              gh api                 --method POST                 "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel"                 >/dev/null 2>&1 || true
            done < <(
              gh api --paginate                 "repos/${GITHUB_REPOSITORY}/actions/runs?status=$status&per_page=100"                 --jq '.workflow_runs[] |
                  [.id, .workflow_id, .name] |
                  @tsv'
            )
          done

      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Supprimer les anciens fichiers workflows
        shell: bash
        run: |
          set -euo pipefail

          find .github/workflows             -maxdepth 1             -type f             \( -name "*.yml" -o -name "*.yaml" \)             ! -name "mhur-sync-ultrarumble.yml"             ! -name "mhur-master-v663.yml"             -print             -delete

          echo "[OK] Seuls Sync et Master V663 sont conservés."

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Corriger le splash et le double NEW
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          PUBLIC = Path("public")
          INDEX = PUBLIC / "index.html"
          UI_CSS = PUBLIC / "css" / "v663-ui-final.css"
          UI_JS = PUBLIC / "js" / "v663-ui-final.js"
          LIVE_UPDATE = PUBLIC / "js" / "v36-live-site-update.js"
          SERVICE_WORKER = PUBLIC / "service-worker.js"
          HEADERS = PUBLIC / "_headers"
          VERSION_JSON = PUBLIC / "version.json"

          if not INDEX.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")

          commit = subprocess.check_output(
              ["git", "rev-parse", "--short=12", "HEAD"],
              text=True,
          ).strip()

          build = f"663-{commit}"
          updated_at = datetime.now(timezone.utc).replace(
              microsecond=0
          ).isoformat()

          ui_css = '/* MHUR V663 — splash propre + un seul badge NEW */\n\n/* ========================= ÉCRAN DE CHARGEMENT ========================= */\n\n#mhurV663Splash {\n  position: fixed;\n  inset: 0;\n  z-index: 2147483647;\n  display: none;\n  place-items: center;\n  padding: 22px;\n  overflow: hidden;\n  background:\n    radial-gradient(circle at 18% 16%, rgba(25, 201, 222, .22), transparent 34%),\n    radial-gradient(circle at 82% 82%, rgba(255, 225, 0, .18), transparent 32%),\n    linear-gradient(145deg, #040914 0%, #071426 48%, #091b31 100%);\n  font-family: Arial, Helvetica, sans-serif;\n}\n\nhtml.mhur-v663-booting #mhurV663Splash {\n  display: grid !important;\n}\n\nhtml.mhur-v663-booting body > :not(#mhurV663Splash) {\n  visibility: hidden !important;\n}\n\n.mhurV663SplashGlow {\n  position: absolute;\n  width: min(76vw, 720px);\n  aspect-ratio: 1;\n  border-radius: 50%;\n  background:\n    conic-gradient(\n      from 30deg,\n      rgba(255, 225, 0, .16),\n      rgba(25, 201, 222, .12),\n      rgba(221, 63, 255, .12),\n      rgba(255, 225, 0, .16)\n    );\n  filter: blur(60px);\n  animation: mhurV663GlowSpin 8s linear infinite;\n}\n\n.mhurV663SplashCard {\n  position: relative;\n  width: min(92vw, 520px);\n  padding: clamp(24px, 5vw, 42px);\n  border: 2px solid rgba(84, 183, 255, .62);\n  border-radius: 24px;\n  overflow: hidden;\n  background:\n    linear-gradient(145deg, rgba(15, 35, 61, .97), rgba(5, 15, 29, .98));\n  box-shadow:\n    0 28px 90px rgba(0, 0, 0, .56),\n    0 0 0 1px rgba(255, 255, 255, .05) inset,\n    0 0 48px rgba(25, 201, 222, .13);\n  text-align: center;\n}\n\n.mhurV663SplashCard::before {\n  content: "";\n  position: absolute;\n  inset: 0 0 auto;\n  height: 5px;\n  background: linear-gradient(90deg, #ffe100, #22c9ec, #db42ff);\n}\n\n.mhurV663LogoFrame {\n  width: 112px;\n  height: 112px;\n  margin: 0 auto 20px;\n  display: grid;\n  place-items: center;\n  border: 3px solid #07101f;\n  border-radius: 25px;\n  background:\n    radial-gradient(circle at 50% 32%, #fff7b0, #f3d313 47%, #9d7d00 100%);\n  box-shadow:\n    0 8px 0 #02050b,\n    0 0 0 3px #ffe100,\n    0 0 34px rgba(255, 225, 0, .25);\n  transform: rotate(-2deg);\n}\n\n.mhurV663LogoFrame img {\n  width: 84px;\n  height: 84px;\n  object-fit: contain;\n  display: block;\n}\n\n.mhurV663SplashEyebrow {\n  margin: 0 0 8px;\n  color: #73ddff;\n  font-size: 12px;\n  font-weight: 1000;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n}\n\n.mhurV663SplashTitle {\n  margin: 0;\n  color: #fff;\n  font-size: clamp(30px, 7vw, 48px);\n  font-weight: 1000;\n  line-height: .96;\n  letter-spacing: -.045em;\n  text-shadow: 0 4px 0 #03060c;\n}\n\n.mhurV663SplashTitle span {\n  color: #ffe100;\n}\n\n.mhurV663SplashText {\n  margin: 15px auto 22px;\n  max-width: 380px;\n  color: #c9ddf2;\n  font-size: 15px;\n  font-weight: 800;\n  line-height: 1.45;\n}\n\n.mhurV663Progress {\n  position: relative;\n  width: 100%;\n  height: 12px;\n  overflow: hidden;\n  border: 2px solid #03070d;\n  border-radius: 999px;\n  background: #06101e;\n  box-shadow: 0 0 0 1px rgba(85, 171, 234, .35);\n}\n\n.mhurV663Progress::before {\n  content: "";\n  position: absolute;\n  inset: 0;\n  width: 44%;\n  border-radius: inherit;\n  background:\n    linear-gradient(90deg, #ffe100, #2cd2ef 55%, #d840ff);\n  box-shadow: 0 0 22px rgba(44, 210, 239, .54);\n  animation: mhurV663Loading 1.12s ease-in-out infinite;\n}\n\n.mhurV663SplashChips {\n  margin-top: 18px;\n  display: flex;\n  justify-content: center;\n  flex-wrap: wrap;\n  gap: 8px;\n}\n\n.mhurV663SplashChips span {\n  padding: 6px 10px;\n  border: 1px solid rgba(89, 179, 239, .38);\n  border-radius: 999px;\n  background: rgba(5, 16, 31, .66);\n  color: #d9ebfc;\n  font-size: 11px;\n  font-weight: 900;\n  text-transform: uppercase;\n  letter-spacing: .055em;\n}\n\nhtml.mhur-v663-ready #mhurV663Splash {\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity .24s ease;\n}\n\n@keyframes mhurV663Loading {\n  0% {\n    transform: translateX(-115%);\n  }\n  52% {\n    transform: translateX(82%);\n  }\n  100% {\n    transform: translateX(245%);\n  }\n}\n\n@keyframes mhurV663GlowSpin {\n  to {\n    transform: rotate(360deg);\n  }\n}\n\n/* ========================= BADGE NEW UNIQUE ========================= */\n\n/*\n  Tous les anciens NEW restent cachés sur les cartes de costumes.\n  V582 devient l\'unique source visible.\n*/\n.costumeTile > .s18NewBadge,\n.costumeTile > [class*="s18NewBadge"],\n.costumeTile > [class*="s18NewPulse"],\n.costumeTile > [class*="s18CostumeNew"],\n.costumeTile > [class*="mhurNew"]:not(.mhurNewV582),\n.costumeTile > [aria-label="NEW"]:not(.mhurNewV582),\n.costumeTile > img[src*="new_badge"]:not(.mhurNewV582),\n.costumeCard > .s18NewBadge,\n.costumeCard > [class*="s18NewBadge"],\n.costumeCard > [class*="s18NewPulse"],\n.costumeCard > [class*="s18CostumeNew"],\n.costumeCard > [class*="mhurNew"]:not(.mhurNewV582),\n.costumeCard > [aria-label="NEW"]:not(.mhurNewV582),\n.costumeCard > img[src*="new_badge"]:not(.mhurNewV582),\n.costumeResult > .s18NewBadge,\n.costumeResult > [class*="s18NewBadge"],\n.costumeResult > [class*="s18NewPulse"],\n.costumeResult > [class*="s18CostumeNew"],\n.costumeResult > [class*="mhurNew"]:not(.mhurNewV582),\n.costumeResult > [aria-label="NEW"]:not(.mhurNewV582),\n.costumeResult > img[src*="new_badge"]:not(.mhurNewV582),\n[data-costume-id] > [class*="s18NewBadge"],\n[data-costume-id] > [class*="s18NewPulse"],\n[data-costume-id] > [class*="mhurNew"]:not(.mhurNewV582),\n[data-costume] > [class*="s18NewBadge"],\n[data-costume] > [class*="s18NewPulse"],\n[data-costume] > [class*="mhurNew"]:not(.mhurNewV582) {\n  display: none !important;\n  visibility: hidden !important;\n  opacity: 0 !important;\n  animation: none !important;\n}\n\n/* Le seul NEW visible. */\n.costumeTile > .mhurNewV582,\n.costumeCard > .mhurNewV582,\n.costumeResult > .mhurNewV582,\n[data-costume-id] > .mhurNewV582,\n[data-costume] > .mhurNewV582 {\n  position: absolute !important;\n  top: 42px !important;\n  right: 8px !important;\n  left: auto !important;\n  z-index: 94 !important;\n  display: block !important;\n  visibility: visible !important;\n  width: 68px !important;\n  height: 36px !important;\n  padding: 0 !important;\n  border: 0 !important;\n  border-radius: 0 !important;\n  overflow: visible !important;\n  background:\n    transparent\n    url("../assets/home/icons/new_badge_custom.png")\n    center / contain\n    no-repeat !important;\n  color: transparent !important;\n  text-indent: -9999px !important;\n  filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .78)) !important;\n  transform-origin: top right !important;\n  animation: mhurV663NewPulse .9s ease-in-out infinite !important;\n}\n\n@keyframes mhurV663NewPulse {\n  0%,\n  100% {\n    scale: .94;\n  }\n\n  50% {\n    scale: 1.09;\n  }\n}\n\n@media (max-width: 700px) {\n  .mhurV663SplashCard {\n    padding: 27px 20px 24px;\n    border-radius: 19px;\n  }\n\n  .mhurV663LogoFrame {\n    width: 92px;\n    height: 92px;\n    border-radius: 21px;\n  }\n\n  .mhurV663LogoFrame img {\n    width: 70px;\n    height: 70px;\n  }\n\n  .costumeTile > .mhurNewV582,\n  .costumeCard > .mhurNewV582,\n  .costumeResult > .mhurNewV582,\n  [data-costume-id] > .mhurNewV582,\n  [data-costume] > .mhurNewV582 {\n    top: 37px !important;\n    right: 7px !important;\n    width: 58px !important;\n    height: 31px !important;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .mhurV663Progress::before,\n  .mhurV663SplashGlow,\n  .mhurNewV582 {\n    animation: none !important;\n  }\n}\n'
          ui_js = '(() => {\n  \'use strict\';\n\n  const BUILD = __BUILD_JSON__;\n  const root = document.documentElement;\n  const CARD_SELECTOR = [\n    \'.costumeTile\',\n    \'.costumeCard\',\n    \'.costumeResult\',\n    \'[data-costume-id]\',\n    \'[data-costume]\'\n  ].join(\',\');\n\n  const LEGACY_SELECTOR = [\n    \'.s18NewBadge\',\n    \'[class*="s18NewBadge"]\',\n    \'[class*="s18NewPulse"]\',\n    \'[class*="s18CostumeNew"]\',\n    \'[class*="mhurNew"]:not(.mhurNewV582)\',\n    \'[aria-label="NEW"]:not(.mhurNewV582)\',\n    \'img[src*="new_badge"]:not(.mhurNewV582)\'\n  ].join(\',\');\n\n  let revealed = false;\n  let queued = false;\n\n  function directChildren(card, selector) {\n    try {\n      return [...card.querySelectorAll(`:scope > ${selector}`)];\n    } catch (_error) {\n      return [...card.children].filter(child => child.matches?.(selector));\n    }\n  }\n\n  function dedupeCard(card) {\n    if (!card) return;\n\n    const canonical = directChildren(card, \'.mhurNewV582\');\n\n    canonical.slice(1).forEach(node => node.remove());\n\n    directChildren(card, LEGACY_SELECTOR).forEach(node => {\n      if (!node.classList?.contains(\'mhurNewV582\')) {\n        node.remove();\n      }\n    });\n\n    /*\n      Certains anciens scripts placent le badge dans un petit wrapper.\n      On retire uniquement les wrappers qui ne contiennent rien d\'autre.\n    */\n    card.querySelectorAll(LEGACY_SELECTOR).forEach(node => {\n      if (node.classList?.contains(\'mhurNewV582\')) return;\n\n      const parent = node.parentElement;\n      node.remove();\n\n      if (\n        parent &&\n        parent !== card &&\n        parent.childElementCount === 0 &&\n        !String(parent.textContent || \'\').trim()\n      ) {\n        parent.remove();\n      }\n    });\n  }\n\n  function dedupeAll(scope = document) {\n    const cards = [];\n\n    if (scope.matches?.(CARD_SELECTOR)) {\n      cards.push(scope);\n    }\n\n    if (scope.querySelectorAll) {\n      cards.push(...scope.querySelectorAll(CARD_SELECTOR));\n    }\n\n    [...new Set(cards)].forEach(dedupeCard);\n  }\n\n  function tuneImages(scope = document) {\n    scope\n      .querySelectorAll?.(\'img:not([data-mhur-v663-image])\')\n      .forEach((image, index) => {\n        image.dataset.mhurV663Image = \'1\';\n        image.decoding = \'async\';\n\n        const rect = image.getBoundingClientRect();\n        const visible =\n          rect.top < window.innerHeight * 1.4 &&\n          rect.bottom > -100;\n\n        if (!visible || index > 12) {\n          image.loading = \'lazy\';\n          image.fetchPriority = \'low\';\n        }\n      });\n  }\n\n  function work(scope = document) {\n    dedupeAll(scope);\n    tuneImages(scope);\n  }\n\n  function schedule(scope = document) {\n    if (queued) return;\n    queued = true;\n\n    requestAnimationFrame(() => {\n      queued = false;\n      work(scope);\n    });\n  }\n\n  function reveal() {\n    if (revealed) return;\n    revealed = true;\n\n    work(document);\n\n    requestAnimationFrame(() => {\n      requestAnimationFrame(() => {\n        root.classList.remove(\'mhur-v663-booting\');\n        root.classList.add(\'mhur-v663-ready\');\n        root.dataset.mhurBuild = BUILD;\n\n        const splash = document.getElementById(\'mhurV663Splash\');\n\n        if (splash) {\n          setTimeout(() => splash.remove(), 280);\n        }\n\n        window.dispatchEvent(\n          new CustomEvent(\'mhur:v663-ready\', {\n            detail: { build: BUILD }\n          })\n        );\n      });\n    });\n  }\n\n  function start() {\n    new MutationObserver(mutations => {\n      const added = mutations.flatMap(mutation =>\n        [...(mutation.addedNodes || [])]\n      );\n\n      if (!added.length) return;\n\n      schedule(document);\n    }).observe(document.body, {\n      childList: true,\n      subtree: true\n    });\n\n    reveal();\n\n    setTimeout(() => schedule(document), 80);\n    setTimeout(() => schedule(document), 300);\n    setTimeout(() => schedule(document), 900);\n  }\n\n  document.addEventListener(\n    \'click\',\n    event => {\n      if (\n        event.target?.closest?.(\n          \'.costumeTile,.costumeCard,.costumeResult,\' +\n          \'[data-costume-id],[data-costume]\'\n        )\n      ) {\n        setTimeout(() => schedule(document), 0);\n        setTimeout(() => schedule(document), 100);\n      }\n    },\n    true\n  );\n\n  window.addEventListener(\'mhur:languagechange\', () => {\n    schedule(document);\n  });\n\n  if (document.readyState === \'loading\') {\n    document.addEventListener(\'DOMContentLoaded\', start, { once: true });\n  } else {\n    start();\n  }\n\n  /* Sécurité : le site ne reste jamais bloqué derrière le splash. */\n  setTimeout(reveal, 3500);\n\n  window.MHUR_V663 = {\n    build: BUILD,\n    refresh: () => schedule(document),\n    dedupe: dedupeAll\n  };\n})();\n'.replace(
              "__BUILD_JSON__",
              json.dumps(build),
          )
          live_update = "(() => {\n  'use strict';\n\n  const CURRENT = __BUILD_JSON__;\n  const RELOAD_KEY = 'mhur-v663-reloaded-build';\n  let checking = false;\n\n  async function getRemoteBuild() {\n    const response = await fetch(`/version.json?t=${Date.now()}`, {\n      cache: 'no-store',\n      headers: { 'Cache-Control': 'no-cache' }\n    });\n\n    if (!response.ok) {\n      throw new Error(`version ${response.status}`);\n    }\n\n    const data = await response.json();\n    return String(data?.build || data?.version || '');\n  }\n\n  async function registerWorker() {\n    if (\n      !('serviceWorker' in navigator) ||\n      location.protocol !== 'https:'\n    ) {\n      return;\n    }\n\n    const registrations =\n      await navigator.serviceWorker.getRegistrations();\n\n    for (const registration of registrations) {\n      const script =\n        registration.active?.scriptURL ||\n        registration.waiting?.scriptURL ||\n        registration.installing?.scriptURL ||\n        '';\n\n      if (script && !script.includes('/service-worker.js')) {\n        await registration.unregister();\n      }\n    }\n\n    const registration = await navigator.serviceWorker.register(\n      `/service-worker.js?v=${encodeURIComponent(CURRENT)}`,\n      {\n        scope: '/',\n        updateViaCache: 'none'\n      }\n    );\n\n    await registration.update();\n    registration.waiting?.postMessage({ type: 'SKIP_WAITING' });\n  }\n\n  async function check() {\n    if (\n      checking ||\n      document.visibilityState === 'hidden' ||\n      !navigator.onLine\n    ) {\n      return;\n    }\n\n    checking = true;\n\n    try {\n      const remote = await getRemoteBuild();\n\n      if (!remote || remote === CURRENT) return;\n\n      await registerWorker();\n\n      if (sessionStorage.getItem(RELOAD_KEY) === remote) {\n        return;\n      }\n\n      sessionStorage.setItem(RELOAD_KEY, remote);\n      location.reload();\n    } catch (error) {\n      console.debug('MHUR update check:', error);\n    } finally {\n      checking = false;\n    }\n  }\n\n  addEventListener(\n    'load',\n    async () => {\n      try {\n        await registerWorker();\n      } catch (error) {\n        console.debug('MHUR service worker:', error);\n      }\n\n      check();\n      setInterval(check, 300000);\n    },\n    { once: true }\n  );\n\n  document.addEventListener('visibilitychange', () => {\n    if (document.visibilityState === 'visible') check();\n  });\n\n  addEventListener('online', check);\n})();\n".replace(
              "__BUILD_JSON__",
              json.dumps(build),
          )
          service_worker = "const RELEASE = __BUILD_JSON__;\nconst PREFIX = 'mhur-v663-';\nconst STATIC_CACHE = `${PREFIX}static-${RELEASE}`;\nconst OFFLINE_CACHE = `${PREFIX}offline-${RELEASE}`;\nconst OFFLINE_URL = '/index.html';\n\nself.addEventListener('message', event => {\n  if (event.data?.type === 'SKIP_WAITING') {\n    self.skipWaiting();\n  }\n});\n\nself.addEventListener('install', event => {\n  event.waitUntil(\n    (async () => {\n      const cache = await caches.open(OFFLINE_CACHE);\n\n      try {\n        const response = await fetch(OFFLINE_URL, {\n          cache: 'no-store'\n        });\n\n        if (response.ok) {\n          await cache.put(OFFLINE_URL, response);\n        }\n      } catch (_error) {}\n\n      await self.skipWaiting();\n    })()\n  );\n});\n\nself.addEventListener('activate', event => {\n  event.waitUntil(\n    (async () => {\n      const keys = await caches.keys();\n\n      await Promise.all(\n        keys\n          .filter(key => key !== STATIC_CACHE && key !== OFFLINE_CACHE)\n          .map(key => caches.delete(key))\n      );\n\n      await self.clients.claim();\n    })()\n  );\n});\n\nasync function networkFirst(request) {\n  try {\n    const response = await fetch(request, {\n      cache: 'no-cache'\n    });\n\n    if (response.ok) {\n      const cache = await caches.open(STATIC_CACHE);\n      await cache.put(request, response.clone());\n    }\n\n    return response;\n  } catch (error) {\n    const cached = await caches.match(request);\n    if (cached) return cached;\n    throw error;\n  }\n}\n\nasync function cacheFirst(request) {\n  const cached = await caches.match(request);\n  if (cached) return cached;\n\n  const response = await fetch(request);\n\n  if (response.ok) {\n    const cache = await caches.open(STATIC_CACHE);\n    await cache.put(request, response.clone());\n  }\n\n  return response;\n}\n\nself.addEventListener('fetch', event => {\n  const request = event.request;\n\n  if (request.method !== 'GET') return;\n\n  const url = new URL(request.url);\n\n  if (url.origin !== self.location.origin) return;\n\n  if (request.mode === 'navigate') {\n    event.respondWith(\n      (async () => {\n        try {\n          const response = await fetch(request, {\n            cache: 'no-store'\n          });\n\n          if (response.ok) {\n            const cache = await caches.open(OFFLINE_CACHE);\n            await cache.put(OFFLINE_URL, response.clone());\n          }\n\n          return response;\n        } catch (_error) {\n          return (\n            (await caches.match(OFFLINE_URL)) ||\n            new Response('Connexion indisponible.', {\n              status: 503,\n              headers: {\n                'Content-Type': 'text/plain; charset=utf-8'\n              }\n            })\n          );\n        }\n      })()\n    );\n    return;\n  }\n\n  if (\n    request.destination === 'script' ||\n    request.destination === 'style' ||\n    url.pathname.startsWith('/data/') ||\n    url.pathname === '/version.json' ||\n    url.pathname === '/service-worker.js'\n  ) {\n    event.respondWith(networkFirst(request));\n    return;\n  }\n\n  if (\n    request.destination === 'image' ||\n    request.destination === 'font' ||\n    url.pathname.startsWith('/assets/')\n  ) {\n    event.respondWith(cacheFirst(request));\n  }\n});\n".replace(
              "__BUILD_JSON__",
              json.dumps(build),
          )
          headers = '/*\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: strict-origin-when-cross-origin\n\n/\n  Cache-Control: no-store, no-cache, must-revalidate, max-age=0\n  Pragma: no-cache\n  Expires: 0\n\n/index.html\n  Cache-Control: no-store, no-cache, must-revalidate, max-age=0\n  Pragma: no-cache\n  Expires: 0\n\n/version.json\n  Cache-Control: no-store, no-cache, must-revalidate, max-age=0\n\n/service-worker.js\n  Cache-Control: no-store, no-cache, must-revalidate, max-age=0\n  Service-Worker-Allowed: /\n  Content-Type: application/javascript; charset=utf-8\n\n/css/*\n  Cache-Control: public, max-age=31536000, immutable\n\n/js/*\n  Cache-Control: public, max-age=31536000, immutable\n\n/data/*\n  Cache-Control: public, max-age=31536000, immutable\n\n/assets/*\n  Cache-Control: public, max-age=2592000, stale-while-revalidate=604800\n'

          UI_CSS.parent.mkdir(parents=True, exist_ok=True)

          UI_CSS.write_text(
              ui_css.rstrip() + "\n",
              encoding="utf-8",
          )
          UI_JS.write_text(
              ui_js.rstrip() + "\n",
              encoding="utf-8",
          )
          LIVE_UPDATE.write_text(
              live_update.rstrip() + "\n",
              encoding="utf-8",
          )
          SERVICE_WORKER.write_text(
              service_worker.rstrip() + "\n",
              encoding="utf-8",
          )
          HEADERS.write_text(
              headers.rstrip() + "\n",
              encoding="utf-8",
          )
          VERSION_JSON.write_text(
              json.dumps(
                  {
                      "version": build,
                      "build": build,
                      "updatedAt": updated_at,
                      "name": f"MHUR France {build}",
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          index = INDEX.read_text(encoding="utf-8")

          # Supprimer les anciens écrans de chargement V661/V662/V663.
          index = re.sub(
              r"\s*<!-- MHUR V66[1-3] BOOT START -->.*?"
              r"<!-- MHUR V66[1-3] BOOT END -->\s*",
              "\n",
              index,
              flags=re.DOTALL,
          )

          index = re.sub(
              r"\s*<div\s+id=[\"']mhurV663Splash[\"'].*?</div>\s*"
              r"(?=\s*(?:<script|</body>))",
              "\n",
              index,
              flags=re.DOTALL | re.IGNORECASE,
          )

          # Retirer les anciens fichiers de performance V661/V662/V663.
          index = re.sub(
              r"\s*<(?:link|script)\b[^>]*"
              r"(?:v66[1-3]-(?:performance|ui-final)\.(?:css|js))"
              r"[^>]*(?:>\s*</script>|>)\s*",
              "\n",
              index,
              flags=re.IGNORECASE,
          )

          boot_block = f"""
          <!-- MHUR V663 BOOT START -->
          <script>
          document.documentElement.classList.add('mhur-v663-booting');
          setTimeout(function(){{
            document.documentElement.classList.remove('mhur-v663-booting');
          }},4000);
          </script>
          <!-- MHUR V663 BOOT END -->
          """.strip()

          head = re.search(
              r"<head\b[^>]*>",
              index,
              flags=re.IGNORECASE,
          )

          if not head:
              raise SystemExit("[ERREUR] Balise <head> introuvable.")

          index = (
              index[:head.end()]
              + "\n"
              + boot_block
              + "\n"
              + index[head.end():]
          )

          # Le CSS est placé juste avant </head> pour écraser les anciens badges.
          head_end = re.search(
              r"</head\s*>",
              index,
              flags=re.IGNORECASE,
          )

          if not head_end:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")

          css_tag = (
              f'<link rel="stylesheet" '
              f'href="css/v663-ui-final.css?v={build}">'
          )

          index = (
              index[:head_end.start()]
              + css_tag
              + "\n"
              + index[head_end.start():]
          )

          body = re.search(
              r"<body\b[^>]*>",
              index,
              flags=re.IGNORECASE,
          )

          if not body:
              raise SystemExit("[ERREUR] Balise <body> introuvable.")

          splash = """
          <div id="mhurV663Splash" role="status" aria-live="polite">
            <div class="mhurV663SplashGlow" aria-hidden="true"></div>
            <section class="mhurV663SplashCard">
              <div class="mhurV663LogoFrame">
                <img
                  src="/assets/brand/mhur-france-icon.png"
                  alt=""
                  width="84"
                  height="84"
                >
              </div>
              <p class="mhurV663SplashEyebrow">Communauté française</p>
              <h1 class="mhurV663SplashTitle">
                MHUR <span>FRANCE</span>
              </h1>
              <p class="mhurV663SplashText">
                Chargement des personnages, costumes et données de la saison…
              </p>
              <div class="mhurV663Progress" aria-hidden="true"></div>
              <div class="mhurV663SplashChips" aria-hidden="true">
                <span>Personnages</span>
                <span>Patch Notes</span>
                <span>Builds</span>
              </div>
            </section>
          </div>
          """.strip()

          index = (
              index[:body.end()]
              + "\n"
              + splash
              + "\n"
              + index[body.end():]
          )

          # Supprimer une ancienne balise V663 avant de l'ajouter en dernier.
          index = re.sub(
              r"\s*<script\b[^>]*\bsrc\s*=\s*[\"']"
              r"(?:/)?js/v663-ui-final\.js"
              r"(?:\?[^\"']*)?[\"'][^>]*>\s*</script>\s*",
              "\n",
              index,
              flags=re.IGNORECASE,
          )

          # Même build pour tous les CSS, JS et data :
          # aucune combinaison ancienne/nouvelle après un refresh.
          asset_pattern = re.compile(
              r'(?P<prefix>\b(?:src|href)\s*=\s*["\'])'
              r'(?P<path>(?:/)?(?:css|js|data)/[^"\'?#]+)'
              r'(?:\?[^"\']*)?'
              r'(?P<suffix>["\'])',
              flags=re.IGNORECASE,
          )

          index = asset_pattern.sub(
              lambda match: (
                  f'{match.group("prefix")}'
                  f'{match.group("path")}'
                  f'?v={build}'
                  f'{match.group("suffix")}'
              ),
              index,
          )

          body_ends = list(
              re.finditer(
                  r"</body\s*>",
                  index,
                  flags=re.IGNORECASE,
              )
          )

          if not body_ends:
              raise SystemExit("[ERREUR] Balise </body> introuvable.")

          body_end = body_ends[-1]
          js_tag = (
              f'<script src="js/v663-ui-final.js?v={build}"></script>'
          )

          index = (
              index[:body_end.start()]
              + js_tag
              + "\n"
              + index[body_end.start():]
          )

          INDEX.write_text(index, encoding="utf-8")

          # Vérifications.
          final_index = INDEX.read_text(encoding="utf-8")

          if final_index.count("MHUR V663 BOOT START") != 1:
              raise SystemExit(
                  "[ERREUR] Le bloc de démarrage V663 est absent ou dupliqué."
              )

          if final_index.count('id="mhurV663Splash"') != 1:
              raise SystemExit(
                  "[ERREUR] Le splash V663 est absent ou dupliqué."
              )

          if final_index.count("js/v663-ui-final.js") != 1:
              raise SystemExit(
                  "[ERREUR] Le script V663 est absent ou dupliqué."
              )

          if final_index.count("css/v663-ui-final.css") != 1:
              raise SystemExit(
                  "[ERREUR] Le CSS V663 est absent ou dupliqué."
              )

          unversioned = re.findall(
              r'(?:src|href)=["\']'
              r'((?:/)?(?:css|js|data)/[^"\'?#]+)'
              r'["\']',
              final_index,
              flags=re.IGNORECASE,
          )

          if unversioned:
              raise SystemExit(
                  "[ERREUR] Ressources sans build : "
                  + ", ".join(unversioned[:10])
              )

          for script in (UI_JS, LIVE_UPDATE, SERVICE_WORKER):
              subprocess.run(
                  ["node", "--check", str(script)],
                  check=True,
              )

          if ".mhurNewV582" not in UI_CSS.read_text(encoding="utf-8"):
              raise SystemExit("[ERREUR] Le badge NEW canonique est absent.")

          if '[class*="s18NewBadge"]' not in UI_CSS.read_text(encoding="utf-8"):
              raise SystemExit("[ERREUR] Les anciens NEW ne sont pas masqués.")

          print(f"[OK] Build V663 : {build}")
          print("[OK] Splash MHUR complet avec logo et barre de chargement.")
          print("[OK] Un seul NEW animé par carte de costume.")
          print("[OK] Les anciens NEW fixes sont masqués et supprimés.")
          print("[OK] Tous les CSS/JS/data utilisent le même build.")
          PY

      - name: Publier Master V663
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A             .github/workflows             public/index.html             public/css/v663-ui-final.css             public/js/v663-ui-final.js             public/js/v36-live-site-update.js             public/service-worker.js             public/_headers             public/version.json

          if git diff --cached --quiet; then
            echo "[OK] Master V663 est déjà appliqué."
            exit 0
          fi

          git commit -m "fix: splash V663 et badge NEW unique"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              echo "[OK] Master V663 publié sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Publication impossible."
          exit 1
