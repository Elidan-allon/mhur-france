name: MHUR V591 - traduction anglais coherente

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v591-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v591-language-consistency
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Installer V591
        shell: bash
        run: |
          cat > /tmp/appliquer_v591.py <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          root = Path.cwd()
          index = root / "public" / "index.html"
          script = root / "public" / "js" / "v591-language-consistency.js"
          report = root / "RAPPORT_V591_TRADUCTION.txt"

          if not index.is_file():
              raise SystemExit("[ERREUR] public/index.html est introuvable.")

          script_content = "\n/* MHUR Nexus — V591 : cohérence complète français / anglais */\n(function(){\n  'use strict';\n\n  const VERSION='591';\n\n  const EXACT_TRANSLATIONS=[\n    ['Accueil','Home'],\n    ['Personnages','Characters'],\n    ['Costumes','Costumes'],\n    ['Builds communauté','Community Builds'],\n    ['Mods communauté','Community Mods'],\n    ['Réseaux sociaux','Social networks'],\n    ['Créateurs de contenu','Content creators'],\n    ['Se connecter','Sign In'],\n    ['Google ou Discord','Google or Discord'],\n    ['Notes de patch / Notes des développeurs','Patch Notes / Dev Notes'],\n    ['Installer des mods - PC Steam uniquement','Install mods - PC Steam only'],\n    ['Clique ici pour ouvrir le tutoriel','Click here to open the tutorial'],\n    ['Voir le tutoriel','Open tutorial'],\n    ['Fermer','Close'],\n    ['Retour','Back'],\n    ['Rechercher','Search'],\n    ['Aucun résultat','No results'],\n    ['Chargement…','Loading…'],\n    ['Chargement...','Loading...'],\n    ['Réessayer','Try again'],\n    ['Publier','Publish'],\n    ['Modifier','Edit'],\n    ['Supprimer','Delete'],\n    ['Annuler','Cancel'],\n    ['Enregistrer','Save'],\n    ['Télécharger','Download'],\n    ['Favoris','Favorites'],\n    ['Commentaires','Comments'],\n    ['Récent','Recent'],\n    ['Populaire','Popular'],\n    ['Tous','All'],\n    ['Divers','Misc'],\n    ['Environnement','Environment'],\n    ['Interface','UI'],\n    ['Sorties prévues','Planned releases'],\n    ['Dernières sorties','Latest releases'],\n    ['Nouveau personnage','New character'],\n    ['Nouveau style','New style'],\n    ['Disponible maintenant','Available now'],\n    ['Disponible depuis le 29 juillet','Available since July 29'],\n    ['Sortie le 19 août','Releases August 19'],\n    ['Prévu pendant la Saison 18','Planned during Season 18'],\n    ['Saison 18','Season 18'],\n    ['Aucune note disponible.','No notes available.'],\n    ['Aucun détail disponible.','No details available.'],\n    ['Lire la Dev Note officielle','Read the official Dev Note'],\n    ['Voir la page officielle Saison 18','View the official Season 18 page'],\n    ['Panneau admin','Admin panel'],\n    ['Suppressions de compte','Account deletions'],\n    ['Modération','Moderation'],\n    ['Profils','Profiles'],\n    ['Actualiser','Refresh'],\n    ['Utilisateur inconnu','Unknown user'],\n    [\"Copier l'ID\",'Copy ID'],\n    ['Refuser','Reject'],\n    ['Marquer traitée','Mark processed'],\n    ['Aucune demande de suppression.','No deletion requests.'],\n    ['Centre de modération','Moderation center'],\n    ['Ouvrir la modération','Open moderation'],\n    ['Liste des profils','Profile list'],\n    ['Ouvrir la liste','Open list'],\n    ['Admin / Modération','Admin / Moderation'],\n    ['HÉROS','HEROES'],\n    ['SUPER-VILAINS','SUPER-VILLAINS'],\n    ['Attaque','Strike'],\n    ['Assaut','Assault'],\n    ['Technique','Technical'],\n    ['Soutien','Support'],\n    ['Vitesse','Rapid'],\n    ['Avant','Before'],\n    ['Après','After'],\n    ['NEUTRE','NEUTRAL']\n  ];\n\n  const FR_TO_EN=new Map(EXACT_TRANSLATIONS);\n  const EN_TO_FR=new Map(\n    EXACT_TRANSLATIONS.map(([fr,en])=>[en,fr])\n  );\n\n  function currentLanguage(){\n    try{\n      if(typeof lang!=='undefined'&&(lang==='fr'||lang==='en')){\n        return lang;\n      }\n    }catch(_error){}\n\n    const htmlLanguage=String(\n      document.documentElement.lang||''\n    ).toLowerCase();\n\n    if(htmlLanguage.startsWith('en'))return 'en';\n    if(htmlLanguage.startsWith('fr'))return 'fr';\n\n    try{\n      const saved=\n        localStorage.getItem('mhur_lang')||\n        localStorage.getItem('lang')||\n        '';\n\n      if(saved==='en'||saved==='fr')return saved;\n    }catch(_error){}\n\n    return 'fr';\n  }\n\n  function english(){\n    return currentLanguage()==='en';\n  }\n\n  function translated(value){\n    const text=String(value??'').trim();\n\n    if(!text)return text;\n\n    if(english()){\n      return FR_TO_EN.get(text)||text;\n    }\n\n    return EN_TO_FR.get(text)||text;\n  }\n\n  function setText(element,value){\n    if(!element)return;\n\n    const text=String(value??'');\n\n    if(element.textContent!==text){\n      element.textContent=text;\n    }\n  }\n\n  function translateExactElement(element){\n    if(!(element instanceof HTMLElement))return;\n\n    /*\n      On ne remplace que les éléments ne contenant pas d'autres éléments.\n      Cela empêche de détruire les icônes, images et structures complexes.\n    */\n    if(element.children.length)return;\n\n    const current=String(element.textContent||'').trim();\n    const replacement=translated(current);\n\n    if(replacement!==current){\n      element.textContent=replacement;\n    }\n\n    for(const attribute of ['title','aria-label','placeholder']){\n      if(!element.hasAttribute(attribute))continue;\n\n      const value=element.getAttribute(attribute)||'';\n      const next=translated(value);\n\n      if(next!==value){\n        element.setAttribute(attribute,next);\n      }\n    }\n  }\n\n  function translateStaticInterface(root=document){\n    const selectors=[\n      'button',\n      'a',\n      'label',\n      'option',\n      'summary span',\n      '.nexusHeaderBtnLabel',\n      '.mhurPatchDevLabelV587',\n      '.modsTutorialTitleV540',\n      '.modsTutorialHintV540',\n      '.s18ModsHintV10',\n      '#signinTitle',\n      '#signinSub',\n      '[data-notes-title]',\n      '[data-tab]',\n      '.badge',\n      '.releaseNamesV299 small',\n      '.releaseNamesV299 em'\n    ].join(',');\n\n    root.querySelectorAll?.(selectors).forEach(translateExactElement);\n  }\n\n  function syncDocumentLanguage(){\n    const language=currentLanguage();\n\n    if(document.documentElement.lang!==language){\n      document.documentElement.lang=language;\n    }\n\n    document.documentElement.dataset.mhurLanguage=language;\n  }\n\n  function syncHeader(){\n    const isEnglish=english();\n\n    const signinTitle=document.getElementById('signinTitle');\n    const signinSub=document.getElementById('signinSub');\n\n    setText(signinTitle,isEnglish?'Sign In':'Se connecter');\n    setText(signinSub,isEnglish?'Google or Discord':'Google ou Discord');\n\n    const notesButtons=document.querySelectorAll(\n      '#mhurPatchDevButtonV14,'+\n      '.mhurPatchDevButtonV14,'+\n      '[data-s18-notes-button]'\n    );\n\n    notesButtons.forEach(button=>{\n      const label=button.querySelector(\n        '.mhurPatchDevLabelV587,span:last-child'\n      );\n\n      setText(\n        label,\n        isEnglish\n          ?'Patch Notes / Dev Notes'\n          :'Notes de patch / Notes des développeurs'\n      );\n\n      const accessible=isEnglish\n        ?'Open Patch Notes and Dev Notes'\n        :'Ouvrir les notes de patch et les notes des développeurs';\n\n      button.setAttribute('aria-label',accessible);\n      button.setAttribute('title',accessible);\n    });\n\n    const social=document.querySelector(\n      '[data-nexus-menu=\"social\"] .nexusHeaderBtnLabel'\n    );\n    const creators=document.querySelector(\n      '[data-nexus-menu=\"youtube\"] .nexusHeaderBtnLabel'\n    );\n\n    setText(\n      social,\n      isEnglish?'Social networks':'Réseaux sociaux'\n    );\n    setText(\n      creators,\n      isEnglish?'Content creators':'Créateurs de contenu'\n    );\n\n    document.querySelectorAll('.langPart[data-lang-code]').forEach(part=>{\n      const active=part.dataset.langCode===currentLanguage();\n      part.classList.toggle('active',active);\n      part.setAttribute('aria-current',active?'true':'false');\n    });\n  }\n\n  function syncModsPage(){\n    const api=window.MHUR_MODS;\n    const onMods=(\n      document.querySelector('.modsPage')||\n      (\n        typeof window.page!=='undefined'&&\n        window.page==='mods'\n      )\n    );\n\n    if(onMods&&typeof api?.renderPage==='function'){\n      api.renderPage(true);\n    }\n\n    const detail=document.getElementById('modsDetailModal');\n\n    if(\n      detail&&\n      !detail.hidden&&\n      api?.state?.active&&\n      typeof api?.openDetail==='function'\n    ){\n      api.openDetail(api.state.active.id);\n    }\n  }\n\n  function activePatchIndex(modal){\n    const active=modal?.querySelector(\n      '[data-patch-index].active'\n    );\n    const index=Number(active?.dataset?.patchIndex);\n\n    return Number.isFinite(index)?index:0;\n  }\n\n  function syncNotes(){\n    const modal=document.getElementById('s18NotesDevModalV10');\n\n    if(!modal)return;\n\n    const isEnglish=english();\n\n    setText(\n      modal.querySelector('[data-notes-title]'),\n      isEnglish\n        ?'Patch Notes / Dev Notes'\n        :'Notes de patch / Notes des développeurs'\n    );\n    setText(\n      modal.querySelector('[data-tab=\"patch\"]'),\n      isEnglish?'Patch Notes':'Notes de patch'\n    );\n    setText(\n      modal.querySelector('[data-tab=\"dev\"]'),\n      isEnglish?'Dev Notes':'Notes des développeurs'\n    );\n\n    if(!modal.classList.contains('open'))return;\n\n    const activeTab=modal.querySelector('[data-tab].active')\n      ?.dataset?.tab||'patch';\n\n    if(activeTab==='patch'){\n      const index=activePatchIndex(modal);\n      const api=(\n        window.MHUR_S18_V14||\n        window.MHUR_S18_V13||\n        window.MHUR_S18_V10\n      );\n\n      if(typeof api?.showPatch==='function'){\n        api.showPatch(index);\n      }else if(typeof window.MHUR_V587?.showPatch==='function'){\n        window.MHUR_V587.showPatch(index);\n      }\n    }else{\n      /*\n        Le gestionnaire d'origine connaît le contenu exact de la Dev Note.\n        Un clic programmatique le reconstruit dans la langue courante.\n      */\n      const devButton=modal.querySelector('[data-tab=\"dev\"]');\n      devButton?.click?.();\n    }\n  }\n\n  function syncHomeAndCurrentPage(){\n    /*\n      Le rendu principal possède déjà les données bilingues.\n      On le relance seulement lorsque l'événement de langue est reçu.\n    */\n    try{\n      if(typeof layout==='function'){\n        layout();\n      }\n    }catch(_error){}\n\n    try{\n      window.MHUR_HOME_REFRESH?.();\n      window.MHUR_S18_V14?.afterDom?.();\n      window.MHUR_S18_V13?.afterDom?.();\n      window.MHUR_V589?.refresh?.();\n      window.MHUR_V590?.refresh?.();\n    }catch(_error){}\n  }\n\n  function syncAll(options={}){\n    syncDocumentLanguage();\n    syncHeader();\n    translateStaticInterface();\n    syncNotes();\n\n    if(options.full){\n      syncModsPage();\n    }\n\n    requestAnimationFrame(()=>{\n      syncHeader();\n      translateStaticInterface();\n      syncNotes();\n    });\n  }\n\n  function languageChanged(){\n    syncDocumentLanguage();\n    syncHomeAndCurrentPage();\n\n    /*\n      Plusieurs anciens scripts terminent leur rendu dans une frame ou avec\n      un petit délai. V591 repasse après chacun d'eux.\n    */\n    syncAll({full:true});\n    setTimeout(()=>syncAll({full:true}),40);\n    setTimeout(()=>syncAll({full:true}),180);\n    setTimeout(()=>syncAll({full:true}),500);\n  }\n\n  let queued=false;\n\n  function schedule(){\n    if(queued)return;\n    queued=true;\n\n    requestAnimationFrame(()=>{\n      queued=false;\n      syncAll({full:false});\n    });\n  }\n\n  new MutationObserver(mutations=>{\n    if(\n      mutations.some(mutation=>\n        mutation.addedNodes?.length||\n        mutation.type==='attributes'\n      )\n    ){\n      schedule();\n    }\n  }).observe(document.documentElement,{\n    childList:true,\n    subtree:true,\n    attributes:true,\n    attributeFilter:['class','lang','hidden','aria-hidden']\n  });\n\n  window.addEventListener(\n    'mhur:languagechange',\n    languageChanged\n  );\n\n  window.addEventListener('storage',event=>{\n    if(event.key==='mhur_lang'||event.key==='lang'){\n      languageChanged();\n    }\n  });\n\n  document.addEventListener('click',event=>{\n    if(event.target?.closest?.('.lang')){\n      setTimeout(languageChanged,0);\n    }\n  },true);\n\n  if(document.readyState==='loading'){\n    document.addEventListener(\n      'DOMContentLoaded',\n      ()=>syncAll({full:true}),\n      {once:true}\n    );\n  }else{\n    syncAll({full:true});\n  }\n\n  window.addEventListener(\n    'load',\n    ()=>syncAll({full:true}),\n    {once:true}\n  );\n\n  window.MHUR_V591={\n    version:VERSION,\n    refresh:languageChanged,\n    currentLanguage,\n    translated\n  };\n})();\n"
          script.parent.mkdir(parents=True, exist_ok=True)
          script.write_text(script_content.rstrip() + "\n", encoding="utf-8")

          html = index.read_text(encoding="utf-8-sig")

          html = re.sub(
              r"\s*<script\b[^>]*src=['\"][^'\"]*"
              r"v591-language-consistency\.js[^'\"]*['\"][^>]*>"
              r"\s*</script>\s*",
              "\n",
              html,
              flags=re.I,
          )

          if "</body>" not in html:
              raise SystemExit("[ERREUR] La balise </body> est introuvable.")

          injection = (
              "\n<!-- V591 : cohérence de traduction, chargé après tous les rendus. -->\n"
              '<script src="js/v591-language-consistency.js?v=591"></script>\n'
          )

          html = html.replace("</body>", injection + "</body>", 1)
          index.write_text(html.rstrip() + "\n", encoding="utf-8")

          errors = []

          if "js/v591-language-consistency.js?v=591" not in html:
              errors.append("V591 n'est pas chargé dans index.html.")

          if html.rfind("v591-language-consistency.js") < html.rfind(
              "v590-scrollbars-mods.js"
          ):
              errors.append("V591 n'est pas chargé après V590.")

          required = [
              "mhur:languagechange",
              "function syncModsPage",
              "function syncNotes",
              "function syncHeader",
              "window.MHUR_V591",
              "MHUR_MODS",
              "showPatch",
          ]

          for value in required:
              if value not in script_content:
                  errors.append("Fonction absente : " + value)

          syntax = subprocess.run(
              ["node", "--check", str(script)],
              text=True,
              capture_output=True,
          )

          if syntax.returncode:
              errors.append("Syntaxe JavaScript invalide : " + syntax.stderr)

          if errors:
              raise SystemExit(
                  "[ERREUR V591]\n- " + "\n- ".join(errors)
              )

          report.write_text(
              """MHUR FRANCE — RAPPORT V591 TRADUCTION

          CAUSES CORRIGÉES
          - La page Mods possédait des textes bilingues mais aucun écouteur
            mhur:languagechange : le HTML français restait affiché.
          - Une fenêtre Patch Notes déjà ouverte n'était pas entièrement reconstruite.
          - Plusieurs éléments du header avaient un texte français écrit directement.
          - Les anciens scripts pouvaient recréer un texte français après le rendu.

          CORRECTIONS
          - Détection de la langue via lang, html[lang] et localStorage.
          - Rendu complet de la page Mods après chaque changement de langue.
          - Rafraîchissement du détail d'un mod ouvert.
          - Reconstruction de la Patch Note active dans la langue choisie.
          - Reconstruction de la Dev Note active.
          - Synchronisation du bouton Patch Notes / Dev Notes.
          - Synchronisation Connexion, réseaux sociaux et créateurs.
          - Traduction exacte des libellés statiques connus.
          - MutationObserver pour corriger les éléments ajoutés plus tard.
          - Quatre passages après le changement de langue pour gagner face
            aux anciennes couches de rendu.

          VÉRIFICATIONS
          - V591 chargé après V590 : OK
          - écouteur mhur:languagechange : OK
          - page Mods : OK
          - Patch Notes : OK
          - header : OK
          - syntaxe JavaScript : OK
          """,
              encoding="utf-8",
          )

          print("[OK] V591 appliqué et vérifié.")
          print("[OK] La page Mods se reconstruit en anglais.")
          print("[OK] Les Patch Notes ouvertes se reconstruisent en anglais.")
          print("[OK] Le header et les éléments ajoutés après le rendu sont synchronisés.")
          PY
          python /tmp/appliquer_v591.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             public/index.html             public/js/v591-language-consistency.js             RAPPORT_V591_TRADUCTION.txt

          if git diff --cached --quiet; then
            echo "V591 est deja installe."
            exit 0
          fi

          git commit -m "Corriger la traduction anglaise V591"
          git push
