name: MHUR - Synchronisation UltraRumble

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-public-data-write
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mise_a_jour/requirements.txt

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r mise_a_jour/requirements.txt

      - name: Vérifier UltraRumble
        id: source
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --check-only
          code=$?
          set -e

          if [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] Une mise à jour UltraRumble est disponible."
          elif [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[OK] Le site est déjà synchronisé."
          else
            echo "[ERREUR] La vérification UltraRumble a échoué avec le code $code."
            exit "$code"
          fi

      - name: Appliquer la mise à jour UltraRumble
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --wait-lock 300

      - name: Publier la synchronisation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A public
          git add -f \
            public/data/ultrarumble/synchronisation_state.json \
            public/data/ultrarumble/derniere_synchronisation.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "[OK] Aucun changement de synchronisation à publier."
            exit 0
          fi

          git commit -m "chore: synchroniser les données UltraRumble"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] Synchronisation UltraRumble publiée."
              exit 0
            fi
            echo "[ATTENTE] Nouvelle tentative de publication..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Impossible de publier la synchronisation sur main."
          exit 1
