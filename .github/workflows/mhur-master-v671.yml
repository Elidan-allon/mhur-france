          service_worker = "const RELEASE = __BUILD_JSON__;\nconst PREFIX = 'mhur-v671-';\nconst STATIC_CACHE = `${PREFIX}static-${RELEASE}`;\nconst OFFLINE_CACHE = `${PREFIX}offline-${RELEASE}`;\nconst OFFLINE_URL = '/index.html';\n\nself.addEventListener('message', event => {\n  if (event.data?.type === 'SKIP_WAITING') {\n    self.skipWaiting();\n  }\n});\n\nself.addEventListener('install', event => {\n  event.waitUntil(\n    (async () => {\n      const cache = await caches.open(OFFLINE_CACHE);\n\n      try {\n        const response = await fetch(OFFLINE_URL, {\n          cache: 'no-store'\n        });\n\n        if (response.ok) {\n          await cache.put(OFFLINE_URL, response);\n        }\n      } catch (_error) {}\n\n      await self.skipWaiting();\n    })()\n  );\n});\n\nself.addEventListener('activate', event => {\n  event.waitUntil(\n    (async () => {\n      const keys = await caches.keys();\n\n      await Promise.all(\n        keys\n          .filter(key => key !== STATIC_CACHE && key !== OFFLINE_CACHE)\n          .map(key => caches.delete(key))\n      );\n\n      await self.clients.claim();\n    })()\n  );\n});\n\nasync function networkFirst(request) {\n  try {\n    const response = await fetch(request, {\n      cache: 'no-cache'\n    });\n\n    if (response.ok) {\n      const cache = await caches.open(STATIC_CACHE);\n      await cache.put(request, response.clone());\n    }\n\n    return response;\n  } catch (error) {\n    const cached = await caches.match(request);\n    if (cached) return cached;\n    throw error;\n  }\n}\n\nasync function cacheFirst(request) {\n  const cached = await caches.match(request);\n  if (cached) return cached;\n\n  const response = await fetch(request);\n\n  if (response.ok) {\n    const cache = await caches.open(STATIC_CACHE);\n    await cache.put(request, response.clone());\n  }\n\n  return response;\n}\n\nself.addEventListener('fetch', event => {\n  const request = event.request;\n\n  if (request.method !== 'GET') return;\n\n  const url = new URL(request.url);\n\n  if (url.origin !== self.location.origin) return;\n\n  if (request.mode === 'navigate') {\n    event.respondWith(\n      (async () => {\n        try {\n          const response = await fetch(request, {\n            cache: 'no-store'\n          });\n\n          if (response.ok) {\n            const cache = await caches.open(OFFLINE_CACHE);\n            await cache.put(OFFLINE_URL, response.clone());\n          }\n\n          return response;\n        } catch (_error) {\n          return (\n            (await caches.match(OFFLINE_URL)) ||\n            new Response('Connexion indisponible.', {\n              status: 503,\n              headers: {\n                'Content-Type': 'text/plain; charset=utf-8'\n              }\n            })\n          );\n        }\n      })()\n    );\n    return;\n  }\n\n  if (\n    request.destination === 'script' ||\n    request.destination === 'style' ||\n    url.pathname.startsWith('/data/') ||\n    url.pathname === '/version.json' ||\n    url.pathname === '/service-worker.js'\n  ) {\n    event.respondWith(networkFirst(request));\n    return;\n  }\n\n  if (\n    request.destination === 'image' ||\n    request.destination === 'font' ||\n    url.pathname.startsWith('/assets/')\n  ) {\n    event.respondWith(cacheFirst(request));\n  }\n});\n".replace(
