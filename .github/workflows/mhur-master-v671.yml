name: MHUR - Master V671

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "MHUR - Synchronisation UltraRumble"
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: mhur-master-v671
  cancel-in-progress: true

jobs:
  nettoyer-et-corriger:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Annuler les anciens workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_SYNC=".github/workflows/mhur-sync-ultrarumble.yml"
          KEEP_MASTER=".github/workflows/mhur-master-v671.yml"

          mapfile -t KEEP_IDS < <(
            gh api --paginate               "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100"               --jq ".workflows[] |
                select(
                  .path == \"$KEEP_SYNC\" or
                  .path == \"$KEEP_MASTER\"
                ) |
                .id"
          )

          is_kept() {
            local wanted="$1"
            local current

            for current in "${KEEP_IDS[@]:-}"; do
              if [[ "$current" == "$wanted" ]]; then
                return 0
              fi
            done

            return 1
          }

          for status in queued in_progress; do
            while IFS=$'\t' read -r run_id workflow_id run_name; do
              [[ -z "${run_id:-}" ]] && continue
              [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue

              if is_kept "$workflow_id"; then
                echo "[GARDÉ] $run_name — $run_id"
                continue
              fi

              echo "[ANNULATION] $run_name — $run_id"

              gh api                 --method POST                 "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel"                 >/dev/null 2>&1 || true
            done < <(
              gh api --paginate                 "repos/${GITHUB_REPOSITORY}/actions/runs?status=$status&per_page=100"                 --jq '.workflow_runs[] |
                  [.id, .workflow_id, .name] |
                  @tsv'
            )
          done

      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Supprimer les anciens fichiers workflows
        shell: bash
        run: |
          set -euo pipefail

          find .github/workflows             -maxdepth 1             -type f             \( -name "*.yml" -o -name "*.yaml" \)             ! -name "mhur-sync-ultrarumble.yml"             ! -name "mhur-master-v671.yml"             -print             -delete

          echo "[OK] Seuls Sync et Master V671 sont conservés."

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Appliquer Master V671
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path

          PATCH_ID = "1785298405"

          PUBLIC = Path("public")
          INDEX = PUBLIC / "index.html"
          HOME_JSON = PUBLIC / "data" / "home_data.json"
          HOME_JS = PUBLIC / "data" / "home_data.js"
          RENDERER = PUBLIC / "js" / "v608-patch-notes-final.js"
          UI_CSS = PUBLIC / "css" / "v671-ui-final.css"
          UI_JS = PUBLIC / "js" / "v671-ui-final.js"
          LIVE_UPDATE = PUBLIC / "js" / "v36-live-site-update.js"
          SERVICE_WORKER = PUBLIC / "service-worker.js"
          HEADERS = PUBLIC / "_headers"
          VERSION_JSON = PUBLIC / "version.json"

          for required in (INDEX, HOME_JSON, RENDERER):
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )

          def clean(value: object) -> str:
              if isinstance(value, dict):
                  return str(
                      value.get("en")
                      or value.get("fr")
                      or next(iter(value.values()), "")
                  ).strip()
              return str(value or "").strip()

          def norm(value: object) -> str:
              text = unicodedata.normalize(
                  "NFD",
                  clean(value).lower(),
              )
              text = "".join(
                  char
                  for char in text
                  if unicodedata.category(char) != "Mn"
              )
              return re.sub(r"[^a-z0-9]+", " ", text).strip()

          def metric(value: object) -> str:
              label = norm(value)

              if label.startswith(("damage", "degats")):
                  return "damage"

              if label.startswith(("guard break", "brise garde")):
                  return "guard"

              return ""

          def infer_symbol(change: dict) -> str:
              name = clean(change.get("skill_name"))

              match = re.match(
                  r"^\s*(α|β|γ|alpha|beta|gamma|a|b|g|y)"
                  r"(?:\s*[-–—:]\s*|\s+)",
                  name,
                  flags=re.IGNORECASE,
              )

              if match:
                  return {
                      "α": "α",
                      "alpha": "α",
                      "a": "α",
                      "β": "β",
                      "beta": "β",
                      "b": "β",
                      "γ": "γ",
                      "gamma": "γ",
                      "g": "γ",
                      "y": "γ",
                  }.get(match.group(1).lower(), "")

              image = clean(change.get("skill_image")).lower()

              if re.search(r"(?:unique1|alpha)", image):
                  return "α"

              if re.search(r"(?:unique2|beta)", image):
                  return "β"

              if re.search(r"(?:unique3|gamma)", image):
                  return "γ"

              return ""

          def strip_symbol(name: str) -> str:
              return re.sub(
                  r"^\s*(?:α|β|γ|alpha|beta|gamma|a|b|g|y)"
                  r"(?:\s*[-–—:]\s*|\s+)",
                  "",
                  name,
                  count=1,
                  flags=re.IGNORECASE,
              ).strip()

          DETAIL_FR = {
              "normal": "Normal",
              "explosion": "Explosion",
              "explosionfollow up": "Explosion renforcée",
              "explosion follow up": "Explosion renforcée",
              "burn": "Brûlure",
              "homing": "À tête chercheuse",
              "melee": "Corps à corps",
              "shot": "Tir",
              "shooting": "Tir",
          }

          def exact_display_name(change: dict) -> dict:
              source = clean(
                  change.get("source_skill_name")
                  or change.get("skill_name")
              )

              symbol = infer_symbol(change)
              body = strip_symbol(source)
              detail_match = re.search(r"\s*\(([^()]*)\)\s*$", body)

              if detail_match:
                  detail_en = detail_match.group(1).strip()
                  base = body[:detail_match.start()].strip()
                  detail_fr = DETAIL_FR.get(norm(detail_en), detail_en)
                  en_body = f"{base} ({detail_en})"
                  fr_body = f"{base} ({detail_fr})"
              else:
                  en_body = body.strip()
                  fr_body = body.strip()

              if symbol:
                  return {
                      "fr": f"{symbol} - {fr_body}",
                      "en": f"{symbol} - {en_body}",
                  }

              return {
                  "fr": fr_body,
                  "en": en_body,
              }

          # ----------------------------------------------------------------------
          # Conserver les correctifs Patch Notes du Master précédent.
          # ----------------------------------------------------------------------

          data = json.loads(
              HOME_JSON.read_text(encoding="utf-8")
          )

          patch = next(
              (
                  item
                  for item in data.get("patch_notes", [])
                  if str(item.get("id")) == PATCH_ID
              ),
              None,
          )

          if patch is None:
              raise SystemExit(
                  f"[ERREUR] Patch {PATCH_ID} introuvable."
              )

          changes = [
              change
              for section in patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict)
          ]

          bakugo_cluster_count = 0
          armored_count = 0

          for change in changes:
              character = norm(change.get("character"))
              style = norm(change.get("style"))

              change["source_skill_name"] = clean(
                  change.get("source_skill_name")
                  or change.get("skill_name")
              )

              if character == "katsuki bakugo" and style == "cluster":
                  change["style_id"] = "bakugo_technical"
                  change["role"] = "technical"
                  change["portrait"] = (
                      "assets/bakugo/bakugo_technical/portrait.webp"
                  )

                  skill = norm(change.get("source_skill_name"))

                  if "ap shot cluster" in skill:
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/alpha.webp"
                      )
                  elif "nitro cluster" in skill:
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/beta.webp"
                      )
                  elif "howitzer impact cluster" in skill:
                      change["skill_image"] = (
                          "assets/bakugo/bakugo_technical/gamma.webp"
                      )

                  bakugo_cluster_count += 1

              if character == "katsuki bakugo" and style == "original":
                  change["style_id"] = "bakugo_attack"

              source_image_id = norm(
                  change.get("skill_image")
              )
              existing_character_id = clean(
                  change.get("character_id")
                  or change.get("characterId")
              )
              existing_style_id = clean(
                  change.get("style_id")
                  or change.get("styleId")
              )
              existing_skill_id = clean(
                  change.get("skill_id")
                  or change.get("skillId")
              )

              # V671 : l'identité du changement repose sur les IDs locaux,
              # jamais sur un rapprochement de noms comme Texas Smash.
              is_armored_alpha_burn = (
                  existing_character_id == "armored_all_might"
                  or existing_style_id
                  == "armored_all_might_technical"
                  or existing_skill_id
                  == "armored_all_might_alpha_burn"
                  or "skill armored all might ice bullet shot burn"
                  in source_image_id
              )

              if (
                  is_armored_alpha_burn
                  and metric(change.get("label")) in {"damage", "guard"}
              ):
                  before = [
                      clean(value)
                      for value in change.get("before") or []
                  ]

                  if before == [
                      "52.0", "54.0", "56.0",
                      "58.0", "60.0", "62.0",
                      "64.0", "66.0", "68.0",
                  ]:
                      metric_id = metric(change.get("label"))
                      change["patch_id"] = PATCH_ID
                      change["character_id"] = "armored_all_might"
                      change["style_id"] = (
                          "armored_all_might_technical"
                      )
                      change["skill_id"] = (
                          "armored_all_might_alpha_burn"
                      )
                      change["skill_slot"] = "alpha"
                      change["change_id"] = (
                          f"{PATCH_ID}:armored_all_might:"
                          "armored_all_might_technical:"
                          f"armored_all_might_alpha_burn:{metric_id}"
                      )
                      change["source_skill_name"] = (
                          "α - Ice Bullet Shot (Burn)"
                      )
                      change["skill_name"] = (
                          "α - Ice Bullet Shot (Burn)"
                      )
                      change["style"] = "Technique"
                      change["role"] = "technical"
                      change["portrait"] = (
                          "assets/armored_all_might/"
                          "armored_all_might_technical/portrait.webp"
                      )
                      change["skill_image"] = (
                          "assets/armored_all_might/"
                          "armored_all_might_technical/alpha.webp"
                      )
                      armored_count += 1

              change["display_skill_name"] = exact_display_name(change)

          if bakugo_cluster_count < 6:
              raise SystemExit(
                  "[ERREUR] Pas assez de changements Bakugo Cluster : "
                  f"{bakugo_cluster_count}"
              )

          if armored_count != 2:
              raise SystemExit(
                  "[ERREUR] 2 changements Armored All Might attendus, "
                  f"trouvé : {armored_count}"
              )

          for change in changes:
              source = clean(change.get("source_skill_name"))
              display_en = clean(
                  (change.get("display_skill_name") or {}).get("en")
              )

              source_has_detail = bool(
                  re.search(r"\([^()]+\)\s*$", source)
              )
              display_has_detail = bool(
                  re.search(r"\([^()]+\)\s*$", display_en)
              )

              if source_has_detail != display_has_detail:
                  raise SystemExit(
                      "[ERREUR] Détail inventé ou supprimé : "
                      f"{source!r} → {display_en!r}"
                  )

          data.setdefault("meta", {})[
              "master_version"
          ] = "v671"

          HOME_JSON.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          compact = json.dumps(
              data,
              ensure_ascii=False,
              separators=(",", ":"),
          ).replace("\u2028", "\\u2028").replace(
              "\u2029",
              "\\u2029",
          )

          HOME_JS.write_text(
              f"window.MHUR_HOME_DATA = {compact};\n",
              encoding="utf-8",
          )

          renderer = RENDERER.read_text(encoding="utf-8")

          function_start = renderer.find(
              "  function resolveStyle(change){"
          )
          function_end = renderer.find(
              "\n  function translatePatch(value){",
              function_start,
          )

          if function_start < 0 or function_end < 0:
              raise SystemExit(
                  "[ERREUR] Fonction resolveStyle introuvable."
              )

          resolve_style = """  function resolveStyle(change){
              const map=stylesMap();
              const explicitCharacterId=clean(
                change?.character_id||
                change?.characterId||
                ''
              );
              const explicitStyleId=clean(
                change?.style_id||
                change?.styleId||
                ''
              );

              const explicitCharacter=charactersList().find(
                character=>
                  clean(character?.id)===explicitCharacterId
              )||(
                explicitStyleId
                  ?charactersList().find(character=>
                    Array.isArray(character?.styles)&&
                    character.styles.map(String).includes(
                      explicitStyleId
                    )
                  )
                  :null
              );

              const character=
                explicitCharacter||
                findCharacter(change?.character);

              const ids=styleIds(character);

              if(
                explicitStyleId&&
                ids.includes(explicitStyleId)&&
                map[explicitStyleId]
              ){
                return {
                  character,
                  id:explicitStyleId,
                  style:map[explicitStyleId]
                };
              }

              const midoriyaId=midoriyaStyleId(
                change,
                character
              );

              if(midoriyaId&&map[midoriyaId]){
                return {
                  character,
                  id:midoriyaId,
                  style:map[midoriyaId]
                };
              }

              const wanted=normal(change?.style||'Original');
              const byStyle=ids.find(id=>
                normal(localized(map[id]?.name)||'Original')===wanted
              );

              if(byStyle){
                return {
                  character,
                  id:byStyle,
                  style:map[byStyle]
                };
              }

              const id=ids[0]||'';

              return {
                character,
                id,
                style:map[id]||null
              };
            }

            function patchIdentity(change,group){
              const characterId=clean(
                change?.character_id||
                change?.characterId||
                group?.character?.id||
                ''
              );
              const styleId=clean(
                change?.style_id||
                change?.styleId||
                group?.id||
                ''
              );
              const skillId=clean(
                change?.skill_id||
                change?.skillId||
                ''
              );

              if(
                characterId==='armored_all_might'&&
                styleId==='armored_all_might_technical'&&
                skillId==='armored_all_might_alpha_burn'
              ){
                return {
                  characterId,
                  styleId,
                  skillId,
                  title:{
                    fr:'α - Ice Bullet Shot (Brûlure)',
                    en:'α - Ice Bullet Shot (Burn)'
                  },
                  image:
                    'assets/armored_all_might/'+
                    'armored_all_might_technical/alpha.webp'
                };
              }

              return {
                characterId,
                styleId,
                skillId,
                title:null,
                image:''
              };
            }
          """

          renderer = (
              renderer[:function_start]
              + resolve_style
              + renderer[function_end:]
          )

          title_pattern = re.compile(
              r"const\s+title=translatePatch\((.*?)\);",
              flags=re.DOTALL,
          )

          title_replacement = """const identity=patchIdentity(
                change,
                group
              );
              const title=translatePatch(
                localized(identity?.title)||
                localized(change?.display_skill_name)||
                localized(change?.skill_name)||
                localized(change?.label)||
                tx('Ajustement','Adjustment')
              );"""

          renderer, title_count = title_pattern.subn(
              title_replacement,
              renderer,
              count=1,
          )

          if title_count != 1:
              raise SystemExit(
                  "[ERREUR] Bloc du titre Patch Notes introuvable."
              )

          picture_pattern = re.compile(
              r"const\s+picture=health(.*?);",
              flags=re.DOTALL,
          )

          picture_replacement = """const picture=health
                ?''
                :(
                  identity?.image||
                  (
                    isMidoriya
                      ?(skill?.img||change?.skill_image||'')
                      :(change?.skill_image||skill?.img||'')
                  )
                );"""

          renderer, picture_count = picture_pattern.subn(
              picture_replacement,
              renderer,
              count=1,
          )

          if picture_count != 1:
              raise SystemExit(
                  "[ERREUR] Bloc de l'image Patch Notes introuvable."
              )

          change_section_pattern = re.compile(
              r'(data-v608-style="\$\{\s*'
              r'escapeHtml\(group\.id\)\s*\}")'
              r'\s*>',
              flags=re.DOTALL,
          )

          change_section_replacement = r'''\1
              data-v608-character-id="${escapeHtml(
                identity?.characterId||group.character?.id||''
              )}"
              data-v608-skill-id="${escapeHtml(
                identity?.skillId||change?.skill_id||''
              )}"
              data-v608-change-id="${escapeHtml(
                change?.change_id||''
              )}"
            >'''

          renderer, change_attr_count = (
              change_section_pattern.subn(
                  change_section_replacement,
                  renderer,
                  count=1,
              )
          )

          if change_attr_count != 1:
              raise SystemExit(
                  "[ERREUR] Attributs ID des changements introuvables."
              )

          group_article_pattern = re.compile(
              r'(data-v608-character="\$\{\s*'
              r'escapeHtml\(group\.name\)\s*\}")',
              flags=re.DOTALL,
          )

          group_article_replacement = r'''\1
              data-v608-character-id="${escapeHtml(
                group.character?.id||''
              )}"'''

          renderer, group_attr_count = (
              group_article_pattern.subn(
                  group_article_replacement,
                  renderer,
                  count=1,
              )
          )

          if group_attr_count != 1:
              raise SystemExit(
                  "[ERREUR] Attribut ID du personnage introuvable."
              )

          renderer = re.sub(
              r"const VERSION='[^']*';",
              "const VERSION='671';",
              renderer,
              count=1,
          )

          RENDERER.write_text(
              renderer,
              encoding="utf-8",
          )

          # ----------------------------------------------------------------------
          # V671 : corriger tous les Alters qui possèdent plusieurs séries
          # de dégâts, pas seulement Bakugo Cluster.
          # ----------------------------------------------------------------------

          index_stats = INDEX.read_text(encoding="utf-8")

          stats_open_match = re.search(
              r'<script\b[^>]*\bid\s*=\s*'
              r'["\']v253-robust-stats-patch["\'][^>]*>',
              index_stats,
              flags=re.IGNORECASE,
          )

          if not stats_open_match:
              raise SystemExit(
                  "[ERREUR] Script v253-robust-stats-patch introuvable."
              )

          stats_script_start = stats_open_match.start()
          stats_script_end = index_stats.find(
              "</script>",
              stats_open_match.end(),
          )

          if stats_script_end < 0:
              raise SystemExit(
                  "[ERREUR] Fermeture du script v253 introuvable."
              )

          stats_block = index_stats[
              stats_script_start:stats_script_end
          ]

          def stats_function_pattern(name: str) -> re.Pattern[str]:
              return re.compile(
                  rf"(?m)^[ \t]*function[ \t]+"
                  rf"{re.escape(name)}[ \t]*"
                  rf"\([^)]*\)[ \t]*\{{"
              )

          ANY_STATS_FUNCTION = re.compile(
              r"(?m)^[ \t]*function[ \t]+"
              r"[A-Za-z_$][A-Za-z0-9_$]*[ \t]*"
              r"\([^)]*\)[ \t]*\{"
          )

          def stats_function_span(
              source: str,
              name: str,
          ) -> tuple[int, int] | None:
              """
              Cherche une fonction JavaScript par son nom.

              Les espaces et les noms des paramètres ne comptent pas.
              La fin est le début de la fonction de premier niveau suivante.
              """
              match = stats_function_pattern(name).search(source)

              if not match:
                  return None

              next_match = ANY_STATS_FUNCTION.search(
                  source,
                  match.end(),
              )

              end = (
                  next_match.start()
                  if next_match
                  else len(source)
              )

              return match.start(), end

          def remove_stats_function(
              source: str,
              name: str,
          ) -> str:
              span = stats_function_span(source, name)

              if not span:
                  return source

              start, end = span

              return source[:start] + source[end:]

          def replace_or_insert_stats_function(
              source: str,
              name: str,
              replacement: str,
              before: tuple[str, ...],
          ) -> str:
              """
              Remplace la fonction si elle existe.

              Sinon, insère le correctif avant une fonction suivante connue.
              Cela fonctionne avec une ancienne version, une version déjà
              corrigée ou un formatage JavaScript différent.
              """
              span = stats_function_span(source, name)

              if span:
                  start, end = span

                  return (
                      source[:start]
                      + replacement.rstrip()
                      + "\n"
                      + source[end:]
                  )

              for before_name in before:
                  before_match = stats_function_pattern(
                      before_name
                  ).search(source)

                  if before_match:
                      return (
                          source[:before_match.start()]
                          + replacement.rstrip()
                          + "\n"
                          + source[before_match.start():]
                      )

              raise SystemExit(
                  "[ERREUR] Impossible de placer la fonction "
                  f"{name}. Fonctions suivantes recherchées : "
                  + ", ".join(before)
              )

          additional_groups_v671 = '  function canonicalAdditionalType(type){\n    const raw=String(type||\'\').trim();\n    const n=norm(raw);\n    const has=(...words)=>words.every(word=>n.includes(norm(word)));\n\n    /*\n      L\'ordre est volontaire : certaines lignes UltraRumble contiennent\n      plusieurs mots, par exemple "Grab ... Small (_S_)". Elles doivent\n      appartenir au groupe Small, pas à un groupe séparé Grab.\n    */\n    if(\n      has(\'small\')||\n      has(\'short\')||\n      has(\'courte\')||\n      /(^|_)s($|_)/.test(n)\n    ) return \'small\';\n\n    if(\n      has(\'medium\')||\n      has(\'middle\')||\n      has(\'moyenne\')||\n      /(^|_)m($|_)/.test(n)\n    ) return \'medium\';\n\n    if(\n      has(\'large\')||\n      has(\'long\')||\n      has(\'longue\')||\n      /(^|_)l($|_)/.test(n)\n    ) return \'large\';\n\n    if(has(\'normal\')) return \'normal\';\n    if(has(\'ground\')||has(\'sol\')||has(\'地上\')) return \'ground\';\n    if(\n      has(\'air\')||\n      has(\'aerial\')||\n      has(\'midair\')||\n      has(\'空中\')\n    ) return \'air\';\n\n    if(has(\'quintuple\')) return \'quintuple\';\n    if(has(\'detroit\')) return \'detroit\';\n    if(has(\'contact\')) return \'contact\';\n    if(has(\'charge\')) return \'charge\';\n    if(has(\'finisher\')||has(\'finish\')||has(\'final\')) return \'finisher\';\n    if(has(\'spin\')||has(\'rotation\')||has(\'tourbillon\')) return \'spin\';\n    if(has(\'homing\')||has(\'chercheuse\')) return \'homing\';\n    if(has(\'ice\')||has(\'glace\')) return \'ice\';\n    if(has(\'burn\')||has(\'brulure\')) return \'burn\';\n\n    if(\n      has(\'explosion\',\'follow\',\'up\')||\n      has(\'explosion\',\'renforcee\')\n    ) return \'explosion_follow_up\';\n\n    if(\n      has(\'explosion\',\'deploy\')||\n      has(\'explosion\',\'deployee\')\n    ) return \'explosion_deploy\';\n\n    if(\n      has(\'explosion\',\'bullet\')||\n      has(\'balle\',\'explosive\')\n    ) return \'explosion_bullet\';\n\n    if(has(\'explosion\',\'sweat\')) return \'explosion_sweat\';\n    if(has(\'bullet\',\'sweat\')) return \'bullet_sweat\';\n    if(has(\'deploy\',\'sweat\')) return \'deploy_sweat\';\n    if(has(\'explosion\')) return \'explosion\';\n    if(has(\'rush\')) return \'rush\';\n    if(has(\'grab\')||has(\'prise\')) return \'grab\';\n    if(has(\'value\')||has(\'main\')) return \'value\';\n\n    return n||\'main\';\n  }\n\n  function remoteAdditionalGroups(remoteSkill){\n    const tbl=remoteSkill && remoteSkill.additional_values;\n    const rows=getRows(tbl);\n    const groups={};\n    const buckets={};\n\n    rows.forEach(r=>{\n      const li=levelOfRow(r);\n      if(!li) return;\n\n      const rawType=\n        r.slice(0,li.i).join(\' \').trim()||\n        \'main\';\n      const canonical=\n        canonicalAdditionalType(rawType);\n      const vals=r.slice(li.i+1);\n\n      if(!buckets[canonical]){\n        buckets[canonical]=[];\n      }\n\n      let group=buckets[canonical].find(\n        item=>!item.rows[li.lv]\n      );\n\n      if(!group){\n        const order=buckets[canonical].length;\n        const key=`${canonical}__${order+1}`;\n\n        group={\n          key,\n          type:rawType,\n          canonical,\n          order,\n          rows:{}\n        };\n\n        buckets[canonical].push(group);\n        groups[key]=group;\n      }\n\n      group.rows[li.lv]={\n        damage:vals[0],\n        down:vals[1],\n        values:vals,\n        row:r\n      };\n    });\n\n    return groups;\n  }\n'
          pick_group_v671 = "  function pickAdditionalGroup(groups,title){\n    const arr=Object.values(groups||{})\n      .sort((a,b)=>(a.order||0)-(b.order||0));\n\n    if(!arr.length) return null;\n    if(arr.length===1) return arr[0];\n\n    const rawTitle=String(title||'');\n    const t=norm(rawTitle);\n    const hasTitle=(...words)=>\n      words.every(word=>t.includes(norm(word)));\n    const canonical=g=>\n      g?.canonical||\n      canonicalAdditionalType(g?.type||'');\n\n    const metric=(g,key)=>{\n      const values=Object.values(g?.rows||{})\n        .map(row=>\n          Number.parseFloat(\n            String(row?.[key]??'').replace(',','.')\n          )\n        )\n        .filter(Number.isFinite);\n\n      return values.length\n        ?values.reduce((sum,value)=>sum+value,0)/values.length\n        :Number.NaN;\n    };\n\n    const choose=(list,mode='first')=>{\n      if(!list.length) return null;\n\n      if(mode==='highestDown'){\n        return [...list].sort(\n          (a,b)=>(metric(b,'down')||0)-(metric(a,'down')||0)\n        )[0];\n      }\n\n      if(mode==='lowestDown'){\n        return [...list].sort((a,b)=>{\n          const av=metric(a,'down');\n          const bv=metric(b,'down');\n\n          return (\n            Number.isFinite(av)\n              ?av\n              :Number.MAX_SAFE_INTEGER\n          )-(\n            Number.isFinite(bv)\n              ?bv\n              :Number.MAX_SAFE_INTEGER\n          );\n        })[0];\n      }\n\n      return list[0];\n    };\n\n    const byCanonical=(name,mode='first')=>\n      choose(\n        arr.filter(g=>canonical(g)===name),\n        mode\n      );\n\n    if(\n      hasTitle('distance','courte')||\n      hasTitle('small')||\n      hasTitle('short')\n    ){\n      const found=byCanonical('small');\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('distance','moyenne')||\n      hasTitle('medium')||\n      hasTitle('middle')\n    ){\n      const found=byCanonical('medium');\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('distance','longue')||\n      hasTitle('large')||\n      hasTitle('long')\n    ){\n      const found=byCanonical('large');\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('mode','visee')||\n      hasTitle('aim')||\n      hasTitle('scope')\n    ){\n      const found=\n        byCanonical('aim')||\n        byCanonical('value');\n      if(found) return found;\n    }\n\n    if(hasTitle('sol')||hasTitle('ground')){\n      const found=byCanonical('ground');\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('air')||\n      hasTitle('aerien')||\n      hasTitle('midair')\n    ){\n      const found=byCanonical('air');\n      if(found) return found;\n    }\n\n    for(const [needle,groupName] of [\n      ['quintuple','quintuple'],\n      ['detroit','detroit'],\n      ['contact','contact'],\n      ['normal','normal'],\n      ['rush','rush'],\n      ['glace','ice'],\n      ['ice','ice'],\n      ['brulure','burn'],\n      ['burn','burn']\n    ]){\n      if(hasTitle(needle)){\n        const found=byCanonical(groupName);\n        if(found) return found;\n      }\n    }\n\n    if(hasTitle('charge')||hasTitle('chargee')){\n      const found=byCanonical('charge');\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('finisher')||\n      hasTitle('finish')||\n      hasTitle('final')\n    ){\n      const found=byCanonical('finisher');\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('spin')||\n      hasTitle('rotation')||\n      hasTitle('tourbillon')\n    ){\n      const found=byCanonical('spin');\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('explosion','deployee')||\n      hasTitle('explosion','deploy')\n    ){\n      const found=byCanonical(\n        'explosion_deploy',\n        'lowestDown'\n      );\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('balle','explosive')||\n      hasTitle('explosion','bullet')||\n      hasTitle('bullet','explosion')\n    ){\n      const found=byCanonical('explosion_bullet');\n      if(found) return found;\n    }\n\n    if(\n      hasTitle('explosion','sueur')||\n      hasTitle('sweat','explosion')\n    ){\n      const found=byCanonical('explosion_sweat');\n      if(found) return found;\n    }\n\n    if(\n      (\n        hasTitle('balle','sueur')||\n        hasTitle('bullet','sweat')\n      )&&\n      !hasTitle('explosion')\n    ){\n      const found=byCanonical('bullet_sweat');\n      if(found) return found;\n    }\n\n    if(\n      (\n        hasTitle('sueur','deployee')||\n        hasTitle('deploy','sweat')\n      )&&\n      !hasTitle('explosion')\n    ){\n      const found=byCanonical('deploy_sweat');\n      if(found) return found;\n    }\n\n    if(hasTitle('explosion')){\n      const reinforced=\n        /\\+|follow[ -]?up|renforc|strong/i.test(rawTitle);\n\n      if(reinforced){\n        const found=\n          byCanonical(\n            'explosion_follow_up',\n            'highestDown'\n          )||\n          byCanonical(\n            'explosion',\n            'highestDown'\n          )||\n          byCanonical(\n            'explosion_deploy',\n            'highestDown'\n          );\n\n        if(found) return found;\n      }\n\n      const found=\n        byCanonical(\n          'explosion',\n          'lowestDown'\n        )||\n        byCanonical(\n          'explosion_deploy',\n          'highestDown'\n        );\n\n      if(found) return found;\n    }\n\n    const aliases={\n      courte:'small',\n      court:'small',\n      short:'small',\n      moyenne:'medium',\n      moyen:'medium',\n      longue:'large',\n      long:'large',\n      visee:'value',\n      aim:'value',\n      sol:'ground',\n      aerien:'air',\n      air:'air',\n      finale:'finisher',\n      final:'finisher',\n      tourbillon:'spin',\n      rotation:'spin',\n      balle:'bullet',\n      projectile:'bullet',\n      sueur:'sweat',\n      deployee:'deploy',\n      deploye:'deploy',\n      deploiement:'deploy',\n      brulure:'burn',\n      glace:'ice'\n    };\n\n    const titleWords=t\n      .split('_')\n      .filter(Boolean)\n      .map(word=>aliases[word]||word);\n\n    const scored=arr\n      .map((g,index)=>{\n        const words=[\n          canonical(g),\n          norm(g?.type||'')\n        ].join('_');\n\n        const score=titleWords.reduce(\n          (total,word)=>\n            total+(\n              word.length>2&&\n              words.includes(word)\n                ?1\n                :0\n            ),\n          0\n        );\n\n        return {g,index,score};\n      })\n      .sort(\n        (a,b)=>\n          b.score-a.score||\n          a.index-b.index\n      );\n\n    return scored[0]?.g||arr[0];\n  }\n"
          patch_table_v671 = "  function patchLocalTable(tb,remoteSkill){\n    if(\n      !tb||\n      !Array.isArray(tb.rows)||\n      !Array.isArray(tb.cols)\n    ) return false;\n\n    const title=String(tb.title||'');\n    const titleNorm=norm(title);\n\n    if(/Effets/i.test(title)) return false;\n\n    const cols=tb.cols;\n    const ti=findLocalCol(\n      cols,\n      ['Type'],\n      -1\n    );\n    const di=findLocalCol(\n      cols,\n      ['Dégâts','Degats','Damage'],\n      1\n    );\n    const ai=findLocalCol(\n      cols,\n      ['Munitions','Ammo'],\n      -1\n    );\n    const ui=findLocalCol(\n      cols,\n      ['Consommation','Use Ammo'],\n      -1\n    );\n    const ri=findLocalCol(\n      cols,\n      ['Recharge','Reload'],\n      -1\n    );\n    const dpi=findLocalCol(\n      cols,\n      ['Down Power','Down'],\n      -1\n    );\n\n    if(\n      ti>=0||\n      titleNorm.includes('supplement')||\n      titleNorm.includes('additional')\n    ){\n      return false;\n    }\n\n    const base=remoteBaseMap(remoteSkill);\n    const add=remoteAdditionalGroups(remoteSkill);\n    const hasAdditional=\n      Object.keys(add).length>0;\n    const picked=pickAdditionalGroup(\n      add,\n      title\n    );\n\n    const hasResourceColumns=\n      ai>=0||\n      ui>=0||\n      ri>=0;\n\n    const explicitBase=\n      hasResourceColumns||\n      /(^|_)base($|_)/.test(titleNorm);\n\n    const preferAdditional=\n      hasAdditional&&\n      !explicitBase&&\n      (di>=0||dpi>=0);\n\n    let changed=false;\n\n    tb.rows.forEach(row=>{\n      const lvInfo=levelOfRow(row);\n      if(!lvInfo) return;\n\n      const lv=lvInfo.lv;\n      const additionalRow=\n        picked?.rows?.[lv];\n      const baseRow=base[lv];\n\n      if(\n        preferAdditional&&\n        additionalRow\n      ){\n        if(\n          di>=0&&\n          row[di]!==undefined&&\n          additionalRow.damage!==undefined\n        ){\n          row[di]=additionalRow.damage;\n          changed=true;\n        }\n\n        if(\n          dpi>=0&&\n          row[dpi]!==undefined&&\n          additionalRow.down!==undefined\n        ){\n          row[dpi]=additionalRow.down;\n          changed=true;\n        }\n\n        return;\n      }\n\n      if(baseRow){\n        if(\n          di>=0&&\n          row[di]!==undefined&&\n          baseRow.damage!==undefined\n        ){\n          row[di]=baseRow.damage;\n          changed=true;\n        }\n\n        if(\n          ai>=0&&\n          row[ai]!==undefined&&\n          baseRow.ammo!==undefined\n        ){\n          row[ai]=baseRow.ammo;\n          changed=true;\n        }\n\n        if(\n          ui>=0&&\n          row[ui]!==undefined&&\n          baseRow.use!==undefined\n        ){\n          row[ui]=baseRow.use;\n          changed=true;\n        }\n\n        if(\n          ri>=0&&\n          row[ri]!==undefined&&\n          baseRow.reload!==undefined\n        ){\n          row[ri]=baseRow.reload;\n          changed=true;\n        }\n\n        if(\n          dpi>=0&&\n          row[dpi]!==undefined&&\n          baseRow.down!==undefined\n        ){\n          row[dpi]=baseRow.down;\n          changed=true;\n        }\n\n        return;\n      }\n\n      if(additionalRow){\n        if(\n          di>=0&&\n          row[di]!==undefined&&\n          additionalRow.damage!==undefined\n        ){\n          row[di]=additionalRow.damage;\n          changed=true;\n        }\n\n        if(\n          dpi>=0&&\n          row[dpi]!==undefined&&\n          additionalRow.down!==undefined\n        ){\n          row[dpi]=additionalRow.down;\n          changed=true;\n        }\n      }\n    });\n\n    return changed;\n  }\n"

          # Le bloc ajouté contient canonicalAdditionalType.
