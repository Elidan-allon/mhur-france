          def remove_balanced_div(html: str, element_id: str) -> str:
              start_match = re.search(
                  r'<div\b[^>]*\bid=["\']'
                  + re.escape(element_id)
                  + r'["\'][^>]*>',
                  html,
                  flags=re.IGNORECASE,
              )

              if not start_match:
                  return html

              token_pattern = re.compile(
                  r"<div\b[^>]*>|</div\s*>",
                  flags=re.IGNORECASE,
              )

              depth = 0

              for token in token_pattern.finditer(
                  html,
                  start_match.start(),
              ):
                  if token.group(0).lower().startswith("<div"):
                      depth += 1
                  else:
                      depth -= 1

                      if depth == 0:
                          return (
                              html[:start_match.start()]
                              + "\n"
                              + html[token.end():]
                          )

              raise SystemExit(
                  f"[ERREUR] Splash {element_id} incomplet."
              )

