            rel="preload"
            as="image"
            href="/assets/home/season18/gentle_s18_banner.webp"
          >
          <link
            rel="preload"
            as="image"
            href="/assets/home/season18/twice_s18_banner.webp"
          >
          <link
            rel="preload"
            as="image"
            href="/assets/home/season18/tsuyu_profile_nobg.png"
          >
          <!-- MHUR V671 BOOT END -->
          """.strip()

          head = re.search(
              r"<head\b[^>]*>",
              index,
              flags=re.IGNORECASE,
          )

          if not head:
              raise SystemExit(
                  "[ERREUR] Balise <head> introuvable."
              )

          index = (
              index[:head.end()]
              + "\n"
              + boot_block
              + "\n"
              + index[head.end():]
          )

          head_end = re.search(
              r"</head\s*>",
              index,
              flags=re.IGNORECASE,
          )

          if not head_end:
              raise SystemExit(
                  "[ERREUR] Balise </head> introuvable."
              )

          css_tag = (
              f'<link rel="stylesheet" '
              f'href="/css/v671-ui-final.css?v={build}">'
          )

          index = (
              index[:head_end.start()]
              + css_tag
              + "\n"
              + index[head_end.start():]
          )

          body = re.search(
              r"<body\b[^>]*>",
              index,
              flags=re.IGNORECASE,
          )

          if not body:
              raise SystemExit(
                  "[ERREUR] Balise <body> introuvable."
              )

          splash = f"""
          <div id="mhurV671Splash" role="status" aria-live="polite" style="display:none">
            <div class="mhurV671Aurora" aria-hidden="true"></div>
            <div class="mhurV671Beam one" aria-hidden="true"></div>
            <div class="mhurV671Beam two" aria-hidden="true"></div>

            <div class="mhurV671Hero left" aria-hidden="true"></div>

            <div class="mhurV671Hero right" aria-hidden="true"></div>

            <div class="mhurV671Hero mini" aria-hidden="true"></div>

            <main class="mhurV671Stage">
              <section class="mhurV671Panel">
                <i class="mhurV671Corner tl" aria-hidden="true"></i>
                <i class="mhurV671Corner tr" aria-hidden="true"></i>
                <i class="mhurV671Corner bl" aria-hidden="true"></i>
                <i class="mhurV671Corner br" aria-hidden="true"></i>

                <div class="mhurV671Topline">
                  <span class="mhurV671Live">Serveurs en ligne</span>
                  <span class="mhurV671Season">Saison 18</span>
                </div>

                <div class="mhurV671LogoOrbit">
                  <div class="mhurV671Logo">
                    <img
                      src="/assets/brand/mhur-france-icon.png"
                      alt=""
                      width="92"
                      height="92"
                    >
                  </div>
                </div>

                <p class="mhurV671Kicker">Communauté française officielle</p>

                <h1 class="mhurV671Title">
                  MHUR <span>FRANCE</span>
                </h1>

                <p class="mhurV671Subtitle">
                  Le Nexus français de My Hero Ultra Rumble se prépare.
                </p>

                <div class="mhurV671LoadingBox">
                  <div class="mhurV671StatusRow">
                    <span id="mhurV671Status">
                      Initialisation de MHUR France…
                    </span>
                    <strong id="mhurV671Percent">7%</strong>
                  </div>

                  <div class="mhurV671Track" aria-hidden="true">
                    <div id="mhurV671Fill"></div>
                  </div>
                </div>

                <div class="mhurV671Chips" aria-hidden="true">
                  <span>Personnages</span>
                  <span>Alters</span>
                  <span>Patch Notes</span>
                  <span>Costumes</span>
                </div>

                <p class="mhurV671Build">BUILD {build}</p>
              </section>
            </main>
          </div>
          """.strip()

          index = (
              index[:body.end()]
              + "\n"
              + splash
              + "\n"
              + index[body.end():]
          )

          index = re.sub(
              r"\s*<script\b[^>]*\bsrc\s*=\s*[\"']"
              r"(?:/)?js/v671-ui-final\.js"
              r"(?:\?[^\"']*)?[\"'][^>]*>\s*</script>\s*",
              "\n",
              index,
              flags=re.IGNORECASE,
          )

          asset_pattern = re.compile(
              r'(?P<prefix>\b(?:src|href)\s*=\s*["\'])'
              r'(?P<path>(?:/)?(?:css|js|data)/[^"\'?#]+)'
              r'(?:\?[^"\']*)?'
              r'(?P<suffix>["\'])',
              flags=re.IGNORECASE,
          )

          index = asset_pattern.sub(
              lambda match: (
                  f'{match.group("prefix")}/'
                  f'{match.group("path").lstrip("/")}'
                  f'?v={build}'
                  f'{match.group("suffix")}'
              ),
              index,
          )

          body_ends = list(
              re.finditer(
                  r"</body\s*>",
                  index,
                  flags=re.IGNORECASE,
              )
          )

          if not body_ends:
              raise SystemExit(
                  "[ERREUR] Balise </body> introuvable."
              )

          body_end = body_ends[-1]

          index = (
              index[:body_end.start()]
              + f'<script src="/js/v671-ui-final.js?v={build}"></script>\n'
              + index[body_end.start():]
          )

          INDEX.write_text(
              index,
              encoding="utf-8",
          )

          # ----------------------------------------------------------------------
          # Validations.
          # ----------------------------------------------------------------------

          saved = json.loads(
              HOME_JSON.read_text(encoding="utf-8")
          )

          saved_patch = next(
              item
              for item in saved["patch_notes"]
              if str(item.get("id")) == PATCH_ID
          )

          saved_changes = [
              change
              for section in saved_patch.get("details", [])
              for change in section.get("changes", [])
              if isinstance(change, dict)
          ]

          armored = [
              change
              for change in saved_changes
              if (
                  clean(change.get("character_id"))
                  == "armored_all_might"
                  and clean(change.get("style_id"))
                  == "armored_all_might_technical"
                  and clean(change.get("skill_id"))
                  == "armored_all_might_alpha_burn"
                  and clean(
                      (
                          change.get("display_skill_name")
                          or {}
                      ).get("en")
                  )
                  == "α - Ice Bullet Shot (Burn)"
                  and metric(change.get("label"))
                  in {"damage", "guard"}
              )
          ]

          if len(armored) != 2:
              raise SystemExit(
                  "[ERREUR] Armored All Might reste incorrect."
              )

          if any(
              "texas smash" in norm(
                  (
                      change.get("display_skill_name")
                      or {}
                  ).get("en")
              )
              for change in saved_changes
              if clean(change.get("character_id"))
              == "armored_all_might"
          ):
              raise SystemExit(
                  "[ERREUR] Texas Smash apparaît encore "
                  "chez Armored All Might."
              )

          final_index = INDEX.read_text(encoding="utf-8")
          css_text = UI_CSS.read_text(encoding="utf-8")
          js_text = UI_JS.read_text(encoding="utf-8")

          if final_index.count(
              'id="mhurV671Splash"'
          ) != 1:
              raise SystemExit(
                  "[ERREUR] Splash V671 absent ou dupliqué."
              )

          if "tsuyu_profile_nobg.png" not in css_text:
              raise SystemExit(
                  "[ERREUR] La bonne image détourée de Tsuyu "
                  "n'est pas utilisée."
              )

          if re.search(
              r'<(?:figure|img)\b[^>]*mhurV671Hero',
              final_index,
              flags=re.IGNORECASE,
          ):
              raise SystemExit(
                  "[ERREUR] Une illustration du splash est encore "
                  "une balise image visible."
              )

          if 'style="display:none"' not in final_index:
              raise SystemExit(
                  "[ERREUR] Protection du splash sans CSS absente."
              )

          relative_assets = re.findall(
              r'(?:src|href)=["\']'
              r'((?:css|js|data)/[^"\']+)'
              r'["\']',
              final_index,
              flags=re.IGNORECASE,
          )

          if relative_assets:
              raise SystemExit(
                  "[ERREUR] Ressources relatives encore présentes : "
                  + ", ".join(relative_assets[:10])
              )

          if final_index.count(
              "js/v671-ui-final.js"
          ) != 1:
              raise SystemExit(
                  "[ERREUR] JS V671 absent ou dupliqué."
              )

          if final_index.count(
              "css/v671-ui-final.css"
          ) != 1:
              raise SystemExit(
                  "[ERREUR] CSS V671 absent ou dupliqué."
              )

          unversioned = re.findall(
              r'(?:src|href)=["\']'
              r'((?:/)?(?:css|js|data)/[^"\'?#]+)'
              r'["\']',
              final_index,
              flags=re.IGNORECASE,
          )

          if unversioned:
              raise SystemExit(
                  "[ERREUR] Ressources sans build : "
                  + ", ".join(unversioned[:10])
              )

          for script in (
              RENDERER,
              UI_JS,
              LIVE_UPDATE,
              SERVICE_WORKER,
          ):
              subprocess.run(
                  ["node", "--check", str(script)],
                  check=True,
              )

          required_new_targets = (
              ".card[data-char]",
              ".styleCard[data-style]",
              ".costumeTile",
              ".costumeCard",
              ".costumeResult",
          )

          for target in required_new_targets:
              if target not in css_text and target not in js_text:
                  raise SystemExit(
                      "[ERREUR] Type de carte NEW non traité : "
                      + target
                  )

          if "data-mhur-new-owner" not in css_text:
              raise SystemExit(
                  "[ERREUR] Nettoyage global NEW absent."
              )

          required_patch_id_rules = (
              "function patchIdentity(change,group)",
              "change?.character_id",
              "armored_all_might_alpha_burn",
              "data-v608-character-id",
              "data-v608-skill-id",
          )

          renderer_text = RENDERER.read_text(encoding="utf-8")

          for rule in required_patch_id_rules:
              if rule not in renderer_text:
                  raise SystemExit(
                      "[ERREUR] Règle ID du Patch Notes absente : "
                      + rule
                  )

          if "function fixPatchByIds" not in js_text:
              raise SystemExit(
                  "[ERREUR] Garde DOM ID Armored All Might absente."
              )

          new_badge_block = css_text.split(
              ".mhurNewV582::before,",
              1,
          )[-1].split(
              "/* Personnages + Alters/styles. */",
              1,
          )[0]

          required_no_shine = (
              ".mhurNewV582::after {",
              "content: none !important;",
              "display: none !important;",
              "animation: none !important;",
              "background: none !important;",
          )

          for rule in required_no_shine:
              if rule not in new_badge_block:
                  raise SystemExit(
                      "[ERREUR] Protection anti-barre blanche absente : "
                      + rule
                  )

          if "@keyframes mhurV671NewShine" in css_text:
              raise SystemExit(
                  "[ERREUR] L'animation blanche NEW existe encore."
              )

          print(f"[OK] Master V671 : {build}")
          print("[OK] CSS et JS chargés avant toutes les validations.")
          print("[OK] Splash cinématique installé.")
          print("[OK] Tsuyu utilise tsuyu_profile_nobg.png.")
          print("[OK] Aucune bannière du splash ne fuit dans l’accueil.")
          print("[OK] URLs CSS/JS/data absolues sur toutes les routes.")
          print("[OK] Progression et statuts dynamiques.")
          print("[OK] NEW unique sur personnages, Alters et costumes.")
          print("[OK] Anciens NEW fixes supprimés derrière V582.")
          print("[OK] Barre blanche horizontale du NEW supprimée.")
          print("[OK] Correctifs Patch Notes conservés.")
          print("[OK] Armored All Might résolu par character_id/style_id/skill_id.")
          print("[OK] Texas Smash ne peut plus remplacer son alpha.")
          print("[OK] Dégâts multiples des Alters séparés correctement.")
          print("[OK] Cache atomique et service worker actualisés.")
          PY

      - name: Tester les dégâts multiples des Alters
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');

          const html=fs.readFileSync(
            'public/index.html',
            'utf8'
          );

          const jsonMatch=html.match(
            /<script id="ultrarumble-exact-data"[^>]*>([\s\S]*?)<\/script>/
          );

          if(!jsonMatch){
            throw new Error(
              'Données exactes UltraRumble introuvables.'
            );
          }

          const exact=JSON.parse(jsonMatch[1]);
          const fullBullet=
            exact.exact_by_style?.fullbullet;

          if(!fullBullet){
            throw new Error(
              'Style Midoriya Full Bullet introuvable.'
            );
          }

          const statsStart=html.indexOf(
            '<script id="v253-robust-stats-patch">'
          );
          const statsEnd=html.indexOf(
            '</script>',
            statsStart
          );

          if(statsStart<0||statsEnd<0){
            throw new Error(
              'Script V253 introuvable.'
            );
          }

          const stats=html.slice(
            statsStart,
            statsEnd
          );

          const functionsStart=stats.indexOf(
            '  function norm(s){'
          );
          const functionsEnd=stats.indexOf(
            '\n  function pvFromStats(stats){',
            functionsStart
          );

          if(functionsStart<0||functionsEnd<0){
            throw new Error(
              'Fonctions V671 non extractibles.'
            );
          }

          eval(stats.slice(
            functionsStart,
            functionsEnd
          ));

          const levels=()=>Array.from(
            {length:9},
            (_,index)=>[`Lv.${index+1}`,'0']
          );

          const alphaBase={
            title:'Valeurs de base α',
            cols:[
              'Niveau',
              'Dégâts',
              'Munitions',
              'Consommation',
              'Recharge'
            ],
            rows:Array.from(
              {length:9},
              (_,index)=>[
                `Lv.${index+1}`,
                '0',
                'x0',
                'x0',
                '0s'
              ]
            )
          };

          const alphaAim={
            title:'Valeurs mode visée α',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };

          patchLocalTable(
            alphaBase,
            fullBullet.skills['α']
          );
          patchLocalTable(
            alphaAim,
            fullBullet.skills['α']
          );

          if(
            alphaBase.rows[0][1]!=='14'||
            alphaBase.rows[8][1]!=='22'
          ){
            throw new Error(
              'Alpha de base Full Bullet incorrect.'
            );
          }

          if(
            alphaAim.rows[0][1]!=='62'||
            alphaAim.rows[8][1]!=='78'
          ){
            throw new Error(
              'Mode visée Full Bullet incorrect ou dupliqué.'
            );
          }

          const betaGroups=remoteAdditionalGroups(
            fullBullet.skills['β']
          );

          const shortGroup=pickAdditionalGroup(
            betaGroups,
            'Distance courte β'
          );
          const mediumGroup=pickAdditionalGroup(
            betaGroups,
            'Distance moyenne β'
          );
          const largeGroup=pickAdditionalGroup(
            betaGroups,
            'Distance longue β'
          );

          if(shortGroup?.canonical!=='small'){
            throw new Error(
              'Distance courte non associée à Small.'
            );
          }

          if(mediumGroup?.canonical!=='medium'){
            throw new Error(
              'Distance moyenne non associée à Medium.'
            );
          }

          if(largeGroup?.canonical!=='large'){
            throw new Error(
              'Distance longue non associée à Large.'
            );
          }

          if(
            shortGroup.rows['Lv.1']?.damage!=='60'||
            shortGroup.rows['Lv.2']?.damage!=='65'
          ){
            throw new Error(
              'Cycle Small incomplet : la Lv.1 est perdue.'
            );
          }

          const shortTable={
            title:'Distance courte β',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };
          const mediumTable={
            title:'Distance moyenne β',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };
          const largeTable={
            title:'Distance longue β',
            cols:['Niveau','Dégâts'],
            rows:levels()
          };

          patchLocalTable(
            shortTable,
            fullBullet.skills['β']
          );
          patchLocalTable(
            mediumTable,
            fullBullet.skills['β']
          );
          patchLocalTable(
            largeTable,
            fullBullet.skills['β']
          );

          if(
            shortTable.rows[0][1]!=='60'||
            mediumTable.rows[0][1]!=='140'||
            largeTable.rows[0][1]!=='140'
          ){
            throw new Error(
              'Les trois distances de Manchester Smash sont mal séparées.'
            );
          }

          console.log(
            '[OK] Full Bullet α : base 14 et visée 62.'
          );
          console.log(
            '[OK] Manchester Smash : Small / Medium / Large séparés.'
          );
          console.log(
            '[OK] Les dégâts multiples ne réutilisent plus la première série.'
          );
          NODE

      - name: Publier Master V671
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage tous les fichiers créés, modifiés ou supprimés.
          # Contrairement à une liste de chemins, ceci ne plante pas
          # lorsqu'un ancien fichier V661/V662 a déjà disparu.
          git add -A -- .github/workflows public

          if git diff --cached --quiet; then
            echo "[OK] Master V671 est déjà appliqué."
            exit 0
          fi

          git commit -m             "fix: master V671 dégâts multiples, splash et NEW global"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              echo "[OK] Master V671 publié sur main."
              exit 0
            fi

            echo "[ATTENTE] Nouvelle tentative..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Publication impossible."
          exit 1
