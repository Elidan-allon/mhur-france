name: MHUR V631 - Supprimer écran V630

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v631-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v631-remove-v630
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Supprimer V630 et nettoyer le cache
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v631.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          EARLY=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          SW=base64.b64decode("").decode("utf-8")
          CSS=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          index_path=public/"index.html"
          js_path=public/"js"/"v631-remove-v630-loader.js"
          css_path=public/"css"/"v631-remove-v630-loader.css"
          sw_path=public/"sw-v631-cleanup.js"
          headers_path=public/"_headers"
          report_path=root/"RAPPORT_V631_SUPPRESSION_LOADER_V630.txt"
          
          if not index_path.is_file():
              raise SystemExit(
                  "[ERREUR] public/index.html introuvable."
              )
          
          js_path.parent.mkdir(parents=True,exist_ok=True)
          css_path.parent.mkdir(parents=True,exist_ok=True)
          
          js_path.write_text(JS+"\n",encoding="utf-8")
          css_path.write_text(CSS+"\n",encoding="utf-8")
          sw_path.write_text(SW+"\n",encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          # Retire complètement toute installation V630 connue.
          patterns=[
              r'\s*<script id=["\']mhur-v630-boot-start["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v630-boot-critical["\']>'
              r'.*?</style>\s*',
              r'\s*<!-- V630[^>]*-->\s*'
              r'<script[^>]+v630-image-index\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v630-image-index\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<!-- V630[^>]*-->\s*'
              r'<link[^>]+v630-atomic-render\.css[^>]*>\s*',
              r'\s*<link[^>]+v630-atomic-render\.css[^>]*>\s*',
              r'\s*<!-- V630[^>]*-->\s*'
              r'<script[^>]+v630-atomic-render\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v630-atomic-render\.js[^>]*>'
              r'\s*</script>\s*',
          
              r'\s*<script id=["\']mhur-v631-remove-v630-immediately["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v631-remove-v630-critical["\']>'
              r'.*?</style>\s*',
              r'\s*<!-- V631[^>]*-->\s*'
              r'<link[^>]+v631-remove-v630-loader\.css[^>]*>\s*',
              r'\s*<link[^>]+v631-remove-v630-loader\.css[^>]*>\s*',
              r'\s*<!-- V631[^>]*-->\s*'
              r'<script[^>]+v631-remove-v630-loader\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v631-remove-v630-loader\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(
                  pattern,
                  "\n",
                  html,
                  flags=re.I|re.S
              )
          
          head_start=re.search(r'<head[^>]*>',html,flags=re.I)
          
          if not head_start:
              raise SystemExit("[ERREUR] Balise <head> introuvable.")
          
          # Le retrait des classes s'exécute avant tout autre script ou style.
          position=head_start.end()
          html=(
              html[:position]
              +"\n"
              +EARLY
              +"\n"
              +html[position:]
          )
          
          head_ends=list(
              re.finditer(r'</head\s*>',html,flags=re.I)
          )
          
          if not head_ends:
              raise SystemExit("[ERREUR] Balise </head> introuvable.")
          
          position=head_ends[-1].start()
          
          assets=(
              '<!-- V631 : suppression définitive du loader V630 CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v631-remove-v630-loader.css?v=631">\n'
              '<!-- V631 : suppression définitive du loader V630 JS. -->\n'
              '<script defer '
              'src="js/v631-remove-v630-loader.js?v=631">'
              '</script>\n'
          )
          
          html=html[:position]+assets+html[position:]
          index_path.write_text(html,encoding="utf-8")
          
          # Supprime les fichiers V630 du dépôt lorsqu'ils existent.
          for relative in [
              "css/v630-atomic-render.css",
              "js/v630-atomic-render.js",
              "data/v630-image-index.js",
              "sw-v630.js",
          ]:
              path=public/relative
              if path.is_file():
                  path.unlink()
          
          old_report=root/"RAPPORT_V630_RENDU_ATOMIQUE.txt"
          if old_report.is_file():
              old_report.unlink()
          
          # Retire uniquement les règles de cache introduites par V630.
          if headers_path.is_file():
              headers=headers_path.read_text(encoding="utf-8")
              headers=re.sub(
                  r'\n?# MHUR V630 CACHE START.*?'
                  r'# MHUR V630 CACHE END\n?',
                  "\n",
                  headers,
                  flags=re.S,
              ).strip()
          
              if headers:
                  headers_path.write_text(
                      headers+"\n",
                      encoding="utf-8"
                  )
              else:
                  headers_path.unlink()
          
          report_path.write_text(
              """MHUR NEXUS — V631
          
          SUPPRESSION DE V630
          - Suppression du grand écran MY HERO ULTRA RUMBLE NEXUS.
          - Suppression du masquage de l'interface.
          - Suppression de v630-atomic-render.js et de son CSS.
          - Suppression de l'index de préchargement V630.
          - Suppression du Service Worker V630 et de ses caches.
          - Suppression des règles _headers ajoutées uniquement par V630.
          
          NETTOYAGE NAVIGATEUR
          - Le script V631 retire immédiatement les classes V630.
          - Il remplace puis désinstalle l'ancien Service Worker.
          - Il supprime les caches mhur-v630-core et mhur-v630-runtime.
          - Aucun autre écran de chargement n'est ajouté.
          
          NON MODIFIÉ
          - Interface normale du site.
          - Patch Notes et Dev Notes.
          - Tier List.
          - Builds communautaires.
          - Costumes et T.U.N.I.N.G.
          """,
              encoding="utf-8",
          )
          
          print("[OK] Loader V630 supprimé.")
          PY
          
          cat > /tmp/verifier_v631.py <<'PY'
          from pathlib import Path
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          js=Path(
              "public/js/v631-remove-v630-loader.js"
          ).read_text(encoding="utf-8")
          css=Path(
              "public/css/v631-remove-v630-loader.css"
          ).read_text(encoding="utf-8")
          sw=Path(
              "public/sw-v631-cleanup.js"
          ).read_text(encoding="utf-8")
          
          for old in [
              "mhur-v630-boot-start",
              "mhur-v630-boot-critical",
              "v630-atomic-render.css",
              "v630-atomic-render.js",
              "v630-image-index.js",
          ]:
              if old in index:
                  raise SystemExit(
                      f"[ERREUR] Ancienne installation encore présente : {old}"
                  )
          
          for path in [
              Path("public/css/v630-atomic-render.css"),
              Path("public/js/v630-atomic-render.js"),
              Path("public/data/v630-image-index.js"),
              Path("public/sw-v630.js"),
          ]:
              if path.exists():
                  raise SystemExit(
                      f"[ERREUR] Ancien fichier V630 encore présent : {path}"
                  )
          
          for reference in [
              'id="mhur-v631-remove-v630-immediately"',
              'id="mhur-v631-remove-v630-critical"',
              "css/v631-remove-v630-loader.css?v=631",
              "js/v631-remove-v630-loader.js?v=631",
          ]:
              if index.count(reference)!=1:
                  raise SystemExit(
                      f"[ERREUR] Référence V631 absente ou dupliquée : {reference}"
                  )
          
          for token in [
              "mhurV630Booting",
              "mhurV630RouteLoading",
              "clearV630Caches",
              "sw-v631-cleanup.js",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] Nettoyage JS incomplet : {token}"
                  )
          
          for token in [
              "content:none!important",
              "visibility:visible!important",
              "mhurV631NoLoader",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] Nettoyage CSS incomplet : {token}"
                  )
          
          for token in [
              "self.registration.unregister",
              "mhur-v630-core",
              "mhur-v630-runtime",
          ]:
              if token not in sw:
                  raise SystemExit(
                      f"[ERREUR] Worker de nettoyage incomplet : {token}"
                  )
          
          print("[OK] Contrôles V631 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v631.py
          
            node --check public/js/v631-remove-v630-loader.js
            node --check public/sw-v631-cleanup.js
          
            python3 /tmp/verifier_v631.py
          
            git add -A
          
            if git diff --cached --quiet; then
              echo "[INFO] V631 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "revert: supprimer écran de chargement V630"
          
            if git push origin HEAD:main; then
              echo "[OK] V631 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V631 après cinq tentatives."
          exit 1
