name: MHUR V651 - Sync détaillée et styles centrés

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v651-auto.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v651-hourly-sync
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mise_a_jour/requirements.txt

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r mise_a_jour/requirements.txt

      - name: Préparer les scripts V651
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/mhur_v651_ui.py
          printf '%s' '' | base64 --decode > /tmp/mhur_v651_verify.py
          printf '%s' '' | base64 --decode > /tmp/mhur_v651_discord.py

      - name: Centrer le nom et les styles
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_v651_ui.py
          python /tmp/mhur_v651_verify.py

      - name: Vérifier UltraRumble
        id: verifier
        shell: bash
        run: |
          set -euo pipefail

          set +e
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --check-only
          code=$?
          set -e

          case "$code" in
            0)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              ;;
            10)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "[ERREUR] Vérification UltraRumble : code $code"
              exit "$code"
              ;;
          esac

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path(
              "public/data/ultrarumble/derniere_synchronisation.json"
          )

          try:
              status = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              status = {}

          initialized = status.get("status") == "initialisé"
          urls = status.get("changed_urls") or []
          urls = [str(value) for value in urls if str(value).strip()]

          print(f"initialized={'true' if initialized else 'false'}")
          print(f"detected_count={len(urls)}")
          PY

      - name: Appliquer la mise à jour
        if: steps.verifier.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --wait-lock 300

          # Réapplique le centrage après toute reconstruction du site.
          python /tmp/mhur_v651_ui.py
          python /tmp/mhur_v651_verify.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "public/data/ultrarumble/derniere_synchronisation.json"
          )
          status = json.loads(path.read_text(encoding="utf-8"))

          if status.get("status") != "mis_à_jour":
              raise SystemExit(
                  "[ERREUR] La synchronisation n'a pas produit "
                  "le statut mis_à_jour."
              )
          PY

      - name: Publier les fichiers
        id: publier
        shell: bash
        env:
          WAS_INITIALIZED: ${{ steps.verifier.outputs.initialized }}
          SOURCE_CHANGED: ${{ steps.verifier.outputs.changed }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f \
            public/data/ultrarumble/synchronisation_ultrarumble.log \
            public/data/ultrarumble/synchronisation_en_cours.lock
          rm -rf public/sauvegardes

          # V651 remplace V647 et les anciens essais de centrage.
          git rm -f --ignore-unmatch \
            .github/workflows/mhur-v645-auto.yml \
            .github/workflows/mhur-v647-auto.yml \
            .github/workflows/mhur-v650-auto.yml \
            .github/workflows/mhur-v649-auto.yml \
            .github/workflows/mhur-v648-auto.yml \
            .github/workflows/mhur-v646-auto.yml

          if [ "$WAS_INITIALIZED" = "true" ]; then
            git add -f \
              public/data/ultrarumble/synchronisation_state.json \
              public/data/ultrarumble/derniere_synchronisation.json

            if [ -f public/data/diagnostic_data.js ]; then
              git add public/data/diagnostic_data.js
            fi

            commit_message="chore: initialiser la surveillance UltraRumble V647"

          elif [ "$SOURCE_CHANGED" = "true" ]; then
            git add -A public

            # Ces fichiers sont volontairement ignorés par .gitignore,
            # mais doivent être conservés par l'automatisation.
            git add -f \
              public/data/ultrarumble/synchronisation_state.json \
              public/data/ultrarumble/derniere_synchronisation.json

            commit_message="update: synchronisation automatique UltraRumble"

          else
            # La vérification sans changement modifie seulement le diagnostic.
            # On ne crée pas un commit inutile chaque heure.
            git restore --staged --worktree -- \
              public/data/ultrarumble/derniere_synchronisation.json \
              public/data/diagnostic_data.js \
              2>/dev/null || true

            commit_message="fix: centrer le nom et les styles V651"
          fi

          # Le centrage est conservé même sans changement UltraRumble.
          git add \
            public/index.html \
            public/css/v587-images-notes-stable.css

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "[INFO] Aucun fichier à publier."
            exit 0
          fi

          git commit -m "$commit_message"

          pushed=false
          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi

            echo "[ATTENTE] Nouvelle tentative de publication..."
            sleep $((tentative * 4))
          done

          if [ "$pushed" != "true" ]; then
            echo "[ERREUR] Impossible de publier sur main."
            exit 1
          fi

          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if git diff-tree --no-commit-id --name-only -r HEAD \
            | grep -q '^public/'; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Envoyer le détail sur Discord
        if: steps.publier.outputs.updated == 'true'
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.publier.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python /tmp/mhur_v651_discord.py

      - name: Signaler une erreur sur Discord
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import requests

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          user_id = os.environ.get("DISCORD_USER_ID", "").strip()

          if not webhook:
              raise SystemExit(0)

          repository = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = (
              f"https://github.com/{repository}/actions/runs/{run_id}"
              if repository and run_id
              else ""
          )

          mention = f"<@{user_id}> " if user_id else ""
          content = (
              f"{mention}❌ **La synchronisation MHUR V651 a échoué.**"
          )

          if run_url:
              content += f"\nRapport : {run_url}"

          try:
              response = requests.post(
                  webhook,
                  json={
                      "username": "MHUR Nexus — Erreur",
                      "content": content,
                      "allowed_mentions": (
                          {"users": [user_id]}
                          if user_id
                          else {"parse": []}
                      ),
                  },
                  timeout=30,
              )
              response.raise_for_status()
          except Exception as error:
              print(f"[AVERTISSEMENT] Discord indisponible : {error}")
          PY
