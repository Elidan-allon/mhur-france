name: MHUR V654 - Sync + correctif Bakugo Cluster

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v651-auto.yml"
      - ".github/workflows/mhur-v654-auto.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v654-hourly-sync
  cancel-in-progress: false

jobs:
  synchroniser-et-reparer:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mise_a_jour/requirements.txt

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r mise_a_jour/requirements.txt

      - name: Réparer Bakugo Cluster et les Patch Notes
        id: repair_before
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          ROOT = Path("public")
          INDEX = ROOT / "index.html"
          HOME_JSON = ROOT / "data" / "home_data.json"
          HOME_JS = ROOT / "data" / "home_data.js"
          CSS = ROOT / "css" / "v587-images-notes-stable.css"

          for required in (INDEX, HOME_JSON):
              if not required.is_file():
                  raise SystemExit(f"[ERREUR] Fichier introuvable : {required}")

          def rows(values: list[str]) -> list[list[str]]:
              return [[f"Lv.{i + 1}", value] for i, value in enumerate(values)]

          alpha_old = ["30.0", "31.0", "32.0", "34.0", "35.0", "36.0", "37.0", "38.0", "40.0"]
          alpha_new = ["40.0", "41.0", "42.0", "44.0", "45.0", "46.0", "47.0", "48.0", "50.0"]
          beta_old = ["30.0", "31.0", "32.0", "34.0", "35.0", "36.0", "37.0", "38.0", "40.0"]
          beta_new = ["35.0", "36.0", "37.0", "39.0", "40.0", "41.0", "42.0", "43.0", "45.0"]
          beta_follow_old = ["40.0", "41.0", "42.0", "44.0", "45.0", "46.0", "47.0", "48.0", "50.0"]
          beta_follow_new = ["44.0", "46.0", "48.0", "50.0", "52.0", "54.0", "56.0", "58.0", "60.0"]

          data = json.loads(HOME_JSON.read_text(encoding="utf-8"))
          patches = data.setdefault("patch_notes", [])
          patch = next((item for item in patches if str(item.get("id")) == "1785298405"), None)
          if patch is None:
              raise SystemExit("[ERREUR] Patch 1785298405 introuvable dans home_data.json.")

          details = patch.setdefault("details", [])
          damage_section = next(
              (
                  section
                  for section in details
                  if isinstance(section.get("changes"), list)
                  and (
                      str(section.get("accent", "")).lower() == "damage"
                      or "damage" in str(section.get("title", "")).lower()
                      or "dégât" in str(section.get("title", "")).lower()
                  )
              ),
              None,
          )
          if damage_section is None:
              damage_section = {
                  "title": "Changements d'équilibrage : Dégâts",
                  "accent": "damage",
                  "changes": [],
              }
              details.append(damage_section)

          portrait = "assets/home/patches/1785298405/portrait_katsuki_bakugo.webp"
          alpha_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_ap_shot_cluster_normal.png"
          beta_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_nitro_cluster_explosion.png"
          beta_follow_image = "assets/home/patches/1785298405/skill_katsuki_bakugo_nitro_cluster_explosionfollow_up.png"

          def change(skill_name: str, image: str, label: str, before: list[str], after: list[str]) -> dict:
              return {
                  "character": "Katsuki Bakugo",
                  "style": "Cluster",
                  "role": "Technique",
                  "portrait": portrait,
                  "skill_name": skill_name,
                  "skill_image": image,
                  "label": label,
                  "before": before,
                  "after": after,
                  "tone": "buff",
              }

          expected_cluster = [
              change("α - AP Shot Cluster (Normal)", alpha_image, "Dégâts", alpha_old, alpha_new),
              change("α - AP Shot Cluster (Normal)", alpha_image, "Brise-garde", alpha_old, alpha_new),
              change("β - Nitro Cluster (Explosion)", beta_image, "Dégâts", beta_old, beta_new),
              change("β - Nitro Cluster (Explosion)", beta_image, "Brise-garde", beta_old, beta_new),
              change("β - Nitro Cluster (Explosion renforcée)", beta_follow_image, "Dégâts", beta_follow_old, beta_follow_new),
              change("β - Nitro Cluster (Explosion renforcée)", beta_follow_image, "Brise-garde", beta_follow_old, beta_follow_new),
          ]

          def normalized(value: object) -> str:
              return re.sub(r"[^a-z0-9]+", " ", str(value or "").lower()).strip()

          def is_bakugo_cluster(item: dict) -> bool:
              character = normalized(item.get("character"))
              style = normalized(item.get("style"))
              skill = normalized(item.get("skill_name"))
              image = normalized(item.get("skill_image"))
              return (
                  "bakugo" in character
                  and (
                      "cluster" in style
                      or "cluster" in skill
                      or "cluster" in image
                  )
              )

          old_changes = list(damage_section.get("changes") or [])
          kept: list[dict] = []
          insertion_index: int | None = None
          for item in old_changes:
              if isinstance(item, dict) and is_bakugo_cluster(item):
                  if insertion_index is None:
                      insertion_index = len(kept)
                  continue
              kept.append(item)

          if insertion_index is None:
              insertion_index = len(kept)
              for i, item in enumerate(kept):
                  if "bakugo" in normalized(item.get("character")):
                      insertion_index = i + 1

          kept[insertion_index:insertion_index] = expected_cluster
          damage_section["changes"] = kept

          # Ajoute α / β / γ aux autres compétences lorsqu'une image permet
          # de reconnaître la compétence sans ambiguïté.
          greek_prefix = {
              "alpha": "α",
              "beta": "β",
              "gamma": "γ",
          }
          for patch_item in patches:
              for section in patch_item.get("details") or []:
                  for item in section.get("changes") or []:
                      if not isinstance(item, dict):
                          continue
                      name = str(item.get("skill_name") or "").strip()
                      if not name or name in {"HP", "PV"}:
                          continue
                      existing = re.match(r"^\s*([αβγ])\s*(?:[-–—:]\s*)?(.*)$", name)
                      if existing:
                          item["skill_name"] = f"{existing.group(1)} - {existing.group(2).strip()}"
                          continue
                      image = str(item.get("skill_image") or "").lower()
                      for token, symbol in greek_prefix.items():
                          if re.search(rf"(?:^|[/_.-]){token}(?:$|[/_.-])", image):
                              item["skill_name"] = f"{symbol} - {name}"
                              break

          meta = data.setdefault("meta", {})
          meta["bakugo_cluster_fix"] = "v654"
          HOME_JSON.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # Le site charge home_data.js, pas directement home_data.json.
          # On le reconstruit systématiquement depuis le JSON réparé.
          compact = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
          compact = compact.replace("\u2028", "\\u2028").replace("\u2029", "\\u2029")
          js_content = "window.MHUR_HOME_DATA = " + compact + ";\n"
          HOME_JS.write_text(js_content, encoding="utf-8")
          data_hash = hashlib.sha256(js_content.encode("utf-8")).hexdigest()[:12]

          html = INDEX.read_text(encoding="utf-8")

          # Valeurs actuelles exactes de Bakugo Cluster sur la page Personnages.
          arrays = {
              "bakugoTechAlphaBase": [
                  ["Lv.1", "x4", "x1", "2.5s"], ["Lv.2", "x4", "x1", "2.5s"],
                  ["Lv.3", "x4", "x1", "2.5s"], ["Lv.4", "x5", "x1", "2.5s"],
                  ["Lv.5", "x5", "x1", "2.5s"], ["Lv.6", "x5", "x1", "2.5s"],
                  ["Lv.7", "x5", "x1", "2.5s"], ["Lv.8", "x5", "x1", "2.5s"],
                  ["Lv.9", "x6", "x1", "2.5s"],
              ],
              "bakugoTechAlphaNormal": rows(["40", "41", "42", "44", "45", "46", "47", "48", "50"]),
              "bakugoTechAlphaDeploy": rows(["10", "10", "10", "11", "11", "11", "11", "11", "12"]),
              "bakugoTechAlphaExplosion": rows(["40", "41", "42", "44", "45", "46", "47", "48", "50"]),
              "bakugoTechAlphaBullet": rows(["8", "8", "8", "9", "9", "9", "9", "9", "10"]),
              "bakugoTechBetaBase": [
                  ["Lv.1", "x2", "x1", "8s"], ["Lv.2", "x2", "x1", "8s"],
                  ["Lv.3", "x2", "x1", "8s"], ["Lv.4", "x2", "x1", "7s"],
                  ["Lv.5", "x2", "x1", "7s"], ["Lv.6", "x2", "x1", "7s"],
                  ["Lv.7", "x2", "x1", "7s"], ["Lv.8", "x2", "x1", "7s"],
                  ["Lv.9", "x2", "x1", "6s"],
              ],
              "bakugoTechBetaBulletSweat": rows(["17", "18", "19", "20", "21", "22", "23", "24", "25"]),
              "bakugoTechBetaDeploySweat": rows(["5", "5", "5", "5", "5", "5", "5", "5", "5"]),
              "bakugoTechBetaExplosion": rows(["35", "36", "37", "39", "40", "41", "42", "43", "45"]),
              "bakugoTechBetaExplosionPlus": rows(["44", "46", "48", "50", "52", "54", "56", "58", "60"]),
          }

          for variable, value in arrays.items():
              replacement = f"const {variable} = {json.dumps(value, ensure_ascii=False)};"
              pattern = re.compile(rf"const\s+{re.escape(variable)}\s*=\s*\[[^;\n]*\];")
              html, count = pattern.subn(replacement, html, count=1)
              if count != 1:
                  raise SystemExit(f"[ERREUR] Tableau JavaScript introuvable ou dupliqué : {variable}")

          html = html.replace(
              "Dégâts β — Explosion +",
              "Dégâts β — Explosion renforcée",
          )

          cache_pattern = re.compile(
              r'(<script\s+src=["\'](?:/)?data/home_data\.js)(?:\?v=[^"\']*)?(["\'])',
              flags=re.IGNORECASE,
          )
          html, cache_count = cache_pattern.subn(
              rf"\1?v={data_hash}\2",
              html,
              count=1,
          )
          if cache_count != 1:
              raise SystemExit("[ERREUR] Balise data/home_data.js introuvable dans index.html.")

          # Conserve aussi le centrage apporté par V651.
          if CSS.is_file():
              css = CSS.read_text(encoding="utf-8")
              start = "/* === MHUR V654 STYLE PICKER CENTER START === */"
              end = "/* === MHUR V654 STYLE PICKER CENTER END === */"
              for old_start, old_end in (
                  ("/* === MHUR V650 STYLE CENTER START === */", "/* === MHUR V650 STYLE CENTER END === */"),
                  ("/* === MHUR V651 STYLE PICKER CENTER START === */", "/* === MHUR V651 STYLE PICKER CENTER END === */"),
                  (start, end),
              ):
                  if old_start in css and old_end in css:
                      before, remainder = css.split(old_start, 1)
                      _, after = remainder.split(old_end, 1)
                      css = before.rstrip() + "\n" + after.lstrip()
              center_block = """/* === MHUR V654 STYLE PICKER CENTER START === */
          h1.title:has(+ .styleGrid) {
            width: 100% !important;
            text-align: center !important;
          }
          @media (min-width: 761px) {
            html body #app .styleGrid,
            html body .styleGrid {
              display: flex !important;
              flex-wrap: wrap !important;
              justify-content: center !important;
              width: 100% !important;
              margin-left: auto !important;
              margin-right: auto !important;
            }
          }
          /* === MHUR V654 STYLE PICKER CENTER END === */"""
              CSS.write_text(css.rstrip() + "\n\n" + center_block + "\n", encoding="utf-8")

          INDEX.write_text(html, encoding="utf-8")
          print(f"[OK] Correctif V654 appliqué. Cache home_data.js : {data_hash}")
          PY

      - name: Vérifier UltraRumble
        id: source
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --check-only
          code=$?
          set -e

          if [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "[AVERTISSEMENT] Vérification UltraRumble impossible (code $code)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Appliquer la mise à jour UltraRumble
        if: steps.source.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --wait-lock 300

      - name: Réappliquer le correctif après la synchronisation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Réutilise exactement le script de la première étape depuis le résumé GitHub.
          # Cette seconde exécution est volontaire : l'outil de synchronisation peut
          # reconstruire index.html, home_data.json et home_data.js.
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          ROOT = Path("public")
          INDEX = ROOT / "index.html"
          HOME_JSON = ROOT / "data" / "home_data.json"
          HOME_JS = ROOT / "data" / "home_data.js"

          def rows(values):
              return [[f"Lv.{i + 1}", value] for i, value in enumerate(values)]

          data = json.loads(HOME_JSON.read_text(encoding="utf-8"))
          patches = data.setdefault("patch_notes", [])
          patch = next((item for item in patches if str(item.get("id")) == "1785298405"), None)
          if patch is None:
              raise SystemExit("[ERREUR] Patch 1785298405 introuvable.")

          details = patch.setdefault("details", [])
          section = next(
              (
                  item for item in details
                  if isinstance(item.get("changes"), list)
                  and (
                      str(item.get("accent", "")).lower() == "damage"
                      or "damage" in str(item.get("title", "")).lower()
                      or "dégât" in str(item.get("title", "")).lower()
                  )
              ),
              None,
          )
          if section is None:
              section = {"title": "Changements d'équilibrage : Dégâts", "accent": "damage", "changes": []}
              details.append(section)

          alpha_old = ["30.0", "31.0", "32.0", "34.0", "35.0", "36.0", "37.0", "38.0", "40.0"]
          alpha_new = ["40.0", "41.0", "42.0", "44.0", "45.0", "46.0", "47.0", "48.0", "50.0"]
          beta_new = ["35.0", "36.0", "37.0", "39.0", "40.0", "41.0", "42.0", "43.0", "45.0"]
          follow_new = ["44.0", "46.0", "48.0", "50.0", "52.0", "54.0", "56.0", "58.0", "60.0"]
          portrait = "assets/home/patches/1785298405/portrait_katsuki_bakugo.webp"

          def make(name, image, label, before, after):
              return {
                  "character": "Katsuki Bakugo", "style": "Cluster", "role": "Technique",
                  "portrait": portrait, "skill_name": name, "skill_image": image,
                  "label": label, "before": before, "after": after, "tone": "buff",
              }

          alpha_img = "assets/home/patches/1785298405/skill_katsuki_bakugo_ap_shot_cluster_normal.png"
          beta_img = "assets/home/patches/1785298405/skill_katsuki_bakugo_nitro_cluster_explosion.png"
          follow_img = "assets/home/patches/1785298405/skill_katsuki_bakugo_nitro_cluster_explosionfollow_up.png"
          expected = [
              make("α - AP Shot Cluster (Normal)", alpha_img, "Dégâts", alpha_old, alpha_new),
              make("α - AP Shot Cluster (Normal)", alpha_img, "Brise-garde", alpha_old, alpha_new),
              make("β - Nitro Cluster (Explosion)", beta_img, "Dégâts", alpha_old, beta_new),
              make("β - Nitro Cluster (Explosion)", beta_img, "Brise-garde", alpha_old, beta_new),
              make("β - Nitro Cluster (Explosion renforcée)", follow_img, "Dégâts", alpha_new, follow_new),
              make("β - Nitro Cluster (Explosion renforcée)", follow_img, "Brise-garde", alpha_new, follow_new),
          ]

          def norm(value):
              return re.sub(r"[^a-z0-9]+", " ", str(value or "").lower()).strip()

          kept = []
          at = None
          for item in list(section.get("changes") or []):
              cluster = "bakugo" in norm(item.get("character")) and (
                  "cluster" in norm(item.get("style"))
                  or "cluster" in norm(item.get("skill_name"))
                  or "cluster" in norm(item.get("skill_image"))
              )
              if cluster:
                  if at is None:
                      at = len(kept)
              else:
                  kept.append(item)
          if at is None:
              at = len(kept)
          kept[at:at] = expected
          section["changes"] = kept

          for patch_item in patches:
              for detail in patch_item.get("details") or []:
                  for item in detail.get("changes") or []:
                      name = str(item.get("skill_name") or "").strip()
                      if not name or name in {"HP", "PV"}:
                          continue
                      match = re.match(r"^\s*([αβγ])\s*(?:[-–—:]\s*)?(.*)$", name)
                      if match:
                          item["skill_name"] = f"{match.group(1)} - {match.group(2).strip()}"
                          continue
                      image = str(item.get("skill_image") or "").lower()
                      for token, symbol in (("alpha", "α"), ("beta", "β"), ("gamma", "γ")):
                          if re.search(rf"(?:^|[/_.-]){token}(?:$|[/_.-])", image):
                              item["skill_name"] = f"{symbol} - {name}"
                              break

          data.setdefault("meta", {})["bakugo_cluster_fix"] = "v654"
          HOME_JSON.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          compact = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
          compact = compact.replace("\u2028", "\\u2028").replace("\u2029", "\\u2029")
          js = "window.MHUR_HOME_DATA = " + compact + ";\n"
          HOME_JS.write_text(js, encoding="utf-8")
          digest = hashlib.sha256(js.encode("utf-8")).hexdigest()[:12]

          html = INDEX.read_text(encoding="utf-8")
          arrays = {
              "bakugoTechAlphaBase": [[f"Lv.{i+1}", *value] for i, value in enumerate([
                  ["x4", "x1", "2.5s"], ["x4", "x1", "2.5s"], ["x4", "x1", "2.5s"],
                  ["x5", "x1", "2.5s"], ["x5", "x1", "2.5s"], ["x5", "x1", "2.5s"],
                  ["x5", "x1", "2.5s"], ["x5", "x1", "2.5s"], ["x6", "x1", "2.5s"],
              ])],
              "bakugoTechAlphaNormal": rows(["40", "41", "42", "44", "45", "46", "47", "48", "50"]),
              "bakugoTechAlphaDeploy": rows(["10", "10", "10", "11", "11", "11", "11", "11", "12"]),
              "bakugoTechAlphaExplosion": rows(["40", "41", "42", "44", "45", "46", "47", "48", "50"]),
              "bakugoTechAlphaBullet": rows(["8", "8", "8", "9", "9", "9", "9", "9", "10"]),
              "bakugoTechBetaBase": [[f"Lv.{i+1}", *value] for i, value in enumerate([
                  ["x2", "x1", "8s"], ["x2", "x1", "8s"], ["x2", "x1", "8s"],
                  ["x2", "x1", "7s"], ["x2", "x1", "7s"], ["x2", "x1", "7s"],
                  ["x2", "x1", "7s"], ["x2", "x1", "7s"], ["x2", "x1", "6s"],
              ])],
              "bakugoTechBetaBulletSweat": rows(["17", "18", "19", "20", "21", "22", "23", "24", "25"]),
              "bakugoTechBetaDeploySweat": rows(["5"] * 9),
              "bakugoTechBetaExplosion": rows(["35", "36", "37", "39", "40", "41", "42", "43", "45"]),
              "bakugoTechBetaExplosionPlus": rows(["44", "46", "48", "50", "52", "54", "56", "58", "60"]),
          }
          for variable, value in arrays.items():
              pattern = re.compile(rf"const\s+{re.escape(variable)}\s*=\s*\[[^;\n]*\];")
              html, count = pattern.subn(
                  f"const {variable} = {json.dumps(value, ensure_ascii=False)};",
                  html,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"[ERREUR] Tableau introuvable : {variable}")

          html = html.replace("Dégâts β — Explosion +", "Dégâts β — Explosion renforcée")
          html, count = re.subn(
              r'(<script\s+src=["\'](?:/)?data/home_data\.js)(?:\?v=[^"\']*)?(["\'])',
              rf"\1?v={digest}\2",
              html,
              count=1,
              flags=re.IGNORECASE,
          )
          if count != 1:
              raise SystemExit("[ERREUR] Balise home_data.js introuvable.")
          INDEX.write_text(html, encoding="utf-8")
          print(f"[OK] Correctif V654 réappliqué après synchronisation : {digest}")
          PY

      - name: Vérification finale stricte
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          home_json = Path("public/data/home_data.json")
          home_js = Path("public/data/home_data.js")
          index = Path("public/index.html")

          data = json.loads(home_json.read_text(encoding="utf-8"))
          patch = next((p for p in data.get("patch_notes", []) if str(p.get("id")) == "1785298405"), None)
          if patch is None:
              raise SystemExit("[ERREUR] Patch 1785298405 absent.")

          changes = [
              c
              for section in patch.get("details", [])
              for c in section.get("changes", [])
              if c.get("character") == "Katsuki Bakugo" and c.get("style") == "Cluster"
          ]
          if len(changes) != 6:
              raise SystemExit(f"[ERREUR] 6 changements Cluster attendus, trouvé : {len(changes)}")

          expected_titles = Counter({
              "α - AP Shot Cluster (Normal)": 2,
              "β - Nitro Cluster (Explosion)": 2,
              "β - Nitro Cluster (Explosion renforcée)": 2,
          })
          if Counter(c.get("skill_name") for c in changes) != expected_titles:
              raise SystemExit("[ERREUR] Les titres α / β et leurs sous-types sont incorrects.")

          expected_labels = Counter({"Dégâts": 3, "Brise-garde": 3})
          if Counter(c.get("label") for c in changes) != expected_labels:
              raise SystemExit("[ERREUR] Dégâts / Brise-garde incorrects.")

          js_text = home_js.read_text(encoding="utf-8")
          prefix = "window.MHUR_HOME_DATA = "
          if not js_text.startswith(prefix) or not js_text.rstrip().endswith(";"):
              raise SystemExit("[ERREUR] home_data.js invalide.")
          js_data = json.loads(js_text[len(prefix):].strip()[:-1])
          if js_data != data:
              raise SystemExit("[ERREUR] home_data.js n'est pas synchronisé avec home_data.json.")

          html = index.read_text(encoding="utf-8")
          if not re.search(r'data/home_data\.js\?v=[0-9a-f]{12}', html):
              raise SystemExit("[ERREUR] Cache de home_data.js non renouvelé.")

          required = {
              'const bakugoTechAlphaNormal = [["Lv.1", "40"]',
              'const bakugoTechAlphaBase = [["Lv.1", "x4", "x1", "2.5s"]',
              'const bakugoTechBetaExplosion = [["Lv.1", "35"]',
              'const bakugoTechBetaExplosionPlus = [["Lv.1", "44"]',
              "Dégâts β — Explosion renforcée",
          }
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit("[ERREUR] Valeurs Bakugo manquantes : " + " | ".join(missing))

          print("[OK] Patch Notes, signes α/β/γ, cache et valeurs Bakugo validés.")
          PY

      - name: Publier les corrections
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A public
          git add -f \
            public/data/ultrarumble/synchronisation_state.json \
            public/data/ultrarumble/derniere_synchronisation.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "[OK] Aucun changement à publier."
            exit 0
          fi

          git commit -m "fix: réparer Bakugo Cluster et les Patch Notes V654"

          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] Correctif V654 publié."
              exit 0
            fi
            echo "[ATTENTE] Nouvelle tentative de publication..."
            sleep $((tentative * 4))
          done

          echo "[ERREUR] Impossible de publier le correctif sur main."
          exit 1
