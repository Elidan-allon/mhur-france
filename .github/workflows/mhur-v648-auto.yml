name: MHUR V648 - Styles centrés sans remplacement fragile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v648-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v648-style-center
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer le centrage stable
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v648.py <<'PY'
          from pathlib import Path
          import re
          
          root = Path(".")
          index_path = root / "public" / "index.html"
          css_path = root / "public" / "css" / "v648-style-grid-center.css"
          report_path = root / "RAPPORT_V648_STYLES_CENTRES.txt"
          
          if not index_path.is_file():
              raise SystemExit("[ERREUR] public/index.html introuvable.")
          
          css_path.parent.mkdir(parents=True, exist_ok=True)
          
          CSS = """/* MHUR Nexus — V648
             Centre uniquement la grille de choix des styles sur ordinateur.
             Les dimensions des cartes ne sont pas modifiées. */
          
          @media (min-width: 761px) {
            body .styleGrid {
              width: 100% !important;
              justify-content: center !important;
            }
          }
          """
          css_path.write_text(CSS, encoding="utf-8")
          
          html = index_path.read_text(encoding="utf-8")
          
          # Retire seulement une éventuelle ancienne référence V648.
          html = re.sub(
              r'\s*<!-- MHUR V648 : styles centrés PC -->\s*'
              r'<link[^>]+v648-style-grid-center\.css[^>]*>\s*',
              "\n",
              html,
              flags=re.I,
          )
          
          html = re.sub(
              r'\s*<link[^>]+v648-style-grid-center\.css[^>]*>\s*',
              "\n",
              html,
              flags=re.I,
          )
          
          # Insertion stable juste après le charset, sans dépendre de l'ancienne
          # écriture de .styleGrid dans le gros bloc CSS principal.
          charset = re.search(
              r'<meta\s+charset=["\']utf-8["\']\s*/?>',
              html,
              flags=re.I,
          )
          
          if not charset:
              raise SystemExit("[ERREUR] Balise meta charset UTF-8 introuvable.")
          
          tag = (
              '\n<!-- MHUR V648 : styles centrés PC -->\n'
              '<link rel="stylesheet" '
              'href="css/v648-style-grid-center.css?v=648">\n'
          )
          
          position = charset.end()
          html = html[:position] + tag + html[position:]
          
          index_path.write_text(html, encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V648
          
          PROBLÈME
          Le workflow V646 cherchait une chaîne CSS exacte dans index.html.
          Dès que cette chaîne différait, même légèrement, il s'arrêtait.
          
          CORRECTION
          - Nouveau fichier CSS indépendant et prioritaire.
          - Choix des styles centré horizontalement sur ordinateur.
          - Aucun remplacement fragile de l'ancien CSS.
          - Aucune modification de largeur ou de hauteur des cartes.
          - Les cartes restent à leur taille actuelle de 360 px sur ordinateur.
          - Aucun changement sur mobile.
          - Aucun changement des images, badges, rôles ou textes.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V648 appliqué.")
          PY
          
          cat > /tmp/verifier_v648.py <<'PY'
          from pathlib import Path
          
          index = Path("public/index.html").read_text(encoding="utf-8")
          css = Path(
              "public/css/v648-style-grid-center.css"
          ).read_text(encoding="utf-8")
          
          reference = "css/v648-style-grid-center.css?v=648"
          
          if index.count(reference) != 1:
              raise SystemExit(
                  "[ERREUR] La feuille V648 est absente ou dupliquée."
              )
          
          required = [
              "@media (min-width: 761px)",
              "body .styleGrid",
              "width: 100% !important;",
              "justify-content: center !important;",
          ]
          
          for value in required:
              if value not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V648 incomplet : {value}"
                  )
          
          for forbidden in [
              ".styleCard",
              "height:",
              "transform:",
              "scale(",
          ]:
              if forbidden in css:
                  raise SystemExit(
                      f"[ERREUR] V648 modifie les cartes : {forbidden}"
                  )
          
          print("[OK] Vérification V648 réussie.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v648.py
            python3 /tmp/verifier_v648.py
          
            # Retire l'ancien workflow défectueux pour éviter toute confusion.
            git rm -f --ignore-unmatch     .github/workflows/mhur-v646-auto.yml
          
            git add     public/index.html     public/css/v648-style-grid-center.css     RAPPORT_V648_STYLES_CENTRES.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V648 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: centrer les cartes de styles sur PC V648"
          
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "[OK] V648 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V648."
          exit 1
