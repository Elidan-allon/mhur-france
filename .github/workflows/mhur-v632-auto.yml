name: MHUR V632 - Arrêter rechargement infini

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v632-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v632-stop-reload-loop
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Supprimer V630 V631 et arrêter la boucle
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v632.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          EARLY=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          CSS=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          
          index_path=public/"index.html"
          js_path=public/"js"/"v632-stop-reload-loop.js"
          css_path=public/"css"/"v632-stop-reload-loop.css"
          report_path=root/"RAPPORT_V632_ARRET_RECHARGEMENT_INFINI.txt"
          
          if not index_path.is_file():
              raise SystemExit(
                  "[ERREUR] public/index.html introuvable."
              )
          
          js_path.parent.mkdir(parents=True,exist_ok=True)
          css_path.parent.mkdir(parents=True,exist_ok=True)
          
          js_path.write_text(JS+"\n",encoding="utf-8")
          css_path.write_text(CSS+"\n",encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          # Supprime toutes les installations et références V630/V631.
          patterns=[
              r'\s*<script id=["\']mhur-v630-boot-start["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v630-boot-critical["\']>'
              r'.*?</style>\s*',
          
              r'\s*<script id=["\']mhur-v631-remove-v630-immediately["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v631-remove-v630-critical["\']>'
              r'.*?</style>\s*',
          
              r'\s*<!-- V630[^>]*-->\s*'
              r'<(?:script|link)[^>]+v630-[^>]+>'
              r'(?:\s*</script>)?\s*',
              r'\s*<(?:script|link)[^>]+v630-[^>]+>'
              r'(?:\s*</script>)?\s*',
          
              r'\s*<!-- V631[^>]*-->\s*'
              r'<(?:script|link)[^>]+v631-[^>]+>'
              r'(?:\s*</script>)?\s*',
              r'\s*<(?:script|link)[^>]+v631-[^>]+>'
              r'(?:\s*</script>)?\s*',
          
              r'\s*<script id=["\']mhur-v632-stop-reload-loop["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v632-stop-reload-loop-css["\']>'
              r'.*?</style>\s*',
          
              r'\s*<!-- V632[^>]*-->\s*'
              r'<link[^>]+v632-stop-reload-loop\.css[^>]*>\s*',
              r'\s*<link[^>]+v632-stop-reload-loop\.css[^>]*>\s*',
          
              r'\s*<!-- V632[^>]*-->\s*'
              r'<script[^>]+v632-stop-reload-loop\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v632-stop-reload-loop\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(
                  pattern,
                  "\n",
                  html,
                  flags=re.I|re.S
              )
          
          head_start=re.search(r'<head[^>]*>',html,flags=re.I)
          
          if not head_start:
              raise SystemExit(
                  "[ERREUR] Balise <head> introuvable."
              )
          
          # Nettoyage immédiatement après <head>, avant tous les anciens scripts.
          position=head_start.end()
          html=(
              html[:position]
              +"\n"
              +EARLY
              +"\n"
              +html[position:]
          )
          
          head_ends=list(
              re.finditer(r'</head\s*>',html,flags=re.I)
          )
          
          if not head_ends:
              raise SystemExit(
                  "[ERREUR] Balise </head> introuvable."
              )
          
          position=head_ends[-1].start()
          
          assets=(
              '<!-- V632 : arrêt du rechargement infini CSS. -->\n'
              '<link rel="stylesheet" '
              'href="css/v632-stop-reload-loop.css?v=632">\n'
              '<!-- V632 : nettoyage passif sans nouveau Service Worker. -->\n'
              '<script defer '
              'src="js/v632-stop-reload-loop.js?v=632">'
              '</script>\n'
          )
          
          html=html[:position]+assets+html[position:]
          index_path.write_text(html,encoding="utf-8")
          
          # Supprime les scripts, styles et workers responsables.
          obsolete_files=[
              "css/v630-atomic-render.css",
              "js/v630-atomic-render.js",
              "data/v630-image-index.js",
              "sw-v630.js",
          
              "css/v631-remove-v630-loader.css",
              "js/v631-remove-v630-loader.js",
              "sw-v631-cleanup.js",
          ]
          
          for relative in obsolete_files:
              path=public/relative
          
              if path.is_file():
                  path.unlink()
          
          for relative in [
              "RAPPORT_V630_RENDU_ATOMIQUE.txt",
              "RAPPORT_V631_SUPPRESSION_LOADER_V630.txt",
          ]:
              path=root/relative
          
              if path.is_file():
                  path.unlink()
          
          # Retire les règles de cache V630 si elles sont encore là.
          headers_path=public/"_headers"
          
          if headers_path.is_file():
              headers=headers_path.read_text(encoding="utf-8")
          
              headers=re.sub(
                  r'\n?# MHUR V630 CACHE START.*?'
                  r'# MHUR V630 CACHE END\n?',
                  "\n",
                  headers,
                  flags=re.S,
              ).strip()
          
              if headers:
                  headers_path.write_text(
                      headers+"\n",
                      encoding="utf-8"
                  )
              else:
                  headers_path.unlink()
          
          report_path.write_text(
              """MHUR NEXUS — V632
          
          CAUSE DU RECHARGEMENT INFINI
          V631 enregistrait sw-v631-cleanup.js au chargement et une seconde fois
          dans l'événement load. Ce worker utilisait skipWaiting(), clients.claim()
          puis se désinscrivait. Un nouveau changement de contrôleur pouvait alors
          provoquer un nouveau chargement, qui réinstallait le même worker.
          
          CORRECTION
          - Suppression de V630 et V631 dans index.html.
          - Suppression de sw-v630.js et sw-v631-cleanup.js.
          - Aucun nouveau Service Worker n'est enregistré.
          - Aucun location.reload() n'est utilisé.
          - Les anciens workers sont seulement désinscrits.
          - Les caches V630/V631 sont seulement supprimés.
          - L'interface est immédiatement rendue visible.
          - Les autres versions du site restent inchangées.
          
          APRÈS DÉPLOIEMENT
          Fermer tous les onglets mhurfrance.com puis rouvrir le site une fois
          permet à l'ancien contrôleur déjà en mémoire de disparaître définitivement.
          """,
              encoding="utf-8",
          )
          
          print("[OK] V632 appliqué : boucle de rechargement supprimée.")
          PY
          
          cat > /tmp/verifier_v632.py <<'PY'
          from pathlib import Path
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          js=Path(
              "public/js/v632-stop-reload-loop.js"
          ).read_text(encoding="utf-8")
          css=Path(
              "public/css/v632-stop-reload-loop.css"
          ).read_text(encoding="utf-8")
          
          for old in [
              "mhur-v630-boot-start",
              "mhur-v630-boot-critical",
              "v630-atomic-render",
              "v630-image-index",
              "mhur-v631-remove-v630",
              "v631-remove-v630-loader",
              "sw-v631-cleanup.js",
          ]:
              if old in index:
                  raise SystemExit(
                      f"[ERREUR] Ancienne référence encore présente : {{old}}"
                  )
          
          for path in [
              Path("public/css/v630-atomic-render.css"),
              Path("public/js/v630-atomic-render.js"),
              Path("public/data/v630-image-index.js"),
              Path("public/sw-v630.js"),
              Path("public/css/v631-remove-v630-loader.css"),
              Path("public/js/v631-remove-v630-loader.js"),
              Path("public/sw-v631-cleanup.js"),
          ]:
              if path.exists():
                  raise SystemExit(
                      f"[ERREUR] Ancien fichier encore présent : {{path}}"
                  )
          
          for reference in [
              'id="mhur-v632-stop-reload-loop"',
              'id="mhur-v632-stop-reload-loop-css"',
              "css/v632-stop-reload-loop.css?v=632",
              "js/v632-stop-reload-loop.js?v=632",
          ]:
              if index.count(reference)!=1:
                  raise SystemExit(
                      f"[ERREUR] Référence V632 absente ou dupliquée : {{reference}}"
                  )
          
          if "serviceWorker.register" in js:
              raise SystemExit(
                  "[ERREUR] V632 ne doit enregistrer aucun Service Worker."
              )
          
          if "location.reload" in js:
              raise SystemExit(
                  "[ERREUR] V632 ne doit recharger aucune page."
              )
          
          for token in [
              "getRegistrations",
              "registration.unregister",
              "clearOldCaches",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] Nettoyage V632 incomplet : {{token}}"
                  )
          
          for token in [
              "content:none!important",
              "visibility:visible!important",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V632 incomplet : {{token}}"
                  )
          
          print("[OK] Contrôles V632 validés.")
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v632.py
          
            node --check public/js/v632-stop-reload-loop.js
            python3 /tmp/verifier_v632.py
          
            git add -A
          
            if git diff --cached --quiet; then
              echo "[INFO] V632 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: arrêter rechargement infini V632"
          
            if git push origin HEAD:main; then
              echo "[OK] V632 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V632 après cinq tentatives."
          exit 1
