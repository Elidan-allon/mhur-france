name: MHUR V633B - Rendu final direct corrigé

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v633b-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v633b-final-first-frame
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Appliquer le rendu final direct V633B
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v633.py <<'PY'
          from pathlib import Path
          import base64
          import json
          import re
          import unicodedata
          
          CRITICAL=base64.b64decode(
              ""
          ).decode("utf-8")
          
          CSS=base64.b64decode(
              ""
          ).decode("utf-8")
          
          PRELOAD_JS=base64.b64decode(
              ""
          ).decode("utf-8")
          
          FINAL_JS=base64.b64decode(
              ""
          ).decode("utf-8")
          
          HEADERS_BLOCK=base64.b64decode(
              ""
          ).decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          
          index_path=public/"index.html"
          css_path=public/"css"/"v633-final-first-frame.css"
          preload_path=public/"js"/"v633-route-image-preload.js"
          final_path=public/"js"/"v633-final-first-frame.js"
          map_path=public/"data"/"v633-route-images.js"
          headers_path=public/"_headers"
          report_path=root/"RAPPORT_V633_RENDU_FINAL_DIRECT.txt"
          
          if not index_path.is_file():
              raise SystemExit(
                  "[ERREUR] public/index.html introuvable."
              )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          preload_path.parent.mkdir(parents=True,exist_ok=True)
          map_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          preload_path.write_text(
              PRELOAD_JS+"\n",
              encoding="utf-8"
          )
          final_path.write_text(
              FINAL_JS+"\n",
              encoding="utf-8"
          )
          
          # ------------------------------------------------------------
          # 1. Crée une table compacte route -> images probables.
          # ------------------------------------------------------------
          
          extensions={
              ".png",".jpg",".jpeg",".webp",
              ".gif",".svg",".avif"
          }
          
          priority_words=(
              "portrait","character","characters",
              "style","styles","costume","costumes",
              "card","banner","thumb"
          )
          
          candidates=[]
          
          for path in public.rglob("*"):
              if (
                  not path.is_file() or
                  path.suffix.lower() not in extensions
              ):
                  continue
          
              relative=path.relative_to(public).as_posix()
              lowered=relative.lower()
          
              if not any(word in lowered for word in priority_words):
                  continue
          
              try:
                  size=path.stat().st_size
              except OSError:
                  continue
          
              if size>8_000_000:
                  continue
          
              candidates.append((relative,size))
          
          def normalize(value):
              value=unicodedata.normalize("NFD",value)
              value="".join(
                  char for char in value
                  if unicodedata.category(char)!="Mn"
              )
              return value.lower()
          
          def path_priority(item):
              relative,size=item
              value=relative.lower()
          
              if "portrait" in value:
                  group=0
              elif "style" in value or "character" in value:
                  group=1
              elif "costume" in value:
                  group=2
              else:
                  group=3
          
              return (group,size,relative)
          
          candidates.sort(key=path_priority)
          
          ignored={
              "assets","asset","images","image",
              "public","character","characters",
              "costume","costumes","style","styles",
              "portrait","portraits","card","cards",
              "banner","banners","thumb","thumbnail",
              "original","hero","heroes","villain",
              "attaque","attack","assault","rapid",
              "technical","technique","support",
              "png","jpg","jpeg","webp","svg","avif"
          }
          
          mapping={}
          
          for relative,_size in candidates:
              tokens=[
                  token for token in
                  re.split(r"[^a-z0-9]+",normalize(relative))
                  if len(token)>=3 and token not in ignored
              ]
          
              for token in tokens:
                  bucket=mapping.setdefault(token,[])
          
                  url="/"+relative
          
                  if url not in bucket and len(bucket)<12:
                      bucket.append(url)
          
          # Retire les clés sans intérêt qui n'apportent qu'une seule image générique.
          mapping={
              key:value
              for key,value in mapping.items()
              if value
          }
          
          map_path.write_text(
              "window.MHUR_V633_ROUTE_IMAGES="
              +json.dumps(
                  mapping,
                  ensure_ascii=False,
                  separators=(",",":")
              )
              +";\n",
              encoding="utf-8",
          )
          
          # ------------------------------------------------------------
          # 2. Déplace toutes les feuilles CSS dans le head.
          #
          # Les CSS placés près de la fin du body étaient responsables du rendu
          # provisoire sans les derniers correctifs. L'ordre original est conservé.
          # ------------------------------------------------------------
          
          html=index_path.read_text(encoding="utf-8")
          
          # Nettoie V630, V631, V632 et une ancienne installation V633.
          patterns=[
              r'\s*<script id=["\']mhur-v630-boot-start["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v630-boot-critical["\']>'
              r'.*?</style>\s*',
          
              r'\s*<script id=["\']mhur-v631-remove-v630-immediately["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v631-remove-v630-critical["\']>'
              r'.*?</style>\s*',
          
              r'\s*<script id=["\']mhur-v632-stop-reload-loop["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v632-stop-reload-loop-css["\']>'
              r'.*?</style>\s*',
          
              r'\s*<script id=["\']mhur-v633-final-first-frame-start["\']>'
              r'.*?</script>\s*',
              r'\s*<style id=["\']mhur-v633-final-first-frame-critical["\']>'
              r'.*?</style>\s*',
          
              r'\s*<!-- V63[0-3][^>]*-->\s*'
              r'<(?:script|link)[^>]+v63[0-3]-[^>]+>'
              r'(?:\s*</script>)?\s*',
          
              r'\s*<(?:script|link)[^>]+v63[0-3]-[^>]+>'
              r'(?:\s*</script>)?\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(
                  pattern,
                  "\n",
                  html,
                  flags=re.I|re.S
              )
          
          # Supprime les meta qui interdisaient tout cache du document.
          html=re.sub(
              r'\s*<meta\s+http-equiv=["\']'
              r'(?:Cache-Control|Pragma|Expires)'
              r'["\'][^>]*>\s*',
              "\n",
              html,
              flags=re.I
          )
          
          stylesheet_pattern=(
              r'<link\b(?=[^>]*\brel=["\'][^"\']*'
              r'stylesheet[^"\']*["\'])[^>]*>'
          )
          
          stylesheet_tags=re.findall(
              stylesheet_pattern,
              html,
              flags=re.I
          )
          
          # Retire toutes les feuilles de leur ancien emplacement.
          html=re.sub(
              stylesheet_pattern,
              "",
              html,
              flags=re.I
          )
          
          # Déduplication stricte en conservant le dernier ordre de cascade original.
          ordered=[]
          seen=set()
          
          for tag in stylesheet_tags:
              href_match=re.search(
                  r'\bhref=["\']([^"\']+)["\']',
                  tag,
                  flags=re.I
              )
          
              key=(
                  href_match.group(1)
                  if href_match
                  else tag
              )
          
              if key in seen:
                  continue
          
              seen.add(key)
              ordered.append(tag.strip())
          
          head_start=re.search(r'<head[^>]*>',html,flags=re.I)
          
          if not head_start:
              raise SystemExit(
                  "[ERREUR] Balise <head> introuvable."
              )
          
          # La protection est le premier élément après <head>.
          position=head_start.end()
          html=(
              html[:position]
              +"\n"
              +CRITICAL
              +"\n"
              +html[position:]
          )
          
          head_ends=list(
              re.finditer(r'</head\s*>',html,flags=re.I)
          )
          
          if not head_ends:
              raise SystemExit(
                  "[ERREUR] Balise </head> introuvable."
              )
          
          position=head_ends[-1].start()
          
          head_assets=(
              "\n<!-- V633 : toutes les feuilles CSS avant le premier rendu. -->\n"
              +"\n".join(ordered)
              +"\n"
              '<link rel="stylesheet" '
              'href="css/v633-final-first-frame.css?v=633">\n'
              '<script src="data/v633-route-images.js?v=633"></script>\n'
              '<script src="js/v633-route-image-preload.js?v=633"></script>\n'
          )
          
          html=html[:position]+head_assets+html[position:]
          
          # Le contrôleur final doit s'exécuter après tous les anciens scripts.
          body_ends=list(
              re.finditer(r'</body\s*>',html,flags=re.I)
          )
          
          if not body_ends:
              raise SystemExit(
                  "[ERREUR] Balise </body> introuvable."
              )
          
          position=body_ends[-1].start()
          
          final_tag=(
              '\n<!-- V633 : révélation après le rendu final. -->\n'
              '<script src="js/v633-final-first-frame.js?v=633">'
              '</script>\n'
          )
          
          html=html[:position]+final_tag+html[position:]
          
          # Les images déjà présentes dans le HTML ne doivent pas être lazy.
          html=re.sub(
              r'<img\b([^>]*?)\sloading=["\']lazy["\']([^>]*)>',
              r'<img\1 loading="eager" decoding="async"\2>',
              html,
              flags=re.I,
          )
          
          index_path.write_text(
              html,
              encoding="utf-8"
          )
          
          # ------------------------------------------------------------
          # 3. Cache HTTP normal, sans Service Worker.
          # ------------------------------------------------------------
          
          existing=(
              headers_path.read_text(encoding="utf-8")
              if headers_path.is_file()
              else ""
          )
          
          existing=re.sub(
              r'\n?# MHUR V63[0-3].*?'
              r'# MHUR V63[0-3].*?END\n?',
              "\n",
              existing,
              flags=re.S,
          ).strip()
          
          headers_path.write_text(
              (
                  existing+"\n\n"
                  if existing
                  else ""
              )
              +HEADERS_BLOCK
              +"\n",
              encoding="utf-8"
          )
          
          # Supprime définitivement les fichiers des versions problématiques.
          obsolete_files=[
              "css/v630-atomic-render.css",
              "js/v630-atomic-render.js",
              "data/v630-image-index.js",
              "sw-v630.js",
          
              "css/v631-remove-v630-loader.css",
              "js/v631-remove-v630-loader.js",
              "sw-v631-cleanup.js",
          
              "css/v632-stop-reload-loop.css",
              "js/v632-stop-reload-loop.js",
          ]
          
          for relative in obsolete_files:
              path=public/relative
          
              if path.is_file():
                  path.unlink()
          
          for filename in [
              "RAPPORT_V630_RENDU_ATOMIQUE.txt",
              "RAPPORT_V631_SUPPRESSION_LOADER_V630.txt",
              "RAPPORT_V632_ARRET_RECHARGEMENT_INFINI.txt",
          ]:
              path=root/filename
          
              if path.is_file():
                  path.unlink()
          
          report_path.write_text(
              """MHUR NEXUS — V633
          
          OBJECTIF
          Afficher directement le rendu final sans le grand logo V630, sans boucle
          de rechargement et sans Service Worker.
          
          RENDU FINAL DIRECT
          - Toutes les balises <link rel="stylesheet"> sont déplacées dans le head.
          - Leur ordre original est conservé pour préserver la cascade.
          - Le navigateur reçoit donc les derniers correctifs CSS avant son premier rendu.
          - L'interface provisoire reste invisible sur le fond normal du site.
          - Après stabilisation du DOM et décodage des images visibles, le contenu final
            est révélé en une seule fois.
          - Aucun logo, texte ou animation de chargement n'est affiché.
          - Un délai de sécurité strict empêche la page de rester cachée.
          
          IMAGES
          - Une table route -> images est produite automatiquement.
          - Les portraits, styles et costumes liés à l'URL commencent à être téléchargés
            depuis le head, avant la création des cartes.
          - Les premières images sont en eager et priorité élevée.
          - Les images déjà récupérées utilisent le cache HTTP normal.
          - Aucun Service Worker n'est installé.
          
          IMPORTANT
          Un fichier jamais reçu par le navigateur doit forcément être téléchargé une
          première fois. V633 empêche de voir le rendu incomplet et accélère ce premier
          téléchargement ; les visites suivantes profitent du cache HTTP.
          
          SÉCURITÉ
          - Aucun serviceWorker.register().
          - Aucun location.reload().
          - Nettoyage passif des anciens workers V630/V631.
          - Suppression complète des fichiers V630/V631/V632.
          """,
              encoding="utf-8",
          )
          
          print(
              f"[OK] V633 appliqué : "
              f"{len(ordered)} feuilles CSS déplacées, "
              f"{len(mapping)} clés images préparées."
          )
          PY
          
          cat > /tmp/verifier_v633.py <<'PY'
          from pathlib import Path
          import json
          import re
          
          index=Path("public/index.html").read_text(
              encoding="utf-8"
          )
          css=Path(
              "public/css/v633-final-first-frame.css"
          ).read_text(encoding="utf-8")
          preload=Path(
              "public/js/v633-route-image-preload.js"
          ).read_text(encoding="utf-8")
          final=Path(
              "public/js/v633-final-first-frame.js"
          ).read_text(encoding="utf-8")
          mapping_source=Path(
              "public/data/v633-route-images.js"
          ).read_text(encoding="utf-8")
          
          for reference in [
              'id="mhur-v633-final-first-frame-start"',
              'id="mhur-v633-final-first-frame-critical"',
              "css/v633-final-first-frame.css?v=633",
              "data/v633-route-images.js?v=633",
              "js/v633-route-image-preload.js?v=633",
              "js/v633-final-first-frame.js?v=633",
          ]:
              if index.count(reference)!=1:
                  raise SystemExit(
                      f"[ERREUR] Référence V633 absente ou dupliquée : {reference}"
                  )
          
          head_end=index.lower().find("</head>")
          body_start=index.lower().find("<body")
          
          if head_end<0 or body_start<0:
              raise SystemExit(
                  "[ERREUR] Structure HTML invalide."
              )
          
          # Aucune feuille CSS ne doit rester dans le body.
          body=index[body_start:]
          
          if re.search(
              r'<link\\b(?=[^>]*\\brel=["\\'][^"\\']*'
              r'stylesheet[^"\\']*["\\'])[^>]*>',
              body,
              flags=re.I
          ):
              raise SystemExit(
                  "[ERREUR] Une feuille CSS reste chargée après le début du body."
              )
          
          critical_position=index.index(
              'id="mhur-v633-final-first-frame-start"'
          )
          
          title_position=index.lower().find("<title")
          
          if title_position!=-1 and critical_position>title_position:
              raise SystemExit(
                  "[ERREUR] La protection V633 est installée trop tard."
              )
          
          for old in [
              "v630-atomic-render",
              "v631-remove-v630-loader",
              "v632-stop-reload-loop",
          ]:
              if old in index:
                  raise SystemExit(
                      f"[ERREUR] Ancienne version encore chargée : {old}"
                  )
          
          for source in [preload,final]:
              if "serviceWorker.register" in source:
                  raise SystemExit(
                      "[ERREUR] V633 ne doit enregistrer aucun Service Worker."
                  )
          
              if "location.reload" in source:
                  raise SystemExit(
                      "[ERREUR] V633 ne doit recharger aucune page."
                  )
          
          for token in [
              "mhurV633Preparing",
              "mhurV633RoutePreparing",
          ]:
              if token not in index and token not in css:
                  raise SystemExit(
                      f"[ERREUR] Protection CSS incomplète : {token}"
                  )
          
          for token in [
              "waitStyles",
              "visibleImages",
              "waitQuiet",
              "setTimeout(revealInitial",
          ]:
              if token not in final:
                  raise SystemExit(
                      f"[ERREUR] Contrôleur final incomplet : {token}"
                  )
          
          prefix="window.MHUR_V633_ROUTE_IMAGES="
          
          if not mapping_source.startswith(prefix):
              raise SystemExit(
                  "[ERREUR] Table images V633 invalide."
              )
          
          payload=mapping_source[len(prefix):].strip().rstrip(";")
          mapping=json.loads(payload)
          
          if not isinstance(mapping,dict):
              raise SystemExit(
                  "[ERREUR] Table images V633 non valide."
              )
          
          for path in [
              Path("public/sw-v630.js"),
              Path("public/sw-v631-cleanup.js"),
          ]:
              if path.exists():
                  raise SystemExit(
                      f"[ERREUR] Ancien Service Worker présent : {path}"
                  )
          
          print(
              f"[OK] Contrôles V633B validés : "
              f"{len(mapping)} clés images."
          )
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v633.py
          
            node --check public/js/v633-route-image-preload.js
            node --check public/js/v633-final-first-frame.js
          
            python3 /tmp/verifier_v633.py
          
            git add -A
          
            if git diff --cached --quiet; then
              echo "[INFO] V633 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "perf: rendu final direct corrigé V633B"
          
            if git push origin HEAD:main; then
              echo "[OK] V633B envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V633B après cinq tentatives."
          exit 1
