name: MHUR - INSTALLATEUR CORRECTIFS NEXUS V22

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: install
        type: choice
        options:
          - install
          - verify

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: mhur-nexus-v22-installer
  cancel-in-progress: false

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'install'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurer Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Appliquer les correctifs permanents V22
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          MARK_HOME = "MHUR_V22_LOGIN_FIX"
          MARK_RUNTIME = "MHUR_V22_RUNTIME_SYNC"
          MARK_GENERATOR = "MHUR_V22_GENERATOR_SPLIT"

          def read(path):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"[V22][ERREUR] Fichier introuvable : {path}")
              return p, p.read_text(encoding="utf-8")

          def save(p, text):
              p.write_text(text, encoding="utf-8", newline="\n")

          def replace_once(text, old, new, label, required=True):
              if new in text:
                  print(f"[V22][OK] {label} déjà présent")
                  return text
              if old not in text:
                  if required:
                      raise SystemExit(f"[V22][ERREUR] Bloc introuvable : {label}")
                  print(f"[V22][INFO] Bloc absent : {label}")
                  return text
              print(f"[V22][PATCH] {label}")
              return text.replace(old, new, 1)

          # ============================================================
          # 1) LOGIN BONUS : update_home_data.py
          # ============================================================
          p, t = read("mise_a_jour/outils/update_home_data.py")

          if MARK_HOME not in t and "force=True" not in t:
              t = replace_once(
                  t,
                  "def download_asset(root: Path, url: str, rel_stem: str, retries: int = 4) -> str:\n",
                  "def download_asset(root: Path, url: str, rel_stem: str, retries: int = 4, force: bool = False) -> str:\n"
                  f"    # {MARK_HOME}: autorise le remplacement d'un ancien cache.\n",
                  "Home : paramètre force",
              )
              t = replace_once(
                  t,
                  "    cached = existing_asset(root, rel_stem)\n"
                  "    if cached:\n"
                  "        return cached\n",
                  "    cached = existing_asset(root, rel_stem)\n"
                  "    if cached and not force:\n"
                  "        return cached\n",
                  "Home : ne plus figer une ancienne image",
              )
              t = replace_once(
                  t,
                  '        print(f"[HOME IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  '        return ""\n',
                  '        print(f"[HOME IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  '        return cached or ""\n',
                  "Home : ancien cache seulement en secours",
              )
              old_call = (
                  "            local = download_asset(\n"
                  "                root,\n"
                  "                remote,\n"
                  '                f"assets/home/bonuses/{slug(title, 70)}",\n'
                  "            )\n"
              )
              new_call = (
                  "            local = download_asset(\n"
                  "                root,\n"
                  "                remote,\n"
                  '                f"assets/home/bonuses/{slug(title, 70)}",\n'
                  "                force=True,\n"
                  "            )\n"
              )
              t = replace_once(
                  t, old_call, new_call,
                  "Home : retélécharger les images Login Bonus",
              )
              save(p, t)
          else:
              print("[V22][OK] update_home_data.py déjà compatible refresh")

          # ============================================================
          # 2) LOGIN BONUS : season18_postprocess.py
          # ============================================================
          p, t = read("mise_a_jour/outils/season18_postprocess.py")

          if "def download_image(session: requests.Session, root: Path, url: str, rel_base: str, force: bool = False)" not in t:
              t = replace_once(
                  t,
                  "def download_image(session: requests.Session, root: Path, url: str, rel_base: str) -> str:\n",
                  "def download_image(session: requests.Session, root: Path, url: str, rel_base: str, force: bool = False) -> str:\n"
                  f"    # {MARK_HOME}: refresh forcé des Login Bonus.\n",
                  "S18 : paramètre force",
              )
              t = replace_once(
                  t,
                  '    if os.environ.get("MHUR_IMAGE_POLICY_V585") == "limited":\n',
                  '    if os.environ.get("MHUR_IMAGE_POLICY_V585") == "limited" and not force:\n',
                  "S18 : la policy limited n'empêche plus le refresh forcé",
              )
              t = replace_once(
                  t,
                  "    if dst.exists() and dst.stat().st_size > 500:\n"
                  "        return rel.as_posix()\n",
                  "    cached_rel = rel.as_posix() if dst.exists() and dst.stat().st_size > 500 else \"\"\n"
                  "    if cached_rel and not force:\n"
                  "        return cached_rel\n",
                  "S18 : cache conditionnel",
              )
              t = replace_once(
                  t,
                  '        print(f"[S18 IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  '        return ""\n',
                  '        print(f"[S18 IMAGE WARNING] {url}: {exc}", flush=True)\n'
                  '        return cached_rel\n',
                  "S18 : cache en secours",
              )
              t = replace_once(
                  t,
                  '        local = download_image(session, root, src, f"assets/home/bonuses/s18_{norm(en)[:64]}")\n',
                  '        local = download_image(session, root, src, f"assets/home/bonuses/s18_{norm(en)[:64]}", force=True)\n',
                  "S18 : rafraîchir la vraie image de la campagne",
              )
              save(p, t)
          else:
              print("[V22][OK] season18_postprocess.py refresh images déjà installé")

          # ============================================================
          # 3) GÉNÉRATEUR DES NOUVEAUX HÉROS
          #    On sépare les additional_values par Type / redémarrage Lv.1.
          # ============================================================
          p, t = read("mise_a_jour/outils/update_ultrarumble_data.py")

          if "def v22_split_additional_tables(" not in t and "def v20_split_additional_tables(" not in t:
              anchor = (
                  "def local_table(title: str, table: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n"
                  "    if not isinstance(table, dict) or not table.get(\"rows\"):\n"
                  "        return None\n"
                  "    return {\"title\": title, \"cols\": table.get(\"columns\", []), \"rows\": table.get(\"rows\", [])}\n"
                  "\n"
              )
              if anchor not in t:
                  raise SystemExit("[V22][ERREUR] local_table introuvable dans update_ultrarumble_data.py")

              helper = r'''
          # MHUR_V22_GENERATOR_SPLIT
          def v22_split_additional_tables(sym: str, table: Dict[str, Any]) -> List[Dict[str, Any]]:
              if not isinstance(table, dict):
                  return []
              cols = [clean(x) for x in (table.get("columns") or [])]
              rows = [list(x) for x in (table.get("rows") or []) if isinstance(x, (list, tuple))]
              if not rows:
                  return []

              ncols = [norm(x) for x in cols]

              def idx(*names: str, default: int = -1) -> int:
                  wanted = {norm(x) for x in names}
                  for i, value in enumerate(ncols):
                      if value in wanted:
                          return i
                  return default

              ti = idx("Type", default=0)
              li = idx("Level", "Niveau", default=1)
              di = idx("Damage", "Dégâts", "Degats", default=2)
              if di < 0:
                  return []

              groups: List[Dict[str, Any]] = []
              current: Optional[Dict[str, Any]] = None
              last_type = "Valeur"

              for source in rows:
                  row = [clean(x) for x in source]
                  if li >= len(row) or di >= len(row):
                      continue
                  level = row[li]
                  if not re.match(r"^Lv\.\d+$", level, re.I):
                      continue

                  raw_type = row[ti] if 0 <= ti < len(row) else ""
                  if raw_type:
                      last_type = raw_type
                  raw_type = raw_type or last_type
                  key = norm(raw_type) or "value"

                  restart = level.lower() == "lv.1" and current is not None and bool(current["rows"])
                  changed = current is not None and current["key"] != key

                  if current is None or restart or changed:
                      current = {"key": key, "label": raw_type or "Valeur", "rows": []}
                      groups.append(current)

                  current["rows"].append([raw_type or "Valeur", level, row[di]])

              counts: Dict[str, int] = {}
              for group in groups:
                  counts[group["key"]] = counts.get(group["key"], 0) + 1

              seen: Dict[str, int] = {}
              output: List[Dict[str, Any]] = []
              for group in groups:
                  seen[group["key"]] = seen.get(group["key"], 0) + 1
                  label = group["label"]
                  if counts[group["key"]] > 1:
                      label = f"{label} ({seen[group['key']]})"
                  output.append({
                      "title": f"Dégâts {sym} — {label}",
                      "cols": ["Type", "Niveau", "Dégâts"],
                      "rows": [[label, row[1], row[2]] for row in group["rows"]],
                  })
              return output

          '''
              t = t.replace(anchor, anchor + helper + "\n", 1)

              old = (
                  "        tables = []\n"
                  '        for title, key in ((f"Effets de montée {sym}", "level_up_effects"),\n'
                  '                           (f"Valeurs {sym}", "base_values"),\n'
                  '                           (f"Valeurs supplémentaires {sym}", "additional_values")):\n'
                  "            tb = local_table(title, remote.get(key) or {})\n"
                  "            if tb:\n"
                  "                tables.append(tb)\n"
              )
              new = (
                  "        tables = []\n"
                  '        for title, key in ((f"Effets de montée {sym}", "level_up_effects"),\n'
                  '                           (f"Valeurs {sym}", "base_values")):\n'
                  "            tb = local_table(title, remote.get(key) or {})\n"
                  "            if tb:\n"
                  "                tables.append(tb)\n"
                  '        tables.extend(v22_split_additional_tables(sym, remote.get("additional_values") or {}))\n'
              )
              t = replace_once(
                  t, old, new,
                  "Générateur : séparer les dégâts supplémentaires",
              )
              save(p, t)
          else:
              print("[V22][OK] séparateur générateur déjà présent")

          # ============================================================
          # 4) VRAI FRONTEND ACTUEL : public/js/season18-fixes.js
          #    IMPORTANT : on ne cherche PLUS hasBaseColumns dans index.html.
          # ============================================================
          p, t = read("public/js/season18-fixes.js")

          if MARK_RUNTIME not in t:
              anchor = "function levelRows(values){ return values.map((v,i)=>[`Lv.${i+1}`,...v]); }\n"
              if anchor not in t:
                  raise SystemExit("[V22][ERREUR] levelRows introuvable dans season18-fixes.js")

              helper = r'''
          /* MHUR_V22_RUNTIME_SYNC
             - recharge les tableaux de dégâts depuis les données exactes UltraRumble
             - sépare toute table Type/Niveau/Dégâts en sous-tableaux
             - fonctionne pour Hawks, Gentle et les prochains héros
          */
          function v22TypeFr(value){
            const raw=clean(value);
            const n=norm(raw);
            const rules=[
              [['melee_combat','melee'],'Corps à corps'],
              [['activation'],'Activation'],
              [['shockwave'],'Onde de choc'],
              [['bullet','projectile'],'Projectile'],
              [['rush'],'Ruée'],
              [['rebound','bounce'],'Rebond'],
              [['impact'],'Impact'],
              [['explosion'],'Explosion'],
              [['area'],'Zone'],
              [['charge'],'Charge'],
              [['pull','grab'],'Attraction']
            ];
            for(const [needles,label] of rules){
              if(needles.some(x=>n.includes(x))) return label;
            }
            return raw||'Valeur';
          }

          function v22ColsFr(cols){
            const map={
              level:'Niveau',
              damage:'Dégâts',
              ammo:'Munitions',
              use_ammo:'Consommation',
              reload:'Recharge',
              type:'Type',
              level_up_effect:'Effet de montée',
              down_power:'Down Power'
            };
            return (cols||[]).map(col=>map[norm(col)]||clean(col));
          }

          function v22RowsFr(cols,rows){
            const typeIndex=(cols||[]).findIndex(col=>norm(col)==='type');
            return (rows||[]).map(source=>{
              const row=[...(source||[])].map(clean);
              if(typeIndex>=0&&typeIndex<row.length) row[typeIndex]=v22TypeFr(row[typeIndex]);
              return row;
            });
          }

          function v22RemoteTable(sym,kind,source){
            const columns=Array.isArray(source?.columns)?source.columns.map(clean):[];
            const rows=Array.isArray(source?.rows)?source.rows.map(row=>[...(row||[])].map(clean)):[];
            if(!rows.length) return null;

            const title={
              level:{
                fr:`Effets de montée ${sym}`,
                en:`${sym} level-up effects`
              },
              base:{
                fr:`Valeurs de base ${sym}`,
                en:`Base ${sym} values`
              },
              additional:{
                fr:`Dégâts ${sym} supplémentaires`,
                en:`Additional ${sym} damage`
              }
            }[kind];

            return {
              title,
              cols:{fr:v22ColsFr(columns),en:columns},
              rows:{fr:v22RowsFr(columns,rows),en:rows}
            };
          }

          function v22TableKind(table){
            const title=norm(clean(table?.title));
            const colsFr=Array.isArray(table?.cols?.fr)?table.cols.fr:
              Array.isArray(table?.cols)?table.cols:
              Array.isArray(table?.columns?.fr)?table.columns.fr:
              Array.isArray(table?.columns)?table.columns:[];
            const nc=colsFr.map(norm);

            if(nc.includes('type')) return 'additional';
            if(title.includes('supplement')||title.includes('additional')) return 'additional';
            if(title.includes('effet')||title.includes('effect')||nc.includes('level_up_effect')) return 'level';
            if(nc.includes('damage')||nc.includes('degats')||nc.includes('ammo')||nc.includes('munitions')) return 'base';
            return 'other';
          }

          function v22SkillFor(st,sym){
            const aliases={
              'α':['α','alpha','a'],
              'β':['β','beta','b'],
              'γ':['γ','gamma','g']
            }[sym]||[sym];
            return (st?.skills||[]).find(skill=>{
              const raw=String(skill?.letter||'').trim().toLowerCase();
              return aliases.includes(raw);
            })||null;
          }

          function syncExactTablesV22(){
            if(typeof styles==='undefined') return;
            Object.keys(styles).forEach(styleId=>{
              const st=styles[styleId];
              const row=remoteRowForStyle(styleId);
              if(!st||!row?.skills) return;

              for(const sym of ['α','β','γ']){
                const local=v22SkillFor(st,sym);
                const remote=row.skills?.[sym];
                if(!local||!remote) continue;

                let localTables=Array.isArray(local.tables)?local.tables.slice():[];

                const sources=[
                  ['level',remote.level_up_effects],
                  ['base',remote.base_values],
                  ['additional',remote.additional_values]
                ];

                for(const [kind,source] of sources){
                  if(!Array.isArray(source?.rows)||!source.rows.length) continue;
                  localTables=localTables.filter(table=>v22TableKind(table)!==kind);
                  const built=v22RemoteTable(sym,kind,source);
                  if(built) localTables.push(built);
                }

                local.tables=localTables;
              }
            });
          }

          function v22SplitOneTable(table){
            const tb=filterDownPower(table);
            const cols=tb.cols||[];
            const rows=tb.rows||[];
            const typeIndex=cols.findIndex(col=>norm(col)==='type');
            const levelIndex=cols.findIndex(col=>['level','niveau'].includes(norm(col)));

            if(typeIndex<0||levelIndex<0||rows.length<2) return [tb];

            const groups=[];
            let current=null;
            let lastLabel='Valeur';

            rows.forEach(source=>{
              const row=[...(source||[])];
              const level=clean(row[levelIndex]);
              let label=clean(row[typeIndex]);
              if(label) lastLabel=label;
              label=label||lastLabel||'Valeur';
              const key=norm(label)||'value';

              const restart=/^lv\.1$/i.test(level)&&current&&current.rows.length;
              const changed=current&&current.key!==key;

              if(!current||restart||changed){
                current={key,label,rows:[]};
                groups.push(current);
              }
              current.rows.push(row);
            });

            if(groups.length<=1) return [tb];

            const counts={};
            groups.forEach(g=>{counts[g.key]=(counts[g.key]||0)+1});
            const seen={};

            return groups.map(group=>{
              seen[group.key]=(seen[group.key]||0)+1;
              let label=group.label;
              if(counts[group.key]>1) label+=` (${seen[group.key]})`;
              return {
                title:`${tb.title} — ${label}`,
                cols:tb.cols,
                rows:group.rows.map(row=>{
                  const copy=[...row];
                  copy[typeIndex]=label;
                  return copy;
                })
              };
            });
          }

          function tablesV22(list){
            const tablesList=(Array.isArray(list)?list:[])
              .flatMap(v22SplitOneTable)
              .filter(tb=>tb.cols.length&&tb.rows.length);

            const ordered=[...tablesList].sort(
              (a,b)=>(/effets|effects/i.test(a.title)?1:0)-(/effets|effects/i.test(b.title)?1:0)
            );

            return `<div class="tables">${ordered.map(tb=>`<button class="toggle" type="button" onclick="this.nextElementSibling.classList.toggle('hidden')"><span class="statsToggleTitle">${esc(tb.title)}</span><span class="statsToggleArrow">▾</span></button><div class="simpleTable hidden"><table class="dataTable"><thead><tr>${tb.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
          }

          '''
              t = t.replace(anchor, anchor + helper + "\n", 1)

              old_binding = "if(typeof tables==='function'){ window.tables=tablesV9; try{tables=tablesV9}catch(_e){} }\n"
              new_binding = "if(typeof tables==='function'){ window.tables=tablesV22; try{tables=tablesV22}catch(_e){} }\n"
              t = replace_once(
                  t, old_binding, new_binding,
                  "Frontend : utiliser le moteur de tableaux V22",
              )

              old_apply = (
                  "function applyAll(){\n"
                  "  applyOfficialPortraits();\n"
                  "  patchGentle();\n"
                  "  dedupeAll();\n"
                  "  installRenders();\n"
                  "}\n"
              )
              new_apply = (
                  "function applyAll(){\n"
                  "  applyOfficialPortraits();\n"
                  "  patchGentle();\n"
                  "  syncExactTablesV22();\n"
                  "  dedupeAll();\n"
                  "  installRenders();\n"
                  "}\n"
              )
              t = replace_once(
                  t, old_apply, new_apply,
                  "Frontend : synchroniser les dégâts exacts après Gentle",
              )

              save(p, t)
          else:
              print("[V22][OK] frontend runtime V22 déjà installé")

          # ============================================================
          # 5) GUARDIAN V19
          #    - cron cohérent
          #    - ancien repair_login_bonuses_v17 neutralisé
          # ============================================================
          workflow = Path(".github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml")
          if not workflow.exists():
              raise SystemExit("[V22][ERREUR] Guardian V19 introuvable")

          wt = workflow.read_text(encoding="utf-8")

          if 'cron: "1 * * * *"' in wt:
              wt = wt.replace('cron: "1 * * * *"', 'cron: "11 * * * *"', 1)
              print("[V22][PATCH] Guardian : cron 1 -> 11")
          elif 'cron: "11 * * * *"' in wt:
              print("[V22][OK] Guardian : cron 11")
          else:
              print("[V22][AVERTISSEMENT] cron principal non reconnu")

          repair_pattern = (
              r"(?m)^(?P<i>\s*)python\s+/tmp/repair_login_bonuses_v17\.py\s*\\\s*\n"
              r"(?P=i)\s*--site-root\s+public\s*$"
          )

          matches = list(re.finditer(repair_pattern, wt))
          if matches:
              def repl(m):
                  i=m.group("i")
                  return (
                      f"{i}python mise_a_jour/outils/season18_postprocess.py \\\\\n"
                      f"{i}  --site-root public --phase home"
                  )
              wt = re.sub(repair_pattern, repl, wt)
              print(f"[V22][PATCH] Guardian : {len(matches)} ancien(s) réparateur(s) Login remplacé(s)")
          elif "--site-root public --phase home" in wt:
              print("[V22][OK] Guardian : réparateur Login moderne déjà utilisé")
          else:
              print("[V22][AVERTISSEMENT] ancien repair Login non trouvé")

          workflow.write_text(wt, encoding="utf-8", newline="\n")

          print("[V22][OK] Tous les correctifs permanents sont écrits.")
          PY

      - name: Vérifier Python et JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            mise_a_jour/outils/update_home_data.py \
            mise_a_jour/outils/season18_postprocess.py \
            mise_a_jour/outils/update_ultrarumble_data.py

          node --check public/js/season18-fixes.js

          python - <<'PY'
          from pathlib import Path

          checks = [
              (
                  "Login Bonus Home refresh",
                  "force=True",
                  "mise_a_jour/outils/update_home_data.py",
              ),
              (
                  "Login Bonus S18 refresh",
                  "force=True",
                  "mise_a_jour/outils/season18_postprocess.py",
              ),
              (
                  "Runtime dégâts exacts",
                  "syncExactTablesV22",
                  "public/js/season18-fixes.js",
              ),
              (
                  "Runtime séparation tableaux",
                  "tablesV22",
                  "public/js/season18-fixes.js",
              ),
              (
                  "Mapping Hawks Melee",
                  "Corps à corps",
                  "public/js/season18-fixes.js",
              ),
              (
                  "Cron Guardian",
                  'cron: "11 * * * *"',
                  ".github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml",
              ),
          ]

          failed=[]
          for name,needle,filename in checks:
              text=Path(filename).read_text(encoding="utf-8")
              ok=needle in text
              print(("[OK] " if ok else "[ECHEC] ")+name)
              if not ok:
                  failed.append(name)

          if failed:
              raise SystemExit("[V22][ERREUR] Vérification : "+", ".join(failed))
          PY

      - name: Commit des correctifs V22 sur main
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git add \
            mise_a_jour/outils/update_home_data.py \
            mise_a_jour/outils/season18_postprocess.py \
            mise_a_jour/outils/update_ultrarumble_data.py \
            public/js/season18-fixes.js \
            .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[V22] Aucun changement supplémentaire."
            exit 0
          fi

          git commit -m "fix: V22 login bonus et synchronisation degats"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Relancer le Guardian V19 corrigé
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run \
            mhur-mise-a-jour-guardian-officielle-v19.yml \
            --ref main \
            -f mode=scan

          echo "✅ V19 corrigé relancé en scan."

      - name: Discord - V22 installé
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          python - <<'PY' > /tmp/v22-ok.json
          import json
          print(json.dumps({
              "content": (
                  "✅ **MHUR NEXUS — V22 INSTALLÉ**\n\n"
                  "• Login Bonus : cache d'images corrigé\n"
                  "• Hawks et anciens héros : dégâts rechargés depuis les données exactes UltraRumble\n"
                  "• Gentle Criminal : dégâts supplémentaires séparés par type\n"
                  "• Futurs héros : séparation automatique des tableaux Type/Niveau/Dégâts\n"
                  "• Guardian V19 : ancien réparateur Login remplacé + cron corrigé\n\n"
                  "🔄 Le Guardian V19 corrigé vient d'être relancé en scan."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/v22-ok.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null

      - name: Discord - diagnostic V22 si erreur
        if: failure()
        shell: bash
        run: |
          set +e

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error::V22 bloqué : ${run_url}"

          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            exit 0
          fi

          python - "$run_url" <<'PY' > /tmp/v22-error.json
          import json
          import sys

          url=sys.argv[1]
          print(json.dumps({
              "content": (
                  "❌ **MHUR NEXUS — V22 BLOQUÉ**\n\n"
                  "Une étape a échoué avant la publication complète.\n"
                  f"🔎 **Run :** {url}\n\n"
                  "Ouvre l'étape rouge : le message `[V22][ERREUR]` indique exactement "
                  "le fichier ou le bloc responsable."
              )
          }, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/v22-error.json \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            >/dev/null || true

  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Vérifier V22
        shell: bash
        run: |
          set -euo pipefail

          grep -q "syncExactTablesV22" public/js/season18-fixes.js
          grep -q "tablesV22" public/js/season18-fixes.js
          grep -q "Corps à corps" public/js/season18-fixes.js
          grep -q "force=True" mise_a_jour/outils/update_home_data.py
          grep -q "force=True" mise_a_jour/outils/season18_postprocess.py
          grep -q 'cron: "11 \* \* \* \*"' .github/workflows/mhur-mise-a-jour-guardian-officielle-v19.yml

          node --check public/js/season18-fixes.js

          echo "✅ V22 est bien installé."
