name: MHUR V599 - portrait Armored All Might

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v599-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v599-armored-portrait
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer Pillow et Node.js
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          node --version

      - name: Installer V599
        shell: bash
        run: |
          cat > /tmp/appliquer_v599.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json
          import os
          import re
          import shutil
          import subprocess
          import unicodedata

          ROOT=Path.cwd()
          PUBLIC=ROOT/"public"
          ASSETS=PUBLIC/"assets"
          TARGET_DIR=(
              ASSETS/
              "armored_all_might"/
              "armored_all_might_technical"
          )
          TARGET=TARGET_DIR/"portrait.webp"
          INDEX=PUBLIC/"index.html"
          JS=PUBLIC/"js/v599-armored-portrait.js"
          REPORT=ROOT/"RAPPORT_V599_PORTRAIT_ARMORED.txt"

          JS_CONTENT="\n/* MHUR Nexus — V599 : portrait Armored All Might valide et sans cache */\n(function(){\n  'use strict';\n\n  const VERSION='599';\n  const PORTRAIT=(\n    'assets/armored_all_might/'+\n    'armored_all_might_technical/portrait.webp?v=599'\n  );\n\n  function normal(value){\n    return String(value??'')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g,'_')\n      .replace(/^_+|_+$/g,'');\n  }\n\n  function isArmoredCard(card){\n    const name=normal(\n      card.querySelector(':scope > header h4')?.textContent\n    );\n\n    return name.includes('armored_all_might');\n  }\n\n  function setPortrait(box,name){\n    if(!box)return;\n\n    let image=box.querySelector('img');\n\n    if(!image){\n      image=document.createElement('img');\n      image.loading='eager';\n      image.decoding='async';\n      box.replaceChildren(image);\n    }\n\n    image.hidden=false;\n    image.alt=name||'Armored All Might';\n    image.removeAttribute('srcset');\n\n    image.onerror=function(){\n      /*\n        Une seule nouvelle tentative sans conserver l'ancienne URL en cache.\n      */\n      if(this.dataset.v599Retry)return;\n\n      this.dataset.v599Retry='1';\n      this.src=PORTRAIT+'&retry='+Date.now();\n    };\n\n    if(image.getAttribute('src')!==PORTRAIT){\n      image.setAttribute('src',PORTRAIT);\n    }\n  }\n\n  function fixCard(card){\n    if(!isArmoredCard(card))return;\n\n    const name=String(\n      card.querySelector(':scope > header h4')?.textContent||\n      'Armored All Might'\n    ).trim();\n\n    setPortrait(\n      card.querySelector(\n        ':scope > header .s18PatchPortraitV10'\n      ),\n      name\n    );\n  }\n\n  function refresh(){\n    document.querySelectorAll('.s18PatchCharacterV10')\n      .forEach(fixCard);\n  }\n\n  let queued=false;\n\n  function schedule(){\n    if(queued)return;\n    queued=true;\n\n    requestAnimationFrame(()=>{\n      queued=false;\n      refresh();\n    });\n  }\n\n  new MutationObserver(mutations=>{\n    if(\n      mutations.some(mutation=>\n        mutation.addedNodes?.length||\n        mutation.type==='attributes'\n      )\n    ){\n      schedule();\n    }\n  }).observe(document.documentElement,{\n    childList:true,\n    subtree:true,\n    attributes:true,\n    attributeFilter:['class','src','hidden']\n  });\n\n  document.addEventListener('click',event=>{\n    if(\n      event.target?.closest?.(\n        '[data-patch-index],'+\n        '[data-tab=\"patch\"],'+\n        '#mhurPatchDevButtonV14,'+\n        '[data-s18-notes-button]'\n      )\n    ){\n      setTimeout(refresh,0);\n      setTimeout(refresh,80);\n      setTimeout(refresh,220);\n    }\n  },true);\n\n  window.addEventListener('mhur:languagechange',()=>{\n    setTimeout(refresh,0);\n    setTimeout(refresh,100);\n  });\n\n  if(document.readyState==='loading'){\n    document.addEventListener(\n      'DOMContentLoaded',\n      refresh,\n      {once:true}\n    );\n  }else{\n    refresh();\n  }\n\n  window.addEventListener('load',refresh,{once:true});\n\n  window.MHUR_V599={\n    version:VERSION,\n    refresh\n  };\n})();\n"

          EXTENSIONS={".webp",".png",".jpg",".jpeg",".avif"}


          def fail(message):
              raise RuntimeError(message)


          def normalize(value):
              text=unicodedata.normalize("NFD",str(value or ""))
              text="".join(
                  char for char in text
                  if unicodedata.category(char)!="Mn"
              )
              return re.sub(r"[^a-z0-9]+","_",text.lower()).strip("_")


          def valid_image(path):
              if not path.is_file() or path.stat().st_size<256:
                  return False

              try:
                  with Image.open(path) as image:
                      image.verify()
                  return True
              except Exception:
                  return False


          def dimensions(path):
              try:
                  with Image.open(path) as image:
                      return image.size
              except Exception:
                  return (0,0)


          def candidate_score(path):
              normalized=normalize(path.as_posix())
              stem=normalize(path.stem)
              width,height=dimensions(path)

              if not width or not height:
                  return -100000

              score=0

              if "armored_all_might" in normalized:
                  score+=1000

              if "armored_all_might_technical" in normalized:
                  score+=600

              exact={
                  "portrait":1000,
                  "profile":950,
                  "character":900,
                  "chara":880,
                  "avatar":850,
                  "face":820,
                  "render":700,
                  "fullbody":650,
                  "full_body":650,
                  "card":550,
                  "icon":450,
              }

              score+=exact.get(stem,0)

              for keyword,points in (
                  ("portrait",800),
                  ("profile",750),
                  ("character",650),
                  ("chara",620),
                  ("avatar",600),
                  ("face",550),
                  ("render",400),
              ):
                  if keyword in stem:
                      score+=points

              forbidden=(
                  "alpha","beta","gamma","special",
                  "skill","tuning","effect","costume",
                  "thumb_tuning","icon_tuning"
              )

              for keyword in forbidden:
                  if keyword in stem:
                      score-=1800

              ratio=width/height

              if 0.65<=ratio<=1.35:
                  score+=500
              elif 0.45<=ratio<=1.8:
                  score+=250

              if width>=256 and height>=256:
                  score+=250

              score+=min(width*height//10000,500)

              return score


          def all_candidates():
              candidates=[]

              if not ASSETS.is_dir():
                  return candidates

              for path in ASSETS.rglob("*"):
                  if (
                      path.is_file() and
                      path.suffix.lower() in EXTENSIONS and
                      valid_image(path)
                  ):
                      normalized=normalize(path.as_posix())

                      if (
                          "armored_all_might" in normalized or
                          (
                              "armored" in normalized and
                              "all_might" in normalized
                          )
                      ):
                          candidates.append(path)

              return sorted(
                  candidates,
                  key=candidate_score,
                  reverse=True,
              )


          def rebuild_portrait(source):
              TARGET_DIR.mkdir(parents=True,exist_ok=True)

              with Image.open(source) as image:
                  image=ImageOps.exif_transpose(image)
                  image=image.convert("RGBA")

                  maximum=640

                  if image.width>maximum or image.height>maximum:
                      image.thumbnail(
                          (maximum,maximum),
                          Image.Resampling.LANCZOS,
                      )

                  image.save(
                      TARGET,
                      "WEBP",
                      quality=96,
                      method=6,
                      lossless=False,
                  )

              if not valid_image(TARGET):
                  fail("Le portrait WEBP recréé est invalide.")


          def select_and_rebuild():
              existing_valid=valid_image(TARGET)
              candidates=all_candidates()


              usable=[
                  path for path in candidates
                  if path.resolve()!=TARGET.resolve()
              ]

              if usable:
                  chosen=usable[0]
                  rebuild_portrait(chosen)
                  return chosen,existing_valid,candidates

              if existing_valid:

                  # Le fichier existe et est lisible : on le réencode pour supprimer
                  # les problèmes internes et forcer un nouveau contenu.
                  temporary=TARGET.with_name("portrait_v599_source.webp")
                  shutil.copy2(TARGET,temporary)

                  try:
                      rebuild_portrait(temporary)
                  finally:
                      temporary.unlink(missing_ok=True)

                  return TARGET,True,candidates

              fail(
                  "Aucune image locale valide d'Armored All Might n'a été trouvée."
              )


          def patch_index():
              if not INDEX.is_file():
                  fail("public/index.html est introuvable.")

              html=INDEX.read_text(encoding="utf-8-sig")

              html=re.sub(
                  r"\s*<script\b[^>]*src=['\"][^'\"]*"
                  r"v599-armored-portrait\.js"
                  r"[^'\"]*['\"][^>]*>\s*</script>\s*",
                  "\n",
                  html,
                  flags=re.I,
              )

              if "</body>" not in html:
                  fail("Balise </body> introuvable.")

              html=html.replace(
                  "</body>",
                  '\n<script src="js/v599-armored-portrait.js?v=599">'
                  '</script>\n</body>',
                  1,
              )

              INDEX.write_text(
                  html.rstrip()+"\n",
                  encoding="utf-8",
              )


          def verify(chosen,candidates):
              errors=[]

              if not valid_image(TARGET):
                  errors.append("portrait.webp est absent ou invalide.")

              with Image.open(TARGET) as image:
                  width,height=image.size

                  if width<64 or height<64:
                      errors.append(
                          "portrait.webp est trop petit : "
                          +f"{width}x{height}."
                      )

              html=INDEX.read_text(encoding="utf-8")
              js=JS.read_text(encoding="utf-8")

              if "js/v599-armored-portrait.js?v=599" not in html:
                  errors.append("Le JavaScript V599 n'est pas chargé.")

              for required in (
                  "portrait.webp?v=599",
                  "function fixCard",
                  "window.MHUR_V599",
              ):
                  if required not in js:
                      errors.append(
                          "Correctif JavaScript absent : "+required
                      )

              syntax=subprocess.run(
                  ["node","--check",str(JS)],
                  text=True,
                  capture_output=True,
              )

              if syntax.returncode:
                  errors.append(
                      "Syntaxe JavaScript invalide : "
                      +syntax.stderr
                  )

              if errors:
                  fail(
                      "Vérification V599 échouée :\n- "
                      +"\n- ".join(errors)
                  )

              with Image.open(TARGET) as image:
                  final_dimensions=image.size

              lines=[
                  "MHUR FRANCE — RAPPORT V599",
                  "",
                  "PORTRAIT ARMORED ALL MIGHT",
                  "- Source sélectionnée : "
                  +chosen.relative_to(ROOT).as_posix(),
                  "- Fichier final : "
                  +TARGET.relative_to(ROOT).as_posix(),
                  "- Dimensions finales : "
                  +f"{final_dimensions[0]}x{final_dimensions[1]}",
                  "- Taille finale : "
                  +str(TARGET.stat().st_size)
                  +" octets",
                  "",
                  "CANDIDATS TROUVÉS",
              ]

              for path in candidates[:30]:
                  width,height=dimensions(path)
                  lines.append(
                      "- "
                      +path.relative_to(ROOT).as_posix()
                      +f" | {width}x{height}"
                      +" | score "
                      +str(candidate_score(path))
                  )

              lines.extend([
                  "",
                  "NAVIGATEUR",
                  "- URL forcée avec ?v=599.",
                  "- Ancienne image vide ignorée.",
                  "- Nouvelle tentative automatique en cas d'erreur.",
                  "",
                  "VÉRIFICATIONS",
                  "- fichier WEBP valide : OK",
                  "- dimensions valides : OK",
                  "- syntaxe JavaScript : OK",
              ])

              REPORT.write_text(
                  "\n".join(lines)+"\n",
                  encoding="utf-8",
              )


          def main():
              chosen,existing_valid,candidates=select_and_rebuild()

              JS.parent.mkdir(parents=True,exist_ok=True)
              JS.write_text(
                  JS_CONTENT.rstrip()+"\n",
                  encoding="utf-8",
              )

              patch_index()
              verify(chosen,candidates)

              print("[OK] V599 appliqué et vérifié.")
              print(
                  "[OK] Source choisie : "
                  +chosen.relative_to(ROOT).as_posix()
              )
              print(
                  "[OK] Portrait final : "
                  +TARGET.relative_to(ROOT).as_posix()
              )
              print("[OK] Cache navigateur forcé en version 599.")


          if __name__=="__main__":
              main()
          PY
          python /tmp/appliquer_v599.py

      - name: Commit automatique
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             public/index.html             public/assets/armored_all_might/armored_all_might_technical/portrait.webp             public/js/v599-armored-portrait.js             RAPPORT_V599_PORTRAIT_ARMORED.txt

          if git diff --cached --quiet; then
            echo "V599 est deja installe."
            exit 0
          fi

          git commit -m "Reparer le portrait Armored All Might V599"
          git push
