name: MHUR V642 - Performances globales

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v642-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v642-global-performance
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Optimiser les performances globales
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v642.py <<'PY'
          
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          HOME_SCHEDULER=base64.b64decode("").decode("utf-8")
          REPORT=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          
          index_path=public/"index.html"
          home_path=public/"js"/"home.js"
          css_path=public/"css"/"v642-global-performance.css"
          js_path=public/"js"/"v642-global-performance.js"
          report_path=root/"RAPPORT_V642_PERFORMANCES_GLOBALES.txt"
          
          for required in [index_path,home_path]:
              if not required.is_file():
                  raise SystemExit(
                      f"[ERREUR] Fichier introuvable : {required}"
                  )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          home=home_path.read_text(encoding="utf-8")
          
          home=home.replace(
              "if(node.textContent!==next){"
              "node.textContent=next;"
              "node.classList.remove('tickV334');"
              "void node.offsetWidth;"
              "node.classList.add('tickV334')"
              "}",
              "if(node.textContent!==next){node.textContent=next}",
          )
          
          home=home.replace(
              "if(q.textContent!==next){"
              "q.textContent=next;"
              "q.classList.remove('tickV334');"
              "void q.offsetWidth;"
              "q.classList.add('tickV334')"
              "}",
              "if(q.textContent!==next){q.textContent=next}",
          )
          
          old_timer=(
              "window.MHUR_HOME_REFRESH=refresh;"
              "setInterval(refresh,1000);"
          )
          
          if "MHUR_V642_HOME_TIMER" not in home:
              if old_timer not in home:
                  raise SystemExit(
                      "[ERREUR] Timer historique de home.js introuvable."
                  )
          
              home=home.replace(
                  old_timer,
                  HOME_SCHEDULER,
                  1,
              )
          
          home_path.write_text(home,encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          old_asset=(
              "function asset(src,alt=''){"
              "return `<img src=\"${rootAsset(src)}\" alt=\"${alt}\">`"
              "}"
          )
          
          new_asset=(
              "function asset(src,alt=''){"
              "return `<img src=\"${rootAsset(src)}\" alt=\"${alt}\" "
              "loading=\"lazy\" decoding=\"async\">`"
              "}"
          )
          
          if old_asset in html:
              html=html.replace(old_asset,new_asset,1)
          
          html=html.replace(
              '<img src="${c.img}" alt="${c.variant}" '
              'loading="eager" decoding="async" fetchpriority="high">',
              '<img src="${c.img}" alt="${c.variant}" '
              'loading="lazy" decoding="async">',
          )
          
          html=re.sub(
              r'\s*<link\s+rel=["\']preload["\']\s+as=["\']image["\']'
              r'\s+href=["\']/assets/midoriya/[^"\']+/alpha\.webp\?v=609["\']'
              r'\s+fetchpriority=["\']high["\']\s*>\s*',
              "\n",
              html,
              flags=re.I,
          )
          
          old_patch_group='''  function patchGroupArray(arr, forcedChar){
              if(!Array.isArray(arr)) return arr;
              arr.forEach(group => patchGroup(group, forcedChar));
              return dedupeGroups(arr, forcedChar);
            }'''
          
          new_patch_group='''  const v642CostumeArrayState = new WeakMap();
            function patchGroupArray(arr, forcedChar){
              if(!Array.isArray(arr)) return arr;
          
              const beforeSignature = arr.map(group => {
                const variants = Array.isArray(group && group.variants)
                  ? group.variants
                  : [];
                return String(group && (group.group || group.name) || '')
                  + ':' + variants.length;
              }).join('|');
          
              if(v642CostumeArrayState.get(arr) === beforeSignature){
                return arr;
              }
          
              arr.forEach(group => patchGroup(group, forcedChar));
              dedupeGroups(arr, forcedChar);
          
              const afterSignature = arr.map(group => {
                const variants = Array.isArray(group && group.variants)
                  ? group.variants
                  : [];
                return String(group && (group.group || group.name) || '')
                  + ':' + variants.length;
              }).join('|');
          
              v642CostumeArrayState.set(arr, afterSignature);
              return arr;
            }'''
          
          if old_patch_group in html:
              html=html.replace(
                  old_patch_group,
                  new_patch_group,
                  1,
              )
          elif "v642CostumeArrayState" not in html:
              raise SystemExit(
                  "[ERREUR] Fonction patchGroupArray actuelle introuvable."
              )
          
          old_window_scan='''    Object.keys(window).forEach(name => {
                try {
                  const val = window[name];
                  if(Array.isArray(val) && val.length && val.every(x => x && typeof x === 'object' && Array.isArray(x.variants))){
                    patchGroupArray(val);
                  }
                } catch(e){}
              });'''
          
          new_window_scan='''    Object.keys(window)
                .filter(name => /_COSTUMES$/i.test(name))
                .forEach(name => {
                  try {
                    const val = window[name];
                    if(
                      Array.isArray(val) &&
                      val.length &&
                      val.every(
                        x => x &&
                        typeof x === 'object' &&
                        Array.isArray(x.variants)
                      )
                    ){
                      patchGroupArray(val);
                    }
                  } catch(e){}
                });'''
          
          if old_window_scan in html:
              html=html.replace(
                  old_window_scan,
                  new_window_scan,
                  1,
              )
          elif "/_COSTUMES$/i.test(name)" not in html:
              raise SystemExit(
                  "[ERREUR] Ancien scan de tout window introuvable."
              )
          
          html,count_home=re.subn(
              r'(<script\s+src=["\']js/home\.js)'
              r'(?:\?[^"\']*)?(["\'])',
              r'\1?v=642\2',
              html,
              count=1,
              flags=re.I,
          )
          
          if count_home!=1:
              raise SystemExit(
                  "[ERREUR] Référence js/home.js introuvable."
              )
          
          for name in [
              "v641-home-fps",
              "v642-global-performance",
          ]:
              escaped=re.escape(name)
          
              html=re.sub(
                  rf'\s*<link[^>]+href=["\'][^"\']*{escaped}'
                  rf'[^"\']*["\'][^>]*>\s*',
                  "\n",
                  html,
                  flags=re.I,
              )
          
              html=re.sub(
                  rf'\s*<script[^>]+src=["\'][^"\']*{escaped}'
                  rf'[^"\']*["\'][^>]*>\s*</script>\s*',
                  "\n",
                  html,
                  flags=re.I,
              )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads or not bodies:
              raise SystemExit(
                  "[ERREUR] Structure HTML incomplète."
              )
          
          head_position=heads[-1].start()
          css_tag=(
              '\n<!-- V642 : performances globales. -->\n'
              '<link rel="stylesheet" '
              'href="css/v642-global-performance.css?v=642">\n'
          )
          html=html[:head_position]+css_tag+html[head_position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          body_position=bodies[-1].start()
          js_tag=(
              '\n<!-- V642 : images et animations hors écran. -->\n'
              '<script src="js/v642-global-performance.js?v=642"></script>\n'
          )
          html=html[:body_position]+js_tag+html[body_position:]
          
          index_path.write_text(html,encoding="utf-8")
          
          for obsolete in [
              public/"css"/"v641-home-fps.css",
              root/"RAPPORT_V641_FPS_ACCUEIL.txt",
          ]:
              if obsolete.is_file():
                  obsolete.unlink()
          
          report_path.write_text(REPORT+"\n",encoding="utf-8")
          
          print("[OK] V642 appliqué.")
          
          PY
          
          cat > /tmp/verifier_v642.py <<'PY'
          
          from pathlib import Path
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          home=Path("public/js/home.js").read_text(encoding="utf-8")
          css=Path(
              "public/css/v642-global-performance.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v642-global-performance.js"
          ).read_text(encoding="utf-8")
          
          for reference in [
              "js/home.js?v=642",
              "css/v642-global-performance.css?v=642",
              "js/v642-global-performance.js?v=642",
          ]:
              if index.count(reference)!=1:
                  raise SystemExit(
                      f"[ERREUR] Référence absente ou dupliquée : {reference}"
                  )
          
          for forbidden in [
              "void node.offsetWidth",
              "void q.offsetWidth",
              "setInterval(refresh,1000)",
          ]:
              if forbidden in home:
                  raise SystemExit(
                      f"[ERREUR] Code coûteux encore présent : {forbidden}"
                  )
          
          if "Object.keys(window).forEach(name =>" in index:
              raise SystemExit(
                  "[ERREUR] Le scan global historique est encore présent."
              )
          
          if (
              'loading="eager" decoding="async" fetchpriority="high"'
              in index
          ):
              raise SystemExit(
                  "[ERREUR] Les costumes utilisent encore tous la priorité haute."
              )
          
          for token in [
              "v642CostumeArrayState",
              "/_COSTUMES$/i.test(name)",
          ]:
              if token not in index:
                  raise SystemExit(
                      f"[ERREUR] Optimisation des collections absente : {token}"
                  )
          
          for token in [
              "content-visibility:auto",
              "mhurPerfPausedV642",
              "contain:layout paint style",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V642 incomplet : {token}"
                  )
          
          for token in [
              "IntersectionObserver",
              "registerImage",
              "registerAnimation",
              "MHUR_V642_GLOBAL_PERF",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS V642 incomplet : {token}"
                  )
          
          print("[OK] Vérification V642 réussie.")
          
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v642.py
            node --check public/js/home.js
            node --check public/js/v642-global-performance.js
            python3 /tmp/verifier_v642.py
          
            git add -A
          
            if git diff --cached --quiet; then
              echo "[INFO] V642 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "perf: corriger les saccades globales V642"
          
            if git push origin HEAD:main; then
              echo "[OK] V642 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V642."
          exit 1
