name: MHUR - Nexus Branding & Langue
true:
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: mhur-nexus-branding-langue
  cancel-in-progress: true
jobs:
  appliquer:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - name: Récupérer main
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: main
    - name: Installer Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Appliquer MHUR NEXUS + langue persistante
      shell: bash
      env:
        MHUR_BRANDING_SCRIPT_B64: 
      run: 'set -euo pipefail

        printf ''%s'' "$MHUR_BRANDING_SCRIPT_B64" | base64 --decode > /tmp/mhur_branding.py

        python /tmp/mhur_branding.py

        '
    - name: Publier le correctif Nexus
      shell: bash
      run: "set -euo pipefail\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A -- public/index.html public/manifest.webmanifest\nif git diff --cached --quiet; then\n  echo \"Aucun changement à publier.\"\n  exit 0\nfi\ngit commit -m \"fix: MHUR NEXUS branding, SEO et langue persistante\"\ngit pull --rebase origin main\ngit push origin HEAD:main\n"
