name: MHUR - MISE À JOUR NEXUS — OFFICIELLE V5

on:
  schedule:
    - cron: "11 * * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Action à lancer"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - approval
          - install

# Discord : V / FIX 3 = 150 / SLOT 1 = Nom / SLOT 3 = NONE

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: mhur-nexus-update-${{ github.event.schedule || inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  installer:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'install'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Désactiver les anciens workflows automatiques
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --paginate \
            --jq '.workflows[] | [.id,.path,.state] | @tsv' \
            > /tmp/workflows.tsv

          while IFS=$'\t' read -r id path state; do
            case "$path" in
              .github/workflows/mhur-mise-a-jour-guardian-officielle.yml|\
              .github/workflows/mhur-nexus-branding-langue.yml)
                continue
                ;;
            esac

            case "$path" in
              .github/workflows/mhur-v*auto*.yml|\
              .github/workflows/mhur-sync*.yml|\
              .github/workflows/*ultrarumble*auto*.yml|\
              .github/workflows/mhur-guardian-hourly.yml|\
              .github/workflows/mhur-guardian-approval.yml)
                if [ "$state" = "active" ]; then
                  echo "Désactivation : $path"
                  gh api \
                    --method PUT \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
                fi
                ;;
            esac
          done < /tmp/workflows.tsv

          echo "[OK] L'ancien système automatique est désactivé."
          echo "[OK] Les Master manuels restent disponibles comme secours."

  scan:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '11 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_APPROVER_USER_ID: ${{ secrets.DISCORD_APPROVER_USER_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer le moteur indépendant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          Path('/tmp/mhur_guardian.py').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
          Path('/tmp/browser_smoke.mjs').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
          PY
          python -m py_compile /tmp/mhur_guardian.py
          node --check /tmp/browser_smoke.mjs

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f mise_a_jour/requirements.txt ]; then
            python -m pip install -r mise_a_jour/requirements.txt
          fi
          python -m pip install requests beautifulsoup4 lxml pillow

      - name: Configurer Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Vérifier les fichiers source nécessaires
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/data/home_data.json
          test -f mise_a_jour/outils/update_home_data.py
          test -f mise_a_jour/outils/surveiller_ultrarumble.py

      # -----------------------------------------------------------
      # Passe automatique : uniquement accueil non sensible.
      # Saison / persos / stats / patch / costumes / tuning exclus.
      # -----------------------------------------------------------
      - name: Scanner l'accueil sûr
        id: safe_home
        shell: bash
        run: |
          set -euo pipefail

          cp public/data/home_data.json /tmp/home_before.json

          python mise_a_jour/outils/update_home_data.py \
            --site-root public

          cp public/data/home_data.json /tmp/home_full_candidate.json

          python /tmp/mhur_guardian.py \
            keep-safe-home \
            --site-root public \
            --before /tmp/home_before.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          before=json.loads(Path('/tmp/home_before.json').read_text(encoding='utf-8'))
          candidate=json.loads(Path('/tmp/home_full_candidate.json').read_text(encoding='utf-8'))

          safe={
              'maintenance','gachas','events','login_bonuses',
              'point_reductions','points','discounts','campaigns',
              'notices','oe','meta'
          }
          review_hint=False
          for key in set(before)|set(candidate):
              if key in safe:
                  continue
              if before.get(key)!=candidate.get(key):
                  review_hint=True
                  break

          old_season=int((before.get('season') or {}).get('number') or 0)
          new_season=int((candidate.get('season') or {}).get('number') or 0)
          season_hint=old_season!=new_season and new_season>0

          print(f"home_review_hint={'true' if review_hint else 'false'}")
          print(f"season_hint={'true' if season_hint else 'false'}")
          print(f"candidate_season={new_season}")
          PY

      - name: Surveiller accueil + notices + points + OE
        id: watch
        shell: bash
        run: |
          set -euo pipefail

          python /tmp/mhur_guardian.py \
            watch-home \
            --site-root public \
            --output /tmp/guardian_watch_candidate.json

      - name: Ajouter le snapshot accueil s'il est sûr
        if: steps.watch.outputs.review_hint != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          cp /tmp/guardian_watch_candidate.json \
            public/data/guardian_watch.json

      - name: Analyser la passe automatique
        id: safe_analysis
        shell: bash
        run: |
          set -euo pipefail

          python /tmp/mhur_guardian.py \
            analyze \
            --base HEAD \
            --mode safe \
            --output /tmp/safe_report.json \
            --markdown /tmp/safe_report.md

          if [ "${{ steps.safe_analysis.outputs.requires_review }}" = "true" ]; then
            echo "[ERREUR] Une modification sensible a essayé de passer en automatique."
            exit 1
          fi

      - name: Tester la passe automatique
        if: steps.safe_analysis.outputs.visible_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            smoke \
            --base HEAD \
            --site-root public

      - name: Publier accueil / maintenance / événements automatiquement
        id: safe_publish
        if: steps.safe_analysis.outputs.visible_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add -A -- public
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: mise à jour accueil Nexus sûre"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

          python /tmp/mhur_guardian.py \
            discord-notify \
            --text "✅ MHUR NEXUS : accueil / maintenance / événements / timers mis à jour automatiquement." \
            --report /tmp/safe_report.json || true

      - name: Repartir du dernier main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git clean -fd -- public >/dev/null 2>&1 || true

      # -----------------------------------------------------------
      # Scan complet : UltraRumble + accueil sensible.
      # -----------------------------------------------------------
      - name: Vérifier si une bêta complète est nécessaire
        id: source
        shell: bash
        run: |
          set -euo pipefail

          set +e
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --check-only
          code=$?
          set -e

          monitor=false
          case "$code" in
            0) monitor=false ;;
            10) monitor=true ;;
            *) echo "[ERREUR] surveiller_ultrarumble.py : code $code"; exit "$code" ;;
          esac

          changed=false
          if [ "$monitor" = "true" ] || \
             [ "${{ steps.safe_home.outputs.home_review_hint }}" = "true" ] || \
             [ "${{ steps.watch.outputs.review_hint }}" = "true" ]; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "monitor=$monitor" >> "$GITHUB_OUTPUT"

      - name: Construire la version candidate complète
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp public/data/home_data.json \
            /tmp/home_before_full_sync.json

          # Le synchroniseur peut reconstruire personnages, Alters, stats,
          # costumes, tuning et Patch Notes.
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --wait-lock 300

          # L'accueil complet est régénéré après la synchronisation.
          python mise_a_jour/outils/update_home_data.py \
            --site-root public


          # Préserve les enrichissements/corrections déjà validés sur
          # MHUR NEXUS sans écraser les nouvelles valeurs source.
          python /tmp/mhur_guardian.py \
            reconcile-home \
            --site-root public \
            --before /tmp/home_before_full_sync.json

          if [ -f /tmp/guardian_watch_candidate.json ]; then
            cp /tmp/guardian_watch_candidate.json \
              public/data/guardian_watch.json
          fi

          # Corrections validées manuellement auparavant.
          python /tmp/mhur_guardian.py apply-overrides

          # Roster manuel de la saison en cours, s'il existe.
          python /tmp/mhur_guardian.py \
            apply-saved-season \
            --site-root public

          # Branding MHUR NEXUS + anglais par défaut + saison dynamique.
          python /tmp/mhur_guardian.py \
            branding \
            --site-root public

          rm -f \
            public/data/ultrarumble/synchronisation_ultrarumble.log \
            public/data/ultrarumble/synchronisation_en_cours.lock
          rm -rf public/sauvegardes

          if [ -f public/data/ultrarumble/derniere_synchronisation.json ]; then
            cp public/data/ultrarumble/derniere_synchronisation.json \
              /tmp/guardian_sync_state.json
            git restore --source=HEAD -- \
              public/data/ultrarumble/derniere_synchronisation.json \
              2>/dev/null || \
              rm -f public/data/ultrarumble/derniere_synchronisation.json
          fi

      - name: Analyser chaque changement candidat
        id: beta_analysis
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          extra=()
          if [ -f /tmp/guardian_sync_state.json ]; then
            extra=(--sync-state /tmp/guardian_sync_state.json)
          fi

          python /tmp/mhur_guardian.py \
            analyze \
            --base HEAD \
            --mode full \
            "${extra[@]}" \
            --output /tmp/beta_report.json \
            --markdown /tmp/beta_report.md

      - name: Tests structurels de la candidate
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.visible_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            smoke \
            --base HEAD \
            --site-root public

      - name: Test Chromium anti-casse
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.visible_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0

          # Le module Playwright est installé dans node_modules du dépôt.
          # Le script ne doit donc pas rester dans /tmp, sinon Node cherche
          # "playwright" autour de /tmp et renvoie ERR_MODULE_NOT_FOUND.
          browser_smoke="$GITHUB_WORKSPACE/.mhur-browser-smoke.mjs"
          cp /tmp/browser_smoke.mjs "$browser_smoke"

          npx playwright install chromium

          python -m http.server 4173 --directory public >/tmp/mhur-http.log 2>&1 &
          server_pid=$!

          cleanup_browser_test() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$browser_smoke"
          }
          trap cleanup_browser_test EXIT

          sleep 2

          SMOKE_URL="http://127.0.0.1:4173/"             node "$browser_smoke"

      - name: Mémoriser un changement interne sans spam supplémentaire
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.visible_changes != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/guardian_sync_state.json ]; then
            exit 0
          fi
          git reset --hard HEAD
          cp /tmp/guardian_sync_state.json \
            public/data/ultrarumble/derniere_synchronisation.json
          git add public/data/ultrarumble/derniere_synchronisation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: état de surveillance Nexus"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publier automatiquement si le scan complet est non sensible
        id: full_safe_publish
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.visible_changes == 'true' &&
          steps.beta_analysis.outputs.requires_review != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/guardian_sync_state.json ]; then
            cp /tmp/guardian_sync_state.json \
              public/data/ultrarumble/derniere_synchronisation.json
          fi
          git add -A -- public
          git commit -m "chore: mise à jour Nexus automatique sûre"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
          python /tmp/mhur_guardian.py \
            discord-notify \
            --text "✅ MHUR NEXUS : mise à jour sûre publiée automatiquement." \
            --report /tmp/beta_report.json || true

      # -----------------------------------------------------------
      # Changements sensibles -> branche bêta + PR + Discord.
      # -----------------------------------------------------------
      - name: Créer le commit candidat sensible
        id: candidate
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.requires_review == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b "guardian-candidate-${GITHUB_RUN_ID}"
          git add -A -- public
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "beta: MHUR NEXUS Guardian ${GITHUB_RUN_ID}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mémoriser la nouvelle empreinte source sur main
        if: steps.candidate.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if [ -f /tmp/guardian_sync_state.json ]; then
            cp /tmp/guardian_sync_state.json \
              public/data/ultrarumble/derniere_synchronisation.json
            git add public/data/ultrarumble/derniere_synchronisation.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: empreinte source Guardian"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Mettre à jour la branche bêta unique
        id: beta
        if: steps.candidate.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          old_tree=""
          if git ls-remote --exit-code --heads origin mhur-auto-beta >/dev/null 2>&1; then
            git fetch origin mhur-auto-beta:refs/remotes/origin/mhur-auto-beta
            old_tree="$(git rev-parse 'refs/remotes/origin/mhur-auto-beta^{tree}')"
          fi
          git checkout -B mhur-auto-beta origin/main
          git cherry-pick "${{ steps.candidate.outputs.sha }}"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$old_tree" ] && [ "$old_tree" = "$new_tree" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force-with-lease origin HEAD:mhur-auto-beta
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Déployer la preview Cloudflare
        id: preview
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          preview=""
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && \
             [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && \
             [ -n "${CLOUDFLARE_PAGES_PROJECT:-}" ]; then
            npm install --no-save --ignore-scripts wrangler@4
            set +e
            npx wrangler pages deploy public \
              --project-name "$CLOUDFLARE_PAGES_PROJECT" \
              --branch mhur-auto-beta \
              --commit-dirty=true \
              2>&1 | tee /tmp/wrangler.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then
              preview="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler.log | tail -n1 || true)"
            fi
          fi
          echo "url=$preview" >> "$GITHUB_OUTPUT"

      - name: Créer / mettre à jour la PR bêta
        id: pr
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head mhur-auto-beta --base main --state open --json number --jq '.[0].number // empty')"
          python /tmp/mhur_guardian.py \
            make-pr-body \
            --markdown /tmp/beta_report.md \
            --message-id "" \
            --preview-url "${{ steps.preview.outputs.url }}" \
            --head-sha "${{ steps.beta.outputs.head_sha }}" \
            --output /tmp/pr_body_pre.md
          if [ -z "$existing" ]; then
            url="$(gh pr create --base main --head mhur-auto-beta --title '🧪 MHUR NEXUS — validation requise' --body-file /tmp/pr_body_pre.md)"
            number="$(gh pr view "$url" --json number --jq '.number')"
          else
            number="$existing"
            gh pr edit "$number" --title "🧪 MHUR NEXUS — validation requise" --body-file /tmp/pr_body_pre.md
            url="$(gh pr view "$number" --json url --jq '.url')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Envoyer la bêta sur Discord
        id: discord
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            discord-send \
            --report /tmp/beta_report.json \
            --pr-url "${{ steps.pr.outputs.url }}" \
            --preview-url "${{ steps.preview.outputs.url }}"

      - name: Lier Discord à la PR
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            make-pr-body \
            --markdown /tmp/beta_report.md \
            --message-id "${{ steps.discord.outputs.message_id }}" \
            --preview-url "${{ steps.preview.outputs.url }}" \
            --head-sha "${{ steps.beta.outputs.head_sha }}" \
            --output /tmp/pr_body_final.md
          gh pr edit "${{ steps.pr.outputs.number }}" --body-file /tmp/pr_body_final.md

      - name: Notification horaire aucun changement
        if: >-
          always() &&
          success() &&
          steps.safe_analysis.outputs.visible_changes != 'true' &&
          (
            steps.source.outputs.changed != 'true' ||
            steps.beta_analysis.outputs.visible_changes != 'true'
          )
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            discord-notify \
            --text "✅ MHUR NEXUS Guardian : vérification horaire terminée — aucun changement visible détecté."

  approval:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'approval')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_APPROVER_USER_ID: ${{ secrets.DISCORD_APPROVER_USER_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer le moteur indépendant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          Path('/tmp/mhur_guardian.py').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
          Path('/tmp/browser_smoke.mjs').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
          PY
          python -m py_compile /tmp/mhur_guardian.py
          node --check /tmp/browser_smoke.mjs

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f mise_a_jour/requirements.txt ]; then
            python -m pip install -r mise_a_jour/requirements.txt
          fi
          python -m pip install requests beautifulsoup4 lxml pillow

      - name: Configurer Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Trouver la bêta en attente
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh pr list --head mhur-auto-beta --base main --state open --limit 1 --json number,url,body,headRefOid)"
          number="$(printf '%s' "$json" | jq -r '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$json" | jq -r '.[0].body' > /tmp/pr_body.md
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$(printf '%s' "$json" | jq -r '.[0].url')" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(printf '%s' "$json" | jq -r '.[0].headRefOid')" >> "$GITHUB_OUTPUT"

      - name: Lire l'état Discord de la PR
        id: state
        if: steps.pr.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py extract-state --body /tmp/pr_body.md

      - name: Lire V / FIX / SLOT / refus sur Discord
        id: discord
        if: >-
          steps.pr.outputs.exists == 'true' &&
          steps.state.outputs.message_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            discord-check \
            --message-id "${{ steps.state.outputs.message_id }}"

      - name: Enregistrer un refus texte ou ❌
        if: steps.discord.outputs.decision == 'reject'
        shell: bash
        run: |
          set -euo pipefail
          feedback="$(printf '%s' '${{ steps.discord.outputs.feedback }}' | base64 --decode || true)"
          if [ -z "$feedback" ]; then feedback="Refus Discord ❌"; fi
          gh pr comment "${{ steps.pr.outputs.number }}" --body "❌ **Bêta bloquée depuis Discord**"$'\n\n'"$feedback"

      # -----------------------------------------------------------
      # Nouvelle saison : 3 SLOT depuis Discord.
      # -----------------------------------------------------------
      - name: Appliquer le roster de nouvelle saison
        id: season_apply
        if: steps.discord.outputs.decision == 'season'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main mhur-auto-beta
          git checkout -B mhur-auto-beta origin/mhur-auto-beta
          python /tmp/mhur_guardian.py \
            apply-season \
            --site-root public \
            --payload-b64 "${{ steps.discord.outputs.season_payload }}"
          python /tmp/mhur_guardian.py branding --site-root public
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Corriger une valeur FIX # depuis Discord
        id: fix_apply
        if: steps.discord.outputs.decision == 'fix'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main mhur-auto-beta
          git checkout -B mhur-auto-beta origin/mhur-auto-beta
          python /tmp/mhur_guardian.py \
            analyze \
            --base origin/main \
            --mode full \
            --output /tmp/current_report.json \
            --markdown /tmp/current_report.md
          python /tmp/mhur_guardian.py \
            apply-fix \
            --report /tmp/current_report.json \
            --index "${{ steps.discord.outputs.fix_index }}" \
            --value-b64 "${{ steps.discord.outputs.fix_value }}"
          python /tmp/mhur_guardian.py branding --site-root public
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tester la bêta corrigée / saison configurée
        if: >-
          steps.season_apply.outputs.changed == 'true' ||
          steps.fix_apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py smoke --base origin/main --site-root public
          npm install --no-save --ignore-scripts playwright@1.55.0

          # Le module Playwright est installé dans node_modules du dépôt.
          # Le script ne doit donc pas rester dans /tmp, sinon Node cherche
          # "playwright" autour de /tmp et renvoie ERR_MODULE_NOT_FOUND.
          browser_smoke="$GITHUB_WORKSPACE/.mhur-browser-smoke.mjs"
          cp /tmp/browser_smoke.mjs "$browser_smoke"

          npx playwright install chromium

          python -m http.server 4173 --directory public >/tmp/mhur-http.log 2>&1 &
          server_pid=$!

          cleanup_browser_test() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$browser_smoke"
          }
          trap cleanup_browser_test EXIT

          sleep 2

          SMOKE_URL="http://127.0.0.1:4173/"             node "$browser_smoke"

      - name: Recréer le rapport après correction
        id: corrected
        if: >-
          steps.season_apply.outputs.changed == 'true' ||
          steps.fix_apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            analyze \
            --base origin/main \
            --mode full \
            --output /tmp/corrected_report.json \
            --markdown /tmp/corrected_report.md

          git add -A -- public
          git commit -m "beta: correction Discord MHUR NEXUS"
          git push --force-with-lease origin HEAD:mhur-auto-beta
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Redéployer la bêta corrigée
        id: corrected_preview
        if: steps.corrected.outputs.head_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          preview="${{ steps.state.outputs.preview_url }}"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && \
             [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && \
             [ -n "${CLOUDFLARE_PAGES_PROJECT:-}" ]; then
            npm install --no-save --ignore-scripts wrangler@4
            set +e
            npx wrangler pages deploy public \
              --project-name "$CLOUDFLARE_PAGES_PROJECT" \
              --branch mhur-auto-beta \
              --commit-dirty=true \
              2>&1 | tee /tmp/wrangler-corrected.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then
              found="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-corrected.log | tail -n1 || true)"
              if [ -n "$found" ]; then preview="$found"; fi
            fi
          fi
          echo "url=$preview" >> "$GITHUB_OUTPUT"

      - name: Envoyer la NOUVELLE bêta après correction
        id: corrected_discord
        if: steps.corrected.outputs.head_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            discord-send \
            --report /tmp/corrected_report.json \
            --pr-url "${{ steps.pr.outputs.url }}" \
            --preview-url "${{ steps.corrected_preview.outputs.url }}"

      - name: Mettre à jour la PR corrigée
        if: steps.corrected.outputs.head_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            make-pr-body \
            --markdown /tmp/corrected_report.md \
            --message-id "${{ steps.corrected_discord.outputs.message_id }}" \
            --preview-url "${{ steps.corrected_preview.outputs.url }}" \
            --head-sha "${{ steps.corrected.outputs.head_sha }}" \
            --output /tmp/pr_body_corrected.md
          gh pr edit "${{ steps.pr.outputs.number }}" --body-file /tmp/pr_body_corrected.md

      # -----------------------------------------------------------
      # Validation V / ✅ : tests à nouveau, puis production.
      # -----------------------------------------------------------
      - name: Vérifier que V correspond à la dernière bêta
        if: steps.discord.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.state.outputs.head_sha }}" != "${{ steps.pr.outputs.head_sha }}" ]; then
            python /tmp/mhur_guardian.py discord-notify \
              --text "⚠️ Validation ignorée : la bêta a changé. Valide le dernier message Discord."
            exit 1
          fi

      - name: Récupérer la bêta validée
        if: steps.discord.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main mhur-auto-beta
          git checkout -B mhur-auto-beta origin/mhur-auto-beta
          python /tmp/mhur_guardian.py \
            analyze \
            --base origin/main \
            --mode full \
            --output /tmp/approval_report.json \
            --markdown /tmp/approval_report.md

      - name: Vérifier la configuration de la nouvelle saison
        id: season_ready
        if: steps.discord.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            validate-season \
            --site-root public \
            --report /tmp/approval_report.json

      - name: Interdire V tant que la nouvelle saison n'est pas configurée
        if: >-
          steps.discord.outputs.decision == 'approve' &&
          steps.season_ready.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py discord-notify \
            --text "🌟 Nouvelle saison : envoie d'abord SLOT 1 / SLOT 2 / SLOT 3 sur le message bêta avant de faire V."
          exit 1

      - name: Derniers tests avant production
        if: >-
          steps.discord.outputs.decision == 'approve' &&
          steps.season_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py branding --site-root public
          python /tmp/mhur_guardian.py smoke --base origin/main --site-root public
          npm install --no-save --ignore-scripts playwright@1.55.0

          # Le module Playwright est installé dans node_modules du dépôt.
          # Le script ne doit donc pas rester dans /tmp, sinon Node cherche
          # "playwright" autour de /tmp et renvoie ERR_MODULE_NOT_FOUND.
          browser_smoke="$GITHUB_WORKSPACE/.mhur-browser-smoke.mjs"
          cp /tmp/browser_smoke.mjs "$browser_smoke"

          npx playwright install chromium

          python -m http.server 4173 --directory public >/tmp/mhur-http.log 2>&1 &
          server_pid=$!

          cleanup_browser_test() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$browser_smoke"
          }
          trap cleanup_browser_test EXIT

          sleep 2

          SMOKE_URL="http://127.0.0.1:4173/"             node "$browser_smoke"

      - name: Fusionner la version validée en production
        if: >-
          steps.discord.outputs.decision == 'approve' &&
          steps.season_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Le branding est déjà présent dans la branche ; si sa dernière
          # application a créé un diff, on le commit avant la fusion.
          git add -A -- public
          if ! git diff --cached --quiet; then
            git commit -m "fix: préserver MHUR NEXUS avant production"
            git push --force-with-lease origin HEAD:mhur-auto-beta
          fi
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --squash \
            --delete-branch \
            --subject "✅ MHUR NEXUS — version validée"
          python /tmp/mhur_guardian.py discord-notify \
            --text "✅ MHUR NEXUS : bêta validée sur Discord et publiée en production."
