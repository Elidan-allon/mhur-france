name: MHUR - MISE À JOUR NEXUS — OFFICIELLE V19

on:
  schedule:
    - cron: "11 * * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Action à lancer"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - approval
          - install
          - preview-test

# Discord : V / FIX 3 = 150 / SLOT 1 = Nom / SLOT 3 = NONE

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # Scan et validation ne peuvent plus tourner en parallèle.
  group: mhur-nexus-update-singleton
  cancel-in-progress: false

jobs:
  installer:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'install'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Garder un seul updater Nexus
        shell: bash
        run: |
          set -euo pipefail

          current_path="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          current_path="${current_path%@*}"

          echo "Workflow V8 à conserver : $current_path"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --paginate \
            --jq '.workflows[] | [.id,.path,.state] | @tsv' \
            > /tmp/workflows.tsv

          disabled=0

          while IFS=$'\t' read -r id path state; do
            if [ "$path" = "$current_path" ]; then
              continue
            fi

            if [ "$path" = ".github/workflows/mhur-nexus-branding-langue.yml" ]; then
              continue
            fi

            case "$path" in
              .github/workflows/mhur-mise-a-jour-guardian-officielle*.yml|\
              .github/workflows/mhur-v*auto*.yml|\
              .github/workflows/mhur-sync*.yml|\
              .github/workflows/*ultrarumble*auto*.yml|\
              .github/workflows/mhur-guardian-hourly.yml|\
              .github/workflows/mhur-guardian-approval.yml)
                if [ "$state" = "active" ]; then
                  echo "Désactivation : $path"
                  gh api \
                    --method PUT \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
                  disabled=$((disabled + 1))
                fi
                ;;
            esac
          done < /tmp/workflows.tsv

          echo "[OK] $disabled ancien(s) updater(s) désactivé(s)."
          echo "[OK] Seul Guardian V19 reste updater automatique."

      - name: Supprimer l'ancienne bêta
        shell: bash
        run: |
          set -euo pipefail

          prs="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head mhur-auto-beta \
              --base main \
              --state open \
              --json number \
              --jq '.[].number'
          )"

          for pr in $prs; do
            gh pr close \
              --repo "$GITHUB_REPOSITORY" \
              "$pr" \
              --comment "🧹 Ancienne bêta annulée par Guardian V19. Une bêta propre sera recréée au prochain scan." \
              || true
          done

          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/mhur-auto-beta" \
            >/dev/null 2>&1 || true

      - name: Installation terminée
        shell: bash
        run: |
          echo "[OK] Guardian V19 est maintenant l'unique système de mise à jour."

  preview_test:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview-test'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Récupérer le site actuel
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Vérifier Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN absent."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID absent."
            exit 1
          fi

      - name: Installer Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts wrangler@4

      - name: Créer la bêta de test
        id: test_preview
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT :
          # "versions upload" crée seulement une nouvelle version.
          # Il n'y a aucune commande de promotion/déploiement production.
          set +e
          npx wrangler versions upload public \
            --name mhur-france \
            --preview-alias guardian-test \
            --message "MHUR NEXUS Guardian V19 preview-test ${GITHUB_SHA}" \
            2>&1 | tee /tmp/wrangler-preview-test.log
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ]; then
            echo "::error::Échec de la création de la bêta Worker de test."
            exit "$code"
          fi

          preview="$(
            grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev/?' \
              /tmp/wrangler-preview-test.log \
              | tail -n1 \
              | sed 's:/*$::' \
              || true
          )"

          if [ -z "$preview" ]; then
            echo "::error::Preview créée mais aucune URL workers.dev trouvée."
            cat /tmp/wrangler-preview-test.log
            exit 1
          fi

          echo "url=$preview" >> "$GITHUB_OUTPUT"
          echo "🌐 PREVIEW TEST : $preview"

      - name: Envoyer la bêta de test sur Discord
        if: steps.test_preview.outputs.url != ''
        shell: bash
        run: |
          set -euo pipefail

          preview="${{ steps.test_preview.outputs.url }}"

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL absent."
            echo "URL de test : $preview"
            exit 0
          fi

          payload="$(
            python - "$preview" <<'PY'
          import json
          import sys

          preview = sys.argv[1]

          message = {
              "content": (
                  "🧪 **MHUR NEXUS — TEST BÊTA GUARDIAN V19**\n\n"
                  "🌐 **OUVRIR LA BÊTA :** " + preview + "\n\n"
                  "Cette preview contient volontairement le site actuel de `main`.\n"
                  "Elle sert uniquement à vérifier que Cloudflare Preview fonctionne.\n\n"
                  "🔒 Aucun `V` ne peut publier ce test en production."
              )
          }

          print(json.dumps(message, ensure_ascii=False))
          PY
          )"

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"

      - name: Vérification de sécurité
        shell: bash
        run: |
          echo "✅ Preview-test terminée."
          echo "✅ Aucune PR créée."
          echo "✅ Aucun merge effectué."
          echo "✅ main non modifié."
          echo "✅ mhurfrance.com non modifié."
          echo "🌐 ${{ steps.test_preview.outputs.url }}"

  scan:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '11 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_APPROVER_USER_ID: ${{ secrets.DISCORD_APPROVER_USER_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Vérifier qu'aucun ancien updater n'est actif
        shell: bash
        run: |
          set -euo pipefail

          current_path="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          current_path="${current_path%@*}"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --paginate \
            --jq '.workflows[] | [.id,.path,.state] | @tsv' \
            > /tmp/workflows-v8.tsv

          while IFS=$'\t' read -r id path state; do
            if [ "$path" = "$current_path" ]; then
              continue
            fi

            case "$path" in
              .github/workflows/mhur-mise-a-jour-guardian-officielle*.yml|\
              .github/workflows/mhur-v*auto*.yml|\
              .github/workflows/mhur-sync*.yml|\
              .github/workflows/*ultrarumble*auto*.yml|\
              .github/workflows/mhur-guardian-hourly.yml|\
              .github/workflows/mhur-guardian-approval.yml)
                if [ "$state" = "active" ]; then
                  echo "Ancien updater encore actif, désactivation : $path"
                  gh api \
                    --method PUT \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
                fi
                ;;
            esac
          done < /tmp/workflows-v8.tsv

          echo "[OK] Updater unique V8 vérifié."

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer le moteur indépendant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          Path('/tmp/mhur_guardian.py').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
          Path('/tmp/browser_smoke.mjs').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
          PY
          python -m py_compile /tmp/mhur_guardian.py

          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          Path("/tmp/repair_login_bonuses_v17.py").write_bytes(
              gzip.decompress(
                  base64.b64decode("")
              )
          )
          PY

          # On compile seulement ici.
          # Le self-test sera exécuté APRÈS installation de requests/bs4/lxml.
          python -m py_compile /tmp/repair_login_bonuses_v17.py

          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          Path("/tmp/apply_guardian_v19_site_fixes.py").write_bytes(
              gzip.decompress(
                  base64.b64decode("")
              )
          )
          PY

          python -m py_compile /tmp/apply_guardian_v19_site_fixes.py
          python /tmp/apply_guardian_v19_site_fixes.py --self-test

          node --check /tmp/browser_smoke.mjs

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f mise_a_jour/requirements.txt ]; then
            python -m pip install -r mise_a_jour/requirements.txt
          fi
          python -m pip install requests beautifulsoup4 lxml pillow

          # Maintenant seulement, les imports requests/bs4/lxml existent.
          python /tmp/repair_login_bonuses_v17.py --self-test

      - name: Configurer Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Vérifier les fichiers source nécessaires
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/data/home_data.json
          test -f mise_a_jour/outils/update_home_data.py
          test -f mise_a_jour/outils/surveiller_ultrarumble.py

      # -----------------------------------------------------------
      # Passe automatique : uniquement accueil non sensible.
      # Saison / persos / stats / patch / costumes / tuning exclus.
      # -----------------------------------------------------------
      - name: Scanner l'accueil sûr
        id: safe_home
        shell: bash
        run: |
          set -euo pipefail

          cp public/data/home_data.json /tmp/home_before.json

          python mise_a_jour/outils/update_home_data.py \
            --site-root public

          # V15 : ne jamais garder la sortie brute du vieux parseur bonus.
          python /tmp/repair_login_bonuses_v17.py \
            --site-root public

          cp public/data/home_data.json /tmp/home_full_candidate.json

          python /tmp/mhur_guardian.py \
            keep-safe-home \
            --site-root public \
            --before /tmp/home_before.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          before=json.loads(Path('/tmp/home_before.json').read_text(encoding='utf-8'))
          candidate=json.loads(Path('/tmp/home_full_candidate.json').read_text(encoding='utf-8'))

          safe={
              'maintenance','gachas','events',
              'point_reductions','points','discounts','campaigns',
              'notices','oe','meta'
          }
          review_hint=False
          for key in set(before)|set(candidate):
              if key in safe:
                  continue
              if before.get(key)!=candidate.get(key):
                  review_hint=True
                  break

          old_season=int((before.get('season') or {}).get('number') or 0)
          new_season=int((candidate.get('season') or {}).get('number') or 0)
          season_hint=old_season!=new_season and new_season>0

          print(f"home_review_hint={'true' if review_hint else 'false'}")
          print(f"season_hint={'true' if season_hint else 'false'}")
          print(f"candidate_season={new_season}")
          PY

      - name: Surveiller accueil + notices + points + OE
        id: watch
        shell: bash
        run: |
          set -euo pipefail

          python /tmp/mhur_guardian.py \
            watch-home \
            --site-root public \
            --output /tmp/guardian_watch_candidate.json

      - name: Ajouter le snapshot accueil s'il est sûr
        if: steps.watch.outputs.review_hint != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          cp /tmp/guardian_watch_candidate.json \
            public/data/guardian_watch.json

      - name: Sécurité Login Bonuses
        shell: bash
        run: |
          echo "[GUARDIAN V19] Login Bonuses est REVIEW."
          echo "[GUARDIAN V19] La passe automatique n'y touche pas."
          echo "[GUARDIAN V19] La réparation sera validée dans la candidate complète avant la bêta."

      - name: Analyser la passe automatique
        id: safe_analysis
        shell: bash
        run: |
          set -euo pipefail

          python /tmp/mhur_guardian.py \
            analyze \
            --base HEAD \
            --mode safe \
            --output /tmp/safe_report.json \
            --markdown /tmp/safe_report.md

          if [ "${{ steps.safe_analysis.outputs.requires_review }}" = "true" ]; then
            echo "[ERREUR] Une modification sensible a essayé de passer en automatique."
            exit 1
          fi

      - name: Mémoriser le snapshot de surveillance silencieusement
        if: >-
          steps.watch.outputs.changed == 'true' &&
          steps.watch.outputs.review_hint != 'true' &&
          steps.safe_analysis.outputs.visible_changes != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f public/data/guardian_watch.json ]; then
            exit 0
          fi

          git add public/data/guardian_watch.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: état surveillance accueil Nexus"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "[GUARDIAN V19] Snapshot mémorisé sans publication visible."

      - name: Tester la passe automatique
        if: steps.safe_analysis.outputs.visible_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            smoke \
            --base HEAD \
            --site-root public

      - name: Publier accueil / maintenance / événements automatiquement
        id: safe_publish
        if: steps.safe_analysis.outputs.visible_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add -A -- public
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: mise à jour accueil Nexus sûre"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

          python /tmp/mhur_guardian.py \
            discord-notify \
            --text "✅ MHUR NEXUS Guardian V19 : contenu accueil / maintenance / événements réellement modifié et publié automatiquement." \
            --report /tmp/safe_report.json || true

      - name: Repartir du dernier main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git clean -fd -- public >/dev/null 2>&1 || true

      - name: Appliquer les correctifs visibles Guardian V19
        id: ui_fix
        shell: bash
        run: |
          set -euo pipefail

          python /tmp/apply_guardian_v19_site_fixes.py             --site-root public

          node --check public/js/home.js
          node --check public/js/v608-patch-notes-final.js

      # -----------------------------------------------------------
      # Scan complet : UltraRumble + accueil sensible.
      # -----------------------------------------------------------
      - name: Vérifier si une bêta complète est nécessaire
        id: source
        shell: bash
        run: |
          set -euo pipefail

          set +e
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --check-only
          code=$?
          set -e

          monitor=false
          case "$code" in
            0) monitor=false ;;
            10) monitor=true ;;
            *) echo "[ERREUR] surveiller_ultrarumble.py : code $code"; exit "$code" ;;
          esac

          changed=false
          if [ "$monitor" = "true" ] || \
             [ "${{ steps.safe_home.outputs.home_review_hint }}" = "true" ] || \
             [ "${{ steps.watch.outputs.review_hint }}" = "true" ] || \
             [ "${{ steps.ui_fix.outputs.changed }}" = "true" ]; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "monitor=$monitor" >> "$GITHUB_OUTPUT"

      - name: Construire la version candidate complète
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp public/data/home_data.json \
            /tmp/home_before_full_sync.json

          # Le synchroniseur peut reconstruire personnages, Alters, stats,
          # costumes, tuning et Patch Notes.
          python mise_a_jour/outils/surveiller_ultrarumble.py \
            --site-root public \
            --wait-lock 300

          # L'accueil complet est régénéré après la synchronisation.
          python mise_a_jour/outils/update_home_data.py \
            --site-root public

          # V15 : ne jamais garder la sortie brute du vieux parseur bonus.
          python /tmp/repair_login_bonuses_v17.py \
            --site-root public


          # Préserve les enrichissements/corrections déjà validés sur
          # MHUR NEXUS sans écraser les nouvelles valeurs source.
          python /tmp/mhur_guardian.py \
            reconcile-home \
            --site-root public \
            --before /tmp/home_before_full_sync.json

          if [ -f /tmp/guardian_watch_candidate.json ]; then
            cp /tmp/guardian_watch_candidate.json \
              public/data/guardian_watch.json
          fi

          # Corrections validées manuellement auparavant.
          python /tmp/mhur_guardian.py apply-overrides

          # Roster manuel de la saison en cours, s'il existe.
          python /tmp/mhur_guardian.py \
            apply-saved-season \
            --site-root public

          # Branding MHUR NEXUS + anglais par défaut + saison dynamique.
          python /tmp/mhur_guardian.py \
            branding \
            --site-root public

          # Les dates de génération ne sont pas des changements produit.
          python /tmp/mhur_guardian.py \
            stabilize-metadata \
            --base HEAD

          # Réapplique V18 après tous les reconstructeurs.
          python /tmp/apply_guardian_v19_site_fixes.py \
            --site-root public

          node --check public/js/home.js
          node --check public/js/v608-patch-notes-final.js

          # Guardian V19 :
          # si le scraper remplace juste PNG -> WEBP ou change la résolution
          # sans changer le visuel, on garde l'asset déjà validé sur main.
          python - <<'PY'
          import io
          import json
          import subprocess
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          DATA = Path("public/data/ultrarumble/characters_exact.json")
          IMAGE_EXTS = {".png", ".webp", ".jpg", ".jpeg"}

          def git_bytes(path):
              result = subprocess.run(
                  ["git", "show", f"HEAD:{path}"],
                  capture_output=True,
              )
              return result.stdout if result.returncode == 0 else None

          def git_json(path):
              raw = git_bytes(path)
              if not raw:
                  return None
              return json.loads(raw.decode("utf-8"))

          def equivalent(old_bytes, new_path):
              try:
                  old = Image.open(io.BytesIO(old_bytes)).convert("RGBA")
                  new = Image.open(new_path).convert("RGBA")
              except Exception:
                  return False

              if not old.height or not new.height:
                  return False

              if abs((old.width / old.height) - (new.width / new.height)) > 0.015:
                  return False

              size = (128, 128)
              old = old.resize(size, Image.Resampling.LANCZOS)
              new = new.resize(size, Image.Resampling.LANCZOS)

              def composite(image, value):
                  bg = Image.new("RGBA", size, (value, value, value, 255))
                  bg.alpha_composite(image)
                  return bg.convert("RGB")

              for value in (0, 255):
                  diff = ImageChops.difference(
                      composite(old, value),
                      composite(new, value),
                  )
                  if max(ImageStat.Stat(diff).rms) > 4.0:
                      return False

              return True

          if not DATA.exists():
              raise SystemExit(0)

          old_data = git_json(str(DATA))
          new_data = json.loads(DATA.read_text(encoding="utf-8"))

          if not isinstance(old_data, list) or not isinstance(new_data, list):
              raise SystemExit(
                  "[GUARDIAN V19] characters_exact.json invalide."
              )

          old_by_url = {
              str(row.get("source_url") or ""): row
              for row in old_data
              if isinstance(row, dict) and row.get("source_url")
          }

          replacements = 0

          for row in new_data:
              if not isinstance(row, dict):
                  continue

              source_url = str(row.get("source_url") or "")
              previous = old_by_url.get(source_url)

              # Un nouveau perso ne doit jamais être masqué.
              if not previous:
                  continue

              old_assets = previous.get("assets")
              new_assets = row.get("assets")

              if not isinstance(old_assets, dict) or not isinstance(new_assets, dict):
                  continue

              for key in sorted(set(old_assets) & set(new_assets)):
                  old_rel = str(old_assets.get(key) or "")
                  new_rel = str(new_assets.get(key) or "")

                  if not old_rel or not new_rel or old_rel == new_rel:
                      continue

                  if (
                      Path(old_rel).suffix.lower() not in IMAGE_EXTS
                      or Path(new_rel).suffix.lower() not in IMAGE_EXTS
                  ):
                      continue

                  new_path = Path("public") / new_rel
                  if not new_path.exists():
                      continue

                  old_repo_path = "public/" + old_rel.lstrip("/")
                  old_bytes = git_bytes(old_repo_path)

                  if not old_bytes:
                      continue

                  if not equivalent(old_bytes, new_path):
                      # Vraie image différente => reste dans la bêta.
                      continue

                  new_assets[key] = old_rel

                  old_working = Path("public") / old_rel
                  if not old_working.exists():
                      old_working.parent.mkdir(parents=True, exist_ok=True)
                      old_working.write_bytes(old_bytes)

                  replacements += 1
                  print(
                      f"[GUARDIAN V19][ASSET] {source_url} {key}: "
                      f"{new_rel} -> {old_rel} (visuel identique)"
                  )

          if replacements:
              DATA.write_text(
                  json.dumps(
                      new_data,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

              # Supprimer uniquement les nouveaux fichiers devenus totalement
              # inutilisés et qui n'existaient pas déjà sur main.
              referenced = set()

              for row in new_data:
                  if not isinstance(row, dict):
                      continue
                  assets = row.get("assets")
                  if not isinstance(assets, dict):
                      continue
                  for value in assets.values():
                      if isinstance(value, str) and value:
                          referenced.add(value)

              status = subprocess.run(
                  ["git", "status", "--porcelain", "--", "public/assets"],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout.splitlines()

              for line in status:
                  if not line.startswith("?? "):
                      continue

                  path = Path(line[3:])
                  try:
                      rel = path.relative_to("public").as_posix()
                  except ValueError:
                      continue

                  if rel in referenced:
                      continue

                  if path.suffix.lower() not in IMAGE_EXTS:
                      continue

                  path.unlink(missing_ok=True)
                  print(f"[GUARDIAN V19][ASSET] fichier généré inutilisé supprimé : {path}")

          print(
              f"[GUARDIAN V19] {replacements} changement(s) "
              "de format/résolution neutralisé(s)."
          )
          PY

          rm -f \
            public/data/ultrarumble/synchronisation_ultrarumble.log \
            public/data/ultrarumble/synchronisation_en_cours.lock
          rm -rf public/sauvegardes

          if [ -f public/data/ultrarumble/derniere_synchronisation.json ]; then
            cp public/data/ultrarumble/derniere_synchronisation.json \
              /tmp/guardian_sync_state.json
            git restore --source=HEAD -- \
              public/data/ultrarumble/derniere_synchronisation.json \
              2>/dev/null || \
              rm -f public/data/ultrarumble/derniere_synchronisation.json
          fi

      - name: Valider Login Bonuses réparé dans la candidate complète
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(
              Path("public/data/home_data.json").read_text(encoding="utf-8")
          )
          bonuses = data.get("login_bonuses", [])

          if not isinstance(bonuses, list):
              raise SystemExit("login_bonuses n'est pas une liste")

          seen = set()

          for index, item in enumerate(bonuses, 1):
              title = str(
                  item.get("title_en")
                  or item.get("title_fr")
                  or item.get("title")
                  or ""
              ).strip()

              if not title or len(title) > 140:
                  raise SystemExit(
                      f"Login Bonus #{index}: titre invalide"
                  )

              if len(re.findall(r"\bBIRTHDAY\b", title.upper())) > 1:
                  raise SystemExit(
                      f"Cartes Login Bonus fusionnées: {title}"
                  )

              if len(re.findall(r"\bLOGIN\b", title.upper())) > 2:
                  raise SystemExit(
                      f"Cartes Login Bonus fusionnées: {title}"
                  )

              start = str(item.get("start") or "")
              end = str(item.get("end") or "")

              if not start or not end:
                  raise SystemExit(
                      f"Login Bonus #{index}: dates manquantes"
                  )

              key = (title.lower(), start, end)

              if key in seen:
                  raise SystemExit(
                      f"Login Bonus dupliqué: {title}"
                  )

              seen.add(key)

          print(
              f"[GUARDIAN V19] Login Bonuses valides : {len(bonuses)} carte(s)"
          )
          PY

      - name: Analyser chaque changement candidat
        id: beta_analysis
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          extra=()
          if [ -f /tmp/guardian_sync_state.json ]; then
            extra=(--sync-state /tmp/guardian_sync_state.json)
          fi

          python /tmp/mhur_guardian.py \
            analyze \
            --base HEAD \
            --mode full \
            "${extra[@]}" \
            --output /tmp/beta_report.json \
            --markdown /tmp/beta_report.md


      - name: Fermer une ancienne bêta devenue inutile
        if: >-
          steps.source.outputs.changed != 'true' ||
          steps.beta_analysis.outputs.requires_review != 'true'
        shell: bash
        run: |
          set -euo pipefail

          prs="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head mhur-auto-beta \
              --base main \
              --state open \
              --json number \
              --jq '.[].number'
          )"

          for pr in $prs; do
            gh pr close \
              --repo "$GITHUB_REPOSITORY" \
              "$pr" \
              --comment "🧹 Guardian V19 : cette ancienne bêta n'est plus pertinente." \
              || true
          done

          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/mhur-auto-beta" \
            >/dev/null 2>&1 || true

      - name: Tests structurels de la candidate
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.visible_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            smoke \
            --base HEAD \
            --site-root public

      - name: Test Chromium anti-casse
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.visible_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0

          # Le module Playwright est installé dans node_modules du dépôt.
          # Le script ne doit donc pas rester dans /tmp, sinon Node cherche
          # "playwright" autour de /tmp et renvoie ERR_MODULE_NOT_FOUND.
          browser_smoke="$GITHUB_WORKSPACE/.mhur-browser-smoke.mjs"
          cp /tmp/browser_smoke.mjs "$browser_smoke"

          npx playwright install chromium

          python -m http.server 4173 --directory public >/tmp/mhur-http.log 2>&1 &
          server_pid=$!

          cleanup_browser_test() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$browser_smoke"
          }
          trap cleanup_browser_test EXIT

          sleep 2

          SMOKE_URL="http://127.0.0.1:4173/"             node "$browser_smoke"

      - name: Mémoriser un changement interne sans spam supplémentaire
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.visible_changes != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/guardian_sync_state.json ]; then
            exit 0
          fi
          git reset --hard HEAD
          cp /tmp/guardian_sync_state.json \
            public/data/ultrarumble/derniere_synchronisation.json
          git add public/data/ultrarumble/derniere_synchronisation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: état de surveillance Nexus"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publier automatiquement si le scan complet contient un vrai changement visible sûr
        id: full_safe_publish
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.visible_changes == 'true' &&
          steps.beta_analysis.outputs.requires_review != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/guardian_sync_state.json ]; then
            cp /tmp/guardian_sync_state.json \
              public/data/ultrarumble/derniere_synchronisation.json
          fi
          git add -A -- public
          git commit -m "chore: mise à jour Nexus automatique sûre"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
          python /tmp/mhur_guardian.py \
            discord-notify \
            --text "✅ MHUR NEXUS Guardian V19 : contenu visible sûr réellement modifié et publié automatiquement." \
            --report /tmp/beta_report.json || true

      # -----------------------------------------------------------
      # Changements sensibles -> branche bêta + PR + Discord.
      # -----------------------------------------------------------
      - name: Créer le commit candidat sensible
        id: candidate
        if: >-
          steps.source.outputs.changed == 'true' &&
          steps.beta_analysis.outputs.requires_review == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b "guardian-candidate-${GITHUB_RUN_ID}"
          git add -A -- public
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "beta: MHUR NEXUS Guardian ${GITHUB_RUN_ID}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mémoriser la nouvelle empreinte source sur main
        if: steps.candidate.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if [ -f /tmp/guardian_sync_state.json ]; then
            cp /tmp/guardian_sync_state.json \
              public/data/ultrarumble/derniere_synchronisation.json
            git add public/data/ultrarumble/derniere_synchronisation.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: empreinte source Guardian"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Mettre à jour la branche bêta unique
        id: beta
        if: steps.candidate.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          old_tree=""
          if git ls-remote --exit-code --heads origin mhur-auto-beta >/dev/null 2>&1; then
            git fetch origin mhur-auto-beta:refs/remotes/origin/mhur-auto-beta
            old_tree="$(git rev-parse 'refs/remotes/origin/mhur-auto-beta^{tree}')"
          fi
          git checkout -B mhur-auto-beta origin/main
          git cherry-pick "${{ steps.candidate.outputs.sha }}"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$old_tree" ] && [ "$old_tree" = "$new_tree" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force-with-lease origin HEAD:mhur-auto-beta
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Déployer la vraie bêta Cloudflare Worker
        id: preview
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          preview=""

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || \
             [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Preview Worker impossible : ajoute CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID."
            echo "::error::Aucune PR bêta ne doit être créée sans version Cloudflare publiable ensuite."
            exit 1
          fi

          npm install --no-save --ignore-scripts wrangler@4

          # Upload d'une VERSION uniquement : aucune promotion en production.
          set +e
          version_tag="guardian-beta-${GITHUB_RUN_ID}"
          npx wrangler versions upload public \
            --name mhur-france \
            --preview-alias beta \
            --tag "$version_tag" \
            --message "MHUR NEXUS Guardian V19 beta ${GITHUB_SHA}" \
            2>&1 | tee /tmp/wrangler-worker-preview.log
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ]; then
            echo "::error::Échec de la création de la Preview Worker."
            exit "$code"
          fi

          preview="$(
            grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev/?' \
              /tmp/wrangler-worker-preview.log \
              | tail -n1 \
              | sed 's:/*$::' \
              || true
          )"

          if [ -z "$preview" ]; then
            echo "::error::Aucune Preview URL Worker trouvée."
            echo "::error::Vérifie Cloudflare > Settings > Domains & Routes > Preview URLs."
            exit 1
          fi

          echo "Preview Worker : $preview"
          echo "Version tag : $version_tag"
          echo "url=$preview" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Créer / mettre à jour la PR bêta
        id: pr
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head mhur-auto-beta --base main --state open --json number --jq '.[0].number // empty')"
          python /tmp/mhur_guardian.py \
            make-pr-body \
            --markdown /tmp/beta_report.md \
            --message-id "" \
            --preview-url "${{ steps.preview.outputs.url }}" \
            --worker-version-tag "${{ steps.preview.outputs.version_tag }}" \
            --head-sha "${{ steps.beta.outputs.head_sha }}" \
            --output /tmp/pr_body_pre.md
          if [ -z "$existing" ]; then
            url="$(gh pr create --base main --head mhur-auto-beta --title '🧪 MHUR NEXUS — Guardian V19 — validation requise' --body-file /tmp/pr_body_pre.md)"
            number="$(gh pr view "$url" --json number --jq '.number')"
          else
            number="$existing"
            gh pr edit "$number" --title "🧪 MHUR NEXUS — Guardian V19 — validation requise" --body-file /tmp/pr_body_pre.md
            url="$(gh pr view "$number" --json url --jq '.url')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Envoyer la bêta sur Discord
        id: discord
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            discord-send \
            --report /tmp/beta_report.json \
            --pr-url "${{ steps.pr.outputs.url }}" \
            --preview-url "${{ steps.preview.outputs.url }}"

      - name: Lier Discord à la PR
        if: steps.beta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            make-pr-body \
            --markdown /tmp/beta_report.md \
            --message-id "${{ steps.discord.outputs.message_id }}" \
            --preview-url "${{ steps.preview.outputs.url }}" \
            --worker-version-tag "${{ steps.preview.outputs.version_tag }}" \
            --head-sha "${{ steps.beta.outputs.head_sha }}" \
            --output /tmp/pr_body_final.md
          gh pr edit "${{ steps.pr.outputs.number }}" --body-file /tmp/pr_body_final.md

      - name: Notification horaire aucun changement
        if: >-
          always() &&
          success() &&
          steps.safe_analysis.outputs.visible_changes != 'true' &&
          (
            steps.source.outputs.changed != 'true' ||
            steps.beta_analysis.outputs.visible_changes != 'true'
          )
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            discord-notify \
            --text "✅ MHUR NEXUS Guardian V19 : vérification terminée — aucun changement visible détecté (les changements de source seuls sont ignorés)."

      - name: Diagnostic automatique Discord si le scan échoue
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          failed_steps="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | unique | join(", ")' 2>/dev/null)"
          [ -n "$failed_steps" ] || failed_steps="Étape inconnue — ouvre le lien du run"

          missing=""
          [ -n "${DISCORD_BOT_TOKEN:-}" ] || missing="${missing} DISCORD_BOT_TOKEN"
          [ -n "${DISCORD_CHANNEL_ID:-}" ] || missing="${missing} DISCORD_CHANNEL_ID"
          [ -n "${DISCORD_APPROVER_USER_ID:-}" ] || missing="${missing} DISCORD_APPROVER_USER_ID"
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="${missing} CLOUDFLARE_ACCOUNT_ID"

          hint="Le scan a rencontré une erreur technique."
          case "$failed_steps" in
            *"Vérifier si une bêta complète est nécessaire"*) hint="Le moniteur UltraRumble a renvoyé une erreur : source inaccessible, parseur cassé ou données inattendues." ;;
            *"Construire la version candidate complète"*) hint="La synchronisation UltraRumble n'a pas pu construire les nouvelles données." ;;
            *"Tester la version candidate complète"*) hint="Les tests de sécurité ont détecté un problème dans la bêta ; rien n'a été publié." ;;
            *"Déployer la vraie bêta Cloudflare Worker"*) hint="Cloudflare n'a pas pu créer la preview : token, compte, Worker ou Preview URLs." ;;
            *"Créer / mettre à jour la PR bêta"*) hint="GitHub n'a pas pu créer/mettre à jour la PR bêta : permissions ou état de branche." ;;
            *"Envoyer la bêta sur Discord"*|*"Lier Discord à la PR"*) hint="Discord ou la liaison PR a échoué : bot, salon, permissions ou secret incorrect." ;;
          esac

          message="❌ MHUR NEXUS Guardian V19 — SCAN BLOQUÉ\nÉtape(s) en échec : ${failed_steps}\nDiagnostic : ${hint}"
          [ -z "$missing" ] || message="${message}\nSecrets absents :${missing}"
          message="${message}\nDétails GitHub : ${run_url}\nAucune mise en production sensible n'a été faite par ce run."

          if [ -n "${DISCORD_BOT_TOKEN:-}" ] && [ -n "${DISCORD_CHANNEL_ID:-}" ]; then
            payload="$(python -c 'import json,sys; print(json.dumps({"content":sys.argv[1][:1990],"allowed_mentions":{"parse":[]}}, ensure_ascii=False))' "$message")"
            curl -fsS -X POST -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" -H "Content-Type: application/json" -d "$payload" "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" >/dev/null || true
          else
            printf '%b\n' "$message"
          fi

  approval:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'approval')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_APPROVER_USER_ID: ${{ secrets.DISCORD_APPROVER_USER_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Vérifier qu'aucun ancien updater n'est actif
        shell: bash
        run: |
          set -euo pipefail

          current_path="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          current_path="${current_path%@*}"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --paginate \
            --jq '.workflows[] | [.id,.path,.state] | @tsv' \
            > /tmp/workflows-v8.tsv

          while IFS=$'\t' read -r id path state; do
            if [ "$path" = "$current_path" ]; then
              continue
            fi

            case "$path" in
              .github/workflows/mhur-mise-a-jour-guardian-officielle*.yml|\
              .github/workflows/mhur-v*auto*.yml|\
              .github/workflows/mhur-sync*.yml|\
              .github/workflows/*ultrarumble*auto*.yml|\
              .github/workflows/mhur-guardian-hourly.yml|\
              .github/workflows/mhur-guardian-approval.yml)
                if [ "$state" = "active" ]; then
                  echo "Ancien updater encore actif, désactivation : $path"
                  gh api \
                    --method PUT \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
                fi
                ;;
            esac
          done < /tmp/workflows-v8.tsv

          echo "[OK] Updater unique V8 vérifié."

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer le moteur indépendant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          Path('/tmp/mhur_guardian.py').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
          Path('/tmp/browser_smoke.mjs').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
          PY
          python -m py_compile /tmp/mhur_guardian.py
          node --check /tmp/browser_smoke.mjs

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f mise_a_jour/requirements.txt ]; then
            python -m pip install -r mise_a_jour/requirements.txt
          fi
          python -m pip install requests beautifulsoup4 lxml pillow

      - name: Configurer Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Trouver la bêta en attente
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh pr list --head mhur-auto-beta --base main --state open --limit 1 --json number,url,body,headRefOid)"
          number="$(printf '%s' "$json" | jq -r '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$json" | jq -r '.[0].body' > /tmp/pr_body.md
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$(printf '%s' "$json" | jq -r '.[0].url')" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(printf '%s' "$json" | jq -r '.[0].headRefOid')" >> "$GITHUB_OUTPUT"

      - name: Lire l'état Discord de la PR
        id: state
        if: steps.pr.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py extract-state --body /tmp/pr_body.md

      - name: Lire V / FIX / SLOT / refus sur Discord
        id: discord
        if: >-
          steps.pr.outputs.exists == 'true' &&
          steps.state.outputs.message_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            discord-check \
            --message-id "${{ steps.state.outputs.message_id }}"

      - name: Confirmer que la validation Discord est reçue
        if: steps.discord.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py discord-notify \
            --text "✅ Validation reçue. Je relance les tests puis je publie cette bêta sur main et Cloudflare. Si quelque chose bloque, je t'envoie le nom exact de l'étape et le diagnostic."

      - name: Enregistrer un refus texte ou ❌
        if: steps.discord.outputs.decision == 'reject'
        shell: bash
        run: |
          set -euo pipefail
          feedback="$(printf '%s' '${{ steps.discord.outputs.feedback }}' | base64 --decode || true)"
          if [ -z "$feedback" ]; then feedback="Refus Discord ❌"; fi
          gh pr comment "${{ steps.pr.outputs.number }}" --body "❌ **Bêta bloquée depuis Discord**"$'\n\n'"$feedback"

      # -----------------------------------------------------------
      # Nouvelle saison : 3 SLOT depuis Discord.
      # -----------------------------------------------------------
      - name: Appliquer le roster de nouvelle saison
        id: season_apply
        if: steps.discord.outputs.decision == 'season'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main mhur-auto-beta
          git checkout -B mhur-auto-beta origin/mhur-auto-beta
          python /tmp/mhur_guardian.py \
            apply-season \
            --site-root public \
            --payload-b64 "${{ steps.discord.outputs.season_payload }}"
          python /tmp/mhur_guardian.py branding --site-root public
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Corriger une valeur FIX # depuis Discord
        id: fix_apply
        if: steps.discord.outputs.decision == 'fix'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main mhur-auto-beta
          git checkout -B mhur-auto-beta origin/mhur-auto-beta
          python /tmp/mhur_guardian.py \
            analyze \
            --base origin/main \
            --mode full \
            --output /tmp/current_report.json \
            --markdown /tmp/current_report.md
          python /tmp/mhur_guardian.py \
            apply-fix \
            --report /tmp/current_report.json \
            --index "${{ steps.discord.outputs.fix_index }}" \
            --value-b64 "${{ steps.discord.outputs.fix_value }}"
          python /tmp/mhur_guardian.py branding --site-root public
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tester la bêta corrigée / saison configurée
        if: >-
          steps.season_apply.outputs.changed == 'true' ||
          steps.fix_apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py smoke --base origin/main --site-root public
          npm install --no-save --ignore-scripts playwright@1.55.0

          # Le module Playwright est installé dans node_modules du dépôt.
          # Le script ne doit donc pas rester dans /tmp, sinon Node cherche
          # "playwright" autour de /tmp et renvoie ERR_MODULE_NOT_FOUND.
          browser_smoke="$GITHUB_WORKSPACE/.mhur-browser-smoke.mjs"
          cp /tmp/browser_smoke.mjs "$browser_smoke"

          npx playwright install chromium

          python -m http.server 4173 --directory public >/tmp/mhur-http.log 2>&1 &
          server_pid=$!

          cleanup_browser_test() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$browser_smoke"
          }
          trap cleanup_browser_test EXIT

          sleep 2

          SMOKE_URL="http://127.0.0.1:4173/"             node "$browser_smoke"

      - name: Recréer le rapport après correction
        id: corrected
        if: >-
          steps.season_apply.outputs.changed == 'true' ||
          steps.fix_apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            analyze \
            --base origin/main \
            --mode full \
            --output /tmp/corrected_report.json \
            --markdown /tmp/corrected_report.md

          git add -A -- public
          git commit -m "beta: correction Discord MHUR NEXUS"
          git push --force-with-lease origin HEAD:mhur-auto-beta
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Redéployer la vraie bêta Worker corrigée
        id: corrected_preview
        if: steps.corrected.outputs.head_sha != ''
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || \
             [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Secrets Cloudflare absents."
            exit 1
          fi

          npm install --no-save --ignore-scripts wrangler@4

          set +e
          version_tag="guardian-fix-${GITHUB_RUN_ID}"
          npx wrangler versions upload public \
            --name mhur-france \
            --preview-alias beta \
            --tag "$version_tag" \
            --message "MHUR NEXUS Guardian V19 beta corrigée ${GITHUB_SHA}" \
            2>&1 | tee /tmp/wrangler-worker-preview-corrected.log
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ]; then
            echo "::error::Échec du redéploiement de la Preview Worker corrigée."
            exit "$code"
          fi

          preview="$(
            grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev/?' \
              /tmp/wrangler-worker-preview-corrected.log \
              | tail -n1 \
              | sed 's:/*$::' \
              || true
          )"

          if [ -z "$preview" ]; then
            echo "::error::Aucune Preview URL Worker trouvée après correction."
            exit 1
          fi

          echo "Preview Worker corrigée : $preview"
          echo "Version tag corrigée : $version_tag"
          echo "url=$preview" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Envoyer la NOUVELLE bêta après correction
        id: corrected_discord
        if: steps.corrected.outputs.head_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            discord-send \
            --report /tmp/corrected_report.json \
            --pr-url "${{ steps.pr.outputs.url }}" \
            --preview-url "${{ steps.corrected_preview.outputs.url }}"

      - name: Mettre à jour la PR corrigée
        if: steps.corrected.outputs.head_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            make-pr-body \
            --markdown /tmp/corrected_report.md \
            --message-id "${{ steps.corrected_discord.outputs.message_id }}" \
            --preview-url "${{ steps.corrected_preview.outputs.url }}" \
            --worker-version-tag "${{ steps.corrected_preview.outputs.version_tag }}" \
            --head-sha "${{ steps.corrected.outputs.head_sha }}" \
            --output /tmp/pr_body_corrected.md
          gh pr edit "${{ steps.pr.outputs.number }}" --body-file /tmp/pr_body_corrected.md

      # -----------------------------------------------------------
      # Validation V / ✅ : tests à nouveau, puis production.
      # -----------------------------------------------------------
      - name: Vérifier que V correspond à la dernière bêta
        if: steps.discord.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.state.outputs.head_sha }}" != "${{ steps.pr.outputs.head_sha }}" ]; then
            python /tmp/mhur_guardian.py discord-notify \
              --text "⚠️ Validation ignorée : la bêta a changé. Valide le dernier message Discord."
            exit 1
          fi

      - name: Récupérer la bêta validée
        if: steps.discord.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main mhur-auto-beta
          git checkout -B mhur-auto-beta origin/mhur-auto-beta
          python /tmp/mhur_guardian.py \
            analyze \
            --base origin/main \
            --mode full \
            --output /tmp/approval_report.json \
            --markdown /tmp/approval_report.md

      - name: Vérifier la configuration de la nouvelle saison
        id: season_ready
        if: steps.discord.outputs.decision == 'approve'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py \
            validate-season \
            --site-root public \
            --report /tmp/approval_report.json

      - name: Interdire V tant que la nouvelle saison n'est pas configurée
        if: >-
          steps.discord.outputs.decision == 'approve' &&
          steps.season_ready.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py discord-notify \
            --text "🌟 Nouvelle saison : envoie d'abord SLOT 1 / SLOT 2 / SLOT 3 sur le message bêta avant de faire V."
          exit 1

      - name: Derniers tests avant production
        if: >-
          steps.discord.outputs.decision == 'approve' &&
          steps.season_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py branding --site-root public
          python /tmp/mhur_guardian.py smoke --base origin/main --site-root public
          npm install --no-save --ignore-scripts playwright@1.55.0

          # Le module Playwright est installé dans node_modules du dépôt.
          # Le script ne doit donc pas rester dans /tmp, sinon Node cherche
          # "playwright" autour de /tmp et renvoie ERR_MODULE_NOT_FOUND.
          browser_smoke="$GITHUB_WORKSPACE/.mhur-browser-smoke.mjs"
          cp /tmp/browser_smoke.mjs "$browser_smoke"

          npx playwright install chromium

          python -m http.server 4173 --directory public >/tmp/mhur-http.log 2>&1 &
          server_pid=$!

          cleanup_browser_test() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$browser_smoke"
          }
          trap cleanup_browser_test EXIT

          sleep 2

          SMOKE_URL="http://127.0.0.1:4173/"             node "$browser_smoke"

      - name: Fusionner la version validée sur main
        id: merge_prod
        if: >-
          steps.discord.outputs.decision == 'approve' &&
          steps.season_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- public
          if ! git diff --cached --quiet; then
            git commit -m "fix: préserver MHUR NEXUS avant production"
            git push --force-with-lease origin HEAD:mhur-auto-beta
          fi

          gh pr merge "${{ steps.pr.outputs.number }}" \
            --squash \
            --delete-branch \
            --subject "✅ MHUR NEXUS — version validée"

          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "[PROD] main mis à jour : $main_sha"

      - name: Promouvoir exactement la bêta validée sur Cloudflare
        id: cloudflare_prod
        if: >-
          steps.discord.outputs.decision == 'approve' &&
          steps.season_ready.outputs.ready == 'true' &&
          steps.merge_prod.outputs.main_sha != ''
        shell: bash
        run: |
          set -euo pipefail

          version_tag="${{ steps.state.outputs.worker_version_tag }}"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Secrets Cloudflare absents : CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

          npm install --no-save --ignore-scripts wrangler@4

          # Compatibilité avec une PR bêta créée AVANT cette V19 corrigée (ex. PR #5) :
          # l'ancien état Guardian ne stockait pas worker_version_tag. Dans ce cas on
          # transforme exactement les fichiers déjà testés/validés de la branche locale
          # en une version Cloudflare taguée, puis on promeut cette version.
          if [ -z "$version_tag" ]; then
            version_tag="guardian-approved-${GITHUB_RUN_ID}"
            echo "[PROD] Ancienne bêta sans tag Cloudflare : création de $version_tag avant promotion."
            npx wrangler versions upload public \
              --name mhur-france \
              --tag "$version_tag" \
              --message "MHUR NEXUS Guardian V19 — bêta existante validée ${GITHUB_RUN_ID}" \
              2>&1 | tee /tmp/wrangler-approved-upload.log
          fi

          npx wrangler versions deploy \
            --name mhur-france \
            --version-tag "$version_tag" \
            --message "MHUR NEXUS Guardian V19 validée ${GITHUB_RUN_ID}" \
            -y \
            2>&1 | tee /tmp/wrangler-production.log

          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "[PROD] Version Cloudflare $version_tag déployée à 100 %."

      - name: Confirmer la mise en production
        if: steps.cloudflare_prod.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mhur_guardian.py discord-notify \
            --text "✅ MHUR NEXUS : validation reconnue, main fusionné et la version Cloudflare exacte de la bêta est maintenant en production."

      - name: Diagnostic automatique Discord si la validation échoue
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          failed_steps="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | unique | join(", ")' 2>/dev/null)"
          [ -n "$failed_steps" ] || failed_steps="Étape inconnue — ouvre le lien du run"
          pr_info="$(gh pr list --head mhur-auto-beta --base main --state open --limit 1 --json number,url,mergeStateStatus --jq 'if length==0 then "aucune PR bêta ouverte" else "PR #\(.[0].number) — merge=\(.[0].mergeStateStatus) — \(.[0].url)" end' 2>/dev/null)"
          [ -n "$pr_info" ] || pr_info="état PR indisponible"

          missing=""
          [ -n "${DISCORD_BOT_TOKEN:-}" ] || missing="${missing} DISCORD_BOT_TOKEN"
          [ -n "${DISCORD_CHANNEL_ID:-}" ] || missing="${missing} DISCORD_CHANNEL_ID"
          [ -n "${DISCORD_APPROVER_USER_ID:-}" ] || missing="${missing} DISCORD_APPROVER_USER_ID"
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="${missing} CLOUDFLARE_ACCOUNT_ID"

          hint="La validation a été interrompue par une erreur technique."
          case "$failed_steps" in
            *"Lire l'état Discord de la PR"*) hint="La PR bêta a perdu son état Guardian. Recrée une bêta avec cette V19 corrigée." ;;
            *"Lire V / FIX / SLOT / refus sur Discord"*) hint="Impossible de lire Discord : bot, salon, permissions, API Discord ou secret approver." ;;
            *"Vérifier que V correspond à la dernière bêta"*) hint="Le V reçu correspond à une ancienne bêta. Le bot refuse de publier une version qui a changé." ;;
            *"Vérifier la configuration de la nouvelle saison"*|*"Interdire V tant que la nouvelle saison n'est pas configurée"*) hint="Nouvelle saison détectée mais SLOT requis non configurés." ;;
            *"Derniers tests avant production"*) hint="Les tests finaux ont échoué. Rien de cette validation n'a été fusionné sur main." ;;
            *"Fusionner la version validée sur main"*) hint="GitHub a refusé la fusion : conflit, branche modifiée, protection ou permission du token." ;;
            *"Promouvoir exactement la bêta validée sur Cloudflare"*) hint="main est fusionné mais Cloudflare n'a pas pu promouvoir la version validée : token, compte, tag ou Worker." ;;
          esac

          message="❌ MHUR NEXUS Guardian V19 — VALIDATION BLOQUÉE\nÉtape(s) en échec : ${failed_steps}\nDiagnostic : ${hint}\nÉtat GitHub : ${pr_info}"
          [ -z "$missing" ] || message="${message}\nSecrets absents :${missing}"
          message="${message}\nDétails du run : ${run_url}"

          if [ -n "${DISCORD_BOT_TOKEN:-}" ] && [ -n "${DISCORD_CHANNEL_ID:-}" ]; then
            payload="$(python -c 'import json,sys; print(json.dumps({"content":sys.argv[1][:1990],"allowed_mentions":{"parse":[]}}, ensure_ascii=False))' "$message")"
            curl -fsS -X POST -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" -H "Content-Type: application/json" -d "$payload" "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" >/dev/null || true
          else
            printf '%b\n' "$message"
          fi

