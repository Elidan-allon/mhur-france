name: MHUR V644 - Alters et styles centrés

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mhur-v644-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-v644-alters-styles
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Corriger les Alters et centrer les styles
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cat > /tmp/appliquer_v644.py <<'PY'
          from pathlib import Path
          import base64
          import re
          
          CSS=base64.b64decode("").decode("utf-8")
          JS=base64.b64decode("").decode("utf-8")
          
          root=Path(".")
          public=root/"public"
          
          index_path=public/"index.html"
          css_path=public/"css"/"v644-alter-style-center.css"
          js_path=public/"js"/"v644-alter-style-center.js"
          report_path=root/"RAPPORT_V644_ALTERS_STYLES.txt"
          
          if not index_path.is_file():
              raise SystemExit(
                  "[ERREUR] public/index.html introuvable."
              )
          
          css_path.parent.mkdir(parents=True,exist_ok=True)
          js_path.parent.mkdir(parents=True,exist_ok=True)
          
          css_path.write_text(CSS+"\n",encoding="utf-8")
          js_path.write_text(JS+"\n",encoding="utf-8")
          
          html=index_path.read_text(encoding="utf-8")
          
          # Renforce le tri initial produit directement par la fonction tables().
          # Le JavaScript V644 fera ensuite une seconde vérification après chaque rendu.
          table_pattern=re.compile(
              r"(function\s+tables\s*\(ts\)\s*\{"
              r".*?const\s+normalized\s*=.*?;\s*)"
              r"(?:/\*\s*MHUR_V644_LEVEL_PRIORITY\s*\*/\s*)?"
              r"const\s+priority\s*=.*?;",
              flags=re.S
          )
          
          priority_code=(
              r"\1/* MHUR_V644_LEVEL_PRIORITY */\n"
              r"    const priority=/(?:effets?\\s*(?:de\\s*)?"
              r"(?:montee|niveau)|(?:montee|progression)\\s+"
              r"(?:de\\s+)?l?\\s*alter|level\\s*[- ]?\\s*up"
              r"\\s+effects?|levelup\\s+effects?|upgrade\\s+effects?)/"
              r".test(normalized)?0:1;"
          )
          
          html,count=table_pattern.subn(
              priority_code,
              html,
              count=1
          )
          
          if count!=1:
              raise SystemExit(
                  "[ERREUR] Fonction tables() introuvable ou impossible à renforcer."
              )
          
          # Retire uniquement les anciennes références V644 pour éviter les doublons.
          patterns=[
              r'\s*<!-- V644 : styles centrés sur ordinateur\. -->\s*'
              r'<link[^>]+v644-alter-style-center\.css[^>]*>\s*',
              r'\s*<link[^>]+v644-alter-style-center\.css[^>]*>\s*',
              r'\s*<!-- V644 : ordre des effets de montée\. -->\s*'
              r'<script[^>]+v644-alter-style-center\.js[^>]*>'
              r'\s*</script>\s*',
              r'\s*<script[^>]+v644-alter-style-center\.js[^>]*>'
              r'\s*</script>\s*',
          ]
          
          for pattern in patterns:
              html=re.sub(
                  pattern,
                  "\n",
                  html,
                  flags=re.I
              )
          
          heads=list(re.finditer(r'</head\s*>',html,flags=re.I))
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          
          if not heads or not bodies:
              raise SystemExit(
                  "[ERREUR] Structure HTML incomplète."
              )
          
          head_position=heads[-1].start()
          css_tag=(
              '\n<!-- V644 : styles centrés sur ordinateur. -->\n'
              '<link rel="stylesheet" '
              'href="css/v644-alter-style-center.css?v=644">\n'
          )
          
          html=html[:head_position]+css_tag+html[head_position:]
          
          bodies=list(re.finditer(r'</body\s*>',html,flags=re.I))
          body_position=bodies[-1].start()
          js_tag=(
              '\n<!-- V644 : ordre des effets de montée. -->\n'
              '<script src="js/v644-alter-style-center.js?v=644">'
              '</script>\n'
          )
          
          html=html[:body_position]+js_tag+html[body_position:]
          index_path.write_text(html,encoding="utf-8")
          
          report_path.write_text(
              """MHUR NEXUS — V644
          
          ALTERS
          - Les tableaux Effets de montée sont triés en premier dès la génération.
          - Une vérification après chaque rendu empêche une ancienne couche de les
            replacer plus bas.
          - Fonctionne en français et en anglais.
          - Reconnaît aussi Effet de niveau, Level Up Effects et Upgrade Effects.
          - Le bouton et son tableau restent ensemble.
          - Aucun tableau n'est supprimé ou ouvert automatiquement.
          
          CHOIX DES STYLES SUR ORDINATEUR
          - La rangée des styles est centrée horizontalement.
          - Les cartes conservent exactement leurs dimensions actuelles.
          - Aucun changement sur mobile.
          - Aucun changement des images, badges, rôles ou boutons.
          """,
              encoding="utf-8"
          )
          
          print("[OK] V644 appliqué.")
          PY
          
          cat > /tmp/verifier_v644.py <<'PY'
          
          from pathlib import Path
          
          index=Path("public/index.html").read_text(encoding="utf-8")
          css=Path(
              "public/css/v644-alter-style-center.css"
          ).read_text(encoding="utf-8")
          js=Path(
              "public/js/v644-alter-style-center.js"
          ).read_text(encoding="utf-8")
          
          if index.count(
              "css/v644-alter-style-center.css?v=644"
          )!=1:
              raise SystemExit(
                  "[ERREUR] CSS V644 absent ou dupliqué."
              )
          
          if index.count(
              "js/v644-alter-style-center.js?v=644"
          )!=1:
              raise SystemExit(
                  "[ERREUR] JS V644 absent ou dupliqué."
              )
          
          if index.count("MHUR_V644_LEVEL_PRIORITY")!=1:
              raise SystemExit(
                  "[ERREUR] Tri initial V644 absent ou dupliqué."
              )
          
          for token in [
              "@media (min-width:761px)",
              ".styleGrid",
              "justify-content:center!important",
          ]:
              if token not in css:
                  raise SystemExit(
                      f"[ERREUR] CSS V644 incomplet : {token}"
                  )
          
          # Vérifie qu'aucune taille de carte n'a été imposée par V644.
          for forbidden in [
              ".styleCard{",
              "width:360px",
              "height:",
              "transform:",
          ]:
              if forbidden in css:
                  raise SystemExit(
                      f"[ERREUR] V644 modifie la taille ou la forme : {forbidden}"
                  )
          
          for token in [
              "isLevelUpLabel",
              "sortContainer",
              "MutationObserver",
              "container.prepend",
              "MHUR_V644_ALTER_ORDER",
          ]:
              if token not in js:
                  raise SystemExit(
                      f"[ERREUR] JS V644 incomplet : {token}"
                  )
          
          print("[OK] Vérification V644 réussie.")
          
          PY
          
          for tentative in 1 2 3 4 5; do
            echo "===== Tentative ${tentative}/5 ====="
          
            git fetch origin main
            git reset --hard origin/main
          
            python3 /tmp/appliquer_v644.py
            node --check public/js/v644-alter-style-center.js
            python3 /tmp/verifier_v644.py
          
            git add     public/index.html     public/css/v644-alter-style-center.css     public/js/v644-alter-style-center.js     RAPPORT_V644_ALTERS_STYLES.txt
          
            if git diff --cached --quiet; then
              echo "[INFO] V644 est déjà appliqué."
              exit 0
            fi
          
            git commit -m "fix: effets de montée et styles centrés V644"
          
            if git push origin HEAD:main; then
              echo "[OK] V644 envoyé sur main."
              exit 0
            fi
          
            echo "[ATTENTE] main a changé, nouvelle tentative."
            sleep $((tentative * 3))
          done
          
          echo "[ERREUR] Impossible d'envoyer V644."
          exit 1
